<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 290" role="img" aria-label="5つの必修イディオムが何を本題の外へ出すかを整理した図。中央に「そのコードが本当にやりたいこと」があり、その周囲から、前提条件をGuard Clauseが、依存の準備をDependency Injectionが、設定の羅列をBuilderが、横断的な処理をMiddleware Chainが、nullチェックをOptional Chainingが、それぞれ外向きの矢印で外へ追い出している。結果として中央に残るのは本題だけになる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="340" y="24" text-anchor="middle" font-size="11.5" class="muted">どれも「本題でない記述を、本題の外へ出す」ための道具</text>

        <rect x="235" y="112" width="210" height="66" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.9" />
        <text x="340" y="140" text-anchor="middle" font-size="12" font-weight="600">本当にやりたいこと</text>
        <text x="340" y="160" text-anchor="middle" font-size="9.5" class="muted">これだけが中央に残る</text>

        <rect x="30" y="44" width="180" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="120" y="63" text-anchor="middle" font-size="10.5">前提条件</text>
        <text x="120" y="79" text-anchor="middle" font-size="9.5" class="muted">Guard Clause</text>
        <line x1="231" y1="122" x2="206" y2="94" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="30" y="122" width="180" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="120" y="141" text-anchor="middle" font-size="10.5">依存の準備</text>
        <text x="120" y="157" text-anchor="middle" font-size="9.5" class="muted">Dependency Injection</text>
        <line x1="231" y1="144" x2="216" y2="144" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="30" y="200" width="180" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="120" y="219" text-anchor="middle" font-size="10.5">設定の羅列</text>
        <text x="120" y="235" text-anchor="middle" font-size="9.5" class="muted">Builder</text>
        <line x1="231" y1="166" x2="206" y2="196" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="470" y="82" width="180" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="560" y="101" text-anchor="middle" font-size="10.5">横断的な処理</text>
        <text x="560" y="117" text-anchor="middle" font-size="9.5" class="muted">Middleware Chain</text>
        <line x1="449" y1="130" x2="466" y2="112" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="470" y="160" width="180" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="560" y="179" text-anchor="middle" font-size="10.5">nullチェック</text>
        <text x="560" y="195" text-anchor="middle" font-size="9.5" class="muted">Optional Chaining</text>
        <line x1="449" y1="160" x2="466" y2="176" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <text x="340" y="270" text-anchor="middle" font-size="11" class="muted">
          外へ出した結果として残るものが、そのコードの主題になる
        </text>
      </svg>
    </div>
  </body>
</html>
