<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 290" role="img" aria-label="モジュラーモノリスの構造図。外枠は単一プロセス・単一デプロイ単位を表し、その内部に注文モジュール・在庫モジュール・請求モジュールが並ぶ。各モジュールは内部実装を隠し、公開インターフェースだけを外に見せる。モジュール間のやり取りは同一プロセス内の関数呼び出しで行われ、ネットワークを介さない。境界を守るのはコンパイラではなく開発者の規律であることが注記されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">外から見れば1つのアプリ。内側だけが疎結合になっている</text>

        <rect x="30" y="42" width="600" height="160" rx="12" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="50" y="66" font-size="11" class="muted">単一プロセス・単一デプロイ単位</text>

        <rect x="52" y="80" width="170" height="104" rx="9" fill="var(--bg)" stroke="var(--border)" stroke-width="1.4" />
        <text x="137" y="102" text-anchor="middle" font-size="11" font-weight="600">注文モジュール</text>
        <rect x="68" y="112" width="138" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="137" y="132" text-anchor="middle" font-size="9.5" class="muted">内部実装(非公開)</text>
        <rect x="68" y="148" width="138" height="26" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="137" y="166" text-anchor="middle" font-size="9.5">公開インターフェース</text>

        <rect x="245" y="80" width="170" height="104" rx="9" fill="var(--bg)" stroke="var(--border)" stroke-width="1.4" />
        <text x="330" y="102" text-anchor="middle" font-size="11" font-weight="600">在庫モジュール</text>
        <rect x="261" y="112" width="138" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="330" y="132" text-anchor="middle" font-size="9.5" class="muted">内部実装(非公開)</text>
        <rect x="261" y="148" width="138" height="26" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="330" y="166" text-anchor="middle" font-size="9.5">公開インターフェース</text>

        <rect x="438" y="80" width="170" height="104" rx="9" fill="var(--bg)" stroke="var(--border)" stroke-width="1.4" />
        <text x="523" y="102" text-anchor="middle" font-size="11" font-weight="600">請求モジュール</text>
        <rect x="454" y="112" width="138" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="523" y="132" text-anchor="middle" font-size="9.5" class="muted">内部実装(非公開)</text>
        <rect x="454" y="148" width="138" height="26" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="523" y="166" text-anchor="middle" font-size="9.5">公開インターフェース</text>

        <line x1="210" y1="161" x2="257" y2="161" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="403" y1="161" x2="450" y2="161" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <text x="330" y="230" text-anchor="middle" font-size="11" class="muted">モジュール間は同一プロセス内の関数呼び出し。ネットワークの遅延も障害もない</text>
        <text x="330" y="258" text-anchor="middle" font-size="11" class="muted">ただし境界を守るのは開発者の規律。放置すると元の密結合なモノリスに戻る</text>
      </svg>
    </div>
  </body>
</html>
