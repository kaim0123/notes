<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --warn: oklch(0.82 0.16 75);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .warn { fill: var(--warn); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="JSONを返すときと受け取るときが対称でないことを示した図。上段は返す側で、手元のオブジェクトから文字列への変換と、形式の宣言までを1つの呼び出しがまとめて引き受け、そのまま回線へ送り出す。書くのは一行で済む。下段は受け取る側で、回線から届くのは生のバイト列であり、これはそのままではオブジェクトではない。バイト列を集めて文字列にし、それを解釈してオブジェクトに戻す、という段を通して初めてreqの本文に入る。この段を登録していなければ、本文は空のままになる。図の下部には、返す側は変換が最後の一手で済むのに対し、受け取る側は変換が最初の一手として要る、という非対称の理由が記されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11" class="lbl">返すとき ― 1つの呼び出しで完結する</text>

        <rect x="16" y="38" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="63" font-size="10" class="muted">手元のオブジェクト</text>
        <line x1="136" y1="58" x2="166" y2="58" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="170" y="38" width="230" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="184" y="58" font-size="10" class="mono lbl">res.json(obj)</text>
        <text x="184" y="72" font-size="8.5" class="muted">文字列への変換と、形式の宣言をまとめて行う</text>
        <line x1="400" y1="58" x2="430" y2="58" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="434" y="38" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="466" y="63" font-size="10" class="muted">回線へ</text>

        <line x1="16" y1="106" x2="624" y2="106" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="132" font-size="11" class="lbl">受け取るとき ― 段をひとつ挟まないと、届かない</text>

        <rect x="16" y="146" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="42" y="166" font-size="10" class="muted">回線から</text>
        <text x="30" y="180" font-size="8.5" class="muted">生のバイト列</text>
        <line x1="136" y1="166" x2="166" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="170" y="146" width="230" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="184" y="166" font-size="10" class="mono lbl">app.use(express.json())</text>
        <text x="184" y="180" font-size="8.5" class="muted">集めて、文字列にして、解釈してオブジェクトに戻す</text>
        <line x1="400" y1="166" x2="430" y2="166" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="434" y="146" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="452" y="171" font-size="10" class="mono">req.body</text>

        <path d="M285,186 v34 h149" fill="none" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)" />
        <text x="180" y="226" font-size="9.5" class="warn">この段が無いと</text>
        <rect x="434" y="206" width="120" height="30" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="1.4" />
        <text x="452" y="226" font-size="9.5" class="warn">空のまま</text>

        <line x1="16" y1="256" x2="624" y2="256" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="282" font-size="10.5" class="muted">非対称の理由 ―</text>
        <text x="110" y="282" font-size="10.5" class="muted">返す側では、変換が<tspan class="lbl">最後の一手</tspan>。すでに手元にあるものを、送る形に直すだけ。</text>
        <text x="110" y="304" font-size="10.5" class="muted">受け取る側では、変換が<tspan class="lbl">最初の一手</tspan>。それが済むまで、そもそも読めるものが無い。</text>
      </svg>
    </div>
  </body>
</html>
