<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="データベースの複製が2つの別々の目的を持つことを示した図。上は待機系への複製で、同じ内容をもう1つのゾーンに持ち、主系が落ちたときに切り替えて使う。読み書きは常に主系だけが受けるため、性能は上がらず、目的は止めないことにある。下は読み取り用の複製で、参照だけを複数の複製へ振り分けて負荷を分散する。書き込みは主系にしか行えず、複製への反映にはわずかな遅れがあるため、書いた直後にその複製から読むと古い内容が返ることがある。同じ複製という言葉でも、可用性のためのものと性能のためのものは別に用意する。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="28" font-size="12" class="muted">同じ「複製」でも、目的が違う</text>

        <rect x="20" y="44" width="720" height="106" rx="10" fill="none" stroke="var(--primary)" />
        <text x="36" y="66" font-size="11.5">待機系への複製 ― 止めないため</text>
        <rect x="60" y="78" width="150" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="100" font-size="10" text-anchor="middle">主系(ゾーンA)</text>
        <text x="135" y="118" font-size="9" text-anchor="middle" class="muted">読み書きはすべてここ</text>
        <line x1="216" y1="104" x2="288" y2="104" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="252" y="96" font-size="9" text-anchor="middle" class="muted">同期複製</text>
        <rect x="294" y="78" width="150" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="369" y="100" font-size="10" text-anchor="middle">待機系(ゾーンC)</text>
        <text x="369" y="118" font-size="9" text-anchor="middle" class="muted">普段は使わない</text>
        <text x="470" y="98" font-size="10" class="accent">主系が落ちたら切り替わる</text>
        <text x="470" y="118" font-size="9.5" class="muted">性能は上がらない ― 目的は可用性</text>

        <rect x="20" y="164" width="720" height="106" rx="10" fill="none" stroke="var(--border)" />
        <text x="36" y="186" font-size="11.5">読み取り用の複製 ― 捌くため</text>
        <rect x="60" y="198" width="150" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="220" font-size="10" text-anchor="middle">主系</text>
        <text x="135" y="238" font-size="9" text-anchor="middle" class="muted">書き込みはここだけ</text>
        <line x1="216" y1="212" x2="288" y2="206" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="216" y1="232" x2="288" y2="238" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="294" y="186" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="369" y="206" font-size="9.5" text-anchor="middle" class="muted">読み取り用の複製</text>
        <rect x="294" y="226" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="369" y="246" font-size="9.5" text-anchor="middle" class="muted">読み取り用の複製</text>
        <text x="470" y="212" font-size="10" class="accent">参照だけを振り分けて分散する</text>
        <text x="470" y="232" font-size="9.5" class="muted">反映に遅れがある ― 書いた直後に</text>
        <text x="470" y="248" font-size="9.5" class="muted">複製から読むと古い内容が返る</text>
      </svg>
    </div>
  </body>
</html>
