<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="Prometheusを中心にしたメトリクス収集の構成を示した図。Prometheusは監視対象が送りつけてくるのを待つのではなく、自分から定期的に取りに行くプル型で動く。各サーバーやアプリはExporterと呼ばれる小さな公開口を持ち、そこへ取得に行く。すぐ終わってしまうバッチ処理だけは取りに行くタイミングが合わないため、いったんPushgatewayへ送っておき、あとからまとめて取得する。集めた値はしきい値の評価に使われ、条件に合えばAlertmanagerが重複をまとめて通知し、人が見るグラフはGrafanaが描く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="250" y="120" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="146" font-size="12" text-anchor="middle">Prometheus</text>
        <text x="350" y="166" font-size="9.5" text-anchor="middle" class="muted">定期的に「取りに行く」(プル型)</text>

        <rect x="20" y="40" width="160" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="100" y="60" font-size="10.5" text-anchor="middle">サーバー</text>
        <text x="100" y="76" font-size="9" text-anchor="middle" class="muted">Node Exporter</text>
        <rect x="20" y="102" width="160" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="100" y="122" font-size="10.5" text-anchor="middle">アプリ</text>
        <text x="100" y="138" font-size="9" text-anchor="middle" class="muted">/metrics を公開する</text>
        <rect x="20" y="164" width="160" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="100" y="184" font-size="10.5" text-anchor="middle">短命なバッチ</text>
        <text x="100" y="200" font-size="9" text-anchor="middle" class="muted">終わるのが速すぎるので</text>
        <text x="100" y="215" font-size="9" text-anchor="middle" class="muted">Pushgatewayに預ける</text>

        <line x1="248" y1="140" x2="186" y2="66" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="248" y1="148" x2="186" y2="126" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="248" y1="162" x2="186" y2="192" stroke="var(--primary)" stroke-dasharray="4 3" marker-end="url(#arp)" />
        <text x="216" y="106" font-size="9" class="accent">scrape</text>

        <rect x="510" y="60" width="170" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="595" y="82" font-size="10.5" text-anchor="middle">Alertmanager</text>
        <text x="595" y="99" font-size="9" text-anchor="middle" class="muted">まとめて・重複を消して通知</text>
        <rect x="510" y="130" width="170" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="595" y="152" font-size="10.5" text-anchor="middle">Grafana</text>
        <text x="595" y="169" font-size="9" text-anchor="middle" class="muted">人が見るグラフを描く</text>

        <line x1="454" y1="138" x2="504" y2="96" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="454" y1="156" x2="504" y2="156" stroke="var(--muted)" marker-end="url(#ar)" />

        <text x="20" y="256" font-size="10.5" class="muted">プル型の利点は、監視対象の一覧を中央で持てること ― 増減するコンテナは自動で対象に足せる。</text>
        <text x="20" y="278" font-size="10.5" class="accent">注意 ― ユーザーIDのような値をラベルにすると時系列が爆発し、Prometheus自身が落ちる。</text>
      </svg>
    </div>
  </body>
</html>
