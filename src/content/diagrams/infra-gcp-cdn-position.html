<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="配信網が負荷分散の仕組みと一体になっている構成を示した図。利用者からの要求はまず最寄りの拠点に着き、そこにキャッシュがあればその場で返される。無ければ内側の負荷分散へ渡り、そこから背後のサービスへ届いて応答が作られ、その応答が拠点にも蓄えられる。つまり配信の層と振り分けの層が同じ入口に統合されており、キャッシュする条件も振り分けの条件も1か所で設定する。別々の製品を並べる構成に比べ、設定箇所が減るぶん、どこで何が起きているかを追いやすい。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="100" width="110" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="130" font-size="10.5" text-anchor="middle">利用者</text>

        <line x1="136" y1="126" x2="186" y2="126" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="192" y="86" width="170" height="80" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="277" y="112" font-size="10.5" text-anchor="middle">最寄りの拠点</text>
        <text x="277" y="132" font-size="9" text-anchor="middle" class="muted">キャッシュがあれば</text>
        <text x="277" y="148" font-size="9" text-anchor="middle" class="accent">ここで返る</text>

        <line x1="368" y1="126" x2="418" y2="126" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="393" y="116" font-size="9" text-anchor="middle" class="muted">無ければ</text>

        <rect x="424" y="86" width="130" height="80" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="489" y="112" font-size="10.5" text-anchor="middle">負荷分散</text>
        <text x="489" y="132" font-size="9" text-anchor="middle" class="muted">同じ入口に統合</text>
        <text x="489" y="148" font-size="9" text-anchor="middle" class="muted">されている</text>

        <line x1="560" y1="126" x2="600" y2="126" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="606" y="96" width="74" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="643" y="130" font-size="10" text-anchor="middle">サービス</text>

        <path d="M643,160 L643,196 L277,196 L277,170" fill="none" stroke="var(--primary)" stroke-dasharray="4 3" marker-end="url(#arp)" />
        <text x="460" y="212" font-size="9.5" text-anchor="middle" class="muted">応答は拠点にも蓄えられ、次からはそこで返る</text>

        <text x="20" y="250" font-size="10.5" class="muted">配信の層と振り分けの層が同じ入口にある ― キャッシュの条件も振り分けの条件も1か所で設定する。</text>
        <text x="20" y="270" font-size="10.5" class="muted">別々の製品を並べる構成より設定箇所が少なく、どこで何が起きているかを追いやすい。</text>
      </svg>
    </div>
  </body>
</html>
