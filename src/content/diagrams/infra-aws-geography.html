<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="AWSの地理構造を3つの階層で示した図。いちばん外側にエッジロケーションがあり、利用者の最寄りからCloudFrontのキャッシュ配信やRoute 53のDNS応答を返す。その内側にリージョンがあり、東京やバージニア北部のように地理的に独立している。1つのリージョンはさらに複数のアベイラビリティゾーンに分かれ、それぞれが電源・空調・回線の独立した別のデータセンター群になっている。1つのゾーンが丸ごと落ちても他のゾーンは動き続けるため、複数ゾーンへの分散が可用性設計の基本になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="26" font-size="11" class="muted">エッジロケーション ― 利用者の最寄りで応答する(CloudFront・Route 53)</text>
        <rect x="20" y="36" width="660" height="34" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <circle cx="90" cy="53" r="7" fill="var(--primary)" />
        <circle cx="200" cy="53" r="7" fill="var(--primary)" />
        <circle cx="310" cy="53" r="7" fill="var(--primary)" />
        <circle cx="420" cy="53" r="7" fill="var(--primary)" />
        <circle cx="530" cy="53" r="7" fill="var(--primary)" />
        <circle cx="620" cy="53" r="7" fill="var(--primary)" />
        <text x="350" y="57" font-size="10" text-anchor="middle" class="muted">数が多く、世界中に散っている</text>

        <line x1="240" y1="70" x2="240" y2="98" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="252" y="90" font-size="9.5" class="muted">キャッシュに無いときだけ内側へ</text>

        <rect x="20" y="102" width="440" height="168" rx="8" fill="none" stroke="var(--primary)" />
        <text x="36" y="124" font-size="12">リージョン(東京 ap-northeast-1)</text>
        <rect x="36" y="136" width="128" height="112" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="100" y="158" font-size="11" text-anchor="middle">AZ 1a</text>
        <text x="100" y="180" font-size="9.5" text-anchor="middle" class="muted">電源・空調・回線</text>
        <text x="100" y="196" font-size="9.5" text-anchor="middle" class="muted">が独立した建物群</text>
        <text x="100" y="222" font-size="9.5" text-anchor="middle" class="muted">EC2・サブネット</text>
        <text x="100" y="238" font-size="9.5" text-anchor="middle" class="muted">EBSはここに属する</text>
        <rect x="176" y="136" width="128" height="112" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="240" y="158" font-size="11" text-anchor="middle">AZ 1c</text>
        <text x="240" y="192" font-size="9.5" text-anchor="middle" class="muted">同じデータを</text>
        <text x="240" y="208" font-size="9.5" text-anchor="middle" class="muted">複製しておけば</text>
        <text x="240" y="224" font-size="9.5" text-anchor="middle" class="muted">片方が落ちても続く</text>
        <rect x="316" y="136" width="128" height="112" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="158" font-size="11" text-anchor="middle">AZ 1d</text>
        <text x="380" y="200" font-size="9.5" text-anchor="middle" class="muted">低遅延の専用回線で</text>
        <text x="380" y="216" font-size="9.5" text-anchor="middle" class="muted">互いにつながる</text>

        <rect x="480" y="102" width="200" height="168" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="580" y="124" font-size="12" text-anchor="middle" class="muted">別リージョン</text>
        <text x="580" y="160" font-size="10" text-anchor="middle" class="muted">作ったリソースは</text>
        <text x="580" y="178" font-size="10" text-anchor="middle" class="muted">原則として見えない</text>
        <text x="580" y="210" font-size="10" text-anchor="middle" class="muted">障害も、法規制上の</text>
        <text x="580" y="228" font-size="10" text-anchor="middle" class="muted">データの置き場所も</text>
        <text x="580" y="246" font-size="10" text-anchor="middle" class="muted">ここで分かれる</text>

        <text x="20" y="290" font-size="10.5" class="muted">スコープは3種類 ― グローバル(IAM・Route 53)/ リージョン単位(S3・VPC)/ AZ単位(EC2・EBS)</text>
      </svg>
    </div>
  </body>
</html>
