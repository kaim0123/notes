<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 24%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 420"
        role="img"
        aria-label="ラスタ画像とベクター画像を4倍に拡大したときの違いの図解。ラスタは拡大すると点(画素)の階段状のギザギザが見えるのに対し、ベクターは数式を計算し直すため拡大しても線は滑らかなまま"
      >
        <defs>
          <marker
            id="arrow5"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- 左: ラスタ -->
        <text x="160" y="20" text-anchor="middle" font-size="13" font-weight="600">ラスタ(点を敷き詰める)</text>

        <rect x="60" y="40" width="100" height="100" fill="none" stroke="var(--border)" />
        <line x1="70" y1="130" x2="150" y2="50" stroke="var(--fg)" stroke-width="2" />
        <text x="110" y="156" text-anchor="middle" font-size="11" class="muted">原寸</text>

        <line x1="110" y1="146" x2="110" y2="174" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow5)" />
        <text x="122" y="163" font-size="11" class="muted">4倍に拡大</text>

        <rect x="60" y="180" width="200" height="200" fill="none" stroke="var(--border)" />
        <rect x="60" y="340" width="40" height="40" fill="var(--card)" stroke="var(--border)" />
        <rect x="100" y="300" width="40" height="40" fill="var(--card)" stroke="var(--border)" />
        <rect x="140" y="260" width="40" height="40" fill="var(--card)" stroke="var(--border)" />
        <rect x="180" y="220" width="40" height="40" fill="var(--card)" stroke="var(--border)" />
        <rect x="220" y="180" width="40" height="40" fill="var(--card)" stroke="var(--border)" />
        <text x="160" y="398" text-anchor="middle" font-size="12" class="muted">拡大するとギザギザ(ジャギー)</text>

        <!-- 右: ベクター -->
        <text x="520" y="20" text-anchor="middle" font-size="13" font-weight="600">ベクター(数式で描く)</text>

        <rect x="420" y="40" width="100" height="100" fill="none" stroke="var(--border)" />
        <line x1="430" y1="130" x2="510" y2="50" stroke="var(--fg)" stroke-width="2" />
        <text x="470" y="156" text-anchor="middle" font-size="11" class="muted">原寸</text>

        <line x1="470" y1="146" x2="470" y2="174" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow5)" />
        <text x="482" y="163" font-size="11" class="muted">4倍に拡大</text>

        <rect x="420" y="180" width="200" height="200" fill="none" stroke="var(--border)" />
        <line x1="420" y1="380" x2="620" y2="180" stroke="var(--primary)" stroke-width="3" />
        <text x="520" y="398" text-anchor="middle" font-size="12" style="fill: var(--primary)">
          拡大しても滑らかなまま
        </text>
      </svg>
    </div>
  </body>
</html>
