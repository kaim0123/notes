<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .title {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 330"
        role="img"
        aria-label="2進数1011の各桁に2の累乗の重みを掛けて足し合わせると10進数の11になる、位取り記数法の図解"
      >
        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="360" y="18" text-anchor="middle" font-size="12" class="title">
          1011₂ の位取り(重み)
        </text>

        <!-- 桁(digit)の箱: 4桁分を個別に描画 -->
        <!-- 桁3 -->
        <rect x="60" y="30" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="66" text-anchor="middle" font-size="26" font-weight="600" class="mono">1</text>

        <line x1="110" y1="85" x2="110" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="120" y="107" font-size="11.5" class="muted">× 2³ (=8)</text>

        <rect x="60" y="125" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="110" y="161" text-anchor="middle" font-size="24" font-weight="700" class="mono">8</text>

        <!-- 桁2 -->
        <rect x="230" y="30" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="280" y="66" text-anchor="middle" font-size="26" font-weight="600" class="mono">0</text>

        <line x1="280" y1="85" x2="280" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="290" y="107" font-size="11.5" class="muted">× 2² (=4)</text>

        <rect x="230" y="125" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="280" y="161" text-anchor="middle" font-size="24" font-weight="700" class="mono">0</text>

        <!-- 桁1 -->
        <rect x="400" y="30" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="450" y="66" text-anchor="middle" font-size="26" font-weight="600" class="mono">1</text>

        <line x1="450" y1="85" x2="450" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="460" y="107" font-size="11.5" class="muted">× 2¹ (=2)</text>

        <rect x="400" y="125" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="450" y="161" text-anchor="middle" font-size="24" font-weight="700" class="mono">2</text>

        <!-- 桁0 -->
        <rect x="570" y="30" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="620" y="66" text-anchor="middle" font-size="26" font-weight="600" class="mono">1</text>

        <line x1="620" y1="85" x2="620" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="630" y="107" font-size="11.5" class="muted">× 2⁰ (=1)</text>

        <rect x="570" y="125" width="100" height="55" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="620" y="161" text-anchor="middle" font-size="24" font-weight="700" class="mono">1</text>

        <!-- 縦の接続線(各値の箱の下から合計ラインへ) -->
        <line x1="110" y1="180" x2="110" y2="210" stroke="var(--border)" stroke-width="1.5" />
        <line x1="280" y1="180" x2="280" y2="210" stroke="var(--border)" stroke-width="1.5" />
        <line x1="450" y1="180" x2="450" y2="210" stroke="var(--border)" stroke-width="1.5" />
        <line x1="620" y1="180" x2="620" y2="210" stroke="var(--border)" stroke-width="1.5" />

        <!-- 合計ライン(横) -->
        <line x1="95" y1="210" x2="635" y2="210" stroke="var(--border)" stroke-width="1.5" />
        <text x="195" y="215" text-anchor="middle" font-size="18" class="muted">+</text>
        <text x="365" y="215" text-anchor="middle" font-size="18" class="muted">+</text>
        <text x="535" y="215" text-anchor="middle" font-size="18" class="muted">+</text>

        <!-- 合計への矢印 -->
        <line x1="365" y1="210" x2="365" y2="243" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- 合計の箱(強調) -->
        <rect x="285" y="250" width="160" height="55" rx="10" fill="var(--primary)" />
        <text
          x="365"
          y="284"
          text-anchor="middle"
          font-size="20"
          font-weight="700"
          class="mono"
          style="fill: var(--primary-fg)"
        >
          1011₂ = 11
        </text>
      </svg>
    </div>
  </body>
</html>
