<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="リクエストがミドルウェアを順に通ってルートハンドラへ届く様子を示した図。左から入ってきたリクエストが、ログ出力、本文の解釈、認証の確認という順に並んだ段を通り、最後にルートハンドラへ届いて応答が返る。各段は次へ進めるかどうかを自分で決められる。認証の確認の段からは下向きの分岐が出ており、条件を満たさなければ次を呼ばずにその場で応答を返して打ち切る。図の右下には、例外が投げられた場合の経路が別に描かれており、途中のどの段で投げても、まとめて受け止める最後の段へ飛ぶ。図の下部には、登録した順がそのまま実行の順になること、そして横断的な処理を各ハンドラに書き写す代わりにこの並びの一段として一度だけ書けることが、この構造の要点として記されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="60" font-size="10.5" class="muted">リクエスト</text>
        <line x1="76" y1="76" x2="102" y2="76" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="106" y="56" width="104" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="126" y="81" font-size="10">ログ出力</text>
        <line x1="210" y1="76" x2="234" y2="76" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="238" y="56" width="104" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="254" y="81" font-size="10">本文の解釈</text>
        <line x1="342" y1="76" x2="366" y2="76" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="370" y="56" width="104" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="386" y="81" font-size="10">認証の確認</text>
        <line x1="474" y1="76" x2="498" y2="76" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="502" y="56" width="112" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="516" y="81" font-size="10" class="lbl">ルートハンドラ</text>

        <path d="M558,96 v40 h-528 v-46" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="240" y="132" font-size="9.5" class="lbl">応答</text>

        <path d="M422,96 v56" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="342" y="156" width="170" height="34" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1.2" />
        <text x="356" y="177" font-size="9.5" class="muted">次を呼ばず、その場で返す</text>
        <text x="342" y="208" font-size="9.5" class="muted">条件を満たさなければ、ここで打ち切る</text>

        <path d="M170,96 v130 h300" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)" />
        <rect x="474" y="210" width="146" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="488" y="231" font-size="9.5" class="lbl">まとめて受け止める段</text>
        <text x="180" y="222" font-size="9.5" class="muted">例外は、どの段で投げても</text>

        <line x1="16" y1="264" x2="624" y2="264" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="288" font-size="10.5" class="muted">登録した順が、そのまま実行の順になる。</text>
        <text x="16" y="310" font-size="10.5" class="lbl">横断的な処理を各ハンドラに書き写す代わりに、この並びの一段として一度だけ書ける。</text>
      </svg>
    </div>
  </body>
</html>
