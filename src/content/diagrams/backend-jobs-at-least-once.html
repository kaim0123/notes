<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 360" role="img" aria-label="ジョブが必ず2回実行され得ることを示した図。上段は構成図で、APIがキューにジョブを置いて202を即座に返し、複数のワーカーがキューから取り出して実行する。ワーカーを増やせば処理能力が上がり、溜まっても失われない。下段は時間の流れに沿った失敗の場面で、ワーカーがジョブを取り出し、メールを実際に送信し、そして完了を報告する直前に落ちる。キューから見ると完了の報告が来ていないため、まだ終わっていないと判断して同じジョブを別のワーカーに渡す。結果としてメールは2通送られる。図はこの一点を強調しており、ほとんどのキューが保証するのは最低1回であってちょうど1回ではないこと、したがってジョブは何度実行されても結果が同じになるように書く必要があることを示している。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="34" width="104" height="48" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="52" y="54" font-size="11">API</text>
        <text x="28" y="71" font-size="9" class="muted">202 を即返す</text>
        <line x1="120" y1="58" x2="146" y2="58" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="150" y="34" width="140" height="48" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="196" y="54" font-size="11" class="lbl">キュー</text>
        <text x="164" y="71" font-size="9" class="muted">順番に溜めておく</text>

        <line x1="290" y1="48" x2="326" y2="34" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="290" y1="68" x2="326" y2="82" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <rect x="330" y="16" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="356" y="38" font-size="10.5">ワーカー 1</text>
        <rect x="330" y="66" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="356" y="88" font-size="10.5">ワーカー 2</text>
        <text x="464" y="46" font-size="10" class="muted">増やせば速くなる</text>
        <text x="464" y="64" font-size="10" class="muted">溜まっても失われない</text>

        <line x1="16" y1="118" x2="624" y2="118" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="142" font-size="11.5" class="muted">では、こういうときは ―</text>

        <line x1="80" y1="166" x2="80" y2="300" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="162" font-size="9.5" class="muted">時間</text>

        <circle cx="80" cy="180" r="4" fill="var(--primary)" />
        <text x="96" y="184" font-size="10.5">ワーカー1がジョブを取り出す</text>

        <circle cx="80" cy="212" r="4" fill="var(--primary)" />
        <text x="96" y="216" font-size="10.5">メールを実際に送信する</text>
        <text x="330" y="216" font-size="10" class="lbl">← ここまでは成功している</text>

        <circle cx="80" cy="244" r="4" fill="var(--muted)" />
        <text x="96" y="248" font-size="10.5" class="muted">完了を報告する直前に、ワーカー1が落ちる</text>

        <circle cx="80" cy="276" r="4" fill="var(--muted)" />
        <text x="96" y="280" font-size="10.5" class="muted">キューは「まだ終わっていない」と判断し、ワーカー2へ渡す</text>

        <rect x="96" y="292" width="220" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="112" y="312" font-size="10.5" class="lbl">→ メールは2通送られる</text>

        <text x="16" y="348" font-size="10.5" class="muted">保証されるのは「最低1回」であって「ちょうど1回」ではない。だからジョブは、何度実行されても結果が同じになるように書く。</text>
      </svg>
    </div>
  </body>
</html>
