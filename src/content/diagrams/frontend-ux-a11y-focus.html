<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 310" role="img" aria-label="モーダルを開いてから閉じるまでのフォーカスの流れを示した図。左上の開くボタンを押した時点で、そのボタンを記憶しておく。開いたらモーダル内の先頭要素へフォーカスを移す。開いている間はTabがモーダルの外へ出ないよう閉じ込め、背後のコンテンツはinertで操作対象から外す。Escまたは閉じるボタンで閉じたら、記憶しておいた元のボタンへフォーカスを戻す。この戻しを省くと、閉じた後にフォーカスがページ先頭へ飛び、利用者は自分がどこにいたか分からなくなる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="40" width="170" height="72" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="64" font-size="11.5">① 開くボタンを押す</text>
        <text x="36" y="86" font-size="10.5" class="lbl">この要素を記憶しておく</text>
        <text x="36" y="104" font-size="10" class="muted">document.activeElement</text>

        <line x1="190" y1="76" x2="222" y2="76" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />

        <rect x="226" y="26" width="252" height="180" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="244" y="50" font-size="11.5" class="lbl">② モーダルが開いている間</text>
        <rect x="244" y="62" width="216" height="30" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="256" y="82" font-size="10.5" class="lbl">先頭要素へフォーカスを移す</text>
        <rect x="244" y="100" width="216" height="30" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="256" y="120" font-size="10.5" class="muted">Tab は内側だけを巡回する</text>
        <rect x="244" y="138" width="216" height="30" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="256" y="158" font-size="10.5" class="muted">背後は inert で操作対象から外す</text>
        <text x="244" y="190" font-size="10" class="muted">Esc / 閉じるボタンで閉じられること</text>

        <line x1="478" y1="76" x2="510" y2="76" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <rect x="514" y="40" width="110" height="72" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="530" y="64" font-size="11.5">③ 閉じる</text>
        <text x="530" y="88" font-size="10.5" class="muted">Esc または</text>
        <text x="530" y="106" font-size="10.5" class="muted">閉じるボタン</text>

        <path d="M569 112 L569 240 L105 240 L105 116" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arp)" />
        <text x="337" y="232" text-anchor="middle" font-size="11" class="lbl">④ 記憶しておいた元の要素へフォーカスを戻す</text>

        <rect x="20" y="256" width="604" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="38" y="282" font-size="10.5" class="muted">④ を省くと、閉じた後フォーカスはページ先頭へ飛ぶ ― 利用者は自分がどこにいたか分からなくなる</text>
      </svg>
    </div>
  </body>
</html>
