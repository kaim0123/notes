<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="「足りなさ」が繰り返す循環。余裕ができる→使い切る→足りなくなる→工夫する(新技術)と巡り、工夫がまた新しい余裕を生んで、その余裕がまた使い切られていく。" viewBox="0 0 640 120">
      <text x="70" y="65" fill="var(--fg)" font-size="12" text-anchor="middle">余裕が</text>
      <text x="70" y="82" fill="var(--fg)" font-size="12" text-anchor="middle">できる</text>
      <text x="155" y="73" fill="var(--muted)" font-size="16" text-anchor="middle">→</text>
      <text x="230" y="65" fill="var(--fg)" font-size="12" text-anchor="middle">使い切る</text>
      <text x="310" y="73" fill="var(--muted)" font-size="16" text-anchor="middle">→</text>
      <text x="390" y="65" fill="var(--fg)" font-size="12" text-anchor="middle">足りなく</text>
      <text x="390" y="82" fill="var(--fg)" font-size="12" text-anchor="middle">なる</text>
      <text x="470" y="73" fill="var(--muted)" font-size="16" text-anchor="middle">→</text>
      <text x="555" y="65" fill="var(--primary)" font-size="12" text-anchor="middle">工夫する</text>
      <text x="555" y="82" fill="var(--primary)" font-size="12" text-anchor="middle">(新技術)</text>
      <path d="M555 95 q0 20 -240 20 q-245 0 -245 -20" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />
      <polygon points="70,95 64,105 76,105" fill="var(--muted)" />
      </svg>
    </div>
  </body>
</html>
