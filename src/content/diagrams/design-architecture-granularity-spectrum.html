<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 700 280" role="img" aria-label="分割の粒度を並べたスペクトル図。左から、モノリス(1つのアプリと1つのDB)、モジュラーモノリス(1つのプロセスの中にモジュール境界があり、DBは1つ)、サービスベース(4から12個のドメインサービスがDBを共有する)、マイクロサービス(サービスごとに専用DBを持つ)、SOA(細かいサービス群がESBを介する)の順に並び、右へ行くほど独立性が高まる一方で運用コストも増えることが示されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="350" y="24" text-anchor="middle" font-size="11.5" class="muted">独立性が上がるほど、運用コストも上がる</text>

        <line x1="40" y1="220" x2="660" y2="220" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />
        <text x="52" y="242" font-size="10.5" class="muted">独立性 低 / 運用は軽い</text>
        <text x="648" y="242" text-anchor="end" font-size="10.5" class="muted">独立性 高 / 運用は重い</text>

        <rect x="30" y="60" width="140" height="72" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="100" y="84" text-anchor="middle" font-size="11">モノリス</text>
        <text x="100" y="104" text-anchor="middle" font-size="9.5" class="muted">1アプリ・1DB</text>
        <text x="100" y="120" text-anchor="middle" font-size="9.5" class="muted">境界は曖昧</text>
        <line x1="100" y1="132" x2="100" y2="214" stroke="var(--border)" stroke-width="1.1" />

        <rect x="182" y="60" width="150" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="257" y="84" text-anchor="middle" font-size="11" font-weight="600">モジュラーモノリス</text>
        <text x="257" y="104" text-anchor="middle" font-size="9.5" class="muted">1プロセス・1DB</text>
        <text x="257" y="120" text-anchor="middle" font-size="9.5" class="muted">内部にモジュール境界</text>
        <line x1="257" y1="132" x2="257" y2="214" stroke="var(--border)" stroke-width="1.1" />

        <rect x="344" y="60" width="150" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="419" y="84" text-anchor="middle" font-size="11" font-weight="600">サービスベース</text>
        <text x="419" y="104" text-anchor="middle" font-size="9.5" class="muted">4〜12個のサービス</text>
        <text x="419" y="120" text-anchor="middle" font-size="9.5" class="muted">DBは共有することも</text>
        <line x1="419" y1="132" x2="419" y2="214" stroke="var(--border)" stroke-width="1.1" />

        <rect x="506" y="60" width="150" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="581" y="84" text-anchor="middle" font-size="11" font-weight="600">マイクロサービス</text>
        <text x="581" y="104" text-anchor="middle" font-size="9.5" class="muted">境界ごとに独立</text>
        <text x="581" y="120" text-anchor="middle" font-size="9.5" class="muted">サービスごとに専用DB</text>
        <line x1="581" y1="132" x2="581" y2="214" stroke="var(--border)" stroke-width="1.1" />

        <text x="350" y="180" text-anchor="middle" font-size="11" class="muted">SOAはこの右端よりさらに細かく分けすぎ、ESBへの依存で結合が残った</text>
        <text x="350" y="200" text-anchor="middle" font-size="11" class="muted">その反省がサービスベース、行き過ぎの揺り戻しがモジュラーモノリス</text>

        <text x="350" y="270" text-anchor="middle" font-size="11" class="muted">
          「新しいほど良い」ではなく、規模と体制に見合う分割点を探し続けている
        </text>
      </svg>
    </div>
  </body>
</html>
