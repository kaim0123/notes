<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="マイクロカーネルアーキテクチャの構成図。中央に最小限の機能だけを持つコアシステムがあり、その周囲にコントラクト(プラグインが実装すべき共通インターフェース)の枠がある。枠の外側にはプラグインA・B・Cが差し込まれ、いずれもコントラクト経由でコアとつながる。コアの脇にはレジストリがあり、どのプラグインが存在しどう呼び出せるかを台帳として管理する。コアはプラグインの中身を知らないため、追加や削除をしてもコアのコードは変わらない。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">本体は最小限のまま、機能は後から差し込む</text>

        <rect x="200" y="110" width="200" height="80" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="300" y="142" text-anchor="middle" font-size="12.5" font-weight="600">コアシステム</text>
        <text x="300" y="164" text-anchor="middle" font-size="10" class="muted">必須機能だけを持つ</text>

        <rect x="440" y="126" width="150" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="515" y="146" text-anchor="middle" font-size="11">レジストリ</text>
        <text x="515" y="164" text-anchor="middle" font-size="9.5" class="muted">どのプラグインが居るか</text>
        <line x1="406" y1="150" x2="434" y2="150" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />

        <rect x="40" y="52" width="140" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="110" y="80" text-anchor="middle" font-size="11">プラグインA</text>
        <rect x="40" y="126" width="140" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="110" y="154" text-anchor="middle" font-size="11">プラグインB</text>
        <rect x="40" y="200" width="140" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="110" y="228" text-anchor="middle" font-size="11">プラグインC</text>

        <line x1="184" y1="75" x2="212" y2="118" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="184" y1="149" x2="196" y2="149" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="184" y1="223" x2="212" y2="184" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <text x="196" y="270" text-anchor="middle" font-size="10.5" class="hi">共通のコントラクト(決まった形の窓口)を経由する</text>

        <text x="330" y="292" text-anchor="middle" font-size="11" class="muted">
          プラグインを足しても消しても、コアのコードには手を入れない
        </text>
      </svg>
    </div>
  </body>
</html>
