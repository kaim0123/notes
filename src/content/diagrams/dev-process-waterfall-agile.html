<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="ウォーターフォールとアジャイルの進め方を比べた図。上段のウォーターフォールでは、要件定義・設計・実装・テスト・導入・保守の6工程が左から右へ一直線に並び、前の工程が終わってから次へ進む。全体像は早く見通せるが、テストの段階で要件の誤りが見つかると、矢印が最初まで戻る大きな手戻りになる。下段のアジャイルでは、設計から実装、テスト、リリースまでの短い反復が3回繰り返されている。1回の反復ごとに動くものが出てくるため、認識のずれは1反復ぶんの手戻りで済む。要求が固まっているならウォーターフォール、変わりやすいならアジャイルが向く。"
      >
        <defs>
          <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arwp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="lbl">ウォーターフォール ― 工程を一方向に流す</text>

        <rect x="16" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="62" y="62" text-anchor="middle" font-size="11">要件定義</text>
        <rect x="118" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="164" y="62" text-anchor="middle" font-size="11">設計</text>
        <rect x="220" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="266" y="62" text-anchor="middle" font-size="11">実装</text>
        <rect x="322" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="368" y="62" text-anchor="middle" font-size="11">テスト</text>
        <rect x="424" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="62" text-anchor="middle" font-size="11">導入</text>
        <rect x="526" y="38" width="92" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="572" y="62" text-anchor="middle" font-size="11">保守</text>

        <line x1="108" y1="57" x2="114" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />
        <line x1="210" y1="57" x2="216" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />
        <line x1="312" y1="57" x2="318" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />
        <line x1="414" y1="57" x2="420" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />
        <line x1="516" y1="57" x2="522" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />

        <path d="M368,76 L368,100 L62,100 L62,80" fill="none" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arwp)" />
        <text x="215" y="116" text-anchor="middle" font-size="11" class="lbl">ここで要件の誤りが見つかると、最初まで戻る大きな手戻り</text>

        <line x1="16" y1="136" x2="624" y2="136" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="162" font-size="12" class="lbl">アジャイル ― 短い反復を繰り返す</text>

        <rect x="16" y="176" width="190" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="111" y="198" text-anchor="middle" font-size="11.5">反復1</text>
        <text x="111" y="218" text-anchor="middle" font-size="10.5" class="muted">設計 → 実装 → テスト</text>
        <text x="111" y="238" text-anchor="middle" font-size="10.5" class="lbl">動くものが出る</text>

        <rect x="220" y="176" width="190" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="315" y="198" text-anchor="middle" font-size="11.5">反復2</text>
        <text x="315" y="218" text-anchor="middle" font-size="10.5" class="muted">設計 → 実装 → テスト</text>
        <text x="315" y="238" text-anchor="middle" font-size="10.5" class="lbl">動くものが出る</text>

        <rect x="424" y="176" width="190" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="519" y="198" text-anchor="middle" font-size="11.5">反復3</text>
        <text x="519" y="218" text-anchor="middle" font-size="10.5" class="muted">設計 → 実装 → テスト</text>
        <text x="519" y="238" text-anchor="middle" font-size="10.5" class="lbl">動くものが出る</text>

        <line x1="206" y1="214" x2="216" y2="214" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />
        <line x1="410" y1="214" x2="420" y2="214" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arw)" />

        <text x="16" y="278" font-size="11" class="muted">認識のずれは1反復ぶんの手戻りで済む ― 要求が固まっているならウォーターフォール、変わりやすいならアジャイル</text>
      </svg>
    </div>
  </body>
</html>
