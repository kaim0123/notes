<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 330"
        role="img"
        aria-label="パーティションプルーニングの図。注文日でレンジパーティションに分割したordersテーブルに対し、6月の注文を検索すると、DBMSは2026-06の区画だけを走査し、1月から5月の区画は読み飛ばす。"
      >
        <defs>
          <marker id="arwP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- クエリ -->
        <rect x="120" y="20" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="49" text-anchor="middle" font-size="12.5" class="mono">
          SELECT * FROM orders WHERE 注文日 &gt;= '2026-06-01'
        </text>

        <path d="M380,68 L380,108" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arwP)" />
        <text x="396" y="93" font-size="11" class="accent">対象の区画だけを選ぶ</text>

        <!-- テーブル全体の枠 -->
        <rect x="30" y="118" width="700" height="120" rx="10" fill="none" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="6 4" />
        <text x="46" y="140" font-size="11.5" class="muted">1つのordersテーブル(アプリからは分割されて見えない)</text>

        <!-- 区画 -->
        <rect x="48" y="152" width="100" height="68" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="98" y="180" text-anchor="middle" font-size="12" class="muted">2026-01</text>
        <text x="98" y="200" text-anchor="middle" font-size="10.5" class="muted">読み飛ばし</text>

        <rect x="160" y="152" width="100" height="68" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="210" y="180" text-anchor="middle" font-size="12" class="muted">2026-02</text>
        <text x="210" y="200" text-anchor="middle" font-size="10.5" class="muted">読み飛ばし</text>

        <rect x="272" y="152" width="100" height="68" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="322" y="180" text-anchor="middle" font-size="12" class="muted">2026-03</text>
        <text x="322" y="200" text-anchor="middle" font-size="10.5" class="muted">読み飛ばし</text>

        <rect x="384" y="152" width="100" height="68" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="434" y="180" text-anchor="middle" font-size="12" class="muted">2026-04</text>
        <text x="434" y="200" text-anchor="middle" font-size="10.5" class="muted">読み飛ばし</text>

        <rect x="496" y="152" width="100" height="68" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="546" y="180" text-anchor="middle" font-size="12" class="muted">2026-05</text>
        <text x="546" y="200" text-anchor="middle" font-size="10.5" class="muted">読み飛ばし</text>

        <rect x="608" y="146" width="104" height="80" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="2" />
        <text x="660" y="176" text-anchor="middle" font-size="12.5" font-weight="600" class="accent">2026-06</text>
        <text x="660" y="197" text-anchor="middle" font-size="10.5" class="accent">この区画だけ</text>
        <text x="660" y="212" text-anchor="middle" font-size="10.5" class="accent">走査する</text>

        <text x="380" y="268" text-anchor="middle" font-size="12">
          レンジパーティション + プルーニングで、走査するデータ量を6分の1に絞れる
        </text>
        <text x="380" y="296" text-anchor="middle" font-size="11" class="muted">
          分割の基準は範囲(レンジ)のほか、値の列挙(リスト)・ハッシュ関数による均等配分(ハッシュ)がある
        </text>
      </svg>
    </div>
  </body>
</html>
