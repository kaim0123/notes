<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="Narrowing(絞り込み)の仕組みを示した図。関数の入口では引数の型がnumberまたはstringのどちらか分からない状態で入ってくる。typeofで数値かどうかを調べる分岐を書くと、trueの枝の中では型がnumberに確定し、toFixedなどの数値用のメソッドだけが補完に出る。falseの枝の中では型がstringに確定し、toUpperCaseなどの文字列用のメソッドだけが使える。判別可能Unionの場合も同じで、kindやstatusといったタグの値を調べる分岐に入ると、その枝の中ではオブジェクトの正体が1つに特定され、その形が持つプロパティにだけ安全にアクセスできる。条件を書くだけで型が自動的に狭まるのがNarrowingで、分岐の外側では使えないメソッドが分岐の中では使えるようになる。"
      >
        <defs>
          <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="112" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="91" y="136" text-anchor="middle" font-size="11.5" font-family="monospace" class="muted">number | string</text>
        <text x="91" y="155" text-anchor="middle" font-size="10.5" class="muted">まだどちらか不明</text>

        <line x1="166" y1="140" x2="212" y2="140" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arn)" />

        <rect x="218" y="112" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="293" y="136" text-anchor="middle" font-size="11" font-family="monospace">typeof v === &quot;number&quot;</text>
        <text x="293" y="155" text-anchor="middle" font-size="10.5" class="lbl">ここで型が分かれる</text>

        <line x1="368" y1="130" x2="418" y2="76" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arn)" />
        <text x="392" y="94" font-size="10.5" class="muted">true</text>
        <line x1="368" y1="150" x2="418" y2="204" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arn)" />
        <text x="392" y="192" font-size="10.5" class="muted">false</text>

        <rect x="424" y="40" width="200" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="524" y="64" text-anchor="middle" font-size="12" font-family="monospace">number</text>
        <text x="524" y="84" text-anchor="middle" font-size="10.5" class="muted">v.toFixed(2) が使える</text>
        <text x="524" y="100" text-anchor="middle" font-size="10.5" class="muted">v.toUpperCase() は書けない</text>

        <rect x="424" y="168" width="200" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="524" y="192" text-anchor="middle" font-size="12" font-family="monospace">string</text>
        <text x="524" y="212" text-anchor="middle" font-size="10.5" class="muted">v.toUpperCase() が使える</text>
        <text x="524" y="228" text-anchor="middle" font-size="10.5" class="muted">v.toFixed() は書けない</text>

        <line x1="16" y1="258" x2="624" y2="258" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="278" font-size="11" class="muted">判別可能Unionでも同じ ― kind や status を調べる分岐に入ると、その枝の中で正体が1つに特定される</text>
      </svg>
    </div>
  </body>
</html>
