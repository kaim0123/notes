<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="共有プリンタの構成図。PC A・PC B・PC Cの3台がLAN(社内ネットワーク)につながり、そこから固定IPアドレス192.168.1.50を持つ共有プリンタへ印刷ジョブが送られる。" viewBox="0 0 640 220">
      <rect x="40" y="30" width="110" height="44" rx="6" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="95" y="57" fill="var(--fg)" font-size="12" text-anchor="middle">PC A</text>
      <rect x="40" y="90" width="110" height="44" rx="6" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="95" y="117" fill="var(--fg)" font-size="12" text-anchor="middle">PC B</text>
      <rect x="40" y="150" width="110" height="44" rx="6" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="95" y="177" fill="var(--fg)" font-size="12" text-anchor="middle">PC C</text>

      <line x1="150" y1="52" x2="280" y2="110" stroke="var(--muted)" stroke-dasharray="4 3" />
      <line x1="150" y1="112" x2="280" y2="112" stroke="var(--muted)" stroke-dasharray="4 3" />
      <line x1="150" y1="172" x2="280" y2="114" stroke="var(--muted)" stroke-dasharray="4 3" />

      <rect x="280" y="85" width="120" height="54" rx="6" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="340" y="108" fill="var(--fg)" font-size="12" text-anchor="middle">LAN</text>
      <text x="340" y="124" fill="var(--muted)" font-size="10" text-anchor="middle">(社内ネットワーク)</text>

      <line x1="400" y1="112" x2="480" y2="112" stroke="var(--primary)" stroke-width="1.5" />

      <rect x="480" y="80" width="130" height="64" rx="6" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="545" y="106" fill="var(--fg)" font-size="13" text-anchor="middle">共有プリンタ</text>
      <text x="545" y="124" fill="var(--muted)" font-size="11" text-anchor="middle">固定IP: 192.168.1.50</text>
      </svg>
    </div>
  </body>
</html>
