<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="関数を起動する契機を2種類に分けた図。1つはHTTPの要求で、URLを叩かれたときに動き、その場で応答を返す。もう1つは出来事で、保存先へのファイル追加、メッセージの到着、データの変更などをきっかけに動き、呼び出し元へ応答は返さない。前者は同期的なので失敗すれば呼んだ側にエラーが返り、後者は非同期なので失敗は再試行され、それでも駄目なものは別の場所へ退避する。同じ関数でも、どちらの契機で動くかによって、失敗したときに誰が後始末をするかが変わる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="120" y="86" font-size="11" text-anchor="middle">HTTPの要求</text>
        <text x="120" y="108" font-size="9.5" text-anchor="middle" class="muted">URLを叩かれたら動く</text>
        <text x="120" y="126" font-size="9.5" text-anchor="middle" class="muted">その場で応答を返す</text>

        <rect x="20" y="160" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="186" font-size="11" text-anchor="middle">出来事</text>
        <text x="120" y="208" font-size="9.5" text-anchor="middle" class="muted">ファイル追加・メッセージ到着</text>
        <text x="120" y="226" font-size="9.5" text-anchor="middle" class="muted">データの変更</text>

        <line x1="226" y1="98" x2="286" y2="130" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="226" y1="198" x2="286" y2="166" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="292" y="118" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="367" y="144" font-size="11" text-anchor="middle">関数</text>
        <text x="367" y="164" font-size="9" text-anchor="middle" class="muted">同じコードが動く</text>

        <rect x="490" y="60" width="190" height="76" rx="8" fill="none" stroke="var(--border)" />
        <text x="585" y="86" font-size="10.5" text-anchor="middle">失敗は呼んだ側へ返る</text>
        <text x="585" y="108" font-size="9" text-anchor="middle" class="muted">後始末は呼んだ側の責任</text>
        <text x="585" y="126" font-size="9" text-anchor="middle" class="muted">利用者が待っている</text>

        <rect x="490" y="160" width="190" height="76" rx="8" fill="none" stroke="var(--border)" />
        <text x="585" y="186" font-size="10.5" text-anchor="middle">失敗は再試行される</text>
        <text x="585" y="208" font-size="9" text-anchor="middle" class="muted">駄目なら退避先へ</text>
        <text x="585" y="226" font-size="9" text-anchor="middle" class="accent">二度来ても壊れない実装に</text>

        <line x1="448" y1="134" x2="484" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="448" y1="162" x2="484" y2="190" stroke="var(--muted)" marker-end="url(#ar)" />

        <text x="20" y="266" font-size="10.5" class="muted">同じ関数でも、契機が違えば「失敗したとき誰が後始末をするか」が変わる。</text>
      </svg>
    </div>
  </body>
</html>
