<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="半加算器のブロック図。左から入力aとbを受け取り、AND・OR・NOTの組合せでできた半加算器が、その桁の答えsと桁上がりcの2つを出力する。" viewBox="0 0 560 200">

      <text x="70" y="75" fill="var(--fg)" font-size="14" text-anchor="middle">a</text>
      <line x1="85" y1="70" x2="200" y2="70" stroke="var(--muted)" stroke-width="1.5" />
      <text x="70" y="135" fill="var(--fg)" font-size="14" text-anchor="middle">b</text>
      <line x1="85" y1="130" x2="200" y2="130" stroke="var(--muted)" stroke-width="1.5" />

      <rect x="200" y="45" width="160" height="110" fill="none" stroke="var(--primary)" stroke-width="1.5" rx="8" />
      <text x="280" y="95" fill="var(--fg)" font-size="15" text-anchor="middle">半加算器</text>
      <text x="280" y="118" fill="var(--muted)" font-size="11" text-anchor="middle">(AND・OR・NOTの組合せ)</text>

      <line x1="360" y1="70" x2="475" y2="70" stroke="var(--muted)" stroke-width="1.5" />
      <text x="495" y="75" fill="var(--primary)" font-size="14" text-anchor="middle">s</text>
      <text x="520" y="75" fill="var(--muted)" font-size="11">その桁</text>
      <line x1="360" y1="130" x2="475" y2="130" stroke="var(--muted)" stroke-width="1.5" />
      <text x="495" y="135" fill="#ffb43c" font-size="14" text-anchor="middle">c</text>
      <text x="520" y="135" fill="var(--muted)" font-size="11">桁上がり</text>
      </svg>
    </div>
  </body>
</html>
