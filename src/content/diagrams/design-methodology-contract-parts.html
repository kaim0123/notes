<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 250" role="img" aria-label="契約による設計の3要素を示した図。左に呼び出す側、右に呼ばれる側があり、その境界の上に事前条件(呼び出す側が満たすべき条件)、下に事後条件(呼ばれる側が処理後に保証する条件)が置かれる。呼ばれる側の内部にはクラス不変条件(常に満たしているべき条件)がある。契約があると、失敗したときにどちらの責任かを機械的に切り分けられる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">境界をまたぐ「約束」を先に決めておく</text>

        <rect x="40" y="94" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="130" y="130" text-anchor="middle" font-size="11.5">呼び出す側</text>

        <rect x="440" y="94" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="530" y="120" text-anchor="middle" font-size="11.5" font-weight="600">呼ばれる側</text>
        <text x="530" y="140" text-anchor="middle" font-size="9.5" class="muted">不変条件: 常に整合している</text>

        <line x1="226" y1="110" x2="434" y2="110" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="330" y="100" text-anchor="middle" font-size="10.5" class="hi">事前条件: 呼ぶ側が保証する</text>

        <line x1="434" y1="140" x2="226" y2="140" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="330" y="160" text-anchor="middle" font-size="10.5" class="hi">事後条件: 呼ばれる側が保証する</text>

        <text x="130" y="196" text-anchor="middle" font-size="10.5" class="muted">破ったら呼び出す側のバグ</text>
        <text x="530" y="196" text-anchor="middle" font-size="10.5" class="muted">破ったら呼ばれる側のバグ</text>

        <text x="330" y="232" text-anchor="middle" font-size="11" class="muted">
          契約があるから、失敗したときにどちらの責任かを機械的に切り分けられる
        </text>
      </svg>
    </div>
  </body>
</html>
