<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="2つのテストツールの守備範囲を、テストの段階に重ねて示した図。左側にUnit、Integration、API、E2Eの4つの段階が下から上へ並ぶ。下の3段はいずれもプロセスの中で完結するため、同じテストランナーで書ける。1件はミリ秒から秒の単位で終わり、件数は多くなる。最上段のE2Eだけはブラウザを本当に起動して操作する必要があるため、別の仕組みが要る。1件は数秒から数十秒かかり、件数は絞る。ツールが2つに分かれているのは優劣ではなく、境界の引き方が違うからである。同じ言葉で書けるかどうかではなく、ブラウザを起こす必要があるかどうかが分かれ目になる、と図の下部に記されている。"
      >
        <text x="16" y="28" font-size="11" class="muted">道具が2つに分かれているのは、優劣ではなく境界の引き方の違い</text>

        <rect x="16" y="44" width="380" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="66" font-size="10.5" class="accent">E2E</text>
        <text x="30" y="86" font-size="9" class="muted">ブラウザを本当に起動して操作する</text>

        <rect x="408" y="44" width="216" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="422" y="66" font-size="10.5" class="accent">ブラウザ自動操作ツール</text>
        <text x="422" y="86" font-size="9" class="muted">数秒〜数十秒 / 件数は絞る</text>

        <line x1="16" y1="110" x2="624" y2="110" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />
        <text x="320" y="128" font-size="9.5" text-anchor="middle" class="muted">この線の下は、すべてプロセスの中で完結する</text>

        <rect x="16" y="140" width="380" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="160" font-size="10.5">API</text>
        <text x="30" y="177" font-size="9" class="muted">ポートを開かずHTTPを流し込む</text>

        <rect x="16" y="192" width="380" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="212" font-size="10.5">Integration</text>
        <text x="30" y="229" font-size="9" class="muted">本物のDB・外部の代役と組み合わせる</text>

        <rect x="16" y="244" width="380" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="264" font-size="10.5">Unit</text>
        <text x="30" y="281" font-size="9" class="muted">依存はすべて代役。最も多く書く</text>

        <rect x="408" y="140" width="216" height="148" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="422" y="164" font-size="10.5">テストランナー</text>
        <text x="422" y="188" font-size="9" class="muted">3段とも同じ道具で書ける</text>
        <text x="422" y="212" font-size="9" class="muted">ミリ秒〜秒 / 件数は多い</text>
        <text x="422" y="236" font-size="9" class="muted">変更したファイルに関わる</text>
        <text x="422" y="252" font-size="9" class="muted">テストだけを即座に再実行</text>
        <text x="422" y="276" font-size="9" class="muted">代役への差し替えも同梱</text>

        <text x="16" y="312" font-size="10.5" class="muted">分かれ目は「同じ言葉で書けるか」ではなく、「ブラウザを起こす必要があるか」だけ。</text>
      </svg>
    </div>
  </body>
</html>
