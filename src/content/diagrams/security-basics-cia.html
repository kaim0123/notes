<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="情報セキュリティが守る3つの性質を、1枚の板を支える3本の柱として示した図。上の板は守りたい状態、すなわち必要な人が、正しい情報を、必要なときに使える状態を表す。これを支える3本の柱が、左から機密性・完全性・可用性である。機密性が失われると情報漏えいが起き、完全性が失われるとデータの改ざんや破壊が起き、可用性が失われるとサービス停止になる。1本でも欠ければ、残りの2本が立っていても板は支えられない。さらに3本は独立ではなく引っ張り合う関係にあり、機密性を上げすぎると可用性が落ちる。"
      >
        <rect x="60" y="54" width="520" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="75" font-size="10.5" text-anchor="middle">守りたい状態 ― 必要な人が、正しい情報を、必要なときに使える</text>

        <rect x="90" y="96" width="120" height="100" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="260" y="96" width="120" height="100" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="430" y="96" width="120" height="100" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />

        <text x="150" y="126" font-size="13" text-anchor="middle">機密性</text>
        <text x="320" y="126" font-size="13" text-anchor="middle">完全性</text>
        <text x="490" y="126" font-size="13" text-anchor="middle">可用性</text>
        <text x="150" y="146" font-size="8.5" text-anchor="middle" class="muted">Confidentiality</text>
        <text x="320" y="146" font-size="8.5" text-anchor="middle" class="muted">Integrity</text>
        <text x="490" y="146" font-size="8.5" text-anchor="middle" class="muted">Availability</text>
        <text x="150" y="176" font-size="9.5" text-anchor="middle" class="muted">欠けると情報漏えい</text>
        <text x="320" y="176" font-size="9.5" text-anchor="middle" class="muted">欠けると改ざん・破壊</text>
        <text x="490" y="176" font-size="9.5" text-anchor="middle" class="muted">欠けるとサービス停止</text>

        <line x1="60" y1="200" x2="580" y2="200" stroke="var(--border)" stroke-width="1.4" />

        <text x="320" y="226" font-size="9.5" text-anchor="middle" class="muted">1本でも欠ければ、残り2本が立っていても板は支えられない</text>
        <text x="320" y="248" font-size="10.5" text-anchor="middle" class="accent">しかも3本は引っ張り合う ― 機密性を上げすぎると、可用性のほうが落ちる</text>

        <line x1="16" y1="264" x2="624" y2="264" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="286" font-size="10.5" class="muted">「安全にする」とは3本を全部立てること。どれを厚くしてどれを削るかは、守る対象ごとの判断になる。</text>
      </svg>
    </div>
  </body>
</html>
