<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 310" role="img" aria-label="入力部品を2つの軸で選ぶ表。縦軸は1つだけ選ぶか複数選べるか、横軸は選択肢が少ないか多いか。1つだけ選ぶ場合、選択肢が少なければラジオボタンかセグメント、多ければプルダウンやコンボボックスを使う。複数選べる場合、選択肢が少なければチェックボックスを並べ、多ければ複数選択できるリストやタグ入力を使う。表の下に2つの注記があり、単一選択の場面でチェックボックスを使うと複数選べてしまい意図しない入力を招くこと、そしてスイッチは切り替えが即座に反映される場面に使いチェックボックスは送信して効くものだという違いが示されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="176" y="36" text-anchor="middle" font-size="11.5" class="muted">選択肢が少ない(2〜5)</text>
        <text x="452" y="36" text-anchor="middle" font-size="11.5" class="muted">選択肢が多い</text>

        <text x="20" y="104" font-size="11.5" class="muted">1つだけ</text>
        <text x="20" y="122" font-size="11.5" class="muted">選ぶ</text>
        <text x="20" y="212" font-size="11.5" class="muted">いくつでも</text>
        <text x="20" y="230" font-size="11.5" class="muted">選べる</text>

        <rect x="100" y="52" width="256" height="112" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="118" y="78" font-size="12">ラジオボタン</text>
        <text x="118" y="100" font-size="10.5" class="muted">全部見せたいとき。比較しながら選べる</text>
        <text x="118" y="126" font-size="12">セグメント</text>
        <text x="118" y="148" font-size="10.5" class="muted">表示の切り替えなど、即座に効くもの</text>

        <rect x="368" y="52" width="256" height="112" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="386" y="78" font-size="12">プルダウン</text>
        <text x="386" y="100" font-size="10.5" class="muted">畳んでおきたいとき</text>
        <text x="386" y="126" font-size="12">コンボボックス</text>
        <text x="386" y="148" font-size="10.5" class="muted">絞り込みや自由入力も要るとき</text>

        <rect x="100" y="176" width="256" height="86" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="118" y="202" font-size="12">チェックボックス</text>
        <text x="118" y="224" font-size="10.5" class="muted">並べて全部見せる。単独なら</text>
        <text x="118" y="242" font-size="10.5" class="muted">「同意する」のような二値にも</text>

        <rect x="368" y="176" width="256" height="86" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="386" y="202" font-size="12">複数選択リスト / タグ入力</text>
        <text x="386" y="224" font-size="10.5" class="muted">選んだものを見える形で残す。</text>
        <text x="386" y="242" font-size="10.5" class="muted">解除しやすさも設計に含める</text>

        <text x="20" y="288" font-size="10.5" class="lbl">単一選択にチェックボックスを使わない ― 複数選べてしまい、後段が壊れる</text>
        <text x="20" y="304" font-size="10.5" class="muted">スイッチは「その場で効く」もの、チェックボックスは「送信して効く」もの</text>
      </svg>
    </div>
  </body>
</html>
