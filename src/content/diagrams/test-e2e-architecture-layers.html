<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 360"
        role="img"
        aria-label="E2Eテストのコードを層に分け、書こうとしているものの性質で置き場所が一意に決まることを示した図。左はUIを操作するテストの4層で、上から順にテスト本体、Composable、Page Object、BasePageと並ぶ。テスト本体にはアサーションそのものだけを書き、そこからComposableを呼ぶ。Composableは複数ページ・複数手順にまたがる業務フローを持ち、Page Objectを組み立てて使う。Page Objectは1画面の中の要素取得と単純操作だけを持ち、全画面で共通の土台であるBasePageを継承する。右はUIを介さないAPIテストの2層で、テスト本体がAPI Servicesを呼び、API Servicesが直接APIとデータベースへ向かう。画面の知識が要らないため層が2つで足りている。最下部が最も重要な規律で、アサーションをPage ObjectやComposableに埋め込むと、何を確かめているテストなのかがテスト本体から消えてしまう。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">書こうとしているものの性質で、置き場所が一意に決まる</text>

        <text x="16" y="46" font-size="10.5" class="muted">UIを操作するテスト ― 4層</text>
        <text x="456" y="46" font-size="10.5" class="muted">UIを介さないテスト ― 2層</text>

        <rect x="16" y="56" width="416" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="80" font-size="10.5" class="accent">テスト本体</text>
        <text x="30" y="98" font-size="9" class="muted">アサーションそのものか? → ここにしか書かない</text>

        <line x1="120" y1="110" x2="120" y2="126" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="132" y="123" font-size="8.5" class="muted">業務フローを呼ぶ</text>

        <rect x="16" y="130" width="416" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="154" font-size="10.5">Composable ― 業務フロー</text>
        <text x="30" y="172" font-size="9" class="muted">複数ページ・複数手順にまたがるか? → ここに書く</text>

        <line x1="120" y1="184" x2="120" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="132" y="197" font-size="8.5" class="muted">画面操作を組み立てる</text>

        <rect x="16" y="204" width="416" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="228" font-size="10.5">Page Object ― 画面操作</text>
        <text x="30" y="246" font-size="9" class="muted">1画面の中の単純な操作か? → ここに書く</text>

        <line x1="120" y1="258" x2="120" y2="274" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="132" y="271" font-size="8.5" class="muted">継承する</text>

        <rect x="16" y="278" width="416" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="224" y="303" font-size="10" text-anchor="middle" class="muted">BasePage ― 全画面で共通の土台</text>

        <rect x="456" y="56" width="288" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="80" font-size="10.5">テスト本体</text>
        <text x="470" y="98" font-size="9" class="muted">UIを介さず完結する検証か?</text>

        <line x1="560" y1="110" x2="560" y2="126" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="572" y="123" font-size="8.5" class="muted">HTTPで直接叩く</text>

        <rect x="456" y="130" width="288" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="154" font-size="10.5">API Services</text>
        <text x="470" y="172" font-size="9" class="muted">エンドポイントごとの呼び出しを持つ</text>

        <line x1="560" y1="184" x2="560" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="456" y="204" width="288" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="600" y="229" font-size="10" text-anchor="middle" class="muted">API・DB</text>

        <text x="456" y="272" font-size="9" class="muted">層が2つで足りるのは、画面の知識を</text>
        <text x="456" y="290" font-size="9" class="muted">まったく持たないから。前提データの</text>
        <text x="456" y="308" font-size="9" class="muted">準備も、この系統を使う。</text>

        <line x1="16" y1="334" x2="744" y2="334" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="353" font-size="10.5" class="accent">アサーションを下の層に埋め込まない ― 何を確かめているテストなのかが、テスト本体から消える。</text>
      </svg>
    </div>
  </body>
</html>
