<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 560"
        role="img"
        aria-label="DR/BDRの仕組みの図解。DR/BDRが無い場合は同じセグメント上の全ルーターが互いにネイバーになりLSA交換の本数が組み合わせ分だけ増える。DR/BDRがある場合は各ルーターがDR(代表)とだけネイバーになり、LSAはDRが代表して配るため交換本数がルーター台数分で済む。BDRはDR障害時の予備。"
      >
        <defs>
          <marker
            id="arrowD2"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="5.5"
            markerHeight="5.5"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ DR/BDR無し ============ -->
        <text x="320" y="20" text-anchor="middle" font-size="12.5" font-weight="700">
          DR/BDRが無い場合 ― 全員が全員とネイバーになる
        </text>

        <rect x="60" y="50" width="140" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="77" text-anchor="middle" font-size="12">R1</text>
        <rect x="400" y="50" width="140" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="470" y="77" text-anchor="middle" font-size="12">R2</text>
        <rect x="60" y="180" width="140" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="207" text-anchor="middle" font-size="12">R3</text>
        <rect x="400" y="180" width="140" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="470" y="207" text-anchor="middle" font-size="12">R4</text>

        <line x1="200" y1="72" x2="400" y2="72" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="130" y1="94" x2="130" y2="180" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="470" y1="94" x2="470" y2="180" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="200" y1="202" x2="400" y2="202" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="200" y1="94" x2="400" y2="180" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="400" y1="94" x2="200" y2="180" stroke="var(--muted)" stroke-width="1.3" />

        <text x="320" y="245" text-anchor="middle" font-size="11.5" class="muted">
          4台なら6本の隣接関係が必要 ― 台数が増えるほど爆発的に増える
        </text>

        <line x1="0" y1="280" x2="640" y2="280" stroke="var(--border)" stroke-width="1" />

        <!-- ============ DR/BDR有り ============ -->
        <text x="320" y="308" text-anchor="middle" font-size="12.5" font-weight="700">
          DR/BDRがある場合 ― 全員がDR(代表)とだけネイバーになる
        </text>

        <rect x="60" y="330" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="115" y="355" text-anchor="middle" font-size="12">R1</text>
        <rect x="470" y="330" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="525" y="355" text-anchor="middle" font-size="12">R2</text>
        <rect x="60" y="460" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="115" y="485" text-anchor="middle" font-size="12">R3</text>

        <rect x="245" y="395" width="110" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="300" y="424" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">DR</text>

        <rect x="470" y="460" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="525" y="485" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">BDR</text>

        <line x1="170" y1="355" x2="245" y2="410" stroke="var(--primary)" stroke-width="1.5" />
        <line x1="470" y1="355" x2="355" y2="410" stroke="var(--primary)" stroke-width="1.5" />
        <line x1="170" y1="480" x2="245" y2="435" stroke="var(--primary)" stroke-width="1.5" />
        <line x1="355" y1="430" x2="470" y2="475" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />

        <text x="320" y="530" text-anchor="middle" font-size="11.5" class="muted">
          LSAはDRが代表して配るため、隣接関係は台数分で済む(BDRはDR障害時の予備)
        </text>
      </svg>
    </div>
  </body>
</html>
