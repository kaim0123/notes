<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 312"
        role="img"
        aria-label="セキュリティ対策を、外から来る通信が通る経路の順に並べた図。左から順に、CDNとDDoS対策が量で押し潰す攻撃を吸収し、ファイアウォールがIPとポートで通信を絞り、WAFがHTTPの中身まで見て攻撃のパターンを弾き、アプリケーションが入力検証と認証・認可を行い、最後にデータベースが最小権限と暗号化で守る。この5つの下に、経路の全体へ横断して効く2本の帯がある。1本はログを集めて突き合わせる仕組みで、どの箱の出来事もここに残らなければ無かったことになる。もう1本は更新を当てる・権限を最小にする・要らない口を閉じるという運用で、どの箱にも同じだけ効く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="30" y="48" font-size="10" class="muted">外から来る通信 →</text>

        <rect x="30" y="64" width="120" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="175" y="64" width="120" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="320" y="64" width="120" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="465" y="64" width="120" height="70" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="610" y="64" width="120" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />

        <text x="90" y="92" font-size="11" text-anchor="middle">CDN・DDoS対策</text>
        <text x="235" y="92" font-size="11" text-anchor="middle">ファイアウォール</text>
        <text x="380" y="92" font-size="11" text-anchor="middle">WAF</text>
        <text x="525" y="92" font-size="11" text-anchor="middle" class="accent">アプリケーション</text>
        <text x="670" y="92" font-size="11" text-anchor="middle">データベース</text>

        <text x="90" y="114" font-size="8.5" text-anchor="middle" class="muted">量で潰す攻撃を吸収</text>
        <text x="235" y="114" font-size="8.5" text-anchor="middle" class="muted">IPとポートで絞る</text>
        <text x="380" y="114" font-size="8.5" text-anchor="middle" class="muted">HTTPの中身を見る</text>
        <text x="525" y="114" font-size="8.5" text-anchor="middle" class="muted">入力検証・認証認可</text>
        <text x="670" y="114" font-size="8.5" text-anchor="middle" class="muted">最小権限・暗号化</text>

        <line x1="152" y1="99" x2="171" y2="99" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="297" y1="99" x2="316" y2="99" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="442" y1="99" x2="461" y2="99" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="587" y1="99" x2="606" y2="99" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="30" y="160" width="700" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="380" y="180" font-size="10" text-anchor="middle" class="muted">ログを集めて突き合わせる ― どの箱で起きたことも、ここに残らなければ無かったことになる</text>
        <rect x="30" y="200" width="700" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="380" y="220" font-size="10" text-anchor="middle" class="accent">更新を当てる・権限を最小にする・要らない口を閉じる ― どの箱にも同じだけ効く</text>

        <line x1="16" y1="252" x2="744" y2="252" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="274" font-size="10.5" class="muted">左の4つは通信が通る順に並んでいて、手前ほど広く粗く、奥ほど狭く細かく見る。手前が奥の代わりになることはない。</text>
        <text x="16" y="296" font-size="10.5" class="accent">下の2本は箱ではなく運用。買えば手に入る対策と違い、続けないと効果がその日から落ちていく。</text>
      </svg>
    </div>
  </body>
</html>
