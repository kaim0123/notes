<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="配信網がキャッシュを同じものと見なす条件を示した図。到着したリクエストのうち、キャッシュの鍵として使う要素をあらかじめ決めておき、その要素が一致すれば同じ応答を返す。既定ではパスだけが鍵になるので、問い合わせ文字列やヘッダが違っても同じ応答が返る。ここに利用者ごとに変わる要素、たとえば認証用のヘッダを鍵へ加えると、利用者の数だけ別のキャッシュができてしまい、ほとんど当たらなくなる。逆に、応答が変わる要素を鍵に含め忘れると、別の利用者に向けた応答が誤って配られる。何を鍵にするかは、当たる率と正しさの両方を同時に決める設定になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="200" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="70" font-size="10.5" text-anchor="middle">届いたリクエスト</text>
        <text x="36" y="92" font-size="9" class="mono muted">GET /img/logo.png</text>
        <text x="36" y="110" font-size="9" class="mono muted">?v=2  Accept-Language: ja</text>
        <text x="36" y="128" font-size="9" class="mono muted">Cookie: session=...</text>

        <line x1="226" y1="90" x2="286" y2="90" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="292" y="46" width="200" height="90" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="392" y="70" font-size="10.5" text-anchor="middle">鍵として使う要素だけ</text>
        <text x="392" y="94" font-size="9.5" text-anchor="middle" class="accent">既定はパスだけ</text>
        <text x="392" y="116" font-size="9" text-anchor="middle" class="muted">一致すれば「同じもの」と見なす</text>

        <line x1="498" y1="90" x2="558" y2="90" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="564" y="46" width="176" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="652" y="76" font-size="10.5" text-anchor="middle">同じ応答を返す</text>
        <text x="652" y="100" font-size="9" text-anchor="middle" class="muted">オリジンまで行かない</text>

        <rect x="20" y="168" width="350" height="106" rx="8" fill="none" stroke="var(--border)" />
        <text x="40" y="192" font-size="10.5" class="accent">鍵を増やしすぎると</text>
        <text x="40" y="214" font-size="9.5" class="muted">利用者ごとに変わる要素(セッション等)を含めると、</text>
        <text x="40" y="232" font-size="9.5" class="muted">利用者の数だけ別のキャッシュができる</text>
        <text x="40" y="256" font-size="9.5" class="muted">→ ほとんど当たらず、配信網を置いた意味が消える</text>

        <rect x="390" y="168" width="350" height="106" rx="8" fill="none" stroke="var(--border)" />
        <text x="410" y="192" font-size="10.5" class="accent">鍵が足りないと</text>
        <text x="410" y="214" font-size="9.5" class="muted">応答が変わる要素(言語・認証状態)を外していると、</text>
        <text x="410" y="232" font-size="9.5" class="muted">別の利用者向けの応答が配られる</text>
        <text x="410" y="256" font-size="9.5" class="muted">→ 当たる率ではなく、正しさの問題になる</text>
      </svg>
    </div>
  </body>
</html>
