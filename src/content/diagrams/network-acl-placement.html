<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 380"
        role="img"
        aria-label="標準ACLと拡張ACLの配置場所の違いの図解。標準ACLは送信元IPしか見られないため宛先の近く(R2)に置く必要があり、拡張ACLは送信元・宛先・ポートまで指定できるため送信元の近く(R1)に置いて早い段階で不要な通信を止められる。"
      >
        <defs>
          <marker
            id="arrowP"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ 標準ACL ============ -->
        <text x="360" y="18" text-anchor="middle" font-size="13" font-weight="700">標準ACL ― 宛先の近くに置く</text>

        <rect x="20" y="50" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="65" y="75" text-anchor="middle" font-size="11.5">PC(送信元)</text>
        <rect x="185" y="50" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="225" y="75" text-anchor="middle" font-size="12">R1</text>
        <rect x="390" y="50" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="430" y="75" text-anchor="middle" font-size="12">R2</text>
        <rect x="600" y="50" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="650" y="75" text-anchor="middle" font-size="11.5">サーバー(宛先)</text>

        <line x1="110" y1="70" x2="185" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />
        <line x1="265" y1="70" x2="390" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />
        <line x1="470" y1="70" x2="600" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />

        <polygon points="520,55 545,70 520,85 495,70" fill="var(--primary)" />
        <text x="520" y="105" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--primary)">標準ACL</text>

        <text x="360" y="140" text-anchor="middle" font-size="11.5" class="muted">
          送信元IPしか見られない ― 宛先の近く(R2)に置かないと他の宛先への通信まで巻き添えにする
        </text>

        <line x1="0" y1="165" x2="720" y2="165" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 拡張ACL ============ -->
        <text x="360" y="192" text-anchor="middle" font-size="13" font-weight="700">拡張ACL ― 送信元の近くに置く</text>

        <rect x="20" y="222" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="65" y="247" text-anchor="middle" font-size="11.5">PC(送信元)</text>
        <rect x="185" y="222" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="225" y="247" text-anchor="middle" font-size="12">R1</text>
        <rect x="390" y="222" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="430" y="247" text-anchor="middle" font-size="12">R2</text>
        <rect x="600" y="222" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="650" y="247" text-anchor="middle" font-size="11.5">サーバー(宛先)</text>

        <polygon points="140,227 165,242 140,257 115,242" fill="var(--primary)" />
        <text x="140" y="277" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--primary)">拡張ACL</text>

        <line x1="110" y1="242" x2="115" y2="242" stroke="var(--fg)" stroke-width="1.5" />
        <line x1="165" y1="242" x2="185" y2="242" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />
        <line x1="265" y1="242" x2="390" y2="242" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />
        <line x1="470" y1="242" x2="600" y2="242" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowP)" />

        <text x="360" y="315" text-anchor="middle" font-size="11.5" class="muted">
          送信元・宛先・ポートまで指定できる ― 送信元の近く(R1)で止めても他の通信を巻き込まない
        </text>
      </svg>
    </div>
  </body>
</html>
