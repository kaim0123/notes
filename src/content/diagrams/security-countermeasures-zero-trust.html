<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 312"
        role="img"
        aria-label="境界型の守りとゼロトラストの違いを左右で比べた図。左は境界型で、社内ネットワークという1つの大きな枠の内側に業務PC・ファイルサーバー・データベースが置かれている。枠の外から1台が乗っ取られると、内側では検査が行われないため、そこから横へ自由に動けてしまう。右はゼロトラストで、内側と外側の区別をやめ、利用者と個々の資源のあいだに検査点を置く。利用者からアプリ・ファイル・データベースへ向かうどの通信も、毎回そこで認証と認可を受ける。守る位置が、ネットワークの外周から資源のひとつ手前へ移っている。"
      >
        <defs>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <line x1="375" y1="28" x2="375" y2="240" stroke="var(--border)" stroke-width="1" />

        <text x="190" y="42" font-size="11" text-anchor="middle" class="muted">境界型 ― 内側は信用する</text>
        <rect x="40" y="60" width="300" height="150" rx="8" fill="none" stroke="var(--border)" stroke-width="1.4" />
        <text x="190" y="80" font-size="9.5" text-anchor="middle" class="muted">社内ネットワーク</text>
        <rect x="60" y="120" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="155" y="120" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="250" y="120" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="95" y="144" font-size="9" text-anchor="middle" class="muted">業務PC</text>
        <text x="190" y="144" font-size="9" text-anchor="middle" class="muted">ファイル</text>
        <text x="285" y="144" font-size="9" text-anchor="middle" class="muted">DB</text>
        <line x1="46" y1="96" x2="88" y2="116" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="100" y="104" font-size="9" class="accent">1台入られると</text>
        <line x1="132" y1="140" x2="151" y2="140" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <line x1="227" y1="140" x2="246" y2="140" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="190" y="186" font-size="9.5" text-anchor="middle" class="accent">内側に検査がないので、横へ自由に動ける</text>

        <text x="570" y="42" font-size="11" text-anchor="middle" class="accent">ゼロトラスト ― 毎回確かめる</text>
        <rect x="400" y="120" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="435" y="144" font-size="9" text-anchor="middle" class="muted">利用者</text>
        <rect x="505" y="100" width="80" height="80" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="545" y="134" font-size="9.5" text-anchor="middle" class="accent">毎回</text>
        <text x="545" y="152" font-size="9.5" text-anchor="middle" class="accent">認証・認可</text>
        <rect x="630" y="88" width="80" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="630" y="128" width="80" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="630" y="168" width="80" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="670" y="109" font-size="9" text-anchor="middle" class="muted">アプリ</text>
        <text x="670" y="149" font-size="9" text-anchor="middle" class="muted">ファイル</text>
        <text x="670" y="189" font-size="9" text-anchor="middle" class="muted">DB</text>
        <line x1="472" y1="140" x2="501" y2="140" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="587" y1="136" x2="626" y2="107" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="587" y1="140" x2="626" y2="145" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="587" y1="144" x2="626" y2="183" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="570" y="222" font-size="9.5" text-anchor="middle" class="muted">内側・外側の区別をやめ、資源のひとつ手前で確かめる</text>

        <line x1="16" y1="252" x2="744" y2="252" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="274" font-size="10.5" class="muted">境界型が崩れたのは、守るものが社内から出ていったから。クラウドと持ち出し端末の前では「内側」が定義できない。</text>
        <text x="16" y="296" font-size="10.5" class="accent">ゼロトラストは製品名ではなく置き場所の変更 ― 検査点を外周から、資源のひとつ手前へ動かすこと。</text>
      </svg>
    </div>
  </body>
</html>
