<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --warn: oklch(0.82 0.16 75);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .warn { fill: var(--warn); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="1つのミドルウェアが取りうる4つの結末を示した図。中央左にミドルウェアの箱があり、そこから4本の道が右へ分かれる。1本目は次を呼ぶ道で、パイプラインの次の段へ進む。2本目は応答を返して次を呼ばない道で、そこで処理が正しく打ち切られる。認証で弾く場合がこれにあたる。3本目はエラーを渡す道で、通常の段をすべて飛ばして、まとめて受け止める段へ一気に移る。4本目は、そのどれもしなかった場合で、リクエストは次へ進まず応答も返らないまま、ただ止まる。呼び出した側から見ると、エラーですらなく、ただ返事が来ない状態になる。この4本目だけが赤で示され、書くときは残り3本のいずれかを必ず通ることを確かめる、という注意が下部に置かれている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
          <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--warn)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">1つのミドルウェアが取りうる結末は、4つしかない</text>

        <rect x="16" y="110" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="34" y="146" font-size="11">ミドルウェア</text>

        <line x1="156" y1="122" x2="222" y2="62" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <rect x="226" y="42" width="200" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="240" y="60" font-size="10" class="mono lbl">next()</text>
        <text x="240" y="75" font-size="9" class="muted">次の段へ進む</text>

        <line x1="156" y1="134" x2="222" y2="110" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <rect x="226" y="92" width="200" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="240" y="110" font-size="10" class="mono lbl">res.json(...)</text>
        <text x="240" y="125" font-size="9" class="muted">ここで正しく打ち切る(認証で弾くなど)</text>

        <line x1="156" y1="146" x2="222" y2="160" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <rect x="226" y="142" width="200" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="240" y="160" font-size="10" class="mono lbl">next(err)</text>
        <text x="240" y="175" font-size="9" class="muted">通常の段を飛ばして、受け止める段へ</text>

        <line x1="156" y1="158" x2="222" y2="212" stroke="var(--warn)" stroke-width="1.4" marker-end="url(#arw)" />
        <rect x="226" y="192" width="200" height="38" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="1.6" />
        <text x="240" y="210" font-size="10" class="warn">そのどれもしない</text>
        <text x="240" y="225" font-size="9" class="muted">次へ進まず、応答も返らない</text>

        <line x1="426" y1="61" x2="470" y2="61" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="478" y="65" font-size="9.5" class="muted">続く</text>
        <line x1="426" y1="111" x2="470" y2="111" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="478" y="115" font-size="9.5" class="muted">終わる</text>
        <line x1="426" y1="161" x2="470" y2="161" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="478" y="165" font-size="9.5" class="muted">終わる</text>
        <line x1="426" y1="211" x2="470" y2="211" stroke="var(--warn)" stroke-width="1.2" marker-end="url(#arw)" />
        <text x="478" y="215" font-size="9.5" class="warn">ただ、止まる</text>

        <line x1="16" y1="256" x2="624" y2="256" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="280" font-size="10.5" class="warn">4本目が厄介なのは、エラーにすらならないこと。</text>
        <text x="16" y="302" font-size="10.5" class="muted">呼び出した側から見ると「返事が来ない」だけで、原因がどこにあるか手がかりが残らない。</text>
      </svg>
    </div>
  </body>
</html>
