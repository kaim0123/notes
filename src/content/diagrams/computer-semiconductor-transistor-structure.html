<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="トランジスタの構造をプリンにたとえた断面図。プリン本体がp型半導体で、その上面の離れた2箇所にカラメルにあたるn型半導体が埋め込まれている。2つのn型の中間の真上にあるゲートにプラスを近づけると、表面にマイナスの電子が並んで道ができ、左右のn型のあいだに電気が流れる。" viewBox="0 0 560 260">

      <path d="M120,120 Q120,90 160,90 L400,90 Q440,90 440,120 L430,210 Q430,225 400,225 L160,225 Q130,225 130,210 Z" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="280" y="185" fill="var(--fg)" font-size="14" text-anchor="middle">プリン本体 = p型(プラス)</text>


      <rect x="150" y="90" width="70" height="16" fill="#ffb43c" fill-opacity="0.25" stroke="#ffb43c" stroke-width="1.5" />
      <text x="185" y="80" fill="#ffb43c" font-size="12" text-anchor="middle">カラメル(n型)</text>

      <rect x="340" y="90" width="70" height="16" fill="#ffb43c" fill-opacity="0.25" stroke="#ffb43c" stroke-width="1.5" />
      <text x="375" y="80" fill="#ffb43c" font-size="12" text-anchor="middle">カラメル(n型)</text>


      <rect x="255" y="92" width="50" height="12" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <line x1="280" y1="92" x2="280" y2="55" stroke="var(--primary)" stroke-width="1.5" />
      <text x="280" y="45" fill="var(--primary)" font-size="13" text-anchor="middle">＋ を近づける(ゲート)</text>


      <g fill="var(--primary)">
      <circle cx="228" cy="112" r="2.5" /><circle cx="248" cy="112" r="2.5" /><circle cx="268" cy="112" r="2.5" />
      <circle cx="288" cy="112" r="2.5" /><circle cx="308" cy="112" r="2.5" /><circle cx="328" cy="112" r="2.5" />
      </g>
      <text x="280" y="135" fill="var(--muted)" font-size="11" text-anchor="middle">マイナスの電子が表面に並んで「道」になる</text>


      <line x1="150" y1="98" x2="110" y2="98" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="450" y1="98" x2="410" y2="98" stroke="var(--muted)" stroke-width="1.5" />
      <text x="90" y="102" fill="var(--muted)" font-size="11" text-anchor="middle">左</text>
      <text x="470" y="102" fill="var(--muted)" font-size="11" text-anchor="middle">右</text>
      </svg>
    </div>
  </body>
</html>
