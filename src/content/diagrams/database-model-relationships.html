<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="テーブル同士の関連を1対1・1対多・多対多の3パターンで比較した図解。1対1はusersとuser_profilesがUNIQUEな外部キーで1本につながる。1対多はcustomersが複数のordersを持ち、customers側の主キーがordersに外部キーとして入る。多対多はordersとproductsの間に中間テーブルorder_itemsを挟み、2本の1対多に分解する。"
      >
        <defs>
          <marker id="arrowM2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <!-- 列の区切り線 -->
        <line x1="253" y1="10" x2="253" y2="330" stroke="var(--border)" stroke-width="1" />
        <line x1="507" y1="10" x2="507" y2="330" stroke="var(--border)" stroke-width="1" />

        <!-- 列1: 1対1 -->
        <text x="126" y="26" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">1対1</text>

        <rect x="46" y="50" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="126" y="77" text-anchor="middle" font-size="12.5" font-weight="600">users</text>

        <rect x="46" y="196" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="126" y="223" text-anchor="middle" font-size="12.5" font-weight="600">user_profiles</text>

        <path d="M126,94 L126,196" stroke="var(--muted)" stroke-width="1.4" fill="none" />
        <text x="139" y="110" font-size="11" class="muted">1</text>
        <text x="139" y="192" font-size="11" class="muted">1</text>
        <text x="126" y="145" text-anchor="middle" font-size="10.5" class="muted">UNIQUEな</text>
        <text x="126" y="159" text-anchor="middle" font-size="10.5" class="muted">外部キー</text>

        <!-- 列2: 1対多 -->
        <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">1対多</text>

        <rect x="300" y="50" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="77" text-anchor="middle" font-size="12.5" font-weight="600">customers</text>

        <rect x="310" y="180" width="140" height="30" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="200" text-anchor="middle" font-size="11">orders #1</text>
        <rect x="310" y="220" width="140" height="30" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="240" text-anchor="middle" font-size="11">orders #2</text>
        <rect x="310" y="260" width="140" height="30" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="280" text-anchor="middle" font-size="11">orders #3</text>

        <path d="M380,94 L380,195" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM2)" />
        <path d="M380,94 L380,235" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM2)" />
        <path d="M380,94 L380,275" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM2)" />
        <text x="393" y="112" font-size="11" class="muted">1</text>
        <text x="393" y="292" font-size="11" class="muted">N</text>
        <text x="380" y="140" text-anchor="middle" font-size="10.5" class="muted">ordersに</text>
        <text x="380" y="154" text-anchor="middle" font-size="10.5" class="muted">customer_idを持たせる</text>

        <!-- 列3: 多対多 -->
        <text x="633" y="26" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">多対多</text>

        <rect x="524" y="50" width="100" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="574" y="75" text-anchor="middle" font-size="12">orders</text>

        <rect x="644" y="50" width="100" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="694" y="75" text-anchor="middle" font-size="12">products</text>

        <rect x="559" y="190" width="170" height="54" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="644" y="212" text-anchor="middle" font-size="12" font-weight="700" style="fill: var(--primary)">order_items</text>
        <text x="644" y="230" text-anchor="middle" font-size="10.5" class="muted">(中間テーブル)</text>

        <path d="M574,90 L574,140 L644,190" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM2)" />
        <path d="M694,90 L694,140 L644,190" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM2)" />
        <text x="574" y="115" font-size="11" class="muted">1</text>
        <text x="694" y="115" font-size="11" class="muted">1</text>
        <text x="600" y="182" font-size="11" class="muted">N</text>
        <text x="672" y="182" font-size="11" class="muted">N</text>

        <text x="644" y="270" text-anchor="middle" font-size="10.5" class="muted">order_idとproduct_idの</text>
        <text x="644" y="284" text-anchor="middle" font-size="10.5" class="muted">組を1行として持つ</text>

        <text x="380" y="320" text-anchor="middle" font-size="11" class="muted">
          多対多だけは中間テーブルを挟み、2本の1対多に分解する
        </text>
      </svg>
    </div>
  </body>
</html>
