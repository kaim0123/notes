<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="主キーと外部キーの関係を示す図解。customersテーブルはidを主キーとして持つ。ordersテーブルはcustomer_id列を外部キーとして持ち、customersのidを参照する。この参照によって、存在しない顧客IDの注文は作れないという整合性がDBMS自身によって保証される。"
      >
        <defs>
          <marker
            id="arrowPrimary"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- customers table -->
        <g>
          <rect x="40" y="40" width="270" height="34" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
          <text x="175" y="62" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">customers</text>

          <rect x="40" y="74" width="270" height="150" fill="var(--card)" stroke="var(--border)" />
          <path d="M40,224 h270" stroke="var(--border)" />

          <line x1="40" y1="104" x2="310" y2="104" stroke="var(--border)" />
          <line x1="40" y1="134" x2="310" y2="134" stroke="var(--border)" />
          <line x1="40" y1="164" x2="310" y2="164" stroke="var(--border)" />
          <line x1="40" y1="194" x2="310" y2="194" stroke="var(--border)" />

          <circle cx="58" cy="89" r="5" fill="var(--primary)" />
          <text x="72" y="93" font-size="12" font-weight="600">id</text>
          <text x="298" y="93" text-anchor="end" font-size="10.5" class="muted">PK</text>

          <text x="58" y="123" font-size="12">name</text>
          <text x="298" y="123" text-anchor="end" font-size="10.5" class="muted">NOT NULL</text>

          <text x="58" y="153" font-size="12">email</text>
          <text x="298" y="153" text-anchor="end" font-size="10.5" class="muted">UNIQUE</text>

          <text x="58" y="183" font-size="12">created_at</text>
          <text x="298" y="183" text-anchor="end" font-size="10.5" class="muted">DEFAULT</text>
        </g>

        <!-- orders table -->
        <g>
          <rect x="450" y="40" width="270" height="34" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="585" y="62" text-anchor="middle" font-size="13" font-weight="700">orders</text>

          <rect x="450" y="74" width="270" height="150" fill="var(--card)" stroke="var(--border)" />
          <path d="M450,224 h270" stroke="var(--border)" />

          <line x1="450" y1="104" x2="720" y2="104" stroke="var(--border)" />
          <line x1="450" y1="134" x2="720" y2="134" stroke="var(--border)" />
          <line x1="450" y1="164" x2="720" y2="164" stroke="var(--border)" />
          <line x1="450" y1="194" x2="720" y2="194" stroke="var(--border)" />

          <circle cx="468" cy="89" r="5" fill="var(--primary)" />
          <text x="482" y="93" font-size="12" font-weight="600">id</text>
          <text x="708" y="93" text-anchor="end" font-size="10.5" class="muted">PK</text>

          <circle cx="468" cy="119" r="5" fill="none" stroke="var(--primary)" stroke-width="1.6" />
          <text x="482" y="123" font-size="12" font-weight="600">customer_id</text>
          <text x="708" y="123" text-anchor="end" font-size="10.5" style="fill: var(--primary)">FK</text>

          <text x="468" y="153" font-size="12">total_price</text>
          <text x="708" y="153" text-anchor="end" font-size="10.5" class="muted">CHECK</text>

          <text x="468" y="183" font-size="12">ordered_at</text>
          <text x="708" y="183" text-anchor="end" font-size="10.5" class="muted">DEFAULT</text>
        </g>

        <!-- FK -> PK reference -->
        <path
          d="M450,119 C 390,119 390,89 310,89"
          fill="none"
          stroke="var(--primary)"
          stroke-width="1.6"
          marker-end="url(#arrowPrimary)"
        />
        <text x="380" y="76" text-anchor="middle" font-size="11" style="fill: var(--primary)">参照(FK → PK)</text>

        <text x="380" y="260" text-anchor="middle" font-size="11" class="muted">
          orders.customer_id は customers.id を参照する外部キー
        </text>
        <text x="380" y="278" text-anchor="middle" font-size="11" class="muted">
          存在しない顧客IDを持つ注文は作れない(参照整合性)
        </text>
      </svg>
    </div>
  </body>
</html>
