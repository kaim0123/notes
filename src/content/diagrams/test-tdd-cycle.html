<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="テスト駆動開発の3つのステップが循環する様子を示した図。上にRedがあり、これから作る振る舞いのテストを先に書く段階で、実装がないので必ず失敗する。そこから右下のGreenへ矢印が伸び、テストを通す最小限の実装を書く段階で、ベタ書きで構わない。Greenから左下のRefactorへ矢印が伸び、緑のまま設計を整える段階になる。Refactorから再び上のRedへ矢印が戻り、次の振る舞いへ進む。円の中心には1周は数分と記されている。Refactorの枠だけが強調され、実務で最も省略されやすく、ここを飛ばすとテスト駆動開発は動くが汚いコードを高速に量産する手法になってしまうことが図の下部に記されている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="235" y="48" width="170" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="72" font-size="11.5" text-anchor="middle">Red ― 先にテストを書く</text>
        <text x="320" y="92" font-size="9" text-anchor="middle" class="muted">実装がないので落ちる。落ちる姿を必ず見る</text>

        <rect x="430" y="180" width="170" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="515" y="204" font-size="11.5" text-anchor="middle">Green ― 通す最小限</text>
        <text x="515" y="224" font-size="9" text-anchor="middle" class="muted">ベタ書きでよい。美しさは次の工程で</text>

        <rect x="40" y="180" width="170" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="125" y="204" font-size="11.5" text-anchor="middle" class="accent">Refactor ― 緑のまま整える</text>
        <text x="125" y="224" font-size="9" text-anchor="middle" class="muted">実務で最も省略される工程</text>

        <line x1="400" y1="106" x2="470" y2="174" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="424" y1="212" x2="216" y2="212" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="132" y1="174" x2="242" y2="108" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <text x="430" y="146" font-size="9" class="muted">通す実装を書く</text>
        <text x="320" y="204" font-size="9" text-anchor="middle" class="muted">テストは緑のまま</text>
        <text x="132" y="146" font-size="9" class="muted">次の振る舞いへ</text>

        <text x="320" y="160" font-size="10.5" text-anchor="middle" class="accent">1周は数分</text>

        <line x1="16" y1="258" x2="624" y2="258" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="278" font-size="10.5" class="muted">Redを飛ばすと、書き間違えて常に成功しているテストに気付けない。落ちる姿の確認はテスト自体の検証。</text>
        <text x="16" y="296" font-size="10.5" class="accent">Refactorを飛ばすと、TDDは「動くが汚いコードを高速に量産する手法」になる。</text>
      </svg>
    </div>
  </body>
</html>
