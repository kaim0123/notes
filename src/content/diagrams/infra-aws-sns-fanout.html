<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="1つの出来事を複数の処理へ広げる組み合わせを示した図。注文が確定したという出来事を発行すると、購読しているすべての宛先へ同じ内容が配られる。それぞれの宛先をキューにしておくと、受け手は自分の速さで取りに行けるうえ、失敗しても再配達されるため取りこぼしが起きない。通知だけを直接受け手に送る形では、受け手が落ちている間の分は失われるが、キューを挟めばその間も溜まる。購読ごとに条件を付ければ、必要な種類の出来事だけを受け取ることもできる。後から受け手を足すときも、発行する側の変更は要らない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="110" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="90" y="136" font-size="10.5" text-anchor="middle">注文が確定した</text>
        <text x="90" y="156" font-size="9" text-anchor="middle" class="muted">発行するのは1回だけ</text>

        <line x1="166" y1="140" x2="216" y2="140" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="222" y="110" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="282" y="136" font-size="10.5" text-anchor="middle">話題</text>
        <text x="282" y="156" font-size="9" text-anchor="middle" class="muted">宛先は知らない</text>

        <line x1="348" y1="126" x2="398" y2="70" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="348" y1="140" x2="398" y2="140" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="348" y1="154" x2="398" y2="210" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="404" y="46" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="459" y="66" font-size="9.5" text-anchor="middle">キュー</text>
        <text x="459" y="82" font-size="8.5" text-anchor="middle" class="muted">在庫を減らす</text>
        <rect x="404" y="116" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="459" y="136" font-size="9.5" text-anchor="middle">キュー</text>
        <text x="459" y="152" font-size="8.5" text-anchor="middle" class="muted">メールを送る</text>
        <rect x="404" y="186" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="459" y="206" font-size="9.5" text-anchor="middle">キュー</text>
        <text x="459" y="222" font-size="8.5" text-anchor="middle" class="muted">集計に足す</text>

        <line x1="520" y1="69" x2="560" y2="69" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="139" x2="560" y2="139" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="209" x2="560" y2="209" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="566" y="46" width="174" height="46" rx="6" fill="none" stroke="var(--border)" />
        <text x="653" y="74" font-size="9.5" text-anchor="middle" class="muted">それぞれの受け手</text>
        <rect x="566" y="116" width="174" height="46" rx="6" fill="none" stroke="var(--border)" />
        <text x="653" y="144" font-size="9.5" text-anchor="middle" class="muted">自分の速さで取りに行く</text>
        <rect x="566" y="186" width="174" height="46" rx="6" fill="none" stroke="var(--border)" />
        <text x="653" y="214" font-size="9.5" text-anchor="middle" class="muted">失敗すれば再配達される</text>

        <text x="20" y="264" font-size="10.5" class="accent">キューを1枚挟むだけで、受け手が落ちている間の分も失われなくなる。</text>
        <text x="20" y="286" font-size="10.5" class="muted">後から受け手を足すときも、発行する側は何も変えなくてよい ― つなぎ方が外に出ているから。</text>
      </svg>
    </div>
  </body>
</html>
