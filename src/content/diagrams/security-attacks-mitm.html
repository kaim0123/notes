<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="中間者攻撃の成立の仕方を、正常な通信と割り込まれた通信の2段で比べた図。上段は正常な状態で、利用者とサーバーが直接つながり、サーバーの証明書を確かめてから鍵を交換している。下段は割り込まれた状態で、利用者と攻撃者、攻撃者とサーバーという2本の別々の暗号化された通信に分かれている。利用者が受け取っているのは攻撃者の証明書であり、攻撃者はサーバーとは本物の証明書でつながっている。2本とも暗号化されているため利用者側の鍵マークは正常に見えるが、つなぎ目にあたる攻撃者の位置では中身が平文で見えてしまう。これは、証明書の警告を利用者が無視したときに成立する。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="40" y="50" font-size="10.5" class="muted">① 正しくつながっている</text>
        <rect x="40" y="64" width="110" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="95" y="88" font-size="11" text-anchor="middle">利用者</text>
        <rect x="490" y="64" width="110" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="545" y="88" font-size="11" text-anchor="middle">サーバー</text>
        <line x1="152" y1="83" x2="486" y2="83" stroke="var(--muted)" stroke-width="1.3" />
        <text x="320" y="76" font-size="9.5" text-anchor="middle" class="muted">サーバーの証明書を確かめてから鍵を交換する</text>

        <text x="40" y="156" font-size="10.5" class="accent">② 途中に割り込まれている</text>
        <rect x="40" y="170" width="110" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="95" y="194" font-size="11" text-anchor="middle">利用者</text>
        <rect x="265" y="170" width="110" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="194" font-size="11" text-anchor="middle" class="accent">攻撃者</text>
        <rect x="490" y="170" width="110" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="545" y="194" font-size="11" text-anchor="middle">サーバー</text>
        <line x1="152" y1="189" x2="261" y2="189" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="377" y1="189" x2="486" y2="189" stroke="var(--muted)" stroke-width="1.3" />
        <text x="206" y="182" font-size="9" text-anchor="middle" class="muted">攻撃者の証明書</text>
        <text x="431" y="182" font-size="9" text-anchor="middle" class="muted">本物の証明書</text>
        <text x="320" y="226" font-size="9.5" text-anchor="middle" class="accent">2本とも暗号化されている。つなぎ目のここだけ、中身が平文で見える。</text>

        <line x1="16" y1="246" x2="624" y2="246" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="268" font-size="10.5" class="muted">利用者の画面には鍵マークが出る。暗号化されているかどうかと、相手が本物かどうかは別の問いだから。</text>
        <text x="16" y="290" font-size="10.5" class="accent">この攻撃が成立する条件は、証明書の警告を人が無視すること。だから警告を「押せば消える窓」にしない。</text>
      </svg>
    </div>
  </body>
</html>
