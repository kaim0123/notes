<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="制御された入力と非制御の入力を比べた図。上段の制御された入力では、利用者がキーを押すたびに変更イベントが発生してReactのstateが更新され、その値が入力欄へ戻される。1文字ごとに再描画が走るが、値は常にReact側にあるため入力の途中でも他の表示と連動できる。下段の非制御の入力では、キー入力はDOMの中だけで完結しReactは何も知らない。送信のタイミングでrefを通じて値を読み出す。再描画は起きないが、入力の途中で値を使うことはできない。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="28" font-size="11.5" class="lbl">制御された入力 ― 値の本体は state</text>
        <rect x="20" y="42" width="130" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="85" y="73" text-anchor="middle" font-size="11">入力欄</text>
        <line x1="150" y1="56" x2="240" y2="56" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="195" y="48" text-anchor="middle" font-size="9.5" class="lbl">onChange</text>
        <rect x="244" y="42" width="130" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="309" y="73" text-anchor="middle" font-size="11" class="lbl">state</text>
        <path d="M244 82 L150 82" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="197" y="98" text-anchor="middle" font-size="9.5" class="lbl">value</text>

        <line x1="374" y1="68" x2="404" y2="68" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="408" y="42" width="212" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="424" y="64" font-size="10.5" class="muted">1文字ごとに再描画</text>
        <text x="424" y="84" font-size="10.5" class="muted">途中の値で他の表示と連動できる</text>

        <line x1="20" y1="128" x2="620" y2="128" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="156" font-size="11.5" class="muted">非制御の入力 ― 値の本体は DOM</text>
        <rect x="20" y="170" width="130" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="85" y="194" text-anchor="middle" font-size="11">入力欄</text>
        <text x="85" y="212" text-anchor="middle" font-size="9.5" class="muted">値はここに溜まる</text>

        <text x="195" y="188" text-anchor="middle" font-size="9.5" class="muted">Reactは</text>
        <text x="195" y="204" text-anchor="middle" font-size="9.5" class="muted">何も知らない</text>

        <line x1="150" y1="240" x2="240" y2="240" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="195" y="258" text-anchor="middle" font-size="9.5" class="muted">送信時に ref で読む</text>
        <rect x="244" y="218" width="130" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="309" y="245" text-anchor="middle" font-size="11" class="muted">送信処理</text>

        <rect x="408" y="170" width="212" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="424" y="192" font-size="10.5" class="muted">再描画は起きない</text>
        <text x="424" y="212" font-size="10.5" class="muted">途中の値は使えない</text>

        <text x="20" y="288" font-size="10.5" class="lbl">1つのフォームで混ぜてよい ― 途中経過が要る項目だけ制御する</text>
      </svg>
    </div>
  </body>
</html>
