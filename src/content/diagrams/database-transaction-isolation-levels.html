<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .safe {
        fill: var(--primary);
      }
      .risk {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="分離レベルごとに起きる副作用の比較表。縦軸はダーティリード・反復不能読取り・ファントムリードの3つの副作用、横軸はRead Uncommitted・Read Committed・Repeatable Read・Serializableの4段階。Read Uncommittedは3つとも起こりうる。Read Committedはダーティリードのみ防げる。Repeatable Readはダーティリードと反復不能読取りを防げる。Serializableは3つとも防げる。段階が上がるほど防げる副作用が1つずつ増える。"
      >
        <!-- 列ヘッダー -->
        <rect x="10" y="14" width="170" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="47" text-anchor="middle" font-size="11" class="muted">副作用 ＼ 分離レベル</text>

        <rect x="190" y="14" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="260" y="36" text-anchor="middle" font-size="11" font-weight="600">Read</text>
        <text x="260" y="52" text-anchor="middle" font-size="11" font-weight="600">Uncommitted</text>

        <rect x="335" y="14" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="405" y="36" text-anchor="middle" font-size="11" font-weight="600">Read</text>
        <text x="405" y="52" text-anchor="middle" font-size="11" font-weight="600">Committed</text>

        <rect x="480" y="14" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="550" y="36" text-anchor="middle" font-size="11" font-weight="600">Repeatable</text>
        <text x="550" y="52" text-anchor="middle" font-size="11" font-weight="600">Read</text>

        <rect x="625" y="14" width="130" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="690" y="47" text-anchor="middle" font-size="12" font-weight="700" style="fill: var(--primary)">Serializable</text>

        <!-- 行: ダーティリード -->
        <rect x="10" y="80" width="170" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="118" text-anchor="middle" font-size="12" font-weight="600">ダーティリード</text>

        <rect x="190" y="80" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="260" y="122" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="335" y="80" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="405" y="122" text-anchor="middle" font-size="22" class="safe">○</text>

        <rect x="480" y="80" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="550" y="122" text-anchor="middle" font-size="22" class="safe">○</text>

        <rect x="625" y="80" width="130" height="66" fill="none" stroke="var(--border)" />
        <text x="690" y="122" text-anchor="middle" font-size="22" class="safe">○</text>

        <!-- 行: 反復不能読取り -->
        <rect x="10" y="152" width="170" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="190" text-anchor="middle" font-size="12" font-weight="600">反復不能読取り</text>

        <rect x="190" y="152" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="260" y="194" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="335" y="152" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="405" y="194" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="480" y="152" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="550" y="194" text-anchor="middle" font-size="22" class="safe">○</text>

        <rect x="625" y="152" width="130" height="66" fill="none" stroke="var(--border)" />
        <text x="690" y="194" text-anchor="middle" font-size="22" class="safe">○</text>

        <!-- 行: ファントムリード -->
        <rect x="10" y="224" width="170" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="262" text-anchor="middle" font-size="12" font-weight="600">ファントムリード</text>

        <rect x="190" y="224" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="260" y="266" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="335" y="224" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="405" y="266" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="480" y="224" width="140" height="66" fill="none" stroke="var(--border)" />
        <text x="550" y="266" text-anchor="middle" font-size="22" class="risk">×</text>

        <rect x="625" y="224" width="130" height="66" fill="none" stroke="var(--border)" />
        <text x="690" y="266" text-anchor="middle" font-size="22" class="safe">○</text>

        <text x="380" y="308" text-anchor="middle" font-size="11" class="muted">
          ○ = 防げる(起きない) ／ × = 起こりうる。段階が上がるほど○が1つずつ増える
        </text>
      </svg>
    </div>
  </body>
</html>
