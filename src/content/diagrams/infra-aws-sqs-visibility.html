<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="キューから取り出したメッセージが、処理中は他から見えなくなる仕組みを示した図。受け手がメッセージを取り出すと、そのメッセージは一定時間だけ隠され、他の受け手には配られない。この間に処理を終えて削除の指示を出せば、メッセージは消えて完了する。時間内に削除されなければ、処理に失敗したか受け手が落ちたと見なされ、メッセージは再び見えるようになって別の受け手へ配られる。この再配達が何度も繰り返されると先へ進めないため、決めた回数を超えたものは退避用の別のキューへ送り、そこを調べれば失敗した内容だけを確認できるようにする。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="140" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="90" y="88" font-size="10.5" text-anchor="middle">キュー</text>
        <text x="90" y="110" font-size="9" text-anchor="middle" class="muted">溜まっている</text>

        <line x1="166" y1="95" x2="216" y2="95" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="191" y="84" font-size="9" text-anchor="middle" class="muted">取り出す</text>

        <rect x="222" y="60" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="322" y="86" font-size="10.5" text-anchor="middle">処理中は隠される</text>
        <text x="322" y="108" font-size="9" text-anchor="middle" class="muted">他の受け手には配られない</text>

        <line x1="428" y1="80" x2="486" y2="66" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="492" y="40" width="248" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="616" y="60" font-size="10.5" text-anchor="middle">時間内に削除 → 完了</text>
        <text x="616" y="78" font-size="9" text-anchor="middle" class="muted">メッセージは消える</text>

        <line x1="428" y1="112" x2="486" y2="128" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="492" y="104" width="248" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="616" y="124" font-size="10.5" text-anchor="middle">時間切れ → 再び見えるようになる</text>
        <text x="616" y="142" font-size="9" text-anchor="middle" class="muted">別の受け手へ配られる</text>

        <path d="M616,152 L616,180 L90,180 L90,136" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="350" y="174" font-size="9.5" text-anchor="middle" class="muted">受け手が落ちても、メッセージは失われない</text>

        <rect x="20" y="200" width="720" height="82" rx="8" fill="none" stroke="var(--border)" />
        <text x="36" y="224" font-size="10.5" class="accent">同じものが何度も戻ってくると、キュー全体が先へ進まなくなる。</text>
        <text x="36" y="246" font-size="10.5" class="muted">だから決めた回数を超えたものは、退避用の別のキューへ送る ― そこを見れば失敗だけを調べられる。</text>
        <text x="36" y="268" font-size="10.5" class="muted">隠す時間は「処理にかかる時間より長く」設定する。短すぎると、処理中にもう一度配られる。</text>
      </svg>
    </div>
  </body>
</html>
