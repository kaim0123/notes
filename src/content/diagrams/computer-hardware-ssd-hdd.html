<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 380"
        role="img"
        aria-label="SSDとHDDのアクセス方式を比較した図解。SSDはコントローラから全セルへ配線が直接つながっており、どのセルも同程度の速さで読み書きできる。HDDはアームがまず目的のトラックまで半径方向に移動し(シーク)、続いてプラッタが回転して目的のセクタがヘッドの真下に来るのを待つ(回転待ち)という2段階の物理的な移動が必要になる。"
      >
        <defs>
          <marker
            id="arrowC"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ SSD ============ -->
        <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700">SSD ― 電気的に直接アドレス指定</text>

        <rect x="30" y="55" width="90" height="50" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="76" text-anchor="middle" font-size="11.5" font-weight="600">コントローラ</text>
        <text x="75" y="92" text-anchor="middle" font-size="10" class="muted">アドレス指定</text>

        <!-- flash cells: 4 x 2 grid -->
        <!-- row1 -->
        <rect x="200" y="30" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <rect x="270" y="30" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <rect x="340" y="30" width="55" height="40" rx="6" fill="var(--primary)" />
        <rect x="410" y="30" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <!-- row2 -->
        <rect x="200" y="90" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <rect x="270" y="90" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <rect x="340" y="90" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <rect x="410" y="90" width="55" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />

        <!-- wires fanning from controller to every cell (equal directness) -->
        <line x1="120" y1="65" x2="227" y2="50" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="68" x2="297" y2="50" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="72" x2="367" y2="50" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="75" x2="437" y2="50" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="80" x2="227" y2="110" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="83" x2="297" y2="110" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="87" x2="367" y2="110" stroke="var(--muted)" stroke-width="1" />
        <line x1="120" y1="90" x2="437" y2="110" stroke="var(--muted)" stroke-width="1" />

        <text x="360" y="152" text-anchor="middle" font-size="11.5" class="muted">
          全セルに直接つながる配線 ― どのセルを選んでも到達時間はほぼ同じ
        </text>

        <line x1="360" y1="160" x2="360" y2="180" stroke="var(--border)" stroke-width="1.5" />

        <!-- ============ HDD ============ -->
        <text x="360" y="205" text-anchor="middle" font-size="14" font-weight="700">HDD ― 物理的に移動して探す</text>

        <!-- platter -->
        <circle cx="330" cy="300" r="75" fill="var(--card)" stroke="var(--border)" />
        <circle cx="330" cy="300" r="60" fill="none" stroke="var(--border)" stroke-dasharray="3 3" />
        <circle cx="330" cy="300" r="35" fill="none" stroke="var(--border)" stroke-dasharray="3 3" />

        <!-- actuator arm: pivot outside disk, head currently at r=60 -->
        <line x1="470" y1="300" x2="390" y2="300" stroke="var(--fg)" stroke-width="2" />
        <circle cx="470" cy="300" r="4" fill="var(--fg)" />
        <text x="478" y="304" font-size="10.5" class="muted">アーム(軸)</text>

        <!-- seek: head moves inward from r=60 to r=35 (target track) -->
        <line x1="390" y1="300" x2="368" y2="300" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrowC)" />
        <text x="345" y="288" text-anchor="middle" font-size="11" style="fill: var(--primary)">①シーク</text>

        <!-- rotation: target sector currently at 220°, must rotate to 0° (under the head) -->
        <path
          d="M 302.5 337.5 A 35 35 0 0 1 365 300"
          fill="none"
          stroke="var(--primary)"
          stroke-width="1.5"
          stroke-dasharray="4 3"
          marker-end="url(#arrowC)"
        />
        <circle cx="302.5" cy="337.5" r="4" fill="var(--muted)" />
        <text x="270" y="352" font-size="11" class="muted">②回転待ち</text>
        <text x="278" y="366" font-size="10" class="muted">(目的のセクタ)</text>

        <circle cx="365" cy="300" r="5" fill="var(--primary)" />
        <text x="375" y="322" font-size="11" style="fill: var(--primary)">③読み取り</text>

        <text x="570" y="270" font-size="11.5" class="muted">シーク時間 +</text>
        <text x="570" y="286" font-size="11.5" class="muted">回転待ち時間</text>
        <text x="570" y="302" font-size="11.5" class="muted">の分だけ遅い</text>
      </svg>
    </div>
  </body>
</html>
