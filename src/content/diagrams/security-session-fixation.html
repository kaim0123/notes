<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 326"
        role="img"
        aria-label="セッション固定化攻撃と、その対策であるログイン時のID再発行を比べた図。攻撃者はまず、自分が知っている未ログイン状態のセッションIDを被害者に踏ませておく。被害者はそのIDを持ったままログイン画面へ進む。上は再発行しない実装で、ログインが成功しても同じIDのままなので、攻撃者が握っている番号がそのままログイン済みの状態を指すことになり、攻撃者も本人として入れてしまう。下は再発行する実装で、ログイン成功の瞬間に新しいIDが発行され、古いIDは無効になる。攻撃者が事前に握っていた番号は、どこも指さない紙切れに変わる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="118" width="170" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="105" y="140" font-size="10" text-anchor="middle">攻撃者が用意したID</text>
        <text x="105" y="160" font-size="10" text-anchor="middle" class="mono">sid=AAA</text>
        <text x="105" y="102" font-size="9" text-anchor="middle" class="muted">未ログイン状態のIDを踏ませる</text>

        <line x1="194" y1="132" x2="256" y2="92" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="194" y1="162" x2="256" y2="216" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <text x="270" y="52" font-size="10.5" class="muted">① ログイン時にIDを作り直さない</text>
        <rect x="260" y="64" width="200" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="360" y="84" font-size="9.5" text-anchor="middle" class="muted">被害者がログイン成功</text>
        <text x="360" y="102" font-size="10" text-anchor="middle" class="mono">sid=AAA のまま</text>
        <line x1="464" y1="90" x2="516" y2="90" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <rect x="520" y="64" width="220" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="630" y="84" font-size="9.5" text-anchor="middle" class="muted">攻撃者もAAAを持っている</text>
        <text x="630" y="102" font-size="10" text-anchor="middle" class="accent">そのまま本人として入れる</text>

        <text x="270" y="190" font-size="10.5" class="accent">② ログイン成功時にIDを再発行する</text>
        <rect x="260" y="202" width="200" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="360" y="222" font-size="9.5" text-anchor="middle" class="muted">被害者がログイン成功</text>
        <text x="360" y="240" font-size="10" text-anchor="middle" class="mono accent">sid=BBB を新規発行</text>
        <line x1="464" y1="228" x2="516" y2="228" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <rect x="520" y="202" width="220" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="630" y="222" font-size="9.5" text-anchor="middle" class="muted">攻撃者が持つAAAは無効</text>
        <text x="630" y="240" font-size="10" text-anchor="middle">どこも指さない紙切れになる</text>

        <line x1="16" y1="276" x2="744" y2="276" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="298" font-size="10.5" class="muted">攻撃者はIDを盗むのではなく、先に配っておく。盗む必要がないので、盗聴対策では防げない。</text>
        <text x="16" y="318" font-size="10.5" class="accent">対策は1行 ― 権限が変わる瞬間(ログイン・昇格)に、番号を作り直す。</text>
      </svg>
    </div>
  </body>
</html>
