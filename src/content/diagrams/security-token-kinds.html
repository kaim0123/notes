<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="トークンと呼ばれる4種類の値が、それぞれ何を証明しているかを並べた図。実体はどれも推測できないランダム文字列で共通しているが、証明する対象が異なる。セッションIDはログイン状態そのものを証明し、漏れればなりすましを許す。CSRFトークンは、その送信が正規のページを見て行われたという意思を証明し、漏れれば偽サイトからの送信が通ってしまう。アクセストークンはAPIへのアクセス権を証明し、漏れれば有効期限が切れるまで悪用される。リフレッシュトークンはアクセストークンを再発行する権利を証明し、漏れれば長期にわたって新しいアクセストークンを作られ続ける。同じ言葉でも、漏れたときに取るべき対応はそれぞれ違う。"
      >
        <text x="130" y="46" font-size="10" text-anchor="middle" class="muted">呼び名</text>
        <text x="400" y="46" font-size="10" text-anchor="middle" class="accent">証明していること</text>
        <text x="630" y="46" font-size="10" text-anchor="middle" class="muted">漏れると起きること</text>

        <rect x="20" y="60" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="118" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="176" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="234" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="130" y="82" font-size="10.5" text-anchor="middle">セッションID</text>
        <text x="130" y="99" font-size="8.5" text-anchor="middle" class="muted">Cookieで毎回運ばれる</text>
        <text x="130" y="140" font-size="10.5" text-anchor="middle">CSRFトークン</text>
        <text x="130" y="157" font-size="8.5" text-anchor="middle" class="muted">フォームごとに発行</text>
        <text x="130" y="198" font-size="10.5" text-anchor="middle">アクセストークン</text>
        <text x="130" y="215" font-size="8.5" text-anchor="middle" class="muted">API呼び出しに添える</text>
        <text x="130" y="256" font-size="10.5" text-anchor="middle" class="accent">リフレッシュトークン</text>
        <text x="130" y="273" font-size="8.5" text-anchor="middle" class="muted">期限切れのときだけ使う</text>

        <text x="290" y="88" font-size="10" class="muted">ログイン状態そのもの</text>
        <text x="290" y="146" font-size="10" class="muted">いま本人が送ったという意思</text>
        <text x="290" y="204" font-size="10" class="muted">この資源へのアクセス権</text>
        <text x="290" y="262" font-size="10" class="accent">アクセストークンを作る権利</text>

        <line x1="560" y1="60" x2="560" y2="280" stroke="var(--border)" stroke-width="1" />
        <text x="572" y="88" font-size="9.5" class="muted">なりすまされる</text>
        <text x="572" y="146" font-size="9.5" class="muted">偽サイトからの送信が通る</text>
        <text x="572" y="204" font-size="9.5" class="muted">期限切れまで悪用される</text>
        <text x="572" y="262" font-size="9.5" class="accent">新しい鍵を作られ続ける</text>

        <line x1="16" y1="292" x2="744" y2="292" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="314" font-size="10.5" class="accent">「トークンが漏れた」だけでは何も決まらない。どれが漏れたかで、被害の範囲も、無効化すべき対象も変わる。</text>
      </svg>
    </div>
  </body>
</html>
