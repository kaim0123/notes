<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 330"
        role="img"
        aria-label="E2Eテストの実行時間を縮める4つの並列化の粒度を、内側から外側へ積み上げて示した図。1段目はワーカー並列で、1台のマシンの中でテストファイルを複数のプロセスに分散する基本形。2段目は同一ファイル内の並列で、1つのファイルに入っているテストもプロセス間に分散する。ファイル数が少なくテスト件数が多い場合に効く。3段目はプロジェクトで、ChromiumやFirefoxやWebKitといった実行対象の掛け合わせを定義し、主要な動線だけ3ブラウザ、残りは1ブラウザというように絞り込む。4段目はシャーディングで、テスト全体を複数のマシンに分割して走らせる。ワーカー並列だけでは追いつかない件数に使う。分割の単位はファイルの分け方そのものなので、1つの巨大なファイルにすべての観点を詰め込むと、そのファイルが1つのプロセスに固定されて並列化の恩恵を受けられない、と図の下部に記されている。"
      >
        <text x="16" y="26" font-size="11" class="muted">1件が重いので、件数の増加はそのままCIの時間になる。4つの粒度で割る</text>

        <rect x="16" y="40" width="668" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="62" font-size="10.5">ワーカー並列 ― 1台の中で、ファイルをプロセスへ分散</text>
        <text x="30" y="80" font-size="9" class="muted">基本形。まずここから</text>
        <rect x="470" y="52" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="522" y="52" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="574" y="52" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="626" y="52" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />

        <rect x="16" y="102" width="668" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="124" font-size="10.5">同一ファイル内の並列 ― ファイルの中のテストも分散</text>
        <text x="30" y="142" font-size="9" class="muted">ファイル数が少なく、件数が多いときに効く</text>
        <rect x="470" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="496" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="522" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="548" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="574" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="600" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="626" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="652" y="114" width="22" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />

        <rect x="16" y="164" width="668" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="186" font-size="10.5">プロジェクト ― 実行対象の掛け合わせを定義</text>
        <text x="30" y="204" font-size="9" class="muted">主要動線だけ3ブラウザ、残りは1ブラウザ、という絞り込みに使う</text>
        <rect x="512" y="176" width="52" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="538" y="196" font-size="9" text-anchor="middle" class="muted">Chr</text>
        <rect x="570" y="176" width="52" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="596" y="196" font-size="9" text-anchor="middle" class="muted">FF</text>
        <rect x="628" y="176" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="651" y="196" font-size="9" text-anchor="middle" class="muted">WK</text>

        <rect x="16" y="226" width="668" height="56" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="248" font-size="10.5" class="accent">シャーディング ― 複数のマシンへ分割</text>
        <text x="30" y="266" font-size="9" class="muted">ワーカー並列だけでは追いつかない件数を、マシンをまたいで分散する</text>
        <rect x="470" y="238" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />
        <rect x="524" y="238" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />
        <rect x="578" y="238" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />
        <rect x="632" y="238" width="46" height="32" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />

        <line x1="16" y1="298" x2="684" y2="298" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="318" font-size="10.5" class="muted">分割の単位は、ファイルの分け方そのもの。巨大な1ファイルは1プロセスに固定され、恩恵を受けられない。</text>
      </svg>
    </div>
  </body>
</html>
