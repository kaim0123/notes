<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="ルーターを重ねてマウントすると、URLが前置きの積み重ねで組み立てられることを示した図。左に3つのファイルが縦に並ぶ。いちばん上はアプリ本体で、スラッシュapiという前置きでまとめ役をマウントする。真ん中はまとめ役のファイルで、スラッシュusersという前置きでユーザー用のルーターをマウントする。いちばん下がユーザー用のルーターで、そこにはスラッシュコロンidという相対パスだけが書かれている。右にはこの3つが積み重なって、スラッシュapiスラッシュusersスラッシュコロンidという最終的なURLになる様子が、3色に区切られた1本の帯として示される。前置きは呼び出し側が一度だけ指定し、各ファイルは自分の中の相対的な位置だけを書けばよい。だから接頭辞を変えたいときは、いちばん上の1行を直すだけで全体が追従する。">
        <defs>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">前置きは、呼び出す側が一度だけ指定する</text>

        <rect x="16" y="40" width="290" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="58" font-size="9" class="muted">app.ts</text>
        <text x="30" y="76" font-size="10" class="mono">app.use(<tspan class="lbl">"/api"</tspan>, routes)</text>

        <rect x="16" y="98" width="290" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="116" font-size="9" class="muted">routes/index.ts</text>
        <text x="30" y="134" font-size="10" class="mono">router.use(<tspan class="lbl">"/users"</tspan>, usersRouter)</text>

        <rect x="16" y="156" width="290" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="174" font-size="9" class="muted">routes/users.ts</text>
        <text x="30" y="192" font-size="10" class="mono">router.get(<tspan class="lbl">"/:id"</tspan>, handler)</text>

        <line x1="306" y1="122" x2="346" y2="122" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />

        <text x="356" y="90" font-size="10.5" class="muted">積み重なって、1本のURLになる</text>

        <rect x="356" y="104" width="76" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="376" y="126" font-size="11" class="mono">/api</text>
        <rect x="432" y="104" width="96" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="450" y="126" font-size="11" class="mono">/users</text>
        <rect x="528" y="104" width="86" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="548" y="126" font-size="11" class="mono lbl">/:id</text>

        <text x="356" y="164" font-size="10" class="muted">GET /api/users/42</text>

        <line x1="16" y1="220" x2="624" y2="220" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="246" font-size="10.5" class="muted">各ファイルは、自分の中の<tspan class="lbl">相対的な位置</tspan>だけを書けばよい。</text>
        <text x="16" y="268" font-size="10.5" class="muted">だから接頭辞を変えたいときは、いちばん上の1行を直すだけで全体が追従する。</text>
        <text x="16" y="290" font-size="10.5" class="muted">同じ理由で、ルーター単位のミドルウェアも、そのルーター配下すべてに一度で効く。</text>
      </svg>
    </div>
  </body>
</html>
