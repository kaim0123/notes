<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="トランザクションの実行フロー図。BEGINで開始し、SQL文(UPDATE/INSERT/DELETEなど)を実行する。すべて成功すればCOMMITに進み結果は確定・永続化される。途中で失敗・矛盾が起きればROLLBACKに進み、更新前の状態にすべて戻される。どちらの経路でも中途半端な状態は残らないことを示す。"
      >
        <defs>
          <marker
            id="arrowMuted"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowPrimary"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- BEGIN -->
        <rect x="20" y="145" width="110" height="50" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="175" text-anchor="middle" font-size="13" font-weight="700">BEGIN</text>

        <!-- SQL実行 -->
        <path d="M130,170 L182,170" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <rect x="184" y="120" width="220" height="100" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="294" y="155" text-anchor="middle" font-size="13" font-weight="600">SQL文の実行</text>
        <text x="294" y="176" text-anchor="middle" font-size="10.5" class="muted">UPDATE / INSERT /</text>
        <text x="294" y="192" text-anchor="middle" font-size="10.5" class="muted">DELETE など</text>
        <text x="294" y="210" text-anchor="middle" font-size="10.5" class="muted">を1つの塊として実行</text>

        <!-- 成功経路 -->
        <path d="M404,145 L440,145 L440,80 L462,80" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowPrimary)" />
        <text x="420" y="70" text-anchor="middle" font-size="11" style="fill: var(--primary); font-weight:600">すべて成功</text>

        <!-- 失敗経路 -->
        <path d="M404,196 L440,196 L440,260 L462,260" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <text x="420" y="292" text-anchor="middle" font-size="11" class="muted">失敗・矛盾が発生</text>

        <!-- COMMIT -->
        <rect x="464" y="52" width="130" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="529" y="86" text-anchor="middle" font-size="13.5" font-weight="700" style="fill: var(--primary)">COMMIT</text>

        <path d="M594,80 L646,80" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowPrimary)" />
        <rect x="648" y="46" width="96" height="68" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="696" y="72" text-anchor="middle" font-size="11.5" font-weight="600">確定・</text>
        <text x="696" y="88" text-anchor="middle" font-size="11.5" font-weight="600">永続化</text>
        <text x="696" y="104" text-anchor="middle" font-size="9.5" class="muted">(Durable)</text>

        <!-- ROLLBACK -->
        <rect x="464" y="232" width="130" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="529" y="266" text-anchor="middle" font-size="13.5" font-weight="700">ROLLBACK</text>

        <path d="M594,260 L646,260" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <rect x="648" y="226" width="96" height="68" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="696" y="252" text-anchor="middle" font-size="11.5" font-weight="600">更新前の</text>
        <text x="696" y="268" text-anchor="middle" font-size="11.5" font-weight="600">状態に戻す</text>
        <text x="696" y="284" text-anchor="middle" font-size="9.5" class="muted">(Undo)</text>

        <text x="380" y="326" text-anchor="middle" font-size="11" class="muted">
          原子性(Atomicity): 「全部成功」と「全部取り消し」のどちらかしか残らない
        </text>
      </svg>
    </div>
  </body>
</html>
