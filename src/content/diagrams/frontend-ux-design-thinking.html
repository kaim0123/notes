<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 280" role="img" aria-label="デザイン思考の5段階を横並びで示した図。左から共感、問題定義、発想、試作、テストの順に矢印でつながる。共感と発想の段は上下に広がる形、問題定義とテストの段は上下が狭まる形で描かれ、発散と収束が交互に来ることを表している。いちばん右のテストから左へ戻る大きな破線の矢印があり、学んだことを共感や問題定義に戻して次の周回に入ることが示されている。5段階を一度通ることではなく、この戻りこそが本体である。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="16" y="52" width="112" height="104" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="72" y="82" text-anchor="middle" font-size="12">共感</text>
        <text x="72" y="106" text-anchor="middle" font-size="10" class="muted">状況・感情・制約</text>
        <text x="72" y="124" text-anchor="middle" font-size="10" class="muted">を理解する</text>
        <text x="72" y="146" text-anchor="middle" font-size="9.5" class="lbl">発散</text>

        <line x1="128" y1="104" x2="146" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="150" y="70" width="106" height="68" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="203" y="96" text-anchor="middle" font-size="12">問題定義</text>
        <text x="203" y="116" text-anchor="middle" font-size="10" class="muted">1つに絞る</text>
        <text x="203" y="132" text-anchor="middle" font-size="9.5" class="lbl">収束</text>

        <line x1="256" y1="104" x2="274" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="278" y="52" width="112" height="104" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="334" y="82" text-anchor="middle" font-size="12">発想</text>
        <text x="334" y="106" text-anchor="middle" font-size="10" class="muted">量を出してから</text>
        <text x="334" y="124" text-anchor="middle" font-size="10" class="muted">選ぶ</text>
        <text x="334" y="146" text-anchor="middle" font-size="9.5" class="lbl">発散</text>

        <line x1="390" y1="104" x2="408" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="412" y="62" width="106" height="84" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="465" y="90" text-anchor="middle" font-size="12">試作</text>
        <text x="465" y="112" text-anchor="middle" font-size="10" class="muted">早く・安く・粗く</text>
        <text x="465" y="134" text-anchor="middle" font-size="9.5" class="muted">形にする</text>

        <line x1="518" y1="104" x2="536" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="540" y="70" width="84" height="68" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="582" y="96" text-anchor="middle" font-size="12">テスト</text>
        <text x="582" y="116" text-anchor="middle" font-size="10" class="muted">確かめる</text>
        <text x="582" y="132" text-anchor="middle" font-size="9.5" class="lbl">収束</text>

        <path d="M582 156 L582 210 L72 210 L72 160" fill="none" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arp)" />
        <text x="327" y="232" text-anchor="middle" font-size="11" class="lbl">学びを戻して、もう一周 ― この戻りが本体</text>
        <text x="327" y="256" text-anchor="middle" font-size="10.5" class="muted">5段階を一度通り抜けることが目的ではない</text>
      </svg>
    </div>
  </body>
</html>
