<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 334"
        role="img"
        aria-label="共通鍵暗号と公開鍵暗号で、配らなければならない鍵の本数がどう変わるかを左右で比べた図。左は共通鍵だけの世界で、5人が互いに通信するには全員の組み合わせぶんの鍵が要るため、AからEまでの5つの点がすべて線で結ばれ、10本の線が張られている。しかもその10本すべてを、盗まれない経路で手渡さなければならない。右は公開鍵のある世界で、5人はそれぞれ自分の公開鍵を中央の公開の場に1つ置くだけでよく、線は5本に減る。しかもその5本は誰に見られてもかまわない。人数が増えると左は急速に本数が増えるのに対し、右は人数と同じ本数にとどまる。"
      >
        <text x="160" y="36" font-size="11" text-anchor="middle" class="muted">共通鍵だけの世界</text>
        <line x1="160" y1="80" x2="227" y2="128" stroke="var(--border)" stroke-width="1" />
        <line x1="160" y1="80" x2="201" y2="207" stroke="var(--border)" stroke-width="1" />
        <line x1="160" y1="80" x2="119" y2="207" stroke="var(--border)" stroke-width="1" />
        <line x1="160" y1="80" x2="93" y2="128" stroke="var(--border)" stroke-width="1" />
        <line x1="227" y1="128" x2="201" y2="207" stroke="var(--border)" stroke-width="1" />
        <line x1="227" y1="128" x2="119" y2="207" stroke="var(--border)" stroke-width="1" />
        <line x1="227" y1="128" x2="93" y2="128" stroke="var(--border)" stroke-width="1" />
        <line x1="201" y1="207" x2="119" y2="207" stroke="var(--border)" stroke-width="1" />
        <line x1="201" y1="207" x2="93" y2="128" stroke="var(--border)" stroke-width="1" />
        <line x1="119" y1="207" x2="93" y2="128" stroke="var(--border)" stroke-width="1" />
        <circle cx="160" cy="80" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="227" cy="128" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="201" cy="207" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="119" cy="207" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="93" cy="128" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="84" font-size="10" text-anchor="middle" class="muted">A</text>
        <text x="227" y="132" font-size="10" text-anchor="middle" class="muted">B</text>
        <text x="201" y="211" font-size="10" text-anchor="middle" class="muted">C</text>
        <text x="119" y="211" font-size="10" text-anchor="middle" class="muted">D</text>
        <text x="93" y="132" font-size="10" text-anchor="middle" class="muted">E</text>
        <text x="160" y="252" font-size="10.5" text-anchor="middle">5人で10本</text>
        <text x="160" y="270" font-size="9.5" text-anchor="middle" class="muted">全部を盗まれない経路で手渡す</text>

        <text x="480" y="36" font-size="11" text-anchor="middle" class="accent">公開鍵のある世界</text>
        <line x1="480" y1="80" x2="480" y2="150" stroke="var(--primary)" stroke-width="1.1" />
        <line x1="547" y1="128" x2="480" y2="150" stroke="var(--primary)" stroke-width="1.1" />
        <line x1="521" y1="207" x2="480" y2="150" stroke="var(--primary)" stroke-width="1.1" />
        <line x1="439" y1="207" x2="480" y2="150" stroke="var(--primary)" stroke-width="1.1" />
        <line x1="413" y1="128" x2="480" y2="150" stroke="var(--primary)" stroke-width="1.1" />
        <rect x="443" y="134" width="74" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="480" y="154" font-size="9.5" text-anchor="middle">公開の場</text>
        <circle cx="480" cy="80" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="547" cy="128" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="521" cy="207" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="439" cy="207" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <circle cx="413" cy="128" r="17" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="84" font-size="10" text-anchor="middle" class="muted">A</text>
        <text x="547" y="132" font-size="10" text-anchor="middle" class="muted">B</text>
        <text x="521" y="211" font-size="10" text-anchor="middle" class="muted">C</text>
        <text x="439" y="211" font-size="10" text-anchor="middle" class="muted">D</text>
        <text x="413" y="132" font-size="10" text-anchor="middle" class="muted">E</text>
        <text x="480" y="252" font-size="10.5" text-anchor="middle" class="accent">5人で5本</text>
        <text x="480" y="270" font-size="9.5" text-anchor="middle" class="muted">しかも見られてかまわない</text>

        <line x1="16" y1="288" x2="624" y2="288" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="310" font-size="10.5" class="muted">共通鍵はn人でn(n-1)/2本。100人なら4950本を、それぞれ安全な経路で配ることになる。</text>
        <text x="16" y="330" font-size="10.5" class="accent">公開鍵が解いたのは「暗号の強さ」ではなく「鍵をどう配るか」のほう。見知らぬ相手と通信できるのはこのため。</text>
      </svg>
    </div>
  </body>
</html>
