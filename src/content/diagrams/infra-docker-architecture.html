<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 260"
        role="img"
        aria-label="Dockerの3つの部品と、その間のやり取りを示した図。利用者が叩くdocker runやdocker buildはクライアントが受け取り、REST APIでデーモンへ伝える。実際にコンテナを起動し、イメージを管理し、ネットワークを設定するのはデーモンのほうである。イメージの取得と公開はレジストリとの間で行われ、Docker Hubのような公開レジストリから既製のイメージを取ってこられる。クライアントとデーモンはHTTPで話すため別のマシンにあってもよく、手元から遠隔のDockerを操作できるのはこのためである。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="120" width="160" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="100" y="145" font-size="11.5" text-anchor="middle">クライアント</text>
        <text x="100" y="164" font-size="9.5" text-anchor="middle" class="mono muted">docker run / build</text>

        <rect x="270" y="120" width="160" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="145" font-size="11.5" text-anchor="middle">デーモン</text>
        <text x="350" y="164" font-size="9.5" text-anchor="middle" class="muted">実際に動かす側</text>

        <rect x="520" y="120" width="160" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="600" y="145" font-size="11.5" text-anchor="middle">レジストリ</text>
        <text x="600" y="164" font-size="9.5" text-anchor="middle" class="muted">Docker Hub など</text>

        <line x1="184" y1="150" x2="264" y2="150" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="224" y="140" font-size="9.5" text-anchor="middle" class="muted">REST API</text>
        <line x1="434" y1="150" x2="514" y2="150" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="474" y="140" font-size="9.5" text-anchor="middle" class="muted">pull / push</text>

        <rect x="270" y="46" width="160" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="66" font-size="11" text-anchor="middle">コンテナ</text>
        <text x="350" y="82" font-size="9" text-anchor="middle" class="muted">起動・停止・ネットワーク</text>
        <line x1="350" y1="116" x2="350" y2="96" stroke="var(--muted)" marker-end="url(#ar)" />

        <text x="20" y="220" font-size="10.5" class="muted">クライアントとデーモンはHTTPで話すので、別のマシンにあってもよい(手元から遠隔のDockerを操作できる)。</text>
        <text x="20" y="240" font-size="10.5" class="accent">デーモンは既定でroot権限で動く ― Dockerを操作できる人は、実質ホストのrootを持つのと同じ。</text>
      </svg>
    </div>
  </body>
</html>
