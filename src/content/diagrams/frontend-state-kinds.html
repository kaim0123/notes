<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="フロントエンドの状態を5種類に分け、それぞれの置き場所と道具を並べた図。1つ目はUI状態で、モーダルの開閉や選択中のタブなど画面の見え方に関するもので、置き場所は最も近い共通の親。2つ目はサーバー状態で、APIやデータベースから取得したデータであり、正本はサーバー側にあってクライアントは写しを持つだけなので、キャッシュ層に任せる。3つ目はURL状態で、検索条件やページ番号など共有と再現をしたいもので、クエリやパスに置く。4つ目はフォーム状態で、入力途中の値と検証結果であり、フォームの管理層に置き、送信が済めばサーバー状態へ移る。5つ目はグローバル状態で、ログインユーザーやテーマなどアプリ全体で長く保つもので、Contextか外部ストアに置く。5つは共存するのが普通で、1つのライブラリに全部を載せる必要はない。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="26" width="600" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="46" font-size="11.5">① UI状態</text>
        <text x="150" y="46" font-size="10.5" class="muted">モーダルの開閉、選択中のタブ、展開状態</text>
        <text x="612" y="46" text-anchor="end" font-size="10.5" class="lbl">最も近い共通の親</text>
        <text x="150" y="64" font-size="10" class="muted">サーバーには保存しない。画面を離れれば消えてよい</text>

        <rect x="20" y="82" width="600" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="38" y="102" font-size="11.5">② サーバー状態</text>
        <text x="150" y="102" font-size="10.5" class="muted">一覧、詳細、在庫数 ― 正本はサーバー</text>
        <text x="612" y="102" text-anchor="end" font-size="10.5" class="lbl">キャッシュ層</text>
        <text x="150" y="120" font-size="10" class="muted">クライアントが持つのは写しにすぎない。ストアに載せない</text>

        <rect x="20" y="138" width="600" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="158" font-size="11.5">③ URL状態</text>
        <text x="150" y="158" font-size="10.5" class="muted">検索語、並び順、ページ番号、リソースID</text>
        <text x="612" y="158" text-anchor="end" font-size="10.5" class="lbl">クエリ / パス</text>
        <text x="150" y="176" font-size="10" class="muted">共有・リロード復元・戻るを同時に満たせるのはここだけ</text>

        <rect x="20" y="194" width="600" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="214" font-size="11.5">④ フォーム状態</text>
        <text x="150" y="214" font-size="10.5" class="muted">入力途中の値、検証結果、送信中かどうか</text>
        <text x="612" y="214" text-anchor="end" font-size="10.5" class="lbl">フォームの管理層</text>
        <text x="150" y="232" font-size="10" class="muted">送信が済めば ② へ移る ― 一時的な状態</text>

        <rect x="20" y="250" width="600" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="270" font-size="11.5">⑤ グローバル状態</text>
        <text x="150" y="270" font-size="10.5" class="muted">ログインユーザー、テーマ、言語、カート</text>
        <text x="612" y="270" text-anchor="end" font-size="10.5" class="lbl">Context / 外部ストア</text>
        <text x="150" y="288" font-size="10" class="muted">更新頻度が低ければ Context、高く広ければ外部ストア</text>

        <text x="20" y="314" font-size="10.5" class="muted">5つは共存するのが普通 ― 1つのライブラリに全部を載せる必要はない</text>
      </svg>
    </div>
  </body>
</html>
