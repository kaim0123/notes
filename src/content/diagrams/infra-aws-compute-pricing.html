<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="仮想サーバーの3つの購入方式を、割引の大きさと中断される可能性の関係で並べた図。オンデマンドは必要なときに起動して使った分だけ払う方式で、いつでも止められる代わりに単価は最も高い。長期の利用を約束する方式は大幅に割引されるが、その期間は使い続けることが前提になるため、常時動かすと分かっているものにしか向かない。余剰の容量を借りる方式は最も安いが、事業者の都合でいつでも回収されるため、途中で止まっても困らない処理に限られる。同じ計算資源でも、確約の度合いと中断への耐性で単価が決まる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="230" height="140" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="76" font-size="11.5" text-anchor="middle">オンデマンド</text>
        <text x="135" y="100" font-size="9.5" text-anchor="middle" class="muted">使った分だけ・いつでも停止</text>
        <text x="135" y="128" font-size="10.5" text-anchor="middle">単価は最も高い</text>
        <text x="135" y="152" font-size="9.5" text-anchor="middle" class="muted">負荷が読めない / 検証</text>
        <text x="135" y="176" font-size="9.5" text-anchor="middle" class="accent">中断されない</text>

        <rect x="265" y="50" width="230" height="140" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="76" font-size="11.5" text-anchor="middle">長期の確約</text>
        <text x="380" y="100" font-size="9.5" text-anchor="middle" class="muted">1〜3年の利用を約束する</text>
        <text x="380" y="128" font-size="10.5" text-anchor="middle">大幅に割引される</text>
        <text x="380" y="152" font-size="9.5" text-anchor="middle" class="muted">常時動かすと分かっているもの</text>
        <text x="380" y="176" font-size="9.5" text-anchor="middle" class="accent">使わなくても払う</text>

        <rect x="510" y="50" width="230" height="140" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="625" y="76" font-size="11.5" text-anchor="middle">余剰容量</text>
        <text x="625" y="100" font-size="9.5" text-anchor="middle" class="muted">空いている分を安く借りる</text>
        <text x="625" y="128" font-size="10.5" text-anchor="middle">最も安い</text>
        <text x="625" y="152" font-size="9.5" text-anchor="middle" class="muted">止まっても困らない処理</text>
        <text x="625" y="176" font-size="9.5" text-anchor="middle" class="accent">いつでも回収される</text>

        <line x1="20" y1="212" x2="740" y2="212" stroke="var(--border)" />
        <text x="20" y="234" font-size="10.5" class="muted">← 柔軟だが高い</text>
        <text x="740" y="234" font-size="10.5" text-anchor="end" class="muted">安いが条件が付く →</text>
        <text x="380" y="264" font-size="10.5" text-anchor="middle" class="muted">同じ計算資源の値段を分けているのは、確約の度合いと、中断にどれだけ耐えられるか。</text>
      </svg>
    </div>
  </body>
</html>
