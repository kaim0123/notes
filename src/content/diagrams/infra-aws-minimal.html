<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="AWSの部品で組んだWebサービスの最小構成を示した図。利用者のリクエストはRoute 53で名前解決され、CloudFrontが最寄りのエッジで受け、静的なファイルはS3から返す。動的な処理はロードバランサを通って複数のアベイラビリティゾーンに分散したアプリの実行環境へ渡り、そこからRDSのデータベースへ問い合わせる。この一列の上下に、誰が何をできるかを決めるIAMと、状態を記録するCloudWatchが横断的にかかっている。役割の名前で並べれば、サービス名は後から当てはめられる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="96" width="96" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="68" y="118" font-size="11" text-anchor="middle">利用者</text>
        <text x="68" y="135" font-size="9" text-anchor="middle" class="muted">ブラウザ</text>

        <rect x="140" y="96" width="110" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="195" y="118" font-size="11" text-anchor="middle">Route 53</text>
        <text x="195" y="135" font-size="9" text-anchor="middle" class="muted">名前解決</text>

        <rect x="274" y="96" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="334" y="118" font-size="11" text-anchor="middle">CloudFront</text>
        <text x="334" y="135" font-size="9" text-anchor="middle" class="muted">エッジで受ける</text>

        <rect x="274" y="176" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="334" y="196" font-size="11" text-anchor="middle">S3</text>
        <text x="334" y="212" font-size="9" text-anchor="middle" class="muted">静的ファイル</text>

        <rect x="418" y="96" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="478" y="118" font-size="11" text-anchor="middle">ALB</text>
        <text x="478" y="135" font-size="9" text-anchor="middle" class="muted">振り分け</text>

        <rect x="562" y="86" width="80" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="602" y="110" font-size="10.5" text-anchor="middle">アプリ</text>
        <text x="602" y="126" font-size="9" text-anchor="middle" class="muted">AZ 1a</text>
        <text x="602" y="144" font-size="9" text-anchor="middle" class="muted">+ AZ 1c</text>

        <rect x="662" y="96" width="80" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="702" y="118" font-size="10.5" text-anchor="middle">RDS</text>
        <text x="702" y="135" font-size="9" text-anchor="middle" class="muted">DB</text>

        <line x1="118" y1="122" x2="136" y2="122" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="252" y1="122" x2="270" y2="122" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="396" y1="122" x2="414" y2="122" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="540" y1="122" x2="558" y2="122" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="644" y1="122" x2="658" y2="122" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="334" y1="150" x2="334" y2="172" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="344" y="166" font-size="9" class="muted">静的</text>
        <text x="440" y="90" font-size="9" text-anchor="middle" class="muted">動的</text>

        <rect x="20" y="34" width="722" height="38" rx="8" fill="none" stroke="var(--primary)" stroke-dasharray="5 4" />
        <text x="381" y="58" font-size="11" text-anchor="middle" class="accent">IAM ― どのサービスが、どのサービスに、何をしてよいか(全部にかかる)</text>

        <rect x="20" y="240" width="722" height="38" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="381" y="264" font-size="11" text-anchor="middle" class="muted">CloudWatch ― 各段の指標とログを集める / CloudTrail ― 誰が設定を変えたかを残す</text>
      </svg>
    </div>
  </body>
</html>
