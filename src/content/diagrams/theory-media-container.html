<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 320"
        role="img"
        aria-label="MP4というコンテナの中に映像トラック、音声トラック、字幕トラックが収まり、それぞれのトラックにH.264やAACといったコーデックが対応している構造図"
      >
        <text x="30" y="28" font-size="13" class="muted">拡張子が表すのは「入れ物」― 中身の符号化方式(コーデック)は別に決まる</text>

        <!-- コンテナの枠 -->
        <rect x="40" y="52" width="440" height="228" rx="14" fill="var(--card)" stroke="var(--primary)" stroke-width="2" />
        <text x="62" y="82" font-size="15" font-weight="700" class="accent">コンテナ: MP4</text>
        <text x="62" y="102" font-size="11" class="muted">複数のデータを1つのファイルにまとめる入れ物</text>

        <!-- トラック -->
        <rect x="64" y="116" width="392" height="46" rx="8" fill="var(--bg)" stroke="var(--border)" />
        <text x="86" y="145" font-size="14">映像トラック</text>
        <text x="300" y="145" font-size="13" class="mono accent">H.264 / HEVC</text>

        <rect x="64" y="172" width="392" height="46" rx="8" fill="var(--bg)" stroke="var(--border)" />
        <text x="86" y="201" font-size="14">音声トラック</text>
        <text x="300" y="201" font-size="13" class="mono accent">AAC / MP3</text>

        <rect x="64" y="228" width="392" height="40" rx="8" fill="var(--bg)" stroke="var(--border)" />
        <text x="86" y="253" font-size="14">字幕・メタ情報</text>
        <text x="300" y="253" font-size="13" class="mono muted">テキスト</text>

        <!-- 右: 対比 -->
        <text x="530" y="82" font-size="14" font-weight="700">同じ MP4 でも中身は違いうる</text>
        <rect x="530" y="102" width="250" height="70" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="550" y="128" font-size="13" class="mono">movie-a.mp4</text>
        <text x="550" y="152" font-size="12" class="muted">映像 H.264 / 音声 AAC</text>

        <rect x="530" y="184" width="250" height="70" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="550" y="210" font-size="13" class="mono">movie-b.mp4</text>
        <text x="550" y="234" font-size="12" class="muted">映像 HEVC / 音声 AAC</text>

        <text x="655" y="284" text-anchor="middle" font-size="12" class="accent">
          再生できるかは、箱ではなく中身しだい
        </text>
      </svg>
    </div>
  </body>
</html>
