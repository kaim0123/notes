<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="ReDoSが起きる仕組みを、繰り返しの入れ子による試行の分岐で示した図。左側は安全なパターンで、入力のaの並びに対して分け方が1通りしかないため、失敗が分かるまでの試行は入力の長さに比例した回数で済む。右側は危険なパターンで、外側と内側の両方が繰り返しになっているため、aを何個ずつのまとまりに分けるかという組み合わせをすべて試すことになる。aが4個なら8通り、20個なら約50万通り、30個なら約5億通りと、入力が1文字増えるたびに試行回数が倍になる。末尾に文字列全体をマッチさせない文字を1つ置くだけで、この全パターンを試し尽くしてから失敗するため、処理が事実上止まる。"
      >
        <text x="16" y="26" font-size="12" class="lbl">安全 ― 分け方が1通りしかない</text>
        <text x="336" y="26" font-size="12" class="lbl">危険 ― 繰り返しの入れ子</text>

        <rect x="16" y="38" width="288" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="160" y="60" text-anchor="middle" font-size="12.5" font-family="monospace">/^a+$/</text>

        <rect x="336" y="38" width="288" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="480" y="60" text-anchor="middle" font-size="12.5" font-family="monospace">/^(a+)+$/</text>

        <text x="16" y="96" font-size="11" class="muted">入力 &quot;aaaa&quot; の分け方</text>
        <rect x="16" y="106" width="288" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="126" text-anchor="middle" font-size="11.5" font-family="monospace">[aaaa]</text>
        <text x="16" y="160" font-size="11" class="muted">試す組み合わせ: 1通り</text>

        <text x="336" y="96" font-size="11" class="muted">入力 &quot;aaaa&quot; の分け方(一部)</text>
        <rect x="336" y="106" width="138" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="405" y="124" text-anchor="middle" font-size="11" font-family="monospace">[aaaa]</text>
        <rect x="486" y="106" width="138" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="555" y="124" text-anchor="middle" font-size="11" font-family="monospace">[a][aaa]</text>
        <rect x="336" y="138" width="138" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="405" y="156" text-anchor="middle" font-size="11" font-family="monospace">[aa][aa]</text>
        <rect x="486" y="138" width="138" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="555" y="156" text-anchor="middle" font-size="11" font-family="monospace">[a][a][aa]</text>
        <text x="336" y="182" font-size="11" class="muted">試す組み合わせ: 8通り(a が1つ増えるたびに倍)</text>

        <line x1="16" y1="200" x2="624" y2="200" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="222" font-size="11.5">末尾に &quot;X&quot; を1文字足すと、どの分け方でも失敗する</text>
        <rect x="16" y="234" width="288" height="42" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="160" y="252" text-anchor="middle" font-size="11.5">1通り試して、すぐ失敗と分かる</text>
        <text x="160" y="269" text-anchor="middle" font-size="11" class="lbl">入力の長さに比例</text>

        <rect x="336" y="234" width="288" height="42" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="480" y="252" text-anchor="middle" font-size="11.5" class="muted">全組み合わせを試し尽くしてから失敗</text>
        <text x="480" y="269" text-anchor="middle" font-size="11" class="muted">a が30個で約5億通り ― 事実上止まる</text>

        <text x="16" y="294" font-size="11" class="muted">単一スレッドのNode.jsでは、1つの正規表現がサーバー全体を止める</text>
      </svg>
    </div>
  </body>
</html>
