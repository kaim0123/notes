<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 620 460"
        role="img"
        aria-label="ブロードキャストストームの図解。3台のスイッチが三角形にループ接続されていると、1台が発したブロードキャストフレームがSW1からSW2、SW2からSW3、SW3からSW1へと永遠に回り続け、増殖しながら帯域を食いつぶす。"
      >
        <defs>
          <marker
            id="arrowStp"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6.5"
            markerHeight="6.5"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="260" y="30" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="310" y="60" text-anchor="middle" font-size="13" font-weight="600">SW1</text>
        <text x="310" y="18" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">①ブロードキャスト発生</text>

        <rect x="60" y="260" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="290" text-anchor="middle" font-size="13" font-weight="600">SW2</text>

        <rect x="460" y="260" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="510" y="290" text-anchor="middle" font-size="13" font-weight="600">SW3</text>

        <line x1="285" y1="80" x2="135" y2="260" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowStp)" />
        <text x="175" y="170" text-anchor="middle" font-size="11" style="fill: var(--primary)">②</text>

        <line x1="160" y1="292" x2="460" y2="292" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowStp)" />
        <text x="310" y="315" text-anchor="middle" font-size="11" style="fill: var(--primary)">③</text>

        <line x1="485" y1="260" x2="335" y2="80" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowStp)" />
        <text x="445" y="170" text-anchor="middle" font-size="11" style="fill: var(--primary)">④ → また①へ…</text>

        <text x="310" y="370" text-anchor="middle" font-size="12" class="muted">
          スイッチのフレームにはTTL(生存時間)が無い
        </text>
        <text x="310" y="392" text-anchor="middle" font-size="12" style="fill: var(--primary)">
          ループがあると同じフレームが増殖しながら永遠に回り続ける(ブロードキャストストーム)
        </text>
      </svg>
    </div>
  </body>
</html>
