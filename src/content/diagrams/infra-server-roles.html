<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 260"
        role="img"
        aria-label="1つのWebサービスの裏側で、役割の違うサーバーが順に依頼を渡していく様子を示した図。ブラウザがWebサーバーへHTTPで依頼し、WebサーバーはAPサーバーへ処理を渡し、APサーバーはDBサーバーへデータを問い合わせる。下の破線は、これらが必ずしも別々の機械ではないことを表し、同じ1台に全部を同居させることも、役割ごとに別の機械へ分けることもできる。サーバーが落ちたという一言は、機械が落ちたのか、この4つのうちどのプログラムが止まったのかを区別していない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="90" y="83" font-size="12" text-anchor="middle">ブラウザ</text>
        <text x="90" y="101" font-size="10" text-anchor="middle" class="muted">クライアント</text>

        <rect x="210" y="60" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="285" y="83" font-size="12" text-anchor="middle">Webサーバー</text>
        <text x="285" y="101" font-size="10" text-anchor="middle" class="muted">HTTPを受け付ける</text>

        <rect x="410" y="60" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="485" y="83" font-size="12" text-anchor="middle">APサーバー</text>
        <text x="485" y="101" font-size="10" text-anchor="middle" class="muted">業務ロジックを実行</text>

        <rect x="610" y="60" width="130" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="675" y="83" font-size="12" text-anchor="middle">DBサーバー</text>
        <text x="675" y="101" font-size="10" text-anchor="middle" class="muted">保存・検索</text>

        <line x1="162" y1="88" x2="206" y2="88" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="362" y1="88" x2="406" y2="88" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="562" y1="88" x2="606" y2="88" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="184" y="52" font-size="10" text-anchor="middle" class="muted">HTTP</text>
        <text x="384" y="52" font-size="10" text-anchor="middle" class="muted">処理を渡す</text>
        <text x="584" y="52" font-size="10" text-anchor="middle" class="muted">SQL</text>

        <rect x="196" y="44" width="380" height="106" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="386" y="170" font-size="11" text-anchor="middle" class="muted">この範囲を1台の機械に同居させることも、役割ごとに別の機械へ分けることもできる</text>

        <rect x="20" y="196" width="720" height="46" rx="8" fill="none" stroke="var(--primary)" />
        <text x="34" y="216" font-size="11" class="accent">「サーバーが落ちた」が指しうるもの</text>
        <text x="34" y="234" font-size="10.5" class="muted">機械そのものの停止 / Webサーバーのプロセスだけの停止 / DBだけが応答不能 ― 実害も対処も別物</text>
      </svg>
    </div>
  </body>
</html>
