<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="デッドロックが成立する循環と、その壊し方を示した図。左側は循環が閉じた状態で、処理Aは資源Xを保持したまま資源Yを待ち、処理Bは資源Yを保持したまま資源Xを待っている。待ちの矢印が輪になっているため、どちらも永久に進めない。右側は取得順序を統一した状態で、どの処理も必ずXを先に、Yを後に取ると決めてある。処理BもXから取ろうとするため、Xを持っているAが終わるまで待つだけになり、待ちの関係が一直線になって輪が閉じない。取得順序を全体で1つに決めることが、最も費用対効果の高い対策になる。"
      >
        <defs>
          <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="muted">循環が閉じている ― デッドロック</text>

        <rect x="16" y="42" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="71" y="67" text-anchor="middle" font-size="12">処理A</text>
        <rect x="176" y="42" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="231" y="67" text-anchor="middle" font-size="12" class="muted">処理B</text>

        <rect x="16" y="162" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="71" y="187" text-anchor="middle" font-size="12" class="muted">資源X</text>
        <rect x="176" y="162" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="231" y="187" text-anchor="middle" font-size="12" class="muted">資源Y</text>

        <line x1="71" y1="82" x2="71" y2="158" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#ard)" />
        <text x="80" y="122" font-size="10.5" class="muted">保持</text>
        <line x1="126" y1="72" x2="200" y2="158" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ard)" />
        <text x="140" y="110" font-size="10.5" class="lbl">待機</text>

        <line x1="231" y1="82" x2="231" y2="158" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ard)" />
        <text x="240" y="122" font-size="10.5" class="muted">保持</text>
        <line x1="176" y1="72" x2="102" y2="158" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ard)" />
        <text x="168" y="140" font-size="10.5" class="lbl">待機</text>

        <text x="151" y="232" text-anchor="middle" font-size="11" class="lbl">待ちの関係が輪になる → どちらも永久に進めない</text>

        <line x1="320" y1="20" x2="320" y2="250" stroke="var(--border)" stroke-width="1" />

        <text x="352" y="26" font-size="12" class="lbl">取得順序を統一する ― 輪が閉じない</text>

        <rect x="352" y="42" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="407" y="67" text-anchor="middle" font-size="12">処理A</text>
        <rect x="512" y="42" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="567" y="67" text-anchor="middle" font-size="12" class="muted">処理B</text>

        <rect x="352" y="162" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="407" y="187" text-anchor="middle" font-size="12" class="muted">資源X</text>
        <rect x="512" y="162" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="567" y="187" text-anchor="middle" font-size="12" class="muted">資源Y</text>

        <line x1="407" y1="82" x2="407" y2="158" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#ard)" />
        <text x="416" y="122" font-size="10.5" class="muted">保持</text>
        <line x1="462" y1="72" x2="536" y2="158" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ard)" />
        <text x="476" y="110" font-size="10.5" class="muted">次に Y</text>

        <line x1="512" y1="72" x2="438" y2="158" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ard)" />
        <text x="500" y="140" font-size="10.5" class="lbl">B も X から取る</text>

        <text x="487" y="232" text-anchor="middle" font-size="11" class="lbl">待ちが一直線になり、A が終われば B が進む</text>

        <line x1="16" y1="256" x2="624" y2="256" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="278" font-size="11" class="muted">対策は突き詰めると2つ ― 資源を取る順序を全体で統一すること、そして無限に待たないこと</text>
      </svg>
    </div>
  </body>
</html>
