<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 380" role="img" aria-label="3つの層と依存の向きを示した図。上から順にRouter、Service、Repositoryの3層が並ぶ。Routerの役割はHTTPを読んで値を渡し、結果をJSONとステータスに直すこと。ServiceはHTTPもSQLも知らずに業務の手順とルールだけを持つ。Repositoryは永続化を担い、SQLとテーブルの知識をここだけに閉じ込める。左側には呼び出しの流れが上から下への実線の矢印で示される。右側には依存の向きが描かれ、Routerから Serviceへは下向きだが、RepositoryからServiceへは上向きの矢印になっている。これは、保存機能のインターフェースをService側つまり内側に置き、外側のRepositoryがそれを実装するためで、依存が常に内向きの一方通行に保たれることを表す。下部には判定の目安として、Serviceの中にreqやresが出てきたら層が漏れていること、Serviceの中にSELECTが出てきたらRepositoryの仕事が漏れていることが記されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="10.5" class="muted">呼び出し</text>
        <text x="500" y="24" font-size="10.5" class="lbl">依存(コード上の参照)</text>

        <rect x="96" y="40" width="366" height="56" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="116" y="64" font-size="12.5">Router</text>
        <text x="116" y="84" font-size="10" class="muted">HTTPを読み、値を渡し、結果をJSONとステータスに直す</text>

        <rect x="96" y="126" width="366" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="116" y="150" font-size="12.5" class="lbl">Service(UseCase)</text>
        <text x="116" y="170" font-size="10" class="muted">業務の手順とルール。HTTPもSQLも知らない</text>
        <rect x="330" y="136" width="120" height="20" rx="4" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.1" stroke-dasharray="4 3" />
        <text x="340" y="150" font-size="9" class="lbl mono">OrderRepository</text>
        <text x="330" y="176" font-size="9" class="muted">インターフェースは内側に置く</text>

        <rect x="96" y="212" width="366" height="56" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="116" y="236" font-size="12.5">Repository</text>
        <text x="116" y="256" font-size="10" class="muted">永続化。SQLとテーブルの知識をここだけに閉じ込める</text>

        <line x1="60" y1="96" x2="60" y2="122" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <line x1="60" y1="182" x2="60" y2="208" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="20" y="112" font-size="9.5" class="muted">呼ぶ</text>
        <text x="20" y="198" font-size="9.5" class="muted">呼ぶ</text>

        <line x1="500" y1="96" x2="500" y2="122" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="512" y="114" font-size="9.5" class="lbl">↓ 下を知る</text>
        <line x1="500" y1="208" x2="500" y2="182" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="512" y="204" font-size="9.5" class="lbl">↑ 上を知る</text>
        <text x="500" y="240" font-size="9.5" class="muted">外側が、内側の</text>
        <text x="500" y="256" font-size="9.5" class="muted">要求を実装する</text>

        <text x="16" y="298" font-size="11" class="lbl">依存はどちらの層でも「内向き」の一方通行になる。</text>
        <line x1="16" y1="312" x2="624" y2="312" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="336" font-size="10.5" class="muted">層が漏れているかの判定は簡単 ―</text>
        <text x="16" y="356" font-size="10.5" class="muted">Serviceの中に req / res が出てきたら、Routerの仕事が漏れている。</text>
        <text x="16" y="374" font-size="10.5" class="muted">Serviceの中に SELECT が出てきたら、Repositoryの仕事が漏れている。</text>
      </svg>
    </div>
  </body>
</html>
