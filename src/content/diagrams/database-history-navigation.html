<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 360"
        role="img"
        aria-label="階層型・ネットワーク型と関係モデルのアクセス方法の比較図。左側の階層型は会社→部署→社員という木構造をポインタでたどるコードを書く必要があり、データの物理的な格納場所に依存する。右側の関係モデルはSELECT文で「何が欲しいか」を宣言するだけで、DBMSが物理的な場所を探し出してくれる。"
      >
        <line x1="380" y1="20" x2="380" y2="340" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />

        <!-- 左: 階層型・ネットワーク型 -->
        <text x="190" y="34" text-anchor="middle" font-size="13.5" font-weight="700">階層型・ネットワーク型</text>

        <rect x="130" y="54" width="120" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="78" text-anchor="middle" font-size="12" font-weight="600">会社</text>

        <path d="M190,94 L190,120" stroke="var(--muted)" stroke-width="1.4" fill="none" />
        <rect x="130" y="120" width="120" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="144" text-anchor="middle" font-size="12" font-weight="600">部署</text>

        <path d="M190,160 L190,186" stroke="var(--muted)" stroke-width="1.4" fill="none" />
        <rect x="130" y="186" width="120" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="210" text-anchor="middle" font-size="12" font-weight="600">社員</text>

        <rect x="50" y="246" width="280" height="66" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 4" />
        <text x="190" y="268" text-anchor="middle" font-size="11" class="muted">プログラムが</text>
        <text x="190" y="284" text-anchor="middle" font-size="11" class="muted">会社→部署→社員 と</text>
        <text x="190" y="300" text-anchor="middle" font-size="11" class="muted">ポインタを1つずつ辿る</text>

        <text x="190" y="336" text-anchor="middle" font-size="11" font-weight="600">物理的な格納場所に依存</text>

        <!-- 右: 関係モデル -->
        <text x="570" y="34" text-anchor="middle" font-size="13.5" font-weight="700" style="fill: var(--primary)">関係モデル(SQL)</text>

        <rect x="470" y="52" width="200" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="570" y="80" text-anchor="middle" font-size="11" font-family="monospace" style="fill: var(--primary)">
          SELECT * FROM 社員
        </text>

        <path d="M570,98 L570,120" stroke="var(--primary)" stroke-width="1.6" fill="none" />

        <!-- テーブル -->
        <rect x="460" y="120" width="220" height="140" rx="6" fill="var(--card)" stroke="var(--border)" />
        <line x1="460" y1="150" x2="680" y2="150" stroke="var(--border)" />
        <line x1="570" y1="120" x2="570" y2="260" stroke="var(--border)" />
        <text x="515" y="140" text-anchor="middle" font-size="10.5" font-weight="600">社員ID</text>
        <text x="625" y="140" text-anchor="middle" font-size="10.5" font-weight="600">部署</text>
        <text x="515" y="172" text-anchor="middle" font-size="10.5" class="muted">001</text>
        <text x="625" y="172" text-anchor="middle" font-size="10.5" class="muted">営業</text>
        <text x="515" y="200" text-anchor="middle" font-size="10.5" class="muted">002</text>
        <text x="625" y="200" text-anchor="middle" font-size="10.5" class="muted">開発</text>
        <text x="515" y="228" text-anchor="middle" font-size="10.5" class="muted">003</text>
        <text x="625" y="228" text-anchor="middle" font-size="10.5" class="muted">営業</text>

        <text x="570" y="290" text-anchor="middle" font-size="11" class="muted">DBMSが場所を探し出す</text>
        <text x="570" y="336" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--primary)">
          「何が欲しいか」を宣言するだけ
        </text>
      </svg>
    </div>
  </body>
</html>
