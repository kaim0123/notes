<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="上書きデプロイとバージョン付きデプロイの違いを示した図。上段の上書き方式では公開先のファイルを直接置き換えるため、壊れたとき戻る先が残っておらず、直前の状態を作り直すところから始めることになる。下段の方式では、ビルドのたびに別々の成果物として残し、公開はどれを指すかという参照の切り替えで行う。壊れたら参照を1つ前へ戻すだけでよく、切り戻しは数秒で終わり、原因の調査はそのあとで落ち着いて行える。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="26" font-size="12" class="muted">上書きデプロイ ― 戻る先が残らない</text>
        <rect x="20" y="40" width="130" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="60" font-size="10.5" text-anchor="middle">ビルド v3</text>
        <text x="85" y="76" font-size="9.5" text-anchor="middle" class="muted">壊れている</text>
        <line x1="152" y1="62" x2="196" y2="62" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="174" y="52" font-size="9.5" text-anchor="middle" class="muted">上書き</text>
        <rect x="200" y="40" width="180" height="44" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="290" y="66" font-size="11" text-anchor="middle">公開中のファイル</text>
        <text x="400" y="58" font-size="10.5" class="accent">v2はもう無い</text>
        <text x="400" y="76" font-size="10" class="muted">戻すには作り直しから</text>

        <line x1="20" y1="106" x2="680" y2="106" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="20" y="132" font-size="12" class="muted">バージョン付きデプロイ ― 参照を切り替える</text>
        <rect x="20" y="150" width="120" height="52" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="172" font-size="10.5" text-anchor="middle">成果物 v1</text>
        <text x="80" y="189" font-size="9.5" text-anchor="middle" class="muted">残っている</text>
        <rect x="156" y="150" width="120" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="216" y="172" font-size="10.5" text-anchor="middle">成果物 v2</text>
        <text x="216" y="189" font-size="9.5" text-anchor="middle" class="muted">直前の正常版</text>
        <rect x="292" y="150" width="120" height="52" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="352" y="172" font-size="10.5" text-anchor="middle">成果物 v3</text>
        <text x="352" y="189" font-size="9.5" text-anchor="middle" class="muted">壊れている</text>

        <rect x="470" y="150" width="200" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="570" y="172" font-size="11" text-anchor="middle">公開はどれを指すかだけ</text>
        <text x="570" y="189" font-size="9.5" text-anchor="middle" class="muted">DNS・ロードバランサ・シンボリックリンク</text>

        <path d="M470,168 L416,168" fill="none" stroke="var(--border)" marker-end="url(#ar)" />
        <path d="M470,184 C440,214 250,224 218,206" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="352" y="240" font-size="10.5" text-anchor="middle" class="accent">切り戻し = 参照を1つ前へ戻すだけ(数秒)</text>

        <text x="20" y="276" font-size="10.5" class="muted">先に止血できるから、原因の調査は落ち着いてからでよい。「戻せること」が復旧時間をそのまま決める。</text>
      </svg>
    </div>
  </body>
</html>
