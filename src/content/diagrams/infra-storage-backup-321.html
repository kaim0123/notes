<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="バックアップの3-2-1ルールを示した図。本番のデータを原本として、合計で3つのコピーを持ち、そのうち2種類は異なる媒体に保存し、少なくとも1つは物理的に離れた場所へ置く。同じ建物の同じ種類の装置に何個複製しても、火災や水害、あるいは装置の系統的な不具合で同時に失われる。媒体を分けるのは特定の装置の弱点に引きずられないため、遠隔地に置くのはその場所ごと失われる事態に備えるためであり、2つの数字はそれぞれ別の失い方に対応している。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="250" y="30" width="200" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="54" font-size="11.5" text-anchor="middle">原本(本番のデータ)</text>
        <text x="350" y="72" font-size="9.5" text-anchor="middle" class="muted">これも3つのうちの1つと数える</text>

        <line x1="310" y1="90" x2="160" y2="128" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <line x1="390" y1="90" x2="540" y2="128" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />

        <rect x="40" y="132" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="160" y="158" font-size="11" text-anchor="middle">コピー1 ― 別の媒体</text>
        <text x="160" y="178" font-size="9.5" text-anchor="middle" class="muted">社内のNASや別系統のディスク</text>
        <text x="160" y="194" font-size="9.5" text-anchor="middle" class="muted">戻すのが速い</text>

        <rect x="420" y="132" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="540" y="158" font-size="11" text-anchor="middle">コピー2 ― 別の場所</text>
        <text x="540" y="178" font-size="9.5" text-anchor="middle" class="muted">クラウドや遠隔地の拠点</text>
        <text x="540" y="194" font-size="9.5" text-anchor="middle" class="accent">建物ごと失っても残る</text>

        <rect x="40" y="222" width="620" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="52" y="240" font-size="10.5" class="muted">3 = データを合計3つ / 2 = 2種類以上の媒体 / 1 = そのうち1つは物理的に離れた場所</text>

        <text x="40" y="272" font-size="10.5" class="muted">同じ建物の同じ種類の装置に何個置いても、火災でも系統的な不具合でも同時に失われる。</text>
        <text x="40" y="292" font-size="10.5" class="muted">「媒体を分ける」と「場所を分ける」は、別々の失い方に対応している。</text>
      </svg>
    </div>
  </body>
</html>
