<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="3層スキーマの階層図。上段の外部スキーマには画面Aが見るビューと管理画面が見るビューの2つの箱があり、どちらも中段の概念スキーマ(テーブル定義・正規化された論理設計、強調表示)に矢印で集約される。概念スキーマからは下段の内部スキーマ(テーブルファイル・インデックス・RAID構成)へ矢印が伸びる。外部スキーマさえ保たれれば、概念・内部スキーマの変更は利用者に影響しないというデータ独立性を示す。"
      >
        <defs>
          <marker
            id="arrowSchema"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="320" y="20" text-anchor="middle" font-size="12" class="muted">
          外部スキーマ ― アプリ・利用者ごとの見え方
        </text>
        <rect x="40" y="32" width="250" height="50" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="62" text-anchor="middle" font-size="11.5">画面Aが見るビュー(SELECT結果)</text>
        <rect x="350" y="32" width="250" height="50" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="475" y="62" text-anchor="middle" font-size="11.5">管理画面が見るビュー</text>

        <line x1="165" y1="82" x2="300" y2="122" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowSchema)" />
        <line x1="475" y1="82" x2="340" y2="122" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowSchema)" />

        <text x="320" y="116" text-anchor="middle" font-size="12" class="muted">
          概念スキーマ ― 全体の論理構造(エンティティ・関連・制約)
        </text>
        <rect x="150" y="128" width="340" height="54" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="320" y="159" text-anchor="middle" font-size="11.5" font-weight="600">テーブル定義・正規化された論理設計</text>

        <line x1="320" y1="182" x2="320" y2="214" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowSchema)" />

        <text x="320" y="208" text-anchor="middle" font-size="12" class="muted">
          内部スキーマ ― 物理的な保存形式
        </text>
        <rect x="150" y="220" width="340" height="54" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="320" y="251" text-anchor="middle" font-size="11.5">テーブルファイル・インデックス・RAID構成</text>

        <text x="320" y="300" text-anchor="middle" font-size="11" class="muted">
          外部スキーマさえ保たれれば、概念・内部スキーマの変更は利用者に影響しない(データ独立性)
        </text>
      </svg>
    </div>
  </body>
</html>
