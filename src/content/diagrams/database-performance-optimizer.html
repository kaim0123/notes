<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="SQLが実行されるまでの流れ。SQL文はパーサで構文解析され、オプティマイザがカタログマネージャの持つ統計情報をもとに実行計画を選び、その計画に沿ってテーブルへアクセスする。"
      >
        <defs>
          <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- カタログマネージャ(統計情報) -->
        <rect x="270" y="26" width="220" height="56" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="380" y="50" text-anchor="middle" font-size="13" font-weight="600">カタログマネージャ</text>
        <text x="380" y="69" text-anchor="middle" font-size="11" class="muted">行数・値の分布などの統計情報を管理</text>
        <path d="M380,84 L380,126" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)" />
        <text x="396" y="110" font-size="11" class="muted">統計情報</text>

        <!-- 処理の流れ -->
        <rect x="30" y="130" width="110" height="54" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="85" y="163" text-anchor="middle" font-size="13" font-weight="600">SQL</text>

        <path d="M142,157 L182,157" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arw)" />

        <rect x="186" y="130" width="120" height="54" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="246" y="155" text-anchor="middle" font-size="13" font-weight="600">パーサ</text>
        <text x="246" y="172" text-anchor="middle" font-size="10.5" class="muted">構文を解析</text>

        <path d="M308,157 L348,157" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arw)" />

        <rect x="352" y="126" width="160" height="62" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="432" y="152" text-anchor="middle" font-size="13" font-weight="600">オプティマイザ</text>
        <text x="432" y="170" text-anchor="middle" font-size="10.5" class="muted">候補を比較して1つ選ぶ</text>

        <path d="M514,157 L596,157" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arwA)" />
        <text x="555" y="147" text-anchor="middle" font-size="11" class="accent">実行計画</text>

        <rect x="600" y="130" width="130" height="54" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="665" y="163" text-anchor="middle" font-size="13" font-weight="600">テーブル</text>

        <!-- 実行計画の候補 -->
        <text x="432" y="218" text-anchor="middle" font-size="11" class="muted">候補の例:</text>
        <rect x="252" y="230" width="150" height="30" rx="6" fill="none" stroke="var(--border)" stroke-width="1.2" />
        <text x="327" y="250" text-anchor="middle" font-size="11" class="muted">フルスキャン</text>
        <rect x="414" y="230" width="150" height="30" rx="6" fill="none" stroke="var(--primary)" stroke-width="1.4" />
        <text x="489" y="250" text-anchor="middle" font-size="11" class="accent">索引を使う</text>

        <text x="380" y="286" text-anchor="middle" font-size="11" class="muted">
          統計情報が古いと、オプティマイザは実態と違う前提で計画を選び、不要なフルスキャンが起きる
        </text>
      </svg>
    </div>
  </body>
</html>
