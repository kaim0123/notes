<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="サーバーレス関数の3つの呼び出され方と、失敗したときの扱いの違いを示した図。同期の呼び出しでは呼んだ側が結果をその場で待つため、失敗の後始末は呼んだ側の責任になる。非同期の呼び出しでは呼んだ側は受け付けだけを確認して先へ進み、失敗した場合はサービス側が自動で再試行し、それでも駄目なものは失敗した分だけを別のキューへ退避させる。ポーリングによる呼び出しでは、サービス側がキューやストリームを見張ってまとめて渡し、処理が成功したときだけ元から取り除く。同じ関数でも、どう呼ばれるかで再試行と重複の扱いが変わるため、処理は同じものが二度来ても壊れない形にしておく。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="44" width="660" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="36" y="66" font-size="11">同期 ― 呼んだ側が結果を待つ</text>
        <text x="36" y="86" font-size="9.5" class="muted">HTTPの入口から呼ばれる形。応答をそのまま利用者へ返す</text>
        <text x="36" y="104" font-size="9.5" class="accent">失敗の後始末は、呼んだ側の責任になる</text>

        <rect x="20" y="122" width="660" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="36" y="144" font-size="11">非同期 ― 受け付けだけ返して、後で処理する</text>
        <text x="36" y="164" font-size="9.5" class="muted">ファイルの追加や通知から呼ばれる形。呼んだ側は結果を待たない</text>
        <text x="36" y="182" font-size="9.5" class="accent">失敗はサービス側が再試行し、駄目なものは退避用のキューへ送る</text>

        <rect x="20" y="200" width="660" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="36" y="222" font-size="11">ポーリング ― サービス側が見張って、まとめて渡す</text>
        <text x="36" y="242" font-size="9.5" class="muted">キューやストリームが相手。たまった分をまとめて処理する</text>
        <text x="36" y="260" font-size="9.5" class="accent">成功したときだけ元から取り除かれる ― 失敗すれば、また来る</text>

        <text x="20" y="290" font-size="10.5" class="muted">どの形でも、同じものが二度届きうる。処理は「二度来ても壊れない」形にしておく。</text>
      </svg>
    </div>
  </body>
</html>
