<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 360"
        role="img"
        aria-label="TCPとUDPの違いの図解。TCPはデータが途中で消失するとタイムアウト後に再送し、確認応答で到着を保証する。UDPはデータグラムを送りっぱなしにし、途中で消失しても検知や再送はされず、到着順の保証もない。"
      >
        <defs>
          <marker
            id="arrowH"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ TCP ============ -->
        <text x="360" y="18" text-anchor="middle" font-size="13" font-weight="700">TCP ― 確認応答と再送で到着を保証する</text>

        <rect x="30" y="35" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="60" text-anchor="middle" font-size="12">送信側</text>
        <rect x="580" y="35" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="635" y="60" text-anchor="middle" font-size="12">受信側</text>

        <line x1="140" y1="60" x2="580" y2="60" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowH)" />
        <text x="360" y="50" text-anchor="middle" font-size="10.5" class="muted">① データ(seq=1000) → 到着</text>

        <line x1="580" y1="85" x2="140" y2="85" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowH)" />
        <text x="360" y="98" text-anchor="middle" font-size="10.5" class="muted">② ACK(ack=1001) ― 到着確認</text>

        <line x1="140" y1="120" x2="360" y2="120" stroke="var(--fg)" stroke-width="1.5" />
        <text x="378" y="124" font-size="14" style="fill: var(--primary)">×</text>
        <text x="360" y="140" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">③ データ(seq=1500) → 途中で消失</text>

        <line x1="140" y1="165" x2="580" y2="165" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowH)" />
        <text x="360" y="155" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">④ タイムアウト後に再送 → 到着</text>

        <line x1="0" y1="195" x2="720" y2="195" stroke="var(--border)" stroke-width="1" />

        <!-- ============ UDP ============ -->
        <text x="360" y="218" text-anchor="middle" font-size="13" font-weight="700">UDP ― 送りっぱなし(確認応答が無い)</text>

        <rect x="30" y="235" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="260" text-anchor="middle" font-size="12">送信側</text>
        <rect x="580" y="235" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="635" y="260" text-anchor="middle" font-size="12">受信側</text>

        <line x1="140" y1="252" x2="580" y2="252" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowH)" />
        <text x="360" y="245" text-anchor="middle" font-size="10.5" class="muted">データグラム1 → 到着</text>

        <line x1="140" y1="280" x2="360" y2="280" stroke="var(--fg)" stroke-width="1.5" />
        <text x="378" y="284" font-size="14" style="fill: var(--primary)">×</text>
        <text x="360" y="300" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">データグラム2 → 消失(検知も再送もされない)</text>

        <line x1="140" y1="322" x2="580" y2="322" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowH)" />
        <text x="360" y="315" text-anchor="middle" font-size="10.5" class="muted">データグラム3 → 到着(順序の保証なし)</text>

        <text x="360" y="350" text-anchor="middle" font-size="11.5" class="muted">
          往復のやり取りが無い分オーバーヘッドが小さく、ストリーミングやDNSなど速さ優先の用途に向く
        </text>
      </svg>
    </div>
  </body>
</html>
