<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="テストコード自体を静的解析したとき、どの境界で違反が検出されるかを示した図。左に3つの層が縦に並ぶ。テスト本体、Composable、Page Objectの順である。右にはブラウザの生のpageオブジェクトとセレクタがある。正規の経路は最下段のPage Objectから右へ向かう1本だけで、生のセレクタに触れてよいのはここに限られる。これに対し、テスト本体から直接セレクタを書く経路と、ComposableがPage Objectを通さずpageを触る経路の2本は境界を飛び越えており、それぞれ静的解析のルールが検出する。ほかにもPage Object同士が互いをimportして結合すること、使われなくなった公開メソッドが残ること、同じセレクタが複数ファイルに重複定義されることが、同じ仕組みで機械的に見つけられる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">層をまたぐ書き方は、人のレビューでは見落とす。境界ごとに機械が見張る</text>

        <rect x="16" y="40" width="272" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="152" y="73" font-size="10" text-anchor="middle">テスト本体</text>

        <rect x="16" y="116" width="272" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="152" y="149" font-size="10" text-anchor="middle">Composable</text>

        <rect x="16" y="192" width="272" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="152" y="225" font-size="10" text-anchor="middle">Page Object</text>

        <rect x="460" y="40" width="224" height="208" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="572" y="134" font-size="10" text-anchor="middle" class="muted">ブラウザの生の page</text>
        <text x="572" y="156" font-size="10" text-anchor="middle" class="muted">セレクタ</text>

        <line x1="292" y1="60" x2="456" y2="60" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arp)" />
        <text x="300" y="52" font-size="8.5" class="accent">✗ テスト本体に生のセレクタを直接書いた</text>
        <text x="300" y="76" font-size="8" class="mono muted">selector-purity</text>

        <line x1="292" y1="136" x2="456" y2="136" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arp)" />
        <text x="300" y="128" font-size="8.5" class="accent">✗ Page Objectを通さず page を触った</text>
        <text x="300" y="152" font-size="8" class="mono muted">no-page-in-flow</text>

        <line x1="292" y1="220" x2="456" y2="220" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="300" y="212" font-size="8.5" class="muted">唯一の正規の経路</text>

        <rect x="16" y="268" width="668" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="292" font-size="9" class="muted">同じ仕組みで見つかるもの ― Page Object同士のimport、使われなくなった公開メソッド、複数ファイルに重複したセレクタ定義</text>
      </svg>
    </div>
  </body>
</html>
