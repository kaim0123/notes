<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 900 260"
        role="img"
        aria-label="無線LANセキュリティの変遷の図解。WEPは固定鍵で数分で解読可能な脆弱な方式で現在は非推奨、WPAはTKIPで鍵を動的に変更し、WPA2はAES(CCMP)による強力な暗号化を採用し、WPA3はSAEという鍵交換方式でさらに安全性を強化した現在の標準になっている。"
      >
        <defs>
          <marker
            id="arrowWs"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="20" y="60" width="180" height="60" rx="7" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="110" y="88" text-anchor="middle" font-size="14" font-weight="700" class="muted">WEP</text>
        <text x="110" y="106" text-anchor="middle" font-size="9.5" class="muted">脆弱(現在は非推奨)</text>
        <text x="110" y="140" text-anchor="middle" font-size="9.5" class="muted">固定鍵・数分で解読可能</text>

        <line x1="200" y1="90" x2="235" y2="90" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowWs)" />

        <rect x="240" y="60" width="180" height="60" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="330" y="95" text-anchor="middle" font-size="14" font-weight="700">WPA</text>
        <text x="330" y="140" text-anchor="middle" font-size="9.5" class="muted">TKIPで鍵を動的に変更</text>

        <line x1="420" y1="90" x2="455" y2="90" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowWs)" />

        <rect x="460" y="60" width="180" height="60" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="550" y="95" text-anchor="middle" font-size="14" font-weight="700">WPA2</text>
        <text x="550" y="140" text-anchor="middle" font-size="9.5" class="muted">AES(CCMP)で強力に暗号化</text>

        <line x1="640" y1="90" x2="675" y2="90" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowWs)" />

        <rect x="680" y="60" width="180" height="60" rx="8" fill="var(--primary)" />
        <text x="770" y="90" text-anchor="middle" font-size="15" font-weight="700" style="fill: var(--primary-fg)">WPA3</text>
        <text x="770" y="108" text-anchor="middle" font-size="9.5" style="fill: var(--primary-fg)">現在の標準</text>
        <text x="770" y="140" text-anchor="middle" font-size="9.5" style="fill: var(--primary)">SAEで鍵交換をさらに強化</text>

        <text x="450" y="200" text-anchor="middle" font-size="12" class="muted">
          事前共有鍵(個人向け)に加え、802.1Xでユーザーごとに認証するエンタープライズ方式もある
        </text>
      </svg>
    </div>
  </body>
</html>
