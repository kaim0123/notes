<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="ログイン処理を毎回繰り返さないための3つの手段を並べて比較した図。左は状態を保存して配る方式で、準備専用のテストが1回だけ実際のログイン画面を通り、Cookieなどのブラウザ状態をファイルへ保存し、以降のテストはその状態を読み込んだ状態で起動する。ログイン画面自体もテストされるのが利点で、ログインをテストしたいときだけ状態を空にして始める。中央はAPIでセッションを作る方式で、認証APIを直接叩き、返ってきたCookieをブラウザへ注入するため、画面を開いた時点で認証済みになる。ログイン画面を一度も通らないので速いが、画面側の不具合は別のテストで拾う必要がある。右はタグで宣言する方式で、テストにどのロールとして動くかをタグで書き、フィクスチャがそれを解決して該当ロールで起動する。テスト本文に認証処理が一行も現れない。どれを選んでも、テスト本体に残るのはログイン済みで始まるという結果だけである。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">目的は同じ ― ログインを毎回繰り返さない。違いは、どこでコストを払うか</text>

        <text x="16" y="46" font-size="10.5">A. 状態を保存して配る</text>
        <rect x="16" y="56" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="132" y="80" font-size="9.5" text-anchor="middle" class="muted">準備専用のテストが1回だけ</text>
        <line x1="132" y1="96" x2="132" y2="110" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="140" y="107" font-size="8" class="muted">ログイン画面を通る</text>
        <rect x="16" y="114" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="132" y="138" font-size="9.5" text-anchor="middle" class="muted">Cookieをファイルへ保存</text>
        <line x1="132" y1="154" x2="132" y2="168" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="140" y="165" font-size="8" class="muted">読み込ませて起動</text>
        <rect x="16" y="172" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="132" y="196" font-size="9.5" text-anchor="middle" class="accent">ログイン済みで始まる</text>
        <text x="16" y="234" font-size="8.5" class="muted">ログイン画面自体もテストされる。</text>
        <text x="16" y="250" font-size="8.5" class="muted">ログインを試したいテストだけ、</text>
        <text x="16" y="266" font-size="8.5" class="muted">状態を空にして始める。</text>

        <text x="264" y="46" font-size="10.5">B. APIでセッションを作る</text>
        <rect x="264" y="56" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="380" y="80" font-size="9.5" text-anchor="middle" class="muted">認証APIを直接叩く</text>
        <line x1="380" y1="96" x2="380" y2="110" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="388" y="107" font-size="8" class="muted">返ったCookieを</text>
        <rect x="264" y="114" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="380" y="138" font-size="9.5" text-anchor="middle" class="muted">ブラウザへ注入する</text>
        <line x1="380" y1="154" x2="380" y2="168" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="388" y="165" font-size="8" class="muted">画面を開いた時点で</text>
        <rect x="264" y="172" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="380" y="196" font-size="9.5" text-anchor="middle" class="accent">ログイン済みで始まる</text>
        <text x="264" y="234" font-size="8.5" class="muted">ログイン画面を一度も通らない。</text>
        <text x="264" y="250" font-size="8.5" class="muted">速い代わりに、画面側の不具合は</text>
        <text x="264" y="266" font-size="8.5" class="muted">別のテストで拾う必要がある。</text>

        <text x="512" y="46" font-size="10.5">C. タグで宣言する</text>
        <rect x="512" y="56" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="628" y="80" font-size="9" text-anchor="middle" class="mono muted">@auth:member</text>
        <line x1="628" y1="96" x2="628" y2="110" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="636" y="107" font-size="8" class="muted">タグを解決する</text>
        <rect x="512" y="114" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="628" y="138" font-size="9.5" text-anchor="middle" class="muted">フィクスチャが用意する</text>
        <line x1="628" y1="154" x2="628" y2="168" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="636" y="165" font-size="8" class="muted">そのロールで</text>
        <rect x="512" y="172" width="232" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="628" y="196" font-size="9.5" text-anchor="middle" class="accent">ログイン済みで始まる</text>
        <text x="512" y="234" font-size="8.5" class="muted">テスト本文に認証処理が現れない。</text>
        <text x="512" y="250" font-size="8.5" class="muted">どのロールで動くテストなのかも、</text>
        <text x="512" y="266" font-size="8.5" class="muted">タグを見るだけで分かる。</text>

        <line x1="16" y1="286" x2="744" y2="286" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="306" font-size="10.5" class="muted">どれを選んでも、テスト本体に残るのは「ログイン済みで始まる」という結果だけ。手段の違いは外に出ない。</text>
      </svg>
    </div>
  </body>
</html>
