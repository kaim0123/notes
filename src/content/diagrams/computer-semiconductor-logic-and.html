<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="直列つなぎの回路図。電源から出た一本の道に豆電球AとBが順につながり、電源へ戻る。一本道なのでどちらか一方でも切れれば全体が消える ― 両方が1のときだけ全体が1になる、かけ算(AND)の関係。" viewBox="0 0 560 180">

      <line x1="60" y1="60" x2="60" y2="120" stroke="var(--muted)" stroke-width="3" />
      <line x1="72" y1="75" x2="72" y2="105" stroke="var(--muted)" stroke-width="1.5" />
      <text x="50" y="150" fill="var(--muted)" font-size="11">電源</text>

      <line x1="60" y1="60" x2="180" y2="60" stroke="var(--muted)" stroke-width="1.5" />

      <circle cx="220" cy="60" r="24" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="220" y="65" fill="var(--fg)" font-size="13" text-anchor="middle">A</text>
      <line x1="244" y1="60" x2="296" y2="60" stroke="var(--muted)" stroke-width="1.5" />

      <circle cx="320" cy="60" r="24" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="320" y="65" fill="var(--fg)" font-size="13" text-anchor="middle">B</text>

      <line x1="344" y1="60" x2="460" y2="60" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="460" y1="60" x2="460" y2="120" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="460" y1="120" x2="72" y2="120" stroke="var(--muted)" stroke-width="1.5" />
      <text x="280" y="150" fill="var(--muted)" font-size="11" text-anchor="middle">A と B は一本道(直列)。どちらか切れれば全体が消える</text>
      </svg>
    </div>
  </body>
</html>
