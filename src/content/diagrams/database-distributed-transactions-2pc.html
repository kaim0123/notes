<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 780 340"
        role="img"
        aria-label="2相コミット(2PC)のシーケンス図。第1フェーズでコーディネータが参加者A・B・Cにprepareを問い合わせ、各参加者はYesを返す。第2フェーズで全員がYesだったためコーディネータがcommitを指示し、全員がコミットを完了する。1人でもNoを返した場合は全員にabortが指示される。"
      >
        <defs>
          <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- ヘッダーボックス -->
        <rect x="20" y="10" width="120" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="35" text-anchor="middle" font-size="12.5" font-weight="600">コーディネータ</text>

        <rect x="240" y="10" width="120" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="300" y="35" text-anchor="middle" font-size="12.5" font-weight="600">参加者A</text>

        <rect x="440" y="10" width="120" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="500" y="35" text-anchor="middle" font-size="12.5" font-weight="600">参加者B</text>

        <rect x="640" y="10" width="120" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="700" y="35" text-anchor="middle" font-size="12.5" font-weight="600">参加者C</text>

        <!-- ライフライン -->
        <line x1="80" y1="50" x2="80" y2="300" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="300" y1="50" x2="300" y2="300" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="500" y1="50" x2="500" y2="300" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="700" y1="50" x2="700" y2="300" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />

        <!-- フェーズ1: Prepare -->
        <text x="20" y="82" font-size="11.5" font-weight="600" style="fill: var(--primary)">第1フェーズ</text>
        <path d="M80,92 L300,92" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <path d="M80,92 L500,92" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <path d="M80,92 L700,92" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <text x="400" y="82" text-anchor="middle" font-size="11.5">① Prepare(コミットできる?)</text>

        <path d="M300,130 L80,130" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <path d="M500,130 L80,130" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <path d="M700,130 L80,130" stroke="var(--muted)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)" />
        <text x="400" y="122" text-anchor="middle" font-size="11.5" class="muted">Yes(準備OK) ― 全員が返答</text>

        <!-- フェーズ2: Commit -->
        <text x="20" y="172" font-size="11.5" font-weight="600" style="fill: var(--primary)">第2フェーズ</text>
        <path d="M80,182 L300,182" stroke="var(--primary)" stroke-width="1.6" fill="none" marker-end="url(#arrowP)" />
        <path d="M80,182 L500,182" stroke="var(--primary)" stroke-width="1.6" fill="none" marker-end="url(#arrowP)" />
        <path d="M80,182 L700,182" stroke="var(--primary)" stroke-width="1.6" fill="none" marker-end="url(#arrowP)" />
        <text x="400" y="172" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">② Commit(全員Yesだったので確定を指示)</text>

        <rect x="220" y="210" width="520" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="480" y="236" text-anchor="middle" font-size="12.5" font-weight="600" style="fill: var(--primary)">
          全参加者がコミット完了 ― 強い一貫性を実現
        </text>

        <text x="480" y="284" text-anchor="middle" font-size="11.5" class="muted">
          1人でもNoを返すか応答不能になった場合、コーディネータは全員にAbort(ロールバック)を指示する
        </text>
        <text x="480" y="304" text-anchor="middle" font-size="11.5" class="muted">
          この間、参加者は結果が来るまで自分の判断で先に進めず待たされる(ブロッキング)
        </text>
      </svg>
    </div>
  </body>
</html>
