<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="プログラミング言語を見る3つの軸を並べた図。1段目のパラダイムは、命令型(手続き型・オブジェクト指向)と宣言型(関数型・論理型)の4つ。2段目の実行方式は、コンパイル・インタプリタ・バイトコードと仮想マシン・JITの4つ。3段目の型システムは、静的型付けと動的型付けの2つ。3つの軸は互いに独立しており、Goは命令型・コンパイル・静的型付け、JavaScriptはマルチパラダイム・JIT・動的型付けというように、言語ごとに組み合わせが異なる。"
      >
        <text x="16" y="64" font-size="12" class="lbl">パラダイム</text>
        <text x="16" y="146" font-size="12" class="lbl">実行方式</text>
        <text x="16" y="226" font-size="12" class="lbl">型システム</text>

        <text x="188" y="34" text-anchor="middle" font-size="11" class="muted">命令型 ― どうやって(How)</text>
        <text x="492" y="34" text-anchor="middle" font-size="11" class="muted">宣言型 ― 何を(What)</text>
        <line x1="130" y1="42" x2="364" y2="42" stroke="var(--border)" stroke-width="1.4" />
        <line x1="376" y1="42" x2="610" y2="42" stroke="var(--border)" stroke-width="1.4" />

        <rect x="130" y="50" width="110" height="32" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="185" y="70" text-anchor="middle" font-size="12">手続き型</text>
        <rect x="252" y="50" width="112" height="32" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="308" y="70" text-anchor="middle" font-size="12">オブジェクト指向</text>
        <rect x="376" y="50" width="110" height="32" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="431" y="70" text-anchor="middle" font-size="12">関数型</text>
        <rect x="498" y="50" width="112" height="32" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="554" y="70" text-anchor="middle" font-size="12">論理型</text>

        <rect x="130" y="126" width="110" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="185" y="143" text-anchor="middle" font-size="12">コンパイル</text>
        <text x="185" y="157" text-anchor="middle" font-size="10" class="muted">事前に一括翻訳</text>
        <rect x="252" y="126" width="112" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="308" y="143" text-anchor="middle" font-size="12">インタプリタ</text>
        <text x="308" y="157" text-anchor="middle" font-size="10" class="muted">その場で解釈</text>
        <rect x="376" y="126" width="110" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="431" y="143" text-anchor="middle" font-size="12">バイトコード</text>
        <text x="431" y="157" text-anchor="middle" font-size="10" class="muted">VMが実行</text>
        <rect x="498" y="126" width="112" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="554" y="143" text-anchor="middle" font-size="12">JIT</text>
        <text x="554" y="157" text-anchor="middle" font-size="10" class="muted">動かしながら翻訳</text>

        <rect x="130" y="206" width="234" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="247" y="223" text-anchor="middle" font-size="12">静的型付け</text>
        <text x="247" y="237" text-anchor="middle" font-size="10" class="muted">型は実行前(コンパイル時)に決まる</text>
        <rect x="376" y="206" width="234" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="493" y="223" text-anchor="middle" font-size="12">動的型付け</text>
        <text x="493" y="237" text-anchor="middle" font-size="10" class="muted">型は実行時に決まる</text>

        <line x1="16" y1="262" x2="624" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="282" font-size="11" class="muted">3つの軸は独立している ― 例: Go = 命令型 / コンパイル / 静的、JavaScript = マルチパラダイム / JIT / 動的</text>
      </svg>
    </div>
  </body>
</html>
