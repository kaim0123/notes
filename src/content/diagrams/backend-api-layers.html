<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 340" role="img" aria-label="フロントエンド・API・バックエンド・データベースの役割の違いを示した図。左に4つの層が縦に並び、上からフロントエンド、API、バックエンド、データベース。依頼は上から下へ順に渡され、結果は逆順に返る。APIとバックエンドは同じサーバーの中にあり、APIはその外向きの面だけを指す。この境界を破線の枠で囲って示している。フロントエンドからデータベースへ直接向かう矢印には×印が付いており、外から見える窓口はAPIだけで、データベースを操作するのは奥のバックエンドの役目であることを示す。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="196" y="96" width="252" height="152" rx="10" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="456" y="118" font-size="10.5" class="muted">1つのサーバーの中</text>

        <rect x="220" y="20" width="204" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="236" y="45" font-size="12">フロントエンド</text>
        <text x="352" y="45" font-size="10.5" class="muted">画面</text>

        <line x1="322" y1="60" x2="322" y2="106" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arp)" />
        <text x="334" y="86" font-size="10.5" class="lbl">HTTPで頼む</text>

        <rect x="220" y="110" width="204" height="40" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="236" y="135" font-size="12" class="lbl">API</text>
        <text x="300" y="135" font-size="10.5" class="muted">外向きの窓口(受付)</text>

        <line x1="322" y1="150" x2="322" y2="190" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />

        <rect x="220" y="194" width="204" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="236" y="219" font-size="12">バックエンド</text>
        <text x="330" y="219" font-size="10.5" class="muted">処理の本体</text>

        <line x1="322" y1="234" x2="322" y2="274" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />

        <rect x="220" y="278" width="204" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="236" y="303" font-size="12">データベース</text>
        <text x="336" y="303" font-size="10.5" class="muted">保管場所</text>

        <path d="M220,40 C120,40 120,298 220,298" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" />
        <circle cx="140" cy="169" r="11" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.2" />
        <text x="134" y="174" font-size="12" class="muted">×</text>
        <text x="20" y="150" font-size="10.5" class="muted">直接はつながらない</text>
        <text x="20" y="196" font-size="10.5" class="muted">(窓口はAPIだけ)</text>

        <path d="M424,130 C520,130 520,45 448,45" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="470" y="86" font-size="10.5" class="muted">結果は逆順に返る</text>
      </svg>
    </div>
  </body>
</html>
