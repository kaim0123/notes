<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="同じ間違いが、いつ見つかるかを時間軸で比べた図。左から順に、コードを書いている最中、ビルド(tsc)の段階、実行の段階、そして本番で利用者が踏む段階の4つが並ぶ。TypeScriptでは、数値に文字列を代入する誤りや、数値に対して文字列用のメソッドを呼ぶ誤りが、書いている最中とビルドの段階で見つかる。JavaScriptだけの場合、同じ誤りはビルドを素通りし、その行が実際に実行された瞬間に初めてエラーになる。さらにその行が滅多に通らない分岐にあると、本番で利用者が踏むまで誰も気づかない。型注釈が効くのは、この発見のタイミングを左へずらすことにある。"
      >
        <defs>
          <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <line x1="16" y1="60" x2="608" y2="60" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arv)" />
        <text x="624" y="64" text-anchor="end" font-size="11" class="muted">時間</text>

        <line x1="80" y1="52" x2="80" y2="68" stroke="var(--muted)" stroke-width="1.2" />
        <text x="80" y="42" text-anchor="middle" font-size="11.5">書いている最中</text>
        <line x1="240" y1="52" x2="240" y2="68" stroke="var(--muted)" stroke-width="1.2" />
        <text x="240" y="42" text-anchor="middle" font-size="11.5">ビルド(tsc)</text>
        <line x1="400" y1="52" x2="400" y2="68" stroke="var(--muted)" stroke-width="1.2" />
        <text x="400" y="42" text-anchor="middle" font-size="11.5">実行</text>
        <line x1="560" y1="52" x2="560" y2="68" stroke="var(--muted)" stroke-width="1.2" />
        <text x="560" y="42" text-anchor="middle" font-size="11.5">本番・利用者</text>

        <text x="16" y="100" font-size="11.5" class="lbl">TypeScript</text>
        <rect x="16" y="110" width="288" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="30" y="130" font-size="11" font-family="monospace" class="muted">const n: number = &quot;42&quot;</text>
        <text x="30" y="148" font-size="11" font-family="monospace" class="muted">n.toUpperCase()</text>
        <text x="290" y="140" text-anchor="end" font-size="11.5" class="lbl">ここで止まる</text>

        <text x="16" y="186" font-size="11.5" class="muted">JavaScript のみ</text>
        <rect x="16" y="196" width="592" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="30" y="216" font-size="11" font-family="monospace" class="muted">const n = &quot;42&quot;</text>
        <text x="30" y="234" font-size="11" font-family="monospace" class="muted">n.toUpperCase()  // 動いてしまう</text>
        <text x="404" y="216" font-size="11" class="muted">その行を通った瞬間に初めて失敗</text>
        <text x="404" y="234" font-size="11" class="muted">滅多に通らない分岐なら、ここまで残る</text>

        <text x="16" y="268" font-size="11" class="muted">型注釈の効用は「間違いを無くすこと」ではなく、見つかるタイミングを左へずらすこと</text>
      </svg>
    </div>
  </body>
</html>
