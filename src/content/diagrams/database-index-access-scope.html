<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 400"
        role="img"
        aria-label="データベースのアクセス制御を示す図解。管理者(admin)はordersテーブルに対してGRANTによりSELECT・INSERT・UPDATE・DELETEすべてを許可される。一方アプリ用アカウント(app_user)はordersテーブルへの直接アクセスをREVOKEで禁止され、customer_idとamountだけを公開するビューvw_ordersを経由してSELECT権限のみが許可される。ビューは内部でordersテーブルの全列を参照するが、外部に公開するのは限られた列だけである。"
      >
        <defs>
          <marker id="arrowMuted2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowPrimary2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- 見出し -->
        <text x="115" y="26" text-anchor="middle" font-size="13" font-weight="700">管理者(admin)</text>
        <text x="645" y="26" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">アプリ用アカウント(app_user)</text>

        <!-- アカウント -->
        <rect x="30" y="36" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="115" y="63" text-anchor="middle" font-size="12">admin ロール</text>

        <rect x="560" y="36" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="645" y="63" text-anchor="middle" font-size="12" style="fill: var(--primary)">app_user ロール</text>

        <!-- admin -> テーブル(直接・全権) -->
        <path d="M115,80 L115,268 L330,268 L330,304" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted2)" />
        <text x="222" y="248" text-anchor="middle" font-size="10.5" class="muted">GRANT SELECT, INSERT,</text>
        <text x="222" y="262" text-anchor="middle" font-size="10.5" class="muted">UPDATE, DELETE</text>

        <!-- app_user -> テーブル(直接アクセスは禁止・X印) -->
        <path d="M600,80 L600,150" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 4" />
        <g transform="translate(600,150)">
          <circle r="12" fill="var(--card)" stroke="var(--muted)" stroke-width="1.4" />
          <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="var(--muted)" stroke-width="1.6" />
        </g>
        <text x="600" y="182" text-anchor="middle" font-size="10.5" class="muted">直接アクセスは</text>
        <text x="600" y="196" text-anchor="middle" font-size="10.5" class="muted">REVOKE済み</text>

        <!-- app_user -> ビュー(許可) -->
        <path d="M690,80 L690,120 L575,120 L575,166" fill="none" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowPrimary2)" />
        <text x="690" y="106" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">GRANT SELECT</text>
        <text x="690" y="120" text-anchor="middle" font-size="10.5" style="fill: var(--primary)" dy="0"></text>
        <text x="632" y="106" text-anchor="middle" font-size="10.5" style="fill: var(--primary)"></text>

        <!-- ビュー -->
        <rect x="460" y="168" width="230" height="72" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="575" y="194" text-anchor="middle" font-size="12.5" font-weight="700" style="fill: var(--primary)">ビュー: vw_orders</text>
        <text x="575" y="212" text-anchor="middle" font-size="10.5" class="muted">customer_id, amount のみ</text>
        <text x="575" y="228" text-anchor="middle" font-size="10.5" class="muted">card_noなど機微な列は含まない</text>

        <!-- ビュー -> テーブル(内部参照) -->
        <path d="M575,240 L575,272 L390,272 L390,304" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted2)" />
        <text x="482" y="292" text-anchor="middle" font-size="10" class="muted">内部でテーブルの全列を参照</text>

        <!-- テーブル本体 -->
        <rect x="290" y="306" width="200" height="66" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="390" y="332" text-anchor="middle" font-size="12.5" font-weight="700">ordersテーブル</text>
        <text x="390" y="350" text-anchor="middle" font-size="10.5" class="muted">id / customer_id / amount /</text>
        <text x="390" y="364" text-anchor="middle" font-size="10.5" class="muted">card_no ...(全列)</text>

        <text x="380" y="392" text-anchor="middle" font-size="11" style="fill: var(--primary)">
          アプリ用アカウントには直接ではなくビュー経由で必要な列だけを渡し、最小権限を保つ
        </text>
      </svg>
    </div>
  </body>
</html>
