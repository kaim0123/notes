<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 700 320" role="img" aria-label="エラーを境界で1度だけ処理する構造の図。左は各層でtry/catchする形で、データアクセス層・ドメイン層・HTTP層のすべてで捕まえて記録しているため、同じエラーが3回記録され、握りつぶした箇所では原因が失われる。右は境界で1度だけ処理する形で、データアクセス層はDBのエラーコードを業務的な失敗へ翻訳して上へ渡し、ドメイン層はそのまま通し、外界との境界であるHTTP層だけが記録して409などの応答に変換する。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">各層で捕まえる</text>

        <rect x="50" y="46" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="65" text-anchor="middle" font-size="11">HTTP層</text>
        <text x="165" y="81" text-anchor="middle" font-size="10" class="muted">catch してログ</text>
        <line x1="165" y1="110" x2="165" y2="92" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="50" y="114" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="133" text-anchor="middle" font-size="11">ドメイン層</text>
        <text x="165" y="149" text-anchor="middle" font-size="10" class="muted">catch してログして再送出</text>
        <line x1="165" y1="178" x2="165" y2="160" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="50" y="182" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="201" text-anchor="middle" font-size="11">データアクセス層</text>
        <text x="165" y="217" text-anchor="middle" font-size="10" class="muted">catch してログ</text>

        <text x="165" y="256" text-anchor="middle" font-size="11" class="muted">同じエラーが3回記録され、</text>
        <text x="165" y="274" text-anchor="middle" font-size="11" class="muted">握りつぶした箇所では原因が失われる</text>

        <line x1="350" y1="30" x2="350" y2="290" stroke="var(--border)" stroke-width="1.2" />

        <text x="525" y="26" text-anchor="middle" font-size="12.5" font-weight="600">境界で1度だけ処理する</text>

        <rect x="410" y="46" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="525" y="65" text-anchor="middle" font-size="11" font-weight="600">HTTP層(外界との境界)</text>
        <text x="525" y="81" text-anchor="middle" font-size="10" class="hi">ここだけが記録し、409へ変換</text>
        <line x1="525" y1="110" x2="525" y2="92" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <rect x="410" y="114" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="525" y="133" text-anchor="middle" font-size="11">ドメイン層</text>
        <text x="525" y="149" text-anchor="middle" font-size="10" class="muted">回復できないので、そのまま通す</text>
        <line x1="525" y1="178" x2="525" y2="160" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <rect x="410" y="182" width="230" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="525" y="201" text-anchor="middle" font-size="11">データアクセス層</text>
        <text x="525" y="217" text-anchor="middle" font-size="10" class="muted">一意制約違反 → 登録済みエラーへ翻訳</text>

        <text x="525" y="256" text-anchor="middle" font-size="11" class="muted">記録は1回。層をまたぐときに翻訳し、</text>
        <text x="525" y="274" text-anchor="middle" font-size="11" class="muted">元の原因はcauseとして保持する</text>

        <text x="350" y="308" text-anchor="middle" font-size="11" class="muted">
          捕まえた結果として何もできないなら、そもそも捕まえない
        </text>
      </svg>
    </div>
  </body>
</html>
