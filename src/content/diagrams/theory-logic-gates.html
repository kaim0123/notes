<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 770 200"
        role="img"
        aria-label="AND・OR・NOTの3つの論理ゲートを、入力線が箱に入り出力線が出ていく回路図として並べた図解。NOTだけ入力が1本で出力の手前に反転を表す丸印が付く"
      >
        <defs>
          <marker
            id="arrow3"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- AND -->
        <text x="15" y="70" font-size="11" class="muted">A</text>
        <line x1="20" y1="75" x2="85" y2="75" stroke="var(--fg)" stroke-width="1.5" />
        <text x="15" y="130" font-size="11" class="muted">B</text>
        <line x1="20" y1="125" x2="85" y2="125" stroke="var(--fg)" stroke-width="1.5" />
        <rect x="85" y="60" width="90" height="80" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="95" text-anchor="middle" font-size="20" font-weight="700">AND</text>
        <text x="130" y="120" text-anchor="middle" font-size="13" class="muted">∧</text>
        <line x1="175" y1="100" x2="222" y2="100" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow3)" />
        <text x="228" y="104" font-size="11" class="muted">Y</text>

        <!-- OR -->
        <text x="265" y="70" font-size="11" class="muted">A</text>
        <line x1="270" y1="75" x2="335" y2="75" stroke="var(--fg)" stroke-width="1.5" />
        <text x="265" y="130" font-size="11" class="muted">B</text>
        <line x1="270" y1="125" x2="335" y2="125" stroke="var(--fg)" stroke-width="1.5" />
        <rect x="335" y="60" width="90" height="80" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="95" text-anchor="middle" font-size="20" font-weight="700">OR</text>
        <text x="380" y="120" text-anchor="middle" font-size="13" class="muted">∨</text>
        <line x1="425" y1="100" x2="472" y2="100" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow3)" />
        <text x="478" y="104" font-size="11" class="muted">Y</text>

        <!-- NOT -->
        <text x="515" y="93" font-size="11" class="muted">A</text>
        <line x1="520" y1="100" x2="585" y2="100" stroke="var(--fg)" stroke-width="1.5" />
        <rect x="585" y="60" width="90" height="80" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="95" text-anchor="middle" font-size="20" font-weight="700">NOT</text>
        <text x="630" y="120" text-anchor="middle" font-size="13" class="muted">¬</text>
        <circle cx="681" cy="100" r="6" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5" />
        <line x1="687" y1="100" x2="734" y2="100" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow3)" />
        <text x="740" y="104" font-size="11" class="muted">Y</text>
      </svg>
    </div>
  </body>
</html>
