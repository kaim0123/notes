<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 260" role="img" aria-label="CRCカードの図。1枚のカードが3段に分かれ、上段にクラス名(注文)、左下に責務(明細の合計を計算する、発送可能かを判定する)、右下に協力者(明細、在庫サービス)が書かれる。カードの下には、チームでカードを動かしながらこの責務は本当にこのクラスが持つべきかを議論する、という使い方が示されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">1枚のカードに「役割・責任・協力相手」を書き出す</text>

        <rect x="150" y="44" width="360" height="152" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <line x1="150" y1="82" x2="510" y2="82" stroke="var(--primary)" stroke-width="1.4" />
        <line x1="330" y1="82" x2="330" y2="196" stroke="var(--border)" stroke-width="1.3" />

        <text x="330" y="70" text-anchor="middle" font-size="12.5" font-weight="600">Class: 注文</text>

        <text x="170" y="104" font-size="10.5" class="muted">Responsibility(責務)</text>
        <text x="170" y="128" font-size="10.5">明細の合計を計算する</text>
        <text x="170" y="150" font-size="10.5">発送可能かを判定する</text>
        <text x="170" y="180" font-size="9.5" class="muted">何を知り、何をする責任があるか</text>

        <text x="350" y="104" font-size="10.5" class="muted">Collaborator(協力者)</text>
        <text x="350" y="128" font-size="10.5">明細</text>
        <text x="350" y="150" font-size="10.5">在庫サービス</text>
        <text x="350" y="180" font-size="9.5" class="muted">誰と一緒なら果たせるか</text>

        <text x="330" y="228" text-anchor="middle" font-size="11" class="muted">チームでカードを動かしながら</text>
        <text x="330" y="246" text-anchor="middle" font-size="11" class="muted">「この責務は本当にこのクラスが持つべきか」を議論する</text>
      </svg>
    </div>
  </body>
</html>
