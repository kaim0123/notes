<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="静的サイトでセキュリティヘッダを付ける場所を示した図。ビルドで書き出されたHTML・CSS・JavaScriptのファイルには、リクエストごとに処理を行うサーバーのコードが含まれていない。ヘッダを差し込めるのは、そのファイルを配信しているホスティングやCDNの層であり、ここでCSPやHSTSといったヘッダを付けてブラウザへ返す。ブラウザは受け取ったヘッダに従って振る舞う。Next.jsで静的エクスポートを行う構成では、設定ファイルのheaders定義は動作するサーバーがないため無視される点に注意が必要で、ヘッダは必ず配信先の設定に書く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="30" y="76" width="170" height="66" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="115" y="102" font-size="10.5" text-anchor="middle">ビルド成果物</text>
        <text x="115" y="121" font-size="9" text-anchor="middle" class="muted">HTML / CSS / JS</text>

        <rect x="290" y="66" width="190" height="86" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="385" y="92" font-size="10.5" text-anchor="middle">ホスティング / CDN</text>
        <text x="385" y="113" font-size="9.5" text-anchor="middle" class="accent">ここでヘッダを付ける</text>
        <text x="385" y="133" font-size="9" text-anchor="middle" class="muted">CSP・HSTS・X-Frame-Options …</text>

        <rect x="570" y="76" width="160" height="66" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="650" y="102" font-size="10.5" text-anchor="middle">ブラウザ</text>
        <text x="650" y="121" font-size="9" text-anchor="middle" class="muted">ヘッダに従って振る舞う</text>

        <line x1="204" y1="109" x2="286" y2="109" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="484" y1="109" x2="566" y2="109" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="245" y="101" font-size="9" text-anchor="middle" class="muted">置くだけ</text>
        <text x="525" y="101" font-size="9" text-anchor="middle" class="muted">返す</text>

        <text x="115" y="166" font-size="9" text-anchor="middle" class="muted">リクエストを処理する</text>
        <text x="115" y="182" font-size="9" text-anchor="middle" class="muted">サーバーのコードが無い</text>

        <rect x="290" y="176" width="440" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="510" y="197" font-size="9.5" text-anchor="middle" class="muted">静的エクスポートの構成では、設定ファイル側の headers 定義は効かない</text>

        <line x1="16" y1="230" x2="744" y2="230" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="252" font-size="10.5" class="muted">アプリのコードを1行も変えずに積める防御。ただし積める場所は、配信の層にしかない。</text>
        <text x="16" y="274" font-size="10.5" class="accent">設定したら必ず、実際にヘッダが返っているかを確かめる ― 書いたのに効いていない、がいちばん多い失敗。</text>
      </svg>
    </div>
  </body>
</html>
