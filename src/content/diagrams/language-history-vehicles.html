<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="言語が普及するときには必ず一緒に運んでくれた「乗り物」があったことを示した対応図。C言語はUNIXに乗って大学・研究機関・企業へ広がった。JavaScriptはWebブラウザに乗って、世界中のあらゆる端末へ届いた。Javaは仮想マシンJVMと企業システムに乗って、書けばどこでも動くという約束とともに広まった。Objective-CとSwiftはiPhone・iOSに乗ってモバイル開発の標準になった。PythonはNumPyやPyTorchといった機械学習ライブラリの蓄積に乗って、AI開発の事実上の標準になった。言語そのものの設計だけで普及が決まったわけではない、という共通点を示している。"
      >
        <text x="16" y="26" font-size="12" class="lbl">言語</text>
        <text x="300" y="26" text-anchor="middle" font-size="12" class="muted">乗った「乗り物」</text>
        <text x="624" y="26" text-anchor="end" font-size="12" class="lbl">届いた先</text>

        <defs>
          <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="40" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="76" y="62" text-anchor="middle" font-size="12">C(1972)</text>
        <line x1="136" y1="57" x2="196" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <rect x="200" y="40" width="200" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="62" text-anchor="middle" font-size="11.5" class="muted">UNIX(OS自体がCで書かれた)</text>
        <line x1="400" y1="57" x2="460" y2="57" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <text x="624" y="62" text-anchor="end" font-size="11.5">大学・研究機関・企業</text>

        <rect x="16" y="88" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="76" y="110" text-anchor="middle" font-size="12">JavaScript(1995)</text>
        <line x1="136" y1="105" x2="196" y2="105" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <rect x="200" y="88" width="200" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="110" text-anchor="middle" font-size="11.5" class="muted">Webブラウザ</text>
        <line x1="400" y1="105" x2="460" y2="105" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <text x="624" y="110" text-anchor="end" font-size="11.5">世界中のあらゆる端末</text>

        <rect x="16" y="136" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="76" y="158" text-anchor="middle" font-size="12">Java(1995)</text>
        <line x1="136" y1="153" x2="196" y2="153" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <rect x="200" y="136" width="200" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="158" text-anchor="middle" font-size="11.5" class="muted">JVM と 企業システム</text>
        <line x1="400" y1="153" x2="460" y2="153" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <text x="624" y="158" text-anchor="end" font-size="11.5">基幹システム・Android</text>

        <rect x="16" y="184" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="76" y="206" text-anchor="middle" font-size="12">Objective-C / Swift</text>
        <line x1="136" y1="201" x2="196" y2="201" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <rect x="200" y="184" width="200" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="206" text-anchor="middle" font-size="11.5" class="muted">iPhone / iOS</text>
        <line x1="400" y1="201" x2="460" y2="201" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <text x="624" y="206" text-anchor="end" font-size="11.5">モバイル開発の標準</text>

        <rect x="16" y="232" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="76" y="254" text-anchor="middle" font-size="12">Python(1991)</text>
        <line x1="136" y1="249" x2="196" y2="249" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <rect x="200" y="232" width="200" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="254" text-anchor="middle" font-size="11.5" class="muted">NumPy / PyTorch の蓄積</text>
        <line x1="400" y1="249" x2="460" y2="249" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arh)" />
        <text x="624" y="254" text-anchor="end" font-size="11.5">AI開発の事実上の標準</text>

        <text x="16" y="288" font-size="11" class="muted">どんなに優れた言語でも、運んでくれるOS・ブラウザ・ライブラリ群がなければ研究室の中で終わる</text>
      </svg>
    </div>
  </body>
</html>
