<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="障害が起きてから振り返りまでの時間軸を示した図。発生から検知までが検知にかかる時間で、ここを縮めるのは監視の仕事である。検知のあとは招集・切り分け・止血と続き、復旧までの全体が復旧にかかる時間になる。ここを縮めるのは対応の型の仕事で、暫定対応で先に出血を止め、原因を取り除く恒久対応はその後に落ち着いて行う。最後のポストモーテムは個人を責める場ではなく、なぜ検知が遅れ、なぜ仕組みで防げなかったかを問い直して次の検知と防止に戻す工程である。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <line x1="40" y1="150" x2="730" y2="150" stroke="var(--border)" />

        <line x1="60" y1="140" x2="60" y2="160" stroke="var(--fg)" />
        <text x="60" y="132" font-size="11" text-anchor="middle">発生</text>
        <text x="60" y="180" font-size="9.5" text-anchor="middle" class="muted">まだ誰も</text>
        <text x="60" y="194" font-size="9.5" text-anchor="middle" class="muted">気づかない</text>

        <line x1="200" y1="140" x2="200" y2="160" stroke="var(--primary)" />
        <text x="200" y="132" font-size="11" text-anchor="middle" class="accent">検知</text>
        <text x="200" y="180" font-size="9.5" text-anchor="middle" class="muted">アラート、または</text>
        <text x="200" y="194" font-size="9.5" text-anchor="middle" class="muted">利用者からの報告</text>

        <line x1="330" y1="140" x2="330" y2="160" stroke="var(--fg)" />
        <text x="330" y="132" font-size="11" text-anchor="middle">招集・切り分け</text>
        <text x="330" y="180" font-size="9.5" text-anchor="middle" class="muted">指揮を一本化し</text>
        <text x="330" y="194" font-size="9.5" text-anchor="middle" class="muted">記録を始める</text>

        <line x1="470" y1="140" x2="470" y2="160" stroke="var(--primary)" />
        <text x="470" y="132" font-size="11" text-anchor="middle" class="accent">止血(暫定対応)</text>
        <text x="470" y="180" font-size="9.5" text-anchor="middle" class="muted">切り戻し・機能停止で</text>
        <text x="470" y="194" font-size="9.5" text-anchor="middle" class="muted">まず被害を止める</text>

        <line x1="600" y1="140" x2="600" y2="160" stroke="var(--fg)" />
        <text x="600" y="132" font-size="11" text-anchor="middle">恒久対応</text>
        <text x="600" y="180" font-size="9.5" text-anchor="middle" class="muted">原因を取り除く</text>

        <line x1="710" y1="140" x2="710" y2="160" stroke="var(--fg)" />
        <text x="710" y="132" font-size="11" text-anchor="middle">振り返り</text>
        <text x="710" y="180" font-size="9.5" text-anchor="middle" class="muted">ポストモーテム</text>

        <line x1="60" y1="72" x2="200" y2="72" stroke="var(--primary)" />
        <line x1="60" y1="66" x2="60" y2="78" stroke="var(--primary)" />
        <line x1="200" y1="66" x2="200" y2="78" stroke="var(--primary)" />
        <text x="130" y="60" font-size="10.5" text-anchor="middle" class="accent">検知までの時間</text>
        <text x="130" y="94" font-size="10" text-anchor="middle" class="muted">縮めるのは監視の仕事</text>

        <line x1="60" y1="240" x2="470" y2="240" stroke="var(--primary)" />
        <line x1="60" y1="234" x2="60" y2="246" stroke="var(--primary)" />
        <line x1="470" y1="234" x2="470" y2="246" stroke="var(--primary)" />
        <text x="265" y="232" font-size="10.5" text-anchor="middle" class="accent">被害が続いている時間</text>
        <text x="265" y="262" font-size="10" text-anchor="middle" class="muted">縮めるのは対応の型の仕事 ― 止血を根本解決より先に置く</text>

        <path d="M710,196 L710,278 L60,278 L60,262" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="600" y="292" font-size="10" text-anchor="middle" class="muted">学んだことを、次の検知と防止へ戻す</text>
      </svg>
    </div>
  </body>
</html>
