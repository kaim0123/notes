<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="並列つなぎの回路図。電源から出た道が二股に分かれ、上の枝に豆電球A、下の枝に豆電球Bが置かれ、その先で合流して電源へ戻る。片方が生きていれば全体に電気が流れる ― どちらか一方でも1なら全体が1になる、足し算(OR)の関係。" viewBox="0 0 560 200">

      <line x1="60" y1="70" x2="60" y2="130" stroke="var(--muted)" stroke-width="3" />
      <line x1="72" y1="85" x2="72" y2="115" stroke="var(--muted)" stroke-width="1.5" />
      <text x="50" y="160" fill="var(--muted)" font-size="11">電源</text>

      <line x1="60" y1="70" x2="200" y2="70" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="200" y1="40" x2="200" y2="100" stroke="var(--muted)" stroke-width="1.5" />

      <line x1="200" y1="40" x2="256" y2="40" stroke="var(--muted)" stroke-width="1.5" />
      <circle cx="280" cy="40" r="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="280" y="45" fill="var(--fg)" font-size="13" text-anchor="middle">A</text>
      <line x1="302" y1="40" x2="360" y2="40" stroke="var(--muted)" stroke-width="1.5" />

      <line x1="200" y1="100" x2="256" y2="100" stroke="var(--muted)" stroke-width="1.5" />
      <circle cx="280" cy="100" r="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="280" y="105" fill="var(--fg)" font-size="13" text-anchor="middle">B</text>
      <line x1="302" y1="100" x2="360" y2="100" stroke="var(--muted)" stroke-width="1.5" />

      <line x1="360" y1="40" x2="360" y2="100" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="360" y1="70" x2="470" y2="70" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="470" y1="70" x2="470" y2="130" stroke="var(--muted)" stroke-width="1.5" />
      <line x1="470" y1="130" x2="72" y2="130" stroke="var(--muted)" stroke-width="1.5" />
      <text x="280" y="175" fill="var(--muted)" font-size="11" text-anchor="middle">道が二股(並列)。片方が生きていれば全体は流れる</text>
      </svg>
    </div>
  </body>
</html>
