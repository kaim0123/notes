<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="破壊的な更新と不変な変換を比べた図。上段の破壊的な更新では、1つの配列の箱にpushで要素を詰め込んでいくため、箱は1つのままで、途中の状態はどこにも残らない。元の値を見返すことはできない。下段の不変な変換では、元の配列に対してfilterが新しい配列を作り、その結果に対してmapがさらに新しい配列を作る。矢印は左から右へ一方向に流れ、元の配列も途中の配列もすべて無傷のまま残る。どの段階で何が起きたかを後から確かめられるため、変換の流れが追いやすい。"
      >
        <defs>
          <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="muted">破壊的 ― 同じ箱を書き換える</text>

        <rect x="16" y="38" width="180" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="106" y="60" text-anchor="middle" font-size="11.5" font-family="monospace" class="muted">result = []</text>
        <text x="106" y="80" text-anchor="middle" font-size="10.5" class="muted">空の配列</text>

        <path d="M212,64 C240,44 240,84 212,64" fill="none" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="196" y1="64" x2="236" y2="64" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ari)" />
        <text x="290" y="60" font-size="11" font-family="monospace" class="muted">result.push(...)</text>
        <text x="290" y="78" font-size="10.5" class="muted">箱は1つのまま。途中の状態は残らない</text>

        <line x1="16" y1="110" x2="624" y2="110" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="136" font-size="12" class="lbl">不変 ― 元を残して、新しい値を作る</text>

        <rect x="16" y="150" width="150" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="91" y="174" text-anchor="middle" font-size="11.5" font-family="monospace">[1,2,3,4,5,6]</text>
        <text x="91" y="194" text-anchor="middle" font-size="10.5" class="muted">元の配列</text>

        <line x1="166" y1="180" x2="222" y2="180" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ari)" />
        <text x="194" y="170" text-anchor="middle" font-size="10.5" class="lbl">filter</text>

        <rect x="228" y="150" width="150" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="303" y="174" text-anchor="middle" font-size="11.5" font-family="monospace">[2,4,6]</text>
        <text x="303" y="194" text-anchor="middle" font-size="10.5" class="muted">新しい配列</text>

        <line x1="378" y1="180" x2="434" y2="180" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ari)" />
        <text x="406" y="170" text-anchor="middle" font-size="10.5" class="lbl">map</text>

        <rect x="440" y="150" width="150" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="515" y="174" text-anchor="middle" font-size="11.5" font-family="monospace">[4,8,12]</text>
        <text x="515" y="194" text-anchor="middle" font-size="10.5" class="muted">新しい配列</text>

        <text x="16" y="238" font-size="11" class="muted">3つの配列はすべて無傷のまま残る ― どの段階で何が起きたかを後から確かめられる</text>

        <rect x="16" y="252" width="608" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="32" y="275" font-size="11.5" class="muted">同じ考え方をオブジェクトに適用したのがスプレッド ― 元のuserを残したまま、一部だけ違う新しいオブジェクトを作る</text>
      </svg>
    </div>
  </body>
</html>
