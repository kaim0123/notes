<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="部品の状態を4つの層に分けた図。いちばん下がCSSで、ホバーや押下やフォーカスといった視覚的な反応を担い、Reactの状態は不要。その上がヘッドレスなプリミティブの内部で、ツールチップの表示やメニューの展開、フォーカストラップを担い、これも原則として自分で状態を持つ必要はない。その上が共通の親で、モーダルの開閉やタブの選択、フォームの値、行の選択など画面や機能に依存するものを持つ。いちばん上がアプリ横断で、テーマやサイドバーの折りたたみ、ログインユーザーをContextやCookieで持つ。右側に、上の2層だけがReactの状態を必要とすることが示されている。下の層で済むものを上へ持ち上げないことが要点。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="26" width="440" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="40" y="50" font-size="12">④ アプリ横断 ― Context / Cookie / 外部ストア</text>
        <text x="40" y="72" font-size="10.5" class="muted">テーマ、サイドバーの折りたたみ、ログインユーザー</text>
        <text x="474" y="60" font-size="10.5" class="lbl">状態が要る</text>

        <rect x="20" y="94" width="440" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="40" y="118" font-size="12">③ 共通の親 / ページ</text>
        <text x="40" y="140" font-size="10.5" class="muted">モーダル開閉、タブ選択、フォーム値、行の選択</text>
        <text x="474" y="128" font-size="10.5" class="lbl">状態が要る</text>

        <rect x="20" y="162" width="440" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="40" y="186" font-size="12">② プリミティブの内部</text>
        <text x="40" y="208" font-size="10.5" class="muted">ツールチップ表示、メニュー展開、フォーカストラップ</text>
        <text x="474" y="196" font-size="10.5" class="muted">原則 不要</text>

        <rect x="20" y="230" width="440" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="40" y="254" font-size="12">① CSS</text>
        <text x="40" y="276" font-size="10.5" class="muted">ホバー、押下、フォーカス ― 擬似クラスで足りる</text>
        <text x="474" y="264" font-size="10.5" class="muted">不要</text>

        <line x1="600" y1="270" x2="600" y2="46" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="556" y="24" font-size="10.5" class="lbl">持ち上げない</text>
      </svg>
    </div>
  </body>
</html>
