<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="スペースベースアーキテクチャの構成図。上段に大量のリクエストがあり、仮想化ミドルウェアのメッセージンググリッドが、それを複数の処理ユニットへ振り分ける。各処理ユニットはアプリケーションのロジックとインメモリキャッシュを1つに束ねており、データベースを見ずにその場で応答を返す。処理ユニット間はデータグリッドで同期され、下段のデータポンプがメモリ上の変更を非同期でデータベースへ書き込む。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="340" y="24" text-anchor="middle" font-size="11.5" class="muted">データベースを見ずに応答し、永続化は後追いで行う</text>

        <text x="340" y="52" text-anchor="middle" font-size="11">大量のリクエスト</text>
        <line x1="340" y1="58" x2="340" y2="72" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="60" y="76" width="560" height="34" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="340" y="98" text-anchor="middle" font-size="11" font-weight="600">メッセージンググリッド(空いている処理ユニットへ振り分け)</text>

        <line x1="150" y1="110" x2="150" y2="128" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="340" y1="110" x2="340" y2="128" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="530" y1="110" x2="530" y2="128" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="70" y="132" width="160" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="150" y="154" text-anchor="middle" font-size="11">処理ユニット</text>
        <text x="150" y="174" text-anchor="middle" font-size="9.5" class="muted">ロジック +</text>
        <text x="150" y="189" text-anchor="middle" font-size="9.5" class="muted">インメモリキャッシュ</text>

        <rect x="260" y="132" width="160" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="340" y="154" text-anchor="middle" font-size="11">処理ユニット</text>
        <text x="340" y="174" text-anchor="middle" font-size="9.5" class="muted">ロジック +</text>
        <text x="340" y="189" text-anchor="middle" font-size="9.5" class="muted">インメモリキャッシュ</text>

        <rect x="450" y="132" width="160" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="530" y="154" text-anchor="middle" font-size="11">処理ユニット</text>
        <text x="530" y="174" text-anchor="middle" font-size="9.5" class="muted">ロジック +</text>
        <text x="530" y="189" text-anchor="middle" font-size="9.5" class="muted">インメモリキャッシュ</text>

        <line x1="234" y1="165" x2="256" y2="165" stroke="var(--primary)" stroke-width="1.3" marker-start="url(#arrowHi)" marker-end="url(#arrowHi)" />
        <line x1="424" y1="165" x2="446" y2="165" stroke="var(--primary)" stroke-width="1.3" marker-start="url(#arrowHi)" marker-end="url(#arrowHi)" />
        <text x="340" y="216" text-anchor="middle" font-size="10" class="muted">データグリッドがメモリ上のコピーを同期する</text>

        <line x1="340" y1="222" x2="340" y2="240" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
        <rect x="230" y="244" width="220" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="340" y="269" text-anchor="middle" font-size="11">データポンプ → データベース</text>

        <text x="530" y="269" text-anchor="middle" font-size="10.5" class="muted">応答は書き込み完了を待たない</text>
      </svg>
    </div>
  </body>
</html>
