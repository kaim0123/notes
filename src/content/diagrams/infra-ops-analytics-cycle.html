<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="計測から改善までを1周する流れを示した図。まず何を良くしたいのかを1つの数値として決め、次にその数値が今いくつなのかを測れる状態にする。そのうえで、数値を動かしそうな仮説を立てて手を入れ、変えた後にもう一度測って効果を確かめる。効果がなければ仮説が外れたということなので、別の仮説へ移る。この順序が守られないと、何を良くしたのか分からないまま変更だけが積み重なる。数値を先に決めておくことが、後から効果を語れるかどうかを分ける。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="130" y="40" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="230" y="66" font-size="10.5" text-anchor="middle">1. 何を良くするか決める</text>
        <text x="230" y="86" font-size="9" text-anchor="middle" class="muted">1つの数値として書く</text>

        <rect x="380" y="40" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="480" y="66" font-size="10.5" text-anchor="middle">2. いま何点かを測る</text>
        <text x="480" y="86" font-size="9" text-anchor="middle" class="muted">計測できる状態を作る</text>

        <rect x="380" y="160" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="480" y="186" font-size="10.5" text-anchor="middle">3. 仮説を立てて手を入れる</text>
        <text x="480" y="206" font-size="9" text-anchor="middle" class="muted">1度に1つだけ変える</text>

        <rect x="130" y="160" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="230" y="186" font-size="10.5" text-anchor="middle">4. もう一度測る</text>
        <text x="230" y="206" font-size="9" text-anchor="middle" class="muted">効果を確かめる</text>

        <line x1="334" y1="70" x2="376" y2="70" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="480" y1="104" x2="480" y2="156" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="376" y1="190" x2="334" y2="190" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="230" y1="156" x2="230" y2="104" stroke="var(--primary)" marker-end="url(#arp)" />

        <text x="30" y="130" font-size="10" class="muted">効果が無ければ</text>
        <text x="30" y="148" font-size="10" class="muted">仮説が外れただけ</text>

        <text x="20" y="256" font-size="10.5" class="muted">数値を先に決めておくことが、後から効果を語れるかどうかを分ける。</text>
        <text x="20" y="274" font-size="10.5" class="muted">1度に複数を変えると、どれが効いたのか永久に分からない。</text>
      </svg>
    </div>
  </body>
</html>
