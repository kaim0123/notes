<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="静的な殻と動的な穴が1つの応答として届く様子を時間軸で示した図。最初に届くのは静的な殻で、レイアウトとナビゲーション、そしてSuspenseで囲んだ範囲の仮表示が含まれる。これはあらかじめ生成されているため即座に表示できる。その後、遅い処理が終わった順にそれぞれの穴の中身が流れ込み、仮表示と入れ替わる。売上の集計と最近の注文はそれぞれ独立した境界にあるため、片方が遅くてももう片方は先に表示される。ページ全体を静的にするか動的にするかの二択ではなく、1ページの中で組み合わせられるのが要点。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="28" font-size="11.5" class="muted">時間 →</text>

        <text x="20" y="58" font-size="11" class="lbl">① すぐ届く ― 静的な殻</text>
        <rect x="20" y="68" width="180" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <rect x="32" y="80" width="156" height="22" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="42" y="96" font-size="9.5" class="muted">ヘッダー・ナビ</text>
        <rect x="32" y="110" width="156" height="30" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 3" />
        <text x="42" y="130" font-size="9.5" class="muted">売上 ― 仮表示</text>
        <rect x="32" y="148" width="156" height="30" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 3" />
        <text x="42" y="168" font-size="9.5" class="muted">注文 ― 仮表示</text>

        <line x1="204" y1="128" x2="234" y2="128" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />

        <text x="238" y="58" font-size="11" class="lbl">② 速い方から流れ込む</text>
        <rect x="238" y="68" width="180" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <rect x="250" y="80" width="156" height="22" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="260" y="96" font-size="9.5" class="muted">ヘッダー・ナビ</text>
        <rect x="250" y="110" width="156" height="30" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 3" />
        <text x="260" y="130" font-size="9.5" class="muted">売上 ― 仮表示のまま</text>
        <rect x="250" y="148" width="156" height="30" rx="4" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="260" y="168" font-size="9.5" class="lbl">注文 ― 中身が到着</text>

        <line x1="422" y1="128" x2="452" y2="128" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />

        <text x="456" y="58" font-size="11" class="lbl">③ 遅い方も到着</text>
        <rect x="456" y="68" width="164" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <rect x="468" y="80" width="140" height="22" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="478" y="96" font-size="9.5" class="muted">ヘッダー・ナビ</text>
        <rect x="468" y="110" width="140" height="30" rx="4" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="478" y="130" font-size="9.5" class="lbl">売上 ― 到着</text>
        <rect x="468" y="148" width="140" height="30" rx="4" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="478" y="168" font-size="9.5" class="lbl">注文 ― 到着</text>

        <rect x="20" y="214" width="600" height="86" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="40" y="240" font-size="11">それぞれの境界は独立して解決し、互いを待たない</text>
        <text x="40" y="264" font-size="10.5" class="muted">遅い1か所がページ全体を止めることがなくなる ― 境界の粒度が、そのまま体感速度になる</text>
        <text x="40" y="288" font-size="10.5" class="lbl">動的なアクセスを上の階層で行うと、その下すべてが動的になり、静的な殻が作れなくなる</text>
      </svg>
    </div>
  </body>
</html>
