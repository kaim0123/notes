<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 360"
        role="img"
        aria-label="オンプレミス・IaaS・PaaS・SaaSで、施設・電源からデータまでの8つの層をどちらが管理するかを並べた階段図。オンプレミスは8層すべてを自分で管理し、IaaSではOSから上の5層、PaaSではアプリとデータの2層だけが自分の担当になり、SaaSでは全層を事業者が管理する。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="112" y="26" font-size="13" text-anchor="middle" dx="75">オンプレミス</text>
        <text x="268" y="26" font-size="13" text-anchor="middle" dx="75">IaaS</text>
        <text x="424" y="26" font-size="13" text-anchor="middle" dx="75">PaaS</text>
        <text x="580" y="26" font-size="13" text-anchor="middle" dx="75">SaaS</text>

        <text x="98" y="66" font-size="12" text-anchor="end" class="muted">データ</text>
        <text x="98" y="102" font-size="12" text-anchor="end" class="muted">アプリケーション</text>
        <text x="98" y="138" font-size="12" text-anchor="end" class="muted">ランタイム</text>
        <text x="98" y="174" font-size="12" text-anchor="end" class="muted">ミドルウェア</text>
        <text x="98" y="210" font-size="12" text-anchor="end" class="muted">OS</text>
        <text x="98" y="246" font-size="12" text-anchor="end" class="muted">仮想化</text>
        <text x="98" y="282" font-size="12" text-anchor="end" class="muted">サーバー・ストレージ</text>
        <text x="98" y="318" font-size="12" text-anchor="end" class="muted">施設・電源</text>

        <rect x="112" y="44" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="80" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="116" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="152" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="188" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="224" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="260" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="112" y="296" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />

        <rect x="268" y="44" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="268" y="80" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="268" y="116" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="268" y="152" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="268" y="188" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="268" y="224" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="268" y="260" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="268" y="296" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />

        <rect x="424" y="44" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="424" y="80" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <rect x="424" y="116" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="424" y="152" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="424" y="188" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="424" y="224" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="424" y="260" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="424" y="296" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />

        <rect x="580" y="44" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="80" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="116" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="152" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="188" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="224" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="260" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <rect x="580" y="296" width="150" height="32" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="187" y="65" font-size="11" text-anchor="middle">自分で管理</text>
        <text x="343" y="245" font-size="11" text-anchor="middle" class="muted">事業者が管理</text>
        <text x="499" y="137" font-size="11" text-anchor="middle" class="muted">事業者が管理</text>
        <text x="655" y="65" font-size="11" text-anchor="middle" class="muted">事業者が管理</text>

        <text x="8" y="352" font-size="11" class="muted">緑の実線 = 自分で構築・運用する層  /  破線 = 事業者に任せる層</text>
      </svg>
    </div>
  </body>
</html>
