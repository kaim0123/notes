<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="CQRSのモデル分離を示した図。左上の書き込み(Command)は、業務ルールの整合性を守るドメインモデルを通って書き込み用のデータストアへ向かう。左下の読み取り(Query)は、ドメインモデルを通らず、画面表示に都合のよい形へ整形済みの読み取り用モデルから直接返す。2つのストアの間は同期の矢印で結ばれ、結果整合性であることが注記されている。1つのモデルで両方を満たそうとすると互いの都合で歪む、という問題への答えである。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="340" y="24" text-anchor="middle" font-size="11.5" class="muted">求められる性質が違うので、モデルごと分けてしまう</text>

        <rect x="30" y="52" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="90" y="72" text-anchor="middle" font-size="11">書き込み</text>
        <text x="90" y="88" text-anchor="middle" font-size="9" class="muted">Command</text>
        <line x1="154" y1="74" x2="186" y2="74" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />

        <rect x="190" y="52" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="290" y="72" text-anchor="middle" font-size="11" font-weight="600">ドメインモデル</text>
        <text x="290" y="88" text-anchor="middle" font-size="9" class="muted">業務ルールの整合性を守る</text>
        <line x1="394" y1="74" x2="426" y2="74" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />

        <rect x="430" y="52" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="520" y="79" text-anchor="middle" font-size="11">書き込み用ストア</text>

        <line x1="520" y1="100" x2="520" y2="170" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
        <text x="616" y="140" text-anchor="middle" font-size="9.5" class="muted">同期(結果整合性)</text>

        <rect x="30" y="178" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="90" y="198" text-anchor="middle" font-size="11">読み取り</text>
        <text x="90" y="214" text-anchor="middle" font-size="9" class="muted">Query</text>
        <line x1="154" y1="200" x2="426" y2="200" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="290" y="190" text-anchor="middle" font-size="9.5" class="muted">ドメインモデルを通らない</text>

        <rect x="430" y="178" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="520" y="198" text-anchor="middle" font-size="11">読み取り用モデル</text>
        <text x="520" y="214" text-anchor="middle" font-size="9" class="muted">画面表示に都合のよい形</text>

        <text x="340" y="262" text-anchor="middle" font-size="11" class="muted">書き込みは整合性、読み取りは速さと表示のしやすさ ―</text>
        <text x="340" y="282" text-anchor="middle" font-size="11" class="muted">1つのモデルで両方を満たそうとすると、互いの都合で歪む</text>
      </svg>
    </div>
  </body>
</html>
