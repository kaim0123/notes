<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="パスワード方式とパスキー方式で、秘密がどこに存在するかを比べた図。上のパスワード方式では、利用者が覚えている秘密と、サーバーが保管しているその照合用データという2箇所に秘密が存在する。利用者は毎回その秘密を通信路に流して送るため、偽サイトに入力してしまえばそのまま渡ってしまうし、サーバー側が漏れれば大量の照合データが流出する。下のパスキー方式では、秘密鍵が利用者の端末から出ない。サーバーが持つのは公開鍵だけで、これは漏れても悪用できない。認証のたびに端末が署名を作って送り、しかもその署名は接続先のドメインに結びついているため、偽サイト向けの署名は作られない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="42" font-size="10.5" class="muted">① パスワード ― 秘密が2箇所にあり、毎回それが通信路を流れる</text>

        <rect x="30" y="56" width="200" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="130" y="78" font-size="10" text-anchor="middle">利用者が覚えている</text>
        <text x="130" y="97" font-size="9.5" text-anchor="middle" class="accent">秘密そのもの</text>

        <rect x="500" y="56" width="220" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="610" y="78" font-size="10" text-anchor="middle">サーバーが保管している</text>
        <text x="610" y="97" font-size="9.5" text-anchor="middle" class="accent">照合用のデータ</text>

        <line x1="234" y1="84" x2="496" y2="84" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="365" y="76" font-size="9" text-anchor="middle" class="muted">毎回、秘密を送る</text>
        <text x="365" y="104" font-size="9" text-anchor="middle" class="muted">偽サイトに入力すれば、そこへ渡る</text>

        <text x="16" y="140" font-size="9.5" class="muted">サーバー側が漏れれば大量の照合データが流出し、利用者側は騙されれば自分から手渡してしまう。</text>

        <line x1="16" y1="158" x2="744" y2="158" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

        <text x="16" y="186" font-size="10.5" class="accent">② パスキー ― 秘密鍵は端末から出ない</text>

        <rect x="30" y="200" width="200" height="70" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="130" y="222" font-size="10" text-anchor="middle">利用者の端末</text>
        <text x="130" y="241" font-size="9.5" text-anchor="middle" class="accent">秘密鍵(外に出ない)</text>
        <text x="130" y="259" font-size="8.5" text-anchor="middle" class="muted">生体認証で解錠して使う</text>

        <rect x="500" y="200" width="220" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="610" y="222" font-size="10" text-anchor="middle">サーバー</text>
        <text x="610" y="241" font-size="9.5" text-anchor="middle">公開鍵だけを保管</text>
        <text x="610" y="259" font-size="8.5" text-anchor="middle" class="muted">漏れても悪用できない</text>

        <line x1="234" y1="228" x2="496" y2="228" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="365" y="220" font-size="9" text-anchor="middle" class="accent">署名だけを送る</text>
        <text x="365" y="248" font-size="9" text-anchor="middle" class="muted">署名は接続先のドメインに結びついている</text>

        <line x1="16" y1="286" x2="744" y2="286" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="308" font-size="10.5" class="accent">署名がドメインに紐づくので、偽サイト向けの署名は端末が作らない ― フィッシングが構造として成立しない。</text>
      </svg>
    </div>
  </body>
</html>
