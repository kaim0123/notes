<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 330"
        role="img"
        aria-label="非機能テストを実行頻度で3つの層に分けた図。最上段は毎コミットで、数分以内に終わるものだけを置く。静的解析、依存ライブラリの脆弱性チェック、自動化できるアクセシビリティ検査、バンドルサイズの予算がここに入る。中段は毎日の夜間実行で、十数分から数十分かかるものを置く。ビジュアル回帰テストと、主要動線の軽い負荷テストがここに入る。最下段はリリース前と定期実行で、数時間かかるものや人手が要るものを置く。本格的な負荷試験と耐久試験、ペネトレーションテスト、支援技術を使った手動のアクセシビリティ確認がここに入る。全部を毎回回すことはできないので、頻度で分けて共存させる。最上段を数分以内に保つことが、他の2層を維持できるかどうかを決める、と図の下部に記されている。"
      >
        <text x="16" y="26" font-size="11" class="muted">全部を毎回は回せない。落とすのではなく、頻度で分けて共存させる</text>

        <rect x="16" y="38" width="608" height="72" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="32" y="62" font-size="11.5" class="accent">毎コミット ― 数分以内で終わるものだけ</text>
        <text x="32" y="84" font-size="9.5" class="muted">静的解析 / 依存ライブラリの脆弱性チェック / 自動化できるアクセシビリティ検査 / バンドルサイズ予算</text>
        <text x="32" y="102" font-size="9.5" class="muted">ここが遅くなると、誰も待たなくなり、やがて回されなくなる</text>

        <rect x="16" y="122" width="608" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="32" y="146" font-size="11" class="muted">毎日(夜間) ― 十数分から数十分かかるもの</text>
        <text x="32" y="168" font-size="9.5" class="muted">ビジュアル回帰テスト / 主要動線の軽い負荷テスト</text>

        <rect x="16" y="196" width="608" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="32" y="220" font-size="11" class="muted">リリース前・定期 ― 数時間かかるもの、人手が要るもの</text>
        <text x="32" y="242" font-size="9.5" class="muted">本格的な負荷試験・耐久試験 / ペネトレーションテスト / 支援技術を使った手動確認</text>

        <line x1="16" y1="280" x2="624" y2="280" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="300" font-size="10.5" class="muted">非機能テストが定着しない原因はたいてい「重いから毎コミットに置けない」。落とさず、下の層へ移す。</text>
        <text x="16" y="322" font-size="10.5" class="accent">最上段を数分以内に保てるかどうかが、下の2層まで含めて続けられるかを決める。</text>
      </svg>
    </div>
  </body>
</html>
