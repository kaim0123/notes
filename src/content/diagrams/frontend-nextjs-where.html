<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="Next.jsで書いたコードが動く3つの場所を示した図。左がビルド時で、あらかじめ生成できる部分はここで組み立てられ、静的な殻として保存される。中央がリクエスト時のサーバーで、利用者ごとに変わる部分や最新のデータが要る部分はここで実行される。右がブラウザで、クリックや入力といった操作に反応する部分だけがここで動く。下部に、1つのページの中でこの3つが混在することが示されている。ページ単位ではなくコンポーネント単位で境界が引かれるため、同じ書き方のコンポーネントが置かれ方によって違う場所で動く。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="40" width="190" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="38" y="66" font-size="12">① ビルド時</text>
        <text x="38" y="92" font-size="10.5" class="muted">あらかじめ生成できる部分</text>
        <text x="38" y="112" font-size="10.5" class="muted">レイアウト・ナビ・仮表示</text>
        <text x="38" y="140" font-size="10.5" class="lbl">静的な殻として保存される</text>

        <line x1="210" y1="100" x2="232" y2="100" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="236" y="40" width="190" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="254" y="66" font-size="12">② リクエスト時のサーバー</text>
        <text x="254" y="92" font-size="10.5" class="muted">利用者ごとに変わる部分</text>
        <text x="254" y="112" font-size="10.5" class="muted">最新のデータが要る部分</text>
        <text x="254" y="140" font-size="10.5" class="lbl">結果だけが送られる</text>

        <line x1="426" y1="100" x2="448" y2="100" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="452" y="40" width="168" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="470" y="66" font-size="12">③ ブラウザ</text>
        <text x="470" y="92" font-size="10.5" class="muted">クリック・入力への反応</text>
        <text x="470" y="112" font-size="10.5" class="muted">ブラウザ固有のAPI</text>
        <text x="470" y="140" font-size="10.5" class="lbl">ここだけコードが届く</text>

        <rect x="20" y="188" width="600" height="90" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="40" y="214" font-size="11.5">この3つは、1つのページの中で混在する</text>
        <text x="40" y="240" font-size="10.5" class="muted">「このページは静的、あのページは動的」ではなく、1ページの中の静的な部分と動的な部分を分ける</text>
        <text x="40" y="264" font-size="10.5" class="lbl">同じ書き方のコンポーネントが、置かれ方によって違う場所で動く</text>
      </svg>
    </div>
  </body>
</html>
