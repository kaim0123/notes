<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="再帰呼び出しのときのコールスタックの様子を示した図。左側は積み上がっていく過程で、下からグローバルコンテキスト、その上にsum(3)、その上にsum(2)、その上にsum(1)が積まれ、一番上で基底ケースのsum(0)が0を返す。それぞれの枠には、下の呼び出しの結果を待っていることが書かれている。右側は外れていく過程で、sum(0)が0を返すとsum(1)が1、sum(2)が3、sum(3)が6と順に確定し、積んだのと逆の順序でスタックが外れていく。基底ケースを書き忘れると積み上がりが止まらず、スタックの上限を超えてスタックオーバーフローになる。"
      >
        <defs>
          <marker id="are" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="150" y="24" text-anchor="middle" font-size="11.5" class="muted">呼び出しで積まれていく</text>

        <rect x="30" y="212" width="240" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="150" y="233" text-anchor="middle" font-size="11" class="muted">グローバルコンテキスト</text>

        <rect x="30" y="176" width="240" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="150" y="197" text-anchor="middle" font-size="11.5">sum(3) ― 3 + sum(2) を待つ</text>

        <rect x="30" y="140" width="240" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="150" y="161" text-anchor="middle" font-size="11.5">sum(2) ― 2 + sum(1) を待つ</text>

        <rect x="30" y="104" width="240" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="150" y="125" text-anchor="middle" font-size="11.5">sum(1) ― 1 + sum(0) を待つ</text>

        <rect x="30" y="68" width="240" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="150" y="89" text-anchor="middle" font-size="11" class="lbl">sum(0) ― 基底ケース。0 を返す</text>

        <line x1="286" y1="150" x2="330" y2="150" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#are)" />

        <text x="480" y="24" text-anchor="middle" font-size="11.5" class="muted">return で外れていく</text>

        <rect x="352" y="68" width="256" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="89" text-anchor="middle" font-size="11.5" class="muted">sum(0) → 0</text>
        <rect x="352" y="104" width="256" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="125" text-anchor="middle" font-size="11.5" class="muted">sum(1) → 1 + 0 = 1</text>
        <rect x="352" y="140" width="256" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="161" text-anchor="middle" font-size="11.5" class="muted">sum(2) → 2 + 1 = 3</text>
        <rect x="352" y="176" width="256" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="480" y="197" text-anchor="middle" font-size="11.5">sum(3) → 3 + 3 = 6</text>

        <text x="16" y="270" font-size="11" class="muted">基底ケースを書き忘れると積み上がりが止まらず、上限を超えて RangeError(スタックオーバーフロー)になる</text>
      </svg>
    </div>
  </body>
</html>
