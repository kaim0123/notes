<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="カウンタとゲージという2種類のメトリクスの読み方の違いを示した図。左のカウンタは開始時からの累積で、階段のように増える一方であり、生の値そのものを眺めても意味は薄い。単位時間あたりどれだけ増えたかという増分に直して初めて、1秒あたりのリクエスト数やエラー率になる。右のゲージはその瞬間の値で、上がったり下がったりするため、値をそのまま読む。同じグラフでも、カウンタを瞬間値として読んだり、ゲージを増分として読んだりすると、意味を取り違える。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="190" y="26" font-size="12" text-anchor="middle" class="muted">カウンタ ― 累積で増える一方</text>
        <polyline points="40,200 90,190 140,178 190,150 240,140 290,120 340,96" fill="none" stroke="var(--border)" stroke-width="1.6" />
        <line x1="30" y1="210" x2="350" y2="210" stroke="var(--border)" />
        <text x="190" y="228" font-size="9.5" text-anchor="middle" class="muted">生の値(累積リクエスト数)― そのままでは読めない</text>

        <text x="190" y="256" font-size="10.5" text-anchor="middle" class="accent">増分に直して初めて意味が出る</text>
        <text x="190" y="278" font-size="10" text-anchor="middle" class="muted">1秒あたり何件増えたか = リクエスト数・エラー率</text>

        <line x1="380" y1="16" x2="380" y2="284" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="570" y="26" font-size="12" text-anchor="middle" class="muted">ゲージ ― その瞬間の値</text>
        <polyline points="420,160 470,120 520,175 570,100 620,150 670,115 720,165" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="410" y1="210" x2="730" y2="210" stroke="var(--border)" />
        <text x="570" y="228" font-size="9.5" text-anchor="middle" class="muted">CPU使用率・メモリ・キューの滞留数</text>

        <text x="570" y="256" font-size="10.5" text-anchor="middle" class="accent">値をそのまま読む</text>
        <text x="570" y="278" font-size="10" text-anchor="middle" class="muted">「今いくつか」に意味がある</text>

        <text x="30" y="60" font-size="10" class="muted">同じ折れ線でも、型を取り違えると読み方ごと間違える。</text>
        <text x="30" y="78" font-size="10" class="muted">カウンタが下がって見えたら、それは再起動でリセットされたということ。</text>
      </svg>
    </div>
  </body>
</html>
