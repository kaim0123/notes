<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="開放閉鎖の原則の前後を比べた図。左は分岐で書き分ける形で、支払い方法を1つ増やすたびに既存の支払い処理クラスの中のif文を書き換える必要があり、変更のたびに既存コードに手が入る。右はOCPを適用した形で、支払い方法というインターフェースの下にクレジットカード・コンビニ・電子マネーの実装が並び、方法を1つ増やすときは新しいクラスを追加するだけで既存コードは変更されない。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">分岐で書き分ける</text>

        <rect x="40" y="46" width="250" height="140" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="70" text-anchor="middle" font-size="11.5">支払い処理クラス</text>
        <text x="60" y="98" font-size="10.5" class="mono muted">if (種別 === "カード") ...</text>
        <text x="60" y="120" font-size="10.5" class="mono muted">else if (種別 === "コンビニ") ...</text>
        <text x="60" y="142" font-size="10.5" class="mono muted">else if (種別 === "電子マネー") ...</text>
        <text x="60" y="168" font-size="10.5" class="mono hi">+ 増やすたびにここを書き換える</text>

        <text x="165" y="218" text-anchor="middle" font-size="11" class="muted">既存コードに毎回手が入るので、</text>
        <text x="165" y="236" text-anchor="middle" font-size="11" class="muted">動いていた処理まで壊しうる</text>

        <line x1="345" y1="30" x2="345" y2="270" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="26" text-anchor="middle" font-size="12.5" font-weight="600">OCPを適用する</text>

        <rect x="400" y="46" width="220" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="510" y="73" text-anchor="middle" font-size="11.5" font-weight="600">«インターフェース» 支払い方法</text>

        <line x1="440" y1="128" x2="470" y2="96" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="510" y1="128" x2="510" y2="96" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="580" y1="128" x2="550" y2="96" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="392" y="130" width="76" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="430" y="154" text-anchor="middle" font-size="10">カード</text>
        <rect x="472" y="130" width="76" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="154" text-anchor="middle" font-size="10">コンビニ</text>
        <rect x="552" y="130" width="76" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="590" y="154" text-anchor="middle" font-size="10">電子マネー</text>

        <rect x="472" y="182" width="76" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" stroke-dasharray="5 4" />
        <text x="510" y="206" text-anchor="middle" font-size="10" class="hi">新方式</text>
        <line x1="510" y1="180" x2="510" y2="172" stroke="var(--primary)" stroke-width="1.3" />

        <text x="510" y="248" text-anchor="middle" font-size="11" class="muted">追加するのはクラス1つだけ。</text>
        <text x="510" y="266" text-anchor="middle" font-size="11" class="muted">既存コードは1行も変わらない</text>
      </svg>
    </div>
  </body>
</html>
