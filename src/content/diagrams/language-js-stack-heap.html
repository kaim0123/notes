<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 260"
        role="img"
        aria-label="スタックとヒープの役割分担を示した図。左のコールスタックには、数値のcount = 3のように小さく固定サイズの値と、変数userのようにヒープ上の場所を指す参照が置かれる。右のヒープには、オブジェクトや配列の本体が置かれる。userからヒープ上のオブジェクト本体へ矢印が伸びており、変数は本体そのものではなく場所を指しているだけであることを示す。ヒープにはもう1つ、どの変数からも矢印が来ていない古いオブジェクトがあり、これは到達不能なのでガベージコレクションの回収対象になる。判断基準は参照の数ではなく、根からたどり着けるかどうか。"
      >
        <defs>
          <marker id="arh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="130" y="26" text-anchor="middle" font-size="12" class="lbl">コールスタック</text>
        <rect x="16" y="38" width="228" height="164" rx="8" fill="none" stroke="var(--border)" stroke-width="1.4" />

        <rect x="36" y="58" width="188" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="130" y="80" text-anchor="middle" font-size="11.5" font-family="monospace">count = 3</text>

        <rect x="36" y="102" width="188" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="130" y="124" text-anchor="middle" font-size="11.5" font-family="monospace">user → 参照</text>

        <rect x="36" y="146" width="188" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="130" y="168" text-anchor="middle" font-size="11" class="muted">old ― 参照が消えた</text>

        <text x="472" y="26" text-anchor="middle" font-size="12" class="lbl">ヒープ</text>
        <rect x="330" y="38" width="294" height="164" rx="8" fill="none" stroke="var(--border)" stroke-width="1.4" />

        <rect x="352" y="62" width="250" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="477" y="82" text-anchor="middle" font-size="11.5" font-family="monospace">{ name: &quot;Alice&quot; }</text>
        <text x="477" y="100" text-anchor="middle" font-size="10.5" class="muted">オブジェクトの本体</text>

        <rect x="352" y="132" width="250" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="477" y="152" text-anchor="middle" font-size="11.5" font-family="monospace" class="muted">{ name: &quot;古いデータ&quot; }</text>
        <text x="477" y="172" text-anchor="middle" font-size="10.5" class="muted">到達不能 → GCの回収対象</text>

        <line x1="224" y1="119" x2="348" y2="88" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arh2)" />

        <line x1="16" y1="222" x2="624" y2="222" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="242" font-size="11" class="muted">変数は本体そのものではなく「どこにあるか」を指している ― これがオブジェクトが参照で共有される理由</text>
        <text x="16" y="256" font-size="11" class="lbl">回収の判断は参照の数ではなく、根からたどり着けるかどうか</text>
      </svg>
    </div>
  </body>
</html>
