<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 360"
        role="img"
        aria-label="EtherChannelのロードバランシングの図解。複数の通信(フロー)がハッシュ関数に渡され、送信元/宛先のMACやIPなどから計算した結果によって、どちらの物理リンクを使うかが決まる。同じフローは常に同じリンクに固定されるため、パケットの順序が入れ替わらない。"
      >
        <defs>
          <marker
            id="arrowEc"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="30" y="20" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="105" y="43" text-anchor="middle" font-size="11">Flow A(PC1→Server)</text>

        <rect x="245" y="20" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="43" text-anchor="middle" font-size="11">Flow B(PC2→Server)</text>

        <rect x="460" y="20" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="535" y="43" text-anchor="middle" font-size="11">Flow C(PC3→Server)</text>

        <rect x="220" y="100" width="200" height="55" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="320" y="123" text-anchor="middle" font-size="12" font-weight="600" style="fill: var(--primary)">ハッシュ関数</text>
        <text x="320" y="141" text-anchor="middle" font-size="9.5" class="muted">(送信元/宛先MAC・IPなど)</text>

        <line x1="105" y1="56" x2="280" y2="100" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowEc)" />
        <line x1="320" y1="56" x2="320" y2="100" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowEc)" />
        <line x1="535" y1="56" x2="360" y2="100" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowEc)" />

        <rect x="90" y="240" width="180" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="180" y="270" text-anchor="middle" font-size="12.5" font-weight="600">Gi0/1</text>

        <rect x="370" y="240" width="180" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="460" y="270" text-anchor="middle" font-size="12.5" font-weight="600">Gi0/2</text>

        <line x1="270" y1="155" x2="200" y2="240" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowEc)" />
        <text x="205" y="205" text-anchor="middle" font-size="10" style="fill: var(--primary)">Flow A, C</text>

        <line x1="370" y1="155" x2="440" y2="240" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowEc)" />
        <text x="440" y="205" text-anchor="middle" font-size="10" style="fill: var(--primary)">Flow B</text>

        <text x="320" y="330" text-anchor="middle" font-size="11.5" class="muted">
          同じフローは常に同じ物理リンクに固定される(パケットの順序が入れ替わらないため)
        </text>
      </svg>
    </div>
  </body>
</html>
