<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 430"
        role="img"
        aria-label="プロセスのメモリ空間の模式図。高位アドレス側から順に、関数呼び出し情報とローカル変数を置くスタック領域、空き領域、実行中に確保する動的データを置くヒープ領域、グローバル変数や静的変数を置くデータ領域、機械語の命令を置く読み取り専用のコード領域が並ぶ。スタックは空き領域に向かって下へ伸び、ヒープは上へ伸びるため、両者は互いに向かって成長する。スタックは自動で確保・解放され上限を超えるとスタックオーバーフロー、ヒープは自分で確保・解放し解放漏れがメモリリークになる。"
      >
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="290" y="24" text-anchor="middle" font-size="11.5" class="muted">高位アドレス</text>

        <rect x="140" y="36" width="300" height="72" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="290" y="68" text-anchor="middle" font-size="14" font-weight="600">スタック領域</text>
        <text x="290" y="90" text-anchor="middle" font-size="11" class="muted">関数呼び出し情報・ローカル変数</text>

        <rect x="140" y="116" width="300" height="92" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="290" y="167" text-anchor="middle" font-size="12.5" class="muted">(空き領域)</text>

        <rect x="140" y="216" width="300" height="72" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="290" y="248" text-anchor="middle" font-size="14" font-weight="600">ヒープ領域</text>
        <text x="290" y="270" text-anchor="middle" font-size="11" class="muted">実行中に確保する動的データ</text>

        <rect x="140" y="296" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="290" y="324" text-anchor="middle" font-size="12.5">データ領域(グローバル変数・静的変数)</text>

        <rect x="140" y="350" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="290" y="378" text-anchor="middle" font-size="12.5">コード領域(機械語の命令・読み取り専用)</text>

        <text x="290" y="418" text-anchor="middle" font-size="11.5" class="muted">低位アドレス</text>

        <!-- 成長方向 -->
        <line x1="118" y1="118" x2="118" y2="152" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrow)" color="var(--primary)" />
        <text x="106" y="140" text-anchor="end" font-size="11" class="muted">下へ伸びる</text>
        <line x1="118" y1="206" x2="118" y2="172" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrow)" color="var(--primary)" />
        <text x="106" y="196" text-anchor="end" font-size="11" class="muted">上へ伸びる</text>

        <!-- 右の注記 -->
        <text x="458" y="66" font-size="11" class="muted">確保・解放は自動</text>
        <text x="458" y="84" font-size="11" class="muted">積みすぎるとスタックオーバーフロー</text>
        <text x="458" y="246" font-size="11" class="muted">確保・解放は自分の責任(またはGC)</text>
        <text x="458" y="264" font-size="11" class="muted">解放漏れがメモリリーク</text>
      </svg>
    </div>
  </body>
</html>
