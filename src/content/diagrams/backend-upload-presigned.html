<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="署名付きURLを使ったアップロードの流れを示した図。左にブラウザ、上中央にAPIサーバー、右にストレージが置かれる。まずブラウザがAPIサーバーへ許可を求め、APIサーバーは認証と認可と上限の判定を行ったうえで、短時間だけ有効な署名付きURLを返す。次にブラウザはファイル本体をストレージへ直接送る。この線だけが太く描かれており、本体がAPIサーバーを一切通らないことを示す。最後にブラウザがAPIサーバーへ完了を通知し、APIサーバーは実際のサイズと形式を確認したうえでデータベースに記録し、重い後処理はジョブキューへ渡す。下部には注意として、完了通知が来ないまま放置されたファイルは孤児として残るため、一定時間ひも付かないものを削除する仕組みが要ることが記されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="230" y="24" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="256" y="45" font-size="11.5">APIサーバー</text>
        <text x="248" y="62" font-size="9" class="muted">許可証を出すだけ</text>

        <rect x="20" y="150" width="140" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="60" y="178" font-size="11.5">ブラウザ</text>

        <rect x="480" y="150" width="140" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="512" y="178" font-size="11.5" class="lbl">ストレージ</text>

        <line x1="118" y1="150" x2="232" y2="72" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="106" y="118" font-size="9.5" class="muted">① 許可を求める</text>
        <line x1="228" y1="70" x2="120" y2="144" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="70" y="140" font-size="9.5" class="muted">② 署名付きURL(5分だけ有効)</text>

        <line x1="160" y1="173" x2="474" y2="173" stroke="var(--primary)" stroke-width="2.6" marker-end="url(#arp)" />
        <text x="258" y="166" font-size="11" class="lbl">③ 本体を直接送る</text>
        <text x="230" y="212" font-size="9.5" class="muted">この線だけがファイル本体 ― APIサーバーを一切通らない</text>

        <line x1="150" y1="196" x2="290" y2="240" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="60" y="236" font-size="9.5" class="muted">④ 完了を通知</text>

        <rect x="296" y="224" width="230" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="312" y="244" font-size="10">実サイズと実形式を確認 → 記録</text>
        <text x="312" y="261" font-size="10" class="muted">重い後処理はジョブキューへ</text>

        <text x="20" y="296" font-size="10.5" class="muted">④が来ないまま放置されたファイルは孤児として残る。</text>
        <text x="20" y="314" font-size="10.5" class="muted">一定時間ひも付かないものを消す仕組みを、あわせて用意する。</text>
      </svg>
    </div>
  </body>
</html>
