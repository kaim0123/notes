<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="DDDの2つの粒度を示した図。上段の戦略的DDDでは、販売コンテキスト・配送コンテキスト・会計コンテキストという3つの境界づけられたコンテキストが並び、その間には腐敗防止層による変換が置かれる。同じ「顧客」という言葉が各コンテキストで別の意味を持つことが示される。下段の戦術的DDDでは、1つのコンテキストの内部に集約ルート・エンティティ・値オブジェクト・リポジトリが配置される。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="30" y="26" font-size="12.5" font-weight="600">戦略的DDD ― システム全体をどう分割するか</text>

        <rect x="30" y="42" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="120" y="66" text-anchor="middle" font-size="11" font-weight="600">販売コンテキスト</text>
        <text x="120" y="86" text-anchor="middle" font-size="9.5" class="muted">顧客 = 購入する人</text>

        <rect x="250" y="42" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="340" y="66" text-anchor="middle" font-size="11">配送コンテキスト</text>
        <text x="340" y="86" text-anchor="middle" font-size="9.5" class="muted">顧客 = 届け先</text>

        <rect x="470" y="42" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="560" y="66" text-anchor="middle" font-size="11">会計コンテキスト</text>
        <text x="560" y="86" text-anchor="middle" font-size="9.5" class="muted">顧客 = 請求先</text>

        <line x1="216" y1="72" x2="244" y2="72" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <line x1="436" y1="72" x2="464" y2="72" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="340" y="124" text-anchor="middle" font-size="10.5" class="muted">境界をまたぐときは腐敗防止層で変換し、モデルを混ぜない</text>

        <line x1="30" y1="146" x2="650" y2="146" stroke="var(--border)" stroke-width="1.2" />

        <text x="30" y="178" font-size="12.5" font-weight="600">戦術的DDD ― 1つのコンテキストの中身をどう書くか</text>

        <rect x="30" y="192" width="620" height="76" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <rect x="52" y="210" width="140" height="42" rx="7" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="122" y="236" text-anchor="middle" font-size="10.5" font-weight="600">集約ルート(注文)</text>
        <rect x="208" y="210" width="130" height="42" rx="7" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3" />
        <text x="273" y="236" text-anchor="middle" font-size="10.5">エンティティ</text>
        <rect x="354" y="210" width="130" height="42" rx="7" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3" />
        <text x="419" y="236" text-anchor="middle" font-size="10.5">値オブジェクト</text>
        <rect x="500" y="210" width="130" height="42" rx="7" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3" />
        <text x="565" y="236" text-anchor="middle" font-size="10.5">リポジトリ</text>

        <text x="340" y="290" text-anchor="middle" font-size="11" class="muted">
          同じ言葉が別の意味を持つことを認め、境界として引くのが戦略的DDDの要点
        </text>
      </svg>
    </div>
  </body>
</html>
