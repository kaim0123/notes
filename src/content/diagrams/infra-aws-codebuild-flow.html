<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="ビルドが使い捨ての環境で走ることと、それでも速さを保つ仕組みを示した図。実行のたびに何も入っていない新しい環境が用意され、ソースを取得し、手順書に書いた依存の取得・ビルド・テストが順に走り、成果物を保存して環境は破棄される。毎回まっさらであることが再現性を生む一方、依存の取得を毎回やり直すと時間がかかる。そこで依存やビルドの中間結果だけを外へ保存しておき、次回の実行で読み込む。つまり環境は使い捨てのまま、時間のかかる部分だけを持ち越すという分け方をしている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="80" y="82" font-size="10" text-anchor="middle">まっさらな環境</text>
        <text x="80" y="100" font-size="9" text-anchor="middle" class="muted">毎回作り直す</text>
        <line x1="146" y1="86" x2="176" y2="86" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="182" y="60" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="242" y="82" font-size="10" text-anchor="middle">ソースを取得</text>
        <text x="242" y="100" font-size="9" text-anchor="middle" class="muted">指定した版</text>
        <line x1="308" y1="86" x2="338" y2="86" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="344" y="60" width="150" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="419" y="82" font-size="10" text-anchor="middle">手順書どおりに実行</text>
        <text x="419" y="100" font-size="9" text-anchor="middle" class="muted">依存の取得・ビルド・テスト</text>
        <line x1="500" y1="86" x2="530" y2="86" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="536" y="60" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="596" y="82" font-size="10" text-anchor="middle">成果物を保存</text>
        <text x="596" y="100" font-size="9" text-anchor="middle" class="muted">外へ出す</text>
        <line x1="662" y1="86" x2="692" y2="86" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="726" y="82" font-size="10" text-anchor="middle" class="muted">破棄</text>

        <rect x="182" y="150" width="312" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-dasharray="5 4" />
        <text x="338" y="170" font-size="10.5" text-anchor="middle" class="accent">時間のかかる部分だけを外に保存して持ち越す</text>
        <text x="338" y="188" font-size="9" text-anchor="middle" class="muted">依存の取得結果・ビルドの中間生成物</text>
        <path d="M419,116 L419,146" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <path d="M182,175 L100,175 L100,116" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="120" y="140" font-size="9" class="muted">次回に読み込む</text>

        <text x="20" y="240" font-size="10.5" class="muted">毎回まっさらだから再現性がある ― 手元では通るのにここで落ちる、は環境差ではなく手順書の不足。</text>
        <text x="20" y="262" font-size="10.5" class="muted">環境は使い捨てのまま、遅い部分だけを持ち越す。この分け方が速さと確実さを両立させる。</text>
      </svg>
    </div>
  </body>
</html>
