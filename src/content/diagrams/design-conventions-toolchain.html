<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 270"
        role="img"
        aria-label="コーディング規約が自動で適用される流れの図。コードを書く、保存時にフォーマッタが見た目を統一する、コミット前にリンターが規約違反と潜在的なバグを検出する、CIで同じチェックを再実行して通らなければマージしない、という4段階が矢印で左から右へつながる。その結果として、人間のレビューはロジックが正しいかどうかだけに集中できる、と示される。"
      >
        <defs>
          <marker
            id="arrowConv"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="350" y="26" text-anchor="middle" font-size="11.5" class="muted">機械にできる統一は、人間のレビューの前に済ませておく</text>

        <rect x="20" y="42" width="150" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="95" y="72" text-anchor="middle" font-size="12" font-weight="600">コードを書く</text>
        <text x="95" y="98" text-anchor="middle" font-size="10.5" class="muted">エディタ</text>
        <text x="95" y="116" text-anchor="middle" font-size="10.5" class="muted">(設定は共有する)</text>

        <line x1="174" y1="90" x2="186" y2="90" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowConv)" />

        <rect x="190" y="42" width="150" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="265" y="72" text-anchor="middle" font-size="12" font-weight="600">保存時</text>
        <text x="265" y="98" text-anchor="middle" font-size="10.5" class="muted">フォーマッタ</text>
        <text x="265" y="116" text-anchor="middle" font-size="10.5" class="muted">見た目を自動で統一</text>

        <line x1="344" y1="90" x2="356" y2="90" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowConv)" />

        <rect x="360" y="42" width="150" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="435" y="72" text-anchor="middle" font-size="12" font-weight="600">コミット前</text>
        <text x="435" y="98" text-anchor="middle" font-size="10.5" class="muted">リンター</text>
        <text x="435" y="116" text-anchor="middle" font-size="10.5" class="muted">規約違反・潜在バグ検出</text>

        <line x1="514" y1="90" x2="526" y2="90" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowConv)" />

        <rect x="530" y="42" width="150" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="605" y="72" text-anchor="middle" font-size="12" font-weight="600">CI</text>
        <text x="605" y="98" text-anchor="middle" font-size="10.5" class="muted">同じチェックを再実行</text>
        <text x="605" y="116" text-anchor="middle" font-size="10.5" class="muted">通らなければマージ不可</text>

        <rect x="20" y="168" width="660" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="350" y="199" text-anchor="middle" font-size="12" font-weight="600">
          人間のレビューは「ロジックが正しいか」だけに集中できる
        </text>

        <text x="350" y="250" text-anchor="middle" font-size="11" class="muted">
          規約は「守ろうと呼びかけるもの」ではなく、ツールで強制して初めて機能する
        </text>
      </svg>
    </div>
  </body>
</html>
