<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="出来事を配る仕組みと、それを土台にした振り分けの仕組みの関係を示した図。下の層は、送る側と受け取る側を切り離してメッセージを届ける土台で、大量のメッセージを確実に運ぶことに専念する。上の層はその土台の上に立ち、どの出来事をどの宛先へ渡すかという条件を設定として持つ。したがって上の層を使っても、実際にメッセージを運んでいるのは下の層である。単純に配りたいだけなら下の層を直接使い、種類ごとに宛先を変えたいなら上の層を使う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="60" y="46" width="580" height="86" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="74" font-size="11.5" text-anchor="middle">振り分けの層</text>
        <text x="350" y="98" font-size="9.5" text-anchor="middle" class="muted">どの出来事を、どの宛先へ渡すかを条件として持つ</text>
        <text x="350" y="118" font-size="9.5" text-anchor="middle" class="accent">つなぎ方が設定として外に出る</text>

        <line x1="350" y1="140" x2="350" y2="164" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="380" y="158" font-size="9" class="muted">実際に運ぶのは下の層</text>

        <rect x="20" y="170" width="660" height="86" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="198" font-size="11.5" text-anchor="middle">配送の土台</text>
        <text x="350" y="222" font-size="9.5" text-anchor="middle" class="muted">送る側と受け取る側を切り離し、大量のメッセージを確実に運ぶ</text>
        <text x="350" y="242" font-size="9.5" text-anchor="middle" class="muted">溜める・再試行する・順序を保つ ― 運ぶことに専念する</text>
      </svg>
    </div>
  </body>
</html>
