<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="データを表示する画面が持つ4つの状態を並べた図。左上は読み込み中で、本来の中身と同じ形のスケルトンを見せる。右上は成功してデータがある場合で、本来の表示になる。左下は成功したがデータが0件の場合で、空であることの説明と次にとれる行動を見せる。右下は失敗した場合で、原因の要約と再試行の手段を見せる。左下と右下の2つは実装で忘れられやすく、抜けると空のリストだけが残ったり真っ白な画面になったりして、利用者には壊れているようにしか見えない。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="34" width="290" height="106" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="58" font-size="11.5">読み込み中</text>
        <rect x="38" y="70" width="180" height="12" rx="3" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <rect x="38" y="90" width="250" height="12" rx="3" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <rect x="38" y="110" width="140" height="12" rx="3" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="230" y="58" font-size="10" class="muted">本来と同じ形で待たせる</text>

        <rect x="330" y="34" width="290" height="106" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="348" y="58" font-size="11.5" class="lbl">成功(データあり)</text>
        <text x="348" y="84" font-size="10.5" class="muted">・ 記事タイトル A</text>
        <text x="348" y="104" font-size="10.5" class="muted">・ 記事タイトル B</text>
        <text x="348" y="124" font-size="10.5" class="muted">・ 記事タイトル C</text>

        <rect x="20" y="156" width="290" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="38" y="180" font-size="11.5">成功(0件) ― 忘れられやすい</text>
        <text x="38" y="206" font-size="10.5" class="muted">まだ投稿がありません</text>
        <text x="38" y="228" font-size="10.5" class="lbl">最初の1件を書いてみましょう</text>
        <rect x="38" y="240" width="110" height="24" rx="5" fill="var(--primary)" stroke="none" />
        <text x="93" y="257" text-anchor="middle" font-size="10" fill="var(--primary-fg)">投稿する</text>
        <text x="170" y="257" font-size="10" class="muted">← 次の行動を置く</text>

        <rect x="330" y="156" width="290" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="348" y="180" font-size="11.5">失敗 ― 忘れられやすい</text>
        <text x="348" y="206" font-size="10.5" class="muted">データを読み込めませんでした</text>
        <text x="348" y="228" font-size="10.5" class="muted">識別子: 8f2c1a</text>
        <rect x="348" y="240" width="96" height="24" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="396" y="257" text-anchor="middle" font-size="10" class="lbl">再試行</text>
        <text x="460" y="257" font-size="10" class="muted">← 例外文をそのまま出さない</text>
      </svg>
    </div>
  </body>
</html>
