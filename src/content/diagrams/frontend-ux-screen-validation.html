<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="入力検査を層ごとに並べた図。手前から奥へ3層あり、いちばん手前がブラウザでの検査で、目的は利用者にその場で気付かせること。省くと送信して初めてエラーが分かるため体験が悪くなるが、これは防御ではない。中央がサーバーでの検査で、目的は不正なデータを絶対に通さないことであり、これが本体。省くと改ざんされた値がそのまま入る。いちばん奥がデータベースの制約で、一意性や参照整合性を守る最後の砦。3層は重複しているように見えるが、それぞれ守っている対象が違う。図の下に、開発者ツールから直接送ればブラウザ側の検査は素通りするという注記がある。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="40" width="600" height="62" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="64" font-size="12">① ブラウザでの検査</text>
        <text x="38" y="86" font-size="10.5" class="muted">目的: その場で気付かせる ― 体験のため。省くと送信するまで誤りが分からない</text>
        <text x="606" y="64" text-anchor="end" font-size="10.5" class="muted">防御ではない</text>

        <line x1="320" y1="102" x2="320" y2="124" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="336" y="118" font-size="10" class="muted">送信</text>

        <rect x="20" y="128" width="600" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="38" y="154" font-size="12" class="lbl">② サーバーでの検査 ― これが本体</text>
        <text x="38" y="176" font-size="10.5" class="muted">目的: 不正なデータを絶対に通さない。形式・範囲・照合に加えて、認可もここ</text>
        <text x="606" y="154" text-anchor="end" font-size="10.5" class="lbl">省略できない</text>

        <line x1="320" y1="198" x2="320" y2="220" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="336" y="214" font-size="10" class="muted">保存</text>

        <rect x="20" y="224" width="600" height="62" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="248" font-size="12">③ データベースの制約</text>
        <text x="38" y="270" font-size="10.5" class="muted">目的: 最後の砦。一意性・参照整合性・NOT NULL。アプリの抜け道からも守る</text>

        <path d="M14 60 L6 60 L6 160 L14 160" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="14" y="20" font-size="10.5" class="lbl">開発者ツールから直接送れば ① は素通りする ― だから ② を省けない</text>
      </svg>
    </div>
  </body>
</html>
