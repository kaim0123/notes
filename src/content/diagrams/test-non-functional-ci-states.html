<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 310"
        role="img"
        aria-label="画面の状態が変わるたびに非機能の検査を差し込む位置を示した図。画面は初期表示から、モーダルを開いた状態、入力エラーを表示した状態、通知を表示した状態へと変化していく。多くの場合、検査が差し込まれているのは初期表示のときだけで、状態が変わったあとの3つは素通りしている。しかし動的に追加された要素にラベルや代替テキストが無い、モーダルを開いたのにフォーカスが移っていない、通知が読み上げられない、といった不足は、変化したあとの状態でしか現れない。機能テストの観点表には現れない種類の不足であり、状態が変わるたびに検査を差し込むことで初めて拾える。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11" class="muted">初期表示だけを検査して「合格」にしていないか</text>

        <rect x="16" y="42" width="144" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="88" y="66" font-size="10" text-anchor="middle">初期表示</text>
        <text x="88" y="84" font-size="8.5" text-anchor="middle" class="muted">静的なマークアップ</text>

        <line x1="164" y1="70" x2="186" y2="70" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="190" y="42" width="144" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="262" y="66" font-size="10" text-anchor="middle">モーダルを開く</text>
        <text x="262" y="84" font-size="8.5" text-anchor="middle" class="muted">焦点は移ったか</text>

        <line x1="338" y1="70" x2="360" y2="70" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="364" y="42" width="144" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="436" y="66" font-size="10" text-anchor="middle">入力エラーを出す</text>
        <text x="436" y="84" font-size="8.5" text-anchor="middle" class="muted">誤りと紐づいているか</text>

        <line x1="512" y1="70" x2="534" y2="70" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="538" y="42" width="86" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="581" y="66" font-size="10" text-anchor="middle">通知を出す</text>
        <text x="581" y="84" font-size="8.5" text-anchor="middle" class="muted">読み上がるか</text>

        <line x1="88" y1="98" x2="88" y2="122" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <rect x="24" y="126" width="128" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="88" y="146" font-size="9" text-anchor="middle" class="muted">検査(たいていここだけ)</text>

        <line x1="262" y1="98" x2="262" y2="122" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="3 3" />
        <rect x="198" y="126" width="128" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="262" y="146" font-size="9" text-anchor="middle" class="accent">ここにも差し込む</text>

        <line x1="436" y1="98" x2="436" y2="122" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="3 3" />
        <rect x="372" y="126" width="128" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="436" y="146" font-size="9" text-anchor="middle" class="accent">ここにも差し込む</text>

        <line x1="581" y1="98" x2="581" y2="122" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="3 3" />
        <rect x="524" y="126" width="100" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="574" y="146" font-size="9" text-anchor="middle" class="accent">ここにも</text>

        <rect x="16" y="176" width="608" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="198" font-size="10" class="muted">変化したあとの状態でしか現れない不足</text>
        <text x="30" y="218" font-size="9" class="muted">動的に足された要素にラベルや代替テキストが無い / 開いたのに焦点が移っていない</text>
        <text x="30" y="236" font-size="9" class="muted">閉じたあと元の位置に戻らない / 通知が支援技術に伝わらない</text>

        <text x="16" y="276" font-size="10.5" class="muted">いずれも機能テストの観点表には現れない ― 機能としては正しく動いているため。</text>
        <text x="16" y="298" font-size="10.5" class="accent">すでにあるE2Eの中に検査を1行足すだけで拾える。新しい仕組みは要らない。</text>
      </svg>
    </div>
  </body>
</html>
