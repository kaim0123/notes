<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 280" role="img" aria-label="クラスの接尾辞と層の対応を示した図。上からController(リクエストの入口で振り分ける)、Service(業務手順を実行する)、その下でRepository(自前のデータを保存・取得する)とClient(外部サービスと通信する)が横に並ぶ。Repositoryの先には自前のデータベース、Clientの先には外部APIがある。接尾辞が、そのクラスがどの層にいるかを名前だけで伝えることを示す。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">接尾辞が、そのクラスの居場所を名前だけで伝える</text>

        <rect x="180" y="42" width="300" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="330" y="62" text-anchor="middle" font-size="11">Controller</text>
        <text x="330" y="78" text-anchor="middle" font-size="9.5" class="muted">リクエストの入口で振り分ける</text>
        <line x1="330" y1="84" x2="330" y2="102" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="180" y="106" width="300" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="330" y="126" text-anchor="middle" font-size="11" font-weight="600">Service</text>
        <text x="330" y="142" text-anchor="middle" font-size="9.5" class="muted">業務手順を実行する</text>

        <line x1="270" y1="148" x2="200" y2="176" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="390" y1="148" x2="460" y2="176" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="60" y="180" width="220" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="170" y="200" text-anchor="middle" font-size="11">Repository</text>
        <text x="170" y="216" text-anchor="middle" font-size="9.5" class="muted">自前のデータを保存・取得</text>

        <rect x="380" y="180" width="220" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="490" y="200" text-anchor="middle" font-size="11">Client</text>
        <text x="490" y="216" text-anchor="middle" font-size="9.5" class="muted">外部サービスと通信する</text>

        <text x="170" y="248" text-anchor="middle" font-size="10" class="muted">→ 自前のデータベース</text>
        <text x="490" y="248" text-anchor="middle" font-size="10" class="muted">→ 外部API</text>

        <text x="330" y="272" text-anchor="middle" font-size="11" class="muted">
          接尾辞が付けにくいクラスは、責務が曖昧になっている兆候でもある
        </text>
      </svg>
    </div>
  </body>
</html>
