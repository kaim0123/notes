<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 800 260"
        role="img"
        aria-label="VPNトンネルの図解。拠点AのLANから拠点BのLANへの通信は、両端のVPNゲートウェイの間だけ暗号化トンネルとして信頼できないインターネットを通過し、拠点内のホストは平文のまま通信している意識で済む。"
      >
        <defs>
          <marker
            id="arrowVpn"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="20" y="110" width="130" height="60" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="135" text-anchor="middle" font-size="12.5" font-weight="600">拠点A LAN</text>
        <text x="85" y="152" text-anchor="middle" font-size="9.5" class="muted">192.168.1.0/24</text>

        <rect x="180" y="110" width="100" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="230" y="135" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--primary)">VPN</text>
        <text x="230" y="150" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--primary)">ゲートウェイA</text>

        <rect x="310" y="95" width="180" height="90" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="400" y="120" text-anchor="middle" font-size="11.5" class="muted">インターネット</text>
        <text x="400" y="136" text-anchor="middle" font-size="10" class="muted">(信頼できない)</text>

        <rect x="520" y="110" width="100" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="570" y="135" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--primary)">VPN</text>
        <text x="570" y="150" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--primary)">ゲートウェイB</text>

        <rect x="650" y="110" width="130" height="60" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="715" y="135" text-anchor="middle" font-size="12.5" font-weight="600">拠点B LAN</text>
        <text x="715" y="152" text-anchor="middle" font-size="9.5" class="muted">192.168.2.0/24</text>

        <line x1="150" y1="140" x2="180" y2="140" stroke="var(--fg)" stroke-width="1.4" marker-end="url(#arrowVpn)" />
        <text x="165" y="185" text-anchor="middle" font-size="9" class="muted">平文</text>

        <line x1="280" y1="140" x2="520" y2="140" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrowVpn)" />
        <text x="400" y="200" text-anchor="middle" font-size="11" style="fill: var(--primary)">暗号化トンネル(IPsecなど)</text>

        <line x1="620" y1="140" x2="650" y2="140" stroke="var(--fg)" stroke-width="1.4" marker-end="url(#arrowVpn)" />
        <text x="635" y="185" text-anchor="middle" font-size="9" class="muted">平文</text>

        <text x="230" y="98" text-anchor="middle" font-size="9.5" style="fill: var(--primary)">①暗号化</text>
        <text x="570" y="98" text-anchor="middle" font-size="9.5" style="fill: var(--primary)">②復号</text>

        <text x="400" y="235" text-anchor="middle" font-size="11.5" class="muted">
          暗号化・復号を行うのは両端のVPNゲートウェイだけ ― 拠点内のホストは平文のまま通信している意識で済む
        </text>
      </svg>
    </div>
  </body>
</html>
