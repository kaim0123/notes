<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 320"
        role="img"
        aria-label="文書ごとの語一覧を裏返して、語ごとに出現する文書番号の一覧を持つ転置索引の構造図"
      >
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="30" y="28" font-size="13" class="muted">文書 → 語 の対応を裏返すと、語 → 文書 の索引になる</text>

        <!-- 左: 文書 -->
        <text x="160" y="66" text-anchor="middle" font-size="13" class="muted">元の文書</text>
        <rect x="40" y="80" width="240" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="58" y="104" font-size="13" font-weight="600">文書1</text>
        <text x="58" y="123" font-size="12" class="muted">ネットワーク / 設計 / 運用</text>

        <rect x="40" y="144" width="240" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="58" y="168" font-size="13" font-weight="600">文書2</text>
        <text x="58" y="187" font-size="12" class="muted">設計 / 索引</text>

        <rect x="40" y="208" width="240" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="58" y="232" font-size="13" font-weight="600">文書3</text>
        <text x="58" y="251" font-size="12" class="muted">索引 / 運用</text>

        <!-- 変換の矢印 -->
        <line x1="300" y1="170" x2="376" y2="170" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#a)" />
        <text x="338" y="156" text-anchor="middle" font-size="12" class="accent" font-weight="600">裏返す</text>

        <!-- 右: 転置索引 -->
        <text x="580" y="66" text-anchor="middle" font-size="13" class="accent" font-weight="600">転置索引</text>

        <rect x="390" y="80" width="180" height="38" rx="8" fill="var(--primary)" opacity="0.25" stroke="var(--primary)" />
        <text x="410" y="105" font-size="14">ネットワーク</text>
        <text x="590" y="105" font-size="14" class="mono">→ [1]</text>

        <rect x="390" y="126" width="180" height="38" rx="8" fill="var(--primary)" opacity="0.25" stroke="var(--primary)" />
        <text x="410" y="151" font-size="14">設計</text>
        <text x="590" y="151" font-size="14" class="mono">→ [1, 2]</text>

        <rect x="390" y="172" width="180" height="38" rx="8" fill="var(--primary)" opacity="0.25" stroke="var(--primary)" />
        <text x="410" y="197" font-size="14">索引</text>
        <text x="590" y="197" font-size="14" class="mono">→ [2, 3]</text>

        <rect x="390" y="218" width="180" height="38" rx="8" fill="var(--primary)" opacity="0.25" stroke="var(--primary)" />
        <text x="410" y="243" font-size="14">運用</text>
        <text x="590" y="243" font-size="14" class="mono">→ [1, 3]</text>

        <text x="410" y="296" font-size="12" class="muted">
          検索時はテキストを走査せず、語を引いて文書番号の並びを取り出すだけ ― 全文検索エンジンの基本構造
        </text>
      </svg>
    </div>
  </body>
</html>
