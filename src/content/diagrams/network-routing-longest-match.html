<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 680 300"
        role="img"
        aria-label="最長一致(ロンゲストマッチ)の図解。宛先192.168.1.130に対して0.0.0.0/0、192.168.0.0/16、192.168.1.0/24、192.168.1.128/25の4つのルートがすべて一致するが、最もプレフィックスが長い192.168.1.128/25が採用される。"
      >
        <text x="340" y="22" text-anchor="middle" font-size="12.5" font-weight="700">宛先 192.168.1.130 への一致するルート</text>

        <rect x="40" y="45" width="600" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="60" y="70" font-size="12" class="mono">0.0.0.0/0</text>
        <text x="280" y="70" font-size="11" class="muted">プレフィックス長 0</text>
        <text x="600" y="70" text-anchor="end" font-size="11" class="muted">一致(でも短い)</text>

        <rect x="40" y="93" width="600" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="60" y="118" font-size="12" class="mono">192.168.0.0/16</text>
        <text x="280" y="118" font-size="11" class="muted">プレフィックス長 16</text>
        <text x="600" y="118" text-anchor="end" font-size="11" class="muted">一致(でも短い)</text>

        <rect x="40" y="141" width="600" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="60" y="166" font-size="12" class="mono">192.168.1.0/24</text>
        <text x="280" y="166" font-size="11" class="muted">プレフィックス長 24</text>
        <text x="600" y="166" text-anchor="end" font-size="11" class="muted">一致(でも短い)</text>

        <rect x="40" y="189" width="600" height="46" rx="6" fill="var(--primary)" />
        <text x="60" y="217" font-size="13" font-weight="700" class="mono" style="fill: var(--primary-fg)">192.168.1.128/25</text>
        <text x="280" y="217" font-size="11.5" font-weight="600" style="fill: var(--primary-fg)">プレフィックス長 25(最長)</text>
        <text x="600" y="217" text-anchor="end" font-size="12" font-weight="700" style="fill: var(--primary-fg)">採用 ✓</text>

        <text x="340" y="265" text-anchor="middle" font-size="12" class="muted">
          4つとも192.168.1.130を含むが、ルーターは最もプレフィックスが長い(=最も具体的な)経路を選ぶ
        </text>
      </svg>
    </div>
  </body>
</html>
