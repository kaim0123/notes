<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="ユーティリティ型が元の型から新しい型を派生させる様子を示した図。中央左に元となるUser型があり、id、name、emailの3つのプロパティを持つ。そこから3本の矢印が伸びる。1本目のPartialは全プロパティを省略可能にした型を作り、一部だけ更新するときのパッチの型に使う。2本目のOmitはemailを除いた型を作り、公開用ユーザーの型に使う。3本目のPickはidとnameだけを取り出した型を作り、この例ではOmitの結果と同じ形になる。いずれも元のUser型は書き換わらず、そのまま残る。Userの定義を1か所直せば、派生した型もすべて自動で追従する。データを不変に変換してきたのと同じ発想が、型の世界にも通じている。"
      >
        <defs>
          <marker id="aru" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="98" width="176" height="96" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="104" y="124" text-anchor="middle" font-size="12.5" font-weight="600">User</text>
        <text x="104" y="146" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">id: number</text>
        <text x="104" y="163" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">name: string</text>
        <text x="104" y="180" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">email: string</text>

        <line x1="192" y1="128" x2="266" y2="62" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#aru)" />
        <line x1="192" y1="146" x2="266" y2="146" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#aru)" />
        <line x1="192" y1="164" x2="266" y2="230" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#aru)" />

        <rect x="272" y="32" width="352" height="62" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="288" y="54" font-size="11.5" font-family="monospace" class="lbl">Partial&lt;User&gt;</text>
        <text x="288" y="72" font-size="10.5" class="muted">全プロパティを省略可能にする</text>
        <text x="608" y="72" text-anchor="end" font-size="10.5" class="muted">一部だけ更新するパッチの型に</text>

        <rect x="272" y="116" width="352" height="62" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="288" y="138" font-size="11.5" font-family="monospace" class="lbl">Omit&lt;User, &quot;email&quot;&gt;</text>
        <text x="288" y="156" font-size="10.5" class="muted">email を除いた型</text>
        <text x="608" y="156" text-anchor="end" font-size="10.5" class="muted">公開用ユーザーの型に</text>

        <rect x="272" y="200" width="352" height="62" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="288" y="222" font-size="11.5" font-family="monospace" class="lbl">Pick&lt;User, &quot;id&quot; | &quot;name&quot;&gt;</text>
        <text x="288" y="240" font-size="10.5" class="muted">id と name だけ取り出した型</text>
        <text x="608" y="240" text-anchor="end" font-size="10.5" class="muted">この例では Omit と同じ形</text>

        <text x="16" y="222" font-size="10.5" class="lbl">元の User は</text>
        <text x="16" y="238" font-size="10.5" class="lbl">書き換わらない</text>

        <text x="16" y="280" font-size="11" class="muted">User を1か所直せば派生した型もすべて追従する ― データを不変に変換してきたのと同じ発想</text>
      </svg>
    </div>
  </body>
</html>
