<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 600"
        role="img"
        aria-label="VLANによるブロードキャストドメイン分割の図解。VLANが無い場合はスイッチ全体が1つのブロードキャストドメインで、1台からのブロードキャストが全ポートに届く。VLANを設定すると同じ物理スイッチがVLAN10とVLAN20という2つの論理的なブロードキャストドメインに分かれ、片方のブロードキャストはもう片方には届かなくなる。"
      >
        <!-- ============ VLAN無し ============ -->
        <text x="360" y="20" text-anchor="middle" font-size="13" font-weight="700">
          VLANが無い場合 ― スイッチ全体が1つのブロードキャストドメイン
        </text>

        <rect x="105" y="55" width="510" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="600">スイッチ</text>

        <rect x="105" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="140" y="175" text-anchor="middle" font-size="11.5">PC1</text>
        <rect x="190" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="225" y="175" text-anchor="middle" font-size="11.5">PC2</text>
        <rect x="275" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="310" y="175" text-anchor="middle" font-size="11.5">PC3</text>
        <rect x="360" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="395" y="175" text-anchor="middle" font-size="11.5">PC4</text>
        <rect x="445" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="480" y="175" text-anchor="middle" font-size="11.5">PC5</text>
        <rect x="530" y="150" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="565" y="175" text-anchor="middle" font-size="11.5">PC6</text>

        <line x1="140" y1="150" x2="140" y2="95" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="225" y1="150" x2="225" y2="95" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="310" y1="150" x2="310" y2="95" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="395" y1="150" x2="395" y2="95" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="480" y1="150" x2="480" y2="95" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="565" y1="150" x2="565" y2="95" stroke="var(--fg)" stroke-width="1.2" />

        <ellipse cx="360" cy="140" rx="290" ry="115" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />

        <text x="360" y="272" text-anchor="middle" font-size="11.5" class="muted">ブロードキャストドメイン(1つ)</text>
        <text x="360" y="290" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">
          PC1のブロードキャストが全ポート(PC2〜PC6)に届く
        </text>

        <line x1="0" y1="315" x2="720" y2="315" stroke="var(--border)" stroke-width="1" />

        <!-- ============ VLAN有り ============ -->
        <text x="360" y="340" text-anchor="middle" font-size="13" font-weight="700">
          VLANがある場合 ― 論理的に複数のブロードキャストドメインに分割
        </text>

        <rect x="105" y="375" width="255" height="40" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="232" y="400" text-anchor="middle" font-size="12" font-weight="600" style="fill: var(--primary)">VLAN10</text>
        <rect x="360" y="375" width="255" height="40" fill="var(--card)" stroke="var(--border)" />
        <text x="487" y="400" text-anchor="middle" font-size="12" font-weight="600">VLAN20</text>

        <rect x="105" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="140" y="495" text-anchor="middle" font-size="11.5">PC1</text>
        <rect x="190" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="225" y="495" text-anchor="middle" font-size="11.5">PC2</text>
        <rect x="275" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="310" y="495" text-anchor="middle" font-size="11.5">PC3</text>
        <rect x="360" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="395" y="495" text-anchor="middle" font-size="11.5">PC4</text>
        <rect x="445" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="480" y="495" text-anchor="middle" font-size="11.5">PC5</text>
        <rect x="530" y="470" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="565" y="495" text-anchor="middle" font-size="11.5">PC6</text>

        <line x1="140" y1="470" x2="140" y2="415" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="225" y1="470" x2="225" y2="415" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="310" y1="470" x2="310" y2="415" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="395" y1="470" x2="395" y2="415" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="480" y1="470" x2="480" y2="415" stroke="var(--fg)" stroke-width="1.2" />
        <line x1="565" y1="470" x2="565" y2="415" stroke="var(--fg)" stroke-width="1.2" />

        <ellipse cx="220" cy="450" rx="150" ry="110" fill="none" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="5 4" />
        <ellipse cx="500" cy="450" rx="150" ry="110" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />

        <text x="360" y="580" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">
          PC1のブロードキャストはVLAN10内(PC2・PC3)までしか届かず、VLAN20(PC4〜PC6)には届かない
        </text>
      </svg>
    </div>
  </body>
</html>
