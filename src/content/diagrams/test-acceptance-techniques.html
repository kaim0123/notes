<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="レビューの4つの技法を、形式の重さと参加する人数の2軸に配置した図。横軸は左へ行くほど軽く速く、右へ行くほど重く確実。縦軸は下が少人数、上が多人数。左下にはペアやモブでの確認があり、書きながらその場で見るもので最も軽い。中央下寄りにはウォークスルーがあり、作成者が説明して参加者が質問する形で、教育と知識共有にも向く。中央上寄りには技術レビューがあり、専門家が技術的な妥当性を評価する。右上にはインスペクションがあり、モデレーターや記録係といった役割を定めチェックリストを使って欠陥を検出する、最も形式的で重い技法。重い技法ほど見つかる欠陥は多いが、そのぶん時間と人数を消費するため、リスクの大きさに応じて選ぶ。すべての成果物にインスペクションを行う必要はなく、日常の実装は左下側で足りる。"
      >
        <text x="16" y="26" font-size="11" class="muted">厳格さは目的で選ぶ ― すべてに最も重い技法を当てる必要はない</text>

        <line x1="70" y1="250" x2="640" y2="250" stroke="var(--border)" stroke-width="1.2" />
        <line x1="70" y1="50" x2="70" y2="250" stroke="var(--border)" stroke-width="1.2" />
        <text x="355" y="272" font-size="9.5" text-anchor="middle" class="muted">軽く・速い　　←　　形式の重さ　　→　　重く・確実</text>
        <text x="30" y="150" font-size="9.5" class="muted">人数</text>

        <rect x="90" y="192" width="130" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="155" y="212" font-size="9.5" text-anchor="middle" class="accent">ペア・モブでの確認</text>
        <text x="155" y="228" font-size="8.5" text-anchor="middle" class="muted">書きながら、その場で</text>

        <rect x="250" y="158" width="130" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="315" y="178" font-size="9.5" text-anchor="middle" class="muted">ウォークスルー</text>
        <text x="315" y="194" font-size="8.5" text-anchor="middle" class="muted">作成者が説明する</text>

        <rect x="400" y="112" width="130" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="465" y="132" font-size="9.5" text-anchor="middle" class="muted">技術レビュー</text>
        <text x="465" y="148" font-size="8.5" text-anchor="middle" class="muted">専門家が妥当性を見る</text>

        <rect x="540" y="62" width="140" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="610" y="82" font-size="9.5" text-anchor="middle" class="muted">インスペクション</text>
        <text x="610" y="98" font-size="8.5" text-anchor="middle" class="muted">役割を定め、表で潰す</text>

        <line x1="16" y1="286" x2="684" y2="286" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="306" font-size="10.5" class="accent">重いほど見つかるが、そのぶん時間と人数を消費する。リスクの大きさに応じて選ぶ。</text>
      </svg>
    </div>
  </body>
</html>
