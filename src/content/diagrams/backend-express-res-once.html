<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --warn: oklch(0.82 0.16 75);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .warn { fill: var(--warn); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="応答が一度しか送れないことを示した図。横軸は時間で、送信の瞬間を境に2つの区間に分かれる。左側は組み立て中の区間で、ステータスコードもヘッダーも本文も、まだ何度でも変えられる。中央に送信の線があり、そこで応答が確定して送り出される。右側は確定後の区間で、ここでヘッダーを足したり、もう一度送ろうとしたりすると、すでに送信済みだという例外になる。下段には典型的な失敗の形が置かれている。条件に当てはまったので応答を返したあと、returnを書き忘れたために処理が下へ流れ、その先でもう一度応答を返そうとする。1つ目の送信は成功しているので画面上は正常に見えるが、サーバー側では例外が記録され続ける。だから条件分岐で応答を出し分けるときは、returnを付けてその先へ進ませないのが安全になる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">応答は、一度しか送れない</text>

        <line x1="320" y1="40" x2="320" y2="130" stroke="var(--primary)" stroke-width="2" />
        <text x="278" y="36" font-size="10" class="lbl">送信の瞬間</text>

        <rect x="16" y="52" width="296" height="64" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="32" y="74" font-size="10.5">組み立て中</text>
        <text x="32" y="94" font-size="9.5" class="muted">ステータスもヘッダーも本文も、何度でも変えられる</text>
        <text x="32" y="110" font-size="9.5" class="mono muted">res.status(201).set(...)</text>

        <rect x="328" y="52" width="296" height="64" rx="7" fill="var(--card)" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="344" y="74" font-size="10.5" class="muted">確定後</text>
        <text x="344" y="94" font-size="9.5" class="muted">ここで足そうとすると、すでに送信済みという例外になる</text>
        <text x="344" y="110" font-size="9.5" class="warn">Cannot set headers after they are sent</text>

        <line x1="16" y1="150" x2="624" y2="150" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="176" font-size="11" class="muted">典型的な失敗</text>

        <rect x="16" y="190" width="420" height="86" rx="7" fill="var(--card)" stroke="var(--warn)" stroke-width="1.3" />
        <text x="32" y="212" font-size="10" class="mono muted">if (!user) res.status(404).json(...)   </text>
        <text x="330" y="212" font-size="9.5" class="warn">← return が無い</text>
        <text x="32" y="234" font-size="10" class="mono muted">// 処理はそのまま下へ流れる</text>
        <text x="32" y="256" font-size="10" class="mono muted">res.json(user)                        </text>
        <text x="330" y="256" font-size="9.5" class="warn">← 2回目の送信</text>

        <line x1="436" y1="232" x2="456" y2="232" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="464" y="220" font-size="10" class="muted">1回目は成功しているので</text>
        <text x="464" y="238" font-size="10" class="muted">画面上は正常に見える。</text>
        <text x="464" y="262" font-size="10" class="warn">例外だけが静かに積み上がる。</text>
      </svg>
    </div>
  </body>
</html>
