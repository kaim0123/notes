<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="サーバーの役割を1台にまとめる構成と、役割ごとに分ける構成を並べた図。左の小規模な構成では、1台のサーバーがドメインコントローラー、DNS、DHCP、ファイル共有を兼ねている。機材もライセンスも管理台数も少なくて済むが、その1台が止まればすべての役割が同時に止まり、1つの役割の負荷が他を巻き添えにする。右の構成では役割ごとにサーバーを分けており、影響範囲は限定され個別に増強もできるが、台数と管理の手間は増える。実務では左から始めて、規模と可用性の要求が上がった役割から順に右へ切り出していく。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="170" y="26" font-size="12" text-anchor="middle" class="muted">小規模 ― 1台が兼任する</text>
        <rect x="40" y="44" width="260" height="150" rx="10" fill="none" stroke="var(--primary)" />
        <text x="170" y="68" font-size="11.5" text-anchor="middle">1台のサーバー</text>
        <rect x="56" y="80" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="111" y="100" font-size="10" text-anchor="middle">ドメイン</text>
        <text x="111" y="114" font-size="10" text-anchor="middle">コントローラー</text>
        <rect x="174" y="80" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="229" y="107" font-size="10.5" text-anchor="middle">DNS</text>
        <rect x="56" y="132" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="111" y="159" font-size="10.5" text-anchor="middle">DHCP</text>
        <rect x="174" y="132" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="229" y="159" font-size="10.5" text-anchor="middle">ファイル共有</text>
        <text x="170" y="216" font-size="10" text-anchor="middle" class="muted">安い・管理台数が少ない</text>
        <text x="170" y="234" font-size="10" text-anchor="middle" class="accent">1台落ちると全部止まる</text>

        <line x1="330" y1="120" x2="410" y2="120" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="370" y="106" font-size="10" text-anchor="middle" class="accent">規模と</text>
        <text x="370" y="142" font-size="10" text-anchor="middle" class="accent">可用性の要求</text>

        <text x="590" y="26" font-size="12" text-anchor="middle" class="muted">規模が上がる ― 役割ごとに分ける</text>
        <rect x="440" y="44" width="140" height="70" rx="8" fill="none" stroke="var(--border)" />
        <text x="510" y="76" font-size="10.5" text-anchor="middle">認証サーバー</text>
        <text x="510" y="94" font-size="9" text-anchor="middle" class="muted">冗長化もしやすい</text>
        <rect x="600" y="44" width="140" height="70" rx="8" fill="none" stroke="var(--border)" />
        <text x="670" y="76" font-size="10.5" text-anchor="middle">DNS / DHCP</text>
        <text x="670" y="94" font-size="9" text-anchor="middle" class="muted">ネットワーク基盤</text>
        <rect x="440" y="124" width="140" height="70" rx="8" fill="none" stroke="var(--border)" />
        <text x="510" y="156" font-size="10.5" text-anchor="middle">ファイルサーバー</text>
        <text x="510" y="174" font-size="9" text-anchor="middle" class="muted">容量を足しやすい</text>
        <rect x="600" y="124" width="140" height="70" rx="8" fill="none" stroke="var(--border)" />
        <text x="670" y="156" font-size="10.5" text-anchor="middle">Webサーバー</text>
        <text x="670" y="174" font-size="9" text-anchor="middle" class="muted">外向けを分離</text>
        <text x="590" y="216" font-size="10" text-anchor="middle" class="muted">影響範囲が限定される・個別に増強できる</text>
        <text x="590" y="234" font-size="10" text-anchor="middle" class="accent">台数と管理の手間は増える</text>

        <text x="40" y="268" font-size="10.5" class="muted">最初から右を作らない ― 左から始めて、要求が上がった役割から順に切り出すのが実務の順序。</text>
      </svg>
    </div>
  </body>
</html>
