<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="検証が境界の内と外を分ける線であることを示した図。左は外側で、届いた値は型も範囲も何も保証されていない。文字列かもしれず、配列かもしれず、欠けているかもしれない。中央に検証の門があり、通らなかったものはその場で400として返される。右は内側で、ここから先は形が保証された値だけが流れる。だから中の処理は、防御的な条件分岐を書かずに済む。図の右下には、スキーマを1つ書くと2つのものが同時に手に入ることが示されている。ひとつは実行時の検証、もうひとつはコンパイル時の型。この2つが同じ定義から導かれるので、検証は直したのに型がずれている、という食い違いが起きない。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11" class="muted">外側 ― 何も保証されていない</text>
        <text x="392" y="24" font-size="11" class="lbl">内側 ― 形が保証されている</text>

        <rect x="16" y="38" width="190" height="140" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="30" y="62" font-size="9.5" class="mono muted">age: "abc"</text>
        <text x="30" y="84" font-size="9.5" class="mono muted">tag: ["a", "b"]</text>
        <text x="30" y="106" font-size="9.5" class="mono muted">name: undefined</text>
        <text x="30" y="128" font-size="9.5" class="mono muted">extra: { … }</text>
        <text x="30" y="158" font-size="9" class="muted">文字列か、配列か、欠けているか</text>

        <line x1="206" y1="108" x2="240" y2="108" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <rect x="244" y="38" width="120" height="140" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="2" />
        <text x="272" y="98" font-size="11" class="lbl">検証</text>
        <text x="258" y="120" font-size="9" class="muted">通らなければ</text>
        <text x="258" y="136" font-size="9" class="muted">その場で 400</text>

        <path d="M304,178 v26 h-190" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="130" y="220" font-size="9.5" class="muted">どこが、なぜ弾かれたかを返す</text>

        <line x1="364" y1="108" x2="398" y2="108" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="402" y="38" width="218" height="140" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="416" y="62" font-size="9.5" class="mono lbl">age: number</text>
        <text x="416" y="84" font-size="9.5" class="mono lbl">name: string</text>
        <text x="416" y="120" font-size="9.5" class="muted">中の処理は、防御的な条件分岐を</text>
        <text x="416" y="138" font-size="9.5" class="muted">書かずに済む</text>
        <text x="416" y="162" font-size="9" class="muted">「正しい入力しか来ない」前提で書ける</text>

        <line x1="16" y1="244" x2="624" y2="244" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="270" font-size="10.5" class="muted">スキーマを1つ書くと、2つが同時に手に入る ―</text>
        <text x="16" y="292" font-size="10.5" class="lbl">実行時の検証と、コンパイル時の型。</text>
        <text x="16" y="314" font-size="10.5" class="muted">同じ定義から導かれるので、「検証は直したのに型がずれている」という食い違いが起きない。</text>
      </svg>
    </div>
  </body>
</html>
