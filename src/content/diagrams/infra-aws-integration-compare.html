<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="サービス同士をつなぐ3つの仕組みの違いを示した図。1つ目のキューは、送った相手が1つの受け手に確実に届き、受け手の都合で取りに行く形で、処理速度の差を吸収する。2つ目の通知は、1つの出来事を購読している全員へ一斉に配る形で、送る側は誰が受け取るかを知らない。3つ目のイベントバスは、届いた出来事の中身を見て、条件に合う宛先だけへ振り分ける形で、送る側も受け取る側も互いを知らない。溜めたいのか、配りたいのか、内容で振り分けたいのかで選ぶ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="40" width="230" height="200" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="66" font-size="11.5" text-anchor="middle">キュー ― 溜める</text>
        <rect x="40" y="82" width="60" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="70" y="102" font-size="9" text-anchor="middle" class="muted">送る側</text>
        <rect x="110" y="82" width="60" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="140" y="102" font-size="9" text-anchor="middle">キュー</text>
        <rect x="180" y="82" width="50" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="205" y="102" font-size="9" text-anchor="middle" class="muted">受け手</text>
        <text x="135" y="140" font-size="9.5" text-anchor="middle" class="muted">受け手が自分の速さで取りに行く</text>
        <text x="135" y="162" font-size="9.5" text-anchor="middle" class="muted">1通は1人が処理する</text>
        <text x="135" y="192" font-size="10" text-anchor="middle" class="accent">速度差の吸収と、取りこぼしの防止</text>
        <text x="135" y="218" font-size="9" text-anchor="middle" class="muted">重い処理を後回しにしたいとき</text>

        <rect x="265" y="40" width="230" height="200" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="66" font-size="11.5" text-anchor="middle">通知 ― 一斉に配る</text>
        <rect x="285" y="82" width="60" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="315" y="102" font-size="9" text-anchor="middle" class="muted">送る側</text>
        <rect x="355" y="82" width="60" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="385" y="102" font-size="9" text-anchor="middle">話題</text>
        <rect x="425" y="76" width="50" height="20" rx="4" fill="none" stroke="var(--border)" />
        <text x="450" y="90" font-size="8.5" text-anchor="middle" class="muted">購読者</text>
        <rect x="425" y="100" width="50" height="20" rx="4" fill="none" stroke="var(--border)" />
        <text x="450" y="114" font-size="8.5" text-anchor="middle" class="muted">購読者</text>
        <text x="380" y="140" font-size="9.5" text-anchor="middle" class="muted">同じ内容が全員に届く</text>
        <text x="380" y="162" font-size="9.5" text-anchor="middle" class="muted">送る側は宛先を知らない</text>
        <text x="380" y="192" font-size="10" text-anchor="middle" class="accent">1つの出来事に、複数が反応する</text>
        <text x="380" y="218" font-size="9" text-anchor="middle" class="muted">後から受け手を足せる</text>

        <rect x="510" y="40" width="230" height="200" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="625" y="66" font-size="11.5" text-anchor="middle">イベントバス ― 振り分ける</text>
        <rect x="530" y="82" width="60" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="560" y="102" font-size="9" text-anchor="middle" class="muted">出来事</text>
        <rect x="600" y="82" width="60" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="630" y="102" font-size="9" text-anchor="middle">条件</text>
        <rect x="670" y="82" width="50" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="695" y="102" font-size="9" text-anchor="middle" class="muted">宛先</text>
        <text x="625" y="140" font-size="9.5" text-anchor="middle" class="muted">中身を見て、合う宛先にだけ渡す</text>
        <text x="625" y="162" font-size="9.5" text-anchor="middle" class="muted">送る側も受け手も互いを知らない</text>
        <text x="625" y="192" font-size="10" text-anchor="middle" class="accent">つなぎ方を、設定として外に出す</text>
        <text x="625" y="218" font-size="9" text-anchor="middle" class="muted">外部サービスの出来事も受けられる</text>

        <text x="20" y="278" font-size="10.5" class="muted">選ぶ基準 ― 溜めたいのか、配りたいのか、中身で振り分けたいのか。組み合わせて使うことも多い。</text>
      </svg>
    </div>
  </body>
</html>
