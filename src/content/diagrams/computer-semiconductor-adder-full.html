<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="全加算器のブロック図。入力aとbに加えて、前の桁から来る桁上がりxも受け取る。中身は半加算器2個ぶんで、その桁の答えsと、次の桁へ送る桁上がりcを出力する。" viewBox="0 0 560 230">

      <text x="70" y="65" fill="var(--fg)" font-size="14" text-anchor="middle">a</text>
      <line x1="85" y1="60" x2="200" y2="60" stroke="var(--muted)" stroke-width="1.5" />
      <text x="70" y="120" fill="var(--fg)" font-size="14" text-anchor="middle">b</text>
      <line x1="85" y1="115" x2="200" y2="115" stroke="var(--muted)" stroke-width="1.5" />
      <text x="70" y="175" fill="#ffb43c" font-size="14" text-anchor="middle">x</text>
      <line x1="85" y1="170" x2="200" y2="170" stroke="var(--muted)" stroke-width="1.5" />
      <text x="135" y="192" fill="var(--muted)" font-size="10" text-anchor="middle">前の桁から</text>

      <rect x="200" y="40" width="160" height="150" fill="none" stroke="var(--primary)" stroke-width="1.5" rx="8" />
      <text x="280" y="110" fill="var(--fg)" font-size="15" text-anchor="middle">全加算器</text>
      <text x="280" y="132" fill="var(--muted)" font-size="11" text-anchor="middle">(半加算器 2個)</text>

      <line x1="360" y1="85" x2="475" y2="85" stroke="var(--muted)" stroke-width="1.5" />
      <text x="495" y="90" fill="var(--primary)" font-size="14" text-anchor="middle">s</text>
      <text x="520" y="90" fill="var(--muted)" font-size="11">その桁</text>
      <line x1="360" y1="145" x2="475" y2="145" stroke="var(--muted)" stroke-width="1.5" />
      <text x="495" y="150" fill="#ffb43c" font-size="14" text-anchor="middle">c</text>
      <text x="520" y="150" fill="var(--muted)" font-size="11">次の桁へ</text>
      </svg>
    </div>
  </body>
</html>
