<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 370"
        role="img"
        aria-label="依存性逆転の原則(DIP)の前後を比べた図。上段の通常の依存では、上位の注文サービスから下位のMySQL用保存処理へ矢印が直接伸びており、DBを差し替えると上位のコードも変わってしまう。下段のDIP適用後では、注文サービスから注文リポジトリというインターフェース(抽象)へ矢印が伸び、MySQL実装とインメモリ実装(テスト用)の2つの実装からは、そのインターフェースへ向かって上向きの矢印が伸びる。依存の矢印が実装側から抽象へ逆転し、上位は差し替えを知らずに済むことを示す。"
      >
        <defs>
          <marker
            id="arrowDip"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowDipHi"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="30" y="26" font-size="12.5" font-weight="600">通常の依存</text>
        <rect x="60" y="40" width="200" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="62" text-anchor="middle" font-size="12">注文サービス</text>
        <text x="160" y="79" text-anchor="middle" font-size="10.5" class="muted">上位(業務ルール)</text>

        <line x1="266" y1="64" x2="332" y2="64" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowDip)" />
        <text x="299" y="54" text-anchor="middle" font-size="10.5" class="muted">依存</text>

        <rect x="340" y="40" width="230" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="455" y="62" text-anchor="middle" font-size="12">MySQL用の保存処理</text>
        <text x="455" y="79" text-anchor="middle" font-size="10.5" class="muted">下位(具体的な技術)</text>

        <text x="350" y="115" text-anchor="middle" font-size="11" class="muted">
          上位が具体実装を直接知っているので、DBを替えると上位のコードも変わる
        </text>

        <line x1="30" y1="140" x2="670" y2="140" stroke="var(--border)" stroke-width="1.2" />

        <text x="30" y="172" font-size="12.5" font-weight="600">DIP適用後</text>
        <rect x="60" y="186" width="200" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="208" text-anchor="middle" font-size="12">注文サービス</text>
        <text x="160" y="225" text-anchor="middle" font-size="10.5" class="muted">上位(業務ルール)</text>

        <line x1="266" y1="210" x2="332" y2="210" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowDip)" />
        <text x="299" y="200" text-anchor="middle" font-size="10.5" class="muted">依存</text>

        <rect x="340" y="186" width="230" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="455" y="208" text-anchor="middle" font-size="12" font-weight="600">«インターフェース» 注文リポジトリ</text>
        <text x="455" y="225" text-anchor="middle" font-size="10.5" class="muted">抽象(保存できる、とだけ約束する)</text>

        <line x1="400" y1="290" x2="420" y2="242" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowDipHi)" />
        <line x1="560" y1="290" x2="500" y2="242" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowDipHi)" />

        <rect x="330" y="292" width="150" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="405" y="319" text-anchor="middle" font-size="11.5">MySQL実装</text>

        <rect x="496" y="292" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="586" y="319" text-anchor="middle" font-size="11.5">インメモリ実装(テスト用)</text>

        <text x="180" y="290" text-anchor="middle" font-size="11" class="muted">実装側が抽象に合わせる</text>
        <text x="180" y="310" text-anchor="middle" font-size="11" class="muted">= 依存の矢印が逆転する</text>

        <text x="350" y="360" text-anchor="middle" font-size="11" class="muted">
          上位は「誰が保存するか」を知らないまま、実装だけを差し替えられる
        </text>
      </svg>
    </div>
  </body>
</html>
