<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 700 300" role="img" aria-label="Chain of ResponsibilityとObserverの対比図。上段のChain of Responsibilityでは、リクエストが認証ハンドラ・バリデーションハンドラ・本処理ハンドラの順に鎖状に渡され、処理できるハンドラが見つかった時点で止まる。下段のObserverでは、注文オブジェクトの状態が変わると、登録された在庫・通知・分析の3つの購読者へ同時に通知が飛ぶ。前者は1本の鎖を順に、後者は1対多で同時に、という違いがある。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="30" y="26" font-size="12.5" font-weight="600">Chain of Responsibility ― 順に渡す</text>

        <rect x="30" y="42" width="100" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="80" y="68" text-anchor="middle" font-size="10">リクエスト</text>
        <line x1="134" y1="63" x2="156" y2="63" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="160" y="42" width="130" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="225" y="68" text-anchor="middle" font-size="10">認証ハンドラ</text>
        <line x1="294" y1="63" x2="316" y2="63" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="320" y="42" width="150" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="395" y="68" text-anchor="middle" font-size="10">入力チェック</text>
        <line x1="474" y1="63" x2="496" y2="63" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="500" y="42" width="150" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="575" y="68" text-anchor="middle" font-size="10" font-weight="600">本処理</text>

        <text x="340" y="110" text-anchor="middle" font-size="10.5" class="muted">処理できるハンドラが見つかった時点で止まる。順序が意味を持つ</text>

        <line x1="30" y1="134" x2="670" y2="134" stroke="var(--border)" stroke-width="1.2" />

        <text x="30" y="166" font-size="12.5" font-weight="600">Observer ― 同時に知らせる</text>

        <rect x="255" y="182" width="190" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="350" y="202" text-anchor="middle" font-size="11" font-weight="600">注文オブジェクト</text>
        <text x="350" y="218" text-anchor="middle" font-size="9" class="muted">状態が変わった</text>

        <line x1="290" y1="226" x2="150" y2="256" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="350" y1="226" x2="350" y2="256" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="410" y1="226" x2="550" y2="256" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="80" y="260" width="140" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="150" y="282" text-anchor="middle" font-size="10">在庫の購読者</text>
        <rect x="280" y="260" width="140" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="350" y="282" text-anchor="middle" font-size="10">通知の購読者</text>
        <rect x="480" y="260" width="140" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="550" y="282" text-anchor="middle" font-size="10">分析の購読者</text>

        <text x="660" y="202" text-anchor="end" font-size="10.5" class="muted">誰が聞いているかは知らない</text>
      </svg>
    </div>
  </body>
</html>
