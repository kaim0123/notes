<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="レビューと自動テストが届く範囲の違いを、開発の成果物の並びに重ねて示した図。中央に5つの成果物が横に並ぶ。要件定義書、設計書、ソースコード、テストケース、手順書とマニュアル。このうち動かして確かめられるのはソースコードとテストケースだけで、残る3つは動かせない。上には帯が渡してあり、レビューは人が読んで欠陥を見つける手段なので5つすべてに届く。下の帯は自動テストで、ソースコードの1つにしか届かない。テストケースについては、動かすことはできても観点が正しいかどうかは動かしても分からないため、自動テストの範囲には入らない。自動チェックが1つも届かない4つの成果物は、レビューでしか品質を担保できない、と図の下部に記されている。"
      >
        <text x="20" y="26" font-size="11" class="muted">開発が生む成果物のうち、動かして確かめられるのはごく一部</text>

        <rect x="20" y="38" width="600" height="30" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="58" font-size="10.5" text-anchor="middle" class="accent">レビュー ― 人が読んで欠陥を見つける(5つすべてに届く)</text>

        <rect x="20" y="94" width="112" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="76" y="118" font-size="10" text-anchor="middle">要件定義書</text>
        <text x="76" y="136" font-size="9" text-anchor="middle" class="muted">動かせない</text>

        <rect x="142" y="94" width="112" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="198" y="118" font-size="10" text-anchor="middle">設計書</text>
        <text x="198" y="136" font-size="9" text-anchor="middle" class="muted">動かせない</text>

        <rect x="264" y="94" width="112" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="320" y="118" font-size="10" text-anchor="middle">ソースコード</text>
        <text x="320" y="136" font-size="9" text-anchor="middle" class="muted">動かせる</text>

        <rect x="386" y="94" width="112" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="442" y="118" font-size="10" text-anchor="middle">テストケース</text>
        <text x="442" y="136" font-size="9" text-anchor="middle" class="muted">観点は動かせない</text>

        <rect x="508" y="94" width="112" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="564" y="118" font-size="10" text-anchor="middle">手順書</text>
        <text x="564" y="136" font-size="9" text-anchor="middle" class="muted">動かせない</text>

        <line x1="20" y1="68" x2="20" y2="94" stroke="var(--primary)" stroke-width="1" />
        <line x1="620" y1="68" x2="620" y2="94" stroke="var(--primary)" stroke-width="1" />

        <rect x="264" y="176" width="112" height="30" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="196" font-size="10" text-anchor="middle" class="muted">自動テスト</text>
        <line x1="320" y1="148" x2="320" y2="176" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="238" font-size="10.5" class="accent">自動チェックが1つも届かない4つ。ここはレビューでしか品質を担保できない。</text>

        <line x1="20" y1="258" x2="620" y2="258" stroke="var(--border)" stroke-width="1" />
        <text x="20" y="278" font-size="10.5" class="muted">テストケースは動かせるが、それは「書いたとおりに走るか」まで。観点が正しいかは動かしても分からない。</text>
        <text x="20" y="300" font-size="10.5" class="muted">だからテストケース自体もレビュー対象になる。自動テストとレビューは、代わりになる関係ではない。</text>
      </svg>
    </div>
  </body>
</html>
