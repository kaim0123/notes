<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="リスクの大きさが、資産の価値と脅威と脆弱性の掛け算で決まることを示した図。上段に3つの箱が並ぶ。左は資産の価値で、顧客データや信用がこれにあたり、持たない・分けることで小さくできる。中央は脅威で、攻撃者・災害・操作ミスがこれにあたり、こちらの都合では減らせない。右は脆弱性で、未更新のソフトや設定ミス、弱い鍵がこれにあたり、対策が効くのはここである。3つの箱は下でひとつにまとめられ、下向きの矢印がリスク、すなわち想定される損失につながっている。脅威そのものは減らせないので、動かせるのは脆弱性と資産の持ち方の側だけになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="320" y="30" font-size="11" text-anchor="middle" class="muted">リスクは、3つのうちどれか1つが0なら0になる</text>

        <rect x="40" y="56" width="150" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="115" y="84" font-size="12" text-anchor="middle">資産の価値</text>
        <text x="115" y="105" font-size="9.5" text-anchor="middle" class="muted">顧客データ・信用</text>
        <text x="115" y="124" font-size="9.5" text-anchor="middle" class="muted">持たない・分ければ下がる</text>

        <text x="207" y="102" font-size="18" text-anchor="middle" class="muted">×</text>

        <rect x="225" y="56" width="150" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="300" y="84" font-size="12" text-anchor="middle">脅威</text>
        <text x="300" y="105" font-size="9.5" text-anchor="middle" class="muted">攻撃者・災害・操作ミス</text>
        <text x="300" y="124" font-size="9.5" text-anchor="middle" class="muted">こちらの都合では減らない</text>

        <text x="392" y="102" font-size="18" text-anchor="middle" class="muted">×</text>

        <rect x="410" y="56" width="150" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="485" y="84" font-size="12" text-anchor="middle">脆弱性</text>
        <text x="485" y="105" font-size="9.5" text-anchor="middle" class="muted">未更新・設定ミス・弱い鍵</text>
        <text x="485" y="124" font-size="9.5" text-anchor="middle" class="accent">対策が効くのはここ</text>

        <line x1="115" y1="132" x2="115" y2="152" stroke="var(--border)" stroke-width="1.2" />
        <line x1="300" y1="132" x2="300" y2="152" stroke="var(--border)" stroke-width="1.2" />
        <line x1="485" y1="132" x2="485" y2="152" stroke="var(--border)" stroke-width="1.2" />
        <line x1="115" y1="152" x2="485" y2="152" stroke="var(--border)" stroke-width="1.2" />
        <line x1="300" y1="152" x2="300" y2="174" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="230" y="178" width="140" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="300" y="200" font-size="13" text-anchor="middle" class="accent">リスク</text>
        <text x="300" y="217" font-size="9.5" text-anchor="middle" class="muted">想定される損失</text>

        <line x1="16" y1="250" x2="624" y2="250" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="272" font-size="10.5" class="muted">脅威そのものは減らせない。攻撃者にやめてくれとは言えず、地震も止められない。</text>
        <text x="16" y="294" font-size="10.5" class="accent">動かせるのは脆弱性と、資産の持ち方。どちらかを小さくすれば、掛け算の答えも小さくなる。</text>
      </svg>
    </div>
  </body>
</html>
