<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="権限に関わる観点を総当たりにすると件数が掛け算で増えること、そしてそれをどう書くかで保守のしやすさが変わることを示した図。左には3つの軸が縦に並ぶ。ロールがメンバー・マネージャー・管理者・オーナーの4つ、可視性が全員・管理者以上・所有者のみの3つ、操作が閲覧・移動・変更の3つで、掛け合わせると36件になる。右は書き方の比較である。上は36個のテストを手で並べる書き方で、ロールが1つ増えるたびに9件を手で書き足すことになり、書き漏らしても誰も気づかない。下は軸そのものを配列として定義し、ループでテストを生成する書き方で、ロールが1つ増えても直すのは配列の1行だけで済む。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">軸が増えるたび、件数は足し算ではなく掛け算で増える</text>

        <rect x="16" y="36" width="252" height="50" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="56" font-size="9.5">ロール</text>
        <text x="30" y="75" font-size="8.5" class="muted">メンバー / マネージャー / 管理者 / オーナー</text>
        <text x="142" y="100" font-size="10" text-anchor="middle" class="muted">×</text>

        <rect x="16" y="108" width="252" height="50" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="128" font-size="9.5">可視性</text>
        <text x="30" y="147" font-size="8.5" class="muted">全員 / 管理者以上 / 所有者のみ</text>
        <text x="142" y="172" font-size="10" text-anchor="middle" class="muted">×</text>

        <rect x="16" y="180" width="252" height="50" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="200" font-size="9.5">操作</text>
        <text x="30" y="219" font-size="8.5" class="muted">閲覧 / 移動 / 変更</text>

        <line x1="16" y1="248" x2="268" y2="248" stroke="var(--border)" stroke-width="1" />
        <text x="142" y="270" font-size="12" text-anchor="middle" class="accent">= 36件</text>

        <rect x="300" y="36" width="384" height="86" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="314" y="58" font-size="10" class="muted">36個のテストを手で並べる</text>
        <text x="314" y="82" font-size="9" class="muted">ロールが1つ増えるたび、9件を手で書き足す。</text>
        <text x="314" y="102" font-size="9" class="muted">書き漏らしても、誰も気づかない。</text>

        <rect x="300" y="140" width="384" height="130" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="314" y="162" font-size="10" class="accent">軸そのものを配列にして、生成する</text>
        <text x="314" y="186" font-size="8.5" class="mono muted">for (const role of ROLES)</text>
        <text x="314" y="204" font-size="8.5" class="mono muted">  for (const vis of VISIBILITIES)</text>
        <text x="314" y="222" font-size="8.5" class="mono muted">    test(`${role} は ${vis} を閲覧できる`, ...)</text>
        <text x="314" y="248" font-size="9" class="muted">ロールが1つ増えても、直すのは配列の1行だけ。</text>

        <line x1="16" y1="288" x2="684" y2="288" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="308" font-size="10.5" class="muted">軸が1つ増えたときに直す場所が、36か所か、1か所か。総当たりで効いてくる差はここにある。</text>
      </svg>
    </div>
  </body>
</html>
