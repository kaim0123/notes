<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="フロントエンドの速さを測る2つの方法を並べた比較図。リアルユーザー監視は実際の利用者のブラウザから計測値を送ってもらう方式で、本物の端末や回線、地域のばらつきがそのまま反映される代わりに、値の揺れが自分たちの変更によるものか環境によるものか判別しにくい。合成監視は決まった環境から定期的にアクセスして測る方式で、条件が一定なので基準線が安定し、変更による悪化を検知しやすいが、実際の利用者の多様な環境は再現できない。前者は現実に何が起きているか、後者は同じ条件でどう変わったかを答えるので、両方を並べて使う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="40" width="350" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="195" y="66" font-size="12" text-anchor="middle">実ユーザー計測(RUM)</text>
        <text x="195" y="86" font-size="9.5" text-anchor="middle" class="muted">利用者のブラウザから計測値を送ってもらう</text>
        <rect x="40" y="100" width="150" height="44" rx="6" fill="none" stroke="var(--border)" />
        <text x="115" y="120" font-size="9.5" text-anchor="middle" class="muted">古い端末・電波の悪い回線</text>
        <text x="115" y="136" font-size="9.5" text-anchor="middle" class="muted">遠い地域</text>
        <rect x="200" y="100" width="150" height="44" rx="6" fill="none" stroke="var(--border)" />
        <text x="275" y="120" font-size="9.5" text-anchor="middle" class="muted">新しい端末・光回線</text>
        <text x="275" y="136" font-size="9.5" text-anchor="middle" class="muted">近い地域</text>
        <text x="195" y="170" font-size="10" text-anchor="middle" class="accent">現実に何が起きているかが分かる</text>
        <text x="195" y="192" font-size="9.5" text-anchor="middle" class="muted">値が揺れたとき、自分たちの変更のせいか</text>
        <text x="195" y="208" font-size="9.5" text-anchor="middle" class="muted">環境のせいか判別しにくい</text>

        <rect x="390" y="40" width="350" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="565" y="66" font-size="12" text-anchor="middle">合成監視(シンセティック)</text>
        <text x="565" y="86" font-size="9.5" text-anchor="middle" class="muted">決まった環境から定期的にアクセスして測る</text>
        <rect x="410" y="100" width="310" height="44" rx="6" fill="none" stroke="var(--border)" />
        <text x="565" y="120" font-size="9.5" text-anchor="middle" class="muted">同じ端末・同じ回線・同じ時刻</text>
        <text x="565" y="136" font-size="9.5" text-anchor="middle" class="muted">利用者が1人もいなくても測れる</text>
        <text x="565" y="170" font-size="10" text-anchor="middle" class="accent">同じ条件でどう変わったかが分かる</text>
        <text x="565" y="192" font-size="9.5" text-anchor="middle" class="muted">実際の利用者の多様な環境は</text>
        <text x="565" y="208" font-size="9.5" text-anchor="middle" class="muted">再現できない</text>

        <text x="20" y="252" font-size="10.5" class="muted">答える問いが違うので、どちらかを選ぶものではない ― 悪化の検知は合成監視、実態の把握はRUM。</text>
        <text x="20" y="270" font-size="10.5" class="muted">公開前に測れるのは合成監視だけ、という違いも大きい。</text>
      </svg>
    </div>
  </body>
</html>
