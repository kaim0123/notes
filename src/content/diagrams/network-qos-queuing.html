<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 440"
        role="img"
        aria-label="QoSのキューイングの図解。音声・動画・データのトラフィックが分類・マーキングされ、優先度の異なる3つのキューに振り分けられる。スケジューラは帯域が足りないとき、優先度の高いキューから先に送出することで、音声や動画の遅延を避ける。"
      >
        <defs>
          <marker
            id="arrowQ"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="60" y="20" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="45" text-anchor="middle" font-size="12">音声</text>
        <rect x="280" y="20" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="45" text-anchor="middle" font-size="12">動画</text>
        <rect x="500" y="20" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="570" y="45" text-anchor="middle" font-size="12">データ</text>

        <rect x="270" y="95" width="160" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="350" y="120" text-anchor="middle" font-size="12.5" font-weight="600" style="fill: var(--primary)">分類・マーキング</text>
        <text x="350" y="137" text-anchor="middle" font-size="9.5" class="muted">(QoS)</text>

        <line x1="130" y1="60" x2="300" y2="95" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <line x1="350" y1="60" x2="350" y2="95" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <line x1="570" y1="60" x2="400" y2="95" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />

        <rect x="70" y="190" width="150" height="50" rx="7" fill="var(--primary)" />
        <text x="145" y="212" text-anchor="middle" font-size="11.5" font-weight="700" style="fill: var(--primary-fg)">優先度: 高</text>
        <text x="145" y="228" text-anchor="middle" font-size="9.5" style="fill: var(--primary-fg)">(音声キュー)</text>

        <rect x="275" y="190" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="212" text-anchor="middle" font-size="11.5" font-weight="600">優先度: 中</text>
        <text x="350" y="228" text-anchor="middle" font-size="9.5" class="muted">(動画キュー)</text>

        <rect x="480" y="190" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="555" y="212" text-anchor="middle" font-size="11.5" font-weight="600">優先度: 低</text>
        <text x="555" y="228" text-anchor="middle" font-size="9.5" class="muted">(データキュー)</text>

        <line x1="300" y1="145" x2="180" y2="190" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <line x1="350" y1="145" x2="350" y2="190" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <line x1="400" y1="145" x2="530" y2="190" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />

        <rect x="270" y="285" width="160" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="350" y="313" text-anchor="middle" font-size="12" font-weight="600" style="fill: var(--primary)">スケジューラ</text>

        <line x1="145" y1="240" x2="300" y2="285" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowQ)" />
        <text x="200" y="270" text-anchor="middle" font-size="10" style="fill: var(--primary)">①最優先</text>
        <line x1="350" y1="240" x2="350" y2="285" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <text x="380" y="270" text-anchor="middle" font-size="10" class="muted">②次に処理</text>
        <line x1="555" y1="240" x2="400" y2="285" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrowQ)" />
        <text x="500" y="270" text-anchor="middle" font-size="10" class="muted">③空いていれば</text>

        <line x1="350" y1="335" x2="350" y2="375" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowQ)" />
        <text x="350" y="400" text-anchor="middle" font-size="12" font-weight="600">回線(帯域制限あり)</text>

        <text x="350" y="425" text-anchor="middle" font-size="11" class="muted">
          帯域が足りないときほど、優先度の高いキューから先に送出される
        </text>
      </svg>
    </div>
  </body>
</html>
