<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="障害が起きた瞬間を挟んで、目標復旧時点と目標復旧時間が何を指すかを示した図。障害の左側にあるのは最後に取得できたバックアップで、そこから障害までの間に生まれたデータは失われる。この失ってよい幅が目標復旧時点であり、バックアップの間隔がそのまま上限になる。障害の右側は復旧作業の時間で、サービスが戻るまでの許容時間が目標復旧時間である。前者を縮めるには取得の頻度を上げ、後者を縮めるには復元の手順を速くするか、待機系へ切り替えられるようにする。どちらも費用と引き換えなので、業務がどこまで耐えられるかから決める。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <line x1="40" y1="150" x2="660" y2="150" stroke="var(--border)" />
        <line x1="350" y1="70" x2="350" y2="200" stroke="var(--primary)" />
        <text x="350" y="60" font-size="11.5" text-anchor="middle" class="accent">障害発生</text>

        <line x1="180" y1="140" x2="180" y2="160" stroke="var(--fg)" />
        <text x="180" y="132" font-size="10.5" text-anchor="middle">最後のバックアップ</text>

        <line x1="540" y1="140" x2="540" y2="160" stroke="var(--fg)" />
        <text x="540" y="132" font-size="10.5" text-anchor="middle">サービス復旧</text>

        <line x1="180" y1="188" x2="350" y2="188" stroke="var(--primary)" />
        <line x1="180" y1="182" x2="180" y2="194" stroke="var(--primary)" />
        <line x1="350" y1="182" x2="350" y2="194" stroke="var(--primary)" />
        <text x="265" y="210" font-size="11" text-anchor="middle" class="accent">RPO ― 失ってよいデータの幅</text>
        <text x="265" y="230" font-size="9.5" text-anchor="middle" class="muted">バックアップの間隔が、そのまま上限になる</text>

        <line x1="350" y1="98" x2="540" y2="98" stroke="var(--primary)" />
        <line x1="350" y1="92" x2="350" y2="104" stroke="var(--primary)" />
        <line x1="540" y1="92" x2="540" y2="104" stroke="var(--primary)" />
        <text x="445" y="86" font-size="11" text-anchor="middle" class="accent">RTO ― 戻るまでの許容時間</text>

        <text x="40" y="252" font-size="10.5" class="muted">RPOを縮める = 取得の頻度を上げる。RTOを縮める = 復元を速くする、または待機系へ切り替える。</text>
        <text x="40" y="272" font-size="10.5" class="muted">どちらも費用と引き換えなので、業務がどこまで耐えられるかから決める。</text>
      </svg>
    </div>
  </body>
</html>
