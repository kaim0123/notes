<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 260"
        role="img"
        aria-label="名前解決の設定を2種類のゾーンに分けて持つことを示した図。公開ゾーンはインターネットの誰からでも引ける定義で、サービスの入口を指し示す。限定公開ゾーンは自分のネットワークの内側からしか引けない定義で、内部のサーバーやデータベースに社内向けの名前を与える。両者で同じドメイン名を使い、外からは公開用の宛先、内からは内部の宛先を返す形にすることもできる。内部の構成を外へ晒さないためには、内側の名前を公開ゾーンに書かないことが基本になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="320" height="140" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="180" y="76" font-size="11.5" text-anchor="middle">公開ゾーン</text>
        <text x="180" y="100" font-size="9.5" text-anchor="middle" class="muted">インターネットの誰からでも引ける</text>
        <rect x="40" y="116" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="136" font-size="9.5" text-anchor="middle" class="mono muted">www → 公開の入口</text>
        <text x="180" y="172" font-size="10" text-anchor="middle" class="accent">外から見える定義だけを書く</text>

        <rect x="360" y="50" width="320" height="140" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="76" font-size="11.5" text-anchor="middle">限定公開ゾーン</text>
        <text x="520" y="100" font-size="9.5" text-anchor="middle" class="muted">自分のネットワークの内側だけ</text>
        <rect x="380" y="116" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="136" font-size="9.5" text-anchor="middle" class="mono muted">db → 内部のアドレス</text>
        <text x="520" y="172" font-size="10" text-anchor="middle" class="accent">内部の名前は、外に出さない</text>

        <text x="20" y="222" font-size="10.5" class="muted">同じドメイン名で、外からは公開の宛先、内からは内部の宛先を返す形にもできる。</text>
        <text x="20" y="244" font-size="10.5" class="muted">内部の構成を外へ晒さないために、内側の名前を公開ゾーンへ書かない ― 単純だが効く。</text>
      </svg>
    </div>
  </body>
</html>
