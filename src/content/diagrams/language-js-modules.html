<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="モジュールのexportとimportの関係を示した図。左のmath.tsファイルでは、add関数とmultiply関数の前にexportを付けて公開している。それぞれの関数には引数と戻り値の型が付いている。右のmain.tsファイルでは、importで必要な関数だけを名前で取り込み、普通に呼び出している。中央の矢印には、値としての関数と、その関数に付いた型情報の両方が一緒に運ばれることが示されている。取り込む側のコードはJavaScriptでもTypeScriptでも一字一句同じで、TypeScriptが加えているのは公開元の関数に付いた型情報だけ。そのおかげで、間違った型を渡すと呼び出し側で実行前にエラーになる。"
      >
        <defs>
          <marker id="armo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="40" width="230" height="140" rx="9" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="131" y="64" text-anchor="middle" font-size="12" font-family="monospace">math.ts</text>
        <line x1="34" y1="74" x2="228" y2="74" stroke="var(--border)" stroke-width="1" />
        <text x="34" y="98" font-size="10.5" font-family="monospace" class="lbl">export function add(</text>
        <text x="46" y="114" font-size="10.5" font-family="monospace" class="muted">a: number, b: number</text>
        <text x="34" y="130" font-size="10.5" font-family="monospace" class="lbl">): number</text>
        <text x="34" y="156" font-size="10.5" font-family="monospace" class="lbl">export function multiply(...)</text>
        <text x="131" y="196" text-anchor="middle" font-size="10.5" class="muted">公開する側</text>

        <line x1="246" y1="100" x2="386" y2="100" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#armo)" />
        <text x="316" y="92" text-anchor="middle" font-size="10.5" class="muted">関数(値)</text>
        <line x1="246" y1="136" x2="386" y2="136" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#armo)" />
        <text x="316" y="128" text-anchor="middle" font-size="10.5" class="lbl">型情報も一緒に運ばれる</text>

        <rect x="392" y="40" width="232" height="140" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="508" y="64" text-anchor="middle" font-size="12" font-family="monospace">main.ts</text>
        <line x1="410" y1="74" x2="606" y2="74" stroke="var(--border)" stroke-width="1" />
        <text x="410" y="98" font-size="10.5" font-family="monospace" class="muted">import { add } from</text>
        <text x="422" y="114" font-size="10.5" font-family="monospace" class="muted">&quot;./math.js&quot;;</text>
        <text x="410" y="140" font-size="10.5" font-family="monospace" class="muted">add(2, 3);      // 5</text>
        <text x="410" y="158" font-size="10.5" font-family="monospace" class="lbl">add(2, &quot;3&quot;);    // 実行前にエラー</text>
        <text x="508" y="196" text-anchor="middle" font-size="10.5" class="muted">取り込む側</text>

        <line x1="16" y1="222" x2="624" y2="222" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="244" font-size="11" class="muted">取り込む側のコードは JavaScript でも TypeScript でも一字一句同じ</text>
        <text x="16" y="262" font-size="11" class="lbl">TypeScript が加えているのは、公開元の関数に付いた型情報だけ</text>
      </svg>
    </div>
  </body>
</html>
