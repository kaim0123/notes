<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --warn: oklch(0.82 0.16 75);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .warn { fill: var(--warn); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 260" role="img" aria-label="サーキットブレーカーの3つの状態と遷移を示した図。左は閉じた状態で、通常どおり呼び出しながら失敗の割合を数え続ける。失敗の割合が閾値を超えると、中央の開いた状態へ移る。開いた状態では相手を呼びに行かず、即座に失敗を返す。一定時間が経つと、右の半分開いた状態へ移り、試験的に少数だけを通してみる。そこで成功すれば閉じた状態へ戻り、失敗すればふたたび開いた状態へ戻る。図の下部には、この仕組みの効き目が2方向であることが記されている。ひとつは自分の資源を守ること、つまり返ってこない相手を待つ時間を消費しないこと。もうひとつは相手に回復の余地を与えることで、復旧しかけたサーバーに全員が殺到すればまた落ちるだけだからである。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="150" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="44" y="88" font-size="12.5" class="lbl">閉 ― Closed</text>
        <text x="36" y="110" font-size="9.5" class="muted">通常どおり呼び、失敗率を数える</text>

        <line x1="170" y1="82" x2="240" y2="82" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="164" y="52" font-size="9.5" class="muted">失敗の割合が閾値を超えた</text>

        <rect x="244" y="60" width="150" height="66" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="1.8" />
        <text x="272" y="88" font-size="12.5" class="warn">開 ― Open</text>
        <text x="256" y="110" font-size="9.5" class="muted">呼びに行かず、即座に失敗を返す</text>

        <line x1="394" y1="82" x2="464" y2="82" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="398" y="52" font-size="9.5" class="muted">一定時間が経った</text>

        <rect x="468" y="60" width="152" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="490" y="88" font-size="12.5">半開 ― Half-Open</text>
        <text x="496" y="110" font-size="9.5" class="muted">少数だけ試しに通す</text>

        <path d="M544,126 C 540,178 120,178 95,132" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="252" y="176" font-size="10" class="lbl">成功したら、閉じた状態へ戻る</text>

        <path d="M500,126 C 480,152 400,152 340,130" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="396" y="150" font-size="9.5" class="muted">失敗したら、また開く</text>

        <line x1="16" y1="200" x2="624" y2="200" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="224" font-size="10.5" class="muted">効き目は2方向 ―</text>
        <text x="110" y="224" font-size="10.5" class="lbl">自分の資源を守る(返ってこない相手を待つ時間を使わない)。</text>
        <text x="110" y="246" font-size="10.5" class="lbl">そして、相手に回復の余地を与える(復旧しかけた所へ全員が殺到すれば、また落ちる)。</text>
      </svg>
    </div>
  </body>
</html>
