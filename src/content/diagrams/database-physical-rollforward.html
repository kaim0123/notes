<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
        --destructive: oklch(0.6 0.24 27);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 220"
        role="img"
        aria-label="リカバリのタイムライン図。日曜2時に完全バックアップを取得し、水曜14時32分に障害が発生する。完全バックアップをリストアした後、その間のトランザクションログを再生(ロールフォワード)することで、障害直前の状態まで復旧する。"
      >
        <defs>
          <marker id="arrowMuted2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <line x1="60" y1="110" x2="640" y2="110" stroke="var(--border)" stroke-width="2" />

        <circle cx="120" cy="110" r="7" fill="var(--primary)" />
        <text x="120" y="80" text-anchor="middle" font-size="12.5" font-weight="600">① 完全バックアップ</text>
        <text x="120" y="98" text-anchor="middle" font-size="11" class="muted">(日曜 2:00)</text>

        <rect x="170" y="100" width="360" height="20" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <path d="M175,110 L520,110" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowMuted2)" />
        <text x="350" y="146" text-anchor="middle" font-size="12" style="fill: var(--primary)">
          ② トランザクションログを再生(ロールフォワード)
        </text>
        <text x="350" y="164" text-anchor="middle" font-size="11" class="muted">障害の直前まで、確定した更新を1つずつ反映し直す</text>

        <circle cx="580" cy="110" r="7" fill="var(--destructive)" />
        <text x="580" y="80" text-anchor="middle" font-size="12.5" font-weight="600">③ 障害発生</text>
        <text x="580" y="98" text-anchor="middle" font-size="11" class="muted">(水曜 14:32)</text>

        <text x="350" y="200" text-anchor="middle" font-size="11" class="muted">
          リストア(①を戻す)+ ロールフォワード(②を再生)=リカバリ
        </text>
      </svg>
    </div>
  </body>
</html>
