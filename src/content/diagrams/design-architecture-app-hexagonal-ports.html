<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="Hexagonal Architectureのポートとアダプタの図。中央の六角形がドメインで、その辺に保存するポート・通知するポートといったインターフェースが刻まれている。左側には画面やAPIといった駆動側のアダプタが、右側にはPostgreSQL用アダプタ・メール送信アダプタ・テスト用のインメモリアダプタが並び、いずれもポートに差し込まれる形でつながる。ポートの形さえ守れば、アダプタは自由に差し替えられる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">ドメインが「窓口の形」を決め、外側がそれに合わせる</text>

        <polygon points="330,52 430,110 430,220 330,278 230,220 230,110" fill="var(--card)" stroke="var(--primary)" stroke-width="1.9" />
        <text x="330" y="158" text-anchor="middle" font-size="13" font-weight="600">ドメイン</text>
        <text x="330" y="180" text-anchor="middle" font-size="9.5" class="muted">業務ルールだけ</text>

        <rect x="196" y="126" width="68" height="24" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="230" y="143" text-anchor="middle" font-size="9">入力ポート</text>
        <rect x="396" y="126" width="68" height="24" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="430" y="143" text-anchor="middle" font-size="9">保存ポート</text>
        <rect x="396" y="186" width="68" height="24" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="430" y="203" text-anchor="middle" font-size="9">通知ポート</text>

        <rect x="40" y="94" width="130" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="105" y="119" text-anchor="middle" font-size="10">画面アダプタ</text>
        <rect x="40" y="146" width="130" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="105" y="171" text-anchor="middle" font-size="10">APIアダプタ</text>
        <line x1="174" y1="114" x2="192" y2="132" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="174" y1="166" x2="192" y2="144" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="490" y="94" width="140" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="560" y="119" text-anchor="middle" font-size="10">PostgreSQLアダプタ</text>
        <rect x="490" y="146" width="140" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="560" y="171" text-anchor="middle" font-size="10">インメモリ(テスト用)</text>
        <rect x="490" y="198" width="140" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="560" y="223" text-anchor="middle" font-size="10">メール送信アダプタ</text>
        <line x1="486" y1="114" x2="468" y2="132" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="486" y1="166" x2="468" y2="144" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="486" y1="218" x2="468" y2="204" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <text x="330" y="296" text-anchor="middle" font-size="11" class="muted">
          DBを差し替えてもアダプタを1つ書くだけ。ドメインのコードには手を入れない
        </text>
      </svg>
    </div>
  </body>
</html>
