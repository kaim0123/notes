<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 340"
        role="img"
        aria-label="認証の3要素と多要素認証の関係を示した図。上段に3つの箱が並ぶ。左は知識で、パスワードやPINがこれにあたり、盗み見や使い回しで破られる。中央は所持で、スマートフォンやICカードがこれにあたり、紛失や盗難で破られる。右は生体で、指紋や顔がこれにあたり、いったん漏れても取り替えられないという弱点を持つ。3つは下でまとめられ、種類の違う2つ以上を組み合わせたものが多要素認証になる。片方が破れても、もう片方が残ることが要点である。パスワードと秘密の質問はどちらも知識にあたるため、2つ重ねても要素は1つのままで、多要素にはならない。"
      >
        <defs>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="40" y="64" width="170" height="106" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="235" y="64" width="170" height="106" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="430" y="64" width="170" height="106" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />

        <text x="125" y="96" font-size="13" text-anchor="middle">知識</text>
        <text x="125" y="122" font-size="10" text-anchor="middle" class="muted">パスワード・PIN</text>
        <text x="125" y="148" font-size="9.5" text-anchor="middle" class="muted">盗み見・使い回しに弱い</text>

        <text x="320" y="96" font-size="13" text-anchor="middle">所持</text>
        <text x="320" y="122" font-size="10" text-anchor="middle" class="muted">スマホ・ICカード</text>
        <text x="320" y="148" font-size="9.5" text-anchor="middle" class="muted">紛失・盗難に弱い</text>

        <text x="515" y="96" font-size="13" text-anchor="middle">生体</text>
        <text x="515" y="122" font-size="10" text-anchor="middle" class="muted">指紋・顔</text>
        <text x="515" y="148" font-size="9.5" text-anchor="middle" class="muted">漏れても取り替えられない</text>

        <line x1="125" y1="170" x2="125" y2="188" stroke="var(--border)" stroke-width="1.2" />
        <line x1="320" y1="170" x2="320" y2="188" stroke="var(--border)" stroke-width="1.2" />
        <line x1="515" y1="170" x2="515" y2="188" stroke="var(--border)" stroke-width="1.2" />
        <line x1="125" y1="188" x2="515" y2="188" stroke="var(--border)" stroke-width="1.2" />
        <line x1="320" y1="188" x2="320" y2="204" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="150" y="208" width="340" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="230" font-size="12" text-anchor="middle" class="accent">種類の違うものを2つ以上 = 多要素認証</text>
        <text x="320" y="248" font-size="9.5" text-anchor="middle" class="muted">片方が破られても、もう片方が残る</text>

        <text x="320" y="276" font-size="9.5" text-anchor="middle" class="muted">パスワード+秘密の質問は、どちらも「知識」なので要素は1つのまま。</text>

        <line x1="16" y1="292" x2="624" y2="292" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="314" font-size="10.5" class="muted">3要素は「強さ」の順位ではなく、破られ方の種類。同じ種類を重ねても、同じ破られ方でまとめて抜かれる。</text>
        <text x="16" y="334" font-size="10.5" class="accent">だから多要素の条件は「2つ」ではなく「別の種類を2つ」。</text>
      </svg>
    </div>
  </body>
</html>
