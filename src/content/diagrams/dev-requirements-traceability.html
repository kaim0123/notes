<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 260"
        role="img"
        aria-label="双方向トレーサビリティを示した図。上段には要件、設計、実装、テストの4つが左から右へ並び、前向きの矢印でつながっている。ある要件がどこで設計され、どこで実装され、どのテストで検証されたかを前向きにたどれる。下段には逆向きの矢印があり、あるテストやプログラムが、どの要件のために存在するのかを後ろ向きにたどれることを示す。この両方向がつながっていると、要件が変わったときの影響範囲を漏れなく把握でき、どの要件にも紐づかない機能(過剰)と、要件はあるのに実装されていない機能(漏れ)の両方を発見できる。片方向しかたどれない状態では、変更のたびに影響調査が手探りになる。"
      >
        <defs>
          <marker id="artr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
          <marker id="artr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="66" width="132" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="82" y="97" text-anchor="middle" font-size="12">要件</text>
        <rect x="176" y="66" width="132" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="242" y="97" text-anchor="middle" font-size="12" class="muted">設計</text>
        <rect x="336" y="66" width="132" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="402" y="97" text-anchor="middle" font-size="12" class="muted">実装</text>
        <rect x="496" y="66" width="128" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="560" y="97" text-anchor="middle" font-size="12">テスト</text>

        <line x1="148" y1="84" x2="170" y2="84" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#artr)" />
        <line x1="308" y1="84" x2="330" y2="84" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#artr)" />
        <line x1="468" y1="84" x2="490" y2="84" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#artr)" />
        <text x="320" y="46" text-anchor="middle" font-size="11" class="lbl">前向き ― この要件はどこで実現され、どこで検証されたか</text>

        <line x1="490" y1="106" x2="468" y2="106" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#artr2)" />
        <line x1="330" y1="106" x2="308" y2="106" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#artr2)" />
        <line x1="170" y1="106" x2="148" y2="106" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#artr2)" />
        <text x="320" y="140" text-anchor="middle" font-size="11" class="muted">後ろ向き ― このテストやコードは、どの要件のために存在するのか</text>

        <line x1="16" y1="164" x2="624" y2="164" stroke="var(--border)" stroke-width="1" />

        <rect x="16" y="180" width="288" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="202" text-anchor="middle" font-size="11.5" class="muted">前向きが切れている</text>
        <text x="160" y="222" text-anchor="middle" font-size="11" class="muted">要件はあるが実装されていない = 漏れ</text>

        <rect x="336" y="180" width="288" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="202" text-anchor="middle" font-size="11.5" class="muted">後ろ向きが切れている</text>
        <text x="480" y="222" text-anchor="middle" font-size="11" class="muted">どの要件にも紐づかない機能 = 過剰</text>

        <text x="16" y="256" font-size="11" class="lbl">両方向つながっていると、要件が変わったときの影響範囲を漏れなく把握できる</text>
      </svg>
    </div>
  </body>
</html>
