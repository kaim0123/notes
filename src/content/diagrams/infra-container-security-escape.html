<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="コンテナからホストへ抜け出す攻撃が成立する条件と、その断ち方を示した図。左から順に、脆弱なイメージが持ち込まれ、コンテナ内をroot権限で動かしており、特権付き実行やホストのディレクトリのマウントで境界が緩んでおり、共有しているカーネルに穴がある、という条件が重なるとホストへ到達する。ホストを取れば同じホスト上の他のコンテナもすべて手中に入る。逆に言えば、この4つのどれか1つを断てば連鎖は止まるため、イメージの検査、一般ユーザーでの実行、特権とマウントの禁止、ホストの更新を、どれも重ねて行うことになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="60" width="140" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="86" y="86" font-size="10.5" text-anchor="middle">脆弱なイメージ</text>
        <text x="86" y="104" font-size="9" text-anchor="middle" class="muted">古いライブラリの穴から</text>
        <text x="86" y="119" font-size="9" text-anchor="middle" class="muted">コンテナ内へ侵入される</text>

        <rect x="180" y="60" width="140" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="250" y="86" font-size="10.5" text-anchor="middle">中でrootだった</text>
        <text x="250" y="104" font-size="9" text-anchor="middle" class="muted">攻撃者もrootとして</text>
        <text x="250" y="119" font-size="9" text-anchor="middle" class="muted">何でも実行できる</text>

        <rect x="344" y="60" width="140" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="414" y="86" font-size="10.5" text-anchor="middle">境界が緩い</text>
        <text x="414" y="104" font-size="9" text-anchor="middle" class="muted">特権付き実行や</text>
        <text x="414" y="119" font-size="9" text-anchor="middle" class="muted">ホストのマウント</text>

        <rect x="508" y="60" width="140" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="578" y="86" font-size="10.5" text-anchor="middle" class="accent">カーネルの穴</text>
        <text x="578" y="104" font-size="9" text-anchor="middle" class="muted">共有しているので</text>
        <text x="578" y="119" font-size="9" text-anchor="middle" class="muted">突かれると外へ出る</text>

        <line x1="158" y1="95" x2="176" y2="95" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="322" y1="95" x2="340" y2="95" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="486" y1="95" x2="504" y2="95" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="578" y1="134" x2="578" y2="164" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="330" y="168" width="330" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="495" y="190" font-size="11.5" text-anchor="middle">ホストに到達</text>
        <text x="495" y="208" font-size="9.5" text-anchor="middle" class="muted">同じホスト上の他のコンテナも、まとめて手中に入る</text>

        <text x="16" y="188" font-size="11" class="accent">断てるのは4か所</text>
        <text x="16" y="210" font-size="10" class="muted">検査して入れない</text>
        <text x="16" y="228" font-size="10" class="muted">一般ユーザーで動かす</text>
        <text x="16" y="246" font-size="10" class="muted">特権とマウントを禁じる</text>
        <text x="16" y="264" font-size="10" class="muted">ホストを更新し続ける</text>

        <text x="330" y="248" font-size="10.5" class="muted">条件が重なったときだけ成立する ― どれか1つ断てば、その連鎖は止まる。</text>
        <text x="330" y="270" font-size="10.5" class="muted">だから「1つやったから大丈夫」ではなく、全部を薄く重ねる。</text>
      </svg>
    </div>
  </body>
</html>
