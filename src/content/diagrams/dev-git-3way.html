<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="3-wayマージの判定を示した図。上部には共通の祖先であるベースが1つあり、そこから左右に自分側と相手側の2つの状態が分かれている。Gitはこの3つを比べる。ケース1は片方だけが変えている場合で、ベースと自分側が同じなら相手側の変更を、逆なら自分側の変更をそのまま採用でき、自動でマージが成立する。ケース2は両方が同じ箇所を違うように変えている場合で、どちらが正しいかはGitには判断できないため、コンフリクトとして人間に報告される。つまりコンフリクトは事故ではなく、同じ場所を2人が違うように変えたという事実の報告にすぎない。図の下には、Gitが検知できない意味的な衝突についての注記があり、行が離れていれば自動マージが成功してしまうため、片方が関数名を変え、もう片方がその関数を新しい場所から呼ぶような場合は、コンフリクトなしにビルドや動作が壊れることが示されている。"
      >
        <defs>
          <marker id="ar3w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="252" y="34" width="136" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="52" text-anchor="middle" font-size="11.5">共通の祖先</text>
        <text x="320" y="68" text-anchor="middle" font-size="10" class="muted">元はこうだった</text>

        <line x1="270" y1="76" x2="180" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar3w)" />
        <line x1="370" y1="76" x2="460" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar3w)" />

        <rect x="96" y="110" width="150" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="171" y="128" text-anchor="middle" font-size="11.5" class="muted">自分側</text>
        <text x="171" y="144" text-anchor="middle" font-size="10" class="muted">取り込む先の状態</text>

        <rect x="394" y="110" width="150" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="469" y="128" text-anchor="middle" font-size="11.5" class="muted">相手側</text>
        <text x="469" y="144" text-anchor="middle" font-size="10" class="muted">取り込む元の状態</text>

        <text x="320" y="136" text-anchor="middle" font-size="11" class="lbl">この3つを比べる</text>

        <line x1="16" y1="172" x2="624" y2="172" stroke="var(--border)" stroke-width="1" />

        <rect x="16" y="186" width="288" height="66" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="160" y="208" text-anchor="middle" font-size="11.5">片方だけが変えている</text>
        <text x="160" y="228" text-anchor="middle" font-size="10.5" class="muted">その変更をそのまま採用できる</text>
        <text x="160" y="244" text-anchor="middle" font-size="10.5" class="lbl">自動でマージが成立する</text>

        <rect x="336" y="186" width="288" height="66" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="480" y="208" text-anchor="middle" font-size="11.5" class="muted">両方が同じ箇所を違うように変えた</text>
        <text x="480" y="228" text-anchor="middle" font-size="10.5" class="muted">どちらが正しいかは判断できない</text>
        <text x="480" y="244" text-anchor="middle" font-size="10.5" class="lbl">コンフリクトとして人間に報告する</text>

        <text x="16" y="278" font-size="11" class="muted">行が離れていれば自動マージは成功してしまう ― 関数名の変更と新しい呼び出しのような意味的な衝突は検知されない</text>
      </svg>
    </div>
  </body>
</html>
