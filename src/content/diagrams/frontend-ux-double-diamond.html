<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 260" role="img" aria-label="ダブルダイヤモンドを2つの菱形で示した図。左の菱形は問題の領域で、前半の発見の段では利用者や制約を広く調べて候補を広げ、後半の定義の段で本当に解くべき課題を1つに絞る。2つの菱形が接するくびれの部分が、解くべき課題が1つに定まる地点。右の菱形は解決の領域で、前半の開発の段で解決案を複数考えて試作で形にし、後半の提供の段で利用者に試してもらい最良案を選ぶ。広げてから絞るというリズムを2回繰り返すことが図の要点で、最初の菱形を省くと正しく作られた間違ったものができる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <path d="M30 130 L170 46 L310 130 L170 214 Z" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <path d="M330 130 L470 46 L610 130 L470 214 Z" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="170" y1="46" x2="170" y2="214" stroke="var(--border)" stroke-width="1.1" stroke-dasharray="4 3" />
        <line x1="470" y1="46" x2="470" y2="214" stroke="var(--border)" stroke-width="1.1" stroke-dasharray="4 3" />

        <text x="170" y="30" text-anchor="middle" font-size="12">問題</text>
        <text x="470" y="30" text-anchor="middle" font-size="12">解決</text>

        <text x="98" y="128" text-anchor="middle" font-size="11.5" class="lbl">発見</text>
        <text x="98" y="148" text-anchor="middle" font-size="10" class="muted">広く調べる</text>
        <text x="242" y="128" text-anchor="middle" font-size="11.5" class="lbl">定義</text>
        <text x="242" y="148" text-anchor="middle" font-size="10" class="muted">1つに絞る</text>
        <text x="398" y="128" text-anchor="middle" font-size="11.5" class="lbl">開発</text>
        <text x="398" y="148" text-anchor="middle" font-size="10" class="muted">案を出す</text>
        <text x="542" y="128" text-anchor="middle" font-size="11.5" class="lbl">提供</text>
        <text x="542" y="148" text-anchor="middle" font-size="10" class="muted">選んで出す</text>

        <text x="320" y="186" text-anchor="middle" font-size="10" class="muted">解くべき課題が</text>
        <text x="320" y="202" text-anchor="middle" font-size="10" class="muted">1つに定まる</text>
        <line x1="310" y1="130" x2="330" y2="130" stroke="var(--primary)" stroke-width="1.6" />

        <text x="320" y="242" text-anchor="middle" font-size="10.5" class="lbl">広げてから絞る、を2回 ― 左の菱形を省くと「正しく作られた間違ったもの」ができる</text>
      </svg>
    </div>
  </body>
</html>
