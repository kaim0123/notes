<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="純粋関数として切り出せるかどうかの判断と、切り出す前後でテストのしやすさがどう変わるかを示した図。上部に2つの判定条件が並ぶ。1つ目は同じ入力なら常に同じ出力になるかで、現在時刻や乱数や外部APIの応答に依存していないこと。2つ目は関数の外の世界に触れていないかで、DOMの書き換えやデータベースへの書き込みやグローバル変数の読み書きをしていないこと。下部は切り出す前と後の比較で、切り出す前はロジックと副作用が同じ関数の中に混ざっているため、テストするには周辺をすべて用意する必要がある。切り出した後はロジックが引数と戻り値だけの関数になり、呼んで結果を比べるだけでテストできる。副作用の側は残るが、確かめる相手が減る。"
      >
        <text x="16" y="28" font-size="11" class="muted">100回呼んだら100回とも同じ結果か。呼ぶ前後で何も変わっていないか</text>

        <rect x="16" y="42" width="300" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="64" font-size="10.5">条件1 ― 同じ入力なら、常に同じ出力</text>
        <text x="30" y="84" font-size="9" class="muted">現在時刻・乱数・外部APIの応答に依存していない</text>

        <rect x="324" y="42" width="300" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="338" y="64" font-size="10.5">条件2 ― 外の世界に触れていない</text>
        <text x="338" y="84" font-size="9" class="muted">DOM・DB・ファイル・グローバル変数を書き換えない</text>

        <text x="16" y="128" font-size="10.5" class="muted">切り出す前</text>
        <rect x="16" y="138" width="300" height="76" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="160" font-size="10" class="muted">1つの関数の中に</text>
        <text x="30" y="180" font-size="10" class="muted">計算ロジック と 画面の書き換え・保存</text>
        <text x="30" y="200" font-size="9" class="muted">テストには周辺を丸ごと用意する必要がある</text>

        <text x="324" y="128" font-size="10.5" class="accent">切り出した後</text>
        <rect x="324" y="138" width="300" height="34" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="338" y="160" font-size="10" class="accent">計算ロジック ― 引数と戻り値だけ</text>
        <rect x="324" y="180" width="300" height="34" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="338" y="202" font-size="10" class="muted">画面の書き換え・保存 ― 副作用は残る</text>

        <line x1="16" y1="236" x2="624" y2="236" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="256" font-size="10.5" class="muted">切り出した側は、呼んで結果を比べるだけでテストできる。準備も後片付けも要らない。</text>
        <text x="16" y="276" font-size="10.5" class="muted">副作用の側は消えないが、確かめる相手が減り、外側の段階に任せる範囲がはっきりする。</text>
        <text x="16" y="296" font-size="10.5" class="accent">テストしやすさは、テストの書き方ではなく、この分け方で決まる。</text>
      </svg>
    </div>
  </body>
</html>
