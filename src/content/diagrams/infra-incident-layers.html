<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="障害を切り分けるときに下から順に確認する5つの階層と、各階層で使う道具を示した図。いちばん下の物理では配線や電源、クラウドなら事業者の障害情報を確認する。次のネットワークではpingで到達するかを見て、届かなければ経路をたどる。DNSでは名前が正しいアドレスに解決されるかを確かめ、サーバーでは目的のポートに接続できるか、資源が枯渇していないかを見る。最後にアプリケーションのログや健全性を確認する。下の層が壊れると上の層はすべて症状として現れるため、上から調べ始めると見当違いの調査になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="60" y="36" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="56" font-size="11.5">5. アプリケーション</text>
        <text x="80" y="74" font-size="9.5" class="muted">ログ・ヘルスチェック・トレース ― メトリクスの出番はここから</text>

        <rect x="60" y="92" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="112" font-size="11.5">4. サーバー</text>
        <text x="80" y="130" font-size="9.5" class="muted">目的のポートに接続できるか / CPU・メモリ・ディスクは枯渇していないか</text>

        <rect x="60" y="148" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="168" font-size="11.5">3. DNS</text>
        <text x="80" y="186" font-size="9.5" class="muted">名前が引けるか / 返ってくるアドレスは意図したものか</text>

        <rect x="60" y="204" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="224" font-size="11.5">2. ネットワーク</text>
        <text x="80" y="242" font-size="9.5" class="muted">相手まで到達するか / どこで途切れているか(経路をたどる)</text>

        <rect x="60" y="260" width="520" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="80" y="280" font-size="11.5">1. 物理</text>
        <text x="80" y="298" font-size="9.5" class="muted">配線・電源・機器の故障 / クラウドなら事業者の障害情報</text>

        <line x1="614" y1="296" x2="614" y2="50" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="646" y="170" font-size="11" text-anchor="middle" class="accent" transform="rotate(-90 646 170)">確認する順番</text>

        <text x="24" y="170" font-size="10" text-anchor="middle" class="muted" transform="rotate(-90 24 170)">下が壊れると、上は全部おかしくなる</text>
      </svg>
    </div>
  </body>
</html>
