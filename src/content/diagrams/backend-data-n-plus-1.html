<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 340" role="img" aria-label="N+1問題とその解消を、時間軸に沿ったクエリの並びで比べた図。上段はN+1が起きている状態で、まず一覧を取る1本のクエリがあり、そのあとに各行の関連データを取るクエリが階段状に何本も続く。1本ずつは短いが、本数が件数に比例して増えるため、全体としては長く伸びる。その下には接続の占有を示す帯があり、この長い時間ずっと1本の接続を握り続けることが示されている。下段はまとめて取った場合で、一覧を取る1本のあと、IDを集めて一度に取る2本目だけが続く。合計2本で終わり、占有の帯もごく短い。図の右側には、開発中は件数が10件しかないので誰も気づかず、本番の負荷で初めて表面化する、という注意が添えられている。">
        <text x="16" y="24" font-size="11.5" class="muted">一覧100件と、それぞれの関連データを取る</text>

        <text x="16" y="52" font-size="11" class="muted">N+1 のまま</text>
        <rect x="16" y="62" width="52" height="14" rx="3" fill="var(--primary)" opacity="0.8" />
        <text x="74" y="73" font-size="9" class="muted">一覧を取る</text>

        <g fill="var(--muted)" opacity="0.55">
          <rect x="72" y="80" width="16" height="10" rx="2" />
          <rect x="92" y="92" width="16" height="10" rx="2" />
          <rect x="112" y="104" width="16" height="10" rx="2" />
          <rect x="132" y="116" width="16" height="10" rx="2" />
          <rect x="152" y="128" width="16" height="10" rx="2" />
          <rect x="172" y="140" width="16" height="10" rx="2" />
          <rect x="192" y="152" width="16" height="10" rx="2" />
        </g>
        <text x="216" y="122" font-size="10" class="muted">… 件数と同じ回数だけ続く</text>
        <text x="216" y="140" font-size="10" class="muted">1本ずつは1ミリ秒でも、100本で100ミリ秒</text>

        <line x1="16" y1="176" x2="440" y2="176" stroke="var(--muted)" stroke-width="5" />
        <text x="16" y="196" font-size="10" class="muted">この間ずっと、1本の接続を握り続ける ― 枯渇はここから始まる</text>

        <line x1="16" y1="214" x2="624" y2="214" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="242" font-size="11" class="lbl">まとめて取る</text>
        <rect x="16" y="252" width="52" height="14" rx="3" fill="var(--primary)" opacity="0.8" />
        <text x="74" y="263" font-size="9" class="muted">一覧を取る</text>
        <rect x="72" y="270" width="52" height="14" rx="3" fill="var(--primary)" opacity="0.8" />
        <text x="130" y="281" font-size="9" class="lbl">IDを集めて、一度に取る</text>

        <line x1="16" y1="298" x2="124" y2="298" stroke="var(--primary)" stroke-width="5" />
        <text x="16" y="318" font-size="10" class="lbl">合計2本。占有もここまで。</text>

        <text x="330" y="252" font-size="10.5" class="muted">開発中は一覧が10件しかないので、</text>
        <text x="330" y="270" font-size="10.5" class="muted">誰も気づかない。</text>
        <text x="330" y="296" font-size="10.5" class="muted">本番の件数と同時アクセスで、</text>
        <text x="330" y="314" font-size="10.5" class="muted">はじめて表面化する。</text>
      </svg>
    </div>
  </body>
</html>
