<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 280" role="img" aria-label="エンティティと値オブジェクトの同一性の違いを示した図。左のエンティティでは、名前が変わった2つの顧客オブジェクトがIDで比較され、IDが同じなので同一と判定される。右の値オブジェクトでは、別インスタンスとして作られた2つのメールアドレスが値で比較され、値が同じなので同一と判定される。エンティティは属性が変わっても同じもの、値オブジェクトは値が同じなら同じものになる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">エンティティ ― IDで同一性が決まる</text>

        <rect x="35" y="52" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="95" y="74" text-anchor="middle" font-size="10" class="mono hi">id: "c-1"</text>
        <text x="95" y="94" text-anchor="middle" font-size="10" class="mono muted">name: "田中"</text>
        <text x="95" y="112" text-anchor="middle" font-size="9" class="muted">登録時</text>

        <rect x="175" y="52" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="235" y="74" text-anchor="middle" font-size="10" class="mono hi">id: "c-1"</text>
        <text x="235" y="94" text-anchor="middle" font-size="10" class="mono muted">name: "田中太郎"</text>
        <text x="235" y="112" text-anchor="middle" font-size="9" class="muted">改名後</text>

        <line x1="95" y1="140" x2="95" y2="122" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="235" y1="140" x2="235" y2="122" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="95" y1="140" x2="235" y2="140" stroke="var(--primary)" stroke-width="1.3" />
        <text x="165" y="162" text-anchor="middle" font-size="11" class="hi">IDが同じ → 同じ顧客</text>
        <text x="165" y="192" text-anchor="middle" font-size="10.5" class="muted">属性は変わってよい</text>

        <line x1="330" y1="30" x2="330" y2="250" stroke="var(--border)" stroke-width="1.2" />

        <text x="495" y="26" text-anchor="middle" font-size="12.5" font-weight="600">値オブジェクト ― 値で同一性が決まる</text>

        <rect x="365" y="52" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="425" y="80" text-anchor="middle" font-size="9.5" class="mono hi">a@example.com</text>
        <text x="425" y="104" text-anchor="middle" font-size="9" class="muted">インスタンスA</text>

        <rect x="505" y="52" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="565" y="80" text-anchor="middle" font-size="9.5" class="mono hi">a@example.com</text>
        <text x="565" y="104" text-anchor="middle" font-size="9" class="muted">インスタンスB</text>

        <line x1="425" y1="140" x2="425" y2="122" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="565" y1="140" x2="565" y2="122" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="425" y1="140" x2="565" y2="140" stroke="var(--primary)" stroke-width="1.3" />
        <text x="495" y="162" text-anchor="middle" font-size="11" class="hi">値が同じ → 同じメールアドレス</text>
        <text x="495" y="192" text-anchor="middle" font-size="10.5" class="muted">作った後は変更できない(不変)</text>

        <text x="330" y="264" text-anchor="middle" font-size="11" class="muted">
          「何をもって同じとみなすか」が、そのままクラスの性質を決める
        </text>
      </svg>
    </div>
  </body>
</html>
