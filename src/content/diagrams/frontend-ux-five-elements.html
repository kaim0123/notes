<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="UXの5要素を下から上へ積み上げた台形の図。いちばん下の最も幅の広い層が戦略で、誰のために何を達成させるかを決める。その上が範囲で、何を作り何を作らないかを決める。その上が構造で、情報と操作の流れを決める。その上が骨格で、画面の配置とナビゲーションを決める。いちばん上の最も幅の狭い層が表面で、色や文字などの見た目を決める。左側の矢印は下ほど変更コストが高いことを、右側の矢印は上ほど利用者に直接見えることを示している。実装者が触れるのは主に骨格と表面だが、構造が決まっていなければ上を整えても使いにくいままである。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="210" y="30" width="220" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="56" text-anchor="middle" font-size="11.5">⑤ 表面 ― 色・文字・ビジュアル</text>

        <rect x="176" y="82" width="288" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="108" text-anchor="middle" font-size="11.5">④ 骨格 ― 画面の配置とナビゲーション</text>

        <rect x="142" y="134" width="356" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="160" text-anchor="middle" font-size="11.5">③ 構造 ― 情報と操作の流れ・画面遷移</text>

        <rect x="108" y="186" width="424" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="212" text-anchor="middle" font-size="11.5">② 範囲 ― 何を作り、何を作らないか</text>

        <rect x="74" y="238" width="492" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="264" text-anchor="middle" font-size="11.5">① 戦略 ― 誰のために、何を達成させるか</text>

        <line x1="52" y1="46" x2="52" y2="266" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="16" y="150" font-size="10" class="muted">変更</text>
        <text x="16" y="166" font-size="10" class="muted">コスト大</text>

        <line x1="588" y1="266" x2="588" y2="46" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="600" y="150" font-size="10" class="lbl">利用者に</text>
        <text x="600" y="166" font-size="10" class="lbl">直接見える</text>

        <text x="320" y="16" text-anchor="middle" font-size="10.5" class="muted">実装者が触れるのは主に④と⑤ ― ③が決まっていないと、整えても使いにくいまま</text>
      </svg>
    </div>
  </body>
</html>
