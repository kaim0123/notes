<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="同じ入力文字列でも、出力先によって必要なエスケープが変わることを示した図。中央に1つの値があり、そこから4つの出力先へ分かれる。HTML本文へ出すならHTMLエスケープで山括弧やアンパサンドを実体参照に置き換える。HTML属性の値へ出すならクォート文字も含めて属性用のエスケープをかける。JavaScriptの文字列リテラルの中へ埋め込むならJavaScript用のエスケープ、URLのクエリ部分に載せるならURLエンコードが要る。出力先ごとに危険な記号が違うため、保存時に一律で変換しておくやり方では対応しきれず、出力する直前に、その行き先に合わせて変換する必要がある。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="20" y="130" width="160" height="56" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="100" y="154" font-size="10.5" text-anchor="middle" class="accent">保存されている値</text>
        <text x="100" y="174" font-size="9.5" text-anchor="middle" class="mono">"&gt;&lt;script&gt;</text>

        <rect x="300" y="52" width="180" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="300" y="112" width="180" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="300" y="172" width="180" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="300" y="232" width="180" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="390" y="74" font-size="10" text-anchor="middle">HTML本文の中</text>
        <text x="390" y="134" font-size="10" text-anchor="middle">HTML属性の値の中</text>
        <text x="390" y="194" font-size="10" text-anchor="middle">JavaScriptの文字列</text>
        <text x="390" y="254" font-size="10" text-anchor="middle">URLのクエリ</text>

        <line x1="184" y1="150" x2="296" y2="72" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="184" y1="155" x2="296" y2="127" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="184" y1="161" x2="296" y2="186" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="184" y1="166" x2="296" y2="243" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />

        <line x1="484" y1="69" x2="516" y2="69" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="484" y1="129" x2="516" y2="129" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="484" y1="189" x2="516" y2="189" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="484" y1="249" x2="516" y2="249" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />

        <text x="524" y="66" font-size="10" class="muted">HTMLエスケープ</text>
        <text x="524" y="82" font-size="9" class="mono muted">&lt; &gt; &amp;</text>
        <text x="524" y="126" font-size="10" class="muted">属性用エスケープ</text>
        <text x="524" y="142" font-size="9" class="mono muted">" ' も対象</text>
        <text x="524" y="186" font-size="10" class="muted">JavaScriptエスケープ</text>
        <text x="524" y="202" font-size="9" class="mono muted">\ ' " 改行</text>
        <text x="524" y="246" font-size="10" class="muted">URLエンコード</text>
        <text x="524" y="262" font-size="9" class="mono muted">%XX 形式</text>

        <line x1="16" y1="284" x2="744" y2="284" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="306" font-size="10.5" class="accent">危険な記号は行き先ごとに違う。だから保存時に一律で変換しておく方式では、どこかで必ず合わなくなる。</text>
      </svg>
    </div>
  </body>
</html>
