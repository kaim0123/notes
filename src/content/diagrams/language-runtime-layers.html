<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="同じJavaScriptやTypeScriptのコードが、ランタイムによって違う顔を持つことを示した層構造の図。最上段に同じJS/TSのコードがあり、その下に4つのランタイムが並ぶ。ブラウザはV8などのエンジンにDOM操作・fetch・ストレージといったWeb APIを組み合わせたもので、ファイルの読み書きはできない。Node.jsはV8にファイルシステム・ネットワーク・プロセスの機能を組み合わせたもので、DOMは存在しない。DenoもV8を使うが、ファイルとネットワークへのアクセスを既定で拒否し、権限を明示的に許可する設計になっている。BunはJavaScriptCoreを使い、ランタイム・パッケージ管理・バンドラを1つにまとめている。共通しているのは、どのランタイムもJSエンジンと環境固有の機能の組み合わせでできているという点。"
      >
        <rect x="180" y="14" width="280" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="320" y="41" text-anchor="middle" font-size="13" font-weight="600">同じ JavaScript / TypeScript のコード</text>

        <line x1="240" y1="56" x2="86" y2="82" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="290" y1="56" x2="232" y2="82" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="350" y1="56" x2="408" y2="82" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="400" y1="56" x2="554" y2="82" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />

        <rect x="16" y="86" width="140" height="150" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="86" y="108" text-anchor="middle" font-size="12.5" font-weight="600">ブラウザ</text>
        <text x="86" y="126" text-anchor="middle" font-size="10.5" class="lbl">V8 / SpiderMonkey</text>
        <line x1="30" y1="136" x2="142" y2="136" stroke="var(--border)" stroke-width="1" />
        <text x="86" y="154" text-anchor="middle" font-size="10.5" class="muted">DOM操作</text>
        <text x="86" y="172" text-anchor="middle" font-size="10.5" class="muted">fetch / ストレージ</text>
        <text x="86" y="190" text-anchor="middle" font-size="10.5" class="muted">画面・入力イベント</text>
        <text x="86" y="216" text-anchor="middle" font-size="10.5" class="muted">ファイルは触れない</text>

        <rect x="162" y="86" width="140" height="150" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="232" y="108" text-anchor="middle" font-size="12.5" font-weight="600">Node.js(2009)</text>
        <text x="232" y="126" text-anchor="middle" font-size="10.5" class="lbl">V8</text>
        <line x1="176" y1="136" x2="288" y2="136" stroke="var(--border)" stroke-width="1" />
        <text x="232" y="154" text-anchor="middle" font-size="10.5" class="muted">ファイル読み書き</text>
        <text x="232" y="172" text-anchor="middle" font-size="10.5" class="muted">サーバー・ソケット</text>
        <text x="232" y="190" text-anchor="middle" font-size="10.5" class="muted">プロセス・環境変数</text>
        <text x="232" y="216" text-anchor="middle" font-size="10.5" class="muted">DOMは存在しない</text>

        <rect x="308" y="86" width="140" height="150" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="378" y="108" text-anchor="middle" font-size="12.5" font-weight="600">Deno(2018)</text>
        <text x="378" y="126" text-anchor="middle" font-size="10.5" class="lbl">V8</text>
        <line x1="322" y1="136" x2="434" y2="136" stroke="var(--border)" stroke-width="1" />
        <text x="378" y="154" text-anchor="middle" font-size="10.5" class="muted">既定でアクセス拒否</text>
        <text x="378" y="172" text-anchor="middle" font-size="10.5" class="muted">権限を明示的に許可</text>
        <text x="378" y="190" text-anchor="middle" font-size="10.5" class="muted">TSをそのまま実行</text>
        <text x="378" y="216" text-anchor="middle" font-size="10.5" class="muted">Node.jsの設計の見直し</text>

        <rect x="454" y="86" width="140" height="150" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="524" y="108" text-anchor="middle" font-size="12.5" font-weight="600">Bun(2023)</text>
        <text x="524" y="126" text-anchor="middle" font-size="10.5" class="lbl">JavaScriptCore</text>
        <line x1="468" y1="136" x2="580" y2="136" stroke="var(--border)" stroke-width="1" />
        <text x="524" y="154" text-anchor="middle" font-size="10.5" class="muted">パッケージ管理も内蔵</text>
        <text x="524" y="172" text-anchor="middle" font-size="10.5" class="muted">バンドラも内蔵</text>
        <text x="524" y="190" text-anchor="middle" font-size="10.5" class="muted">起動と実行の速さ</text>
        <text x="524" y="216" text-anchor="middle" font-size="10.5" class="muted">道具の一体化</text>

        <line x1="16" y1="256" x2="624" y2="256" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="276" font-size="11" class="muted">どのランタイムも「JSエンジン + その環境固有の機能」でできている</text>
        <text x="16" y="292" font-size="11" class="lbl">言語は1つ、実行環境は複数 ― 動かない原因は文法ではなく、その環境にAPIが無いことが多い</text>
      </svg>
    </div>
  </body>
</html>
