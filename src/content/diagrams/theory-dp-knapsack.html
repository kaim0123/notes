<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 340"
        role="img"
        aria-label="ナップサック問題のDP表。行が品物、列が容量0から5、各マスが最大価値。あるマスは真上のマスと、重さぶん左にずれた上の行のマスに価値を足した値の大きいほうで決まる"
      >
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="30" y="26" font-size="13" class="muted">品物: A(重さ1・価値2)、B(重さ2・価値4)、C(重さ3・価値5) ／ 容量 W = 5</text>

        <!-- 列見出し -->
        <text x="130" y="72" text-anchor="middle" font-size="12" class="muted">容量 →</text>
        <text x="230" y="72" text-anchor="middle" font-size="13" class="muted">0</text>
        <text x="300" y="72" text-anchor="middle" font-size="13" class="muted">1</text>
        <text x="370" y="72" text-anchor="middle" font-size="13" class="muted">2</text>
        <text x="440" y="72" text-anchor="middle" font-size="13" class="muted">3</text>
        <text x="510" y="72" text-anchor="middle" font-size="13" class="muted">4</text>
        <text x="580" y="72" text-anchor="middle" font-size="13" class="muted">5</text>

        <!-- 行見出し -->
        <text x="180" y="112" text-anchor="end" font-size="13" class="muted">なし</text>
        <text x="180" y="162" text-anchor="end" font-size="13" class="muted">A まで</text>
        <text x="180" y="212" text-anchor="end" font-size="13" class="muted">B まで</text>
        <text x="180" y="262" text-anchor="end" font-size="13" class="muted">C まで</text>

        <!-- 行0 -->
        <g font-size="15" class="mono">
          <rect x="200" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="230" y="110" text-anchor="middle">0</text>
          <rect x="270" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="300" y="110" text-anchor="middle">0</text>
          <rect x="340" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="370" y="110" text-anchor="middle">0</text>
          <rect x="410" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="440" y="110" text-anchor="middle">0</text>
          <rect x="480" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="510" y="110" text-anchor="middle">0</text>
          <rect x="550" y="86" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="580" y="110" text-anchor="middle">0</text>
        </g>

        <!-- 行A -->
        <g font-size="15" class="mono">
          <rect x="200" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="230" y="160" text-anchor="middle">0</text>
          <rect x="270" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="300" y="160" text-anchor="middle">2</text>
          <rect x="340" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="370" y="160" text-anchor="middle">2</text>
          <rect x="410" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="440" y="160" text-anchor="middle">2</text>
          <rect x="480" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="510" y="160" text-anchor="middle">2</text>
          <rect x="550" y="136" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="580" y="160" text-anchor="middle">2</text>
        </g>

        <!-- 行B -->
        <g font-size="15" class="mono">
          <rect x="200" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="230" y="210" text-anchor="middle">0</text>
          <rect x="270" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" /><text x="300" y="210" text-anchor="middle">2</text>
          <rect x="340" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="370" y="210" text-anchor="middle">4</text>
          <rect x="410" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" /><text x="440" y="210" text-anchor="middle">6</text>
          <rect x="480" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="510" y="210" text-anchor="middle">6</text>
          <rect x="550" y="186" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="580" y="210" text-anchor="middle">6</text>
        </g>

        <!-- 行C -->
        <g font-size="15" class="mono">
          <rect x="200" y="236" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="230" y="260" text-anchor="middle">0</text>
          <rect x="270" y="236" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="300" y="260" text-anchor="middle">2</text>
          <rect x="340" y="236" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="370" y="260" text-anchor="middle">4</text>
          <rect x="410" y="236" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="440" y="260" text-anchor="middle">6</text>
          <rect x="480" y="236" width="60" height="34" rx="5" fill="var(--card)" stroke="var(--border)" /><text x="510" y="260" text-anchor="middle">7</text>
          <rect x="550" y="236" width="60" height="34" rx="5" fill="var(--primary)" /><text x="580" y="260" text-anchor="middle" style="fill: var(--primary-fg)">9</text>
        </g>

        <!-- 依存の矢印(B行の容量3 = max(上, 容量1の上 + 4)) -->
        <line x1="440" y1="170" x2="440" y2="184" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#a)" />
        <path d="M300,170 C330,178 400,180 436,196" fill="none" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#a)" />

        <text x="640" y="290" font-size="12" class="accent">答え = 右下のマス</text>
        <text x="410" y="318" text-anchor="middle" font-size="12" class="muted">
          dp[i][w] = max( 入れない: dp[i−1][w] , 入れる: dp[i−1][w−重さ] + 価値 )
        </text>
      </svg>
    </div>
  </body>
</html>
