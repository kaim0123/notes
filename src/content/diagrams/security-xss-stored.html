<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="持続型XSSの流れを示した図。攻撃者がスクリプト入りのコメントを投稿すると、それがデータベースにそのまま保存される。以降、そのページを開いた閲覧者のブラウザでは、保存された文字列がページの一部として出力され、サイト自身のコードとして実行されてしまう。実行されたスクリプトはブラウザからCookieを読み取り、攻撃者のサーバーへ送る。1回の投稿が、そのページを見たすべての閲覧者に効き続ける点が反射型との違いで、罠のリンクを踏ませる必要すらない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="58" width="150" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="95" y="80" font-size="11" text-anchor="middle" class="accent">攻撃者</text>
        <text x="95" y="99" font-size="9" text-anchor="middle" class="muted">script入りの投稿</text>

        <rect x="300" y="58" width="150" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="375" y="80" font-size="11" text-anchor="middle">データベース</text>
        <text x="375" y="99" font-size="9" text-anchor="middle" class="muted">文字列のまま保存</text>

        <rect x="580" y="58" width="160" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="660" y="80" font-size="11" text-anchor="middle">閲覧者</text>
        <text x="660" y="99" font-size="9" text-anchor="middle" class="muted">ページを開いただけ</text>

        <line x1="174" y1="84" x2="296" y2="84" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="454" y1="84" x2="576" y2="84" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="235" y="76" font-size="9" text-anchor="middle" class="muted">① 投稿する</text>
        <text x="515" y="76" font-size="9" text-anchor="middle" class="muted">② 表示のたびに配られる</text>

        <line x1="660" y1="112" x2="660" y2="150" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <rect x="560" y="152" width="180" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="650" y="174" font-size="11" text-anchor="middle" class="accent">閲覧者のブラウザ</text>
        <text x="650" y="193" font-size="9" text-anchor="middle" class="muted">サイト自身のコードとして実行</text>

        <line x1="556" y1="178" x2="314" y2="178" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="435" y="170" font-size="9" text-anchor="middle" class="accent">③ document.cookie を読んで送信</text>

        <rect x="160" y="152" width="150" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="235" y="174" font-size="11" text-anchor="middle" class="accent">攻撃者のサーバー</text>
        <text x="235" y="193" font-size="9" text-anchor="middle" class="muted">セッションIDを受信</text>

        <text x="380" y="228" font-size="9.5" text-anchor="middle" class="muted">盗まれたセッションIDがあれば、パスワードを知らなくても本人として振る舞える</text>

        <line x1="16" y1="246" x2="744" y2="246" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="268" font-size="10.5" class="muted">反射型は、攻撃者が用意したリンクを踏ませて初めて成立する。持続型は保存されるので、踏ませる相手を選ばない。</text>
        <text x="16" y="290" font-size="10.5" class="accent">1回の投稿が、そのページを開いた全員に効き続ける ― だから持続型のほうが優先度が高い。</text>
      </svg>
    </div>
  </body>
</html>
