<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 260"
        role="img"
        aria-label="1桁以上の数字の並びを受理する有限オートマトンの状態遷移図。初期状態q0で数字を読むとq1へ遷移し、q1は受理状態。q1で数字を読む限りq1に留まり、数字以外を読むと非受理状態q2へ落ちる"
      >
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="30" y="30" font-size="13" class="muted">正規表現 [0-9]+ に対応する有限オートマトン</text>

        <!-- 開始の矢印 -->
        <text x="60" y="120" font-size="12" class="muted">開始</text>
        <line x1="60" y1="140" x2="118" y2="140" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#a)" />

        <!-- q0: 初期状態 -->
        <circle cx="165" cy="140" r="46" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="165" y="138" text-anchor="middle" font-size="20" font-weight="700" class="mono">q0</text>
        <text x="165" y="158" text-anchor="middle" font-size="11" class="muted">初期状態</text>

        <!-- q0 -> q1 -->
        <line x1="211" y1="140" x2="368" y2="140" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#a)" />
        <text x="290" y="128" text-anchor="middle" font-size="14" class="accent" font-weight="600">数字(0-9)</text>

        <!-- q1: 受理状態(二重丸) -->
        <circle cx="418" cy="140" r="52" fill="none" stroke="var(--primary)" stroke-width="1.5" />
        <circle cx="418" cy="140" r="46" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="418" y="138" text-anchor="middle" font-size="20" font-weight="700" class="mono accent">q1</text>
        <text x="418" y="158" text-anchor="middle" font-size="11" class="accent">受理状態</text>

        <!-- q1 の自己ループ -->
        <path d="M396,94 C388,44 448,44 440,94" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#a)" />
        <text x="418" y="42" text-anchor="middle" font-size="14" class="accent" font-weight="600">数字(0-9)</text>

        <!-- q1 -> q2 -->
        <line x1="470" y1="140" x2="622" y2="140" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#a)" />
        <text x="546" y="128" text-anchor="middle" font-size="14" class="muted">数字以外</text>

        <!-- q2: 非受理 -->
        <circle cx="672" cy="140" r="46" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="672" y="138" text-anchor="middle" font-size="20" font-weight="700" class="mono muted">q2</text>
        <text x="672" y="158" text-anchor="middle" font-size="11" class="muted">非受理</text>

        <text x="410" y="238" text-anchor="middle" font-size="12" class="muted">
          文字列を読み終えた時点で q1 にいれば一致、それ以外なら不一致
        </text>
      </svg>
    </div>
  </body>
</html>
