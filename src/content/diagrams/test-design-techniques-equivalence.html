<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 310"
        role="img"
        aria-label="同値分割法と境界値分析の違いを、1から100の整数を受け付けるという同じ仕様の上で比べた図。上段は同値分割法で、入力の範囲を0以下の無効、1から100の有効、101以上の無効という3つのグループに分け、それぞれから代表値を1件ずつ選ぶ。マイナス5、50、150の3件になる。下段は境界値分析で、同じ3つのグループの境目に注目し、0、1、100、101という4件を選ぶ。バグは範囲の真ん中ではなく境目で表面化しやすく、以下と未満の書き間違いのような誤りは端の値でしか現れない。2つの技法は競合せず、代表値で全体を押さえ、境目で誤りを狙うという役割分担で組み合わせて使う。"
      >
        <text x="16" y="26" font-size="11" class="muted">仕様「1〜100の整数を受け付ける」に対して、どの値をケースにするか</text>

        <text x="16" y="52" font-size="10.5" class="muted">同値分割法 ― 同じ結果になるグループから、代表を1件ずつ</text>
        <rect x="40" y="62" width="170" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="125" y="81" font-size="9.5" text-anchor="middle" class="muted">0以下(無効)</text>
        <rect x="210" y="62" width="220" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="320" y="81" font-size="9.5" text-anchor="middle" class="muted">1〜100(有効)</text>
        <rect x="430" y="62" width="170" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="515" y="81" font-size="9.5" text-anchor="middle" class="muted">101以上(無効)</text>

        <line x1="40" y1="106" x2="600" y2="106" stroke="var(--border)" stroke-width="1.2" />
        <circle cx="110" cy="106" r="4" fill="var(--muted)" />
        <circle cx="320" cy="106" r="4" fill="var(--muted)" />
        <circle cx="530" cy="106" r="4" fill="var(--muted)" />
        <text x="110" y="126" font-size="10" text-anchor="middle" class="muted">-5</text>
        <text x="320" y="126" font-size="10" text-anchor="middle" class="muted">50</text>
        <text x="530" y="126" font-size="10" text-anchor="middle" class="muted">150</text>
        <text x="16" y="146" font-size="9.5" class="muted">3件で、3つのグループすべての振る舞いを代表させる</text>

        <text x="16" y="182" font-size="10.5" class="accent">境界値分析 ― グループの境目、その内側と外側を狙う</text>
        <rect x="40" y="192" width="170" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="125" y="211" font-size="9.5" text-anchor="middle" class="muted">0以下(無効)</text>
        <rect x="210" y="192" width="220" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="320" y="211" font-size="9.5" text-anchor="middle" class="muted">1〜100(有効)</text>
        <rect x="430" y="192" width="170" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="515" y="211" font-size="9.5" text-anchor="middle" class="muted">101以上(無効)</text>

        <line x1="210" y1="188" x2="210" y2="240" stroke="var(--primary)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="430" y1="188" x2="430" y2="240" stroke="var(--primary)" stroke-width="1" stroke-dasharray="3 3" />

        <line x1="40" y1="236" x2="600" y2="236" stroke="var(--border)" stroke-width="1.2" />
        <circle cx="196" cy="236" r="4.5" fill="var(--primary)" />
        <circle cx="224" cy="236" r="4.5" fill="var(--primary)" />
        <circle cx="416" cy="236" r="4.5" fill="var(--primary)" />
        <circle cx="444" cy="236" r="4.5" fill="var(--primary)" />
        <text x="192" y="256" font-size="10" text-anchor="middle" class="accent">0</text>
        <text x="228" y="256" font-size="10" text-anchor="middle" class="accent">1</text>
        <text x="410" y="256" font-size="10" text-anchor="middle" class="accent">100</text>
        <text x="450" y="256" font-size="10" text-anchor="middle" class="accent">101</text>

        <line x1="16" y1="272" x2="624" y2="272" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="292" font-size="10.5" class="muted">バグは範囲の真ん中ではなく境目に出る。以下と未満の書き間違いは、端の値でしか表面化しない。</text>
        <text x="16" y="308" font-size="10.5" class="accent">2つは競合しない ― 代表値で全体を押さえ、境目で誤りを狙う。セットで使う。</text>
      </svg>
    </div>
  </body>
</html>
