<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="ドキュメントに何を書き、何を書かないかを分けた図。左は機械的に導ける情報で、APIの型・DBのスキーマ・依存パッケージ・設定値の一覧が並び、これらは生成するかコードを見ればよいので人間は書かないと示される。右は導けない情報で、なぜその方式を選んだか・外部との制約・過去に試して駄目だった案・運用上の暗黙の前提が並び、これだけを人間が書くとされる。腐るのは前者を手で書いたときである。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="340" y="26" text-anchor="middle" font-size="11.5" class="muted">判断基準は1つ ― 「コードから機械的に導けるか」</text>

        <text x="170" y="58" text-anchor="middle" font-size="12.5" font-weight="600">導ける ― 人が書かない</text>
        <rect x="30" y="72" width="280" height="150" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="52" y="100" font-size="10.5" class="muted">APIの型・シグネチャ</text>
        <text x="52" y="126" font-size="10.5" class="muted">DBのスキーマ</text>
        <text x="52" y="152" font-size="10.5" class="muted">依存パッケージの一覧</text>
        <text x="52" y="178" font-size="10.5" class="muted">設定値の一覧</text>
        <text x="52" y="204" font-size="10.5" class="muted">画面遷移(ルーティング定義)</text>
        <text x="170" y="250" text-anchor="middle" font-size="11" class="muted">生成するか、コードを見る。</text>
        <text x="170" y="268" text-anchor="middle" font-size="11" class="muted">手で書き写した瞬間から腐り始める</text>

        <line x1="345" y1="46" x2="345" y2="280" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="58" text-anchor="middle" font-size="12.5" font-weight="600">導けない ― 人が書く</text>
        <rect x="370" y="72" width="280" height="150" rx="9" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="392" y="100" font-size="10.5">なぜその方式を選んだか</text>
        <text x="392" y="126" font-size="10.5">外部システムとの制約</text>
        <text x="392" y="152" font-size="10.5">試して駄目だった案とその理由</text>
        <text x="392" y="178" font-size="10.5">運用上の暗黙の前提</text>
        <text x="392" y="204" font-size="10.5">最短で動かすまでの手順</text>
        <text x="510" y="250" text-anchor="middle" font-size="11" class="muted">コードのどこにも書かれていない。</text>
        <text x="510" y="268" text-anchor="middle" font-size="11" class="muted">失われたら二度と復元できない</text>
      </svg>
    </div>
  </body>
</html>
