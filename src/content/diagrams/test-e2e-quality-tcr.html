<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 260"
        role="img"
        aria-label="テストが通ったときだけコミットする運用の流れを示した図。まず変更を書き、テストを実行する。緑ならその変更はそのままコミットされる。赤なら自動的にrevertされ、書いた変更は手元から消えるので、もう一度書き直すところへ戻る。赤い状態がコミットに残らない代わりに、落ちた変更は保存されない。直したつもりが壊れていたという状態が、コミットの単位では存在できなくなる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">コミットの単位そのものを、テストの合否に縛りつける</text>

        <rect x="16" y="60" width="160" height="48" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="96" y="90" font-size="10" text-anchor="middle">変更を書く</text>

        <line x1="180" y1="84" x2="212" y2="84" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="216" y="60" width="160" height="48" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="296" y="90" font-size="10" text-anchor="middle">テストを実行する</text>

        <path d="M380,76 L410,56 L432,56" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="386" y="46" font-size="9" class="accent">通った</text>

        <path d="M380,94 L410,140 L432,140" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="386" y="128" font-size="9" class="muted">落ちた</text>

        <rect x="440" y="32" width="184" height="48" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="532" y="62" font-size="10" text-anchor="middle" class="accent">そのままコミットされる</text>

        <rect x="440" y="116" width="184" height="48" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="532" y="146" font-size="10" text-anchor="middle" class="muted">自動で revert される</text>

        <path d="M532,164 L532,196 L96,196 L96,112" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="200" y="190" font-size="9" class="muted">書いた変更は手元からも消える ― 書き直しからやり直す</text>

        <line x1="16" y1="218" x2="624" y2="218" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="238" font-size="10.5" class="muted">「直したつもりが壊れていた」という状態が、コミットの単位では存在できなくなる。</text>
      </svg>
    </div>
  </body>
</html>
