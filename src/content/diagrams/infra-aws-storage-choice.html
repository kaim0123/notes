<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="保存先を選ぶための判断の流れを示した図。最初の問いは、複数のサーバーから同時に読み書きする必要があるかどうかで、必要ならファイル共有型を選ぶ。必要ない場合は次に、ファイルの一部だけを頻繁に書き換えるかを問う。データベースの実体のように部分更新が続くならブロック型を、書いたら基本的に丸ごと読むだけならオブジェクト型を選ぶ。オブジェクト型はHTTPで直接配信でき、容量の上限を気にしなくてよいため、画像や動画、バックアップの置き場所になる。迷ったときは、アクセスの単位が何かに立ち返れば選べる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="230" y="30" width="240" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="50" font-size="10.5" text-anchor="middle">複数のサーバーから</text>
        <text x="350" y="66" font-size="10.5" text-anchor="middle">同時に読み書きするか</text>

        <line x1="230" y1="52" x2="150" y2="52" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="190" y="42" font-size="9.5" text-anchor="middle" class="muted">する</text>
        <rect x="20" y="30" width="126" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="83" y="50" font-size="10.5" text-anchor="middle">ファイル共有型</text>
        <text x="83" y="66" font-size="9" text-anchor="middle" class="muted">共有ディレクトリ</text>

        <line x1="350" y1="78" x2="350" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="378" y="98" font-size="9.5" class="muted">しない</text>

        <rect x="230" y="110" width="240" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="130" font-size="10.5" text-anchor="middle">一部だけを頻繁に</text>
        <text x="350" y="146" font-size="10.5" text-anchor="middle">書き換えるか</text>

        <line x1="470" y1="132" x2="550" y2="132" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="510" y="122" font-size="9.5" text-anchor="middle" class="muted">する</text>
        <rect x="554" y="110" width="126" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="617" y="130" font-size="10.5" text-anchor="middle">ブロック型</text>
        <text x="617" y="146" font-size="9" text-anchor="middle" class="muted">DBの実体・OS領域</text>

        <line x1="350" y1="158" x2="350" y2="186" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="378" y="178" font-size="9.5" class="muted">しない</text>

        <rect x="230" y="190" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="212" font-size="10.5" text-anchor="middle">オブジェクト型</text>
        <text x="350" y="230" font-size="9" text-anchor="middle" class="muted">画像・動画・バックアップ・ログ</text>
        <text x="350" y="244" font-size="9" text-anchor="middle" class="muted">HTTPで直接配信でき、容量の上限を気にしない</text>

        <text x="20" y="284" font-size="10.5" class="muted">迷ったら「アクセスの単位は何か」に戻る ― ファイルか、区画か、丸ごとか。</text>
      </svg>
    </div>
  </body>
</html>
