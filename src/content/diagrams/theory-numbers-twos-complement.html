<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 165"
        role="img"
        aria-label="4ビットで-3を表す2の補数を求める3ステップの図解。3を2進数の0011にし、ビットを反転して1100にし、1を足して1101(-3)にする"
      >
        <defs>
          <marker
            id="arrow2"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- 箱0: 10進数 -->
        <text x="90" y="32" text-anchor="middle" font-size="12" class="muted">10進数</text>
        <rect x="25" y="45" width="130" height="70" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="90" text-anchor="middle" font-size="30" font-weight="700" class="mono">3</text>

        <line x1="155" y1="80" x2="245" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow2)" />
        <text x="200" y="65" text-anchor="middle" font-size="12" class="muted">2進数にする</text>

        <!-- 箱1: 2進数 -->
        <text x="310" y="32" text-anchor="middle" font-size="12" class="muted">2進数(4ビット)</text>
        <rect x="245" y="45" width="130" height="70" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="310" y="90" text-anchor="middle" font-size="26" font-weight="700" class="mono">0011</text>

        <line x1="375" y1="80" x2="465" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow2)" />
        <text x="420" y="65" text-anchor="middle" font-size="12" class="muted">反転(0↔1)</text>

        <!-- 箱2: 反転後 -->
        <text x="530" y="32" text-anchor="middle" font-size="12" class="muted">反転後</text>
        <rect x="465" y="45" width="130" height="70" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="90" text-anchor="middle" font-size="26" font-weight="700" class="mono">1100</text>

        <line x1="595" y1="80" x2="685" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow2)" />
        <text x="640" y="65" text-anchor="middle" font-size="12" class="muted">+ 1</text>

        <!-- 箱3: 2の補数(強調) -->
        <text x="750" y="32" text-anchor="middle" font-size="12" class="muted">2の補数</text>
        <rect x="685" y="45" width="130" height="70" rx="10" fill="var(--primary)" />
        <text
          x="750"
          y="90"
          text-anchor="middle"
          font-size="26"
          font-weight="700"
          class="mono"
          style="fill: var(--primary-fg)"
        >
          1101
        </text>
        <text x="750" y="140" text-anchor="middle" font-size="14" font-weight="600" style="fill: var(--primary)">
          = −3(10進)
        </text>
      </svg>
    </div>
  </body>
</html>
