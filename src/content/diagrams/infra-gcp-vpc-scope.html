<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="AWSとGoogle CloudでVPCの適用範囲が違うことを示した比較図。AWSではVPCそのものが1つのリージョンの中に閉じているため、別のリージョンにもう1つVPCを作り、リージョン間をつなぐ設定を別途行うことになる。Google CloudではVPCがグローバルな1つのネットワークで、その中にリージョンごとのサブネットが並ぶため、リージョンをまたいだ通信が同じネットワークの内側の話として扱える。同じVPCという名前でも境界の引き方が違うので、構成の移し替えではここが最初の食い違いになりやすい。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="175" y="26" font-size="12" text-anchor="middle" class="muted">AWS ― VPCはリージョンの中</text>
        <text x="525" y="26" font-size="12" text-anchor="middle" class="muted">Google Cloud ― VPCはグローバル</text>
        <line x1="350" y1="16" x2="350" y2="262" stroke="var(--border)" stroke-dasharray="4 3" />

        <rect x="20" y="44" width="140" height="120" rx="8" fill="none" stroke="var(--border)" />
        <text x="90" y="64" font-size="10.5" text-anchor="middle" class="muted">リージョン A</text>
        <rect x="32" y="76" width="116" height="76" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="90" y="98" font-size="10.5" text-anchor="middle">VPC</text>
        <text x="90" y="120" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>
        <text x="90" y="138" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>

        <rect x="190" y="44" width="140" height="120" rx="8" fill="none" stroke="var(--border)" />
        <text x="260" y="64" font-size="10.5" text-anchor="middle" class="muted">リージョン B</text>
        <rect x="202" y="76" width="116" height="76" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="260" y="98" font-size="10.5" text-anchor="middle">別のVPC</text>
        <text x="260" y="120" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>
        <text x="260" y="138" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>

        <line x1="150" y1="190" x2="200" y2="190" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="175" y="212" font-size="10" text-anchor="middle" class="muted">つなぐには</text>
        <text x="175" y="228" font-size="10" text-anchor="middle" class="muted">ピアリング等の設定が要る</text>

        <rect x="380" y="44" width="300" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="530" y="66" font-size="11" text-anchor="middle">1つのVPC(グローバル)</text>
        <rect x="396" y="78" width="130" height="72" rx="6" fill="none" stroke="var(--border)" />
        <text x="461" y="100" font-size="10.5" text-anchor="middle" class="muted">リージョン A</text>
        <text x="461" y="122" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>
        <text x="461" y="140" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>
        <rect x="538" y="78" width="130" height="72" rx="6" fill="none" stroke="var(--border)" />
        <text x="603" y="100" font-size="10.5" text-anchor="middle" class="muted">リージョン B</text>
        <text x="603" y="122" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>
        <text x="603" y="140" font-size="9.5" text-anchor="middle" class="muted">サブネット</text>

        <text x="530" y="200" font-size="10" text-anchor="middle" class="muted">リージョンをまたぐ通信も、同じネットワークの内側の話になる</text>

        <text x="20" y="262" font-size="10.5" class="muted">同じ「VPC」でも境界の引き方が違う。構成を移し替えるとき、最初に食い違うのがここ。</text>
      </svg>
    </div>
  </body>
</html>
