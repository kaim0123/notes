<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="認可の欠陥がどう見えるかを、2つのリクエストの比較で示した図。左は本人のトークンで自分の注文を取得する場合で、正しく200が返る。右は別人のトークンで同じ注文を取得する場合で、本来は404が返るべきところ、認可の確認が抜けていると200が返って他人のデータが見えてしまう。2つのリクエストはURLも形式もまったく同じで、違うのは持っているトークンだけ。だからコードを静的に読む検査では危険な書き方が見当たらず、外から動かす検査でも正規の応答にしか見えない。ツールでは見つけにくい一方、テストとしては利用者を2人作って一方のトークンで他方の資源を取りに行くだけで書ける。この非対称性が、認可テストを自分で書く価値がいちばん高い理由になっている。"
      >
        <text x="16" y="26" font-size="11" class="muted">同じURL、同じ形式。違うのは、持っているトークンだけ</text>

        <rect x="16" y="42" width="296" height="98" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="64" font-size="10">本人のトークンで</text>
        <text x="30" y="88" font-size="9" class="mono muted">GET /api/orders/1234</text>
        <text x="30" y="106" font-size="9" class="mono muted">Authorization: Bearer (alice)</text>
        <text x="30" y="130" font-size="10" class="muted">→ 200 正しい</text>

        <rect x="328" y="42" width="296" height="98" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="342" y="64" font-size="10" class="accent">別人のトークンで</text>
        <text x="342" y="88" font-size="9" class="mono muted">GET /api/orders/1234</text>
        <text x="342" y="106" font-size="9" class="mono">Authorization: Bearer (bob)</text>
        <text x="342" y="130" font-size="10" class="accent">→ 200 が返ったら、欠陥</text>

        <rect x="16" y="158" width="296" height="86" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="180" font-size="10" class="muted">ツールでは見つけにくい</text>
        <text x="30" y="202" font-size="9" class="muted">コードを読む検査には、危険な</text>
        <text x="30" y="218" font-size="9" class="muted">書き方が1つも見当たらない</text>
        <text x="30" y="236" font-size="9" class="muted">外から動かす検査にも、正規の応答に見える</text>

        <rect x="328" y="158" width="296" height="86" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="342" y="180" font-size="10" class="accent">テストとしては簡単に書ける</text>
        <text x="342" y="202" font-size="9" class="muted">利用者を2人作り、一方のトークンで</text>
        <text x="342" y="218" font-size="9" class="muted">他方の資源を取りに行くだけ</text>
        <text x="342" y="236" font-size="9" class="muted">3行で書けて、事故の型としては最多</text>

        <line x1="16" y1="264" x2="624" y2="264" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="284" font-size="10.5" class="muted">この非対称性 ― 検出は難しいのに、テストは易しい ― が、自分で書く価値がいちばん高い理由。</text>
        <text x="16" y="306" font-size="10.5" class="accent">エンドポイントを1本足したら、認可のテストも1本足す。それを習慣にする。</text>
      </svg>
    </div>
  </body>
</html>
