<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="禁止リスト方式と許可リスト方式で、ルールを書き忘れたときにどちらへ倒れるかを比べた図。左の禁止リスト方式では、これは禁止という項目を並べていくため、新しく足したエンドポイントを書き忘れると、そのエンドポイントは誰でも通れる状態になる。事故に気づくのは外部から悪用されたあとになる。右の許可リスト方式では、これだけが許可という項目を並べるため、書き忘れたエンドポイントは自動的に拒否される。担当者からは動かないという苦情が来るが、外部に開いてしまうことはない。どちらの方式でも書き忘れは起きるという前提に立ち、倒れる方向が安全な側を選ぶ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="350" y="42" font-size="10.5" text-anchor="middle" class="muted">新しいエンドポイントを足し、ルールに書き忘れた</text>
        <rect x="270" y="56" width="160" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="350" y="78" font-size="10" text-anchor="middle" class="mono">/admin/export</text>

        <line x1="330" y1="94" x2="190" y2="128" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="370" y1="94" x2="510" y2="128" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <rect x="40" y="136" width="270" height="88" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="175" y="160" font-size="11" text-anchor="middle">禁止リスト方式</text>
        <text x="175" y="180" font-size="9.5" text-anchor="middle" class="muted">「これは禁止」を並べる</text>
        <text x="175" y="204" font-size="10" text-anchor="middle" class="accent">書き忘れ → 誰でも通れる</text>

        <rect x="390" y="136" width="270" height="88" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="525" y="160" font-size="11" text-anchor="middle" class="accent">許可リスト方式</text>
        <text x="525" y="180" font-size="9.5" text-anchor="middle" class="muted">「これだけが許可」を並べる</text>
        <text x="525" y="204" font-size="10" text-anchor="middle">書き忘れ → 自動的に拒否</text>

        <text x="175" y="244" font-size="9" text-anchor="middle" class="muted">気づくのは、外から悪用されたとき</text>
        <text x="525" y="244" font-size="9" text-anchor="middle" class="muted">気づくのは、担当者から苦情が来たとき</text>

        <line x1="16" y1="262" x2="684" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="284" font-size="10.5" class="accent">書き忘れは、どちらの方式でも起きる。選んでいるのは「起きたときにどちらへ倒れるか」のほう。</text>
      </svg>
    </div>
  </body>
</html>
