<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="仮想アドレス空間と実際の置き場所の対応。プログラムから見た仮想アドレス空間にはページAからDが連続して並ぶが、実際に物理メモリ(RAM)にあるのはページAとCだけで、ページBとDはストレージのスワップ領域に置かれている。" viewBox="0 0 640 260">
      <text x="110" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">プログラムから見た</text>
      <text x="110" y="40" fill="var(--fg)" font-size="13" text-anchor="middle">仮想アドレス空間</text>
      <rect x="40" y="54" width="140" height="180" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="40" y="54" width="140" height="36" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="110" y="77" fill="var(--fg)" font-size="12" text-anchor="middle">ページ A</text>
      <rect x="40" y="90" width="140" height="36" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="110" y="113" fill="var(--fg)" font-size="12" text-anchor="middle">ページ B</text>
      <rect x="40" y="126" width="140" height="36" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="110" y="149" fill="var(--fg)" font-size="12" text-anchor="middle">ページ C</text>
      <rect x="40" y="162" width="140" height="36" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="110" y="185" fill="var(--fg)" font-size="12" text-anchor="middle">ページ D</text>

      <text x="400" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">実際の置き場所</text>

      <rect x="330" y="40" width="150" height="96" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="405" y="58" fill="var(--muted)" font-size="11" text-anchor="middle">物理メモリ(RAM)</text>
      <rect x="345" y="68" width="120" height="26" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="405" y="85" fill="var(--fg)" font-size="12" text-anchor="middle">ページ A</text>
      <rect x="345" y="100" width="120" height="26" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="405" y="117" fill="var(--fg)" font-size="12" text-anchor="middle">ページ C</text>

      <rect x="330" y="150" width="150" height="84" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />
      <text x="405" y="168" fill="var(--muted)" font-size="11" text-anchor="middle">ストレージ(スワップ)</text>
      <rect x="345" y="178" width="120" height="26" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="405" y="195" fill="var(--muted)" font-size="12" text-anchor="middle">ページ B</text>
      <rect x="345" y="206" width="120" height="22" fill="none" stroke="var(--muted)" stroke-width="1" />
      <text x="405" y="222" fill="var(--muted)" font-size="12" text-anchor="middle">ページ D</text>

      <line x1="180" y1="72" x2="345" y2="81" stroke="var(--primary)" stroke-width="1" />
      <line x1="180" y1="108" x2="345" y2="191" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="180" y1="144" x2="345" y2="113" stroke="var(--primary)" stroke-width="1" />
      <line x1="180" y1="180" x2="345" y2="217" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" />
      </svg>
    </div>
  </body>
</html>
