<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 920 200"
        role="img"
        aria-label="OSPFの3段階の動作。まずHelloパケットを交換して隣接関係(ネイバー)を確立し、次にLSAを交換して両者が同じリンクステートデータベース(LSDB)を構築し、最後は互いに通信せず各自がSPF計算(ダイクストラ法)を行ってルーティングテーブルに反映する。"
      >
        <defs>
          <marker
            id="arrowO"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="150" y="18" text-anchor="middle" font-size="12.5" font-weight="700">① Hello交換</text>
        <rect x="40" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="70" text-anchor="middle" font-size="12">R1</text>
        <rect x="190" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="225" y="70" text-anchor="middle" font-size="12">R2</text>
        <line x1="110" y1="65" x2="190" y2="65" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowO)" marker-start="url(#arrowO)" />
        <text x="150" y="55" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">Hello</text>
        <text x="150" y="148" text-anchor="middle" font-size="11" class="muted">隣接関係(ネイバー)を確立</text>

        <line x1="270" y1="65" x2="300" y2="65" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowO)" />

        <text x="440" y="18" text-anchor="middle" font-size="12.5" font-weight="700">② LSA交換</text>
        <rect x="330" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="365" y="70" text-anchor="middle" font-size="12">R1</text>
        <rect x="480" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="515" y="70" text-anchor="middle" font-size="12">R2</text>
        <line x1="400" y1="65" x2="480" y2="65" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowO)" marker-start="url(#arrowO)" />
        <text x="440" y="55" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">LSA</text>
        <rect x="330" y="100" width="70" height="28" rx="5" fill="var(--primary)" />
        <text x="365" y="119" text-anchor="middle" font-size="10.5" font-weight="700" style="fill: var(--primary-fg)">LSDB</text>
        <rect x="480" y="100" width="70" height="28" rx="5" fill="var(--primary)" />
        <text x="515" y="119" text-anchor="middle" font-size="10.5" font-weight="700" style="fill: var(--primary-fg)">LSDB</text>
        <text x="440" y="148" text-anchor="middle" font-size="11" class="muted">同じLSDBを構築</text>

        <line x1="560" y1="65" x2="590" y2="65" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowO)" />

        <text x="730" y="18" text-anchor="middle" font-size="12.5" font-weight="700">③ SPF計算</text>
        <rect x="620" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="655" y="70" text-anchor="middle" font-size="12">R1</text>
        <rect x="780" y="45" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="815" y="70" text-anchor="middle" font-size="12">R2</text>
        <rect x="605" y="100" width="100" height="28" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="655" y="119" text-anchor="middle" font-size="10" style="fill: var(--primary)">SPF計算</text>
        <rect x="765" y="100" width="100" height="28" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="815" y="119" text-anchor="middle" font-size="10" style="fill: var(--primary)">SPF計算</text>
        <text x="730" y="148" text-anchor="middle" font-size="11" class="muted">互いに通信せず各自で計算</text>
        <text x="730" y="164" text-anchor="middle" font-size="11" class="muted">→ ルーティングテーブルへ反映</text>
      </svg>
    </div>
  </body>
</html>
