<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 280"
        role="img"
        aria-label="逆ポーランド記法 3 4 + 5 × をスタックで評価する5ステップ。3を積む、4を積む、+で3と4を取り出し7を積む、5を積む、×で7と5を取り出し35を得る"
      >
        <text x="30" y="28" font-size="13" class="muted">「3 4 + 5 ×」を左から1つずつ読む ― 数は積む、演算子は2つ取り出して計算</text>

        <!-- ステップ1: 3 -->
        <text x="105" y="66" text-anchor="middle" font-size="15" font-weight="700" class="mono accent">3</text>
        <rect x="45" y="184" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="105" y="211" text-anchor="middle" font-size="18" class="mono">3</text>
        <line x1="45" y1="80" x2="45" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="165" y1="80" x2="165" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="45" y1="232" x2="165" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <text x="105" y="256" text-anchor="middle" font-size="11" class="muted">積む</text>

        <!-- ステップ2: 4 -->
        <text x="255" y="66" text-anchor="middle" font-size="15" font-weight="700" class="mono accent">4</text>
        <rect x="195" y="184" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="255" y="211" text-anchor="middle" font-size="18" class="mono">3</text>
        <rect x="195" y="140" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="255" y="167" text-anchor="middle" font-size="18" class="mono">4</text>
        <line x1="195" y1="80" x2="195" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="315" y1="80" x2="315" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="195" y1="232" x2="315" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <text x="255" y="256" text-anchor="middle" font-size="11" class="muted">積む</text>

        <!-- ステップ3: + -->
        <text x="405" y="66" text-anchor="middle" font-size="15" font-weight="700" class="mono accent">+</text>
        <rect x="345" y="184" width="120" height="40" rx="6" fill="var(--primary)" />
        <text x="405" y="211" text-anchor="middle" font-size="18" class="mono" style="fill: var(--primary-fg)">7</text>
        <line x1="345" y1="80" x2="345" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="465" y1="80" x2="465" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="345" y1="232" x2="465" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <text x="405" y="256" text-anchor="middle" font-size="11" class="muted">3と4を取り出し 3+4</text>

        <!-- ステップ4: 5 -->
        <text x="555" y="66" text-anchor="middle" font-size="15" font-weight="700" class="mono accent">5</text>
        <rect x="495" y="184" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="555" y="211" text-anchor="middle" font-size="18" class="mono">7</text>
        <rect x="495" y="140" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="555" y="167" text-anchor="middle" font-size="18" class="mono">5</text>
        <line x1="495" y1="80" x2="495" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="615" y1="80" x2="615" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="495" y1="232" x2="615" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <text x="555" y="256" text-anchor="middle" font-size="11" class="muted">積む</text>

        <!-- ステップ5: × -->
        <text x="705" y="66" text-anchor="middle" font-size="15" font-weight="700" class="mono accent">×</text>
        <rect x="645" y="184" width="120" height="40" rx="6" fill="var(--primary)" />
        <text x="705" y="211" text-anchor="middle" font-size="18" class="mono" style="fill: var(--primary-fg)">35</text>
        <line x1="645" y1="80" x2="645" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="765" y1="80" x2="765" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <line x1="645" y1="232" x2="765" y2="232" stroke="var(--border)" stroke-width="1.5" />
        <text x="705" y="256" text-anchor="middle" font-size="11" class="muted">7と5を取り出し 7×5</text>
      </svg>
    </div>
  </body>
</html>
