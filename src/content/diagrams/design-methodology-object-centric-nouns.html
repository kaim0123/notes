<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 240" role="img" aria-label="オブジェクト中心設計の抽出手順を示した図。上に「顧客が商品を注文する」という要求仕様の一文があり、そこから名詞である顧客・商品・注文がクラス候補として、動詞である注文するがメソッド候補として取り出される。下には、この方法だと属性ばかりのクラスになりやすく、業務ルールがどこにも入らないという貧血ドメインモデルの弱点が示されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">要求仕様の文から、機械的にクラス候補を取り出す</text>

        <rect x="150" y="42" width="360" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="330" y="68" text-anchor="middle" font-size="12">「顧客が商品を注文する」</text>

        <line x1="250" y1="86" x2="150" y2="112" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="330" y1="86" x2="330" y2="112" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="410" y1="86" x2="510" y2="112" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="60" y="116" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="150" y="136" text-anchor="middle" font-size="10.5" class="muted">名詞 → クラス候補</text>
        <text x="150" y="152" text-anchor="middle" font-size="11">顧客 / 商品</text>

        <rect x="250" y="116" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="330" y="136" text-anchor="middle" font-size="10.5" class="muted">名詞 → クラス候補</text>
        <text x="330" y="152" text-anchor="middle" font-size="11">注文</text>

        <rect x="420" y="116" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="136" text-anchor="middle" font-size="10.5" class="muted">動詞 → メソッド候補</text>
        <text x="510" y="152" text-anchor="middle" font-size="11">注文する()</text>

        <text x="330" y="196" text-anchor="middle" font-size="11" class="muted">初速は速いが、名詞を拾うだけでは「注文の何が難しい業務ルールか」は見えない</text>
        <text x="330" y="220" text-anchor="middle" font-size="11" class="muted">= 属性ばかりが並ぶ貧血ドメインモデルに陥りやすい</text>
      </svg>
    </div>
  </body>
</html>
