<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="開発環境と本番環境の差がどこから生まれるかを分解した図。5つの要素が縦に並び、それぞれ左が手元、右が本番を表す。1つ目のコードは、同じコミットから作られていれば同一で、これは揃えるべきもの。2つ目の依存は、ロックファイルがあれば同一で、これも揃えるべきもの。3つ目の設定は、接続先や鍵が環境ごとに異なり、これは意図的に違ってよいもの。4つ目のデータは、件数も内容も本番のほうが桁違いに大きく、これも当然違う。5つ目の規模と並行数は、本番では複数プロセス・複数インスタンスで動き、手元の1プロセスとは前提が変わる。上2つが違っていたら事故であり、揃える努力の対象。下3つは違って当たり前で、違いを前提に設計する対象。この切り分けができると、本番だけで起きる不具合の原因を絞り込みやすくなる。"
      >
        <text x="160" y="26" text-anchor="middle" font-size="11.5" class="muted">手元</text>
        <text x="470" y="26" text-anchor="middle" font-size="11.5" class="muted">本番</text>

        <text x="16" y="56" font-size="11" class="lbl">コード</text>
        <rect x="96" y="38" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="160" y="56" text-anchor="middle" font-size="10.5">同じコミット</text>
        <text x="288" y="56" text-anchor="middle" font-size="12" class="lbl">=</text>
        <rect x="406" y="38" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="470" y="56" text-anchor="middle" font-size="10.5">同じコミット</text>
        <text x="624" y="56" text-anchor="end" font-size="10.5" class="lbl">揃える</text>

        <text x="16" y="94" font-size="11" class="lbl">依存</text>
        <rect x="96" y="76" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="160" y="94" text-anchor="middle" font-size="10.5">ロックで固定</text>
        <text x="288" y="94" text-anchor="middle" font-size="12" class="lbl">=</text>
        <rect x="406" y="76" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="470" y="94" text-anchor="middle" font-size="10.5">ロックで固定</text>
        <text x="624" y="94" text-anchor="end" font-size="10.5" class="lbl">揃える</text>

        <line x1="16" y1="116" x2="624" y2="116" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 3" />

        <text x="16" y="146" font-size="11" class="muted">設定</text>
        <rect x="96" y="128" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="146" text-anchor="middle" font-size="10.5" class="muted">開発用の接続先</text>
        <text x="288" y="146" text-anchor="middle" font-size="12" class="muted">≠</text>
        <rect x="406" y="128" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="146" text-anchor="middle" font-size="10.5" class="muted">本番の接続先と鍵</text>
        <text x="624" y="146" text-anchor="end" font-size="10.5" class="muted">違ってよい</text>

        <text x="16" y="184" font-size="11" class="muted">データ</text>
        <rect x="96" y="166" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="184" text-anchor="middle" font-size="10.5" class="muted">数十件のダミー</text>
        <text x="288" y="184" text-anchor="middle" font-size="12" class="muted">≠</text>
        <rect x="406" y="166" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="184" text-anchor="middle" font-size="10.5" class="muted">数百万件の実データ</text>
        <text x="624" y="184" text-anchor="end" font-size="10.5" class="muted">違って当然</text>

        <text x="16" y="222" font-size="11" class="muted">規模</text>
        <rect x="96" y="204" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="222" text-anchor="middle" font-size="10.5" class="muted">1プロセス・1人</text>
        <text x="288" y="222" text-anchor="middle" font-size="12" class="muted">≠</text>
        <rect x="406" y="204" width="128" height="26" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="222" text-anchor="middle" font-size="10.5" class="muted">複数インスタンス・同時多数</text>
        <text x="624" y="222" text-anchor="end" font-size="10.5" class="muted">違って当然</text>

        <line x1="16" y1="248" x2="624" y2="248" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="268" font-size="11" class="lbl">上2つが違っていたら事故 ― 揃える努力の対象</text>
        <text x="16" y="286" font-size="11" class="muted">下3つは違って当たり前 ― 違いを前提に設計する対象。本番だけの不具合はここに原因がある</text>
      </svg>
    </div>
  </body>
</html>
