<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 680 350"
        role="img"
        aria-label="4つのパラダイムを、前の書き方で困っていたことへの回答として並べた対応表。機械語では処理の流れが人間に読めないという困りごとに対して手続き型(基本単位は手順=関数)、GOTOが飛び交って流れを追えないという困りごとに対して構造化(基本単位は順次・分岐・反復の制御構造)、規模が大きくなりデータと処理の対応が崩れるという困りごとに対してオブジェクト指向(基本単位はデータと処理をまとめたオブジェクト)、状態変化と並行処理でバグの原因が読めないという困りごとに対して関数型(基本単位は純粋関数)が、それぞれ矢印で結ばれている。"
      >
        <defs>
          <marker
            id="arrowPara"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="160" y="22" text-anchor="middle" font-size="11.5" class="muted">前の書き方で困っていたこと</text>
        <text x="510" y="22" text-anchor="middle" font-size="11.5" class="muted">その回答として生まれたパラダイム</text>

        <rect x="20" y="34" width="280" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="70" text-anchor="middle" font-size="11.5">機械語では処理の流れが人間に読めない</text>
        <line x1="308" y1="64" x2="352" y2="64" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowPara)" />
        <rect x="360" y="34" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="58" font-size="12.5" font-weight="600">手続き型</text>
        <text x="380" y="78" font-size="11" class="muted">基本単位: 手順(関数)</text>

        <rect x="20" y="106" width="280" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="142" text-anchor="middle" font-size="11.5">GOTOが飛び交い、流れを追えない</text>
        <line x1="308" y1="136" x2="352" y2="136" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowPara)" />
        <rect x="360" y="106" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="130" font-size="12.5" font-weight="600">構造化</text>
        <text x="380" y="150" font-size="11" class="muted">基本単位: 制御構造(順次・分岐・反復)</text>

        <rect x="20" y="178" width="280" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="207" text-anchor="middle" font-size="11.5">規模が大きくなると、データと処理の</text>
        <text x="160" y="225" text-anchor="middle" font-size="11.5">対応が崩れて追えない</text>
        <line x1="308" y1="208" x2="352" y2="208" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowPara)" />
        <rect x="360" y="178" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="202" font-size="12.5" font-weight="600">オブジェクト指向</text>
        <text x="380" y="222" font-size="11" class="muted">基本単位: オブジェクト(データ+処理)</text>

        <rect x="20" y="250" width="280" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="160" y="279" text-anchor="middle" font-size="11.5">状態変化と並行処理で、バグの原因が</text>
        <text x="160" y="297" text-anchor="middle" font-size="11.5">読み切れない</text>
        <line x1="308" y1="280" x2="352" y2="280" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowPara)" />
        <rect x="360" y="250" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="274" font-size="12.5" font-weight="600">関数型</text>
        <text x="380" y="294" font-size="11" class="muted">基本単位: 純粋関数</text>

        <text x="340" y="336" text-anchor="middle" font-size="11" class="muted">
          後から出たパラダイムは前を置き換えず、選択肢として積み重なる
        </text>
      </svg>
    </div>
  </body>
</html>
