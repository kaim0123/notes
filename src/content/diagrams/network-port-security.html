<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 380"
        role="img"
        aria-label="ポートセキュリティの図解。スイッチポートGi0/1には許可するMACアドレスAA:AA:AA:AA:AA:AAが登録されている。そのMACを持つ正規のPCが接続すると一致して通信が許可されるが、別のMACを持つ不正な機器が接続すると不一致となり違反が検知されてポートがシャットダウンされる。"
      >
        <defs>
          <marker
            id="arrowPs"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="180" y="20" width="340" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="350" y="42" text-anchor="middle" font-size="12" font-weight="600" style="fill: var(--primary)">Gi0/1: port-security</text>
        <text x="350" y="58" text-anchor="middle" font-size="10" class="mono muted">許可MAC: AA:AA:AA:AA:AA:AA / 違反時: shutdown</text>
        <text x="350" y="72" text-anchor="middle" font-size="9.5" class="muted">(接続してよいMACアドレスをあらかじめ登録)</text>

        <rect x="40" y="150" width="180" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="172" text-anchor="middle" font-size="12" font-weight="600">PC(正規)</text>
        <text x="130" y="188" text-anchor="middle" font-size="9" class="mono muted">MAC: AA:AA:AA:AA:AA:AA</text>

        <rect x="480" y="150" width="180" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="570" y="172" text-anchor="middle" font-size="12" font-weight="600">不正な機器</text>
        <text x="570" y="188" text-anchor="middle" font-size="9" class="mono muted">MAC: BB:BB:BB:BB:BB:BB</text>

        <line x1="130" y1="150" x2="280" y2="85" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowPs)" />
        <text x="150" y="120" text-anchor="middle" font-size="11" style="fill: var(--primary)">一致</text>

        <line x1="570" y1="150" x2="420" y2="85" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#arrowPs)" />
        <text x="555" y="120" text-anchor="middle" font-size="11" class="muted">不一致</text>

        <rect x="40" y="280" width="180" height="60" rx="7" fill="var(--primary)" />
        <text x="130" y="315" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary-fg)">通信許可</text>

        <rect x="440" y="280" width="220" height="70" rx="7" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="550" y="305" text-anchor="middle" font-size="11.5" class="muted">違反を検知</text>
        <text x="550" y="323" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">ポートをshutdown</text>
        <text x="550" y="339" text-anchor="middle" font-size="9.5" class="muted">(err-disabled状態に)</text>

        <line x1="130" y1="200" x2="130" y2="280" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowPs)" />
        <line x1="570" y1="200" x2="555" y2="280" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowPs)" />
      </svg>
    </div>
  </body>
</html>
