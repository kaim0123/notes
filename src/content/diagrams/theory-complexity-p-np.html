<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 320"
        role="img"
        aria-label="PがNPの内側に含まれ、NP完全がNPの中で最も難しい一群として重なって描かれた包含関係図。P対NP問題はPとNPが一致するかどうかが未解決であることを示す"
      >
        <text x="30" y="28" font-size="13" class="muted">問題の難しさの分類(P ≠ NP を前提とした一般的な描き方)</text>

        <!-- NP の外枠 -->
        <ellipse cx="360" cy="180" rx="290" ry="115" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="360" y="90" text-anchor="middle" font-size="16" font-weight="700">NP</text>
        <text x="360" y="110" text-anchor="middle" font-size="12" class="muted">答えの検証が多項式時間でできる問題</text>

        <!-- P -->
        <ellipse cx="235" cy="200" rx="130" ry="72" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="235" y="192" text-anchor="middle" font-size="16" font-weight="700" class="accent">P</text>
        <text x="235" y="214" text-anchor="middle" font-size="11" class="muted">多項式時間で解ける</text>
        <text x="235" y="232" text-anchor="middle" font-size="11" class="muted">ソート・探索・最短経路</text>

        <!-- NP完全 -->
        <ellipse cx="510" cy="200" rx="125" ry="72" fill="var(--primary)" opacity="0.22" stroke="var(--primary)" stroke-width="1.5" />
        <text x="510" y="192" text-anchor="middle" font-size="15" font-weight="700">NP完全</text>
        <text x="510" y="214" text-anchor="middle" font-size="11" class="muted">NPの中で最も難しい一群</text>
        <text x="510" y="232" text-anchor="middle" font-size="11" class="muted">巡回セールスマン・ナップサック</text>

        <!-- 未解決の注記 -->
        <text x="410" y="306" text-anchor="middle" font-size="13" class="accent" font-weight="600">
          P = NP か? ― 未解決。1つのNP完全問題が多項式時間で解ければ、NP全体が解けることになる
        </text>
      </svg>
    </div>
  </body>
</html>
