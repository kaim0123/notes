<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="スクラムの1スプリントの流れを示した図。左端にプロダクトバックログがあり、やりたいことが優先順位つきで縦に並んでいる。スプリント計画で、その上位からいくつかを取り出してスプリントバックログに移す。スプリント期間中は毎日の短い共有を挟みながら開発を進め、期間の終わりに動くもの(インクリメント)ができあがる。それをスプリントレビューで関係者に見せ、続いてレトロスペクティブでやり方そのものを振り返る。振り返りの結果と、レビューで出た要望はプロダクトバックログへ戻り、次のスプリントの入力になる。全体が輪になっており、1〜4週間ごとにこの輪を回し続ける。"
      >
        <defs>
          <marker id="arsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arspp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="50" width="126" height="130" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="79" y="72" text-anchor="middle" font-size="11.5" font-weight="600">プロダクト</text>
        <text x="79" y="88" text-anchor="middle" font-size="11.5" font-weight="600">バックログ</text>
        <rect x="32" y="98" width="94" height="16" rx="3" fill="none" stroke="var(--primary)" stroke-width="1.1" />
        <rect x="32" y="118" width="94" height="16" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.1" />
        <rect x="32" y="138" width="94" height="16" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.1" />
        <text x="79" y="172" text-anchor="middle" font-size="10" class="muted">優先順位つき</text>

        <line x1="142" y1="106" x2="176" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arsp)" />
        <text x="159" y="98" text-anchor="middle" font-size="9.5" class="muted">上位を</text>

        <rect x="182" y="50" width="126" height="130" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="245" y="72" text-anchor="middle" font-size="11.5">スプリント計画</text>
        <text x="245" y="94" text-anchor="middle" font-size="10.5" class="muted">今回やる分を</text>
        <text x="245" y="110" text-anchor="middle" font-size="10.5" class="muted">取り出す</text>
        <text x="245" y="140" text-anchor="middle" font-size="10.5" class="muted">スプリント</text>
        <text x="245" y="156" text-anchor="middle" font-size="10.5" class="muted">バックログ</text>

        <line x1="308" y1="106" x2="342" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arsp)" />

        <rect x="348" y="50" width="126" height="130" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="411" y="72" text-anchor="middle" font-size="11.5">開発</text>
        <text x="411" y="94" text-anchor="middle" font-size="10.5" class="muted">1〜4週間</text>
        <text x="411" y="116" text-anchor="middle" font-size="10.5" class="muted">毎日の短い共有を</text>
        <text x="411" y="132" text-anchor="middle" font-size="10.5" class="muted">挟みながら進める</text>
        <text x="411" y="160" text-anchor="middle" font-size="10.5" class="lbl">動くものができる</text>

        <line x1="474" y1="106" x2="508" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arsp)" />

        <rect x="514" y="50" width="110" height="130" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="569" y="76" text-anchor="middle" font-size="11.5">レビュー</text>
        <text x="569" y="96" text-anchor="middle" font-size="10.5" class="muted">成果物を見せる</text>
        <line x1="530" y1="112" x2="608" y2="112" stroke="var(--border)" stroke-width="1" />
        <text x="569" y="134" text-anchor="middle" font-size="11.5">振り返り</text>
        <text x="569" y="154" text-anchor="middle" font-size="10.5" class="muted">やり方を見直す</text>

        <path d="M569,180 L569,214 L79,214 L79,184" fill="none" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arspp)" />
        <text x="324" y="234" text-anchor="middle" font-size="11" class="lbl">要望も改善点も、いったんバックログへ戻る ― これが次のスプリントの入力になる</text>

        <text x="16" y="272" font-size="11" class="muted">区間ごとに必ず「動くもの」という成果が残るのが、反復の要点</text>
      </svg>
    </div>
  </body>
</html>
