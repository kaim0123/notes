<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="保存先の権限を2つの方式で管理するときの違いを示した図。左は入れ物の単位でまとめて権限を決める方式で、誰が読めるかは1か所を見れば分かり、設定の見落としが起きにくい。右は個々のファイルごとに公開の可否を持たせられる方式で、細かい制御ができる代わりに、どのファイルが誰に見えているのかを全体として把握できなくなる。実務では入れ物の単位に統一し、個別に配りたいものは期限付きの署名済みリンクで渡すのが安全になる。公開範囲の事故は、把握できない状態から生まれる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="320" height="160" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="180" y="72" font-size="11.5" text-anchor="middle">入れ物の単位でまとめる</text>
        <rect x="40" y="88" width="280" height="34" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="110" font-size="9.5" text-anchor="middle" class="muted">誰が読めるかは1か所で決まる</text>
        <rect x="40" y="128" width="280" height="34" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="150" font-size="9.5" text-anchor="middle" class="muted">見落としが起きにくい</text>
        <text x="180" y="188" font-size="10" text-anchor="middle" class="accent">既定でこちらに統一する</text>

        <rect x="360" y="46" width="320" height="160" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="72" font-size="11.5" text-anchor="middle">ファイルごとに持たせる</text>
        <rect x="380" y="88" width="280" height="34" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="110" font-size="9.5" text-anchor="middle" class="muted">1件ずつ細かく制御できる</text>
        <rect x="380" y="128" width="280" height="34" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="150" font-size="9.5" text-anchor="middle" class="muted">全体として誰に見えているか分からない</text>
        <text x="520" y="188" font-size="10" text-anchor="middle" class="accent">把握できない状態が事故を生む</text>

        <text x="20" y="240" font-size="10.5" class="muted">個別に配りたいものは、権限ではなく期限付きの署名済みリンクで渡す。</text>
        <text x="20" y="262" font-size="10.5" class="muted">「その場だけ有効」なら、後から広がることも消し忘れることもない。</text>
      </svg>
    </div>
  </body>
</html>
