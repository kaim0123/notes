<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 340" role="img" aria-label="リフレッシュトークンを使うたびに新しいものへ入れ替えることで、盗まれたことを検知できる仕組みを示した図。上段は正規の利用者の流れで、最初のログインでR1を受け取り、それを使って新しいR2を受け取り、さらにR3へと入れ替わっていく。使い終わったものは使用済みとして記録される。下段は途中でR2の控えを盗んだ側の流れで、盗んだ側がR2を提示する。しかしR2はすでに正規の利用者によって使われており、使用済みとして記録されている。使用済みのものが再び提示されたということは、正規の利用者は次のものを持っているはずなので、提示しているのは盗んだ側だと分かる。サーバーはその時点で、同じログインから派生したすべてのトークンをまとめて失効させる。盗まれたこと自体は防げないが、盗まれたと分かることに意味がある、という点が図の要点。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">使うたびに、新しいものへ入れ替える</text>

        <text x="16" y="58" font-size="10.5" class="lbl">正規の利用者</text>
        <rect x="110" y="44" width="66" height="26" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="130" y="61" font-size="10" class="lbl mono">R1</text>
        <line x1="176" y1="57" x2="204" y2="57" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <rect x="208" y="44" width="66" height="26" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="228" y="61" font-size="10" class="lbl mono">R2</text>
        <line x1="274" y1="57" x2="302" y2="57" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <rect x="306" y="44" width="66" height="26" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="326" y="61" font-size="10" class="lbl mono">R3</text>
        <text x="386" y="61" font-size="10" class="muted">… と入れ替わっていく</text>

        <text x="110" y="88" font-size="9" class="muted">使用済み</text>
        <text x="208" y="88" font-size="9" class="muted">使用済み</text>
        <text x="306" y="88" font-size="9" class="lbl">いま有効</text>

        <line x1="16" y1="112" x2="624" y2="112" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="144" font-size="10.5" class="muted">盗んだ側</text>
        <path d="M241,92 v40 h-20" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="92" y="136" font-size="9" class="muted">R2の控えを盗む</text>
        <rect x="110" y="150" width="66" height="26" rx="5" fill="var(--card)" stroke="var(--muted)" stroke-width="1.2" />
        <text x="130" y="167" font-size="10" class="muted mono">R2</text>
        <line x1="176" y1="163" x2="230" y2="163" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="182" y="156" font-size="9" class="muted">提示する</text>

        <rect x="236" y="142" width="250" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="252" y="160" font-size="10.5" class="lbl">これは使用済みとして記録されている</text>
        <text x="252" y="177" font-size="9.5" class="muted">＝ 正規の利用者は、すでに次のものを持っている</text>

        <line x1="360" y1="184" x2="360" y2="208" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="200" y="212" width="320" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="216" y="230" font-size="10.5" class="lbl">同じログインから派生した全部を、まとめて失効させる</text>
        <text x="216" y="247" font-size="9.5" class="muted">正規の利用者も一度ログインし直すことになるが、それでよい</text>

        <line x1="16" y1="276" x2="624" y2="276" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="302" font-size="10.5" class="muted">盗まれること自体は防げない。この仕組みの価値は、</text>
        <text x="16" y="324" font-size="10.5" class="lbl">盗まれたと「分かる」ことにある。使い捨てにしなければ、誰も気づかないまま使われ続ける。</text>
      </svg>
    </div>
  </body>
</html>
