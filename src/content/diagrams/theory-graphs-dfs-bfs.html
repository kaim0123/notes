<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 340"
        role="img"
        aria-label="同じグラフに対する深さ優先探索と幅優先探索の訪問順の比較。DFSはA、B、D、Eと潜ってから戻ってCへ進み、BFSはAの隣接であるBとCを先に訪れてからDとEへ進む"
      >
        <text x="30" y="26" font-size="13" class="muted">同じグラフを、始点Aから2通りの順序でたどる</text>

        <!-- 左: DFS -->
        <text x="205" y="60" text-anchor="middle" font-size="14" font-weight="700" class="accent">深さ優先探索(DFS) ― スタック</text>
        <line x1="205" y1="106" x2="130" y2="166" stroke="var(--primary)" stroke-width="2" />
        <line x1="205" y1="106" x2="280" y2="166" stroke="var(--border)" stroke-width="1.5" />
        <line x1="130" y1="196" x2="90" y2="256" stroke="var(--primary)" stroke-width="2" />
        <line x1="130" y1="196" x2="180" y2="256" stroke="var(--primary)" stroke-width="2" />

        <circle cx="205" cy="90" r="26" fill="var(--primary)" />
        <text x="205" y="97" text-anchor="middle" font-size="15" font-weight="700" style="fill: var(--primary-fg)">A</text>
        <text x="238" y="86" font-size="12" class="accent">1</text>
        <circle cx="130" cy="180" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="130" y="187" text-anchor="middle" font-size="15" font-weight="700">B</text>
        <text x="96" y="160" font-size="12" class="accent">2</text>
        <circle cx="280" cy="180" r="26" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="280" y="187" text-anchor="middle" font-size="15" font-weight="700">C</text>
        <text x="314" y="176" font-size="12" class="accent">5</text>
        <circle cx="90" cy="270" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="90" y="277" text-anchor="middle" font-size="15" font-weight="700">D</text>
        <text x="56" y="250" font-size="12" class="accent">3</text>
        <circle cx="180" cy="270" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="180" y="277" text-anchor="middle" font-size="15" font-weight="700">E</text>
        <text x="212" y="250" font-size="12" class="accent">4</text>

        <text x="205" y="322" text-anchor="middle" font-size="13" class="mono">A → B → D → E → C</text>

        <!-- 区切り -->
        <line x1="410" y1="46" x2="410" y2="330" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- 右: BFS -->
        <text x="615" y="60" text-anchor="middle" font-size="14" font-weight="700" class="accent">幅優先探索(BFS) ― キュー</text>
        <line x1="615" y1="106" x2="540" y2="166" stroke="var(--primary)" stroke-width="2" />
        <line x1="615" y1="106" x2="690" y2="166" stroke="var(--primary)" stroke-width="2" />
        <line x1="540" y1="196" x2="500" y2="256" stroke="var(--primary)" stroke-width="2" />
        <line x1="540" y1="196" x2="590" y2="256" stroke="var(--primary)" stroke-width="2" />

        <!-- 距離の帯 -->
        <text x="440" y="96" font-size="11" class="muted">0歩</text>
        <text x="440" y="186" font-size="11" class="muted">1歩</text>
        <text x="440" y="276" font-size="11" class="muted">2歩</text>

        <circle cx="615" cy="90" r="26" fill="var(--primary)" />
        <text x="615" y="97" text-anchor="middle" font-size="15" font-weight="700" style="fill: var(--primary-fg)">A</text>
        <text x="648" y="86" font-size="12" class="accent">1</text>
        <circle cx="540" cy="180" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="540" y="187" text-anchor="middle" font-size="15" font-weight="700">B</text>
        <text x="506" y="160" font-size="12" class="accent">2</text>
        <circle cx="690" cy="180" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="690" y="187" text-anchor="middle" font-size="15" font-weight="700">C</text>
        <text x="724" y="176" font-size="12" class="accent">3</text>
        <circle cx="500" cy="270" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="500" y="277" text-anchor="middle" font-size="15" font-weight="700">D</text>
        <text x="466" y="250" font-size="12" class="accent">4</text>
        <circle cx="590" cy="270" r="26" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="590" y="277" text-anchor="middle" font-size="15" font-weight="700">E</text>
        <text x="622" y="250" font-size="12" class="accent">5</text>

        <text x="615" y="322" text-anchor="middle" font-size="13" class="mono">A → B → C → D → E</text>
      </svg>
    </div>
  </body>
</html>
