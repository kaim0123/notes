<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 260"
        role="img"
        aria-label="秘密の値がバージョンとして積み重なることを示した図。値を更新するたびに新しいバージョンが追加され、古いバージョンはそのまま残る。アプリが参照するときは、特定の番号を指定する方法と、最新を指す別名を指定する方法がある。番号を指定しておけば、値が更新されても参照先は変わらないため、切り替えの時期を自分で決められる。最新を指す形にすると更新が即座に反映される代わりに、意図しない時点で切り替わる。古いバージョンは無効化して残しておけば、問題が起きたときに戻せる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="40" y="60" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="140" y="85" font-size="10" text-anchor="middle" class="muted">バージョン 1(無効化)</text>
        <rect x="40" y="108" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="140" y="133" font-size="10" text-anchor="middle" class="muted">バージョン 2</text>
        <rect x="40" y="156" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="140" y="181" font-size="10" text-anchor="middle">バージョン 3(最新)</text>

        <line x1="246" y1="130" x2="306" y2="130" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="246" y1="176" x2="306" y2="176" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="312" y="106" width="330" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="477" y="126" font-size="10.5" text-anchor="middle">番号を指定して参照する</text>
        <text x="477" y="144" font-size="9" text-anchor="middle" class="muted">更新されても参照先は変わらない ― 切り替えを自分で決める</text>

        <rect x="312" y="160" width="330" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="477" y="180" font-size="10.5" text-anchor="middle">最新を指す別名で参照する</text>
        <text x="477" y="198" font-size="9" text-anchor="middle" class="muted">即座に反映される ― 意図しない時点で切り替わることもある</text>

        <text x="40" y="232" font-size="10.5" class="muted">古いバージョンは無効化して残す ― 問題が起きたときに戻せる。</text>
        <text x="40" y="252" font-size="10.5" class="muted">完全に消すのは、漏えいが確定して二度と使わないと決めたときだけ。</text>
      </svg>
    </div>
  </body>
</html>
