<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="端末のライフサイクル。上段は調達(購入・リース)→キッティング(初期構築)→配布(貸与・入社)→運用(更新・保守)→回収(返却・退職)→廃棄(データ消去)と左から右へ進む。下段の破線の枠は、資産管理(台帳)・在庫管理・棚卸・ライセンス管理・セキュリティ管理という、どの段階かに関わらず全期間を通じて続く横断的な管理を表す。" viewBox="0 0 680 220">
      <defs>
      <marker id="arrowLc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)" />
      </marker>
      </defs>
      <rect x="10" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="60" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">調達</text>
      <text x="60" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">購入・リース</text>
      <line x1="110" y1="54" x2="122" y2="54" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowLc)" />
      <rect x="122" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="172" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">キッティング</text>
      <text x="172" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">初期構築</text>
      <line x1="222" y1="54" x2="234" y2="54" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowLc)" />
      <rect x="234" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="284" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">配布</text>
      <text x="284" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">貸与・入社</text>
      <line x1="334" y1="54" x2="346" y2="54" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowLc)" />
      <rect x="346" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="396" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">運用</text>
      <text x="396" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">更新・保守</text>
      <line x1="446" y1="54" x2="458" y2="54" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowLc)" />
      <rect x="458" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="508" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">回収</text>
      <text x="508" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">返却・退職</text>
      <line x1="558" y1="54" x2="570" y2="54" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowLc)" />
      <rect x="570" y="30" width="100" height="48" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="620" y="52" fill="var(--fg)" font-size="12" text-anchor="middle">廃棄</text>
      <text x="620" y="68" fill="var(--muted)" font-size="10" text-anchor="middle">データ消去</text>
      <rect x="10" y="120" width="660" height="70" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" />
      <text x="340" y="142" fill="var(--muted)" font-size="11" text-anchor="middle">全期間を通じて継続する横断的な管理</text>
      <text x="340" y="164" fill="var(--fg)" font-size="11" text-anchor="middle">資産管理(台帳) ・ 在庫管理 ・ 棚卸 ・ ライセンス管理 ・ セキュリティ管理</text>
      <text x="340" y="182" fill="var(--muted)" font-size="10" text-anchor="middle">「今どの段階か」に関わらず、常に把握・維持し続ける</text>
      </svg>
    </div>
  </body>
</html>
