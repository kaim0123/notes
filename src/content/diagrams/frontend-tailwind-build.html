<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 270" role="img" aria-label="Tailwindのビルド時の流れを示した図。左に複数のソースファイルが積まれており、その中に文字列としてユーティリティクラスが書かれている。中央のビルド工程がソースを走査して、登場したクラスの集合を取り出す。右で、その集合に含まれるクラスの定義だけからCSSが生成される。使っていないクラスの定義は最初から出力に含まれないため、ページ数が増えてもCSSは大きくならず、量は使う語彙の数で決まる。下部に、クラス名を文字列として組み立てると走査で見つからず生成されないという注意が添えられている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="46" width="150" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="70" font-size="11.5">ソース</text>
        <text x="36" y="94" font-size="10.5" class="muted">page.tsx</text>
        <text x="36" y="112" font-size="10.5" class="lbl">"flex gap-2 p-4"</text>
        <text x="36" y="132" font-size="10.5" class="muted">card.tsx</text>
        <text x="36" y="150" font-size="10.5" class="lbl">"rounded-lg p-4"</text>

        <line x1="170" y1="106" x2="204" y2="106" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="187" y="96" text-anchor="middle" font-size="10" class="muted">走査</text>

        <rect x="208" y="46" width="186" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="226" y="70" font-size="11.5">登場したクラスの集合</text>
        <text x="226" y="96" font-size="10.5" class="muted">flex / gap-2 / p-4 / rounded-lg</text>
        <text x="226" y="122" font-size="10.5" class="muted">重複は1つに畳まれる</text>
        <text x="226" y="146" font-size="10.5" class="muted">出てこなかったものは無い</text>

        <line x1="394" y1="106" x2="428" y2="106" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="411" y="96" text-anchor="middle" font-size="10" class="muted">生成</text>

        <rect x="432" y="46" width="188" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="448" y="70" font-size="11.5">配信されるCSS</text>
        <text x="448" y="96" font-size="10.5" class="muted">使った分の定義だけ</text>
        <text x="448" y="122" font-size="10.5" class="lbl">量はページ数ではなく</text>
        <text x="448" y="142" font-size="10.5" class="lbl">語彙の数で決まる</text>

        <rect x="20" y="192" width="600" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="40" y="216" font-size="11">⚠ 走査は「文字列として現れるか」しか見ない</text>
        <text x="40" y="238" font-size="10.5" class="muted">組み立てたクラス名は見つからない。分岐の各枝に完全なクラス名を書く</text>
      </svg>
    </div>
  </body>
</html>
