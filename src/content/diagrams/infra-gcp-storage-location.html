<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="保存先を置く範囲の選び方を3段階で示した図。1つのリージョンに置く形は、料金がいちばん安く、そのリージョンの中では複数の場所に複製されるため通常の障害には耐える。2つのリージョンにまたがる形は、片方のリージョンが丸ごと使えなくなっても読み書きを続けられ、地理的な距離も選べる。複数のリージョンにまたがる形は、広い地域からの読み出しが速くなり耐障害性も最も高いが、料金は上がり、書き込みの反映にも時間差が出る。どこから読むか、どこまでの障害に耐えたいかで選び、あとから変更するには全部を移すことになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="660" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="40" y="72" font-size="11">1つのリージョンに置く</text>
        <text x="40" y="90" font-size="9.5" class="muted">いちばん安い。リージョン内では複製され、通常の障害には耐える</text>
        <text x="660" y="82" font-size="10" text-anchor="end" class="accent">既定はここ</text>

        <rect x="20" y="114" width="660" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="136" font-size="11">2つのリージョンにまたがる</text>
        <text x="40" y="154" font-size="9.5" class="muted">片方が丸ごと使えなくなっても続けられる。距離も選べる</text>

        <rect x="20" y="178" width="660" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="200" font-size="11">複数のリージョンにまたがる</text>
        <text x="40" y="218" font-size="9.5" class="muted">広い地域から速く読める。耐障害性は最も高いが、料金と反映の遅れが増える</text>

        <text x="20" y="258" font-size="10.5" class="muted">選ぶ基準 ― どこから読むか、どこまでの障害に耐えたいか。</text>
        <text x="20" y="276" font-size="10.5" class="accent">後から変えるには全部を移すことになるので、作るときに決める。</text>
      </svg>
    </div>
  </body>
</html>
