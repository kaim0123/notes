<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 320" role="img" aria-label="GOTOだらけのコードと構造化されたコードの対比図。左は縦に並んだ命令の間を矢印が上下にランダムに飛び交い、実行経路が絡み合ってスパゲッティコードと呼ばれる状態を表す。右は順次・分岐・反復の3種類のブロックが積まれ、分岐は必ず合流し、反復は元の位置へ戻るという、1つの入口と1つの出口を持つ形に整理されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">GOTOだらけ</text>
        <text x="165" y="46" text-anchor="middle" font-size="11" class="muted">どこから来てどこへ飛ぶか読めない</text>

        <rect x="90" y="62" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="90" y="106" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="90" y="150" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="90" y="194" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="90" y="238" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />

        <path d="M240,77 C300,90 300,180 240,209" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <path d="M90,209 C30,190 30,110 90,121" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <path d="M240,121 C310,140 310,250 240,253" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <path d="M90,253 C20,230 20,70 90,77" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <path d="M240,165 C290,160 290,90 240,92" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <line x1="350" y1="30" x2="350" y2="290" stroke="var(--border)" stroke-width="1.2" />

        <text x="520" y="26" text-anchor="middle" font-size="12.5" font-weight="600">構造化</text>
        <text x="520" y="46" text-anchor="middle" font-size="11" class="muted">1つの入口・1つの出口を持つブロックだけ</text>

        <rect x="440" y="62" width="160" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="520" y="82" text-anchor="middle" font-size="11">順次</text>
        <line x1="520" y1="92" x2="520" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="400" y="110" width="110" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="455" y="130" text-anchor="middle" font-size="11">分岐 真</text>
        <rect x="530" y="110" width="110" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="585" y="130" text-anchor="middle" font-size="11">分岐 偽</text>
        <line x1="455" y1="140" x2="505" y2="164" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="585" y1="140" x2="535" y2="164" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="440" y="168" width="160" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="520" y="188" text-anchor="middle" font-size="11">合流</text>
        <line x1="520" y1="198" x2="520" y2="212" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="440" y="216" width="160" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="520" y="236" text-anchor="middle" font-size="11">反復</text>
        <path d="M440,231 C400,231 400,190 434,190" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <text x="340" y="312" text-anchor="middle" font-size="11" class="muted">
          任意のプログラムは順次・分岐・反復の3つだけで書ける(構造化定理)
        </text>
      </svg>
    </div>
  </body>
</html>
