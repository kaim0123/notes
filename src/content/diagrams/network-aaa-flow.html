<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 420"
        role="img"
        aria-label="AAAの図解。ネットワーク機器がAAAサーバーに対して、まず認証(あなたは誰か)、次に認可(何をしてよいか)、最後にアカウンティング(何をしたかの記録)という3段階のやり取りを行う。"
      >
        <defs>
          <marker
            id="arrowAaa"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="30" y="10" width="140" height="34" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600">利用者/機器</text>
        <rect x="450" y="10" width="150" height="34" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="525" y="32" text-anchor="middle" font-size="12" font-weight="600">AAAサーバー</text>

        <line x1="100" y1="44" x2="100" y2="390" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="525" y1="44" x2="525" y2="390" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" />

        <text x="310" y="70" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">① Authentication(認証) ― あなたは誰か</text>
        <line x1="100" y1="90" x2="525" y2="90" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowAaa)" />
        <text x="310" y="83" text-anchor="middle" font-size="10.5">ID/パスワードを送信</text>
        <line x1="525" y1="115" x2="100" y2="115" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowAaa)" />
        <text x="310" y="108" text-anchor="middle" font-size="10.5" class="muted">認証OK</text>

        <text x="310" y="155" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">② Authorization(認可) ― 何をしてよいか</text>
        <line x1="100" y1="175" x2="525" y2="175" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowAaa)" />
        <text x="310" y="168" text-anchor="middle" font-size="10.5">利用できる権限を問い合わせ</text>
        <line x1="525" y1="200" x2="100" y2="200" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowAaa)" />
        <text x="310" y="193" text-anchor="middle" font-size="10.5" class="muted">権限レベル15(特権)を許可</text>

        <text x="310" y="240" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">③ Accounting(アカウンティング) ― 何をしたか</text>
        <line x1="100" y1="260" x2="525" y2="260" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowAaa)" />
        <text x="310" y="253" text-anchor="middle" font-size="10.5">実行したコマンド・操作時刻を送信</text>

        <rect x="185" y="290" width="270" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="318" text-anchor="middle" font-size="12" font-weight="600" style="fill: var(--primary)">
          監査ログとして記録される
        </text>

        <text x="310" y="370" text-anchor="middle" font-size="11.5" class="muted">
          代表的なプロトコルにRADIUS(標準)とTACACS+(Cisco独自)がある
        </text>
      </svg>
    </div>
  </body>
</html>
