<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 540"
        role="img"
        aria-label="2相コミットの流れを示すシーケンス図。コーディネータ・参加者DB1・参加者DB2の3者が縦のライフラインで表される。第1フェーズ(Prepare)ではコーディネータが両参加者にコミットできるか問い合わせ、両参加者はログを書いたうえでYes(準備OK)を返す。全員がYesであることを確認した後、第2フェーズ(Commit)でコーディネータが両参加者にCommitを指示し、両参加者はACKを返して更新を確定する。1人でもNoを返した場合は全員にAbortが指示される。"
      >
        <defs>
          <marker
            id="arrowMuted"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowPrimary"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <!-- アクター -->
        <rect x="40" y="16" width="150" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">コーディネータ</text>

        <rect x="305" y="16" width="150" height="50" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="46" text-anchor="middle" font-size="13" font-weight="600">参加者DB1</text>

        <rect x="570" y="16" width="150" height="50" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="645" y="46" text-anchor="middle" font-size="13" font-weight="600">参加者DB2</text>

        <!-- ライフライン -->
        <line x1="115" y1="66" x2="115" y2="500" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 4" />
        <line x1="380" y1="66" x2="380" y2="500" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 4" />
        <line x1="645" y1="66" x2="645" y2="500" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 4" />

        <!-- フェーズ1 背景 -->
        <rect x="20" y="90" width="720" height="150" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 4" />
        <text x="36" y="112" font-size="12" font-weight="700" style="fill: var(--primary)">第1フェーズ: Prepare(準備)</text>

        <!-- Prepare? -->
        <path d="M115,132 L376,132" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <text x="245" y="126" text-anchor="middle" font-size="11" class="muted">① Prepare?</text>
        <path d="M115,150 L641,150" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <text x="380" y="144" text-anchor="middle" font-size="11" class="muted">① Prepare?</text>

        <!-- Yes応答 -->
        <path d="M380,182 L119,182" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowPrimary)" />
        <text x="245" y="176" text-anchor="middle" font-size="11" style="fill: var(--primary)">② Yes(準備OK)</text>
        <path d="M645,200 L119,200" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowPrimary)" />
        <text x="500" y="216" text-anchor="middle" font-size="11" style="fill: var(--primary)">② Yes(準備OK)</text>

        <text x="380" y="228" text-anchor="middle" font-size="10.5" class="muted">(応答前に各参加者はログを書き込む)</text>

        <!-- フェーズ2 背景 -->
        <rect x="20" y="256" width="720" height="150" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 4" />
        <text x="36" y="278" font-size="12" font-weight="700" style="fill: var(--primary)">第2フェーズ: Commit(確定)</text>

        <text x="380" y="300" text-anchor="middle" font-size="10.5" class="muted">全員がYesだったので、コーディネータがCommitを指示する</text>

        <!-- Commit指示 -->
        <path d="M115,320 L376,320" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <text x="245" y="314" text-anchor="middle" font-size="11" class="muted">③ Commit</text>
        <path d="M115,338 L641,338" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowMuted)" />
        <text x="380" y="332" text-anchor="middle" font-size="11" class="muted">③ Commit</text>

        <!-- ACK -->
        <path d="M380,370 L119,370" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowPrimary)" />
        <text x="245" y="364" text-anchor="middle" font-size="11" style="fill: var(--primary)">④ ACK(確定完了)</text>
        <path d="M645,388 L119,388" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowPrimary)" />
        <text x="500" y="404" text-anchor="middle" font-size="11" style="fill: var(--primary)">④ ACK(確定完了)</text>

        <text x="380" y="440" text-anchor="middle" font-size="11.5" font-weight="600">
          1人でもNoならCommitの代わりにAbort(ロールバック)を全員へ指示する
        </text>
        <text x="380" y="464" text-anchor="middle" font-size="11" class="muted">
          コーディネータや参加者がネットワーク分断で応答不能になると、他の処理が待たされ続ける「ブロッキング」が起こりうる
        </text>
      </svg>
    </div>
  </body>
</html>
