<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 340"
        role="img"
        aria-label="依存の向きで見たアーキテクチャの対比図。左のレイヤードアーキテクチャは、UI・業務ロジック・データアクセス・データベースの4段が縦に積まれ、矢印は常に上から下へ向かう。つまり業務ロジックがデータベースに依存する。右のドメイン中心アーキテクチャは同心円で、外側からインフラ(DB・Web)、ユースケース、中心にドメインが置かれ、矢印はすべて外側から中心へ向かう。ドメインが何にも依存しない中心になることを示す。"
      >
        <defs>
          <marker
            id="arrowDep"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowDepHi"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">レイヤード ― 依存は上から下へ</text>

        <rect x="55" y="50" width="220" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="75" text-anchor="middle" font-size="11.5">UI・API</text>
        <line x1="165" y1="90" x2="165" y2="106" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowDep)" />
        <rect x="55" y="110" width="220" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="135" text-anchor="middle" font-size="11.5">業務ロジック</text>
        <line x1="165" y1="150" x2="165" y2="166" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowDep)" />
        <rect x="55" y="170" width="220" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="195" text-anchor="middle" font-size="11.5">データアクセス</text>
        <line x1="165" y1="210" x2="165" y2="226" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowDep)" />
        <rect x="55" y="230" width="220" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="255" text-anchor="middle" font-size="11.5">データベース</text>

        <text x="165" y="292" text-anchor="middle" font-size="11" class="muted">業務ロジックがDBの都合に引きずられやすい</text>

        <line x1="350" y1="30" x2="350" y2="300" stroke="var(--border)" stroke-width="1.2" />

        <text x="530" y="26" text-anchor="middle" font-size="12.5" font-weight="600">ドメイン中心 ― 依存は外から内へ</text>

        <circle cx="530" cy="165" r="115" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <circle cx="530" cy="165" r="78" fill="var(--bg)" stroke="var(--border)" stroke-width="1.4" />
        <circle cx="530" cy="165" r="42" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />

        <text x="530" y="86" text-anchor="middle" font-size="10.5" class="muted">インフラ(DB・Web)</text>
        <text x="530" y="107" text-anchor="middle" font-size="10.5" class="muted">ユースケース</text>
        <text x="530" y="169" text-anchor="middle" font-size="11.5" font-weight="600">ドメイン</text>

        <line x1="530" y1="286" x2="530" y2="214" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowDepHi)" />
        <line x1="404" y1="165" x2="484" y2="165" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowDepHi)" />
        <line x1="656" y1="165" x2="576" y2="165" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowDepHi)" />

        <text x="530" y="312" text-anchor="middle" font-size="11" class="muted">ドメインは何にも依存せず、DBは差し替え可能な外側になる</text>

        <text x="350" y="334" text-anchor="middle" font-size="11" class="muted">
          どちらも「層に分ける」点は同じで、違うのは依存の矢印をどちらへ向けるか
        </text>
      </svg>
    </div>
  </body>
</html>
