<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="権限の判定がどの4要素で決まるかを示した図。誰が、何に対して、どの操作を、どんな条件のときに許されるのかという4つが揃って1つの許可になる。判定は既定ですべて拒否から始まり、どこかに明示的な許可があれば通る。ただし明示的な拒否が1つでもあれば、他にどれだけ許可があっても必ず拒否される。この順序があるため、広い許可を与えたうえで危険な操作だけを拒否で塞ぐ書き方が成立する。人だけでなくサービス自身にも同じ枠組みで権限を与えるため、鍵を配らずに済むという性質もここから来ている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="100" y="72" font-size="10.5" text-anchor="middle">誰が</text>
        <text x="100" y="92" font-size="9" text-anchor="middle" class="muted">利用者・役割</text>
        <text x="100" y="107" font-size="9" text-anchor="middle" class="muted">サービス自身も含む</text>

        <rect x="196" y="46" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="276" y="72" font-size="10.5" text-anchor="middle">何に</text>
        <text x="276" y="92" font-size="9" text-anchor="middle" class="muted">対象のリソース</text>
        <text x="276" y="107" font-size="9" text-anchor="middle" class="muted">バケット・テーブル等</text>

        <rect x="372" y="46" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="452" y="72" font-size="10.5" text-anchor="middle">どの操作を</text>
        <text x="452" y="92" font-size="9" text-anchor="middle" class="muted">読む・書く・消す</text>
        <text x="452" y="107" font-size="9" text-anchor="middle" class="muted">設定を変える</text>

        <rect x="548" y="46" width="192" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="644" y="72" font-size="10.5" text-anchor="middle">どんな条件で</text>
        <text x="644" y="92" font-size="9" text-anchor="middle" class="muted">送信元・時間帯・多要素認証</text>
        <text x="644" y="107" font-size="9" text-anchor="middle" class="muted">タグの一致など</text>

        <text x="380" y="146" font-size="10.5" text-anchor="middle" class="muted">この4つが揃って、1つの許可になる</text>

        <rect x="20" y="164" width="230" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="188" font-size="10.5" text-anchor="middle">1. 既定はすべて拒否</text>
        <text x="135" y="212" font-size="9.5" text-anchor="middle" class="muted">何も書かなければ、何もできない</text>
        <text x="135" y="234" font-size="9.5" text-anchor="middle" class="muted">足していく方式</text>

        <rect x="265" y="164" width="230" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="188" font-size="10.5" text-anchor="middle">2. 明示的な許可で通る</text>
        <text x="380" y="212" font-size="9.5" text-anchor="middle" class="muted">どこかに許可があれば実行できる</text>
        <text x="380" y="234" font-size="9.5" text-anchor="middle" class="muted">複数の経路から与えられる</text>

        <rect x="510" y="164" width="230" height="90" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="625" y="188" font-size="10.5" text-anchor="middle" class="accent">3. 明示的な拒否が最優先</text>
        <text x="625" y="212" font-size="9.5" text-anchor="middle" class="muted">1つでもあれば、必ず拒否される</text>
        <text x="625" y="234" font-size="9.5" text-anchor="middle" class="muted">広く許して危険だけ塞げる</text>

        <text x="20" y="286" font-size="10.5" class="muted">サービス自身にも同じ枠組みで権限を与えられる ― だから鍵を配らずに済む。</text>
      </svg>
    </div>
  </body>
</html>
