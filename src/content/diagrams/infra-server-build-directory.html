<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="ディレクトリサービスによる集中管理の考え方を示した図。中央のドメインコントローラーが、社員のアカウント、組織が貸与する端末、適用する規則という3種類の情報を1か所で持つ。利用者は1つのアカウントで社内の複数のシステムにログインでき、端末は台帳として把握され、パスワードの強度やソフトウェアの利用制限といった規則は部署単位でまとめて適用される。これが無いと、システムごと・端末ごとに同じ設定を繰り返すことになり、退職者のアカウントが消し漏れるといった事故が起きやすくなる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="250" y="100" width="200" height="80" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="130" font-size="12" text-anchor="middle">ドメインコントローラー</text>
        <text x="350" y="150" font-size="9.5" text-anchor="middle" class="muted">誰が・どの端末で・何をしてよいか</text>
        <text x="350" y="167" font-size="9.5" text-anchor="middle" class="muted">を1か所で持つ</text>

        <rect x="30" y="40" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="115" y="64" font-size="10.5" text-anchor="middle">ユーザー</text>
        <text x="115" y="82" font-size="9" text-anchor="middle" class="muted">1アカウントで複数システムへ</text>

        <rect x="30" y="180" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="115" y="204" font-size="10.5" text-anchor="middle">端末</text>
        <text x="115" y="222" font-size="9" text-anchor="middle" class="muted">貸与したPCを台帳で把握</text>

        <rect x="500" y="40" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="585" y="64" font-size="10.5" text-anchor="middle">規則(ポリシー)</text>
        <text x="585" y="82" font-size="9" text-anchor="middle" class="muted">部署単位でまとめて適用</text>

        <rect x="500" y="180" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="585" y="204" font-size="10.5" text-anchor="middle">社内システム</text>
        <text x="585" y="222" font-size="9" text-anchor="middle" class="muted">ここに認証を委ねる</text>

        <line x1="204" y1="76" x2="272" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="204" y1="204" x2="272" y2="174" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="452" y1="120" x2="496" y2="82" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="452" y1="158" x2="496" y2="196" stroke="var(--primary)" marker-end="url(#arp)" />

        <text x="350" y="256" font-size="10.5" text-anchor="middle" class="muted">中央が無いと、システムごと・端末ごとに同じ設定を繰り返すことになる。</text>
        <text x="350" y="274" font-size="10.5" text-anchor="middle" class="accent">退職者のアカウントが消し漏れるのも、たいてい台帳が分かれているとき。</text>
      </svg>
    </div>
  </body>
</html>
