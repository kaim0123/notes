<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="監視の分野が2種類の別々の記録から成り立っていることを示した図。片方はシステムの今の状態を表す数値とログで、どれだけ使われているか、遅くなっていないか、エラーが出ていないかを答える。もう片方は誰がいつどの操作を行ったかという操作の記録で、設定が変わった経緯や、意図しない権限の使われ方を後から追うために使う。前者は障害に気づくため、後者は監査と原因究明のためにあり、目的も保存の期間も違う。障害の調査では、状態の変化と操作の記録を時刻で突き合わせると原因に早くたどり着ける。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="320" height="150" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="180" y="78" font-size="11.5" text-anchor="middle">今の状態</text>
        <text x="180" y="102" font-size="9.5" text-anchor="middle" class="muted">数値・ログ・アラーム</text>
        <rect x="40" y="116" width="280" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="135" font-size="9.5" text-anchor="middle" class="muted">どれだけ使われているか / 遅くないか</text>
        <rect x="40" y="150" width="280" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="169" font-size="9.5" text-anchor="middle" class="muted">しきい値を超えたら知らせる</text>

        <rect x="360" y="50" width="320" height="150" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="78" font-size="11.5" text-anchor="middle">過去の操作</text>
        <text x="520" y="102" font-size="9.5" text-anchor="middle" class="muted">誰が・いつ・何をしたか</text>
        <rect x="380" y="116" width="280" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="135" font-size="9.5" text-anchor="middle" class="muted">設定が変わった経緯を追える</text>
        <rect x="380" y="150" width="280" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="169" font-size="9.5" text-anchor="middle" class="muted">意図しない権限の使われ方に気づける</text>

        <text x="180" y="224" font-size="10" text-anchor="middle" class="accent">障害に気づくため</text>
        <text x="520" y="224" font-size="10" text-anchor="middle" class="accent">監査と原因究明のため</text>

        <text x="20" y="258" font-size="10.5" class="muted">調査では、状態の変化と操作の記録を時刻で突き合わせる ― 「その時刻に誰かが設定を変えていないか」。</text>
      </svg>
    </div>
  </body>
</html>
