<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="OAuth 2.0とOpenID Connectの役割の違いを示した図。上の段はOAuthで、利用者がアプリに対して、自分の代わりに写真サービスへアクセスする権限を与える流れになっている。アプリが受け取るのはアクセストークンで、これは特定の資源にアクセスしてよいという権限の証明にすぎず、その利用者が誰であるかは保証していない。下の段はOpenID Connectで、同じ流れの上にIDトークンが追加される。IDトークンには利用者の識別子が入り、発行元の署名が付いているため、アプリは誰がログインしたのかを確かめられる。ログイン機能を作るならOAuth単体では足りず、OpenID Connectが要るのはこのためである。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="42" font-size="10.5" class="muted">OAuth 2.0 ― 権限を預ける仕組み</text>

        <rect x="20" y="58" width="130" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="85" y="86" font-size="10" text-anchor="middle">利用者</text>
        <rect x="240" y="58" width="130" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="305" y="86" font-size="10" text-anchor="middle">アプリ</text>
        <rect x="460" y="58" width="150" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="535" y="80" font-size="10" text-anchor="middle">写真サービス</text>
        <text x="535" y="96" font-size="8.5" text-anchor="middle" class="muted">資源を持っている側</text>

        <line x1="154" y1="81" x2="236" y2="81" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="195" y="73" font-size="8.5" text-anchor="middle" class="muted">許可する</text>
        <line x1="374" y1="81" x2="456" y2="81" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="415" y="73" font-size="8.5" text-anchor="middle" class="muted">代わりに読む</text>

        <rect x="630" y="58" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="685" y="80" font-size="9" text-anchor="middle" class="muted">アクセストークン</text>
        <text x="685" y="96" font-size="9" text-anchor="middle">権限の証明</text>

        <text x="16" y="140" font-size="10" class="muted">アプリが受け取ったのは「入ってよい」という許可だけ。誰が許可したのかは、この時点では保証されていない。</text>

        <line x1="16" y1="158" x2="744" y2="158" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

        <text x="16" y="186" font-size="10.5" class="accent">OpenID Connect ― その上に「誰か」を載せる</text>

        <rect x="20" y="202" width="130" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="85" y="230" font-size="10" text-anchor="middle">利用者</text>
        <rect x="240" y="202" width="130" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="305" y="230" font-size="10" text-anchor="middle">アプリ</text>
        <rect x="460" y="202" width="150" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="535" y="224" font-size="10" text-anchor="middle">IdP(発行元)</text>
        <text x="535" y="240" font-size="8.5" text-anchor="middle" class="muted">Google など</text>

        <line x1="154" y1="225" x2="236" y2="225" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="456" y1="225" x2="374" y2="225" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="415" y="217" font-size="8.5" text-anchor="middle" class="accent">IDトークンを返す</text>

        <rect x="630" y="202" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="685" y="224" font-size="9" text-anchor="middle" class="accent">IDトークン</text>
        <text x="685" y="240" font-size="9" text-anchor="middle" class="muted">誰かの証明</text>

        <line x1="16" y1="270" x2="744" y2="270" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="292" font-size="10.5" class="muted">「OAuthでログイン」は、正確には「OAuthの上でOpenID Connectを使ってログイン」を指している。</text>
        <text x="16" y="314" font-size="10.5" class="accent">OAuth単体で本人確認を済ませたつもりになる誤用が広まったことが、OIDCが必要になった理由そのもの。</text>
      </svg>
    </div>
  </body>
</html>
