<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 700 290" role="img" aria-label="構造に関する5つのパターンを、何を間に挟むかで整理した図。Adapterは形の合わないものを変換して繋ぐ、Decoratorは元のものを包んで機能を足す、Facadeは複数のものをまとめて1つの窓口にする、Proxyは本物の手前に代理を立てる、Compositeは1つと集合を同じ形で扱う。いずれも呼び出し側と本体の間に何かを挟むという発想のバリエーションである。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="350" y="26" text-anchor="middle" font-size="11.5" class="muted">どれも「呼び出し側と本体の間に、何かを挟む」バリエーション</text>

        <rect x="30" y="50" width="190" height="82" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="125" y="74" text-anchor="middle" font-size="11.5" font-weight="600">Adapter</text>
        <text x="125" y="96" text-anchor="middle" font-size="10" class="muted">形が合わないものを</text>
        <text x="125" y="114" text-anchor="middle" font-size="10" class="muted">変換して繋ぐ</text>

        <rect x="250" y="50" width="190" height="82" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="345" y="74" text-anchor="middle" font-size="11.5" font-weight="600">Decorator</text>
        <text x="345" y="96" text-anchor="middle" font-size="10" class="muted">元のものを包んで</text>
        <text x="345" y="114" text-anchor="middle" font-size="10" class="muted">機能を足す</text>

        <rect x="470" y="50" width="190" height="82" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="565" y="74" text-anchor="middle" font-size="11.5" font-weight="600">Facade</text>
        <text x="565" y="96" text-anchor="middle" font-size="10" class="muted">複数をまとめて</text>
        <text x="565" y="114" text-anchor="middle" font-size="10" class="muted">1つの窓口にする</text>

        <rect x="140" y="152" width="190" height="82" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="235" y="176" text-anchor="middle" font-size="11.5" font-weight="600">Proxy</text>
        <text x="235" y="198" text-anchor="middle" font-size="10" class="muted">本物の手前に代理を立て</text>
        <text x="235" y="216" text-anchor="middle" font-size="10" class="muted">アクセスを制御する</text>

        <rect x="360" y="152" width="190" height="82" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="455" y="176" text-anchor="middle" font-size="11.5" font-weight="600">Composite</text>
        <text x="455" y="198" text-anchor="middle" font-size="10" class="muted">1つと集合(木)を</text>
        <text x="455" y="216" text-anchor="middle" font-size="10" class="muted">同じ形で扱う</text>

        <text x="350" y="272" text-anchor="middle" font-size="11" class="muted">
          挟むものが変換なのか、包みなのか、窓口なのか、代理なのかで名前が変わる
        </text>
      </svg>
    </div>
  </body>
</html>
