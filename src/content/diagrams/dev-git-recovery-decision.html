<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="やり直しの方法を選ぶ判断の分かれ道を示した図。最初の問いは、その変更をすでに共有したかどうか。まだ手元だけで共有していない場合は履歴を作り直してよく、直前のコミットを直すなら修正の操作、複数のコミットをまとめ直すなら履歴を戻す操作、順序やメッセージを整えるなら対話的な積み直しを使う。すでに共有している場合は履歴を作り直してはならず、逆の変更を行う新しいコミットを積んで打ち消す。さらに、消えたように見える作業を探したい場合は、移動の記録から位置を特定して復旧できる。図の下には共通する原則として、不安ならまずコミットするという一文が置かれている。コミットさえされていれば、作業ツリーの変更を捨てる操作以外ではほぼすべてを取り戻せる。"
      >
        <defs>
          <marker id="argr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="212" y="34" width="216" height="44" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="320" y="52" text-anchor="middle" font-size="12" font-weight="600">その変更は共有済みか</text>
        <text x="320" y="70" text-anchor="middle" font-size="10.5" class="muted">push したか、他の人が取得したか</text>

        <line x1="240" y1="78" x2="160" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#argr)" />
        <text x="176" y="98" text-anchor="middle" font-size="10.5" class="lbl">いいえ</text>
        <line x1="400" y1="78" x2="480" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#argr)" />
        <text x="464" y="98" text-anchor="middle" font-size="10.5" class="muted">はい</text>

        <rect x="16" y="110" width="288" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="160" y="132" text-anchor="middle" font-size="11.5" class="lbl">履歴を作り直してよい</text>
        <line x1="34" y1="142" x2="286" y2="142" stroke="var(--border)" stroke-width="1" />
        <text x="34" y="164" font-size="10.5" class="muted">直前のコミットを直す</text>
        <text x="286" y="164" text-anchor="end" font-size="10.5" font-family="monospace">commit --amend</text>
        <text x="34" y="188" font-size="10.5" class="muted">まとめ直す・取り消す</text>
        <text x="286" y="188" text-anchor="end" font-size="10.5" font-family="monospace">reset --soft</text>
        <text x="34" y="212" font-size="10.5" class="muted">順序やメッセージを整える</text>
        <text x="286" y="212" text-anchor="end" font-size="10.5" font-family="monospace">rebase -i</text>

        <rect x="336" y="110" width="288" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" />
        <text x="480" y="132" text-anchor="middle" font-size="11.5" class="muted">作り直さない</text>
        <line x1="354" y1="142" x2="606" y2="142" stroke="var(--border)" stroke-width="1" />
        <text x="354" y="164" font-size="10.5" class="muted">逆の変更を積んで打ち消す</text>
        <text x="606" y="164" text-anchor="end" font-size="10.5" font-family="monospace">revert</text>
        <text x="354" y="192" font-size="10.5" class="lbl">履歴は消さず、前に進んで直す</text>
        <text x="354" y="212" font-size="10.5" class="muted">共有ブランチで唯一安全なやり直し</text>

        <line x1="16" y1="248" x2="624" y2="248" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="268" font-size="11" class="muted">消えたように見える作業は、移動の記録から位置を特定して救出できる</text>
        <text x="16" y="286" font-size="11" class="lbl">共通する原則は1つ ― 不安なら、まずコミットする</text>
      </svg>
    </div>
  </body>
</html>
