<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="応答時間の分布と、代表値の置かれる位置を示した図。多くのリクエストは速い側に固まり、遅い側へ細く長い裾を引く。この形では平均は裾に引っ張られて実感とずれ、中央値は半分の利用者が体験する値を示す。95パーセンタイルは下から95%が収まる値で、遅い側5%の入口にあたり、99パーセンタイルはさらに外側になる。平均だけを見ていると、大多数は快適なのに一部の利用者だけが極端に遅い状態を見落とすため、中央値と高いパーセンタイルを並べて読む。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <path d="M40,220 C90,220 100,70 150,70 C200,70 210,150 260,175 C330,208 420,214 700,218" fill="none" stroke="var(--border)" stroke-width="1.6" />
        <line x1="40" y1="220" x2="720" y2="220" stroke="var(--border)" />
        <text x="720" y="240" font-size="10" text-anchor="end" class="muted">応答時間 →</text>

        <line x1="150" y1="60" x2="150" y2="230" stroke="var(--fg)" stroke-dasharray="4 3" />
        <text x="150" y="50" font-size="10.5" text-anchor="middle">中央値(p50)</text>
        <text x="150" y="252" font-size="9" text-anchor="middle" class="muted">半分の人はここより速い</text>

        <line x1="240" y1="90" x2="240" y2="230" stroke="var(--muted)" stroke-dasharray="4 3" />
        <text x="240" y="80" font-size="10.5" text-anchor="middle" class="muted">平均</text>
        <text x="240" y="252" font-size="9" text-anchor="middle" class="muted">裾に引っ張られる</text>

        <line x1="430" y1="120" x2="430" y2="230" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="430" y="110" font-size="10.5" text-anchor="middle" class="accent">p95</text>
        <text x="430" y="252" font-size="9" text-anchor="middle" class="muted">遅い側5%の入口</text>

        <line x1="600" y1="150" x2="600" y2="230" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="600" y="140" font-size="10.5" text-anchor="middle" class="accent">p99</text>
        <text x="600" y="252" font-size="9" text-anchor="middle" class="muted">さらに外側の1%</text>

        <text x="40" y="284" font-size="10.5" class="muted">平均だけを見ると「大多数は快適なのに一部だけ極端に遅い」状態を見落とす。中央値と高い分位数を並べる。</text>
      </svg>
    </div>
  </body>
</html>
