<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="命令サイクルの流れ図。主記憶から命令を取り出すフェッチ、命令の意味を解読するデコード、演算装置で処理する実行、結果を記憶へ書き戻す書き戻しの4段階が左から右へ順に並び、書き戻しの後はプログラムカウンタを進めて再びフェッチへ戻る繰り返しになっている。フェッチは主記憶から命令を受け取り、書き戻しは結果を主記憶へ返す。"
      >
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- 主記憶 -->
        <rect x="280" y="18" width="200" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="42" text-anchor="middle" font-size="14" font-weight="600">主記憶</text>
        <text x="380" y="60" text-anchor="middle" font-size="11" class="muted">プログラムの命令とデータ</text>

        <!-- CPU 枠 -->
        <rect x="14" y="105" width="732" height="190" rx="10" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="28" y="126" font-size="12" class="muted">CPU</text>

        <!-- 4段階 -->
        <rect x="30" y="140" width="155" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="107" y="170" text-anchor="middle" font-size="14" font-weight="600">フェッチ</text>
        <text x="107" y="190" text-anchor="middle" font-size="11" class="muted">命令を取り出す</text>

        <rect x="215" y="140" width="155" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="292" y="170" text-anchor="middle" font-size="14" font-weight="600">デコード</text>
        <text x="292" y="190" text-anchor="middle" font-size="11" class="muted">命令を解読する</text>

        <rect x="400" y="140" width="155" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="477" y="170" text-anchor="middle" font-size="14" font-weight="600">実行</text>
        <text x="477" y="190" text-anchor="middle" font-size="11" class="muted">演算装置で処理する</text>

        <rect x="585" y="140" width="155" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="662" y="170" text-anchor="middle" font-size="14" font-weight="600">書き戻し</text>
        <text x="662" y="190" text-anchor="middle" font-size="11" class="muted">結果を格納する</text>

        <!-- 段階間の矢印 -->
        <line x1="185" y1="175" x2="213" y2="175" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <line x1="370" y1="175" x2="398" y2="175" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <line x1="555" y1="175" x2="583" y2="175" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- 主記憶とのやり取り -->
        <path d="M300,70 C 220,95 150,110 107,138" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="150" y="106" font-size="11.5" class="muted">命令</text>
        <path d="M662,138 C 620,110 545,95 466,70" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="590" y="106" font-size="11.5" class="muted">結果</text>

        <!-- 次の命令へ戻るループ -->
        <path d="M662,210 L 662,262 L 107,262 L 107,212" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" color="var(--muted)" />
        <text x="384" y="284" text-anchor="middle" font-size="11.5" class="muted">プログラムカウンタを進めて次の命令へ ― これをひたすら繰り返す</text>
      </svg>
    </div>
  </body>
</html>
