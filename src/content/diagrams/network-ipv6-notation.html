<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="IPv6アドレスの省略表記の図解。元のアドレス2001:0db8:0000:0000:0000:ff00:0042:8329は、まず各グループの先頭の0を省略して2001:db8:0:0:0:ff00:42:8329になり、次に連続する0のグループを1箇所だけ::に置き換えて2001:db8::ff00:42:8329という最終形になる。"
      >
        <defs>
          <marker
            id="arrowV6"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="350" y="20" text-anchor="middle" font-size="11" class="muted">元のアドレス(省略無し)</text>
        <rect x="60" y="30" width="580" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="59" text-anchor="middle" font-size="14" class="mono">2001:0db8:0000:0000:0000:ff00:0042:8329</text>

        <line x1="350" y1="76" x2="350" y2="115" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowV6)" />
        <text x="365" y="99" font-size="11" class="muted">①各グループの先頭の0を省略</text>

        <rect x="130" y="120" width="440" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="149" text-anchor="middle" font-size="14" class="mono">2001:db8:0:0:0:ff00:42:8329</text>

        <line x1="350" y1="166" x2="350" y2="205" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowV6)" />
        <text x="365" y="189" font-size="11" class="muted">②連続する0のグループを::に(1箇所だけ)</text>

        <rect x="220" y="210" width="260" height="50" rx="8" fill="var(--primary)" />
        <text x="350" y="242" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill: var(--primary-fg)">2001:db8::ff00:42:8329</text>

        <text x="350" y="295" text-anchor="middle" font-size="11.5" class="muted">
          ::は1つのアドレスにつき1回だけ ― 2回使うと0がいくつ省略されたか分からなくなる
        </text>
      </svg>
    </div>
  </body>
</html>
