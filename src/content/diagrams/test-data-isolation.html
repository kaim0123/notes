<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 320"
        role="img"
        aria-label="テスト同士をデータベース上で隔離する4つの方式を、速さと並列実行の可否で比べた図。1つ目はトランザクションで巻き戻す方式で、各テストをトランザクションの中で実行し最後に戻す。最も速いが、テスト対象自身がトランザクションを張る場合は噛み合わない。2つ目はテストごとに対象テーブルを空にする方式で、速く分かりやすいが、同じデータベースを共有したまま並列実行すると互いのデータを消し合って衝突する。3つ目はワーカーごとにスキーマやデータベースを分ける方式で、速度は普通だが並列実行が安全にできる。4つ目は実行のたびにコンテナを立ち上げる方式で、最も遅いが最も確実で、本番と同じ製品と同じバージョンを保証できる。実務では、ワーカーごとにデータベースを分けたうえで各テストはトランザクションで巻き戻す、という組み合わせが扱いやすい、と図の下部に記されている。"
      >
        <text x="16" y="26" font-size="11" class="muted">テスト間で状態が漏れなければ、実行順序に依存する不具合は原理的に起きない</text>

        <text x="30" y="52" font-size="9" class="muted">方式</text>
        <text x="206" y="52" font-size="9" class="muted">やり方</text>
        <text x="545" y="52" font-size="9" text-anchor="middle" class="muted">速さ</text>
        <text x="641" y="52" font-size="9" text-anchor="middle" class="muted">並列実行</text>
        <line x1="16" y1="60" x2="684" y2="60" stroke="var(--border)" stroke-width="1" />

        <rect x="16" y="66" width="174" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="30" y="88" font-size="9.5" class="accent">トランザクションで</text>
        <text x="30" y="104" font-size="9.5" class="accent">巻き戻す</text>
        <text x="206" y="88" font-size="9" class="muted">各テストをトランザクション内で</text>
        <text x="206" y="104" font-size="9" class="muted">実行し、最後に戻す</text>
        <rect x="505" y="83" width="80" height="12" rx="3" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="641" y="88" font-size="8.5" text-anchor="middle" class="muted">対象が張ると</text>
        <text x="641" y="102" font-size="8.5" text-anchor="middle" class="muted">噛み合わない</text>

        <rect x="16" y="124" width="174" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="154" font-size="9.5" class="muted">テストごとに削除</text>
        <text x="206" y="146" font-size="9" class="muted">前後で対象テーブルを空にする</text>
        <text x="206" y="162" font-size="9" class="muted">分かりやすい</text>
        <rect x="505" y="141" width="64" height="12" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="641" y="152" font-size="8.5" text-anchor="middle" class="muted">衝突する</text>

        <rect x="16" y="182" width="174" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="30" y="204" font-size="9.5" class="accent">ワーカーごとに</text>
        <text x="30" y="220" font-size="9.5" class="accent">DBを分ける</text>
        <text x="206" y="204" font-size="9" class="muted">並列ワーカーごとに</text>
        <text x="206" y="220" font-size="9" class="muted">別スキーマ / 別DBを使う</text>
        <rect x="505" y="201" width="44" height="12" rx="3" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="641" y="211" font-size="8.5" text-anchor="middle" class="accent">できる</text>

        <rect x="16" y="240" width="174" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="270" font-size="9.5" class="muted">都度コンテナを起動</text>
        <text x="206" y="262" font-size="9" class="muted">実行のたびにDBを立ち上げる</text>
        <text x="206" y="278" font-size="9" class="muted">本番と同じ製品・同じバージョン</text>
        <rect x="505" y="259" width="20" height="12" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="641" y="269" font-size="8.5" text-anchor="middle" class="muted">最も確実</text>

        <text x="16" y="312" font-size="10.5" class="accent">実務での扱いやすい組み合わせ ― ワーカーごとにDBを分け、各テストはトランザクションで巻き戻す。</text>
      </svg>
    </div>
  </body>
</html>
