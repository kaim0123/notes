<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="独自ドメインのメールをCloudflareで扱うときの流れを示した図。送信者からのメールは、DNSのMXレコードに従ってCloudflareへ届く。Email Routingはそれを設定した転送先、たとえば普段使っているGmailの受信箱へそのまま転送する。Email Workersを挟めば、1通ごとにコードで内容を見て、転送先の振り分けや拒否ができる。逆にアプリから通知メールを出す側はEmail Sendingが担う。ここで扱えるのは転送と送信であり、メールを溜めて読む受信箱そのものは提供されないため、読む場所は転送先のメールサービスが受け持つ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="82" font-size="10.5" text-anchor="middle">送信者</text>
        <text x="75" y="98" font-size="9" text-anchor="middle" class="muted">外部から届く</text>

        <line x1="134" y1="83" x2="186" y2="83" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="160" y="72" font-size="9" text-anchor="middle" class="muted">MX</text>

        <rect x="190" y="44" width="230" height="130" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="305" y="66" font-size="11.5" text-anchor="middle">Cloudflare</text>
        <rect x="206" y="76" width="198" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="305" y="96" font-size="10.5" text-anchor="middle" class="muted">Email Routing ― 転送する</text>
        <rect x="206" y="112" width="198" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="305" y="132" font-size="10.5" text-anchor="middle" class="muted">Email Workers ― 1通ずつ処理</text>
        <text x="305" y="162" font-size="9.5" text-anchor="middle" class="muted">振り分け・拒否・自動返信</text>

        <line x1="424" y1="90" x2="516" y2="90" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="520" y="60" width="160" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="600" y="84" font-size="10.5" text-anchor="middle">普段の受信箱</text>
        <text x="600" y="102" font-size="9" text-anchor="middle" class="muted">Gmailなど(読む場所)</text>

        <rect x="20" y="196" width="150" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="218" font-size="10.5" text-anchor="middle">自分のアプリ</text>
        <text x="95" y="234" font-size="9" text-anchor="middle" class="muted">通知・認証コード</text>
        <line x1="174" y1="219" x2="238" y2="219" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="242" y="196" width="200" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="342" y="218" font-size="10.5" text-anchor="middle">Email Sending</text>
        <text x="342" y="234" font-size="9" text-anchor="middle" class="muted">Workers / REST API / SMTP</text>
        <line x1="446" y1="219" x2="510" y2="219" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="600" y="223" font-size="10.5" text-anchor="middle" class="muted">受け取る相手へ</text>

        <text x="20" y="268" font-size="10" class="muted">扱えるのは「転送」と「送信」。メールを溜めて読む受信箱そのものは提供されない。</text>
      </svg>
    </div>
  </body>
</html>
