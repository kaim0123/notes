<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="1つのIPアドレスで世界中からの通信を受け、最も近い拠点へ届ける仕組みを示した図。利用者がどこにいても同じアドレスに接続するが、経路の仕組みによって最寄りの拠点に着き、そこから最も近い健全なサービスへ転送される。ある地域のサービスが落ちていれば、その地域からの通信も別の地域の健全なサービスへ回される。地域ごとに別のアドレスを配って切り替える方式と違い、名前解決の保持時間に左右されないため、切り替わりが速い。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="80" font-size="10" text-anchor="middle">利用者(日本)</text>
        <text x="80" y="96" font-size="9" text-anchor="middle" class="muted">同じアドレスへ</text>
        <rect x="20" y="130" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="150" font-size="10" text-anchor="middle">利用者(欧州)</text>
        <text x="80" y="166" font-size="9" text-anchor="middle" class="muted">同じアドレスへ</text>
        <rect x="20" y="200" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="220" font-size="10" text-anchor="middle">利用者(米国)</text>
        <text x="80" y="236" font-size="9" text-anchor="middle" class="muted">同じアドレスへ</text>

        <line x1="146" y1="83" x2="216" y2="130" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="146" y1="153" x2="216" y2="150" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="146" y1="223" x2="216" y2="170" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="222" y="120" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="307" y="144" font-size="10.5" text-anchor="middle">1つのアドレス</text>
        <text x="307" y="164" font-size="9" text-anchor="middle" class="muted">最寄りの拠点で受ける</text>

        <line x1="398" y1="136" x2="458" y2="86" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="398" y1="150" x2="458" y2="150" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="398" y1="164" x2="458" y2="214" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />

        <rect x="464" y="62" width="216" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="572" y="82" font-size="10" text-anchor="middle">アジアのサービス</text>
        <text x="572" y="99" font-size="9" text-anchor="middle" class="muted">健全 ― ここへ回す</text>
        <rect x="464" y="126" width="216" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="572" y="146" font-size="10" text-anchor="middle">欧州のサービス</text>
        <text x="572" y="163" font-size="9" text-anchor="middle" class="muted">健全 ― ここへ回す</text>
        <rect x="464" y="190" width="216" height="48" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="572" y="210" font-size="10" text-anchor="middle" class="muted">米国のサービス</text>
        <text x="572" y="227" font-size="9" text-anchor="middle" class="accent">落ちている → 別地域へ回される</text>

        <text x="20" y="278" font-size="10.5" class="muted">地域ごとに別のアドレスを配る方式と違い、名前解決の保持時間に左右されないので切り替わりが速い。</text>
      </svg>
    </div>
  </body>
</html>
