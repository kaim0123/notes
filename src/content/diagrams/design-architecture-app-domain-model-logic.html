<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="業務ロジックの置き場所を比べた図。左のTransaction Scriptでは、注文キャンセルの手続きの中に「発送済みならキャンセル不可」という判定が直接書かれており、管理画面やバッチからも同じ処理を呼びたくなると、同じ判定があちこちにコピーされる。右のDomain Modelでは、その判定が注文オブジェクトのcancelメソッドの中に閉じており、どこから呼んでも同じ判定が保証される。呼び出し側は何を確認すべきかを知らなくてよい。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="170" y="26" text-anchor="middle" font-size="12.5" font-weight="600">Transaction Script</text>

        <rect x="40" y="46" width="260" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="170" y="68" text-anchor="middle" font-size="11">注文キャンセルの手続き</text>
        <rect x="58" y="78" width="224" height="32" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="170" y="98" text-anchor="middle" font-size="9.5" class="hi">発送済みならキャンセル不可</text>

        <rect x="40" y="140" width="260" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="170" y="162" text-anchor="middle" font-size="11">管理画面のキャンセル処理</text>
        <rect x="58" y="172" width="224" height="32" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="4 3" />
        <text x="170" y="192" text-anchor="middle" font-size="9.5" class="hi">同じ判定がコピーされる</text>

        <text x="170" y="250" text-anchor="middle" font-size="11" class="muted">単純なうちは最も分かりやすいが、</text>
        <text x="170" y="268" text-anchor="middle" font-size="11" class="muted">呼び出し口が増えると判定が散らばる</text>

        <line x1="350" y1="30" x2="350" y2="280" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="26" text-anchor="middle" font-size="12.5" font-weight="600">Domain Model</text>

        <rect x="390" y="46" width="110" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="445" y="72" text-anchor="middle" font-size="10">API</text>
        <rect x="520" y="46" width="130" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="585" y="72" text-anchor="middle" font-size="10">管理画面 / バッチ</text>

        <line x1="445" y1="88" x2="490" y2="132" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="585" y1="88" x2="540" y2="132" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="400" y="136" width="240" height="80" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="520" y="160" text-anchor="middle" font-size="11" font-weight="600">注文オブジェクト</text>
        <rect x="418" y="170" width="204" height="34" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3" />
        <text x="520" y="185" text-anchor="middle" font-size="9.5" class="mono">cancel()</text>
        <text x="520" y="198" text-anchor="middle" font-size="8.5" class="muted">判定はこの中だけに閉じる</text>

        <text x="510" y="250" text-anchor="middle" font-size="11" class="muted">どこから呼んでも同じ判定が保証され、</text>
        <text x="510" y="268" text-anchor="middle" font-size="11" class="muted">条件が増えても変更箇所は1つで済む</text>
      </svg>
    </div>
  </body>
</html>
