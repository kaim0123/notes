<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 260"
        role="img"
        aria-label="プロトタイプチェーンをたどる様子を示した図。左のオブジェクトcは自分自身にcountというデータだけを持っている。c.next()を呼ぶと、まず自分自身にnextがあるかを探すが見つからない。次に__proto__のリンクをたどってcounterProtoを探すと、そこにnextメソッドが見つかるので、それを借りて実行する。counterProtoにも無ければ、さらにその先のObject.prototypeをたどり、そこにも無ければnullに行き着いて未定義となる。100個のカウンタを作っても、nextはcounterProtoに1つ置かれているだけで全員が共有する。各オブジェクトが自分で持つのはcountだけ。"
      >
        <defs>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="lbl">c.next() を呼ぶと、見つかるまで順にたどる</text>

        <rect x="16" y="44" width="168" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="100" y="68" text-anchor="middle" font-size="12.5" font-weight="600">オブジェクト c</text>
        <text x="100" y="90" text-anchor="middle" font-size="11" font-family="monospace" class="muted">count: 0</text>
        <text x="100" y="110" text-anchor="middle" font-size="10.5" class="muted">next は持っていない</text>

        <line x1="184" y1="82" x2="234" y2="82" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="209" y="72" text-anchor="middle" font-size="10" class="muted">__proto__</text>

        <rect x="240" y="44" width="168" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="324" y="68" text-anchor="middle" font-size="12.5" font-weight="600">counterProto</text>
        <text x="324" y="90" text-anchor="middle" font-size="11" font-family="monospace" class="muted">next() { }</text>
        <text x="324" y="110" text-anchor="middle" font-size="10.5" class="lbl">ここで見つかる</text>

        <line x1="408" y1="82" x2="458" y2="82" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arp)" />
        <text x="433" y="72" text-anchor="middle" font-size="10" class="muted">__proto__</text>

        <rect x="464" y="44" width="160" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="544" y="68" text-anchor="middle" font-size="12" class="muted">Object.prototype</text>
        <text x="544" y="90" text-anchor="middle" font-size="10.5" class="muted">toString など</text>
        <text x="544" y="110" text-anchor="middle" font-size="10.5" class="muted">この先は null</text>

        <line x1="16" y1="148" x2="624" y2="148" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="172" font-size="11.5">カウンタを100個作ったとき</text>

        <rect x="16" y="184" width="288" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="206" text-anchor="middle" font-size="11.5" class="muted">各オブジェクトが持つのは count だけ</text>
        <text x="160" y="228" text-anchor="middle" font-size="11.5" class="muted">next は counterProto に1つだけ</text>

        <rect x="336" y="184" width="288" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="206" text-anchor="middle" font-size="11.5" class="muted">ただし c.count は外から書き換えられる</text>
        <text x="480" y="228" text-anchor="middle" font-size="11.5" class="lbl">クロージャなら外から一切触れない</text>
      </svg>
    </div>
  </body>
</html>
