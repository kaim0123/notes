<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="テストの段階に沿った2つの性質の逆転を、上下の楔形で示した図。中央にUnit、Integration、API、E2Eの4つの段階が左から右へ並ぶ。上側の楔は左端で最も厚く右端へ向かって細くなり、速さと原因の特定しやすさが左ほど高いことを示す。下側の楔は逆に左端で細く右端で最も厚く、本番への近さと落ちたときの意味の重さが右ほど大きいことを示す。どちらか一方だけを選ぶのではなく、両方を得るために配分を決めるのがテストピラミッドである、と図の下部に記されている。"
      >
        <polygon points="12,52 628,68 628,76 12,92" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="20" y="40" font-size="10.5" class="accent">速い・落ちた原因がすぐ絞れる</text>

        <rect x="10" y="104" width="140" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="80" y="122" font-size="11" text-anchor="middle">Unit</text>
        <text x="80" y="138" font-size="9" text-anchor="middle" class="muted">関数・クラス</text>

        <rect x="170" y="104" width="140" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="240" y="122" font-size="11" text-anchor="middle">Integration</text>
        <text x="240" y="138" font-size="9" text-anchor="middle" class="muted">DB・外部サービス</text>

        <rect x="330" y="104" width="140" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="400" y="122" font-size="11" text-anchor="middle">API</text>
        <text x="400" y="138" font-size="9" text-anchor="middle" class="muted">HTTPの入口</text>

        <rect x="490" y="104" width="140" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="560" y="122" font-size="11" text-anchor="middle">E2E</text>
        <text x="560" y="138" font-size="9" text-anchor="middle" class="muted">ブラウザ・画面</text>

        <polygon points="12,174 628,158 628,198 12,182" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="440" y="216" font-size="10.5" class="muted">本番に近い・落ちたときの意味が重い</text>

        <line x1="12" y1="234" x2="628" y2="234" stroke="var(--border)" stroke-width="1" />
        <text x="12" y="254" font-size="10.5" class="muted">2つの性質は段階に沿って逆を向く。どちらか一方を選ぶ問題ではなく、どう配分するかの問題になる。</text>
        <text x="12" y="274" font-size="10.5" class="accent">下に厚く積んで速さと診断しやすさを取り、上に薄く残して現実味を確保する ― これがピラミッドの理屈。</text>
      </svg>
    </div>
  </body>
</html>
