<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="カプセル化の図。中央に「注文」オブジェクトの箱があり、内側に非公開の状態(明細・合計金額・状態)、外周に公開されたメソッド(追加する・確定する・合計を取得する)が並ぶ。左の呼び出し側からは公開メソッドへの矢印だけが届き、内部の状態へ直接向かう矢印には×印が付いていて、外部から直接触れないことを示す。データの持ち主が処理も持つため、変更の影響がオブジェクトの中に閉じる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">データの持ち主が、そのデータを扱う処理も持つ</text>

        <rect x="230" y="40" width="330" height="200" rx="12" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="395" y="64" text-anchor="middle" font-size="12.5" font-weight="600">注文オブジェクト</text>

        <rect x="258" y="78" width="274" height="66" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="395" y="100" text-anchor="middle" font-size="11" class="muted">非公開の状態(private)</text>
        <text x="395" y="122" text-anchor="middle" font-size="11.5">明細 / 合計金額 / 確定済みか</text>

        <text x="395" y="168" text-anchor="middle" font-size="11" class="muted">公開されたメソッド(public)</text>
        <rect x="248" y="180" width="88" height="34" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2" />
        <text x="292" y="202" text-anchor="middle" font-size="10.5">明細を追加</text>
        <rect x="348" y="180" width="88" height="34" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2" />
        <text x="392" y="202" text-anchor="middle" font-size="10.5">確定する</text>
        <rect x="448" y="180" width="88" height="34" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2" />
        <text x="492" y="202" text-anchor="middle" font-size="10.5">合計を取得</text>

        <rect x="40" y="120" width="130" height="50" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="105" y="150" text-anchor="middle" font-size="11.5">呼び出し側</text>

        <path d="M172,152 C210,152 210,197 242,197" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="196" y="186" font-size="10" class="hi">OK</text>

        <line x1="172" y1="132" x2="252" y2="112" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
        <line x1="205" y1="114" x2="219" y2="128" stroke="var(--muted)" stroke-width="1.6" />
        <line x1="219" y1="114" x2="205" y2="128" stroke="var(--muted)" stroke-width="1.6" />
        <text x="196" y="106" font-size="10" class="muted">直接は触れない</text>

        <text x="330" y="272" text-anchor="middle" font-size="11" class="muted">
          内部の持ち方を変えても、公開メソッドさえ守れば呼び出し側は影響を受けない
        </text>
      </svg>
    </div>
  </body>
</html>
