<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="通信を許可する2つの仕組みの違いを示した図。1つ目はサーバーごとに付ける仕組みで、行きの通信を許可すれば戻りは自動的に通る。したがって書くのは許可の規則だけで、戻りの規則を書き忘れて通信が片道になる事故が起きない。2つ目は区画の境界に置く仕組みで、行きと戻りを別々に評価するため、両方向の規則を書く必要がある。こちらは拒否の規則も書けるので、特定の相手を明示的に遮断できる。使い分けは、通常の許可はサーバーごとの仕組みで細かく行い、区画全体に効かせたい遮断だけ境界の仕組みで行う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="44" width="320" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="180" y="70" font-size="11.5" text-anchor="middle">サーバーごとに付ける</text>
        <text x="180" y="92" font-size="9.5" text-anchor="middle" class="muted">そのサーバーに出入りする通信を判定する</text>
        <rect x="40" y="106" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="126" font-size="10" text-anchor="middle">書けるのは「許可」だけ</text>
        <rect x="40" y="142" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="180" y="162" font-size="10" text-anchor="middle">行きを許せば、戻りは自動で通る</text>
        <text x="180" y="196" font-size="9.5" text-anchor="middle" class="accent">戻りの規則を書き忘れる事故が起きない</text>
        <text x="180" y="214" font-size="9" text-anchor="middle" class="muted">日常の許可は、こちらで細かく書く</text>

        <rect x="360" y="44" width="320" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="70" font-size="11.5" text-anchor="middle">区画の境界に置く</text>
        <text x="520" y="92" font-size="9.5" text-anchor="middle" class="muted">その区画に出入りする通信をまとめて判定する</text>
        <rect x="380" y="106" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="126" font-size="10" text-anchor="middle">「拒否」も書ける</text>
        <rect x="380" y="142" width="280" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="162" font-size="10" text-anchor="middle">行きと戻りを別々に評価する</text>
        <text x="520" y="196" font-size="9.5" text-anchor="middle" class="accent">両方向を書かないと片道で詰まる</text>
        <text x="520" y="214" font-size="9" text-anchor="middle" class="muted">区画全体に効かせたい遮断だけに使う</text>

        <text x="20" y="256" font-size="10.5" class="muted">「つながらない」の原因は、たいてい右側で戻りの規則を書き忘れているか、左側の許可が足りないか。</text>
        <text x="20" y="278" font-size="10.5" class="muted">どちらも既定は「許可していないものは通さない」― 開けた穴だけが通り道になる。</text>
      </svg>
    </div>
  </body>
</html>
