<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 20%);
        --primary: oklch(0.85 0.29 142);
        --chart-2: oklch(0.7 0.24 142);
        --chart-3: oklch(0.62 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="データ量nが1から16に増えたときの処理量の伸びを対数目盛りで比較した折れ線グラフ。O(log n)がほぼ横ばいなのに対し、O(n)は緩やかに、O(n log n)はやや急に、O(n squared)は最も急に増えていく"
      >
        <text x="340" y="18" text-anchor="middle" font-size="12" class="muted">
          データ量nが増えたときの処理量の伸び(対数目盛り)
        </text>

        <!-- 軸 -->
        <line x1="60" y1="40" x2="60" y2="260" stroke="var(--border)" stroke-width="1.5" />
        <line x1="40" y1="260" x2="620" y2="260" stroke="var(--border)" stroke-width="1.5" />
        <text x="60" y="278" text-anchor="middle" font-size="11" class="muted">n=1</text>
        <text x="312" y="278" text-anchor="middle" font-size="11" class="muted">n=8</text>
        <text x="600" y="278" text-anchor="middle" font-size="11" class="muted">n=16</text>

        <!-- O(log n) -->
        <polyline
          points="60,260 96,232.5 168,216.4 240,209.4 312,205.0 384,202.0 456,199.7 528,197.7 600,196.2"
          fill="none"
          stroke="var(--primary)"
          stroke-width="2.5"
        />
        <text x="606" y="196" font-size="12" font-weight="600" style="fill: var(--primary)">O(log n)</text>

        <!-- O(n) -->
        <polyline
          points="60,232.5 96,216.4 168,196.2 240,182.8 312,172.9 384,164.9 456,158.3 528,152.6 600,147.7"
          fill="none"
          stroke="var(--chart-2)"
          stroke-width="2.5"
        />
        <text x="606" y="151" font-size="12" font-weight="600" style="fill: var(--chart-2)">O(n)</text>

        <!-- O(n log n) -->
        <polyline
          points="60,260 96,216.4 168,172.9 240,148.8 312,132.4 384,119.9 456,109.9 528,101.5 600,94.5"
          fill="none"
          stroke="var(--chart-3)"
          stroke-width="2.5"
        />
        <text x="606" y="98" font-size="12" font-weight="600" style="fill: var(--chart-3)">O(n log n)</text>

        <!-- O(n^2) -->
        <polyline
          points="60,232.5 96,196.2 168,147.7 240,116.8 312,94.5 384,77.0 456,62.6 528,50.5 600,40.0"
          fill="none"
          stroke="var(--fg)"
          stroke-width="3"
        />
        <text x="606" y="44" font-size="12" font-weight="700">O(n²)</text>
      </svg>
    </div>
  </body>
</html>
