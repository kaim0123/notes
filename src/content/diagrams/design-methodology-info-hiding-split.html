<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="処理手順ベース分割と情報隠蔽ベース分割を比べた図。左は処理手順で分けた形で、読み込む・並べ替える・出力するという3モジュールが並び、データ形式を変えると3つすべてに変更が波及する。右は秘密で分けた形で、行の保持方法・並べ替えアルゴリズム・出力形式という3つの変わりやすい判断がそれぞれ1モジュールに閉じ込められ、データ形式を変えても該当する1モジュールの内側だけが変わる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">処理手順で分ける</text>

        <rect x="45" y="48" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="72" text-anchor="middle" font-size="11">読み込む</text>
        <rect x="45" y="96" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="120" text-anchor="middle" font-size="11">並べ替える</text>
        <rect x="45" y="144" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="168" text-anchor="middle" font-size="11">出力する</text>

        <line x1="30" y1="67" x2="41" y2="67" stroke="var(--muted)" stroke-width="2" />
        <line x1="30" y1="115" x2="41" y2="115" stroke="var(--muted)" stroke-width="2" />
        <line x1="30" y1="163" x2="41" y2="163" stroke="var(--muted)" stroke-width="2" />
        <line x1="30" y1="67" x2="30" y2="163" stroke="var(--muted)" stroke-width="2" />
        <text x="165" y="212" text-anchor="middle" font-size="11" class="muted">データ形式を変えると</text>
        <text x="165" y="230" text-anchor="middle" font-size="11" class="muted">3つすべてに変更が波及する</text>

        <line x1="345" y1="30" x2="345" y2="260" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="26" text-anchor="middle" font-size="12.5" font-weight="600">秘密で分ける</text>

        <rect x="390" y="48" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="510" y="66" text-anchor="middle" font-size="10.5" font-weight="600">行の保持方法モジュール</text>
        <text x="510" y="80" text-anchor="middle" font-size="9.5" class="muted">秘密: 配列か、ファイルか</text>

        <rect x="390" y="96" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="114" text-anchor="middle" font-size="10.5" font-weight="600">並べ替えモジュール</text>
        <text x="510" y="128" text-anchor="middle" font-size="9.5" class="muted">秘密: どのアルゴリズムか</text>

        <rect x="390" y="144" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="162" text-anchor="middle" font-size="10.5" font-weight="600">出力モジュール</text>
        <text x="510" y="176" text-anchor="middle" font-size="9.5" class="muted">秘密: どの表示形式か</text>

        <text x="510" y="212" text-anchor="middle" font-size="11" class="muted">データ形式を変えても、変わるのは</text>
        <text x="510" y="230" text-anchor="middle" font-size="11" class="muted">該当する1モジュールの内側だけ</text>

        <text x="340" y="286" text-anchor="middle" font-size="11" class="muted">
          分ける数は同じでも、何を軸に切ったかで変更の波及範囲がまるで変わる
        </text>
      </svg>
    </div>
  </body>
</html>
