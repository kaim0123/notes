<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="開発手法の中心が時代とともに上流へ移ってきたことを示した階段図。1960年代の中心はコードで、正しく動くコードをどう書くかが関心だった。1970年代は設計と工程へ移り、どう設計しどんな順序で作るかが問われた。1980年代はオブジェクトとリスクが中心になり、データと手続きをまとめる考え方と、作りながら確かめる手法が広がった。1990年代はユーザーと業務知識が中心になり、反復開発とドメイン駆動設計が生まれた。2000年代は変化とテストが中心になり、アジャイルとテスト駆動開発が定着した。2010年代は運用と自動化が中心になり、DevOpsとCI/CDが広がった。2020年代は開発基盤とAIとの協働が中心に入ってきた。階段は右上へ上がっており、関心の重心がより上流でより広い範囲へ移動してきたことを表す。ただし古い手法が消えたわけではなく、下の段はすべて土台として現役で残っている。"
      >
        <rect x="16" y="232" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="59" y="250" text-anchor="middle" font-size="10.5" class="lbl">1960年代</text>
        <text x="59" y="268" text-anchor="middle" font-size="11">コード</text>

        <rect x="106" y="200" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="149" y="218" text-anchor="middle" font-size="10.5" class="lbl">1970年代</text>
        <text x="149" y="236" text-anchor="middle" font-size="11">設計・工程</text>

        <rect x="196" y="168" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="239" y="186" text-anchor="middle" font-size="10.5" class="lbl">1980年代</text>
        <text x="239" y="204" text-anchor="middle" font-size="11">オブジェクト</text>

        <rect x="286" y="136" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="329" y="154" text-anchor="middle" font-size="10.5" class="lbl">1990年代</text>
        <text x="329" y="172" text-anchor="middle" font-size="11">ユーザー・業務</text>

        <rect x="376" y="104" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="419" y="122" text-anchor="middle" font-size="10.5" class="lbl">2000年代</text>
        <text x="419" y="140" text-anchor="middle" font-size="11">変化・テスト</text>

        <rect x="466" y="72" width="86" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="509" y="90" text-anchor="middle" font-size="10.5" class="lbl">2010年代</text>
        <text x="509" y="108" text-anchor="middle" font-size="11">運用・自動化</text>

        <rect x="556" y="40" width="68" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="590" y="58" text-anchor="middle" font-size="10.5" class="lbl">2020年代</text>
        <text x="590" y="76" text-anchor="middle" font-size="11">基盤・AI</text>

        <text x="16" y="28" font-size="11" class="lbl">中心になるものは、時代とともに上流へ・広い範囲へ移ってきた</text>
        <text x="16" y="296" font-size="11" class="muted">ただし下の段は消えていない ― 構造化もオブジェクト指向もテストも、いまも土台として現役</text>
      </svg>
    </div>
  </body>
</html>
