<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="セッション方式とトークン方式を、状態をどこに置くかで比べた図。左のセッション方式では、誰がログイン中かという中身はサーバー側の記録に置かれ、ブラウザが持つのはその記録を指す番号だけになる。検証のたびに記録を引くので毎回の問い合わせが要る代わりに、記録を消せばその瞬間から無効にできる。右のトークン方式では、必要な情報がトークン自身に書き込まれ、署名が付いている。サーバーは記録を引かずに署名を検証するだけで済むため速く、複数のサーバーに分かれていても検証できるが、消すべき記録がないので取り消しができず、有効期限が切れるまで生き続ける。速さと取り消しやすさが表裏になっている。"
      >
        <line x1="380" y1="34" x2="380" y2="248" stroke="var(--border)" stroke-width="1" />

        <text x="196" y="50" font-size="11" text-anchor="middle" class="muted">セッション方式</text>
        <text x="576" y="50" font-size="11" text-anchor="middle" class="accent">トークン方式</text>

        <rect x="30" y="66" width="140" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="100" y="84" font-size="9.5" text-anchor="middle">ブラウザが持つ</text>
        <text x="100" y="101" font-size="9" text-anchor="middle" class="mono muted">sid=8f2a…</text>
        <rect x="222" y="66" width="140" height="44" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="292" y="84" font-size="9.5" text-anchor="middle" class="accent">サーバーが持つ</text>
        <text x="292" y="101" font-size="9" text-anchor="middle" class="muted">誰か・権限・期限</text>
        <line x1="174" y1="88" x2="218" y2="88" stroke="var(--muted)" stroke-width="1.2" />
        <text x="196" y="128" font-size="9" text-anchor="middle" class="muted">番号は、中身を指しているだけ</text>

        <rect x="410" y="66" width="300" height="62" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="560" y="86" font-size="9.5" text-anchor="middle" class="accent">ブラウザが持つ</text>
        <text x="560" y="104" font-size="9" text-anchor="middle" class="mono">{ sub: u_129, exp: … } + 署名</text>
        <text x="560" y="121" font-size="9" text-anchor="middle" class="muted">中身がトークンの中に書いてある</text>

        <rect x="30" y="156" width="332" height="80" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="196" y="178" font-size="9.5" text-anchor="middle" class="muted">検証: 記録を引いて確かめる</text>
        <text x="196" y="200" font-size="9.5" text-anchor="middle" class="muted">速さ: 毎回の問い合わせが要る</text>
        <text x="196" y="222" font-size="10" text-anchor="middle" class="accent">取り消し: 記録を消せば即座に無効</text>

        <rect x="410" y="156" width="330" height="80" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="575" y="178" font-size="9.5" text-anchor="middle" class="muted">検証: 署名を確かめるだけ</text>
        <text x="575" y="200" font-size="9.5" text-anchor="middle" class="muted">速さ: 記録を引かないので速い</text>
        <text x="575" y="222" font-size="10" text-anchor="middle" class="accent">取り消し: 期限切れまで生き続ける</text>

        <line x1="16" y1="262" x2="744" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="284" font-size="10.5" class="muted">トークンが速いのは、記録を引かないから。そして引かない仕組みは、消すこともできない。</text>
        <text x="16" y="306" font-size="10.5" class="accent">速さと取り消しやすさは表裏 ― だから実務では、短い期限と失効リストで埋め合わせる。</text>
      </svg>
    </div>
  </body>
</html>
