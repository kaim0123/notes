<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="副作用のある処理を依存性注入でテスト可能にする方法を、左右で比べた図。左は依存を関数の中に直接書いた場合で、関数がその内部から本物のメール送信APIを呼ぶため、テストを走らせると本当にメールが飛んでしまう。差し替える隙間がないので、この関数はUnitテストの対象にできない。右は依存を引数として外から渡す場合で、同じ関数が送信手段を引数で受け取る。本番では本物の送信手段を渡し、テストでは代役のスタブを渡せる。副作用そのものは消えていないが、渡す相手を差し替えられるようになったことで、正しい宛先と本文で呼ばれたかを確かめられるようになる。テストしにくさは書き方ではなく、依存の受け取り方で決まる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="30" font-size="11" class="muted">依存を関数の中に書く</text>
        <text x="328" y="30" font-size="11" class="accent">依存を外から渡す</text>

        <rect x="16" y="44" width="296" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="66" font-size="10" class="mono">sendWelcomeMail(user)</text>
        <text x="30" y="87" font-size="9" class="muted">内部で本物の送信APIを直接呼んでいる</text>

        <rect x="328" y="44" width="296" height="56" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="342" y="66" font-size="10" class="mono">sendWelcomeMail(user, mailer)</text>
        <text x="342" y="87" font-size="9" class="muted">送信手段を引数で受け取る</text>

        <line x1="164" y1="100" x2="164" y2="126" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="404" y1="100" x2="404" y2="126" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="548" y1="100" x2="548" y2="126" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <rect x="16" y="130" width="296" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="164" y="157" font-size="10" text-anchor="middle" class="muted">本物のメール送信API(1つだけ)</text>

        <rect x="328" y="130" width="142" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="399" y="150" font-size="9.5" text-anchor="middle" class="muted">本番 ― 本物の送信</text>
        <text x="399" y="166" font-size="9" text-anchor="middle" class="muted">実際に届く</text>

        <rect x="482" y="130" width="142" height="44" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="553" y="150" font-size="9.5" text-anchor="middle" class="accent">テスト ― 代役</text>
        <text x="553" y="166" font-size="9" text-anchor="middle" class="muted">呼ばれた引数を記録</text>

        <rect x="16" y="192" width="296" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="212" font-size="9.5" class="muted">テストを走らせると、本当にメールが飛ぶ</text>
        <text x="30" y="228" font-size="9.5" class="muted">差し替える隙間がない</text>

        <rect x="328" y="192" width="296" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="342" y="212" font-size="9.5" class="muted">正しい宛先と本文で呼ばれたかを確かめられる</text>
        <text x="342" y="228" font-size="9.5" class="muted">実際には何も送信されない</text>

        <line x1="16" y1="256" x2="624" y2="256" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="276" font-size="10.5" class="muted">副作用そのものは消えていない。消えたのは「差し替えられない」という性質のほう。</text>
        <text x="16" y="298" font-size="10.5" class="accent">テストしにくさは、テストの書き方ではなく、依存の受け取り方で決まる。</text>
      </svg>
    </div>
  </body>
</html>
