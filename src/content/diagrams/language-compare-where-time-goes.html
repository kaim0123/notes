<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="典型的なWeb APIのリクエスト1件にかかる時間の内訳を帯グラフで示した図。全体を100とすると、アプリケーションのコードがCPUを使って計算している時間はおよそ5、データベースの問い合わせ待ちがおよそ60、外部APIの呼び出し待ちがおよそ30、残りのおよそ5がシリアライズなどのその他。言語を変えて速くできるのは先頭のおよそ5の部分だけで、仮にその部分が2倍速くなっても全体は数パーセントしか縮まない。一方、遅いクエリに索引を足して待ち時間を半分にすれば、全体の30が縮む。ボトルネックを測ってから手を打つべき理由を示している。"
      >
        <text x="16" y="28" font-size="12" class="lbl">Web APIのリクエスト1件の時間の内訳(典型例)</text>

        <rect x="16" y="46" width="30" height="44" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <rect x="48" y="46" width="352" height="44" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <rect x="402" y="46" width="176" height="44" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <rect x="580" y="46" width="30" height="44" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />

        <text x="224" y="74" text-anchor="middle" font-size="12" class="muted">DBの問い合わせ待ち(約60)</text>
        <text x="490" y="74" text-anchor="middle" font-size="12" class="muted">外部APIの待ち(約30)</text>

        <line x1="31" y1="90" x2="31" y2="126" stroke="var(--primary)" stroke-width="1.3" />
        <text x="16" y="142" font-size="11" class="lbl">アプリのCPU時間(約5)</text>
        <text x="16" y="158" font-size="10.5" class="muted">言語を変えて速くできるのはここだけ</text>

        <line x1="595" y1="90" x2="595" y2="112" stroke="var(--muted)" stroke-width="1.2" />
        <text x="624" y="126" text-anchor="end" font-size="10.5" class="muted">その他(約5)</text>

        <rect x="16" y="180" width="288" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="32" y="204" font-size="12">言語を2倍速い言語に変える</text>
        <text x="32" y="226" font-size="11" class="muted">5 → 2.5 に縮む</text>
        <text x="32" y="244" font-size="11.5" class="muted">全体では約2.5%の短縮</text>

        <rect x="320" y="180" width="304" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="336" y="204" font-size="12">遅いクエリに索引を足す</text>
        <text x="336" y="226" font-size="11" class="muted">60 → 30 に縮む</text>
        <text x="336" y="244" font-size="11.5" class="lbl">全体では約30%の短縮</text>

        <text x="16" y="274" font-size="11" class="muted">I/O待ちが支配的な処理では、言語による差はほとんど出ない ― まず測り、支配的な待ちから手を付ける</text>
      </svg>
    </div>
  </body>
</html>
