<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="1つの入力文字列が、渡された先ごとに別の名前の脆弱性になることを示した図。左に外から来た文字列が1つあり、そこから5本の矢印が右へ伸びる。HTMLとして出力すればクロスサイトスクリプティング、SQL文に組み込めばSQLインジェクション、シェルに渡せばOSコマンドインジェクション、HTTPレスポンスヘッダに入れればHTTPヘッダインジェクション、メールの送信処理に渡せばメールヘッダインジェクションになる。狙われる場所は違っても、データとして受け取ったものが命令として解釈されるという型はすべて共通している。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="20" y="112" width="150" height="56" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="95" y="136" font-size="11" text-anchor="middle" class="accent">外から来た文字列</text>
        <text x="95" y="156" font-size="9" text-anchor="middle" class="muted">それ自体は無害</text>

        <text x="300" y="44" font-size="10" text-anchor="middle" class="muted">渡した先</text>
        <text x="620" y="44" font-size="10" text-anchor="middle" class="muted">つく名前</text>

        <rect x="230" y="56" width="140" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="230" y="96" width="140" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="230" y="136" width="140" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="230" y="176" width="140" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="230" y="216" width="140" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="300" y="76" font-size="10" text-anchor="middle">HTML</text>
        <text x="300" y="116" font-size="10" text-anchor="middle">SQL文</text>
        <text x="300" y="156" font-size="10" text-anchor="middle">シェル</text>
        <text x="300" y="196" font-size="10" text-anchor="middle">HTTPヘッダ</text>
        <text x="300" y="236" font-size="10" text-anchor="middle">メール送信</text>

        <line x1="174" y1="134" x2="226" y2="74" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="174" y1="136" x2="226" y2="112" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="174" y1="140" x2="226" y2="151" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="174" y1="144" x2="226" y2="190" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="174" y1="148" x2="226" y2="228" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />

        <line x1="374" y1="71" x2="416" y2="71" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="374" y1="111" x2="416" y2="111" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="374" y1="151" x2="416" y2="151" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="374" y1="191" x2="416" y2="191" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="374" y1="231" x2="416" y2="231" stroke="var(--border)" stroke-width="1.1" marker-end="url(#ar)" />

        <text x="424" y="75" font-size="10" class="muted">クロスサイトスクリプティング(XSS)</text>
        <text x="424" y="115" font-size="10" class="muted">SQLインジェクション</text>
        <text x="424" y="155" font-size="10" class="muted">OSコマンドインジェクション</text>
        <text x="424" y="195" font-size="10" class="muted">HTTPヘッダインジェクション</text>
        <text x="424" y="235" font-size="10" class="muted">メールヘッダインジェクション</text>

        <line x1="16" y1="262" x2="744" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="284" font-size="10.5" class="accent">名前は5つでも、起きていることは1つ ― データとして受け取ったものが、命令として解釈された。</text>
      </svg>
    </div>
  </body>
</html>
