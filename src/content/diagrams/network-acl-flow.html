<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 480"
        role="img"
        aria-label="ACLの評価順序の図解。パケットが届くとACLの行を上から順に照合し、最初に一致した行のpermitまたはdenyがその場で適用されて評価は終わる。最後まで一致する行が無ければ、暗黙のdeny allによって破棄される。"
      >
        <defs>
          <marker
            id="arrowAcl"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="240" y="10" width="160" height="40" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="35" text-anchor="middle" font-size="12.5">パケット到着</text>
        <line x1="320" y1="50" x2="320" y2="75" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowAcl)" />

        <rect x="190" y="80" width="260" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="105" text-anchor="middle" font-size="11.5" class="mono">10 permit 192.168.1.10</text>
        <line x1="320" y1="120" x2="320" y2="140" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowAcl)" />
        <text x="380" y="133" font-size="10" class="muted">不一致</text>

        <rect x="190" y="145" width="260" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="170" text-anchor="middle" font-size="11.5" class="mono">20 deny 192.168.1.0 0.0.0.255</text>
        <line x1="320" y1="185" x2="320" y2="205" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowAcl)" />
        <text x="390" y="198" font-size="10.5" style="fill: var(--primary)">一致!</text>

        <rect x="150" y="210" width="340" height="46" rx="7" fill="var(--primary)" />
        <text x="320" y="238" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary-fg)">
          この行が適用される ― ここで評価終了
        </text>

        <rect x="190" y="280" width="260" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-dasharray="3 3" />
        <text x="320" y="305" text-anchor="middle" font-size="11" class="muted">(以降の行は評価されない)</text>

        <line x1="320" y1="320" x2="320" y2="345" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <rect x="150" y="350" width="340" height="46" rx="7" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="320" y="371" text-anchor="middle" font-size="11.5" class="muted">最後まで一致しなければ</text>
        <text x="320" y="388" text-anchor="middle" font-size="11.5" class="muted">暗黙のdeny all(すべて破棄)</text>

        <text x="320" y="440" text-anchor="middle" font-size="11.5" class="muted">
          上から順に照合し、最初に一致した1行だけが適用される(先勝ち)
        </text>
        <text x="320" y="458" text-anchor="middle" font-size="11.5" class="muted">
          明示的なpermit/denyが1つも無ければ、必ずdenyされる
        </text>
      </svg>
    </div>
  </body>
</html>
