<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 280" role="img" aria-label="Stateパターンの状態遷移図。下書き・確定済み・発送済み・キャンセル済みという4つの状態が円で描かれ、確定する・発送する・キャンセルするという操作の矢印で結ばれている。発送済みからキャンセル済みへの矢印には×印が付いており、その状態では許されない操作であることを示す。分岐で書き分ける代わりに、状態ごとのオブジェクトに「その状態で何ができるか」を持たせるのがStateパターンである。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">「その状態で何ができるか」を、状態ごとのオブジェクトに持たせる</text>

        <circle cx="90" cy="120" r="44" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="90" y="125" text-anchor="middle" font-size="11">下書き</text>

        <line x1="138" y1="120" x2="216" y2="120" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="177" y="110" text-anchor="middle" font-size="9.5" class="hi">確定する</text>

        <circle cx="264" cy="120" r="44" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="264" y="125" text-anchor="middle" font-size="11" font-weight="600">確定済み</text>

        <line x1="312" y1="120" x2="390" y2="120" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="351" y="110" text-anchor="middle" font-size="9.5" class="hi">発送する</text>

        <circle cx="438" cy="120" r="44" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="438" y="125" text-anchor="middle" font-size="11">発送済み</text>

        <line x1="264" y1="168" x2="264" y2="206" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="330" y="192" text-anchor="middle" font-size="9.5" class="hi">キャンセルする</text>

        <circle cx="264" cy="234" r="30" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="264" y="239" text-anchor="middle" font-size="10">キャンセル済み</text>

        <line x1="438" y1="168" x2="340" y2="220" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
        <line x1="381" y1="188" x2="395" y2="202" stroke="var(--muted)" stroke-width="1.8" />
        <line x1="395" y1="188" x2="381" y2="202" stroke="var(--muted)" stroke-width="1.8" />
        <text x="500" y="196" text-anchor="middle" font-size="10" class="muted">発送済みからは</text>
        <text x="500" y="214" text-anchor="middle" font-size="10" class="muted">キャンセルできない</text>

        <text x="330" y="272" text-anchor="middle" font-size="11" class="muted">
          状態が増えても、既存の状態オブジェクトには手を入れずに済む
        </text>
      </svg>
    </div>
  </body>
</html>
