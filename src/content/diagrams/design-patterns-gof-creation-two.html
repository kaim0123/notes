<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 300" role="img" aria-label="生成に関する2つのパターンの図。上段のFactory Methodでは、呼び出し側が生成関数に「メールで」とだけ伝え、生成関数がEmailNotifierかSmsNotifierのどちらを作るかを決めて返す。呼び出し側は具体的なクラス名を知らない。下段のBuilderでは、URLとメソッドを渡した後、ヘッダを足す、本文を足すと段階的に設定し、最後にbuildを呼んだ瞬間にリクエストが完成する。前者は何を作るか、後者はどう組み立てるかを柔軟にする。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="30" y="26" font-size="12.5" font-weight="600">Factory Method ― 「何を作るか」を任せる</text>

        <rect x="30" y="42" width="130" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="95" y="70" text-anchor="middle" font-size="10.5">呼び出し側</text>
        <line x1="164" y1="65" x2="196" y2="65" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <text x="180" y="56" text-anchor="middle" font-size="9" class="muted">「メールで」</text>

        <rect x="200" y="42" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="290" y="63" text-anchor="middle" font-size="10.5" font-weight="600">生成関数</text>
        <text x="290" y="79" text-anchor="middle" font-size="9" class="mono muted">createNotifier()</text>

        <line x1="384" y1="56" x2="416" y2="46" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="384" y1="76" x2="416" y2="86" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="420" y="30" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="495" y="51" text-anchor="middle" font-size="10">EmailNotifier</text>
        <rect x="420" y="72" width="150" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="495" y="93" text-anchor="middle" font-size="10">SmsNotifier</text>

        <text x="290" y="118" text-anchor="middle" font-size="10.5" class="muted">呼び出し側は具体的なクラス名を知らない</text>

        <line x1="30" y1="142" x2="650" y2="142" stroke="var(--border)" stroke-width="1.2" />

        <text x="30" y="174" font-size="12.5" font-weight="600">Builder ― 「どう組み立てるか」を段階に分ける</text>

        <rect x="30" y="190" width="130" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="95" y="208" text-anchor="middle" font-size="10">URLとメソッド</text>
        <text x="95" y="223" text-anchor="middle" font-size="8.5" class="muted">必須の項目</text>
        <line x1="164" y1="211" x2="186" y2="211" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="190" y="190" width="130" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="255" y="215" text-anchor="middle" font-size="10" class="mono">withHeader()</text>
        <line x1="324" y1="211" x2="346" y2="211" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="350" y="190" width="130" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="415" y="215" text-anchor="middle" font-size="10" class="mono">withBody()</text>
        <line x1="484" y1="211" x2="506" y2="211" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="510" y="190" width="140" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="580" y="208" text-anchor="middle" font-size="10" class="mono">build()</text>
        <text x="580" y="223" text-anchor="middle" font-size="8.5" class="muted">ここで完成する</text>

        <text x="340" y="266" text-anchor="middle" font-size="11" class="muted">任意の項目を省いても呼び出しコードが崩れない</text>
        <text x="340" y="288" text-anchor="middle" font-size="11" class="muted">どちらも共通するのは「生成そのものを部品として切り出す」こと</text>
      </svg>
    </div>
  </body>
</html>
