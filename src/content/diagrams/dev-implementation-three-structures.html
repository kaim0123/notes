<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 260"
        role="img"
        aria-label="どんなに複雑な手順も3つの基本構造の組み合わせで書けることを示した図。左は順次で、処理が上から下へ一直線に並ぶ。中央は分岐で、条件の菱形から2本の経路に分かれ、それぞれの処理を経てまた1本に合流する。右は反復で、条件を満たす間だけ処理へ戻る矢印が付き、条件を満たさなくなると先へ抜ける。3つに共通するのは、入口が1つで出口も1つだということ。この性質があるため、どの構造も1つの処理として扱え、入れ子にして組み合わせても流れが追える。任意の場所へ飛ぶ書き方を許すとこの性質が壊れ、実行経路が絡み合って読めなくなる。"
      >
        <defs>
          <marker id="arim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="86" y="26" text-anchor="middle" font-size="12" class="lbl">順次</text>
        <text x="320" y="26" text-anchor="middle" font-size="12" class="lbl">分岐</text>
        <text x="546" y="26" text-anchor="middle" font-size="12" class="lbl">反復</text>

        <circle cx="86" cy="44" r="4" fill="var(--primary)" />
        <line x1="86" y1="48" x2="86" y2="62" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <rect x="26" y="66" width="120" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="86" y="86" text-anchor="middle" font-size="11" class="muted">処理A</text>
        <line x1="86" y1="96" x2="86" y2="112" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <rect x="26" y="116" width="120" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="86" y="136" text-anchor="middle" font-size="11" class="muted">処理B</text>
        <line x1="86" y1="146" x2="86" y2="166" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <circle cx="86" cy="172" r="4" fill="var(--primary)" />

        <circle cx="320" cy="44" r="4" fill="var(--primary)" />
        <line x1="320" y1="48" x2="320" y2="58" stroke="var(--muted)" stroke-width="1.2" />
        <path d="M320,58 L370,84 L320,110 L270,84 z" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="88" text-anchor="middle" font-size="10.5">条件</text>
        <line x1="270" y1="84" x2="238" y2="84" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="238" y1="84" x2="238" y2="116" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <rect x="196" y="120" width="84" height="28" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="238" y="139" text-anchor="middle" font-size="10.5" class="muted">処理X</text>
        <line x1="370" y1="84" x2="402" y2="84" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="402" y1="84" x2="402" y2="116" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <rect x="360" y="120" width="84" height="28" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="402" y="139" text-anchor="middle" font-size="10.5" class="muted">処理Y</text>
        <line x1="238" y1="148" x2="238" y2="164" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="402" y1="148" x2="402" y2="164" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="238" y1="164" x2="402" y2="164" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="320" y1="164" x2="320" y2="172" stroke="var(--muted)" stroke-width="1.2" />
        <circle cx="320" cy="176" r="4" fill="var(--primary)" />

        <circle cx="546" cy="44" r="4" fill="var(--primary)" />
        <line x1="546" y1="48" x2="546" y2="58" stroke="var(--muted)" stroke-width="1.2" />
        <path d="M546,58 L594,84 L546,110 L498,84 z" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="546" y="88" text-anchor="middle" font-size="10.5">条件</text>
        <line x1="546" y1="110" x2="546" y2="120" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <rect x="486" y="124" width="120" height="28" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="546" y="143" text-anchor="middle" font-size="10.5" class="muted">処理C</text>
        <path d="M486,138 L466,138 L466,84 L494,84" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arim)" />
        <line x1="594" y1="84" x2="614" y2="84" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="614" y1="84" x2="614" y2="172" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="614" y1="172" x2="552" y2="172" stroke="var(--muted)" stroke-width="1.2" />
        <circle cx="546" cy="172" r="4" fill="var(--primary)" />

        <line x1="16" y1="200" x2="624" y2="200" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="222" font-size="11" class="lbl">3つに共通するのは、入口が1つ・出口が1つであること</text>
        <text x="16" y="242" font-size="11" class="muted">だからどれも「1つの処理」として扱え、入れ子にして組み合わせても流れが追える</text>
      </svg>
    </div>
  </body>
</html>
