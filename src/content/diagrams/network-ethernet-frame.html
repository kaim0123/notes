<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 860 220"
        role="img"
        aria-label="イーサネットフレームの構造。宛先MACアドレス6バイト、送信元MACアドレス6バイト、タイプ2バイトに続けてデータが46から1500バイト入り、末尾に誤り検出用のFCSが4バイト付く。MACアドレスの2つのフィールドとFCSが緑で強調され、フレームの骨格を担うことを示す。"
      >
        <text x="430" y="24" text-anchor="middle" font-size="13" font-weight="700">イーサネットフレームの構造</text>

        <rect x="20" y="50" width="150" height="60" fill="var(--primary)" />
        <text x="95" y="78" text-anchor="middle" font-size="12" font-weight="700" style="fill: var(--primary-fg)">宛先MAC</text>
        <text x="95" y="96" text-anchor="middle" font-size="11" style="fill: var(--primary-fg)">6バイト</text>

        <rect x="170" y="50" width="150" height="60" fill="var(--primary)" />
        <text x="245" y="78" text-anchor="middle" font-size="12" font-weight="700" style="fill: var(--primary-fg)">送信元MAC</text>
        <text x="245" y="96" text-anchor="middle" font-size="11" style="fill: var(--primary-fg)">6バイト</text>

        <rect x="320" y="50" width="90" height="60" fill="var(--card)" stroke="var(--border)" />
        <text x="365" y="78" text-anchor="middle" font-size="12" font-weight="600">タイプ</text>
        <text x="365" y="96" text-anchor="middle" font-size="11" class="muted">2バイト</text>

        <rect x="410" y="50" width="330" height="60" fill="var(--card)" stroke="var(--border)" />
        <text x="575" y="78" text-anchor="middle" font-size="13" font-weight="600">データ(ペイロード)</text>
        <text x="575" y="96" text-anchor="middle" font-size="11" class="muted">46 〜 1500バイト</text>

        <rect x="740" y="50" width="100" height="60" fill="var(--primary)" />
        <text x="790" y="78" text-anchor="middle" font-size="12" font-weight="700" style="fill: var(--primary-fg)">FCS</text>
        <text x="790" y="96" text-anchor="middle" font-size="11" style="fill: var(--primary-fg)">4バイト</text>

        <text x="95" y="135" text-anchor="middle" font-size="11" style="fill: var(--primary)">誰から誰へ</text>
        <text x="365" y="135" text-anchor="middle" font-size="11" class="muted">上位層の種別</text>
        <text x="575" y="135" text-anchor="middle" font-size="11" class="muted">上位層のPDU(パケットなど)</text>
        <text x="790" y="135" text-anchor="middle" font-size="11" style="fill: var(--primary)">誤り検出</text>

        <text x="430" y="175" text-anchor="middle" font-size="12" class="muted">
          スイッチは宛先MAC/送信元MACの2つのフィールドだけを見て転送先を判断する
        </text>
        <text x="430" y="195" text-anchor="middle" font-size="12" class="muted">
          FCS(Frame Check Sequence)は伝送中の誤りを検出するチェックサム
        </text>
      </svg>
    </div>
  </body>
</html>
