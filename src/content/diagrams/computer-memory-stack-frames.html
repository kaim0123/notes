<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="関数呼び出しに伴うスタックフレームの増減。①mainだけが積まれた状態から、②funcAの呼び出しでその上にフレームが積まれ、③funcBの呼び出しでさらに積まれる。④終了時は逆順に片付いていく。RSPは常に積み上がった先頭のフレームを指す。" viewBox="0 0 640 220">
      <text x="90" y="22" fill="var(--muted)" font-size="12" text-anchor="middle">① mainだけ</text>
      <rect x="30" y="150" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="90" y="175" fill="var(--fg)" font-size="12" text-anchor="middle">main</text>

      <text x="250" y="22" fill="var(--muted)" font-size="12" text-anchor="middle">② funcA呼び出し</text>
      <rect x="190" y="150" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="250" y="175" fill="var(--fg)" font-size="12" text-anchor="middle">main</text>
      <rect x="190" y="106" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="250" y="131" fill="var(--fg)" font-size="12" text-anchor="middle">funcA</text>

      <text x="410" y="22" fill="var(--muted)" font-size="12" text-anchor="middle">③ funcB呼び出し</text>
      <rect x="350" y="150" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="410" y="175" fill="var(--fg)" font-size="12" text-anchor="middle">main</text>
      <rect x="350" y="106" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="410" y="131" fill="var(--fg)" font-size="12" text-anchor="middle">funcA</text>
      <rect x="350" y="62" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="410" y="87" fill="var(--fg)" font-size="12" text-anchor="middle">funcB</text>

      <text x="570" y="22" fill="var(--muted)" font-size="12" text-anchor="middle">④ 逆順に片付く</text>
      <rect x="510" y="150" width="120" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="570" y="175" fill="var(--fg)" font-size="12" text-anchor="middle">main</text>
      <rect x="510" y="106" width="120" height="40" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />
      <text x="570" y="131" fill="var(--muted)" font-size="11" text-anchor="middle">(解放)</text>

      <text x="20" y="210" fill="var(--muted)" font-size="11">RSPは上へ(高い方へ)伸び、フレーム先頭を指す</text>
      </svg>
    </div>
  </body>
</html>
