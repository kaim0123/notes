<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="共有する型を変更したときの手間を、ポリレポとモノレポで比べた図。上段のポリレポでは、型を持つリポジトリを直して公開し、次にそれを使うWebのリポジトリで版を上げてPRを出し、さらにAPIのリポジトリでも同じことをする。3つのPRが必要で、公開と取り込みの順序も守らなければならない。下段のモノレポでは、型もWebもAPIも同じリポジトリにあるため、1つのPRで3か所をまとめて変更でき、CIも全体をその場で検証できる。ただしモノレポには条件があり、変更に関係するパッケージだけを実行する仕組みが無いと、パッケージが増えるほどCIが長くなって破綻する。"
      >
        <defs>
          <marker id="armr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="muted">ポリレポ ― 共有する型を1つ変えると</text>

        <rect x="16" y="38" width="150" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="91" y="60" text-anchor="middle" font-size="11">types リポジトリ</text>
        <text x="91" y="80" text-anchor="middle" font-size="10.5" class="muted">直して公開する(PR①)</text>

        <line x1="166" y1="66" x2="198" y2="66" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#armr)" />

        <rect x="204" y="38" width="150" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="279" y="60" text-anchor="middle" font-size="11">web リポジトリ</text>
        <text x="279" y="80" text-anchor="middle" font-size="10.5" class="muted">版を上げる(PR②)</text>

        <line x1="354" y1="66" x2="386" y2="66" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#armr)" />

        <rect x="392" y="38" width="150" height="56" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="467" y="60" text-anchor="middle" font-size="11">api リポジトリ</text>
        <text x="467" y="80" text-anchor="middle" font-size="10.5" class="muted">版を上げる(PR③)</text>

        <text x="16" y="118" font-size="11" class="muted">3つのPRが必要で、公開と取り込みの順序も守らなければならない</text>

        <line x1="16" y1="140" x2="624" y2="140" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="166" font-size="12" class="lbl">モノレポ ― 同じ変更が1つのPRで完結する</text>

        <rect x="16" y="180" width="380" height="96" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <text x="34" y="200" font-size="10.5" class="lbl">1つのリポジトリ</text>

        <rect x="34" y="210" width="108" height="50" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="88" y="232" text-anchor="middle" font-size="11">packages/types</text>
        <text x="88" y="250" text-anchor="middle" font-size="10" class="muted">直す</text>

        <rect x="152" y="210" width="108" height="50" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="206" y="232" text-anchor="middle" font-size="11">apps/web</text>
        <text x="206" y="250" text-anchor="middle" font-size="10" class="muted">直接参照している</text>

        <rect x="270" y="210" width="108" height="50" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="324" y="232" text-anchor="middle" font-size="11">apps/api</text>
        <text x="324" y="250" text-anchor="middle" font-size="10" class="muted">直接参照している</text>

        <line x1="396" y1="228" x2="428" y2="228" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#armr)" />
        <rect x="434" y="196" width="190" height="64" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="529" y="220" text-anchor="middle" font-size="11.5">PRは1つ</text>
        <text x="529" y="242" text-anchor="middle" font-size="10.5" class="muted">CIが全体をその場で検証</text>

        <text x="16" y="294" font-size="11" class="muted">ただし条件がある ― 変更に関係する部分だけを実行できないと、パッケージが増えるほどCIが破綻する</text>
      </svg>
    </div>
  </body>
</html>
