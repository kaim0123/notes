<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="データの置き場所を用途で選び分けるための図。まず問うのは、表と関係で扱うデータかどうか。そうであれば、通常の規模ならマネージドなリレーショナルデータベースを選び、地理をまたいで一貫性を保ったまま極端に伸ばす必要がある場合だけ、分散型のリレーショナルデータベースを検討する。表と関係でない場合は、アプリから直接読み書きする文書型か、大量の記録をまとめて集計する分析用かに分かれる。前者は画面に出す用途、後者は集計と分析の用途であり、同じデータを両方へ流すことも珍しくない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="240" y="30" width="280" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="58" font-size="10.5" text-anchor="middle">表と関係で扱うデータか</text>

        <line x1="240" y1="52" x2="180" y2="52" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="210" y="42" font-size="9" text-anchor="middle" class="muted">はい</text>
        <line x1="520" y1="52" x2="580" y2="52" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="550" y="42" font-size="9" text-anchor="middle" class="muted">いいえ</text>

        <rect x="20" y="96" width="300" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="170" y="118" font-size="10.5" text-anchor="middle">マネージドなリレーショナル</text>
        <text x="170" y="136" font-size="9" text-anchor="middle" class="muted">通常の規模はこれで足りる</text>

        <rect x="20" y="160" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="170" y="182" font-size="10.5" text-anchor="middle">分散型のリレーショナル</text>
        <text x="170" y="200" font-size="9" text-anchor="middle" class="muted">地理をまたいで一貫性を保ちつつ</text>
        <text x="170" y="214" font-size="9" text-anchor="middle" class="muted">極端に伸ばす必要があるときだけ</text>

        <rect x="440" y="96" width="300" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="590" y="118" font-size="10.5" text-anchor="middle">文書型 ― 画面に出すため</text>
        <text x="590" y="136" font-size="9" text-anchor="middle" class="muted">アプリから直接読み書きする</text>

        <rect x="440" y="160" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="590" y="182" font-size="10.5" text-anchor="middle">分析用 ― まとめて集計するため</text>
        <text x="590" y="200" font-size="9" text-anchor="middle" class="muted">大量の記録を、後からまとめて読む</text>
        <text x="590" y="214" font-size="9" text-anchor="middle" class="muted">画面の応答には使わない</text>

        <text x="20" y="256" font-size="10.5" class="muted">同じデータを両方へ流すことも珍しくない ― 画面用と分析用は、要求が根本的に違う。</text>
        <text x="20" y="278" font-size="10.5" class="muted">迷ったときは、左上から始める。伸びなくて困ってから右や下を考えても遅くない。</text>
      </svg>
    </div>
  </body>
</html>
