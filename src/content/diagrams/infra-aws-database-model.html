<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="リレーショナル型とキーバリュー型で、設計の出発点が逆になることを示した図。リレーショナル型ではまずデータの構造を正規化して整え、必要になった問い合わせは後から結合や条件で組み立てる。構造が先で、問い合わせが後になる。キーバリュー型では逆に、どんな問い合わせを何回するかを先に洗い出し、その取り出し方に合わせてキーの持ち方を決める。問い合わせが先で、構造が後になる。だから後から新しい取り出し方が必要になったとき、前者は問い合わせを書けば済むことが多いが、後者はデータの持ち方そのものを作り直すことになりやすい。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="175" y="28" font-size="11.5" text-anchor="middle">リレーショナル型</text>
        <rect x="20" y="46" width="310" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="175" y="66" font-size="10.5" text-anchor="middle">1. 構造を整える</text>
        <text x="175" y="82" font-size="9" text-anchor="middle" class="muted">重複を無くし、関係で結ぶ</text>
        <line x1="175" y1="94" x2="175" y2="114" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="20" y="118" width="310" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="175" y="138" font-size="10.5" text-anchor="middle">2. 問い合わせは後から組み立てる</text>
        <text x="175" y="154" font-size="9" text-anchor="middle" class="muted">結合と条件で、必要な形に取り出す</text>
        <text x="175" y="192" font-size="10" text-anchor="middle" class="accent">新しい取り出し方は、書けば足りることが多い</text>

        <line x1="350" y1="20" x2="350" y2="240" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="525" y="28" font-size="11.5" text-anchor="middle">キーバリュー型</text>
        <rect x="370" y="46" width="310" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="525" y="66" font-size="10.5" text-anchor="middle">1. 問い合わせを先に洗い出す</text>
        <text x="525" y="82" font-size="9" text-anchor="middle" class="muted">何をどう取り出すかを列挙する</text>
        <line x1="525" y1="94" x2="525" y2="114" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="370" y="118" width="310" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="525" y="138" font-size="10.5" text-anchor="middle">2. その取り出し方に合わせて持つ</text>
        <text x="525" y="154" font-size="9" text-anchor="middle" class="muted">キーの設計が、そのまま性能を決める</text>
        <text x="525" y="192" font-size="10" text-anchor="middle" class="accent">新しい取り出し方は、持ち方の作り直しになりやすい</text>

        <text x="20" y="228" font-size="10.5" class="muted">出発点が逆 ― 構造が先か、問い合わせが先か。規模が伸びるのは後者だが、変更に弱いのも後者。</text>
        <text x="20" y="250" font-size="10.5" class="muted">「速いから選ぶ」のではなく、取り出し方が安定しているかで選ぶ。</text>
      </svg>
    </div>
  </body>
</html>
