<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="負荷を上げていったときのスループットと応答時間の変化を1枚のグラフに重ねた図。横軸は同時実行数すなわちかけた負荷、縦軸は測定値。スループットは負荷に比例して伸びていくが、ある点から伸びが鈍り、やがて水平になる。応答時間はそれまでほぼ横ばいだったのが、スループットが頭打ちになったあたりから急激に立ち上がる。この2本の線の性質が入れ替わる地点が実質的な限界であり、縦の破線で示されている。この点より右では、負荷を増やしても処理できる件数は増えず、待たされる時間だけが伸びる。読み取るときは平均ではなく95パーセンタイルや99パーセンタイルを見ること、そして限界に達したときにどの資源が先に尽きたのかを1つ特定することが要点になる。"
      >
        <text x="16" y="26" font-size="11" class="muted">負荷を上げていくと、2本の線の性質が途中で入れ替わる</text>

        <line x1="70" y1="230" x2="610" y2="230" stroke="var(--border)" stroke-width="1.2" />
        <line x1="70" y1="50" x2="70" y2="230" stroke="var(--border)" stroke-width="1.2" />
        <text x="340" y="252" font-size="9.5" text-anchor="middle" class="muted">同時実行数(かけた負荷)</text>

        <polyline points="70,215 160,160 250,120 340,102 430,96 520,95 610,95" fill="none" stroke="var(--muted)" stroke-width="1.8" />
        <text x="140" y="148" font-size="9.5" class="muted">スループット(件/秒)</text>

        <polyline points="70,222 160,220 250,216 340,208 400,188 460,140 520,90 610,58" fill="none" stroke="var(--primary)" stroke-width="1.8" />
        <text x="470" y="112" font-size="9.5" class="accent">応答時間(p95)</text>

        <line x1="370" y1="44" x2="370" y2="236" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="4 4" />
        <text x="370" y="38" font-size="10" text-anchor="middle" class="accent">実質的な限界</text>

        <text x="150" y="270" font-size="9" class="muted">件数は伸び、待ち時間は変わらない</text>
        <text x="430" y="270" font-size="9" class="muted">件数は伸びず、待ち時間だけ伸びる</text>

        <line x1="16" y1="284" x2="624" y2="284" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="304" font-size="10.5" class="muted">読むときは平均ではなくp95・p99を見る。平均は、遅い数%を完全に覆い隠す。</text>
      </svg>
    </div>
  </body>
</html>
