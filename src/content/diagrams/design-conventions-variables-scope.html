<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 290" role="img" aria-label="変数名の長さとスコープの長さの関係を示した図。左は2行で閉じるループで、カウンタがiという1文字でも誰も困らない。中央は20行ほどの関数で、userとして意味の分かる名前が必要になる。右は50行を超えるスコープやモジュール全体で、activeSubscriptionCountのように長くても具体的な名前が要る。スコープが長い変数ほど名前は長くてよい、という関係を示す。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">スコープが長い変数ほど、名前は長くてよい</text>

        <rect x="30" y="50" width="180" height="130" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="120" y="74" text-anchor="middle" font-size="10.5" class="muted">2〜3行で閉じる</text>
        <rect x="52" y="88" width="136" height="30" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="120" y="108" text-anchor="middle" font-size="11" class="mono hi">i</text>
        <text x="120" y="140" text-anchor="middle" font-size="10" class="muted">短いループの</text>
        <text x="120" y="156" text-anchor="middle" font-size="10" class="muted">カウンタ</text>

        <rect x="240" y="50" width="180" height="130" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="330" y="74" text-anchor="middle" font-size="10.5" class="muted">20行程度の関数</text>
        <rect x="262" y="88" width="136" height="30" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="330" y="108" text-anchor="middle" font-size="11" class="mono hi">user</text>
        <text x="330" y="140" text-anchor="middle" font-size="10" class="muted">意味が分かる</text>
        <text x="330" y="156" text-anchor="middle" font-size="10" class="muted">最小限の名前</text>

        <rect x="450" y="50" width="180" height="130" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="540" y="74" text-anchor="middle" font-size="10.5" class="muted">モジュール全体</text>
        <rect x="462" y="88" width="156" height="30" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="540" y="108" text-anchor="middle" font-size="9.5" class="mono hi">activeSubscriptionCount</text>
        <text x="540" y="140" text-anchor="middle" font-size="10" class="muted">長くても、具体的で</text>
        <text x="540" y="156" text-anchor="middle" font-size="10" class="muted">曖昧さがないこと</text>

        <line x1="30" y1="212" x2="630" y2="212" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />
        <text x="40" y="234" font-size="10.5" class="muted">スコープ 短い</text>
        <text x="620" y="234" text-anchor="end" font-size="10.5" class="muted">スコープ 長い</text>

        <text x="330" y="272" text-anchor="middle" font-size="11" class="muted">
          定義まで戻らないと意味が取れない名前は、そのスコープに対して短すぎる
        </text>
      </svg>
    </div>
  </body>
</html>
