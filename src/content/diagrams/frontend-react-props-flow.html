<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="一方向データフローを示した図。上に親コンポーネントがあり、状態を持っている。そこから下の子コンポーネントへ向かって実線の矢印が伸び、データがpropsとして渡される。子から親へは破線の矢印が上っていくが、これはデータではなく変更の依頼にすぎない。実際に状態を書き換えるのは親だけで、書き換わった結果はまた上から下へ流れて画面に反映される。右側に、この向きが一定であるおかげで、正しい値がどこにあるか常に1か所に決まるという注記がある。双方向に流れる設計では、子が持つ値と親が持つ値のどちらが正なのかを場面ごとに判断することになる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="150" y="30" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="270" y="58" text-anchor="middle" font-size="12.5">親コンポーネント</text>
        <text x="270" y="82" text-anchor="middle" font-size="10.5" class="lbl">state を持つ ― ここだけが書き換える</text>

        <line x1="216" y1="100" x2="216" y2="176" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arp)" />
        <text x="112" y="130" font-size="10.5" class="lbl">props</text>
        <text x="94" y="148" font-size="10" class="muted">データそのもの</text>

        <path d="M324 176 L324 100" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)" />
        <text x="340" y="130" font-size="10.5" class="muted">コールバック</text>
        <text x="340" y="148" font-size="10" class="muted">変更の依頼(データではない)</text>

        <rect x="150" y="180" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="270" y="208" text-anchor="middle" font-size="12.5">子コンポーネント</text>
        <text x="270" y="232" text-anchor="middle" font-size="10.5" class="muted">受け取って表示する ― 書き換えない</text>

        <rect x="418" y="30" width="204" height="100" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="434" y="54" font-size="11">向きが一定だから ―</text>
        <text x="434" y="78" font-size="10.5" class="muted">正しい値がどこにあるかが</text>
        <text x="434" y="96" font-size="10.5" class="muted">常に1か所に決まる</text>
        <text x="434" y="118" font-size="10.5" class="lbl">状態から画面を説明できる</text>

        <rect x="418" y="146" width="204" height="104" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="434" y="170" font-size="11">双方向だと ―</text>
        <text x="434" y="194" font-size="10.5" class="muted">子の値と親の値のどちらが正か</text>
        <text x="434" y="212" font-size="10.5" class="muted">場面ごとに判断することになる</text>
        <text x="434" y="236" font-size="10.5" class="muted">追える保証が失われる</text>

        <text x="20" y="284" font-size="10.5" class="muted">子が props を書き換えると、親の値は変わったのに参照は同じ ― 画面だけが古いまま残る</text>
      </svg>
    </div>
  </body>
</html>
