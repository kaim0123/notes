<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 316"
        role="img"
        aria-label="Cache-Controlの指定によって、応答がどこまで残るかを比べた図。指定なしの場合、キャッシュしてよいかの判断は各機器の実装に委ねられ、ブラウザにも共有CDNにも残る可能性がある。publicと書いた場合は、ブラウザにも共有CDNにも積極的に保存され、誰が見ても同じページ向けの指定になる。privateと書いた場合は、共有CDNには保存されずブラウザの中だけに残るため、その利用者専用の応答に使える。no-storeと書いた場合はどちらにも残らず、個人向けの重要なページはこれを明示する。判断を委ねるのではなく、意図を必ず書くことが要点になる。"
      >
        <text x="140" y="46" font-size="10" text-anchor="middle" class="muted">Cache-Control の指定</text>
        <text x="420" y="46" font-size="10" text-anchor="middle" class="muted">共有CDN・プロキシ</text>
        <text x="600" y="46" font-size="10" text-anchor="middle" class="muted">ブラウザの中</text>

        <rect x="20" y="60" width="240" height="44" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="20" y="116" width="240" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="172" width="240" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="228" width="240" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />

        <text x="140" y="79" font-size="10.5" text-anchor="middle" class="mono accent">(指定なし)</text>
        <text x="140" y="95" font-size="8.5" text-anchor="middle" class="muted">機器の実装まかせ</text>
        <text x="140" y="135" font-size="10.5" text-anchor="middle" class="mono">public</text>
        <text x="140" y="151" font-size="8.5" text-anchor="middle" class="muted">誰が見ても同じページ</text>
        <text x="140" y="191" font-size="10.5" text-anchor="middle" class="mono">private</text>
        <text x="140" y="207" font-size="8.5" text-anchor="middle" class="muted">その人専用の応答</text>
        <text x="140" y="247" font-size="10.5" text-anchor="middle" class="mono">no-store</text>
        <text x="140" y="263" font-size="8.5" text-anchor="middle" class="muted">個人向けの重要なページ</text>

        <text x="420" y="88" font-size="10" text-anchor="middle" class="accent">残るかもしれない</text>
        <text x="420" y="144" font-size="10" text-anchor="middle" class="muted">残る</text>
        <text x="420" y="200" font-size="10" text-anchor="middle" class="muted">残らない</text>
        <text x="420" y="256" font-size="10" text-anchor="middle" class="muted">残らない</text>

        <line x1="530" y1="60" x2="530" y2="272" stroke="var(--border)" stroke-width="1" />

        <text x="620" y="88" font-size="10" text-anchor="middle" class="accent">残るかもしれない</text>
        <text x="620" y="144" font-size="10" text-anchor="middle" class="muted">残る</text>
        <text x="620" y="200" font-size="10" text-anchor="middle" class="muted">残る</text>
        <text x="620" y="256" font-size="10" text-anchor="middle" class="muted">残らない</text>

        <line x1="16" y1="284" x2="744" y2="284" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="304" font-size="10.5" class="accent">いちばん危ないのは1行目 ― 書かなければ安全側に倒れる、という保証はどこにもない。</text>
      </svg>
    </div>
  </body>
</html>
