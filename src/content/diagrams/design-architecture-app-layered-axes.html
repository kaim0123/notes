<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="水平分割と垂直分割の対比図。左のレイヤー分割では、controllers・services・repositories という技術的役割ごとのフォルダが横に積まれ、注文機能を1つ作るには3つの層を縦断してファイルを行き来する必要がある。右の機能分割では、orders・users・billing という機能ごとのフォルダが縦に並び、1つの機能に必要なコードが1箇所にまとまる。切り口が90度違うことを示す。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">技術的役割で水平に分ける</text>

        <rect x="40" y="46" width="250" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="71" text-anchor="middle" font-size="10.5" class="mono">controllers/</text>
        <rect x="40" y="94" width="250" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="119" text-anchor="middle" font-size="10.5" class="mono">services/</text>
        <rect x="40" y="142" width="250" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="167" text-anchor="middle" font-size="10.5" class="mono">repositories/</text>

        <line x1="70" y1="46" x2="70" y2="182" stroke="var(--primary)" stroke-width="2" stroke-dasharray="4 3" />
        <text x="165" y="212" text-anchor="middle" font-size="10.5" class="hi">1機能を作るには、3つの層を縦断する</text>
        <text x="165" y="238" text-anchor="middle" font-size="11" class="muted">同種の処理は1箇所に集まるが、</text>
        <text x="165" y="256" text-anchor="middle" font-size="11" class="muted">1案件の作業はファイルを行き来する</text>

        <line x1="330" y1="30" x2="330" y2="270" stroke="var(--border)" stroke-width="1.2" />

        <text x="495" y="26" text-anchor="middle" font-size="12.5" font-weight="600">機能で垂直に分ける</text>

        <rect x="370" y="46" width="76" height="136" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="408" y="70" text-anchor="middle" font-size="10" class="mono">orders/</text>
        <text x="408" y="98" text-anchor="middle" font-size="9" class="muted">画面</text>
        <text x="408" y="122" text-anchor="middle" font-size="9" class="muted">ロジック</text>
        <text x="408" y="146" text-anchor="middle" font-size="9" class="muted">DB</text>

        <rect x="456" y="46" width="76" height="136" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="494" y="70" text-anchor="middle" font-size="10" class="mono">users/</text>
        <text x="494" y="98" text-anchor="middle" font-size="9" class="muted">画面</text>
        <text x="494" y="122" text-anchor="middle" font-size="9" class="muted">ロジック</text>
        <text x="494" y="146" text-anchor="middle" font-size="9" class="muted">DB</text>

        <rect x="542" y="46" width="76" height="136" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="580" y="70" text-anchor="middle" font-size="10" class="mono">billing/</text>
        <text x="580" y="98" text-anchor="middle" font-size="9" class="muted">画面</text>
        <text x="580" y="122" text-anchor="middle" font-size="9" class="muted">ロジック</text>
        <text x="580" y="146" text-anchor="middle" font-size="9" class="muted">DB</text>

        <text x="495" y="212" text-anchor="middle" font-size="10.5" class="hi">1機能に必要なものが1箇所にまとまる</text>
        <text x="495" y="238" text-anchor="middle" font-size="11" class="muted">案件ごとの動きは速いが、</text>
        <text x="495" y="256" text-anchor="middle" font-size="11" class="muted">似た処理が機能ごとに重複しやすい</text>

        <text x="330" y="290" text-anchor="middle" font-size="11" class="muted">同じ「分割」でも、切り口が90度違う</text>
      </svg>
    </div>
  </body>
</html>
