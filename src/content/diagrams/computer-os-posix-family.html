<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="UNIX系OSの系譜。1969年にベル研究所で生まれたUNIXを源流に、認定を受けた商用UNIX(macOS・Solaris・AIX)、BSD(FreeBSD・OpenBSD)、UNIX系のLinux(Ubuntu・Fedoraなど)へ分かれる。POSIXは、その全員が従う最低限の共通ルールとして全体の土台に置かれている。" viewBox="0 0 640 260">
      <rect x="250" y="16" width="140" height="40" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="320" y="40" fill="var(--fg)" font-size="13" text-anchor="middle">UNIX (1969, ベル研)</text>

      <line x1="320" y1="56" x2="120" y2="100" stroke="var(--muted)" stroke-width="1" />
      <line x1="320" y1="56" x2="320" y2="100" stroke="var(--muted)" stroke-width="1" />
      <line x1="320" y1="56" x2="520" y2="100" stroke="var(--muted)" stroke-width="1" />

      <rect x="40" y="100" width="160" height="64" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="120" y="126" fill="var(--fg)" font-size="12" text-anchor="middle">商用UNIX(認定)</text>
      <text x="120" y="146" fill="var(--muted)" font-size="11" text-anchor="middle">macOS/Solaris/AIX</text>

      <rect x="240" y="100" width="160" height="64" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="320" y="126" fill="var(--fg)" font-size="12" text-anchor="middle">BSD</text>
      <text x="320" y="146" fill="var(--muted)" font-size="11" text-anchor="middle">FreeBSD/OpenBSD</text>

      <rect x="440" y="100" width="160" height="64" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="520" y="126" fill="var(--fg)" font-size="12" text-anchor="middle">Linux(UNIX系)</text>
      <text x="520" y="146" fill="var(--muted)" font-size="11" text-anchor="middle">Ubuntu/Fedora…</text>

      <rect x="40" y="196" width="560" height="44" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="320" y="223" fill="var(--fg)" font-size="13" text-anchor="middle">POSIX ― 全員が従う「最低限の共通ルール」</text>
      <line x1="120" y1="164" x2="120" y2="196" stroke="var(--muted)" stroke-width="1" />
      <line x1="320" y1="164" x2="320" y2="196" stroke="var(--muted)" stroke-width="1" />
      <line x1="520" y1="164" x2="520" y2="196" stroke="var(--muted)" stroke-width="1" />
      </svg>
    </div>
  </body>
</html>
