<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 340"
        role="img"
        aria-label="テストピラミッドとアイスクリームコーン型を左右に並べて比べた図。左のテストピラミッドは、底に最も幅の広いUnitの層、中間にIntegrationの層、頂点に最も狭いE2Eの層が積まれている。下ほど数が多く、速く、失敗したときに原因の箇所がすぐ絞れる。右のアイスクリームコーン型は上下が逆で、最上段のE2Eが最も幅広く、Unitが頂点のように細くなっている。実行に時間がかかり、失敗しても原因の範囲が広く、誰も直したがらないテストスイートになる。図の下部には、テストが遅くてたまに落ちて放置されはじめたら形が崩れた合図である、と記されている。"
      >
        <text x="160" y="30" font-size="12" text-anchor="middle" class="accent">テストピラミッド</text>
        <text x="160" y="48" font-size="9.5" text-anchor="middle" class="muted">下ほど多く積む</text>
        <text x="480" y="30" font-size="12" text-anchor="middle" class="muted">アイスクリームコーン型</text>
        <text x="480" y="48" font-size="9.5" text-anchor="middle" class="muted">反面教師</text>

        <polygon points="140,70 180,70 213,123 107,123" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <polygon points="107,123 213,123 247,177 73,177" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <polygon points="73,177 247,177 280,230 40,230" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="160" y="101" font-size="10.5" text-anchor="middle">E2E</text>
        <text x="160" y="155" font-size="10.5" text-anchor="middle">Integration</text>
        <text x="160" y="209" font-size="10.5" text-anchor="middle">Unit</text>

        <polygon points="360,70 600,70 567,123 393,123" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <polygon points="393,123 567,123 533,177 427,177" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <polygon points="427,177 533,177 500,230 460,230" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="101" font-size="10.5" text-anchor="middle" class="muted">E2E</text>
        <text x="480" y="155" font-size="10.5" text-anchor="middle" class="muted">Integration</text>
        <text x="480" y="209" font-size="10.5" text-anchor="middle" class="muted">Unit</text>

        <line x1="320" y1="60" x2="320" y2="262" stroke="var(--border)" stroke-width="1" />

        <text x="160" y="252" font-size="10" text-anchor="middle" class="muted">速く、失敗した箇所がすぐ絞れる</text>
        <text x="480" y="252" font-size="10" text-anchor="middle" class="muted">遅く、落ちても原因の範囲が広い</text>

        <line x1="16" y1="282" x2="624" y2="282" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="304" font-size="10.5" class="muted">同じ数のテストでも、どの層に置くかで実行時間と原因の特定しやすさが変わる。配分そのものが方針になる。</text>
        <text x="16" y="324" font-size="10.5" class="accent">テストが「遅くて、たまに落ちて、誰も直したがらない」状態になったら、形が崩れた合図。</text>
      </svg>
    </div>
  </body>
</html>
