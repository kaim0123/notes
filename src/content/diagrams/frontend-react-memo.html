<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 310" role="img" aria-label="メモ化が効く場合と効かない場合を比べた図。上段では親が再描画されるたびに、その場で新しく作られた関数が子へ渡される。子はReact.memoで包まれているが、渡された関数の参照が毎回異なるため前回と同じpropsとは判定されず、結局毎回再描画される。下段では関数の参照をuseCallbackで安定させているため、親が再描画されても子に渡る参照は同じままとなり、子の再描画がスキップされる。React.memoとuseCallbackは片方だけでは効かず、組み合わせて初めて意味を持つ。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="28" font-size="11.5" class="muted">その場で関数を作って渡す</text>
        <rect x="20" y="40" width="170" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="64" font-size="11">親が再描画</text>
        <text x="36" y="86" font-size="10" class="muted">onSelect={"{"}(id) =&gt; ...{"}"}</text>

        <line x1="190" y1="70" x2="228" y2="70" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="209" y="60" text-anchor="middle" font-size="9.5" class="muted">毎回</text>
        <text x="209" y="88" text-anchor="middle" font-size="9.5" class="muted">別の参照</text>

        <rect x="232" y="40" width="180" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="248" y="64" font-size="11">React.memo(子)</text>
        <text x="248" y="86" font-size="10" class="muted">前回と同じ props か? → いいえ</text>

        <line x1="412" y1="70" x2="450" y2="70" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="454" y="40" width="166" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="470" y="76" font-size="11" class="muted">結局 毎回 再描画される</text>

        <text x="20" y="128" font-size="10.5" class="muted">React.memo だけでは効かない ― 参照が毎回変わるため</text>

        <line x1="20" y1="150" x2="620" y2="150" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="178" font-size="11.5" class="lbl">useCallback で参照を安定させる</text>
        <rect x="20" y="190" width="170" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="36" y="214" font-size="11">親が再描画</text>
        <text x="36" y="236" font-size="10" class="lbl">useCallback(..., [])</text>

        <line x1="190" y1="220" x2="228" y2="220" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="209" y="210" text-anchor="middle" font-size="9.5" class="lbl">同じ</text>
        <text x="209" y="238" text-anchor="middle" font-size="9.5" class="lbl">参照</text>

        <rect x="232" y="190" width="180" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="248" y="214" font-size="11">React.memo(子)</text>
        <text x="248" y="236" font-size="10" class="muted">前回と同じ props か? → はい</text>

        <line x1="412" y1="220" x2="450" y2="220" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <rect x="454" y="190" width="166" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="470" y="226" font-size="11" class="lbl">再描画をスキップ</text>

        <text x="20" y="288" font-size="10.5" class="lbl">2つは組み合わせて初めて効く ― 片方だけでは意味がない</text>
      </svg>
    </div>
  </body>
</html>
