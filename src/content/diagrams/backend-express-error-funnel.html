<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 330" role="img" aria-label="各ハンドラが自分で応答を組み立てるのではなく、エラーを1つの出口へ集める形を示した図。左に3つのハンドラが縦に並び、それぞれ違う種類の失敗を起こす。ひとつは対象が見つからない場合、ひとつは権限が足りない場合、ひとつは想定外の例外。3本の線はいずれも中央の1点へ収束し、そこから引数を4つ取る受け止め役へ入る。受け止め役は、エラーの種類を見てステータスコードと応答の形を決め、ログには詳細を残す。右側にはその出力として、統一された形のJSONが1つだけ描かれている。図の下部には、この形にしないとどうなるかが示されている。各ハンドラが自分で応答を組み立てると、応答の形が揃わず、記録の粒度もばらばらになり、あとから形式を変えたいときに全ハンドラを直すことになる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">投げて、出口で受ける</text>

        <rect x="16" y="42" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="65" font-size="9.5" class="muted">見つからない</text>
        <rect x="16" y="92" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="115" font-size="9.5" class="muted">権限が足りない</text>
        <rect x="16" y="142" width="150" height="36" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="165" font-size="9.5" class="muted">想定外の例外</text>

        <path d="M166,60 C 220,60 220,110 254,110" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <path d="M166,110 h88" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <path d="M166,160 C 220,160 220,110 254,110" fill="none" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="176" y="132" font-size="9" class="lbl mono">next(err)</text>

        <rect x="258" y="76" width="180" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="272" y="98" font-size="10" class="lbl">引数4つの受け止め役</text>
        <text x="272" y="117" font-size="9" class="muted">種類を見てコードを決める</text>
        <text x="272" y="134" font-size="9" class="muted">ログには詳細を残す</text>

        <line x1="438" y1="110" x2="466" y2="110" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <rect x="470" y="86" width="150" height="50" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="484" y="106" font-size="9.5" class="muted">統一された形の応答</text>
        <text x="484" y="124" font-size="9" class="mono muted">{ code, message }</text>

        <line x1="16" y1="206" x2="624" y2="206" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="232" font-size="11" class="muted">この形にしないと ―</text>

        <rect x="16" y="246" width="190" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="30" y="268" font-size="9.5" class="muted">応答の形が揃わない</text>
        <text x="30" y="288" font-size="9" class="muted">呼ぶ側が場合分けを迫られる</text>

        <rect x="222" y="246" width="190" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="236" y="268" font-size="9.5" class="muted">記録の粒度がばらばら</text>
        <text x="236" y="288" font-size="9" class="muted">出す場所と出さない場所が混在</text>

        <rect x="428" y="246" width="192" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="442" y="268" font-size="9.5" class="muted">形式を変えたいとき</text>
        <text x="442" y="288" font-size="9" class="muted">全ハンドラを直すことになる</text>
      </svg>
    </div>
  </body>
</html>
