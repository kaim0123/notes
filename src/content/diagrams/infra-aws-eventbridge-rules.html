<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="届いた出来事の内容を見て宛先を決める仕組みを示した図。左からさまざまな種類の出来事がバスへ流れ込み、あらかじめ書いておいた条件と照らし合わせる。条件に合ったものだけが、その条件に紐づく宛先へ渡される。1つの条件から複数の宛先へ同時に渡すこともでき、どの条件にも合わない出来事はどこへも行かない。重要なのは、送る側が宛先を一切知らないことで、つなぎ方の変更が設定の書き換えだけで済む。外部サービスで起きた出来事や、決まった時刻での起動も同じ枠組みで扱える。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="130" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="73" font-size="9.5" text-anchor="middle" class="muted">注文が確定した</text>
        <rect x="20" y="96" width="130" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="119" font-size="9.5" text-anchor="middle" class="muted">支払いが失敗した</text>
        <rect x="20" y="142" width="130" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="165" font-size="9.5" text-anchor="middle" class="muted">外部サービスの通知</text>
        <rect x="20" y="188" width="130" height="36" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="85" y="211" font-size="9.5" text-anchor="middle" class="muted">毎朝9時</text>

        <line x1="156" y1="68" x2="216" y2="120" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="156" y1="114" x2="216" y2="130" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="156" y1="160" x2="216" y2="140" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="156" y1="206" x2="216" y2="150" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="222" y="80" width="150" height="110" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="297" y="106" font-size="10.5" text-anchor="middle">バス</text>
        <text x="297" y="130" font-size="9" text-anchor="middle" class="muted">中身を見て</text>
        <text x="297" y="148" font-size="9" text-anchor="middle" class="muted">条件と照らす</text>
        <text x="297" y="172" font-size="9" text-anchor="middle" class="accent">合うものだけ渡す</text>

        <line x1="378" y1="110" x2="428" y2="76" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="378" y1="135" x2="428" y2="140" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="378" y1="160" x2="428" y2="204" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="434" y="54" width="150" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="509" y="72" font-size="9.5" text-anchor="middle">条件A に合う</text>
        <text x="509" y="88" font-size="8.5" text-anchor="middle" class="muted">→ 関数を呼ぶ</text>
        <rect x="434" y="118" width="150" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="509" y="136" font-size="9.5" text-anchor="middle">条件B に合う</text>
        <text x="509" y="152" font-size="8.5" text-anchor="middle" class="muted">→ キューへ入れる</text>
        <rect x="434" y="182" width="150" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="509" y="200" font-size="9.5" text-anchor="middle">条件C に合う</text>
        <text x="509" y="216" font-size="8.5" text-anchor="middle" class="muted">→ 複数の宛先へ</text>

        <text x="600" y="76" font-size="9.5" class="muted">1つの条件から</text>
        <text x="600" y="94" font-size="9.5" class="muted">複数へ渡せる</text>
        <text x="600" y="140" font-size="9.5" class="muted">どれにも合わない</text>
        <text x="600" y="158" font-size="9.5" class="muted">出来事は、どこへも</text>
        <text x="600" y="176" font-size="9.5" class="muted">行かない</text>

        <text x="20" y="256" font-size="10.5" class="accent">送る側は宛先を知らない ― つなぎ方の変更が、設定の書き換えだけで済む。</text>
      </svg>
    </div>
  </body>
</html>
