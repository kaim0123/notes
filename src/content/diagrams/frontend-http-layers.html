<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 290" role="img" aria-label="HTTP通信のまわりにできる層を、下から上へ積み上げた図。いちばん下がブラウザ標準のfetchで、1回のリクエストを送って応答を受け取る。その上がHTTPクライアント層で、基底URLや認証の付与、エラーの正規化をまとめる。その上がデータ取得層で、キャッシュ・重複排除・再検証・再試行・読み込み状態を受け持つ。いちばん上がコンポーネントで、受け取った値を表示するだけになる。右側の矢印は、上の層ほど書かなくて済むことが増える一方、下で何が起きているかは見えにくくなることを示している。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="30" y="34" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="48" y="56" font-size="12">コンポーネント</text>
        <text x="48" y="74" font-size="10.5" class="muted">データと読み込み状態を受け取って表示するだけ</text>

        <rect x="30" y="94" width="440" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="48" y="116" font-size="12">データ取得層</text>
        <text x="48" y="136" font-size="10.5" class="muted">キャッシュ・重複排除・再検証・再試行・読み込み状態</text>

        <rect x="30" y="158" width="440" height="52" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="48" y="180" font-size="12">HTTPクライアント層(axios / 自作ラッパー)</text>
        <text x="48" y="200" font-size="10.5" class="muted">基底URL・認証の付与・タイムアウト・エラーの正規化</text>

        <rect x="30" y="222" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="48" y="244" font-size="12">fetch(ブラウザ標準)</text>
        <text x="48" y="262" font-size="10.5" class="muted">1回のリクエストを送り、応答を受け取る</text>

        <line x1="500" y1="250" x2="500" y2="50" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="516" y="90" font-size="10.5" class="lbl">上へ行くほど</text>
        <text x="516" y="110" font-size="10.5" class="lbl">書かなくて済む</text>
        <text x="516" y="200" font-size="10.5" class="muted">下へ行くほど</text>
        <text x="516" y="220" font-size="10.5" class="muted">何が起きているか</text>
        <text x="516" y="240" font-size="10.5" class="muted">が見える</text>
      </svg>
    </div>
  </body>
</html>
