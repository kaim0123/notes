<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --destructive: oklch(0.6 0.24 27);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
      .warn {
        fill: var(--destructive);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="ページネーション方式の比較。OFFSET方式で501ページ目を取ると、DBは10020行を読んで先頭10000行を捨て、20行だけ返すため深いページほど遅くなる。カーソル方式は前ページ末尾の値を条件に渡し、インデックスでその位置から20行だけを読むため、何ページ目でもコストが変わらない。"
      >
        <text x="380" y="26" text-anchor="middle" font-size="12" class="muted">501ページ目(1ページ20件)を表示するとき</text>

        <!-- OFFSET方式 -->
        <rect x="30" y="44" width="340" height="248" rx="10" fill="var(--card)" stroke="var(--destructive)" stroke-width="1.5" />
        <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="600">OFFSET方式</text>
        <text x="200" y="92" text-anchor="middle" font-size="11" class="mono muted">LIMIT 20 OFFSET 10000</text>

        <rect x="58" y="112" width="284" height="34" rx="6" fill="none" stroke="var(--destructive)" stroke-width="1.4" />
        <text x="200" y="134" text-anchor="middle" font-size="11.5" class="warn">先頭から10,020行を読む</text>

        <rect x="58" y="158" width="284" height="34" rx="6" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="200" y="180" text-anchor="middle" font-size="11.5" class="muted">うち10,000行は捨てる</text>

        <rect x="58" y="204" width="60" height="34" rx="6" fill="none" stroke="var(--border)" stroke-width="1.4" />
        <text x="88" y="226" text-anchor="middle" font-size="11.5">20行</text>
        <text x="132" y="226" font-size="11.5" class="muted">だけ返す</text>

        <text x="200" y="268" text-anchor="middle" font-size="11" class="warn">深いページほど読み飛ばす行が増えて遅くなる</text>

        <!-- カーソル方式 -->
        <rect x="390" y="44" width="340" height="248" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="560" y="70" text-anchor="middle" font-size="13" font-weight="600">カーソル方式</text>
        <text x="560" y="92" text-anchor="middle" font-size="11" class="mono muted">WHERE (更新日時, ID) &lt; 前ページ末尾</text>

        <rect x="418" y="112" width="284" height="34" rx="6" fill="none" stroke="var(--primary)" stroke-width="1.4" />
        <text x="560" y="134" text-anchor="middle" font-size="11.5" class="accent">インデックスで開始位置へ直行</text>

        <rect x="418" y="158" width="284" height="34" rx="6" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="5 4" />
        <text x="560" y="180" text-anchor="middle" font-size="11.5" class="muted">読み飛ばす行はゼロ</text>

        <rect x="418" y="204" width="60" height="34" rx="6" fill="none" stroke="var(--primary)" stroke-width="1.4" />
        <text x="448" y="226" text-anchor="middle" font-size="11.5" class="accent">20行</text>
        <text x="492" y="226" font-size="11.5" class="muted">だけ読んで返す</text>

        <text x="560" y="268" text-anchor="middle" font-size="11" class="accent">何ページ目でもコストが変わらない</text>

        <text x="380" y="322" text-anchor="middle" font-size="11" class="muted">
          カーソルに使う列(更新日時・IDなど)にもインデックスが必要。任意のページ番号への直接ジャンプはできなくなる
        </text>
      </svg>
    </div>
  </body>
</html>
