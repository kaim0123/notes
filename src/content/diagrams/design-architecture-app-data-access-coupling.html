<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 280" role="img" aria-label="オブジェクトとデータベースの対応づけ方を、結合度の順に並べた図。左のActive Recordではオブジェクト自身がDB操作のメソッドを持ち、最も密結合。中央のData Mapperでは変換専任のマッパーを挟むことで、ドメインオブジェクトはDBの存在を知らない。右のRepositoryではコレクションのように振る舞う窓口の裏側にDBが隠れ、呼び出し側はSQLもマッピングも意識しない。右へ行くほど疎結合になるが、用意する部品は増える。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="340" y="26" text-anchor="middle" font-size="11.5" class="muted">オブジェクト自身にDB操作をどこまで持たせるか</text>

        <text x="115" y="56" text-anchor="middle" font-size="12" font-weight="600">Active Record</text>
        <rect x="30" y="70" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="115" y="92" text-anchor="middle" font-size="10.5">Userオブジェクト</text>
        <text x="115" y="112" text-anchor="middle" font-size="9.5" class="mono muted">save() / findById()</text>
        <line x1="115" y1="130" x2="115" y2="158" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="55" y="162" width="120" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="115" y="184" text-anchor="middle" font-size="10">DB</text>
        <text x="115" y="222" text-anchor="middle" font-size="10" class="muted">書く量は少ないが、</text>
        <text x="115" y="238" text-anchor="middle" font-size="10" class="muted">業務と永続化が混ざる</text>

        <text x="340" y="56" text-anchor="middle" font-size="12" font-weight="600">Data Mapper</text>
        <rect x="255" y="70" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="340" y="92" text-anchor="middle" font-size="10.5">Userオブジェクト</text>
        <text x="340" y="112" text-anchor="middle" font-size="9.5" class="muted">DBを知らない</text>
        <line x1="340" y1="130" x2="340" y2="152" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <rect x="270" y="156" width="140" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="340" y="176" text-anchor="middle" font-size="9.5">マッパー(変換専任)</text>
        <line x1="340" y1="186" x2="340" y2="198" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="285" y="200" width="110" height="24" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="340" y="217" text-anchor="middle" font-size="9.5">DB</text>
        <text x="340" y="248" text-anchor="middle" font-size="10" class="muted">ドメインをDBから独立させられる</text>

        <text x="565" y="56" text-anchor="middle" font-size="12" font-weight="600">Repository</text>
        <rect x="480" y="70" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="565" y="92" text-anchor="middle" font-size="10.5">呼び出し側</text>
        <text x="565" y="112" text-anchor="middle" font-size="9.5" class="mono muted">orders.findById(1)</text>
        <line x1="565" y1="130" x2="565" y2="152" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <rect x="495" y="156" width="140" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="565" y="176" text-anchor="middle" font-size="9.5">コレクション風の窓口</text>
        <line x1="565" y1="186" x2="565" y2="198" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="510" y="200" width="110" height="24" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="565" y="217" text-anchor="middle" font-size="9.5">DB / API / キャッシュ</text>
        <text x="565" y="248" text-anchor="middle" font-size="10" class="muted">取得元そのものを隠せる</text>

        <line x1="30" y1="268" x2="650" y2="268" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <text x="40" y="264" font-size="10" class="muted">密結合</text>
        <text x="640" y="264" text-anchor="end" font-size="10" class="muted">疎結合(部品は増える)</text>
      </svg>
    </div>
  </body>
</html>
