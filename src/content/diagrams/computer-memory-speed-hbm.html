<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="従来のGDDRとHBMの実装の違い。GDDRは基板の上にDRAMチップを横並びに置くため配線が長くなり帯域に限界がある。HBMはDRAMを縦に多層で積み上げ、TSVで直結するため帯域が桁違いに大きくなる。" viewBox="0 0 640 240">
      <text x="150" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">従来 GDDR ― 基板に横並び</text>
      <rect x="40" y="150" width="220" height="18" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="150" y="185" fill="var(--muted)" font-size="11" text-anchor="middle">基板</text>
      <rect x="50" y="110" width="40" height="38" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="110" y="110" width="40" height="38" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="170" y="110" width="40" height="38" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="70" y="133" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="130" y="133" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="190" y="133" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="150" y="210" fill="var(--muted)" font-size="11" text-anchor="middle">配線が長い → 帯域に限界</text>

      <text x="480" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">HBM ― 縦に多層積み</text>
      <rect x="420" y="150" width="140" height="18" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <rect x="455" y="54" width="70" height="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="455" y="78" width="70" height="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="455" y="102" width="70" height="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <rect x="455" y="126" width="70" height="22" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="490" y="69" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="490" y="93" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="490" y="117" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <text x="490" y="141" fill="var(--fg)" font-size="10" text-anchor="middle">DRAM</text>
      <line x1="490" y1="54" x2="490" y2="150" stroke="var(--primary)" stroke-width="1" stroke-dasharray="2 2" />
      <text x="490" y="210" fill="var(--muted)" font-size="11" text-anchor="middle">TSVで直結 → 帯域が桁違い</text>
      </svg>
    </div>
  </body>
</html>
