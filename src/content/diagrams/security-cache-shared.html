<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="共有キャッシュで個人向けページが他人に配られる事故の流れを示した図。まずユーザーAがマイページを開くと、リクエストは共有CDNを経てオリジンに届く。オリジンがキャッシュ禁止を明示していないため、CDNはAさん向けに作られた応答をそのURLの内容として保存する。数秒後にユーザーBが同じURLを開くと、CDNはオリジンに問い合わせることなく、保存済みのAさんの画面をそのまま返してしまう。認証と認可がアプリ側で正しく実装されていても、その手前の層で応答が使い回された時点で意味を失う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="140" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="90" y="88" font-size="10.5" text-anchor="middle">ユーザーA</text>

        <rect x="280" y="52" width="190" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="375" y="76" font-size="10.5" text-anchor="middle">共有CDN・プロキシ</text>
        <text x="375" y="96" font-size="9" text-anchor="middle" class="muted">/mypage の応答を保存</text>

        <rect x="590" y="60" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="665" y="80" font-size="10.5" text-anchor="middle">オリジン</text>
        <text x="665" y="97" font-size="8.5" text-anchor="middle" class="muted">no-store を書いていない</text>

        <line x1="164" y1="83" x2="276" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="474" y1="83" x2="586" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="220" y="75" font-size="9" text-anchor="middle" class="mono muted">GET /mypage</text>
        <text x="530" y="75" font-size="9" text-anchor="middle" class="muted">Aさん向けに生成</text>

        <line x1="375" y1="118" x2="375" y2="164" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="392" y="146" font-size="9" class="muted">保存された応答が残っている</text>

        <rect x="20" y="166" width="140" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="90" y="188" font-size="10.5" text-anchor="middle" class="accent">ユーザーB</text>
        <text x="90" y="206" font-size="8.5" text-anchor="middle" class="muted">数秒後に同じURLへ</text>

        <rect x="280" y="166" width="190" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="375" y="188" font-size="10" text-anchor="middle" class="accent">オリジンに聞かずに返す</text>
        <text x="375" y="206" font-size="9" text-anchor="middle" class="muted">Aさんの画面がそのまま</text>

        <line x1="164" y1="192" x2="276" y2="192" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="500" y="196" font-size="9.5" class="muted">オリジンには、この事故の記録すら残らない</text>

        <line x1="16" y1="244" x2="744" y2="244" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="266" font-size="10.5" class="muted">キャッシュは「使い回し」。誰が見ても同じページでは利点になり、人によって中身が変わるページでは事故になる。</text>
        <text x="16" y="288" font-size="10.5" class="accent">認可を正しく実装しても、その手前の層で応答が使い回された時点で無効になる。</text>
      </svg>
    </div>
  </body>
</html>
