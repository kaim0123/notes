<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="セッションCookieに付ける3つの属性が、それぞれ別の脅威に対応していることを示した図。1行目は、XSSで注入されたスクリプトがCookieを読み取ろうとする脅威で、HttpOnly属性を付けるとJavaScriptからは読めなくなる。2行目は、暗号化されていない通信を経路上で盗み見る脅威で、Secure属性を付けるとHTTPSのときにしか送られなくなる。3行目は、他サイトを起点とする自動送信、つまりCSRFで、SameSite属性を付けるとその場合にCookieが添付されなくなる。1枚のCookieに3つの属性を足すだけで、性質の違う3つの攻撃それぞれに1段ずつ防御が積まれる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="130" y="46" font-size="10" text-anchor="middle" class="muted">脅威</text>
        <text x="400" y="46" font-size="10" text-anchor="middle" class="accent">付ける属性</text>
        <text x="630" y="46" font-size="10" text-anchor="middle" class="muted">起きなくなること</text>

        <rect x="20" y="62" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="122" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="20" y="182" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="130" y="82" font-size="10" text-anchor="middle">注入されたスクリプト</text>
        <text x="130" y="99" font-size="9" text-anchor="middle" class="mono muted">document.cookie</text>
        <text x="130" y="142" font-size="10" text-anchor="middle">経路上での盗み見</text>
        <text x="130" y="159" font-size="9" text-anchor="middle" class="muted">暗号化されていない通信</text>
        <text x="130" y="202" font-size="10" text-anchor="middle">他サイト起点の自動送信</text>
        <text x="130" y="219" font-size="9" text-anchor="middle" class="muted">CSRF</text>

        <rect x="310" y="62" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="310" y="122" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="310" y="182" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="400" y="91" font-size="11" text-anchor="middle" class="mono accent">HttpOnly</text>
        <text x="400" y="151" font-size="11" text-anchor="middle" class="mono accent">Secure</text>
        <text x="400" y="211" font-size="11" text-anchor="middle" class="mono accent">SameSite</text>

        <line x1="244" y1="85" x2="306" y2="85" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="244" y1="145" x2="306" y2="145" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="244" y1="205" x2="306" y2="205" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="494" y1="85" x2="536" y2="85" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="494" y1="145" x2="536" y2="145" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="494" y1="205" x2="536" y2="205" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />

        <text x="544" y="82" font-size="9.5" class="muted">JavaScriptから読めない</text>
        <text x="544" y="99" font-size="9" class="muted">盗む手段が1つ消える</text>
        <text x="544" y="142" font-size="9.5" class="muted">HTTPSのときしか送らない</text>
        <text x="544" y="159" font-size="9" class="muted">平文の経路には出ない</text>
        <text x="544" y="202" font-size="9.5" class="muted">他サイト起点では付かない</text>
        <text x="544" y="219" font-size="9" class="muted">勝手に本人扱いされない</text>

        <line x1="16" y1="252" x2="744" y2="252" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="274" font-size="10.5" class="muted">同じ1枚のCookieに対する3つの指定が、性質のまったく違う3つの攻撃にそれぞれ効く。</text>
        <text x="16" y="296" font-size="10.5" class="accent">コードを1行も直さずに3層ぶん積める ― 費用対効果でいえば、セキュリティ対策の中でも上位。</text>
      </svg>
    </div>
  </body>
</html>
