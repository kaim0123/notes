<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 330"
        role="img"
        aria-label="設計の話題を粒度順に並べた図。左に大きい方から小さい方へ向かう矢印があり、上から順にアーキテクチャ(システム全体・アプリ内部の組み方)、設計パターン(クラス・オブジェクト数個の定石)、パラダイム(1つの関数・モジュールの書き方)、コーディング規約(1つの名前・1行の書き方)の4段が並ぶ。右側には4段すべてにまたがる縦長の箱として設計原則が置かれ、どの粒度でも共通して効く判断基準であることを示す。"
      >
        <defs>
          <marker
            id="arrowScale"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="26" y="26" font-size="11" class="muted">粒度</text>
        <line x1="26" y1="40" x2="26" y2="300" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowScale)" />
        <text x="42" y="46" font-size="11" class="muted">大</text>
        <text x="42" y="300" font-size="11" class="muted">小</text>

        <rect x="62" y="34" width="360" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="82" y="58" font-size="13" font-weight="600">アーキテクチャ</text>
        <text x="82" y="78" font-size="11.5" class="muted">システム全体・1つのアプリ内部をどの単位に分けるか</text>

        <rect x="62" y="102" width="360" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="82" y="126" font-size="13" font-weight="600">設計パターン</text>
        <text x="82" y="146" font-size="11.5" class="muted">クラス・オブジェクト数個の粒度で繰り返し現れる定石</text>

        <rect x="62" y="170" width="360" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="82" y="194" font-size="13" font-weight="600">パラダイム</text>
        <text x="82" y="214" font-size="11.5" class="muted">1つの関数・モジュールをどういう考え方で書くか</text>

        <rect x="62" y="238" width="360" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="82" y="262" font-size="13" font-weight="600">コーディング規約</text>
        <text x="82" y="282" font-size="11.5" class="muted">1つの名前・1行をどう書くか(表記の統一)</text>

        <rect x="442" y="34" width="170" height="262" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="527" y="150" text-anchor="middle" font-size="13" font-weight="600">設計原則</text>
        <text x="527" y="176" text-anchor="middle" font-size="11.5" class="muted">どの粒度でも共通して</text>
        <text x="527" y="194" text-anchor="middle" font-size="11.5" class="muted">効いてくる判断基準</text>
        <text x="527" y="220" text-anchor="middle" font-size="11.5" class="muted">(SRP・DRY・KISS…)</text>

        <text x="320" y="320" text-anchor="middle" font-size="11" class="muted">
          同じ「分けて疎に保つ」発想が、粒度を変えて何度も現れる
        </text>
      </svg>
    </div>
  </body>
</html>
