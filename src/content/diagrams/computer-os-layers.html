<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 780 340"
        role="img"
        aria-label="コンピュータの4層構造。下からハードウェア(CPU・メモリ・ディスク)、カーネル(プロセス・メモリ・ファイルシステム・デバイスの管理)、システムプログラム(シェル・ファイルマネージャ)、アプリケーション(ブラウザ・エディタ)の順に積み上がる。システムプログラムからカーネルへの下向き矢印はシステムコール、カーネルからハードウェアへの下向き矢印はデバイス制御。右側の縦線は、アプリケーションとシステムプログラムがユーザーモードで動き、カーネルだけが特権を持つカーネルモードで動くことを示す。"
      >
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="120" y="15" width="400" height="58" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="40" text-anchor="middle" font-size="14" font-weight="600">アプリケーション</text>
        <text x="320" y="60" text-anchor="middle" font-size="11" class="muted">ブラウザ・エディタ・ゲーム</text>

        <rect x="120" y="92" width="400" height="58" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="117" text-anchor="middle" font-size="14" font-weight="600">システムプログラム</text>
        <text x="320" y="137" text-anchor="middle" font-size="11" class="muted">シェル・ファイルマネージャ・設定</text>

        <rect x="120" y="176" width="400" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="201" text-anchor="middle" font-size="14" font-weight="600">カーネル</text>
        <text x="320" y="221" text-anchor="middle" font-size="11" class="muted">プロセス・メモリ・FS・デバイスの管理</text>

        <rect x="120" y="253" width="400" height="58" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="278" text-anchor="middle" font-size="14" font-weight="600">ハードウェア</text>
        <text x="320" y="298" text-anchor="middle" font-size="11" class="muted">CPU・メモリ・ディスク・周辺機器</text>

        <line x1="320" y1="152" x2="320" y2="174" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrow)" color="var(--primary)" />
        <text x="108" y="169" text-anchor="end" font-size="12" class="muted">システムコール</text>
        <line x1="320" y1="236" x2="320" y2="251" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="108" y="248" text-anchor="end" font-size="12" class="muted">デバイス制御</text>

        <path d="M552,15 L545,15 L545,150 L552,150" fill="none" stroke="var(--border)" stroke-width="1.2" />
        <text x="562" y="86" font-size="12" class="muted">ユーザーモード</text>
        <path d="M552,176 L545,176 L545,234 L552,234" fill="none" stroke="var(--primary)" stroke-width="1.2" />
        <text x="562" y="209" font-size="12" class="muted">カーネルモード(特権)</text>

        <text x="390" y="332" text-anchor="middle" font-size="11.5" class="muted">上の層は必ず下の層の機能を経由する ― ハードウェアを直接触れるのはカーネルだけ</text>
      </svg>
    </div>
  </body>
</html>
