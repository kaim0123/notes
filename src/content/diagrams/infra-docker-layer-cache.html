<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="Dockerfileの命令の順序が、ビルドの速さをどう変えるかを示した比較図。左は先にアプリのコードをコピーしてから依存をインストールする書き方で、コードを1行直すだけでコピー以降の層がすべて無効になり、依存のインストールを毎回やり直すことになる。右は依存の定義ファイルだけを先にコピーしてインストールし、そのあとでコードをコピーする書き方で、コードだけを直したときは依存の層をキャッシュから再利用でき、作り直すのは最後の層だけで済む。変更頻度の低いものを下に、高いものを上に置くのが原則になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="26" font-size="12" class="muted">コードを1行だけ直して、もう一度ビルドしたとき</text>

        <text x="190" y="52" font-size="11.5" text-anchor="middle">順序が悪い書き方</text>
        <rect x="40" y="66" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="52" y="88" font-size="10" class="mono muted">FROM node:20</text>
        <text x="330" y="88" font-size="9.5" text-anchor="end" class="muted">再利用</text>
        <rect x="40" y="106" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="52" y="128" font-size="10" class="mono">COPY . .</text>
        <text x="330" y="128" font-size="9.5" text-anchor="end" class="accent">ここが変わった</text>
        <rect x="40" y="146" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="52" y="168" font-size="10" class="mono">RUN npm install</text>
        <text x="330" y="168" font-size="9.5" text-anchor="end" class="accent">やり直し</text>
        <rect x="40" y="186" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="52" y="208" font-size="10" class="mono">RUN npm run build</text>
        <text x="330" y="208" font-size="9.5" text-anchor="end" class="accent">やり直し</text>
        <text x="190" y="246" font-size="10.5" text-anchor="middle" class="accent">1行の変更で、依存の取得からやり直す</text>

        <line x1="380" y1="40" x2="380" y2="300" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="570" y="52" font-size="11.5" text-anchor="middle">順序を整えた書き方</text>
        <rect x="420" y="66" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="432" y="88" font-size="10" class="mono muted">FROM node:20</text>
        <text x="710" y="88" font-size="9.5" text-anchor="end" class="muted">再利用</text>
        <rect x="420" y="106" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="432" y="128" font-size="10" class="mono muted">COPY package*.json ./</text>
        <text x="710" y="128" font-size="9.5" text-anchor="end" class="muted">再利用</text>
        <rect x="420" y="146" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="432" y="168" font-size="10" class="mono muted">RUN npm ci</text>
        <text x="710" y="168" font-size="9.5" text-anchor="end" class="muted">再利用</text>
        <rect x="420" y="186" width="300" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="432" y="208" font-size="10" class="mono">COPY . .</text>
        <text x="710" y="208" font-size="9.5" text-anchor="end" class="accent">ここだけ作り直す</text>
        <text x="570" y="246" font-size="10.5" text-anchor="middle" class="accent">依存の層はキャッシュから使い回せる</text>

        <text x="20" y="290" font-size="11" class="muted">原則 ― 変更頻度の低いものを先に、高いものを後に書く。ある層が変われば、それより上の層はすべて無効になる。</text>
        <text x="20" y="310" font-size="11" class="muted">同じ理由で、ビルド用の道具を最終イメージに残さないマルチステージビルドも効く。</text>
      </svg>
    </div>
  </body>
</html>
