<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="IDSとIPSの違いを、設置される位置で示した図。上のIDSは通信経路の脇に置かれ、ミラーされたコピーを見て検知と通知だけを行う。通信そのものは流れ続けるため、正常な通信を誤って攻撃と判定しても業務は止まらないが、実際の遮断は人の手を待つことになる。下のIPSは通信経路そのものに割り込んで設置され、攻撃と判定した通信をその場で遮断できる。守りとしては強い代わりに、誤検知がそのままサービス停止につながるため、検知の精度を調整する運用の負担が大きくなる。どちらを選ぶかは、見逃しと止めすぎのどちらを重く見るかで決まる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="40" font-size="10.5" class="muted">IDS ― 経路の脇で見る</text>
        <line x1="40" y1="80" x2="600" y2="80" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="40" y="72" font-size="9" class="muted">通信は流れ続ける</text>
        <line x1="320" y1="80" x2="320" y2="112" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 3" />
        <rect x="240" y="114" width="160" height="42" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="320" y="132" font-size="10" text-anchor="middle">IDS</text>
        <text x="320" y="149" font-size="8.5" text-anchor="middle" class="muted">コピーを見て通知するだけ</text>
        <text x="420" y="135" font-size="9.5" class="muted">誤検知しても業務は止まらない</text>
        <text x="420" y="152" font-size="9.5" class="muted">遮断は人の手を待つ</text>

        <line x1="16" y1="176" x2="684" y2="176" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

        <text x="16" y="202" font-size="10.5" class="accent">IPS ― 経路の上に割り込む</text>
        <line x1="40" y1="238" x2="256" y2="238" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <rect x="260" y="216" width="120" height="44" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="234" font-size="10" text-anchor="middle" class="accent">IPS</text>
        <text x="320" y="251" font-size="8.5" text-anchor="middle" class="muted">その場で遮断できる</text>
        <line x1="384" y1="238" x2="600" y2="238" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="612" y="228" font-size="9.5" class="muted">通す</text>
        <text x="684" y="252" font-size="9.5" text-anchor="end" class="accent">誤検知 = サービス停止</text>

        <line x1="16" y1="272" x2="684" y2="272" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="294" font-size="10.5" class="accent">選んでいるのは強さではなく、見逃しと止めすぎのどちらを重く見るか。だからIPSは精度の調整が仕事になる。</text>
      </svg>
    </div>
  </body>
</html>
