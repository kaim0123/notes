<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="Kubernetesクラスタの構成を示した図。上段のコントロールプレインには、すべての操作が経由するAPI Server、どのノードでPodを動かすか決めるScheduler、あるべき状態との差を埋め続けるController Manager、クラスタの全状態を保存するetcdが並ぶ。下段のワーカーノードには、指示を受けてコンテナを起こすkubelet、通信を振り分けるkube-proxy、実際にコンテナを動かすランタイムがあり、その上でPodが動いている。外からのアクセスはIngressで受け、変わり続けるPodのIPをServiceが固定の窓口として束ねる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="34" width="720" height="86" rx="10" fill="none" stroke="var(--primary)" />
        <text x="36" y="56" font-size="12">コントロールプレイン ― 判断する側</text>
        <rect x="36" y="66" width="160" height="42" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="116" y="84" font-size="10.5" text-anchor="middle">API Server</text>
        <text x="116" y="99" font-size="9" text-anchor="middle" class="muted">すべての操作の入口</text>
        <rect x="208" y="66" width="160" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="288" y="84" font-size="10.5" text-anchor="middle">Scheduler</text>
        <text x="288" y="99" font-size="9" text-anchor="middle" class="muted">どのノードに置くか</text>
        <rect x="380" y="66" width="180" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="470" y="84" font-size="10.5" text-anchor="middle">Controller Manager</text>
        <text x="470" y="99" font-size="9" text-anchor="middle" class="muted">差分を埋め続ける</text>
        <rect x="572" y="66" width="152" height="42" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="648" y="84" font-size="10.5" text-anchor="middle">etcd</text>
        <text x="648" y="99" font-size="9" text-anchor="middle" class="muted">全状態の保管庫</text>

        <line x1="200" y1="120" x2="200" y2="152" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <line x1="560" y1="120" x2="560" y2="152" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <text x="380" y="140" font-size="9.5" text-anchor="middle" class="muted">指示は必ずAPI Server経由</text>

        <rect x="20" y="156" width="350" height="106" rx="10" fill="none" stroke="var(--border)" />
        <text x="36" y="178" font-size="11.5" class="muted">ワーカーノード</text>
        <rect x="36" y="188" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="111" y="208" font-size="9.5" text-anchor="middle" class="muted">kubelet / kube-proxy</text>
        <rect x="36" y="224" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="111" y="244" font-size="9.5" text-anchor="middle" class="muted">containerd</text>
        <rect x="198" y="188" width="76" height="66" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="236" y="226" font-size="10.5" text-anchor="middle">Pod</text>
        <rect x="284" y="188" width="76" height="66" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="322" y="226" font-size="10.5" text-anchor="middle">Pod</text>

        <rect x="390" y="156" width="350" height="106" rx="10" fill="none" stroke="var(--border)" />
        <text x="406" y="178" font-size="11.5" class="muted">ワーカーノード</text>
        <rect x="406" y="188" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="481" y="208" font-size="9.5" text-anchor="middle" class="muted">kubelet / kube-proxy</text>
        <rect x="406" y="224" width="150" height="30" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="481" y="244" font-size="9.5" text-anchor="middle" class="muted">containerd</text>
        <rect x="568" y="188" width="76" height="66" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="606" y="226" font-size="10.5" text-anchor="middle">Pod</text>
        <rect x="654" y="188" width="76" height="66" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="692" y="226" font-size="10.5" text-anchor="middle">Pod</text>

        <text x="20" y="290" font-size="10.5" class="muted">Podは使い捨て ― 落ちれば作り直され、そのたびにIPが変わる。だから外向きの窓口をServiceが固定し、</text>
        <text x="20" y="310" font-size="10.5" class="muted">HTTPの入口とパスの振り分けはIngressが受け持つ。設定値はConfigMap、秘密はSecretに置く。</text>
      </svg>
    </div>
  </body>
</html>
