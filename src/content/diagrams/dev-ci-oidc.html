<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 290"
        role="img"
        aria-label="CIからクラウドへ認証する2つの方式を比べた図。上段は長期キーを保存する方式で、クラウドで発行したアクセスキーをCIの秘密情報として保存し、実行のたびにそれを使う。このキーは失効させるまで有効なため、漏れれば長期間悪用でき、定期的な入れ替えも手作業になる。下段は短命な資格情報を発行する方式で、CIの実行ごとに、どのリポジトリのどのブランチからの実行かを含む署名付きトークンが発行される。クラウド側はそのトークンを検証し、信頼条件に合致していれば数十分だけ有効な資格情報を返す。保存される長期キーが存在しないため、漏れる対象がそもそも無い。さらに信頼条件にブランチを含めれば、mainからの実行だけが本番にデプロイできるという制約も表現できる。"
      >
        <defs>
          <marker id="aroi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="muted">長期キーを保存する方式</text>

        <rect x="16" y="38" width="150" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="91" y="60" text-anchor="middle" font-size="11.5" class="muted">CIの秘密情報</text>
        <text x="91" y="78" text-anchor="middle" font-size="10.5" class="muted">アクセスキーを保存</text>

        <line x1="166" y1="64" x2="212" y2="64" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#aroi)" />
        <text x="189" y="56" text-anchor="middle" font-size="9.5" class="muted">そのまま使う</text>

        <rect x="218" y="38" width="150" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="293" y="70" text-anchor="middle" font-size="11.5" class="muted">クラウド</text>

        <rect x="394" y="38" width="230" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="410" y="60" font-size="10.5" class="muted">失効させるまで有効</text>
        <text x="410" y="78" font-size="10.5" class="muted">漏れれば長期間悪用できる</text>

        <line x1="16" y1="112" x2="624" y2="112" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="138" font-size="12" class="lbl">短命な資格情報を発行する方式</text>

        <rect x="16" y="150" width="150" height="66" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="91" y="174" text-anchor="middle" font-size="11.5">CIの実行</text>
        <text x="91" y="192" text-anchor="middle" font-size="10.5" class="muted">署名付きトークンを発行</text>
        <text x="91" y="208" text-anchor="middle" font-size="10" class="muted">どのリポジトリ・どのブランチか</text>

        <line x1="166" y1="176" x2="212" y2="176" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#aroi)" />
        <text x="189" y="168" text-anchor="middle" font-size="9.5" class="muted">検証を依頼</text>

        <rect x="218" y="150" width="150" height="66" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="293" y="174" text-anchor="middle" font-size="11.5">クラウド</text>
        <text x="293" y="192" text-anchor="middle" font-size="10.5" class="muted">信頼条件と照合する</text>
        <text x="293" y="208" text-anchor="middle" font-size="10" class="muted">合致すれば発行</text>

        <line x1="368" y1="190" x2="414" y2="190" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#aroi)" />

        <rect x="420" y="150" width="204" height="66" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="522" y="174" text-anchor="middle" font-size="11.5">数十分だけ有効な資格情報</text>
        <text x="522" y="196" text-anchor="middle" font-size="10.5" class="lbl">保存される長期キーが存在しない</text>

        <line x1="16" y1="240" x2="624" y2="240" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="262" font-size="11" class="lbl">漏れる対象がそもそも無い ― 入れ替えの手作業も不要になる</text>
        <text x="16" y="282" font-size="11" class="muted">信頼条件にブランチを含めれば、「mainからの実行だけが本番にデプロイできる」も表現できる</text>
      </svg>
    </div>
  </body>
</html>
