<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 780 500"
        role="img"
        aria-label="スイッチのMACアドレス学習の図解。1回目はPC-AからPC-Cへのフレームの送信元MACアドレスをスイッチがポート1に記録し、宛先PC-Cはまだ表に無いため全ポートへフラッディングする。PC-Cが応答すると送信元MACアドレスをポート3に記録し、以降はPC-AとPC-Cの間のフレームをアドレス表を見て該当ポートだけに転送する。"
      >
        <defs>
          <marker
            id="arrowF"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ 1回目: 学習前 ============ -->
        <text x="390" y="22" text-anchor="middle" font-size="13" font-weight="700">① 学習前 ― 宛先が表に無いのでフラッディング</text>

        <rect x="20" y="50" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="65" y="75" text-anchor="middle" font-size="12">PC A</text>

        <rect x="330" y="50" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="390" y="75" text-anchor="middle" font-size="12" font-weight="600">スイッチ</text>

        <rect x="660" y="25" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="705" y="50" text-anchor="middle" font-size="12">PC B</text>

        <rect x="660" y="95" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="705" y="120" text-anchor="middle" font-size="12">PC C</text>

        <line x1="110" y1="70" x2="330" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowF)" />
        <text x="220" y="60" text-anchor="middle" font-size="10.5" class="muted">送信元MAC=A 宛先MAC=C</text>

        <line x1="450" y1="70" x2="655" y2="45" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowF)" />
        <line x1="450" y1="70" x2="655" y2="115" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowF)" />
        <text x="560" y="150" text-anchor="middle" font-size="11" style="fill: var(--primary)">全ポートへフラッディング(宛先不明)</text>

        <rect x="270" y="170" width="240" height="55" fill="var(--card)" stroke="var(--border)" />
        <text x="390" y="188" text-anchor="middle" font-size="10.5" class="muted">MACアドレステーブル</text>
        <text x="390" y="205" text-anchor="middle" font-size="11" class="mono" style="fill: var(--primary)">A → ポート1(学習)</text>
        <text x="390" y="219" text-anchor="middle" font-size="11" class="mono muted">C → (まだ無い)</text>

        <line x1="0" y1="245" x2="780" y2="245" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 2回目: 学習後 ============ -->
        <text x="390" y="270" text-anchor="middle" font-size="13" font-weight="700">② 学習後 ― 表を見て該当ポートだけに転送</text>

        <rect x="20" y="298" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="65" y="323" text-anchor="middle" font-size="12">PC A</text>

        <rect x="330" y="298" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="390" y="323" text-anchor="middle" font-size="12" font-weight="600">スイッチ</text>

        <rect x="660" y="273" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="705" y="298" text-anchor="middle" font-size="12">PC B</text>

        <rect x="660" y="343" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="705" y="368" text-anchor="middle" font-size="12">PC C</text>

        <line x1="110" y1="318" x2="330" y2="318" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowF)" />
        <line x1="450" y1="318" x2="655" y2="363" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowF)" />
        <text x="560" y="400" text-anchor="middle" font-size="11" style="fill: var(--primary)">ポート3だけに転送(ポート2には送らない)</text>

        <rect x="270" y="420" width="240" height="55" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="390" y="438" text-anchor="middle" font-size="10.5" class="muted">MACアドレステーブル</text>
        <text x="390" y="455" text-anchor="middle" font-size="11" class="mono" style="fill: var(--primary)">A → ポート1</text>
        <text x="390" y="469" text-anchor="middle" font-size="11" class="mono" style="fill: var(--primary)">C → ポート3(学習済み)</text>
      </svg>
    </div>
  </body>
</html>
