<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .item {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 340"
        role="img"
        aria-label="GoFデザインパターン23個を3つの分類に整理した一覧図。生成(5個)はオブジェクトの作り方を柔軟にするもので、Singleton・Factory Method・Abstract Factory・Builder・Prototype。構造(7個)はクラスやオブジェクトの組み合わせ方を整理するもので、Adapter・Bridge・Composite・Decorator・Facade・Flyweight・Proxy。振る舞い(11個)は責務の分担と通信を整理するもので、Chain of Responsibility・Command・Interpreter・Iterator・Mediator・Memento・Observer・State・Strategy・Template Method・Visitor。"
      >
        <text x="120" y="26" text-anchor="middle" font-size="12.5" font-weight="600">生成(5個)</text>
        <text x="120" y="46" text-anchor="middle" font-size="10.5" class="muted">オブジェクトの作り方</text>
        <rect x="20" y="58" width="200" height="244" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text class="item" x="40" y="84">Singleton</text>
        <text class="item" x="40" y="104">Factory Method</text>
        <text class="item" x="40" y="124">Abstract Factory</text>
        <text class="item" x="40" y="144">Builder</text>
        <text class="item" x="40" y="164">Prototype</text>

        <text x="350" y="26" text-anchor="middle" font-size="12.5" font-weight="600">構造(7個)</text>
        <text x="350" y="46" text-anchor="middle" font-size="10.5" class="muted">組み合わせ方の整理</text>
        <rect x="250" y="58" width="200" height="244" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text class="item" x="270" y="84">Adapter</text>
        <text class="item" x="270" y="104">Bridge</text>
        <text class="item" x="270" y="124">Composite</text>
        <text class="item" x="270" y="144">Decorator</text>
        <text class="item" x="270" y="164">Facade</text>
        <text class="item" x="270" y="184">Flyweight</text>
        <text class="item" x="270" y="204">Proxy</text>

        <text x="580" y="26" text-anchor="middle" font-size="12.5" font-weight="600">振る舞い(11個)</text>
        <text x="580" y="46" text-anchor="middle" font-size="10.5" class="muted">責務の分担と通信</text>
        <rect x="480" y="58" width="200" height="244" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text class="item" x="500" y="84">Chain of Responsibility</text>
        <text class="item" x="500" y="104">Command</text>
        <text class="item" x="500" y="124">Interpreter</text>
        <text class="item" x="500" y="144">Iterator</text>
        <text class="item" x="500" y="164">Mediator</text>
        <text class="item" x="500" y="184">Memento</text>
        <text class="item" x="500" y="204">Observer</text>
        <text class="item" x="500" y="224">State</text>
        <text class="item" x="500" y="244">Strategy</text>
        <text class="item" x="500" y="264">Template Method</text>
        <text class="item" x="500" y="284">Visitor</text>

        <text x="350" y="328" text-anchor="middle" font-size="11" class="muted">
          23個の内訳。数が最も多いのは「振る舞い」で、実務で名前を使う機会も多い
        </text>
      </svg>
    </div>
  </body>
</html>
