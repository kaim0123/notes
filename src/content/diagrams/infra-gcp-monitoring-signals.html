<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="運用のために集める4種類の情報を並べた図。1つ目は数値で、時間に沿った変化を追い、しきい値で警報を出すために使う。2つ目は記録で、1件ごとの出来事の詳細を残す。3つ目は処理の内訳で、サービスをまたいだ1つの要求がどの区間で時間を使ったかを示す。4つ目は実行時の内訳で、動いているプログラムのどの関数がCPUやメモリを使っているかを継続的に採取する。前の3つは何が起きたかを外から見るためのもので、4つ目は中で何が重いかを見るためのものであり、遅さの原因が自分のコードにあるときに効いてくる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="170" height="130" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="105" y="76" font-size="11" text-anchor="middle">数値</text>
        <text x="105" y="102" font-size="9" text-anchor="middle" class="muted">時間に沿った変化</text>
        <text x="105" y="122" font-size="9" text-anchor="middle" class="muted">しきい値で警報</text>
        <text x="105" y="156" font-size="9.5" text-anchor="middle" class="accent">全体として異常か</text>

        <rect x="206" y="50" width="170" height="130" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="291" y="76" font-size="11" text-anchor="middle">記録</text>
        <text x="291" y="102" font-size="9" text-anchor="middle" class="muted">1件ごとの詳細</text>
        <text x="291" y="122" font-size="9" text-anchor="middle" class="muted">検索して調べる</text>
        <text x="291" y="156" font-size="9.5" text-anchor="middle" class="accent">その1件で何が</text>

        <rect x="392" y="50" width="170" height="130" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="477" y="76" font-size="11" text-anchor="middle">処理の内訳</text>
        <text x="477" y="102" font-size="9" text-anchor="middle" class="muted">サービスをまたぐ</text>
        <text x="477" y="122" font-size="9" text-anchor="middle" class="muted">区間ごとの時間</text>
        <text x="477" y="156" font-size="9.5" text-anchor="middle" class="accent">どこで待っているか</text>

        <rect x="578" y="50" width="162" height="130" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="659" y="76" font-size="11" text-anchor="middle">実行時の内訳</text>
        <text x="659" y="102" font-size="9" text-anchor="middle" class="muted">どの関数が重いか</text>
        <text x="659" y="122" font-size="9" text-anchor="middle" class="muted">本番で継続採取</text>
        <text x="659" y="156" font-size="9.5" text-anchor="middle" class="accent">中で何が重いか</text>

        <text x="20" y="216" font-size="10.5" class="muted">左の3つは「外から何が起きているか」を見るもの。いちばん右だけが「中で何が重いか」を見る。</text>
        <text x="20" y="238" font-size="10.5" class="muted">外を全部見ても原因が分からないとき ― 遅さが自分のコードの中にあるときに、右が効く。</text>
        <text x="20" y="264" font-size="10" class="muted">4つとも共通のIDと時刻でつないでおくと、行き来しながら降りられる。</text>
      </svg>
    </div>
  </body>
</html>
