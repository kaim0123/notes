<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 340"
        role="img"
        aria-label="共有した状態と独立させた状態を上下に並べて比べた図。上段は共有した場合で、テストA、テストB、テストCの3つが1つの同じデータベースを指しており、前のテストが残したデータがそのまま次のテストに渡る。この形ではテストCだけを単独で実行すると、Aが作ったはずのデータが無いために落ちる。順序を入れ替えても結果が変わる。下段は独立させた場合で、テストA、テストB、テストCがそれぞれ自分専用のデータを持ち、自分が使うものを自分で作って自分で片付ける。この形なら実行の順序が変わっても、単独で走らせても、結果は変わらない。落ちたときに疑う先が自分の中だけに閉じる、と図の下部に記されている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="26" y="24" font-size="11" class="muted">共有した場合 ― 前のテストが残したものに、次のテストがぶら下がる</text>

        <rect x="26" y="36" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="116" y="60" font-size="10.5" text-anchor="middle" class="muted">テストA(データを作る)</text>
        <rect x="222" y="36" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="312" y="60" font-size="10.5" text-anchor="middle" class="muted">テストB(件数を数える)</text>
        <rect x="418" y="36" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="508" y="60" font-size="10.5" text-anchor="middle" class="muted">テストC(Aの結果を使う)</text>

        <line x1="116" y1="74" x2="200" y2="96" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="312" y1="74" x2="316" y2="96" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="508" y1="74" x2="428" y2="96" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="120" y="100" width="400" height="36" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="320" y="123" font-size="10.5" text-anchor="middle" class="muted">共有された1つのDB ― 前の残骸が、そのまま次へ渡る</text>

        <text x="26" y="160" font-size="10.5" class="accent">Cだけを単独で走らせると落ちる。順序を入れ替えても結果が変わる。これが順序依存。</text>

        <line x1="26" y1="178" x2="614" y2="178" stroke="var(--border)" stroke-width="1" />

        <text x="26" y="200" font-size="11" class="muted">独立させた場合 ― 自分が使うものは、自分で作って自分で片付ける</text>

        <rect x="26" y="212" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="116" y="236" font-size="10.5" text-anchor="middle">テストA</text>
        <rect x="222" y="212" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="312" y="236" font-size="10.5" text-anchor="middle">テストB</text>
        <rect x="418" y="212" width="180" height="38" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="508" y="236" font-size="10.5" text-anchor="middle">テストC</text>

        <line x1="116" y1="250" x2="116" y2="264" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="312" y1="250" x2="312" y2="264" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="508" y1="250" x2="508" y2="264" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <rect x="26" y="268" width="180" height="30" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="116" y="288" font-size="9.5" text-anchor="middle" class="muted">自分専用のデータ</text>
        <rect x="222" y="268" width="180" height="30" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="312" y="288" font-size="9.5" text-anchor="middle" class="muted">自分専用のデータ</text>
        <rect x="418" y="268" width="180" height="30" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="508" y="288" font-size="9.5" text-anchor="middle" class="muted">自分専用のデータ</text>

        <text x="26" y="326" font-size="10.5" class="muted">順序が変わっても、単独で走らせても、並列で走らせても結果は同じ。落ちたら疑う先は自分の中だけ。</text>
      </svg>
    </div>
  </body>
</html>
