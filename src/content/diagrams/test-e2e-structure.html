<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 340"
        role="img"
        aria-label="E2Eテストのコードを役割ごとに分けた構成を示した図。最上部にテスト本体があり、ここには何を確認するテストかだけを書く。画面の操作手順もデータの作り方も、ここには書かない。その下に2つの受け皿がある。左はページオブジェクトで、画面の構造の知識を持ち、セレクタと操作手順はここだけに置く。画面が作り直されたとき、直すのはここ1か所で済む。右はAPIヘルパーで、UIを介さない準備を担当し、前提となるデータをAPIで直接作る。ページオブジェクトはブラウザを操作し、APIヘルパーはAPIとデータベースへ直接向かう。右側にはフィクスチャがあり、ログイン済みの画面や注文が1件ある状態といった前提条件そのものをテスト本体へ渡す。この分離によって、テスト本体の冒頭が手順の羅列にならず、確認したいことだけが残る。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11" class="muted">混ぜるとすぐ肥大化する。役割で分けておくと、壊れたときに直す場所が1か所に決まる</text>

        <rect x="16" y="40" width="432" height="54" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="62" font-size="10.5" class="accent">テスト本体 ― 何を確認するテストか、だけ</text>
        <text x="30" y="82" font-size="9" class="muted">画面の操作手順も、データの作り方も、ここには書かない</text>

        <rect x="460" y="40" width="164" height="112" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="474" y="62" font-size="10">フィクスチャ</text>
        <text x="474" y="84" font-size="9" class="muted">前提条件そのものを</text>
        <text x="474" y="100" font-size="9" class="muted">組み立てて渡す</text>
        <text x="474" y="122" font-size="9" class="muted">「ログイン済みの画面」</text>
        <text x="474" y="138" font-size="9" class="muted">「注文が1件ある状態」</text>

        <line x1="456" y1="66" x2="452" y2="66" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <line x1="120" y1="94" x2="120" y2="112" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="344" y1="94" x2="344" y2="112" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="16" y="116" width="208" height="66" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="138" font-size="10.5">ページオブジェクト</text>
        <text x="30" y="158" font-size="9" class="muted">画面の構造の知識。</text>
        <text x="30" y="174" font-size="9" class="muted">セレクタと操作手順はここだけ</text>

        <rect x="240" y="116" width="208" height="66" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="254" y="138" font-size="10.5">APIヘルパー</text>
        <text x="254" y="158" font-size="9" class="muted">UIを介さない準備。</text>
        <text x="254" y="174" font-size="9" class="muted">前提データを直接作る</text>

        <line x1="120" y1="182" x2="120" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="344" y1="182" x2="344" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="16" y="204" width="208" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="120" y="231" font-size="10" text-anchor="middle" class="muted">ブラウザを操作する</text>

        <rect x="240" y="204" width="208" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="344" y="231" font-size="10" text-anchor="middle" class="muted">API・DBへ直接向かう</text>

        <line x1="16" y1="272" x2="624" y2="272" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="292" font-size="10.5" class="muted">画面が作り直されても、直すのはページオブジェクトだけ。テスト本体は1行も変わらない。</text>
        <text x="16" y="314" font-size="10.5" class="muted">前提データをUIで作らないので、途中の画面の不具合にテストが引きずられない。</text>
        <text x="16" y="334" font-size="10.5" class="accent">結果として、テスト本体には確認したいことだけが残る ― 読めば仕様になる。</text>
      </svg>
    </div>
  </body>
</html>
