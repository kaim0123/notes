<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="Kubernetesの宣言的管理と調整ループを示した図。利用者はレプリカ数を3にするという、あるべき姿だけをYAMLで宣言する。Kubernetesは現在の状態を絶えず観測し、Podが1つ落ちて2つになれば宣言との差分を検知して、足りない1つを新しく起こす。逆に多ければ減らす。この観測・比較・修正のループが止まらずに回り続けるため、手順ではなく目標だけを与えれば状態が維持される。命令的な運用ではこの修正を人が担うが、宣言的な運用では機械が担う点が本質的な違いになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="40" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="120" y="64" font-size="11.5" text-anchor="middle">宣言(あるべき姿)</text>
        <text x="120" y="86" font-size="10" text-anchor="middle" class="mono">replicas: 3</text>
        <text x="120" y="104" font-size="9.5" text-anchor="middle" class="muted">YAMLに書いて渡すだけ</text>

        <rect x="480" y="40" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="580" y="64" font-size="11.5" text-anchor="middle">現在の状態</text>
        <text x="580" y="86" font-size="10" text-anchor="middle" class="mono">running: 2</text>
        <text x="580" y="104" font-size="9.5" text-anchor="middle" class="muted">1つ落ちた</text>

        <rect x="250" y="150" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="176" font-size="11.5" text-anchor="middle">差分を見て、埋める</text>
        <text x="350" y="196" font-size="10" text-anchor="middle" class="accent">3 − 2 = 1つ足りない</text>
        <text x="350" y="212" font-size="9.5" text-anchor="middle" class="muted">→ 新しいPodを起こす</text>

        <path d="M120,120 L120,185 L244,185" fill="none" stroke="var(--muted)" marker-end="url(#ar)" />
        <path d="M580,120 L580,185 L456,185" fill="none" stroke="var(--muted)" marker-end="url(#ar)" />
        <path d="M450,170 C560,150 620,140 640,124" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="560" y="152" font-size="9.5" class="accent">現実を寄せる</text>

        <text x="350" y="252" font-size="11" text-anchor="middle" class="muted">このループは止まらずに回り続ける ― だから落ちたPodは黙って起き直る</text>
        <text x="350" y="276" font-size="10.5" text-anchor="middle" class="muted">命令的な運用ではこの修正を人がやる。宣言的な運用では機械がやる。</text>
      </svg>
    </div>
  </body>
</html>
