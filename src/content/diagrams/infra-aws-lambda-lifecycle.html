<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="サーバーレス関数の実行環境が用意されてから再利用されるまでの流れを示した図。しばらく呼ばれていない関数を呼ぶと、実行環境の用意とコードの初期化が先に走り、そのぶん応答が遅くなる。これがコールドスタートで、初期化にかかる時間は接続の確立や設定の読み込みが重いほど長くなる。続けて呼び出されると同じ実行環境が再利用され、初期化を飛ばして本体だけが走るため速い。したがって初期化のところに重い処理を置くか関数の外に置くかで、2回目以降の速さが変わる。しばらく呼ばれないと環境は片付けられ、次はまた初期化から始まる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="28" font-size="12" class="muted">1回目 ― コールドスタート</text>
        <rect x="20" y="44" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="95" y="60" font-size="9.5" text-anchor="middle">実行環境の用意</text>
        <text x="95" y="76" font-size="9" text-anchor="middle" class="muted">数十〜数百ms</text>
        <rect x="176" y="44" width="180" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="266" y="60" font-size="9.5" text-anchor="middle">初期化(関数の外側)</text>
        <text x="266" y="76" font-size="9" text-anchor="middle" class="muted">接続の確立・設定の読み込み</text>
        <rect x="362" y="44" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="437" y="68" font-size="9.5" text-anchor="middle">処理の本体</text>
        <text x="530" y="68" font-size="10" class="accent">← ここまで待たされる</text>

        <text x="20" y="122" font-size="12" class="muted">2回目以降 ― 同じ環境が再利用される</text>
        <rect x="20" y="138" width="336" height="40" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="188" y="163" font-size="9.5" text-anchor="middle" class="muted">用意も初期化も飛ばす</text>
        <rect x="362" y="138" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="437" y="162" font-size="9.5" text-anchor="middle">処理の本体</text>
        <text x="530" y="162" font-size="10" class="accent">← すぐ応答が返る</text>

        <rect x="20" y="206" width="720" height="76" rx="8" fill="none" stroke="var(--border)" />
        <text x="36" y="230" font-size="10.5" class="muted">だから、重い準備は「関数の外側」に置く ― 2回目以降はそれを丸ごと飛ばせる。</text>
        <text x="36" y="252" font-size="10.5" class="muted">逆に、外側に置いた接続は環境が生きている間ずっと残るので、その前提で作る必要がある。</text>
        <text x="36" y="274" font-size="10.5" class="accent">しばらく呼ばれないと環境は片付けられ、次はまた初期化から始まる。</text>
      </svg>
    </div>
  </body>
</html>
