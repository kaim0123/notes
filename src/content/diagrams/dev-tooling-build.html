<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="ビルドが何をしているかを示した図。左には開発者が書いたソースが並ぶ。TypeScriptやJSXのファイルが多数あり、それぞれが読みやすい名前と改行を持ち、互いにimportで結ばれている。この状態はブラウザがそのまま実行できない。ビルドは3つの処理を順に行う。1つ目のトランスパイルは、ブラウザが理解できない構文を通常のJavaScriptに変換し、型注釈を取り除く。2つ目のバンドルは、importで結ばれた多数のファイルをたどって少数のファイルにまとめる。3つ目の最小化は、変数名を短くし空白と改行を削ってファイルサイズを小さくする。結果として右側には、人間には読めないが軽くて実行しやすい少数のファイルが残る。開発サーバーではこの全体を毎回やり直さず、ブラウザが必要としたファイルだけをその場で変換して返すことで、起動と更新を速くしている。"
      >
        <defs>
          <marker id="arbt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11.5" class="muted">開発者が書くもの</text>
        <rect x="16" y="38" width="118" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="75" y="62" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">App.tsx</text>
        <text x="75" y="82" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">Button.tsx</text>
        <text x="75" y="102" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">utils.ts</text>
        <text x="75" y="122" text-anchor="middle" font-size="10.5" font-family="monospace" class="muted">…数百ファイル</text>
        <text x="75" y="146" text-anchor="middle" font-size="10" class="lbl">import で結ばれている</text>

        <line x1="134" y1="98" x2="158" y2="98" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arbt)" />

        <rect x="164" y="38" width="146" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="237" y="64" text-anchor="middle" font-size="11.5">① トランスパイル</text>
        <text x="237" y="86" text-anchor="middle" font-size="10.5" class="muted">TS・JSX を</text>
        <text x="237" y="102" text-anchor="middle" font-size="10.5" class="muted">通常のJSに変換</text>
        <text x="237" y="126" text-anchor="middle" font-size="10.5" class="muted">型注釈は消える</text>

        <line x1="310" y1="98" x2="334" y2="98" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arbt)" />

        <rect x="340" y="38" width="146" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="413" y="64" text-anchor="middle" font-size="11.5">② バンドル</text>
        <text x="413" y="86" text-anchor="middle" font-size="10.5" class="muted">import をたどって</text>
        <text x="413" y="102" text-anchor="middle" font-size="10.5" class="muted">少数のファイルに</text>
        <text x="413" y="126" text-anchor="middle" font-size="10.5" class="muted">まとめる</text>

        <line x1="486" y1="98" x2="510" y2="98" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arbt)" />

        <rect x="516" y="38" width="108" height="120" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="570" y="64" text-anchor="middle" font-size="11.5">③ 最小化</text>
        <text x="570" y="86" text-anchor="middle" font-size="10.5" class="muted">名前を短く</text>
        <text x="570" y="102" text-anchor="middle" font-size="10.5" class="muted">空白を削る</text>
        <text x="570" y="128" text-anchor="middle" font-size="10" class="lbl">軽い配布物</text>

        <line x1="16" y1="184" x2="624" y2="184" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="208" font-size="12" class="lbl">開発サーバーは、この全体を毎回やり直さない</text>

        <rect x="16" y="220" width="288" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="242" text-anchor="middle" font-size="11" class="muted">従来 ― 起動前に全ファイルをバンドル</text>
        <text x="160" y="262" text-anchor="middle" font-size="11" class="muted">規模が大きいほど起動と更新が遅い</text>

        <rect x="336" y="220" width="288" height="54" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="480" y="242" text-anchor="middle" font-size="11">今 ― ブラウザが要求したファイルだけ変換</text>
        <text x="480" y="262" text-anchor="middle" font-size="11" class="lbl">規模が増えても起動はほぼ一瞬</text>

        <text x="16" y="294" font-size="11" class="muted">本番向けの出力だけは、読み込み効率のためにきちんとバンドル・最小化する</text>
      </svg>
    </div>
  </body>
</html>
