<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 585"
        role="img"
        aria-label="ハブとスイッチの衝突ドメインを比較した図解。ハブは全ポートが1つの衝突ドメインを共有するため、2台が同時に送信すると衝突が起きる。スイッチはポートごとに独立した衝突ドメインを持つため、同時に送受信しても衝突しない。"
      >
        <!-- ============ ハブ ============ -->
        <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="700">ハブ ― 1つの衝突ドメインを共有</text>

        <ellipse cx="360" cy="130" rx="330" ry="115" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />

        <rect x="60" y="40" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="67" text-anchor="middle" font-size="12.5">PC A</text>
        <rect x="560" y="40" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="610" y="67" text-anchor="middle" font-size="12.5">PC B</text>
        <rect x="310" y="205" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="360" y="232" text-anchor="middle" font-size="12.5">PC C</text>

        <rect x="310" y="105" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="360" y="133" text-anchor="middle" font-size="13" font-weight="600">ハブ</text>

        <line x1="160" y1="70" x2="315" y2="118" stroke="var(--fg)" stroke-width="1.5" />
        <line x1="560" y1="70" x2="405" y2="118" stroke="var(--fg)" stroke-width="1.5" />
        <line x1="360" y1="151" x2="360" y2="205" stroke="var(--fg)" stroke-width="1.5" />

        <text x="360" y="270" text-anchor="middle" font-size="12" class="muted">
          衝突ドメイン(1つ) ― 誰かが送信中は他は待つ(半二重)
        </text>
        <text x="360" y="288" text-anchor="middle" font-size="12" style="fill: var(--primary)">
          同時に送信すると衝突(コリジョン)が起きる
        </text>

        <line x1="0" y1="315" x2="720" y2="315" stroke="var(--border)" stroke-width="1" />

        <!-- ============ スイッチ ============ -->
        <text x="360" y="345" text-anchor="middle" font-size="14" font-weight="700">スイッチ ― ポートごとに独立した衝突ドメイン</text>

        <rect x="60" y="365" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="392" text-anchor="middle" font-size="12.5">PC A</text>
        <rect x="560" y="365" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="610" y="392" text-anchor="middle" font-size="12.5">PC B</text>
        <rect x="310" y="500" width="100" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="360" y="527" text-anchor="middle" font-size="12.5">PC C</text>

        <rect x="310" y="430" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="360" y="458" text-anchor="middle" font-size="13" font-weight="600">スイッチ</text>

        <rect x="200" y="382" width="90" height="26" rx="13" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" transform="rotate(21 245 395)" />
        <line x1="160" y1="395" x2="315" y2="443" stroke="var(--fg)" stroke-width="1.5" />

        <rect x="430" y="382" width="90" height="26" rx="13" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" transform="rotate(-21 475 395)" />
        <line x1="560" y1="395" x2="405" y2="443" stroke="var(--fg)" stroke-width="1.5" />

        <rect x="337" y="470" width="46" height="26" rx="13" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" />
        <line x1="360" y1="476" x2="360" y2="500" stroke="var(--fg)" stroke-width="1.5" />

        <text x="360" y="570" text-anchor="middle" font-size="12" style="fill: var(--primary)">
          破線の枠(衝突ドメイン)がリンクごとに独立 ― 同時に送受信しても衝突しない
        </text>
      </svg>
    </div>
  </body>
</html>
