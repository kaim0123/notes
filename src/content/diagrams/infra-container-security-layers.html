<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="コンテナを守る3つの層と、それぞれが受け持つリスクを示した図。1層目はイメージで、公式で最小限の土台を選び、既知の脆弱性を機械的に検査し、署名を検証することで、脆弱なイメージや供給経路への混入を防ぐ。2層目は実行時で、一般ユーザーで動かし、権限を削り、ファイルシステムを読み取り専用にし、通信相手を絞ることで、設定ミスと横方向への拡散を防ぐ。3層目は監視で、普段しない振る舞いを検知し、監査ログを残すことで、突破されたあとに気づける状態を作る。どの層も単独では破られるため、重ねて初めて意味を持つ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="40" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="66" font-size="12" text-anchor="middle">1. イメージ</text>
        <text x="135" y="84" font-size="9.5" text-anchor="middle" class="muted">入れる前に選ぶ・調べる</text>
        <rect x="36" y="96" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="135" y="114" font-size="10" text-anchor="middle" class="muted">公式・最小限の土台を選ぶ</text>
        <rect x="36" y="128" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="135" y="146" font-size="10" text-anchor="middle" class="muted">既知の脆弱性を機械的に検査</text>
        <rect x="36" y="160" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="135" y="178" font-size="10" text-anchor="middle" class="muted">署名を検証して出所を確かめる</text>
        <text x="135" y="206" font-size="9.5" text-anchor="middle" class="accent">脆弱性・供給経路への混入</text>

        <rect x="265" y="40" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="66" font-size="12" text-anchor="middle">2. 実行時</text>
        <text x="380" y="84" font-size="9.5" text-anchor="middle" class="muted">動かすときに締める</text>
        <rect x="281" y="96" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="380" y="114" font-size="10" text-anchor="middle" class="muted">rootで動かさない</text>
        <rect x="281" y="128" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="380" y="146" font-size="10" text-anchor="middle" class="muted">権限を削る・読み取り専用にする</text>
        <rect x="281" y="160" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="380" y="178" font-size="10" text-anchor="middle" class="muted">通信できる相手を絞る</text>
        <text x="380" y="206" font-size="9.5" text-anchor="middle" class="accent">設定ミス・横方向への拡散</text>

        <rect x="510" y="40" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="625" y="66" font-size="12" text-anchor="middle">3. 監視</text>
        <text x="625" y="84" font-size="9.5" text-anchor="middle" class="muted">突破された後に気づく</text>
        <rect x="526" y="96" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="625" y="114" font-size="10" text-anchor="middle" class="muted">普段しない振る舞いを検知</text>
        <rect x="526" y="128" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="625" y="146" font-size="10" text-anchor="middle" class="muted">監査ログを外へ逃がして残す</text>
        <rect x="526" y="160" width="198" height="26" rx="6" fill="none" stroke="var(--border)" />
        <text x="625" y="178" font-size="10" text-anchor="middle" class="muted">隔離できる手順を用意する</text>
        <text x="625" y="206" font-size="9.5" text-anchor="middle" class="accent">侵入後の居座り・持ち出し</text>

        <text x="380" y="256" font-size="11" text-anchor="middle" class="muted">どの層も単独では破られる。「入れる前」「動かすとき」「破られた後」を重ねて初めて意味を持つ。</text>
        <text x="380" y="280" font-size="10.5" text-anchor="middle" class="muted">早い層ほど直す費用が安い ― 見つけるなら手前で見つける。</text>
      </svg>
    </div>
  </body>
</html>
