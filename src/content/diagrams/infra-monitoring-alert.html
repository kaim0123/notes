<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="アラートのしきい値を動かしたときの、見逃しと誤検知のトレードオフを示した図。横軸はエラー率で、左の山は正常なときのばらつき、右の山は異常が起きているときの分布を表す。2つの山は重なっているため、しきい値を右へ動かすと誤検知は減るが異常を見逃しやすくなり、左へ動かすと見逃しは減るが正常な揺れでも鳴るようになり、やがて誰も見なくなるアラート疲れを招く。重なりそのものを減らす、つまり異常だけがよく動く指標を選ぶことが、しきい値の調整より効く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <path d="M60,200 C120,200 120,80 180,80 C240,80 240,200 300,200" fill="none" stroke="var(--border)" stroke-width="1.5" />
        <text x="180" y="68" font-size="11" text-anchor="middle" class="muted">正常なときのばらつき</text>
        <path d="M280,200 C340,200 340,100 400,100 C460,100 460,200 520,200" fill="none" stroke="var(--primary)" stroke-width="1.5" />
        <text x="400" y="88" font-size="11" text-anchor="middle" class="accent">異常が起きているとき</text>

        <line x1="40" y1="200" x2="600" y2="200" stroke="var(--border)" />
        <text x="600" y="220" font-size="10" text-anchor="end" class="muted">エラー率 →</text>

        <line x1="300" y1="60" x2="300" y2="212" stroke="var(--fg)" stroke-dasharray="5 4" />
        <text x="300" y="52" font-size="11" text-anchor="middle">しきい値</text>

        <line x1="300" y1="232" x2="180" y2="232" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="176" y="236" font-size="10.5" text-anchor="end" class="muted">下げる</text>
        <line x1="300" y1="232" x2="420" y2="232" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="424" y="236" font-size="10.5" class="muted">上げる</text>

        <rect x="20" y="250" width="300" height="40" rx="6" fill="none" stroke="var(--border)" />
        <text x="32" y="266" font-size="10.5">見逃しは減るが、正常な揺れでも鳴る</text>
        <text x="32" y="282" font-size="10" class="muted">→ 鳴りっぱなしになり、やがて誰も見ない(アラート疲れ)</text>

        <rect x="340" y="250" width="340" height="40" rx="6" fill="none" stroke="var(--border)" />
        <text x="352" y="266" font-size="10.5">誤検知は減るが、異常を見逃す</text>
        <text x="352" y="282" font-size="10" class="muted">→ 利用者からの報告が最初の検知になる</text>

        <text x="620" y="140" font-size="10" text-anchor="middle" class="muted">2つの山が</text>
        <text x="620" y="156" font-size="10" text-anchor="middle" class="muted">重なるほど</text>
        <text x="620" y="172" font-size="10" text-anchor="middle" class="muted">調整では</text>
        <text x="620" y="188" font-size="10" text-anchor="middle" class="muted">解けない</text>
      </svg>
    </div>
  </body>
</html>
