<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 660 300"
        role="img"
        aria-label="代表的な命名記法5種と、その用途の対応表。camelCase(例 userName、getTotal)はJavaScript/TypeScriptの変数・関数に、PascalCase(例 OrderService、User)はクラス・型・Reactコンポーネントに、snake_case(例 user_name)はPythonの変数やデータベースの列名に、kebab-case(例 user-profile.tsx)はファイル名やURLに、UPPER_SNAKE_CASE(例 MAX_RETRY_COUNT)は定数に使われる。どれが正しいかではなく、その言語・その場所での慣習に合わせることが要点である。"
      >
        <text x="40" y="30" font-size="11" class="muted">記法</text>
        <text x="250" y="30" font-size="11" class="muted">例</text>
        <text x="450" y="30" font-size="11" class="muted">主な用途</text>

        <rect x="20" y="42" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="40" y="66" font-size="11.5">camelCase</text>
        <text class="mono" x="250" y="66" font-size="11">userName / getTotal()</text>
        <text x="450" y="66" font-size="11" class="muted">JS・TSの変数・関数</text>

        <rect x="20" y="86" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="40" y="110" font-size="11.5">PascalCase</text>
        <text class="mono" x="250" y="110" font-size="11">OrderService / User</text>
        <text x="450" y="110" font-size="11" class="muted">クラス・型・コンポーネント</text>

        <rect x="20" y="130" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="40" y="154" font-size="11.5">snake_case</text>
        <text class="mono" x="250" y="154" font-size="11">user_name</text>
        <text x="450" y="154" font-size="11" class="muted">Pythonの変数・DBの列名</text>

        <rect x="20" y="174" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="40" y="198" font-size="11.5">kebab-case</text>
        <text class="mono" x="250" y="198" font-size="11">user-profile.tsx</text>
        <text x="450" y="198" font-size="11" class="muted">ファイル名・URL</text>

        <rect x="20" y="218" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="40" y="242" font-size="11.5">UPPER_SNAKE_CASE</text>
        <text class="mono" x="250" y="242" font-size="11">MAX_RETRY_COUNT</text>
        <text x="450" y="242" font-size="11" class="muted">定数</text>

        <text x="330" y="282" text-anchor="middle" font-size="11" class="muted">
          どれが正しいかではなく、その言語・その場所の慣習に合わせることが要点
        </text>
      </svg>
    </div>
  </body>
</html>
