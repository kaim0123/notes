<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="配色を役割で3層に分け、使う面積の比率とともに示した図。左側に画面の見立てがあり、いちばん広い面積を占めるのがベース色で背景や面を担う。その中に置かれる文字がテキスト色で、本文と補足の2段階を持つ。ごく狭い面積だけがアクセント色で、ボタンやリンクなど操作すべき場所に使われる。右側に各層の決め方が並び、ベースはほぼ無彩色で階層は明度差で作ること、テキストは背景とのコントラスト比を満たすこと、アクセントは1色に絞り面積を狭く保つことが書かれている。アクセントが画面の1割を超えると、もはや目立たなくなる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="34" width="290" height="230" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="34" y="56" font-size="10.5" class="muted">ベース ― 背景・面</text>

        <rect x="38" y="70" width="254" height="66" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="54" y="94" font-size="12">見出しのテキスト</text>
        <text x="54" y="116" font-size="10.5" class="muted">補足のテキストは1段落として</text>

        <rect x="38" y="148" width="254" height="66" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="54" y="172" font-size="12">見出しのテキスト</text>
        <text x="54" y="194" font-size="10.5" class="muted">面の階層は明度差だけで作る</text>

        <rect x="196" y="226" width="96" height="26" rx="5" fill="var(--primary)" stroke="none" />
        <text x="244" y="244" text-anchor="middle" font-size="11" fill="var(--primary-fg)">保存する</text>
        <text x="38" y="244" font-size="10" class="lbl">アクセントはここだけ</text>

        <rect x="330" y="34" width="294" height="70" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="346" y="58" font-size="11.5">ベース</text>
        <text x="346" y="80" font-size="10.5" class="muted">ほぼ無彩色。面の階層は明度差で作る。</text>
        <text x="346" y="96" font-size="10.5" class="muted">画面の面積の大半を占める</text>

        <rect x="330" y="114" width="294" height="70" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="346" y="138" font-size="11.5">テキスト</text>
        <text x="346" y="160" font-size="10.5" class="muted">背景とのコントラスト比を満たす。</text>
        <text x="346" y="176" font-size="10.5" class="muted">強弱は2〜3段階まで</text>

        <rect x="330" y="194" width="294" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="346" y="218" font-size="11.5" class="lbl">アクセント</text>
        <text x="346" y="240" font-size="10.5" class="muted">1色に絞る。面積を狭く保つ ―</text>
        <text x="346" y="256" font-size="10.5" class="muted">画面の1割を超えたら、もう目立たない</text>

        <text x="20" y="288" font-size="10.5" class="muted">ダークテーマは色の反転ではなく、3層を別のセットとして定義する</text>
      </svg>
    </div>
  </body>
</html>
