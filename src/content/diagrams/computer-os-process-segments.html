<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="プロセスのメモリ空間を5つのセグメントに分けた図。低位側からテキスト(命令・読み取り専用)、データ(初期値ありの変数)、BSS(初期値なしの変数)、ヒープ、スタックの順に並び、ヒープは上へ、スタックは下へと互いに向かって成長する。" viewBox="0 0 380 300">
      <rect x="90" y="20" width="200" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="190" y="44" fill="var(--fg)" font-size="13" text-anchor="middle">テキスト(命令・読み取り専用)</text>
      <rect x="90" y="62" width="200" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="190" y="86" fill="var(--fg)" font-size="13" text-anchor="middle">データ(初期値ありの変数)</text>
      <rect x="90" y="104" width="200" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="190" y="128" fill="var(--fg)" font-size="13" text-anchor="middle">BSS(初期値なしの変数)</text>
      <rect x="90" y="146" width="200" height="50" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="190" y="168" fill="var(--fg)" font-size="13" text-anchor="middle">ヒープ</text>
      <text x="190" y="186" fill="var(--muted)" font-size="11" text-anchor="middle">↑ 上へ成長</text>
      <rect x="90" y="230" width="200" height="50" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <text x="190" y="252" fill="var(--fg)" font-size="13" text-anchor="middle">スタック</text>
      <text x="190" y="270" fill="var(--muted)" font-size="11" text-anchor="middle">↓ 下へ成長</text>
      </svg>
    </div>
  </body>
</html>
