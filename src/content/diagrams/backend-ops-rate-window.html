<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 330" role="img" aria-label="固定ウィンドウ方式の境界問題と、トークンバケット方式の違いを示した図。上段は毎分100回という制限を、分の区切りごとに数え直す固定ウィンドウ方式。1つ目の区間の終わり際に100回、区間が変わった直後にもう100回を投げると、どちらの区間も上限内なのに、境界をまたぐ2秒間には200回が通ってしまう。この現象を境界問題と呼ぶ。下段はトークンバケット方式で、一定の速度で補充される持ち玉を消費していく形。玉が溜まっていれば一度にまとめて使えるので、画面を開いた瞬間に何本かまとめて呼ぶような正常な使い方を許せる。しかし玉の補充速度が上限なので、継続的に使い続けることはできない。図の下部には、厳密さが要るなら直近の一定時間を数える方式かトークンバケットを選ぶこと、実務ではバーストを許せるトークンバケットが好まれることが記されている。">
        <text x="16" y="24" font-size="11.5" class="muted">「毎分100回まで」を、どう数えるか</text>

        <text x="16" y="52" font-size="11" class="muted">区切りごとに数え直す(固定ウィンドウ)</text>

        <line x1="60" y1="128" x2="600" y2="128" stroke="var(--border)" stroke-width="1.2" />
        <line x1="240" y1="64" x2="240" y2="136" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" />
        <line x1="420" y1="64" x2="420" y2="136" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" />
        <text x="120" y="146" font-size="9" class="muted">1分目</text>
        <text x="300" y="146" font-size="9" class="muted">2分目</text>
        <text x="490" y="146" font-size="9" class="muted">3分目</text>

        <rect x="196" y="76" width="40" height="48" rx="3" fill="var(--muted)" opacity="0.5" />
        <text x="150" y="72" font-size="9" class="muted">100回</text>
        <rect x="244" y="76" width="40" height="48" rx="3" fill="var(--muted)" opacity="0.5" />
        <text x="290" y="72" font-size="9" class="muted">100回</text>

        <rect x="188" y="164" width="104" height="26" rx="5" fill="var(--card)" stroke="var(--muted)" stroke-width="1.3" />
        <text x="198" y="182" font-size="10" class="muted">2秒間に200回</text>
        <line x1="240" y1="136" x2="240" y2="160" stroke="var(--muted)" stroke-width="1.2" />
        <text x="304" y="182" font-size="10" class="muted">どちらの区間も上限内なのに、境界をまたぐと倍通る</text>

        <line x1="16" y1="208" x2="624" y2="208" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="236" font-size="11" class="lbl">一定速度で補充される持ち玉を消費する(トークンバケット)</text>

        <rect x="60" y="248" width="76" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <circle cx="78" cy="268" r="5" fill="var(--primary)" opacity="0.85" />
        <circle cx="94" cy="268" r="5" fill="var(--primary)" opacity="0.85" />
        <circle cx="110" cy="268" r="5" fill="var(--primary)" opacity="0.85" />
        <circle cx="86" cy="282" r="5" fill="var(--primary)" opacity="0.85" />
        <circle cx="102" cy="282" r="5" fill="var(--primary)" opacity="0.85" />
        <text x="60" y="310" font-size="9" class="muted">溜まっていれば、まとめて使える</text>

        <text x="160" y="262" font-size="10" class="muted">→ 画面を開いた瞬間に10本まとめて呼ぶ、という</text>
        <text x="160" y="278" font-size="10" class="muted">　 正常な使い方を許せる</text>
        <text x="160" y="300" font-size="10" class="lbl">→ 補充の速度が上限なので、使い続けることはできない</text>
      </svg>
    </div>
  </body>
</html>
