<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 310" role="img" aria-label="UI equals f of state という等式を中心に、純粋な部分と脱出口を並べた図。中央にコンポーネントの関数があり、左から状態とpropsが入力として入り、右へJSXが出力される。この経路が保たれている限り、画面は状態から一意に決まる。下側に4つの脱出口が並び、それぞれ純粋性を崩す代わりに現実の要求に応える。stateは同じpropsでも内部の値で結果が変わる。副作用は外の世界を読み書きする。refは再描画を経ずに直接触れる。Contextは引数を経ずに外側の値を読む。脱出口を使うほど、画面が状態から一意に決まるという保証が弱くなるため、バグを追うときはまずここを疑えばよい。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="52" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="80" y="78" text-anchor="middle" font-size="11.5">state</text>
        <text x="80" y="98" text-anchor="middle" font-size="11.5">props</text>
        <line x1="140" y1="82" x2="176" y2="82" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />

        <rect x="180" y="44" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="280" y="74" text-anchor="middle" font-size="13">f</text>
        <text x="280" y="98" text-anchor="middle" font-size="10.5" class="muted">コンポーネント(純粋)</text>

        <line x1="380" y1="82" x2="416" y2="82" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <rect x="420" y="52" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="88" text-anchor="middle" font-size="11.5">JSX</text>

        <text x="560" y="80" font-size="10.5" class="lbl">同じ入力なら</text>
        <text x="560" y="98" font-size="10.5" class="lbl">同じ出力</text>

        <text x="20" y="152" font-size="11.5" class="muted">純粋性が崩れる4つの脱出口 ― バグはたいていここにいる</text>

        <rect x="20" y="166" width="146" height="76" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="190" font-size="11.5">state</text>
        <text x="36" y="212" font-size="10" class="muted">同じpropsでも</text>
        <text x="36" y="230" font-size="10" class="muted">結果が変わる</text>

        <rect x="176" y="166" width="146" height="76" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="192" y="190" font-size="11.5">副作用</text>
        <text x="192" y="212" font-size="10" class="muted">外の世界を</text>
        <text x="192" y="230" font-size="10" class="muted">読み書きする</text>

        <rect x="332" y="166" width="146" height="76" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="348" y="190" font-size="11.5">ref</text>
        <text x="348" y="212" font-size="10" class="muted">再描画を経ずに</text>
        <text x="348" y="230" font-size="10" class="muted">直接触れる</text>

        <rect x="488" y="166" width="132" height="76" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="504" y="190" font-size="11.5">Context</text>
        <text x="504" y="212" font-size="10" class="muted">引数を経ずに</text>
        <text x="504" y="230" font-size="10" class="muted">外側を読む</text>

        <text x="20" y="272" font-size="10.5" class="muted">脱出口が悪いのではない ― どこが純粋でないかを把握していないことが問題になる</text>
        <text x="20" y="294" font-size="10.5" class="lbl">迷ったら「2回実行しても同じ結果か」を問う ― 違うなら、それは描画の外へ出す</text>
      </svg>
    </div>
  </body>
</html>
