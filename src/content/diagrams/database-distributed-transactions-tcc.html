<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
        --danger: oklch(0.65 0.22 25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="TCCの図解。参加者はまずTryでリソースを予約する。全参加者のTry結果を集約し、全員成功ならConfirmで予約を確定し、誰か1人でも失敗すればCancelで予約を解放する、という2方向への分岐を示す。"
      >
        <defs>
          <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
          <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)" />
          </marker>
        </defs>

        <!-- Try -->
        <rect x="20" y="130" width="200" height="60" rx="9" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="155" text-anchor="middle" font-size="12.5" font-weight="600">Try</text>
        <text x="120" y="174" text-anchor="middle" font-size="10.5" class="muted">リソースを仮予約(reserved)</text>

        <!-- 判定 -->
        <path d="M120,130 L120,60 L120,60" fill="none" />
        <polygon points="270,90 340,130 270,170 200,130" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="270" y="126" text-anchor="middle" font-size="10.5" font-weight="600">全員の</text>
        <text x="270" y="140" text-anchor="middle" font-size="10.5" font-weight="600">Tryが成功?</text>

        <path d="M220,160 L200,130" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowM)" />

        <!-- Confirm 分岐 -->
        <path d="M310,105 L470,50" stroke="var(--primary)" stroke-width="1.6" fill="none" marker-end="url(#arrowP)" />
        <text x="400" y="65" text-anchor="middle" font-size="11" style="fill: var(--primary)">Yes(全員成功)</text>

        <rect x="480" y="20" width="240" height="60" rx="9" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="600" y="45" text-anchor="middle" font-size="12.5" font-weight="600" style="fill: var(--primary)">Confirm</text>
        <text x="600" y="64" text-anchor="middle" font-size="10.5" class="muted">予約を確定(reserved→confirmed)</text>

        <!-- Cancel 分岐 -->
        <path d="M310,155 L470,210" stroke="var(--danger)" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" />
        <text x="400" y="200" text-anchor="middle" font-size="11" style="fill: var(--danger)">No(誰か失敗)</text>

        <rect x="480" y="200" width="240" height="60" rx="9" fill="var(--card)" stroke="var(--danger)" stroke-width="1.6" />
        <text x="600" y="225" text-anchor="middle" font-size="12.5" font-weight="600" style="fill: var(--danger)">Cancel</text>
        <text x="600" y="244" text-anchor="middle" font-size="10.5" class="muted">予約を解放(reservedを取り消す)</text>

        <text x="380" y="290" text-anchor="middle" font-size="11.5" class="muted">
          例: 在庫は reserved → confirmed(本引当)、または reserved → 解放。口座残高も hold → 本振替 / hold解除で同じ構造
        </text>
      </svg>
    </div>
  </body>
</html>
