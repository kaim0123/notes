<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="CSRFが成立する流れを示した図。利用者のブラウザは銀行サイトにログイン中で、そのサイト宛のCookieを保持している。その状態で攻撃者のサイトを開くと、そこに置かれた隠しフォームが自動で送信され、銀行サイトの送金エンドポイントへPOSTが飛ぶ。宛先が銀行サイトなので、ブラウザは銀行のCookieを自動で添付する。サーバーから見れば、正しいセッションIDが付いた正しい形のリクエストであり、本人の依頼として処理されてしまう。攻撃者は銀行サイトに侵入しておらず、用意したのは自分のサイトだけである。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="76" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="110" y="100" font-size="11" text-anchor="middle">利用者のブラウザ</text>
        <text x="110" y="120" font-size="9" text-anchor="middle" class="muted">銀行サイトにログイン中</text>

        <rect x="290" y="76" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="380" y="100" font-size="11" text-anchor="middle" class="mono">evil.example</text>
        <text x="380" y="120" font-size="9" text-anchor="middle" class="muted">隠しフォームを自動送信</text>

        <rect x="560" y="76" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="650" y="100" font-size="10" text-anchor="middle" class="mono">bank.example/transfer</text>
        <text x="650" y="120" font-size="9" text-anchor="middle" class="muted">POST 送金</text>

        <line x1="204" y1="107" x2="286" y2="107" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="474" y1="107" x2="556" y2="107" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="245" y="99" font-size="9" text-anchor="middle" class="muted">① 別タブで開く</text>
        <text x="515" y="99" font-size="9" text-anchor="middle" class="muted">② POSTが飛ぶ</text>

        <line x1="515" y1="142" x2="515" y2="166" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="515" y="184" font-size="10" text-anchor="middle" class="accent">③ 宛先が銀行なので、ブラウザがCookieを自動で添付する</text>

        <text x="20" y="204" font-size="9.5" class="muted">攻撃者は銀行サイトに侵入していない。</text>
        <text x="20" y="222" font-size="9.5" class="muted">用意したのは、自分のサイト1枚だけ。</text>

        <rect x="420" y="196" width="320" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="580" y="216" font-size="9.5" text-anchor="middle" class="muted">サーバーから見ると</text>
        <text x="580" y="234" font-size="10" text-anchor="middle">正しいセッションIDが付いた、正しい形の依頼</text>

        <line x1="16" y1="260" x2="744" y2="260" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="282" font-size="10.5" class="accent">Cookieが証明するのは「本人であること」だけ。「本人がいま、それを望んでいること」までは証明していない。</text>
      </svg>
    </div>
  </body>
</html>
