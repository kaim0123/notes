<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 322"
        role="img"
        aria-label="パスワードをハッシュで保存するとき、ソルトの有無で漏洩後の結果がどう変わるかを左右で比べた図。左はソルトなしのハッシュで、同じpassword123を使っている3人のユーザーが、すべて同じハッシュ値e99a18c4として保存されている。値が一致するので使い回しが一目で分かり、1件を解読すれば同じ値の全員がまとめて解ける。右はソルトとストレッチングを使った場合で、ユーザーごとに異なるソルトが混ざるため、同じパスワードでも3a7f19c2・c14b8d05・90e2f631という別々の値になる。あらかじめ計算した表が効かず、1件ずつ総当たりをやり直すしかなくなる。さらにストレッチングが1件あたりの計算時間を引き上げる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <line x1="380" y1="28" x2="380" y2="232" stroke="var(--border)" stroke-width="1" />

        <text x="193" y="42" font-size="11" text-anchor="middle" class="muted">ソルトなしのハッシュ</text>
        <text x="193" y="64" font-size="9" text-anchor="middle" class="muted">同じパスワードを使っている3人</text>
        <text x="36" y="94" font-size="9" class="mono muted">user_a</text>
        <text x="96" y="94" font-size="9" class="mono">password123</text>
        <line x1="190" y1="91" x2="218" y2="91" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <text x="228" y="94" font-size="9" class="mono">e99a18c4</text>
        <text x="36" y="122" font-size="9" class="mono muted">user_b</text>
        <text x="96" y="122" font-size="9" class="mono">password123</text>
        <line x1="190" y1="119" x2="218" y2="119" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <text x="228" y="122" font-size="9" class="mono">e99a18c4</text>
        <text x="36" y="150" font-size="9" class="mono muted">user_c</text>
        <text x="96" y="150" font-size="9" class="mono">password123</text>
        <line x1="190" y1="147" x2="218" y2="147" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <text x="228" y="150" font-size="9" class="mono">e99a18c4</text>
        <text x="193" y="188" font-size="9.5" text-anchor="middle" class="muted">同じ値が並ぶので、使い回しが一目で分かる</text>
        <text x="193" y="210" font-size="10" text-anchor="middle">1件解ければ、同じ値の全員が解ける</text>

        <text x="567" y="42" font-size="11" text-anchor="middle" class="accent">ソルト + ストレッチング</text>
        <text x="567" y="64" font-size="9" text-anchor="middle" class="muted">同じパスワードを使っている3人</text>
        <text x="404" y="94" font-size="9" class="mono muted">user_a</text>
        <text x="462" y="94" font-size="9" class="mono">password123</text>
        <text x="540" y="94" font-size="9" class="mono accent">+s1</text>
        <line x1="588" y1="91" x2="616" y2="91" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <text x="626" y="94" font-size="9" class="mono">3a7f19c2</text>
        <text x="404" y="122" font-size="9" class="mono muted">user_b</text>
        <text x="462" y="122" font-size="9" class="mono">password123</text>
        <text x="540" y="122" font-size="9" class="mono accent">+s2</text>
        <line x1="588" y1="119" x2="616" y2="119" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <text x="626" y="122" font-size="9" class="mono">c14b8d05</text>
        <text x="404" y="150" font-size="9" class="mono muted">user_c</text>
        <text x="462" y="150" font-size="9" class="mono">password123</text>
        <text x="540" y="150" font-size="9" class="mono accent">+s3</text>
        <line x1="588" y1="147" x2="616" y2="147" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <text x="626" y="150" font-size="9" class="mono">90e2f631</text>
        <text x="567" y="188" font-size="9.5" text-anchor="middle" class="muted">同じパスワードでも、別々の値になる</text>
        <text x="567" y="210" font-size="10" text-anchor="middle" class="accent">まとめ解読が効かず、1件ずつやり直しになる</text>

        <line x1="16" y1="248" x2="744" y2="248" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="270" font-size="10.5" class="muted">ソルトが潰すのは「1回の計算を、たくさんの行に使い回す」という攻撃側の効率。あらかじめ作った対応表も効かなくなる。</text>
        <text x="16" y="292" font-size="10.5" class="muted">ストレッチングは1件あたりの計算を意図的に重くする。ログインは1回だけなので体感は変わらないが、総当たりは何億回ぶんも遅くなる。</text>
        <text x="16" y="314" font-size="10.5" class="accent">bcryptやArgon2は、この2つを最初から備えている。汎用のSHA-256を素で使うのは、この2つが無いという意味になる。</text>
      </svg>
    </div>
  </body>
</html>
