<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="ディレクトリ構造がURLと境界の入れ子にそのまま対応することを示した図。左にappディレクトリのツリーがあり、右にそれが生み出すURLと適用される枠の入れ子が対応して並んでいる。ルートのlayoutは全ページを包み、dashboardフォルダのlayoutはその配下だけを包む。同じ階層に置かれたloadingとerrorも、その階層より下だけを守る。したがって、あるレイアウト自身で起きた失敗を捕まえたいなら、境界は1つ上の階層に置く必要がある。ルーティング表というファイルは存在せず、構造そのものが仕様になっている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="30" font-size="11.5" class="muted">ディレクトリ</text>
        <text x="330" y="30" font-size="11.5" class="muted">生まれるURLと、守られる範囲</text>

        <text x="20" y="58" font-size="10.5">app/</text>
        <text x="36" y="80" font-size="10.5" class="lbl">├─ layout.tsx</text>
        <text x="36" y="102" font-size="10.5" class="muted">├─ page.tsx</text>
        <text x="36" y="124" font-size="10.5" class="muted">└─ dashboard/</text>
        <text x="60" y="146" font-size="10.5" class="lbl">├─ layout.tsx</text>
        <text x="60" y="168" font-size="10.5" class="lbl">├─ loading.tsx</text>
        <text x="60" y="190" font-size="10.5" class="lbl">├─ error.tsx</text>
        <text x="60" y="212" font-size="10.5" class="muted">├─ page.tsx</text>
        <text x="60" y="234" font-size="10.5" class="muted">└─ settings/page.tsx</text>

        <line x1="300" y1="40" x2="300" y2="280" stroke="var(--border)" stroke-width="1" />

        <rect x="322" y="46" width="298" height="200" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="338" y="68" font-size="10.5" class="lbl">app/layout.tsx が包む範囲(全ページ)</text>
        <text x="338" y="92" font-size="10.5" class="muted">→ /</text>

        <rect x="338" y="104" width="266" height="126" rx="7" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="354" y="126" font-size="10.5" class="lbl">dashboard/layout.tsx が包む範囲</text>
        <text x="354" y="146" font-size="10" class="muted">loading.tsx / error.tsx もこの内側だけを守る</text>
        <rect x="354" y="158" width="234" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="366" y="176" font-size="10.5" class="muted">→ /dashboard</text>
        <rect x="354" y="192" width="234" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="366" y="210" font-size="10.5" class="muted">→ /dashboard/settings</text>

        <text x="322" y="272" font-size="10.5" class="lbl">境界は「置いた階層より下」だけを守る ―</text>
        <text x="322" y="292" font-size="10.5" class="muted">レイアウト自身の失敗を捕まえたいなら、1つ上の階層に置く</text>
      </svg>
    </div>
  </body>
</html>
