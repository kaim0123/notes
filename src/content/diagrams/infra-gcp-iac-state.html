<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="構成をコードで管理する道具が、3つのものを突き合わせて動くことを示した図。1つ目は自分が書いたコード、2つ目は前回適用した結果を記録した状態、3つ目は実際にクラウド上に存在している現物である。適用の前にこの3つを比較し、何を作り、何を変え、何を消すのかという計画が示される。人はその計画を読んでから実行を決める。状態の記録が壊れたり、現物を画面から手で変えたりすると、3つの一致が崩れて意図しない削除が計画に現れる。だから状態は共有できる場所に置き、同時に書き換えられないようにする。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="50" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="120" y="76" font-size="10.5" text-anchor="middle">書いたコード</text>
        <text x="120" y="98" font-size="9" text-anchor="middle" class="muted">あるべき姿</text>
        <text x="120" y="116" font-size="9" text-anchor="middle" class="muted">レビューの対象</text>

        <rect x="270" y="50" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="370" y="76" font-size="10.5" text-anchor="middle">前回の状態の記録</text>
        <text x="370" y="98" font-size="9" text-anchor="middle" class="muted">何を作ったかの控え</text>
        <text x="370" y="116" font-size="9" text-anchor="middle" class="accent">壊すと対応が崩れる</text>

        <rect x="520" y="50" width="220" height="80" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="76" font-size="10.5" text-anchor="middle">実際の現物</text>
        <text x="630" y="98" font-size="9" text-anchor="middle" class="muted">クラウド上に存在するもの</text>
        <text x="630" y="116" font-size="9" text-anchor="middle" class="accent">手で変えるとずれる</text>

        <line x1="120" y1="136" x2="330" y2="168" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="370" y1="136" x2="370" y2="168" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="630" y1="136" x2="410" y2="168" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="230" y="174" width="280" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="370" y="196" font-size="10.5" text-anchor="middle">3つを比べて、計画を出す</text>
        <text x="370" y="216" font-size="9" text-anchor="middle" class="muted">何を作り、何を変え、何を消すか</text>

        <text x="20" y="262" font-size="10.5" class="muted">状態は共有できる場所に置き、同時に書き換えられないようにする ― ここが崩れると、計画に意図しない削除が現れる。</text>
      </svg>
    </div>
  </body>
</html>
