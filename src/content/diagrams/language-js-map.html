<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="JavaScript・TypeScriptの10章を、扱う対象の広がりで並べた地図。1段目は書くための部品で、値と型、関数、データの変換、型を使いこなす、クラスとプロトタイプの5つ。ここまでは頭の中だけで完結する計算の世界。2段目は動くときの仕組みで、実行の仕組みと非同期処理の2つ。コールスタックとイベントループという、コードが動く土台を扱う。3段目は外の世界との接点で、ブラウザとNode.jsの2つ。DOM・イベント・ストレージ・ファイルといった副作用がここに集まる。そして型を使い回すジェネリクスとユーティリティ型が全体にまたがる。左から右へ進むほど、計算の世界から副作用の世界へ移っていく構成になっている。"
      >
        <text x="16" y="26" font-size="12" class="lbl">① 書くための部品 ― 計算の世界</text>

        <rect x="16" y="38" width="116" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="74" y="62" text-anchor="middle" font-size="11.5">値と型</text>
        <text x="74" y="79" text-anchor="middle" font-size="10" class="muted">const・不変</text>

        <rect x="140" y="38" width="116" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="198" y="62" text-anchor="middle" font-size="11.5">関数</text>
        <text x="198" y="79" text-anchor="middle" font-size="10" class="muted">純粋・クロージャ</text>

        <rect x="264" y="38" width="116" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="322" y="62" text-anchor="middle" font-size="11.5">データの変換</text>
        <text x="322" y="79" text-anchor="middle" font-size="10" class="muted">map・スプレッド</text>

        <rect x="388" y="38" width="116" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="446" y="62" text-anchor="middle" font-size="11.5">型を使いこなす</text>
        <text x="446" y="79" text-anchor="middle" font-size="10" class="muted">Union・Result</text>

        <rect x="512" y="38" width="112" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="568" y="62" text-anchor="middle" font-size="11.5" class="muted">クラス</text>
        <text x="568" y="79" text-anchor="middle" font-size="10" class="muted">読むための知識</text>

        <text x="16" y="126" font-size="12" class="lbl">② 動くときの仕組み</text>

        <rect x="16" y="138" width="240" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="136" y="162" text-anchor="middle" font-size="11.5">実行の仕組み</text>
        <text x="136" y="179" text-anchor="middle" font-size="10" class="muted">コールスタック・ヒープ・GC</text>

        <rect x="264" y="138" width="240" height="52" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="384" y="162" text-anchor="middle" font-size="11.5">非同期処理</text>
        <text x="384" y="179" text-anchor="middle" font-size="10" class="muted">イベントループ・Promise</text>

        <rect x="512" y="126" width="112" height="140" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="568" y="180" text-anchor="middle" font-size="11.5" class="muted">ジェネリクス</text>
        <text x="568" y="198" text-anchor="middle" font-size="11.5" class="muted">ユーティリティ型</text>
        <text x="568" y="220" text-anchor="middle" font-size="10" class="muted">全体にまたがる</text>
        <text x="568" y="236" text-anchor="middle" font-size="10" class="muted">型の道具</text>

        <text x="16" y="226" font-size="12" class="lbl">③ 外の世界との接点 ― 副作用</text>

        <rect x="16" y="238" width="240" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="136" y="258" text-anchor="middle" font-size="11.5" class="muted">ブラウザ ― Web API</text>
        <text x="136" y="275" text-anchor="middle" font-size="10" class="muted">DOM・イベント・ストレージ</text>

        <rect x="264" y="238" width="240" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="384" y="258" text-anchor="middle" font-size="11.5" class="muted">Node.js と標準ライブラリ</text>
        <text x="384" y="275" text-anchor="middle" font-size="10" class="muted">モジュール・ファイル・JSON</text>
      </svg>
    </div>
  </body>
</html>
