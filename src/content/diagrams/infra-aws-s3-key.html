<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="オブジェクトストレージのキーが階層に見えて実際は平らであることを示した図。左のように画面上はフォルダが並んでいるように見えるが、実際に保存されているのは右のような1本の長い文字列をキーとするオブジェクトの集まりである。フォルダに見えるのはキーに含まれるスラッシュを画面が区切って表示しているだけで、ディレクトリという実体は存在しない。したがって一覧の取得はキーの前方一致による検索であり、どの単位で絞り込みたいかがそのままキーの先頭に何を置くかの設計になる。日付を先に置けば期間で、利用者を先に置けば利用者ごとに切り出せる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="150" y="28" font-size="11.5" text-anchor="middle" class="muted">画面での見え方</text>
        <rect x="20" y="44" width="260" height="150" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="70" font-size="10.5">📁 2026/</text>
        <text x="60" y="94" font-size="10.5">📁 09/</text>
        <text x="80" y="118" font-size="10.5">📄 report.pdf</text>
        <text x="80" y="142" font-size="10.5">📄 summary.csv</text>
        <text x="40" y="172" font-size="9.5" class="muted">フォルダが並んでいるように見える</text>

        <line x1="292" y1="120" x2="340" y2="120" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="316" y="110" font-size="9.5" text-anchor="middle" class="accent">実体</text>

        <text x="550" y="28" font-size="11.5" text-anchor="middle" class="muted">実際の保存のされ方</text>
        <rect x="350" y="44" width="390" height="150" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <rect x="366" y="60" width="358" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="378" y="80" font-size="9.5" class="mono">key = "2026/09/report.pdf"</text>
        <rect x="366" y="96" width="358" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="378" y="116" font-size="9.5" class="mono">key = "2026/09/summary.csv"</text>
        <rect x="366" y="132" width="358" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="378" y="152" font-size="9.5" class="mono">key = "2026/10/report.pdf"</text>
        <text x="366" y="182" font-size="9.5" class="muted">1本の文字列がキー ― ディレクトリという実体は無い</text>

        <text x="20" y="228" font-size="10.5" class="muted">一覧の取得は「この文字列で始まるキーを集める」という前方一致の検索にすぎない。</text>
        <text x="20" y="250" font-size="10.5" class="accent">だから、どの単位で切り出したいかが、そのままキーの先頭に何を置くかの設計になる。</text>
        <text x="20" y="270" font-size="10" class="muted">日付を先に置けば期間で、利用者IDを先に置けば利用者ごとに絞れる。後から変えるのは面倒。</text>
      </svg>
    </div>
  </body>
</html>
