<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="4つの並行モデルを、状態の扱い方で2系統に分けて並べた図。左の共有メモリ系には、OSスレッドとロックのモデルが入る。複数のスレッドが同じデータを直接読み書きし、触る順番をロックで整理する。正しさはプログラマがロックを正しく使うことに依存し、典型的なバグは競合状態とデッドロック。右のメッセージパッシング系には、アクターとチャネルのモデルが入る。データを持つのは1人だけで、他はメッセージを送って依頼する。構造上、同時アクセスが起きないため競合は原理的に起きず、典型的な課題はメッセージの順序や欠落、キューの滞留になる。中央下のイベントループとコルーチンは、スレッドを1本に保ったまま待ち時間を活用する方式で、ロックは要らないが1本を止めるとすべて止まる。どのモデルを選ぶかは、どちらの難しさなら自分たちが扱えるかで決まる。"
      >
        <text x="160" y="26" text-anchor="middle" font-size="12" class="lbl">共有メモリ系 ― 同じデータをみんなで触る</text>
        <text x="480" y="26" text-anchor="middle" font-size="12" class="lbl">メッセージパッシング系 ― 送って依頼する</text>

        <rect x="16" y="38" width="288" height="106" rx="9" fill="none" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="6 4" />

        <rect x="34" y="54" width="70" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="69" y="76" text-anchor="middle" font-size="11" class="muted">スレッド</text>
        <rect x="114" y="54" width="70" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="149" y="76" text-anchor="middle" font-size="11" class="muted">スレッド</text>
        <rect x="194" y="54" width="70" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="229" y="76" text-anchor="middle" font-size="11" class="muted">スレッド</text>

        <line x1="69" y1="88" x2="149" y2="106" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="149" y1="88" x2="149" y2="106" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="229" y1="88" x2="149" y2="106" stroke="var(--muted)" stroke-width="1.2" />

        <rect x="64" y="106" width="170" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="149" y="126" text-anchor="middle" font-size="11">共有データ + ロック</text>

        <rect x="336" y="38" width="288" height="106" rx="9" fill="none" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="6 4" />

        <rect x="354" y="54" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="409" y="74" text-anchor="middle" font-size="11">アクターA</text>
        <text x="409" y="92" text-anchor="middle" font-size="10" class="muted">自分の状態を持つ</text>

        <rect x="496" y="54" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="551" y="74" text-anchor="middle" font-size="11">アクターB</text>
        <text x="551" y="92" text-anchor="middle" font-size="10" class="muted">自分の状態を持つ</text>

        <line x1="464" y1="72" x2="492" y2="72" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="492" y1="90" x2="464" y2="90" stroke="var(--muted)" stroke-width="1.3" />
        <text x="478" y="128" text-anchor="middle" font-size="10.5" class="muted">メッセージ</text>

        <rect x="16" y="160" width="288" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="180" text-anchor="middle" font-size="11" class="muted">正しさ = プログラマがロックを正しく使うこと</text>
        <text x="160" y="200" text-anchor="middle" font-size="11" class="lbl">典型的なバグ: 競合状態・デッドロック</text>

        <rect x="336" y="160" width="288" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="180" text-anchor="middle" font-size="11" class="muted">正しさ = 構造上、同時アクセスが起きないこと</text>
        <text x="480" y="200" text-anchor="middle" font-size="11" class="lbl">典型的な課題: 順序・欠落・キューの滞留</text>

        <rect x="120" y="228" width="400" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="248" text-anchor="middle" font-size="11.5">イベントループ / コルーチン ― スレッドは1本のまま待ち時間を活用</text>
        <text x="320" y="266" text-anchor="middle" font-size="10.5" class="muted">ロックは要らないが、1本を止めるとすべて止まる</text>

        <text x="16" y="294" font-size="11" class="muted">どちらが楽かではなく、どちらの難しさなら自分たちが扱えるかで選ぶ</text>
      </svg>
    </div>
  </body>
</html>
