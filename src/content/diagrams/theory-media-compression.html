<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 24%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      line.doc {
        stroke: var(--muted);
        stroke-width: 2;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 300"
        role="img"
        aria-label="可逆圧縮と非可逆圧縮を比較した図解。どちらも元データを圧縮して小さくし、伸張して復元するが、可逆圧縮は完全に同じデータに戻るのに対し、非可逆圧縮は一部の情報を失い元とは完全には同じにならない"
      >
        <defs>
          <marker
            id="arrow6"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- 行1: 可逆圧縮 -->
        <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="700">可逆圧縮</text>

        <rect x="40" y="40" width="100" height="90" rx="6" fill="var(--card)" stroke="var(--border)" />
        <line class="doc" x1="55" y1="65" x2="125" y2="65" />
        <line class="doc" x1="55" y1="82" x2="110" y2="82" />
        <line class="doc" x1="55" y1="99" x2="125" y2="99" />
        <line class="doc" x1="55" y1="116" x2="95" y2="116" />
        <text x="90" y="145" text-anchor="middle" font-size="11" class="muted">元データ</text>

        <line x1="150" y1="85" x2="197" y2="85" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow6)" />
        <text x="175" y="72" text-anchor="middle" font-size="11" class="muted">圧縮</text>

        <rect x="210" y="60" width="70" height="50" rx="6" fill="var(--card)" stroke="var(--border)" />
        <line class="doc" x1="222" y1="78" x2="262" y2="78" />
        <line class="doc" x1="222" y1="93" x2="252" y2="93" />
        <text x="245" y="127" text-anchor="middle" font-size="11" class="muted">圧縮データ(小)</text>

        <line x1="290" y1="85" x2="337" y2="85" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow6)" />
        <text x="315" y="72" text-anchor="middle" font-size="11" class="muted">伸張</text>

        <rect x="350" y="40" width="100" height="90" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <line class="doc" x1="365" y1="65" x2="435" y2="65" />
        <line class="doc" x1="365" y1="82" x2="420" y2="82" />
        <line class="doc" x1="365" y1="99" x2="435" y2="99" />
        <line class="doc" x1="365" y1="116" x2="405" y2="116" />
        <text x="400" y="145" text-anchor="middle" font-size="11" class="muted">復元データ</text>

        <text x="470" y="82" font-size="20" style="fill: var(--primary)">✓</text>
        <text x="495" y="80" font-size="13">完全に同じに</text>
        <text x="495" y="97" font-size="13">戻る</text>

        <!-- 行2: 非可逆圧縮 -->
        <text x="400" y="157" text-anchor="middle" font-size="14" font-weight="700">非可逆圧縮</text>

        <rect x="40" y="170" width="100" height="90" rx="6" fill="var(--card)" stroke="var(--border)" />
        <line class="doc" x1="55" y1="195" x2="125" y2="195" />
        <line class="doc" x1="55" y1="212" x2="110" y2="212" />
        <line class="doc" x1="55" y1="229" x2="125" y2="229" />
        <line class="doc" x1="55" y1="246" x2="95" y2="246" />
        <text x="90" y="275" text-anchor="middle" font-size="11" class="muted">元データ</text>

        <line x1="150" y1="215" x2="197" y2="215" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow6)" />
        <text x="175" y="202" text-anchor="middle" font-size="11" class="muted">圧縮</text>

        <rect x="210" y="190" width="70" height="50" rx="6" fill="var(--card)" stroke="var(--border)" />
        <line class="doc" x1="222" y1="208" x2="262" y2="208" />
        <line class="doc" x1="222" y1="223" x2="252" y2="223" />
        <text x="245" y="257" text-anchor="middle" font-size="11" class="muted">圧縮データ(小)</text>

        <line x1="290" y1="215" x2="337" y2="215" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow6)" />
        <text x="315" y="202" text-anchor="middle" font-size="11" class="muted">伸張</text>

        <rect
          x="350"
          y="170"
          width="100"
          height="90"
          rx="6"
          fill="var(--card)"
          stroke="var(--border)"
          stroke-dasharray="5 4"
        />
        <line class="doc" x1="365" y1="195" x2="435" y2="195" />
        <line class="doc" x1="365" y1="212" x2="420" y2="212" />
        <line class="doc" x1="365" y1="229" x2="435" y2="229" />
        <text x="400" y="275" text-anchor="middle" font-size="11" class="muted">復元データ(近似)</text>

        <text x="470" y="212" font-size="20" class="muted">≈</text>
        <text x="495" y="210" font-size="13">元とは完全には</text>
        <text x="495" y="227" font-size="13">同じにならない</text>
      </svg>
    </div>
  </body>
</html>
