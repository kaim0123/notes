<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="SQL文を書く順序と実際に処理される順序を比較した図解。書く順序はSELECT・FROM・WHERE・GROUP BY・HAVING・ORDER BYの並びだが、実際にはFROM(1)→WHERE(2)→GROUP BY(3)→HAVING(4)→SELECT(5)→ORDER BY(6)の順で処理される。特にSELECTは書く位置は先頭だが処理は5番目と、大きく順序が入れ替わることを斜めの線で示す。"
      >
        <defs>
          <marker
            id="arrowMuted"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="5"
            markerHeight="5"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowPrimary"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="5"
            markerHeight="5"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="380" y="18" text-anchor="middle" font-size="12" font-weight="600" class="muted">
          SQL文に書く順序
        </text>

        <!-- 上段: 書く順序 -->
        <g font-size="12.5" font-weight="600">
          <rect x="25" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="80" y="58" text-anchor="middle">SELECT</text>

          <rect x="145" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="200" y="58" text-anchor="middle">FROM</text>

          <rect x="265" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="320" y="58" text-anchor="middle">WHERE</text>

          <rect x="385" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="440" y="58" text-anchor="middle">GROUP BY</text>

          <rect x="505" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="560" y="58" text-anchor="middle">HAVING</text>

          <rect x="625" y="30" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <text x="680" y="58" text-anchor="middle">ORDER BY</text>
        </g>

        <!-- 対応線(書く順序→実行順序) -->
        <path d="M80,76 L560,224" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#arrowPrimary)" />
        <path d="M200,76 L80,224" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted)" />
        <path d="M320,76 L200,224" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted)" />
        <path d="M440,76 L320,224" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted)" />
        <path d="M560,76 L440,224" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted)" />
        <path d="M680,76 L680,224" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrowMuted)" />

        <text x="380" y="150" text-anchor="middle" font-size="11" style="fill: var(--primary)">
          SELECTは書く位置は先頭でも、処理は5番目
        </text>

        <!-- 下段: 実行順序 -->
        <g font-size="12.5" font-weight="600">
          <rect x="25" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <circle cx="37" cy="230" r="11" fill="var(--muted)" />
          <text x="37" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--bg)">1</text>
          <text x="86" y="258" text-anchor="middle">FROM</text>

          <rect x="145" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <circle cx="157" cy="230" r="11" fill="var(--muted)" />
          <text x="157" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--bg)">2</text>
          <text x="206" y="258" text-anchor="middle">WHERE</text>

          <rect x="265" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <circle cx="277" cy="230" r="11" fill="var(--muted)" />
          <text x="277" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--bg)">3</text>
          <text x="326" y="258" text-anchor="middle">GROUP BY</text>

          <rect x="385" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <circle cx="397" cy="230" r="11" fill="var(--muted)" />
          <text x="397" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--bg)">4</text>
          <text x="446" y="258" text-anchor="middle">HAVING</text>

          <rect x="505" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
          <circle cx="517" cy="230" r="11" fill="var(--primary)" />
          <text x="517" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--primary-fg)">5</text>
          <text x="566" y="258" text-anchor="middle" style="fill: var(--primary)">SELECT</text>

          <rect x="625" y="230" width="110" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
          <circle cx="637" cy="230" r="11" fill="var(--muted)" />
          <text x="637" y="234" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--bg)">6</text>
          <text x="686" y="258" text-anchor="middle">ORDER BY</text>
        </g>

        <text x="380" y="298" text-anchor="middle" font-size="12" font-weight="600" class="muted">
          実際に処理される順序
        </text>
        <text x="380" y="320" text-anchor="middle" font-size="11" class="muted">
          FROMで対象表を決め、WHEREで行を絞り、GROUP BYでまとめ、HAVINGでグループを絞った後にSELECTで列を取り出す
        </text>
      </svg>
    </div>
  </body>
</html>
