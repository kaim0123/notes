<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 660 300"
        role="img"
        aria-label="Strategyパターンの構造図。左に商品一覧画面(Context)があり、そこから右の並び替え戦略というインターフェース(sortメソッドを持つ抽象)へ矢印が伸びる。インターフェースの下には名前順・価格順・人気順という3つの実装が並び、それぞれからインターフェースへ上向きの矢印が伸びる。Contextは具体的な並び替え方法を知らないまま、実行時に戦略を差し替えられることを示す。"
      >
        <defs>
          <marker
            id="arrowStrategy"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker
            id="arrowStrategyHi"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="30" y="60" width="180" height="58" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="120" y="85" text-anchor="middle" font-size="12">商品一覧画面</text>
        <text x="120" y="104" text-anchor="middle" font-size="10.5" class="muted">Context(使う側)</text>

        <line x1="216" y1="89" x2="292" y2="89" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowStrategy)" />
        <text x="254" y="78" text-anchor="middle" font-size="10.5" class="muted">呼ぶ</text>

        <rect x="300" y="60" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="450" y="85" text-anchor="middle" font-size="12" font-weight="600">«インターフェース» 並び替え戦略</text>
        <text x="450" y="104" text-anchor="middle" font-size="10.5" class="muted">sort(商品リスト) → 商品リスト</text>

        <line x1="350" y1="196" x2="400" y2="126" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowStrategyHi)" />
        <line x1="450" y1="196" x2="450" y2="126" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowStrategyHi)" />
        <line x1="550" y1="196" x2="500" y2="126" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowStrategyHi)" />

        <rect x="302" y="198" width="96" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="350" y="225" text-anchor="middle" font-size="11.5">名前順</text>
        <rect x="402" y="198" width="96" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="450" y="225" text-anchor="middle" font-size="11.5">価格順</text>
        <rect x="502" y="198" width="96" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="550" y="225" text-anchor="middle" font-size="11.5">人気順</text>

        <text x="120" y="180" text-anchor="middle" font-size="11" class="muted">Contextは「どう並べるか」を</text>
        <text x="120" y="198" text-anchor="middle" font-size="11" class="muted">知らないまま呼べる</text>
        <text x="120" y="222" text-anchor="middle" font-size="11" class="muted">= 実行時に差し替え可能</text>

        <text x="330" y="284" text-anchor="middle" font-size="11" class="muted">
          分岐(if / switch)で並び替え方法を書き分ける代わりに、交換可能な部品として切り出す
        </text>
      </svg>
    </div>
  </body>
</html>
