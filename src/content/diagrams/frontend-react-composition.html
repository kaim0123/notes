<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="設定で渡す形と構造で渡す形を比べた図。左側では、ダイアログにタイトル、閉じるボタンの有無、フッターのボタン配列といったpropsを次々に足していく。選択肢が増えるたびにpropsが増え、内部の分岐も増えていく。右側では、ダイアログの中に見出しや本文やフッターを子要素として直接書く。新しい見せ方が必要になっても使う側が構造を組み替えるだけでよく、部品側は変更しなくてよい。設定は数が増えるが、構造は組み合わせで表現できる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="30" font-size="11.5" class="muted">設定で渡す ― props が増え続ける</text>
        <rect x="20" y="42" width="280" height="180" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="38" y="68" font-size="10.5" class="muted">&lt;Dialog</text>
        <text x="52" y="90" font-size="10.5" class="muted">title="設定"</text>
        <text x="52" y="110" font-size="10.5" class="muted">showClose</text>
        <text x="52" y="130" font-size="10.5" class="muted">footerButtons={"{"}[...]{"}"}</text>
        <text x="52" y="150" font-size="10.5" class="muted">headerIcon="gear"</text>
        <text x="52" y="170" font-size="10.5" class="muted">bodyScrollable</text>
        <text x="52" y="190" font-size="10.5" class="lbl">… 増え続ける</text>
        <text x="38" y="212" font-size="10.5" class="muted">/&gt;</text>

        <text x="20" y="248" font-size="10.5" class="muted">見せ方が1つ増えるたびに props と内部の分岐が増える</text>
        <text x="20" y="270" font-size="10.5" class="muted">組み合わせても意味のない props も生まれる</text>

        <line x1="320" y1="20" x2="320" y2="286" stroke="var(--border)" stroke-width="1" />

        <text x="342" y="30" font-size="11.5" class="lbl">構造で渡す ― 組み合わせで表す</text>
        <rect x="342" y="42" width="280" height="180" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="360" y="68" font-size="10.5">&lt;Dialog&gt;</text>
        <text x="374" y="90" font-size="10.5" class="lbl">&lt;DialogHeader&gt;設定&lt;/DialogHeader&gt;</text>
        <text x="374" y="112" font-size="10.5" class="lbl">&lt;DialogBody&gt;</text>
        <text x="388" y="132" font-size="10.5" class="muted">…中身は自由…</text>
        <text x="374" y="152" font-size="10.5" class="lbl">&lt;/DialogBody&gt;</text>
        <text x="374" y="174" font-size="10.5" class="lbl">&lt;DialogFooter&gt;…&lt;/DialogFooter&gt;</text>
        <text x="360" y="196" font-size="10.5">&lt;/Dialog&gt;</text>

        <text x="342" y="248" font-size="10.5" class="muted">新しい見せ方は、使う側が構造を組み替えるだけ</text>
        <text x="342" y="270" font-size="10.5" class="lbl">部品側は変更しなくてよい</text>
      </svg>
    </div>
  </body>
</html>
