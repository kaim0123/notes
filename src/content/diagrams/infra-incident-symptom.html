<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="見えている症状と、その裏にありうる原因の階層を対応づけた表形式の図。ページが真っ白のまま固まるという症状は、サーバーが正常でも名前解決の応答待ちで止まっていることがある。サーバーに接続できないという表示は、経路上の機器の故障や配線の断線で起きうる。一部の利用者だけがつながらない場合は、その拠点のネットワーク機器の異常が疑わしい。急にアクセスできなくなった場合は、名前の設定変更で参照先そのものが変わった可能性がある。いずれもアプリの症状に見えて、原因はより下の階層にあるという共通点を持つ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="24" y="30" font-size="12" class="muted">見えている症状(上位層) → ありうる原因(下位層)</text>

        <rect x="24" y="44" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="72" font-size="10.5">ページが真っ白なまま固まる</text>
        <rect x="404" y="44" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="420" y="66" font-size="10.5" class="accent">名前解決の応答待ちで止まっている</text>
        <text x="420" y="82" font-size="9" class="muted">サーバー自体は正常に動いている</text>
        <line x1="358" y1="67" x2="398" y2="67" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="24" y="102" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="130" font-size="10.5">「サーバーに接続できません」</text>
        <rect x="404" y="102" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="420" y="124" font-size="10.5" class="accent">経路上の機器の故障・配線の断線</text>
        <text x="420" y="140" font-size="9" class="muted">サーバーには何も届いていない</text>
        <line x1="358" y1="125" x2="398" y2="125" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="24" y="160" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="188" font-size="10.5">一部の利用者だけつながらない</text>
        <rect x="404" y="160" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="420" y="182" font-size="10.5" class="accent">特定拠点のネットワーク機器の異常</text>
        <text x="420" y="198" font-size="9" class="muted">全体ではなく一部にだけ出る</text>
        <line x1="358" y1="183" x2="398" y2="183" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="24" y="218" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="40" y="246" font-size="10.5">急にアクセスできなくなった</text>
        <rect x="404" y="218" width="330" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="420" y="240" font-size="10.5" class="accent">名前の設定変更で参照先が変わった</text>
        <text x="420" y="256" font-size="9" class="muted">証明書の期限切れも同じ見え方をする</text>
        <line x1="358" y1="241" x2="398" y2="241" stroke="var(--muted)" marker-end="url(#ar)" />
      </svg>
    </div>
  </body>
</html>
