<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 320"
        role="img"
        aria-label="連続した音の波を一定間隔で測る標本化、測った値を段階に丸める量子化、その値を2進数にする符号化という3ステップの図"
      >
        <text x="30" y="28" font-size="13" class="muted">アナログの波 → 標本化 → 量子化 → 符号化(PCM)</text>

        <!-- 量子化の段(横線) -->
        <line x1="60" y1="80" x2="620" y2="80" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="60" y1="110" x2="620" y2="110" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="60" y1="140" x2="620" y2="140" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="60" y1="170" x2="620" y2="170" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />
        <line x1="60" y1="200" x2="620" y2="200" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" />

        <text x="40" y="84" text-anchor="end" font-size="11" class="muted">7</text>
        <text x="40" y="114" text-anchor="end" font-size="11" class="muted">5</text>
        <text x="40" y="144" text-anchor="end" font-size="11" class="muted">3</text>
        <text x="40" y="174" text-anchor="end" font-size="11" class="muted">1</text>

        <!-- アナログ波形 -->
        <path
          d="M60,170 C110,80 160,80 210,140 C260,200 310,200 360,120 C410,60 460,90 510,150 C550,196 590,196 620,170"
          fill="none"
          stroke="var(--fg)"
          stroke-width="2"
        />

        <!-- 標本点と縦線 -->
        <g stroke="var(--primary)" stroke-width="1.5">
          <line x1="100" y1="103" x2="100" y2="230" />
          <line x1="150" y1="88" x2="150" y2="230" />
          <line x1="200" y1="130" x2="200" y2="230" />
          <line x1="250" y1="185" x2="250" y2="230" />
          <line x1="300" y1="192" x2="300" y2="230" />
          <line x1="350" y1="130" x2="350" y2="230" />
          <line x1="400" y1="72" x2="400" y2="230" />
          <line x1="450" y1="88" x2="450" y2="230" />
          <line x1="500" y1="140" x2="500" y2="230" />
          <line x1="550" y1="190" x2="550" y2="230" />
        </g>
        <g fill="var(--primary)">
          <circle cx="100" cy="103" r="4" /><circle cx="150" cy="88" r="4" /><circle cx="200" cy="130" r="4" />
          <circle cx="250" cy="185" r="4" /><circle cx="300" cy="192" r="4" /><circle cx="350" cy="130" r="4" />
          <circle cx="400" cy="72" r="4" /><circle cx="450" cy="88" r="4" /><circle cx="500" cy="140" r="4" />
          <circle cx="550" cy="190" r="4" />
        </g>

        <line x1="60" y1="230" x2="620" y2="230" stroke="var(--border)" stroke-width="1.5" />
        <text x="340" y="252" text-anchor="middle" font-size="12" class="accent">① 標本化 ― 一定間隔で波の高さを測る</text>

        <!-- 量子化の値 -->
        <text x="60" y="278" font-size="12" class="muted">② 量子化(段に丸める)</text>
        <text x="240" y="278" font-size="13" class="mono">5 6 4 2 2 4 7 6 3 1</text>

        <text x="60" y="302" font-size="12" class="muted">③ 符号化(2進数に)</text>
        <text x="240" y="302" font-size="13" class="mono accent">101 110 100 010 …</text>

        <!-- 右の注記 -->
        <text x="650" y="100" font-size="12" class="muted">間隔を細かく</text>
        <text x="650" y="120" font-size="12" class="muted">= サンプリング周波数↑</text>
        <text x="650" y="152" font-size="12" class="muted">段を細かく</text>
        <text x="650" y="172" font-size="12" class="muted">= 量子化ビット数↑</text>
        <text x="650" y="206" font-size="12" class="accent" font-weight="600">原音に近づくが</text>
        <text x="650" y="226" font-size="12" class="accent" font-weight="600">データ量も増える</text>
      </svg>
    </div>
  </body>
</html>
