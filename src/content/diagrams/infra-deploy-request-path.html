<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 260"
        role="img"
        aria-label="利用者がドメインを入力してからページが届くまでの経路を示した図。まずDNSでドメイン名がIPアドレスに解決され、次にTLSのやり取りで通信路が暗号化され、そのうえで最寄りのCDNエッジに届く。エッジにキャッシュがあればそこで応答が返り、オリジンまでは届かない。無い場合だけオリジンのサーバーへ問い合わせが行き、その応答をエッジがキャッシュしてから返す。PaaSを使う場合、この3つの仕組みは既定で用意されるため、自分で意識するのはドメインの接続程度になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="80" width="120" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="80" y="102" font-size="11" text-anchor="middle">利用者</text>
        <text x="80" y="119" font-size="9.5" text-anchor="middle" class="muted">URLを入力</text>

        <rect x="180" y="80" width="130" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="245" y="102" font-size="11" text-anchor="middle">DNS</text>
        <text x="245" y="119" font-size="9.5" text-anchor="middle" class="muted">名前 → IPアドレス</text>

        <rect x="350" y="80" width="130" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="415" y="102" font-size="11" text-anchor="middle">TLS</text>
        <text x="415" y="119" font-size="9.5" text-anchor="middle" class="muted">証明書の確認と暗号化</text>

        <rect x="520" y="80" width="130" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="585" y="102" font-size="11" text-anchor="middle">CDNエッジ</text>
        <text x="585" y="119" font-size="9.5" text-anchor="middle" class="muted">最寄りの拠点</text>

        <rect x="600" y="182" width="140" height="52" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="670" y="204" font-size="11" text-anchor="middle">オリジン</text>
        <text x="670" y="221" font-size="9.5" text-anchor="middle" class="muted">自分のサーバー</text>

        <line x1="142" y1="106" x2="176" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="312" y1="106" x2="346" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="482" y1="106" x2="516" y2="106" stroke="var(--muted)" marker-end="url(#ar)" />
        <path d="M620,134 L620,182" fill="none" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="632" y="164" font-size="9.5" class="muted">キャッシュに無いときだけ</text>

        <path d="M550,134 C520,166 200,166 90,140" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="300" y="180" font-size="10" text-anchor="middle" class="accent">キャッシュがあれば、ここで返る(オリジンまで行かない)</text>

        <text x="20" y="42" font-size="11" class="muted">ドメインを入力してからページが届くまでに、3つの仕組みが順に働く</text>
        <text x="20" y="250" font-size="10" class="muted">PaaSではDNS・証明書・CDNが既定で用意される。自分で組む場合は、この3つを自分で選んで並べる。</text>
      </svg>
    </div>
  </body>
</html>
