<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="サーバーの3つの資源が枯渇するときの現れ方の違いを示した図。CPUは瞬間的に跳ね上がることがあり、それ自体は正常なこともあるため、高い状態がどれだけ続いたかで判断する。メモリは少しずつ右肩上がりに増えていく形が問題で、単発のピークよりも傾向そのものが漏れの兆候になる。ディスクは使い切る直前まで何の症状も出ず、いっぱいになった瞬間に書き込みが失敗してサービス全体が止まるため、余裕のある段階で早めに警告する。同じ資源監視でも、見るべき形が3つとも違う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="140" y="26" font-size="11.5" text-anchor="middle">CPU ― 跳ねる</text>
        <polyline points="30,150 60,145 90,60 120,148 150,150 180,70 210,152 240,148" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="24" y1="160" x2="246" y2="160" stroke="var(--border)" />
        <text x="140" y="186" font-size="9.5" text-anchor="middle" class="muted">一時的な高負荷は正常なこともある</text>
        <text x="140" y="206" font-size="10" text-anchor="middle" class="accent">「高い状態が5分続いたら」で判定する</text>

        <text x="380" y="26" font-size="11.5" text-anchor="middle">メモリ ― じわじわ増える</text>
        <polyline points="270,150 300,144 330,140 360,132 390,124 420,112 450,98 480,84" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="264" y1="160" x2="486" y2="160" stroke="var(--border)" />
        <text x="380" y="186" font-size="9.5" text-anchor="middle" class="muted">単発のピークより、右肩上がりの傾向が問題</text>
        <text x="380" y="206" font-size="10" text-anchor="middle" class="accent">解放し忘れ(リーク)の兆候として見る</text>

        <text x="620" y="26" font-size="11.5" text-anchor="middle">ディスク ― 直前まで無症状</text>
        <polyline points="510,150 545,142 580,132 615,120 650,106 685,90 720,50" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="504" y1="160" x2="726" y2="160" stroke="var(--border)" />
        <line x1="504" y1="46" x2="726" y2="46" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="726" y="40" font-size="9" text-anchor="end" class="accent">満杯</text>
        <text x="620" y="186" font-size="9.5" text-anchor="middle" class="muted">埋まるまで何も起きず、埋まった瞬間に全部止まる</text>
        <text x="620" y="206" font-size="10" text-anchor="middle" class="accent">余裕のあるうちに(80%等で)警告する</text>

        <rect x="24" y="230" width="702" height="52" rx="8" fill="none" stroke="var(--border)" />
        <text x="40" y="252" font-size="10.5" class="muted">同じ「資源の監視」でも、見るべき形は3つとも違う ― 継続時間で見るもの、傾きで見るもの、残量で見るもの。</text>
        <text x="40" y="272" font-size="10.5" class="muted">しきい値を1種類の考え方で揃えようとすると、必ずどれかで誤報か見逃しが出る。</text>
      </svg>
    </div>
  </body>
</html>
