<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="メッセージの受け取り方を2種類に分けた図。プル型では受け手が自分から取りに行き、処理を終えたことを通知して初めてメッセージが取り除かれる。受け手の速さに合わせて流量が決まるため、処理が重い場合でも押し潰されない。プッシュ型では、指定した受け口へメッセージが送りつけられ、受け手が成功の応答を返すと取り除かれる。受け口を用意するだけでよく手軽だが、送りつける速さは相手の処理能力を見てくれるとは限らない。処理が重いならプル型、軽くて即座に返せるならプッシュ型が向く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="350" height="170" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="195" y="72" font-size="11.5" text-anchor="middle">プル ― 受け手が取りに行く</text>
        <rect x="40" y="88" width="130" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="105" y="112" font-size="9.5" text-anchor="middle" class="muted">溜まっている</text>
        <line x1="176" y1="108" x2="216" y2="108" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="222" y="88" width="130" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="287" y="112" font-size="9.5" text-anchor="middle" class="muted">受け手</text>
        <text x="195" y="150" font-size="9.5" text-anchor="middle" class="muted">処理を終えたと伝えて、初めて取り除かれる</text>
        <text x="195" y="176" font-size="10" text-anchor="middle" class="accent">受け手の速さで流量が決まる</text>
        <text x="195" y="198" font-size="9.5" text-anchor="middle" class="muted">処理が重くても押し潰されない</text>

        <rect x="390" y="46" width="350" height="170" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="565" y="72" font-size="11.5" text-anchor="middle">プッシュ ― 送りつけられる</text>
        <rect x="410" y="88" width="130" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="475" y="112" font-size="9.5" text-anchor="middle" class="muted">送る側</text>
        <line x1="546" y1="108" x2="586" y2="108" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="592" y="88" width="130" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="657" y="112" font-size="9.5" text-anchor="middle" class="muted">受け口(HTTP)</text>
        <text x="565" y="150" font-size="9.5" text-anchor="middle" class="muted">成功の応答を返すと取り除かれる</text>
        <text x="565" y="176" font-size="10" text-anchor="middle" class="accent">受け口を用意するだけで手軽</text>
        <text x="565" y="198" font-size="9.5" text-anchor="middle" class="muted">送る速さは、相手の都合を見てくれるとは限らない</text>

        <text x="20" y="252" font-size="10.5" class="muted">処理が重いならプル、軽くて即座に返せるならプッシュ ― 「誰が流量を決めるか」で選ぶ。</text>
        <text x="20" y="272" font-size="10.5" class="muted">どちらでも、二度届くことはある。処理は二度来ても壊れない形にしておく。</text>
      </svg>
    </div>
  </body>
</html>
