<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="ブラウザを扱うときに、計算と副作用を分ける構図を示した図。中央の点線の枠が純粋な計算の領域で、データを受け取って表示すべき内容を決める描画関数が置かれる。この領域は外の世界に触れないため、そのままテストできる。枠の外側には副作用の領域があり、左に入力側の副作用として、ユーザーのクリックや入力イベント、ストレージからの読み出し、通信での取得が並ぶ。右に出力側の副作用として、DOMへの書き込み、ストレージへの保存が並ぶ。矢印は左の入力から中央の計算を通って右の出力へ一方向に流れる。副作用は入口と出口の2か所にだけ置き、その間は純粋な計算だけにするのが方針。"
      >
        <defs>
          <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11.5" class="muted">入力側の副作用</text>
        <text x="320" y="26" text-anchor="middle" font-size="11.5" class="lbl">純粋な計算</text>
        <text x="624" y="26" text-anchor="end" font-size="11.5" class="muted">出力側の副作用</text>

        <rect x="16" y="40" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="60" text-anchor="middle" font-size="11.5" class="muted">クリック・入力</text>
        <text x="91" y="77" text-anchor="middle" font-size="10.5" class="muted">イベント</text>

        <rect x="16" y="100" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="120" text-anchor="middle" font-size="11.5" class="muted">localStorage</text>
        <text x="91" y="137" text-anchor="middle" font-size="10.5" class="muted">読み出し</text>

        <rect x="16" y="160" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="180" text-anchor="middle" font-size="11.5" class="muted">fetch</text>
        <text x="91" y="197" text-anchor="middle" font-size="10.5" class="muted">通信で取得</text>

        <line x1="166" y1="63" x2="216" y2="106" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arb)" />
        <line x1="166" y1="123" x2="216" y2="123" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arb)" />
        <line x1="166" y1="183" x2="216" y2="140" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arb)" />

        <rect x="222" y="70" width="196" height="106" rx="9" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-dasharray="6 4" />
        <rect x="242" y="94" width="156" height="58" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="118" text-anchor="middle" font-size="12">描画関数・変換関数</text>
        <text x="320" y="138" text-anchor="middle" font-size="10.5" class="muted">何を表示するかを決める</text>
        <text x="320" y="192" text-anchor="middle" font-size="10.5" class="lbl">外に触れないので、そのままテストできる</text>

        <line x1="418" y1="123" x2="468" y2="93" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arb)" />
        <line x1="418" y1="123" x2="468" y2="163" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arb)" />

        <rect x="474" y="70" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="549" y="90" text-anchor="middle" font-size="11.5" class="muted">DOM へ書き込む</text>
        <text x="549" y="107" text-anchor="middle" font-size="10.5" class="muted">textContent など</text>

        <rect x="474" y="140" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="549" y="160" text-anchor="middle" font-size="11.5" class="muted">localStorage</text>
        <text x="549" y="177" text-anchor="middle" font-size="10.5" class="muted">保存する</text>

        <line x1="16" y1="228" x2="624" y2="228" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="248" font-size="11" class="muted">副作用は入口と出口の2か所にだけ置き、その間は純粋な計算だけにする</text>
        <text x="16" y="266" font-size="11" class="lbl">この形は、後にReactが「状態 → 描画 → 反映」として言語化したものと同じ発想</text>
      </svg>
    </div>
  </body>
</html>
