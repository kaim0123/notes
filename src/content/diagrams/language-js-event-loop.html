<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="イベントループの仕組みを示した図。左上のコールスタックが同期コードを実行し、setTimeoutやfetchのような時間のかかる処理に出会うと、それを右上のWeb APIやタイマーに委譲してすぐ次の行へ進む。委譲された処理は裏で時間待ちをし、完了すると右下のキューに並ぶ。左下のイベントループは、コールスタックが空になったかどうかだけを見張っており、空になった瞬間にキューの先頭を取り出してコールスタックへ戻す。このためsetTimeoutに0ミリ秒を指定しても、その関数は今の同期コードをすべて終えたあとに実行される。またコールスタックが重い計算で埋まっている間はキューから何も取り出せないため、その間はクリックも画面更新も止まる。"
      >
        <defs>
          <marker id="arev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="26" y="40" width="200" height="72" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="126" y="66" text-anchor="middle" font-size="12.5" font-weight="600">コールスタック</text>
        <text x="126" y="86" text-anchor="middle" font-size="10.5" class="muted">同期コードを一気に実行</text>
        <text x="126" y="102" text-anchor="middle" font-size="10.5" class="muted">一度に1つのことだけ</text>

        <line x1="226" y1="66" x2="410" y2="66" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arev)" />
        <text x="318" y="58" text-anchor="middle" font-size="10.5" class="muted">時間のかかる処理を委譲</text>

        <rect x="416" y="40" width="200" height="72" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="516" y="66" text-anchor="middle" font-size="12.5" font-weight="600">Web API / タイマー</text>
        <text x="516" y="86" text-anchor="middle" font-size="10.5" class="muted">setTimeout・fetch など</text>
        <text x="516" y="102" text-anchor="middle" font-size="10.5" class="muted">裏で待つ</text>

        <line x1="516" y1="112" x2="516" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arev)" />
        <text x="556" y="142" text-anchor="middle" font-size="10.5" class="muted">完了</text>

        <rect x="416" y="172" width="200" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="516" y="196" text-anchor="middle" font-size="12.5" font-weight="600">キュー</text>
        <text x="516" y="216" text-anchor="middle" font-size="10.5" class="muted">完了した処理が順番に並ぶ</text>
        <text x="516" y="232" text-anchor="middle" font-size="10.5" class="muted">まだ実行はされない</text>

        <line x1="416" y1="205" x2="232" y2="205" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arev)" />
        <text x="324" y="197" text-anchor="middle" font-size="10.5" class="muted">先頭から1つ取り出す</text>

        <rect x="26" y="172" width="200" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="126" y="196" text-anchor="middle" font-size="12.5" font-weight="600">イベントループ</text>
        <text x="126" y="216" text-anchor="middle" font-size="10.5" class="lbl">スタックが空か、だけを見張る</text>
        <text x="126" y="232" text-anchor="middle" font-size="10.5" class="muted">空なら次を渡す</text>

        <line x1="126" y1="172" x2="126" y2="118" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arev)" />
        <text x="166" y="148" text-anchor="middle" font-size="10.5" class="muted">戻す</text>

        <line x1="16" y1="258" x2="624" y2="258" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="278" font-size="11" class="muted">setTimeout(fn, 0) が「今すぐ」でないのはこのため ― 同期コードが終わるまでキューは開かれない</text>
        <text x="16" y="294" font-size="11" class="lbl">重い計算でスタックが埋まっている間は、クリックも画面更新も止まる</text>
      </svg>
    </div>
  </body>
</html>
