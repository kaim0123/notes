<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="Cloudflareが利用者とオリジンサーバーの間に立つ位置を示した図。世界中の拠点に置かれたエッジが、DNSの応答、TLSの終端、CDNのキャッシュ配信、WAFとDDoS防御をまとめて引き受ける。届いたリクエストのうち、攻撃と判定されたものはここで遮断され、キャッシュにあるものはここで応答が返り、残ったものだけがオリジンサーバーへ渡る。オリジンに届く量そのものを減らすのが、この位置に立つことの意味になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="76" width="110" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="101" font-size="11" text-anchor="middle">利用者</text>
        <rect x="20" y="128" width="110" height="40" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="153" font-size="11" text-anchor="middle">利用者</text>
        <rect x="20" y="180" width="110" height="40" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="75" y="199" font-size="10.5" text-anchor="middle">攻撃</text>
        <text x="75" y="214" font-size="9" text-anchor="middle" class="muted">大量のリクエスト</text>

        <line x1="132" y1="96" x2="196" y2="120" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="132" y1="148" x2="196" y2="148" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="132" y1="200" x2="196" y2="176" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="200" y="56" width="260" height="188" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="330" y="80" font-size="12" text-anchor="middle">Cloudflareのエッジ(世界中の拠点)</text>
        <rect x="216" y="94" width="228" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="330" y="114" font-size="10.5" text-anchor="middle" class="muted">DNS ― 名前を解決する</text>
        <rect x="216" y="130" width="228" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="330" y="150" font-size="10.5" text-anchor="middle" class="muted">TLS ― ここで暗号化を終端する</text>
        <rect x="216" y="166" width="228" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="330" y="186" font-size="10.5" text-anchor="middle" class="muted">CDN ― キャッシュから返す</text>
        <rect x="216" y="202" width="228" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="330" y="222" font-size="10.5" text-anchor="middle" class="muted">WAF・DDoS防御 ― ここで遮断する</text>

        <path d="M200,214 L170,236 L120,236" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="118" y="256" font-size="10" text-anchor="end" class="accent">遮断</text>
        <path d="M200,182 C170,262 140,266 90,250" fill="none" stroke="var(--border)" />
        <text x="180" y="284" font-size="10" text-anchor="middle" class="muted">キャッシュにあれば、ここで応答が返る</text>

        <line x1="462" y1="150" x2="546" y2="150" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="504" y="140" font-size="10" text-anchor="middle" class="accent">残りだけ</text>

        <rect x="550" y="112" width="180" height="76" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="640" y="140" font-size="11.5" text-anchor="middle">オリジンサーバー</text>
        <text x="640" y="160" font-size="9.5" text-anchor="middle" class="muted">自分のアプリとデータ</text>
        <text x="640" y="177" font-size="9.5" text-anchor="middle" class="muted">届く量そのものが減る</text>
      </svg>
    </div>
  </body>
</html>
