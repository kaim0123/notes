<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="負荷のかけ方が異なる4種類の性能テストを、時間に対する負荷の形として並べた図。1つ目の負荷テストは、負荷を想定される最大まで上げてそのまま保つ形で、その負荷で目標の応答時間を満たすかを知るために行う。2つ目のストレステストは、負荷を限界を超えるまで上げ続ける形で、どこで壊れ、どう壊れ、回復するかを知るために行う。壊れる地点にはバツ印が付いている。3つ目の耐久テストは、中程度の負荷を長時間かけ続ける形で、メモリの漏れや接続の枯渇やログの肥大を見つけるために行う。4つ目のスパイクテストは、低い負荷から急激に立ち上げてしばらく保ち、また急に戻す形で、自動的な増設が間に合うか、キャッシュが効くかを知るために行う。最初にやる価値が高いのはストレステストで、毎秒何件までさばけるかを知らないままでは、必要な台数もレート制限の値もアラートの閾値も決められない。"
      >
        <text x="16" y="26" font-size="11" class="muted">負荷のかけ方が違えば、分かることも違う</text>

        <text x="26" y="46" font-size="10">負荷テスト</text>
        <rect x="16" y="54" width="158" height="86" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <polyline points="26,130 66,80 164,80" fill="none" stroke="var(--muted)" stroke-width="1.6" />
        <text x="26" y="160" font-size="9" class="accent">知りたいこと</text>
        <text x="26" y="176" font-size="9" class="muted">想定の最大負荷で</text>
        <text x="26" y="192" font-size="9" class="muted">目標の応答時間を</text>
        <text x="26" y="208" font-size="9" class="muted">満たすか</text>

        <text x="196" y="46" font-size="10" class="accent">ストレステスト</text>
        <rect x="186" y="54" width="158" height="86" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <polyline points="196,130 334,64" fill="none" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="300" y1="72" x2="312" y2="84" stroke="var(--primary)" stroke-width="1.8" />
        <line x1="312" y1="72" x2="300" y2="84" stroke="var(--primary)" stroke-width="1.8" />
        <text x="196" y="160" font-size="9" class="accent">知りたいこと</text>
        <text x="196" y="176" font-size="9" class="muted">どこで壊れ、どう</text>
        <text x="196" y="192" font-size="9" class="muted">壊れるか。そして</text>
        <text x="196" y="208" font-size="9" class="muted">回復するか</text>

        <text x="366" y="46" font-size="10">耐久テスト</text>
        <rect x="356" y="54" width="158" height="86" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <polyline points="366,130 381,96 504,96" fill="none" stroke="var(--muted)" stroke-width="1.6" />
        <text x="366" y="160" font-size="9" class="accent">知りたいこと</text>
        <text x="366" y="176" font-size="9" class="muted">メモリの漏れ、</text>
        <text x="366" y="192" font-size="9" class="muted">接続の枯渇、</text>
        <text x="366" y="208" font-size="9" class="muted">ログの肥大</text>

        <text x="536" y="46" font-size="10">スパイクテスト</text>
        <rect x="526" y="54" width="158" height="86" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <polyline points="536,126 581,126 581,70 631,70 631,126 674,126" fill="none" stroke="var(--muted)" stroke-width="1.6" />
        <text x="536" y="160" font-size="9" class="accent">知りたいこと</text>
        <text x="536" y="176" font-size="9" class="muted">自動増設が間に</text>
        <text x="536" y="192" font-size="9" class="muted">合うか。キャッシュ</text>
        <text x="536" y="208" font-size="9" class="muted">が効くか</text>

        <line x1="16" y1="234" x2="684" y2="234" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="254" font-size="10.5" class="accent">最初にやる価値が高いのはストレステスト ―「毎秒何件までさばけるか」が分かっていないと、</text>
        <text x="16" y="276" font-size="10.5" class="muted">必要な台数も、レート制限の値も、アラートの閾値も決められない。</text>
        <text x="16" y="294" font-size="9.5" class="muted">橋の設計で言えば、想定通行量で問題ないかが負荷テスト、何トンで崩れるかがストレステスト。</text>
      </svg>
    </div>
  </body>
</html>
