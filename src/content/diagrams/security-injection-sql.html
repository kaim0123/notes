<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="SQLインジェクションが成立する仕組みを、文字列連結とプレースホルダの2通りで比べた図。上は文字列を連結して組み立てた場合で、入力欄に書かれたクォートとORを含む文字列がSQL文の中にそのまま埋め込まれ、名前が空文字という条件に、常に真となる条件がORで足された文になってしまう。入力が値の枠を飛び出して条件そのものを書き換えており、結果として全ユーザーの行が一致し、パスワードを知らなくてもログインを通せる。下はプレースホルダを使った場合で、SQL文の構造は疑問符の形で先に確定してから値が別便で渡される。同じ文字列を送っても、その全体が名前という1つの値として扱われ、条件の形は変わらない。"
      >
        <text x="16" y="40" font-size="10.5" class="muted">① 文字列を連結して組み立てる</text>
        <text x="16" y="62" font-size="9" class="muted">入力欄に書かれた文字列</text>
        <rect x="200" y="46" width="150" height="24" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="275" y="63" font-size="10" text-anchor="middle" class="mono accent">' OR '1'='1</text>

        <rect x="16" y="84" width="728" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="32" y="109" font-size="12" class="mono">SELECT * FROM users WHERE name = '' OR '1'='1'</text>
        <line x1="222" y1="118" x2="382" y2="118" stroke="var(--primary)" stroke-width="2" />
        <text x="392" y="122" font-size="9" class="accent">← ここは入力そのもの。値の枠を出て、条件になっている</text>
        <text x="32" y="146" font-size="9.5" class="muted">名前が空文字、または 1=1(常に真)。全ユーザーの行が一致し、パスワードを知らなくても通る。</text>

        <line x1="16" y1="164" x2="744" y2="164" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

        <text x="16" y="192" font-size="10.5" class="accent">② プレースホルダで渡す</text>
        <rect x="16" y="204" width="470" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="32" y="229" font-size="12" class="mono">SELECT * FROM users WHERE name = ?</text>
        <text x="502" y="219" font-size="9.5" class="muted">値は別便で渡す</text>
        <rect x="502" y="226" width="180" height="24" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="592" y="243" font-size="10" text-anchor="middle" class="mono">' OR '1'='1</text>
        <text x="32" y="266" font-size="9.5" class="muted">文の形は「?」の時点で確定済み。同じ文字列を送っても、その全体が「名前」という1つの値のまま。</text>

        <line x1="16" y1="282" x2="744" y2="282" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="304" font-size="10.5" class="accent">危ない文字を探して消すのではなく、値が構文に混ざれない渡し方に変える ― これが唯一の根本対策。</text>
      </svg>
    </div>
  </body>
</html>
