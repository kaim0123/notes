<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 260" role="img" aria-label="ライブラリとフレームワークの違いを主導権の向きで示した図。左側のライブラリでは、上にあるあなたのコードが主導権を持ち、必要なタイミングで下にあるライブラリの関数を呼び出す。矢印は上から下へ向かう。右側のフレームワークでは上下が逆転し、上にあるフレームワークが主導権を持ち、下にあるあなたのコードを決められたタイミングで呼び出す。矢印は同じく上から下へ向かうが、呼ぶ側と呼ばれる側が入れ替わっている。この反転が制御の反転と呼ばれるもので、全体の流れを自分で組み立てる必要がなくなる代わりに、フレームワークが決めた型に沿うことになる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="160" y="34" text-anchor="middle" font-size="12">ライブラリ</text>
        <rect x="40" y="52" width="240" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="160" y="76" text-anchor="middle" font-size="11.5" class="lbl">あなたのコード</text>
        <text x="160" y="94" text-anchor="middle" font-size="10" class="muted">主導権を持つ</text>
        <line x1="160" y1="104" x2="160" y2="140" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <text x="172" y="126" font-size="10" class="muted">呼ぶ</text>
        <rect x="70" y="144" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="172" text-anchor="middle" font-size="11" class="muted">ライブラリの関数</text>

        <line x1="320" y1="30" x2="320" y2="230" stroke="var(--border)" stroke-width="1" />

        <text x="480" y="34" text-anchor="middle" font-size="12">フレームワーク</text>
        <rect x="360" y="52" width="240" height="52" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="480" y="76" text-anchor="middle" font-size="11.5" class="muted">フレームワーク</text>
        <text x="480" y="94" text-anchor="middle" font-size="10" class="muted">主導権を持つ</text>
        <line x1="480" y1="104" x2="480" y2="140" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arp)" />
        <text x="492" y="126" font-size="10" class="lbl">呼ぶ</text>
        <rect x="390" y="144" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="480" y="172" text-anchor="middle" font-size="11" class="lbl">あなたのコード</text>

        <text x="320" y="222" text-anchor="middle" font-size="10.5" class="muted">呼ぶ側と呼ばれる側が入れ替わる ― これが制御の反転</text>
        <text x="320" y="244" text-anchor="middle" font-size="10.5" class="lbl">ライブラリは合わなければ使うのをやめられる。フレームワークは作り直しになる</text>
      </svg>
    </div>
  </body>
</html>
