<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 250"
        role="img"
        aria-label="TypeScriptが実行されるまでの流れを示した図。左のTypeScriptファイル(型注釈つき)がtscやesbuildに渡され、そこで型チェックと型の削除が行われる。型が合わなければこの段階で失敗し、実行前に気づける。通過すると型情報を持たない通常のJavaScriptが出力され、ブラウザやNode.jsがそれを実行する。実行時に動いているのはJavaScriptだけで、TypeScriptの型は一切残らない。"
      >
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="180" y="12" width="214" height="44" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="287" y="31" text-anchor="middle" font-size="11.5" class="lbl">型が合わなければここで失敗</text>
        <text x="287" y="47" text-anchor="middle" font-size="10.5" class="muted">実行する前に間違いに気づける</text>
        <line x1="287" y1="88" x2="287" y2="60" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar2)" />

        <rect x="16" y="88" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="91" y="113" text-anchor="middle" font-size="12.5" font-weight="600">TypeScript(.ts)</text>
        <text x="91" y="132" text-anchor="middle" font-size="10.5" class="muted">型注釈つき</text>

        <line x1="166" y1="118" x2="176" y2="118" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar2)" />

        <rect x="180" y="88" width="214" height="60" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="287" y="110" text-anchor="middle" font-size="12.5" font-weight="600">tsc / esbuild</text>
        <text x="287" y="128" text-anchor="middle" font-size="10.5" class="muted">① 型をチェックする</text>
        <text x="287" y="142" text-anchor="middle" font-size="10.5" class="muted">② 型注釈を消す</text>

        <line x1="394" y1="118" x2="404" y2="118" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar2)" />

        <rect x="408" y="88" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="483" y="113" text-anchor="middle" font-size="12.5" font-weight="600">JavaScript(.js)</text>
        <text x="483" y="132" text-anchor="middle" font-size="10.5" class="muted">型の情報は残っていない</text>

        <line x1="483" y1="148" x2="483" y2="172" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar2)" />
        <rect x="396" y="176" width="174" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="483" y="202" text-anchor="middle" font-size="12">ブラウザ / Node.js が実行</text>

        <line x1="16" y1="234" x2="624" y2="234" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="248" font-size="11" class="muted">TypeScriptそのものは実行されない ― 実行時の型の扱いはJavaScriptと同じ動的型付けのまま</text>
      </svg>
    </div>
  </body>
</html>
