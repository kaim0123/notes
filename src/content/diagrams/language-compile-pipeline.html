<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="ソースコードが実行ファイルになるまでの工程を並べた図。前半のフロントエンドは、字句解析(文字の並びをトークンの列にする)、構文解析(トークン列を抽象構文木にする)、意味解析(名前解決と型検査を行う)の3工程。後半のバックエンドは、中間表現への変換と最適化、コード生成の2工程で、結果はファイルごとのオブジェクトファイルになる。最後にリンカが複数のオブジェクトファイルとライブラリを突き合わせ、参照先のアドレスを解決して1つの実行ファイルにまとめる。フロントエンドで出るのがコンパイルエラー、リンクの段階で出るのがリンクエラー。"
      >
        <defs>
          <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="40" width="286" height="146" rx="8" fill="none" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="26" y="34" font-size="11" class="lbl">フロントエンド(解析) ― ここで落ちるのがコンパイルエラー</text>

        <rect x="32" y="54" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="46" y="76" font-size="12">字句解析</text>
        <text x="286" y="76" text-anchor="end" font-size="10.5" class="muted">文字 → トークン列</text>
        <line x1="159" y1="88" x2="159" y2="98" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arc)" />
        <rect x="32" y="100" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="46" y="122" font-size="12">構文解析</text>
        <text x="286" y="122" text-anchor="end" font-size="10.5" class="muted">トークン列 → 構文木(AST)</text>
        <line x1="159" y1="134" x2="159" y2="144" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arc)" />
        <rect x="32" y="146" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="46" y="168" font-size="12">意味解析</text>
        <text x="286" y="168" text-anchor="end" font-size="10.5" class="muted">名前解決・型検査</text>

        <line x1="302" y1="113" x2="330" y2="113" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arc)" />

        <rect x="338" y="40" width="286" height="146" rx="8" fill="none" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="348" y="34" font-size="11" class="lbl">バックエンド(生成)</text>

        <rect x="354" y="54" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="368" y="76" font-size="12">中間表現・最適化</text>
        <text x="608" y="76" text-anchor="end" font-size="10.5" class="muted">意味を変えず速く</text>
        <line x1="481" y1="88" x2="481" y2="98" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arc)" />
        <rect x="354" y="100" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="368" y="122" font-size="12">コード生成</text>
        <text x="608" y="122" text-anchor="end" font-size="10.5" class="muted">機械語・バイトコード</text>
        <line x1="481" y1="134" x2="481" y2="144" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arc)" />
        <rect x="354" y="146" width="254" height="34" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="368" y="168" font-size="12">オブジェクトファイル</text>
        <text x="608" y="168" text-anchor="end" font-size="10.5" class="muted">ファイル単位・穴あき</text>

        <line x1="481" y1="186" x2="481" y2="206" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arc)" />
        <rect x="200" y="210" width="424" height="42" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="216" y="236" font-size="12.5" font-weight="600">リンク</text>
        <text x="608" y="228" text-anchor="end" font-size="10.5" class="muted">名前を突き合わせ、宛先未定の呼び出しを解決</text>
        <text x="608" y="244" text-anchor="end" font-size="10.5" class="lbl">ここで落ちるのがリンクエラー</text>

        <rect x="16" y="210" width="168" height="42" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="100" y="230" text-anchor="middle" font-size="11.5" class="muted">ライブラリ</text>
        <text x="100" y="245" text-anchor="middle" font-size="10.5" class="muted">(.a / .so / .dll)</text>
        <line x1="184" y1="231" x2="196" y2="231" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arc)" />

        <text x="16" y="282" font-size="11" class="muted">前半と後半が分かれているおかげで、「複数の言語 × 複数のCPU」を掛け算ではなく足し算で扱える(LLVMが成立する理由)</text>
      </svg>
    </div>
  </body>
</html>
