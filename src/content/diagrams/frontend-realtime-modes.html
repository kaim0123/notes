<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="3つの方式を接続の張り方で比べた図。上段のポーリングは、クライアントからサーバーへのリクエストとサーバーからの応答という往復が、数秒ごとに繰り返される。更新がなくても往復が発生するため空振りが多い。中段のSSEは、最初に1回リクエストを送ったあと、サーバーから複数のデータが順に流れてくる片方向の通り道になる。接続は閉じられず、切れてもブラウザが自動で繋ぎ直す。下段のWebSocketは、接続を張ったあとクライアントからもサーバーからも自由にメッセージが行き来する双方向の通り道になる。下に行くほど遅延は小さくなるが、運用の複雑さは増える。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="24" font-size="11" class="muted">クライアント</text>
        <text x="620" y="24" text-anchor="end" font-size="11" class="muted">サーバー</text>
        <line x1="104" y1="32" x2="104" y2="286" stroke="var(--border)" stroke-width="1" />
        <line x1="548" y1="32" x2="548" y2="286" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="62" font-size="12" class="lbl">ポーリング</text>
        <line x1="104" y1="54" x2="544" y2="54" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="548" y1="70" x2="108" y2="70" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="104" y1="88" x2="544" y2="88" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="548" y1="104" x2="108" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="326" y="122" text-anchor="middle" font-size="10.5" class="muted">数秒ごとに往復を繰り返す ― 更新が無くても飛ぶ(空振り)</text>

        <text x="20" y="168" font-size="12" class="lbl">SSE</text>
        <line x1="104" y1="160" x2="544" y2="160" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="326" y="152" text-anchor="middle" font-size="10" class="muted">最初の1回だけ</text>
        <line x1="548" y1="180" x2="108" y2="180" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <line x1="548" y1="196" x2="108" y2="196" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <line x1="548" y1="212" x2="108" y2="212" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <text x="326" y="230" text-anchor="middle" font-size="10.5" class="muted">応答を閉じずに流し続ける(片方向)― 切れても自動で繋ぎ直す</text>

        <text x="20" y="272" font-size="12" class="lbl">WebSocket</text>
        <line x1="104" y1="264" x2="544" y2="264" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <line x1="548" y1="280" x2="108" y2="280" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <text x="326" y="300" text-anchor="middle" font-size="10.5" class="muted">1本の接続で双方向 ― 速いが、認証も再接続も監視も自前になる</text>
      </svg>
    </div>
  </body>
</html>
