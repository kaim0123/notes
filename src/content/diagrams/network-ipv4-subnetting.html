<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 270"
        role="img"
        aria-label="サブネッティングの図解。192.168.1.0/24というホスト部8ビット・256個のアドレスを持つネットワークから、ホスト部の先頭2ビットを借りて/26にすると、64個ずつ4つのサブネットに分割できる。"
      >
        <rect x="280" y="20" width="200" height="60" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="45" text-anchor="middle" font-size="13" font-weight="700" class="mono">192.168.1.0/24</text>
        <text x="380" y="63" text-anchor="middle" font-size="10.5" class="muted">256個のアドレス(ホスト部8ビット)</text>

        <text x="380" y="105" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">
          ホスト部の先頭2ビットを借りて /26 に ― 2² = 4分割
        </text>

        <line x1="380" y1="115" x2="97" y2="150" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="380" y1="115" x2="277" y2="150" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="380" y1="115" x2="457" y2="150" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="380" y1="115" x2="637" y2="150" stroke="var(--muted)" stroke-width="1.2" />

        <rect x="25" y="150" width="170" height="75" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="110" y="172" text-anchor="middle" font-size="12" font-weight="700">サブネット1(.0/26)</text>
        <text x="110" y="192" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">.0 〜 .63</text>
        <text x="110" y="215" text-anchor="middle" font-size="10.5" class="muted">ネットワーク: .0</text>

        <rect x="205" y="150" width="170" height="75" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="290" y="172" text-anchor="middle" font-size="12" font-weight="700">サブネット2(.64/26)</text>
        <text x="290" y="192" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">.64 〜 .127</text>
        <text x="290" y="215" text-anchor="middle" font-size="10.5" class="muted">ネットワーク: .64</text>

        <rect x="385" y="150" width="170" height="75" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="470" y="172" text-anchor="middle" font-size="12" font-weight="700">サブネット3(.128/26)</text>
        <text x="470" y="192" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">.128 〜 .191</text>
        <text x="470" y="215" text-anchor="middle" font-size="10.5" class="muted">ネットワーク: .128</text>

        <rect x="565" y="150" width="170" height="75" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="650" y="172" text-anchor="middle" font-size="12" font-weight="700">サブネット4(.192/26)</text>
        <text x="650" y="192" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">.192 〜 .255</text>
        <text x="650" y="215" text-anchor="middle" font-size="10.5" class="muted">ネットワーク: .192</text>

        <text x="380" y="250" text-anchor="middle" font-size="11.5" class="muted">
          各サブネットとも先頭がネットワークアドレス、末尾がブロードキャストアドレスで使えない
        </text>
      </svg>
    </div>
  </body>
</html>
