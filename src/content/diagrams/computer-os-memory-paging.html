<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="ページングの対応関係。仮想アドレス空間のページ0・1・2のうち、ページ0と1は物理メモリのフレームAとBに載っており、ページ2は補助記憶へ退避されている。" viewBox="0 0 560 220">
      <text x="90" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">仮想アドレス空間</text>
      <rect x="40" y="35" width="100" height="30" fill="none" stroke="var(--primary)" stroke-width="1.3" />
      <text x="90" y="55" fill="var(--fg)" font-size="12" text-anchor="middle">ページ0</text>
      <rect x="40" y="70" width="100" height="30" fill="none" stroke="var(--primary)" stroke-width="1.3" />
      <text x="90" y="90" fill="var(--fg)" font-size="12" text-anchor="middle">ページ1</text>
      <rect x="40" y="105" width="100" height="30" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
      <text x="90" y="125" fill="var(--muted)" font-size="12" text-anchor="middle">ページ2</text>

      <text x="280" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">物理メモリ</text>
      <rect x="230" y="35" width="100" height="30" fill="none" stroke="var(--primary)" stroke-width="1.3" />
      <text x="280" y="55" fill="var(--fg)" font-size="12" text-anchor="middle">フレームA</text>
      <rect x="230" y="70" width="100" height="30" fill="none" stroke="var(--primary)" stroke-width="1.3" />
      <text x="280" y="90" fill="var(--fg)" font-size="12" text-anchor="middle">フレームB</text>

      <text x="470" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">補助記憶</text>
      <rect x="420" y="105" width="100" height="30" fill="none" stroke="var(--muted)" stroke-width="1.3" />
      <text x="470" y="125" fill="var(--muted)" font-size="12" text-anchor="middle">ページ2(退避)</text>

      <line x1="140" y1="50" x2="230" y2="50" stroke="var(--primary)" stroke-width="1" />
      <polygon points="230,50 222,45 222,55" fill="var(--primary)" />
      <line x1="140" y1="85" x2="230" y2="85" stroke="var(--primary)" stroke-width="1" />
      <polygon points="230,85 222,80 222,90" fill="var(--primary)" />
      <line x1="140" y1="120" x2="420" y2="120" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />
      <polygon points="420,120 412,115 412,125" fill="var(--muted)" />
      </svg>
    </div>
  </body>
</html>
