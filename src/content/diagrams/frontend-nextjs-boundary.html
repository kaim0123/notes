<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="use clientの境界がどこまで及ぶかを示した図。上段は境界を上に置いた場合で、ページ全体にuse clientを書くと、そこからimportされる子も孫もすべてブラウザ側になり、静的な表示部分まで送られてしまう。下段は境界を葉に近い位置に置いた場合で、実際に操作が要る検索欄だけがブラウザ側になり、ロゴや本文はサーバー側のまま残る。同じ画面でも境界の位置だけで、ブラウザへ送るコードの量が大きく変わる。境界は1ファイルの話ではなく、そこからimportされるもの全体に及ぶ。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="28" font-size="11.5" class="muted">境界を上に置くと</text>
        <rect x="20" y="40" width="280" height="106" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="36" y="62" font-size="10.5" class="lbl">"use client" ― page.tsx</text>
        <rect x="36" y="72" width="120" height="28" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.2" />
        <text x="48" y="91" font-size="10" class="lbl">Logo</text>
        <rect x="164" y="72" width="120" height="28" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.2" />
        <text x="176" y="91" font-size="10" class="lbl">Search</text>
        <rect x="36" y="106" width="248" height="28" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.2" />
        <text x="48" y="125" font-size="10" class="lbl">Article(静的な本文)</text>

        <text x="316" y="70" font-size="10.5" class="muted">import されるものすべてが</text>
        <text x="316" y="90" font-size="10.5" class="muted">ブラウザ側になる</text>
        <text x="316" y="120" font-size="10.5" class="lbl">→ 静的な本文まで送られる</text>

        <line x1="20" y1="168" x2="620" y2="168" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="196" font-size="11.5" class="lbl">境界を葉に近づけると</text>
        <rect x="20" y="208" width="280" height="106" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="230" font-size="10.5" class="muted">page.tsx(サーバー側のまま)</text>
        <rect x="36" y="240" width="120" height="28" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="48" y="259" font-size="10" class="muted">Logo</text>
        <rect x="164" y="240" width="120" height="28" rx="5" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="176" y="259" font-size="10" class="lbl">Search ← ここだけ</text>
        <rect x="36" y="274" width="248" height="28" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1.1" />
        <text x="48" y="293" font-size="10" class="muted">Article(静的な本文)</text>

        <text x="316" y="238" font-size="10.5" class="muted">操作が要る部分だけが</text>
        <text x="316" y="258" font-size="10.5" class="muted">ブラウザ側になる</text>
        <text x="316" y="288" font-size="10.5" class="lbl">→ 送る量が大きく減る</text>
      </svg>
    </div>
  </body>
</html>
