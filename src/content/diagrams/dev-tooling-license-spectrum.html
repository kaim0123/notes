<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="オープンソースライセンスを、自分の配布物にどこまで義務が及ぶかで並べたスペクトル図。左端は寛容型で、著作権表示さえ残せば自分のコードは公開しなくてよい。MITやApache 2.0がこれにあたる。中央は準コピーレフトで、改変したそのファイルは同じライセンスで公開する義務があるが、それを組み込んだ自分のコード全体には及ばない。MPLやLGPLがこれにあたる。右端は強いコピーレフトで、それを組み込んだ配布物全体を同じライセンスで公開する義務が生じる。GPLがこれにあたる。さらに右側の注記として、ネットワーク越しに提供する場合にも公開義務が及ぶAGPLがある。右へ行くほど義務が広がるため、商用製品に組み込む場合は左寄りを選ぶのが原則になる。ライセンスは間接依存にも及ぶため、直接依存だけを確認しても足りない。"
      >
        <defs>
          <marker id="arlic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="lbl">自分の配布物に、どこまで公開義務が及ぶか</text>

        <line x1="16" y1="48" x2="608" y2="48" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arlic)" />
        <text x="624" y="52" text-anchor="end" font-size="10.5" class="muted">義務が広い</text>

        <rect x="16" y="66" width="190" height="96" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="111" y="90" text-anchor="middle" font-size="12" font-weight="600">寛容型</text>
        <text x="111" y="112" text-anchor="middle" font-size="10.5" class="muted">著作権表示を残せばよい</text>
        <text x="111" y="130" text-anchor="middle" font-size="10.5" class="lbl">自分のコードは公開不要</text>
        <text x="111" y="150" text-anchor="middle" font-size="10.5" class="muted">MIT / Apache 2.0 / BSD</text>

        <rect x="222" y="66" width="190" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="317" y="90" text-anchor="middle" font-size="12" font-weight="600">準コピーレフト</text>
        <text x="317" y="112" text-anchor="middle" font-size="10.5" class="muted">改変したファイルだけ</text>
        <text x="317" y="130" text-anchor="middle" font-size="10.5" class="muted">同じ条件で公開する</text>
        <text x="317" y="150" text-anchor="middle" font-size="10.5" class="muted">MPL / LGPL</text>

        <rect x="428" y="66" width="196" height="96" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="526" y="90" text-anchor="middle" font-size="12" font-weight="600">強いコピーレフト</text>
        <text x="526" y="112" text-anchor="middle" font-size="10.5" class="muted">組み込んだ配布物全体を</text>
        <text x="526" y="130" text-anchor="middle" font-size="10.5" class="muted">同じ条件で公開する</text>
        <text x="526" y="150" text-anchor="middle" font-size="10.5" class="muted">GPL(AGPLは通信提供も対象)</text>

        <line x1="16" y1="186" x2="624" y2="186" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="210" font-size="11" class="muted">商用製品に組み込むなら、左寄りを選ぶのが原則</text>
        <text x="16" y="230" font-size="11" class="lbl">義務は間接依存にも及ぶ ― 直接依存だけ確認しても足りない</text>
        <text x="16" y="256" font-size="11" class="muted">判断に迷う組み合わせは、自己判断せず法務に確認する。あとから外すのは非常に高くつく</text>
      </svg>
    </div>
  </body>
</html>
