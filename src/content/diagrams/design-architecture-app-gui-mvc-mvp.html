<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 680 290" role="img" aria-label="MVCとMVPの違いを示した図。左のMVCでは、利用者の入力をControllerが受け、ControllerがModelを更新し、ModelがViewへ変更を通知する三角形の関係になる。右のMVPでは、Viewは入力をPresenterへ渡すだけの薄い層になり、PresenterがModelを更新し、結果をViewへ表示指示として返す。ViewとPresenterの間をインターフェースで区切るため、画面を描画せずにPresenterの単体テストが書ける。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="170" y="26" text-anchor="middle" font-size="12.5" font-weight="600">MVC</text>

        <rect x="120" y="44" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="175" y="69" text-anchor="middle" font-size="11">Controller</text>
        <rect x="40" y="150" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="95" y="175" text-anchor="middle" font-size="11">Model</text>
        <rect x="200" y="150" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="255" y="175" text-anchor="middle" font-size="11">View</text>

        <line x1="150" y1="82" x2="105" y2="144" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="152" y1="164" x2="194" y2="164" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="255" y1="144" x2="215" y2="86" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />

        <text x="60" y="118" font-size="9.5" class="muted">更新</text>
        <text x="173" y="158" font-size="9.5" class="muted">通知</text>
        <text x="252" y="118" font-size="9.5" class="muted">入力</text>

        <text x="175" y="222" text-anchor="middle" font-size="11" class="muted">Viewが自分でModelを見に行くため、</text>
        <text x="175" y="240" text-anchor="middle" font-size="11" class="muted">Viewを描かないとテストしにくい</text>

        <line x1="350" y1="30" x2="350" y2="270" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="26" text-anchor="middle" font-size="12.5" font-weight="600">MVP</text>

        <rect x="455" y="44" width="120" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.7" />
        <text x="515" y="69" text-anchor="middle" font-size="11" font-weight="600">Presenter</text>
        <rect x="380" y="150" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="435" y="175" text-anchor="middle" font-size="11">Model</text>
        <rect x="540" y="150" width="110" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="595" y="169" text-anchor="middle" font-size="11">View(薄い)</text>
        <text x="595" y="184" text-anchor="middle" font-size="8.5" class="muted">言われたとおり表示するだけ</text>

        <line x1="490" y1="82" x2="445" y2="144" stroke="var(--primary)" stroke-width="1.3" marker-start="url(#arrowHi)" marker-end="url(#arrowHi)" />
        <line x1="545" y1="82" x2="588" y2="144" stroke="var(--primary)" stroke-width="1.3" marker-start="url(#arrowHi)" marker-end="url(#arrowHi)" />

        <text x="510" y="222" text-anchor="middle" font-size="11" class="muted">ViewとPresenterの間をインターフェースで</text>
        <text x="510" y="240" text-anchor="middle" font-size="11" class="muted">区切るので、画面なしでテストできる</text>
      </svg>
    </div>
  </body>
</html>
