<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="テストに付けたタグが、実行時の割り当てを決める入力になっていることを示した図。左には6つのテストが並び、2つはメール受信コンテナを必要とするタグ、2つはプロキシを必要とするタグ、残る2つは何のタグも持たない。実行時にはタグごとにまとめて分配され、右の3つのワーカーに寄せられる。ワーカー1はメール受信コンテナを1回だけ起動して該当する2件を続けて走らせ、ワーカー2はプロキシを1回だけ起動して2件を走らせ、ワーカー3は追加のコンテナなしでタグなしの2件を走らせる。タグを見ずにばらばらに分配すると、同じコンテナを何度も起動し直すことになる。タグの付け忘れは、必要な資源のないワーカーで落ちるという形で初めて表に出る。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">タグは注釈ではなく、どのワーカーで走らせるかを決める入力</text>

        <rect x="16" y="36" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="54" font-size="8.5" class="mono muted">@capability:email</text>
        <rect x="16" y="72" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="90" font-size="8.5" class="mono muted">@capability:email</text>
        <rect x="16" y="108" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="126" font-size="8.5" class="mono muted">@capability:proxy</text>
        <rect x="16" y="144" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="162" font-size="8.5" class="mono muted">@capability:proxy</text>
        <rect x="16" y="180" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="198" font-size="8.5" class="muted">タグなし</text>
        <rect x="16" y="216" width="192" height="26" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="28" y="234" font-size="8.5" class="muted">タグなし</text>

        <line x1="216" y1="139" x2="264" y2="139" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="216" y="129" font-size="8.5" class="accent">同じタグを寄せる</text>

        <rect x="280" y="36" width="404" height="64" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="294" y="58" font-size="10" class="accent">ワーカー1</text>
        <text x="294" y="80" font-size="9" class="muted">メール受信コンテナを1回だけ起動 → 該当2件を続けて走らせる</text>

        <rect x="280" y="112" width="404" height="64" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="294" y="134" font-size="10" class="accent">ワーカー2</text>
        <text x="294" y="156" font-size="9" class="muted">プロキシを1回だけ起動 → 該当2件を続けて走らせる</text>

        <rect x="280" y="188" width="404" height="64" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="294" y="210" font-size="10">ワーカー3</text>
        <text x="294" y="232" font-size="9" class="muted">追加のコンテナなし → タグなしの2件をそのまま走らせる</text>

        <line x1="16" y1="268" x2="684" y2="268" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="288" font-size="10.5" class="muted">タグを見ずに分配すると、同じコンテナを何度も起動し直すことになる。付け忘れは、資源のないワーカーで落ちて初めて表に出る。</text>
      </svg>
    </div>
  </body>
</html>
