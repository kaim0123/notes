<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 312"
        role="img"
        aria-label="ファイアウォールとWAFが、同じ1つの通信のどこまでを見ているかを示した図。通信は左から順に、IPヘッダに送信元と宛先、TCPヘッダにポート番号、HTTPヘッダにメソッドとパス、そして本文という入れ子で構成されている。この図の本文には、SQLインジェクションを狙う文字列が入っている。上の括弧はファイアウォールが見る範囲で、IPヘッダとTCPヘッダまでしか届かない。下の括弧はWAFが開いて見る範囲で、HTTPヘッダと本文にあたる。ファイアウォールから見れば、正しいポート宛に届いた形の正しいHTTP通信でしかなく、本文の中身は判断材料に入らない。だから両方が要る。"
      >
        <line x1="40" y1="88" x2="300" y2="88" stroke="var(--border)" stroke-width="1.3" />
        <line x1="40" y1="82" x2="40" y2="94" stroke="var(--border)" stroke-width="1.3" />
        <line x1="300" y1="82" x2="300" y2="94" stroke="var(--border)" stroke-width="1.3" />
        <text x="170" y="74" font-size="10" text-anchor="middle" class="muted">ファイアウォールが見る範囲</text>

        <rect x="40" y="110" width="130" height="50" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="170" y="110" width="130" height="50" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="300" y="110" width="140" height="50" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="440" y="110" width="160" height="50" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />

        <text x="105" y="132" font-size="10.5" text-anchor="middle">IPヘッダ</text>
        <text x="235" y="132" font-size="10.5" text-anchor="middle">TCPヘッダ</text>
        <text x="370" y="132" font-size="10.5" text-anchor="middle">HTTPヘッダ</text>
        <text x="520" y="132" font-size="10.5" text-anchor="middle" class="accent">本文</text>
        <text x="105" y="150" font-size="8.5" text-anchor="middle" class="muted">送信元・宛先</text>
        <text x="235" y="150" font-size="8.5" text-anchor="middle" class="muted">ポート443</text>
        <text x="370" y="150" font-size="8.5" text-anchor="middle" class="muted">メソッド・パス</text>
        <text x="520" y="151" font-size="8.5" text-anchor="middle" class="mono">id=1' OR 1=1--</text>

        <line x1="300" y1="182" x2="600" y2="182" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="300" y1="176" x2="300" y2="188" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="600" y1="176" x2="600" y2="188" stroke="var(--primary)" stroke-width="1.3" />
        <text x="450" y="202" font-size="10" text-anchor="middle" class="accent">WAFが開いて見る範囲</text>

        <text x="320" y="234" font-size="9.5" text-anchor="middle" class="muted">FWから見れば、正しいポート宛に届いた、形の正しいHTTP通信でしかない</text>

        <line x1="16" y1="252" x2="624" y2="252" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="274" font-size="10.5" class="muted">「どちらが強いか」ではなく「どこまで開けるか」の違い。深く見るほど処理は重くなるので、手前ほど粗く速く弾く。</text>
        <text x="16" y="296" font-size="10.5" class="accent">WAFはアプリの穴を塞ぐものではなく、塞ぐまでの時間を稼ぐもの。恒久対策はアプリ側にしか置けない。</text>
      </svg>
    </div>
  </body>
</html>
