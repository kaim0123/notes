<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="手続き型プログラムの構造図。中央上に「グローバルなデータ」の箱があり、その下に集計する・出力する・検証するという3つの手続きが並ぶ。3つの手続きはいずれもグローバルなデータへ双方向の矢印でつながっており、どの手続きからもデータを読み書きできる。手続き自身はデータを所有しないため、規模が大きくなると「このデータを誰がいつ書き換えたのか」を追いにくくなることを示す。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">主役は「何をどの順番でやるか」。データは手続きの外側にある</text>

        <rect x="200" y="44" width="260" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="330" y="68" text-anchor="middle" font-size="12.5" font-weight="600">グローバルなデータ</text>
        <text x="330" y="86" text-anchor="middle" font-size="10.5" class="muted">売上テーブル・設定値・作業用の変数</text>

        <line x1="120" y1="180" x2="230" y2="102" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <line x1="330" y1="180" x2="330" y2="102" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <line x1="540" y1="180" x2="430" y2="102" stroke="var(--muted)" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />

        <rect x="40" y="184" width="160" height="52" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="120" y="208" text-anchor="middle" font-size="11.5">集計する()</text>
        <text x="120" y="226" text-anchor="middle" font-size="10.5" class="muted">手続き</text>

        <rect x="250" y="184" width="160" height="52" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="330" y="208" text-anchor="middle" font-size="11.5">出力する()</text>
        <text x="330" y="226" text-anchor="middle" font-size="10.5" class="muted">手続き</text>

        <rect x="460" y="184" width="160" height="52" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="540" y="208" text-anchor="middle" font-size="11.5">検証する()</text>
        <text x="540" y="226" text-anchor="middle" font-size="10.5" class="muted">手続き</text>

        <text x="330" y="272" text-anchor="middle" font-size="11" class="muted">どの手続きからも読み書きできるため、規模が大きくなると</text>
        <text x="330" y="290" text-anchor="middle" font-size="11" class="muted">「誰がいつ書き換えたか」を追えなくなる</text>
      </svg>
    </div>
  </body>
</html>
