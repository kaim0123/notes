<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="オーケストレーション駆動SOAの構成図。上段に営業システム・在庫システム・会計システムという3つの利用者が並び、中央のエンタープライズサービスバス(ESB)を介して、下段の顧客情報サービス・在庫確認サービスという共通サービスを呼び出す。共通サービスの仕様を1つ変えると、ESB経由でつながる全利用者へ影響が波及することが強調されている。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="24" text-anchor="middle" font-size="11.5" class="muted">共通サービスを1つ作って全社で再利用する</text>

        <rect x="30" y="42" width="180" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="120" y="68" text-anchor="middle" font-size="11">営業システム</text>
        <rect x="240" y="42" width="180" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="330" y="68" text-anchor="middle" font-size="11">在庫システム</text>
        <rect x="450" y="42" width="180" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="540" y="68" text-anchor="middle" font-size="11">会計システム</text>

        <line x1="120" y1="84" x2="120" y2="118" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="330" y1="84" x2="330" y2="118" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <line x1="540" y1="84" x2="540" y2="118" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />

        <rect x="30" y="122" width="600" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="330" y="151" text-anchor="middle" font-size="12" font-weight="600">エンタープライズサービスバス(ESB)</text>

        <line x1="200" y1="170" x2="200" y2="204" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />
        <line x1="460" y1="170" x2="460" y2="204" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arrowHi)" />

        <rect x="90" y="208" width="220" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="200" y="237" text-anchor="middle" font-size="11">顧客情報サービス(共通)</text>
        <rect x="350" y="208" width="220" height="48" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="460" y="237" text-anchor="middle" font-size="11">在庫確認サービス(共通)</text>

        <text x="330" y="288" text-anchor="middle" font-size="11" class="muted">
          共通化で重複は消えるが、共通サービスを1つ変えると全利用者へ影響が波及する
        </text>
      </svg>
    </div>
  </body>
</html>
