<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 310" role="img" aria-label="命令的な更新と宣言的な更新を比べた図。上段の命令的な方式では、状態が変わるたびにDOMをどう書き換えるかの手順を自分で書く必要があり、状態の組み合わせが増えるほど手順の分岐も増えていく。下段の宣言的な方式では、状態から見た目への対応を1本だけ書けばよい。状態が変わるとReactがコンポーネントの関数をもう一度実行して新しい完成形を作り、それを前回の結果と比べて、実際に変わった部分だけを本物のDOMへ反映する。全部を作り直しているように見えて、DOMの書き換えは最小限に抑えられている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="20" y="28" font-size="11.5" class="muted">命令的 ― 手順を書く</text>
        <rect x="20" y="40" width="110" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="75" y="68" text-anchor="middle" font-size="11">状態が変わる</text>
        <line x1="130" y1="63" x2="152" y2="63" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="156" y="34" width="300" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="172" y="56" font-size="10.5" class="muted">もし A なら要素を足す / B なら色を変える /</text>
        <text x="172" y="76" font-size="10.5" class="muted">A から B なら足してから色も変える …</text>
        <line x1="456" y1="63" x2="478" y2="63" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="482" y="40" width="138" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="551" y="68" text-anchor="middle" font-size="11">DOM を書き換える</text>
        <text x="20" y="112" font-size="10.5" class="muted">状態の組み合わせが増えるほど、手順の分岐が増えていく</text>

        <line x1="20" y1="132" x2="620" y2="132" stroke="var(--border)" stroke-width="1" />

        <text x="20" y="160" font-size="11.5" class="lbl">宣言的 ― 対応を1本書く</text>
        <rect x="20" y="172" width="110" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="75" y="200" text-anchor="middle" font-size="11">状態が変わる</text>
        <line x1="130" y1="195" x2="152" y2="195" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />

        <rect x="156" y="166" width="140" height="58" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="226" y="190" text-anchor="middle" font-size="11">関数を再実行</text>
        <text x="226" y="210" text-anchor="middle" font-size="10" class="muted">新しい完成形</text>

        <line x1="296" y1="195" x2="318" y2="195" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="322" y="166" width="150" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="397" y="190" text-anchor="middle" font-size="11">前回と比べる</text>
        <text x="397" y="210" text-anchor="middle" font-size="10" class="muted">差分検出</text>

        <line x1="472" y1="195" x2="494" y2="195" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <rect x="498" y="166" width="122" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="559" y="190" text-anchor="middle" font-size="11">変わった所だけ</text>
        <text x="559" y="210" text-anchor="middle" font-size="10" class="muted">DOM へ反映</text>

        <text x="20" y="252" font-size="10.5" class="muted">書くのは「この状態ならこの見た目」という対応だけ ― 手順は書かない</text>
        <text x="20" y="276" font-size="10.5" class="lbl">関数がもう一度実行される ― だから値を保つには state や ref が要る</text>
      </svg>
    </div>
  </body>
</html>
