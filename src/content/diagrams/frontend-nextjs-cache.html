<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 320" role="img" aria-label="キャッシュの宣言から再検証までの流れを示した図。左でデータ取得の関数にキャッシュの宣言を置き、寿命とラベルを添える。中央がキャッシュの保管庫で、ラベルごとに内容が保持される。右が更新処理で、変更を保存したあと3つの手段のいずれかで再検証する。1つ目は即座に入れ替える方法で、変更した本人がすぐに自分の変更を見られる。2つ目は古い内容を見せたまま裏で更新する方法で、多少の遅れが許せる場面に向く。3つ目はラベルを付けていない範囲をパスごとまとめて無効化する、粒度の粗い手段。どれを選ぶかは、誰にいつ見えてほしいかで決まる。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="40" width="180" height="112" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="36" y="64" font-size="11.5">取得する関数</text>
        <text x="36" y="88" font-size="10" class="lbl">"use cache"</text>
        <text x="36" y="108" font-size="10" class="muted">cacheLife(寿命)</text>
        <text x="36" y="128" font-size="10" class="muted">cacheTag(ラベル)</text>
        <text x="36" y="146" font-size="9.5" class="muted">宣言が無ければ毎回取り直す</text>

        <line x1="200" y1="96" x2="230" y2="96" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />

        <rect x="234" y="40" width="170" height="112" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="250" y="64" font-size="11.5">キャッシュの保管庫</text>
        <rect x="250" y="76" width="138" height="26" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="260" y="94" font-size="10" class="muted">"products" の内容</text>
        <rect x="250" y="110" width="138" height="26" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
        <text x="260" y="128" font-size="10" class="muted">"dashboard-stats"</text>

        <line x1="404" y1="96" x2="434" y2="96" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" />
        <rect x="438" y="40" width="182" height="112" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="454" y="64" font-size="11.5">更新処理</text>
        <text x="454" y="88" font-size="10" class="muted">"use server"</text>
        <text x="454" y="110" font-size="10" class="muted">保存してから</text>
        <text x="454" y="130" font-size="10" class="lbl">再検証を呼ぶ</text>

        <text x="20" y="188" font-size="11.5" class="muted">再検証の3つの手段 ― 誰にいつ見えてほしいかで選ぶ</text>

        <rect x="20" y="202" width="196" height="94" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="36" y="226" font-size="11" class="lbl">即座に入れ替える</text>
        <text x="36" y="250" font-size="10" class="muted">次に見たとき必ず新しい</text>
        <text x="36" y="270" font-size="10" class="muted">自分の変更を自分がすぐ見る</text>
        <text x="36" y="288" font-size="9.5" class="muted">更新処理の中でのみ使える</text>

        <rect x="224" y="202" width="196" height="94" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="240" y="226" font-size="11">古い内容を見せつつ更新</text>
        <text x="240" y="250" font-size="10" class="muted">しばらく古い内容が見える</text>
        <text x="240" y="270" font-size="10" class="muted">一覧や集計など</text>
        <text x="240" y="288" font-size="9.5" class="muted">多少の遅れが許せるもの</text>

        <rect x="428" y="202" width="192" height="94" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="444" y="226" font-size="11">パスごと無効化</text>
        <text x="444" y="250" font-size="10" class="muted">その範囲すべてが対象</text>
        <text x="444" y="270" font-size="10" class="muted">ラベルが無い・分からない</text>
        <text x="444" y="288" font-size="9.5" class="muted">粒度は粗い</text>
      </svg>
    </div>
  </body>
</html>
