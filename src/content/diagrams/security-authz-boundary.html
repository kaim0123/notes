<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="認可の判定をどちら側に置くべきかを、信頼境界の線で示した図。左側はブラウザで、利用者が自由に書き換えられる領域にあたる。ここに置けるのは、管理者向けボタンを表示するかどうかといった見た目の制御だけで、開発者ツールで表示を戻したり、ブラウザを使わずに直接APIを叩いたりすれば簡単に迂回できる。右側はサーバーで、ここが信頼できる唯一の領域になる。誰であるか、その行の持ち主か、その役割に許された操作かという判定はすべてこちら側に置き、リクエストが来るたびに実行する。ボタンを隠すことは親切であって、対策ではない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <line x1="380" y1="40" x2="380" y2="240" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="6 4" />
        <text x="380" y="32" font-size="10" text-anchor="middle" class="accent">信頼境界</text>

        <text x="190" y="60" font-size="10.5" text-anchor="middle" class="muted">ブラウザ側 ― 書き換えられる</text>
        <text x="570" y="60" font-size="10.5" text-anchor="middle" class="accent">サーバー側 ― 信用できる唯一の場所</text>

        <rect x="40" y="78" width="290" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="185" y="100" font-size="10" text-anchor="middle">管理者ボタンを表示しない</text>
        <text x="185" y="118" font-size="9" text-anchor="middle" class="muted">画面を分かりやすくするための工夫</text>

        <rect x="40" y="146" width="290" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="185" y="168" font-size="10" text-anchor="middle" class="mono">role=admin をhiddenで持つ</text>
        <text x="185" y="186" font-size="9" text-anchor="middle" class="muted">開発者ツールで書き換えられる</text>

        <rect x="430" y="78" width="300" height="122" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="580" y="102" font-size="10.5" text-anchor="middle" class="accent">リクエストごとに判定する</text>
        <text x="580" y="126" font-size="9.5" text-anchor="middle" class="muted">誰であるか(セッション・トークン)</text>
        <text x="580" y="148" font-size="9.5" text-anchor="middle" class="muted">その行の持ち主か(DB上の紐づけ)</text>
        <text x="580" y="170" font-size="9.5" text-anchor="middle" class="muted">その役割に許された操作か</text>
        <text x="580" y="192" font-size="9" text-anchor="middle" class="muted">根拠はすべてサーバー側のデータ</text>

        <line x1="40" y1="222" x2="330" y2="222" stroke="var(--primary)" stroke-width="1.2" />
        <line x1="330" y1="222" x2="426" y2="205" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="185" y="238" font-size="9" text-anchor="middle" class="accent">ブラウザを使わずにAPIを直接叩けば、左側は丸ごと迂回できる</text>

        <line x1="16" y1="258" x2="744" y2="258" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="280" font-size="10.5" class="accent">ボタンを隠すのは親切であって、対策ではない。判定が境界の左側にあるうちは、実装されていないのと同じ。</text>
      </svg>
    </div>
  </body>
</html>
