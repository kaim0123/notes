<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 620 360"
        role="img"
        aria-label="AD(アドミニストレーティブディスタンス)の一覧図解。直接接続が0、スタティックルートが1、OSPFが110、RIPが120で、数字が低いほど信頼度が高く優先して採用される。"
      >
        <defs>
          <marker id="arrowAD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L5,10 L10,0 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="310" y="24" text-anchor="middle" font-size="13" font-weight="700">
          AD(Administrative Distance) ― 数字が低いほど信頼される
        </text>

        <line x1="35" y1="45" x2="35" y2="300" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrowAD)" />
        <text x="18" y="60" font-size="10.5" style="fill: var(--primary)" transform="rotate(-90 18 60)">信頼度: 高</text>
        <text x="18" y="295" font-size="10.5" class="muted" transform="rotate(-90 18 295)">低</text>

        <rect x="55" y="45" width="540" height="46" rx="7" fill="var(--primary)" />
        <text x="90" y="74" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill: var(--primary-fg)">0</text>
        <text x="330" y="74" text-anchor="middle" font-size="13" font-weight="600" style="fill: var(--primary-fg)">直接接続(Directly Connected)</text>

        <rect x="55" y="100" width="540" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="90" y="129" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill: var(--primary)">1</text>
        <text x="330" y="129" text-anchor="middle" font-size="13" font-weight="600">スタティックルート</text>

        <rect x="55" y="155" width="540" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="184" text-anchor="middle" font-size="15" font-weight="700" class="mono">110</text>
        <text x="330" y="184" text-anchor="middle" font-size="13">OSPF(リンクステート型)</text>

        <rect x="55" y="210" width="540" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="239" text-anchor="middle" font-size="15" font-weight="700" class="mono">120</text>
        <text x="330" y="239" text-anchor="middle" font-size="13">RIP(ディスタンスベクタ型)</text>

        <rect x="55" y="265" width="540" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="90" y="294" text-anchor="middle" font-size="15" font-weight="700" class="mono muted">255</text>
        <text x="330" y="294" text-anchor="middle" font-size="13" class="muted">信頼できない(このルートは使わない)</text>

        <text x="310" y="335" text-anchor="middle" font-size="11.5" class="muted">
          同じ宛先に複数の情報源からルートが届いたら、ADが最も低いものだけが採用される
        </text>
      </svg>
    </div>
  </body>
</html>
