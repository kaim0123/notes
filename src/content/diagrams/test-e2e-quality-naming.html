<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="テストが失敗したときに表示されるログを2通り並べ、テスト名の書き方で読み取れる情報がどう変わるかを示した図。上は操作を書いた名前で、ユーザー2でワークフロー1を開くと表示される。何をしたかは分かるが、どの規則が壊れたのかはテストコードを開くまで分からない。下はルールを書いた名前で、共有された利用者は共有元のワークフローを編集できると表示される。壊れた規則がそのまま読めるため、仕様が1行、赤い状態で提示されていることになる。失敗したときに最初に目に入るのはテスト名だけなので、そこに操作の手順ではなく証明している規則を書く。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">失敗したとき、最初に目に入るのはテスト名だけ</text>

        <rect x="16" y="36" width="608" height="80" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="58" font-size="9" class="muted">操作を書いた名前</text>
        <text x="30" y="82" font-size="11" class="mono">✗  ユーザー2でワークフロー1を開く</text>
        <text x="30" y="104" font-size="9" class="muted">何をしたかは分かる。どの規則が壊れたのかは、コードを開くまで分からない。</text>

        <rect x="16" y="132" width="608" height="80" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="154" font-size="9" class="muted">ルールを書いた名前</text>
        <text x="30" y="178" font-size="11" class="mono accent">✗  共有された利用者は、共有元のワークフローを編集できる</text>
        <text x="30" y="200" font-size="9" class="muted">壊れた規則がそのまま読める。仕様が1行、赤い状態で提示されている。</text>

        <line x1="16" y1="236" x2="624" y2="236" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="256" font-size="10.5" class="muted">テスト名は、そのテストが証明している規則の名前。操作の手順は本文がすでに持っている。</text>
      </svg>
    </div>
  </body>
</html>
