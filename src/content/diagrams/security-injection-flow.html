<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="インジェクションが生まれる3つの段階と、それぞれに対応する防御を並べた図。上段は攻撃が通る道筋で、外から来た文字列を受け取る入力の段階、受け取った値をつないで命令を組み立てる段階、組み立てた結果を実行または表示する出力の段階と進む。下段はそれぞれに対応する防御で、入力には検証と正規化、組み立てにはパラメータ化と安全なAPI、出力にはエスケープが対応する。3つは互いの代わりにならず、重ねて初めて成立する。本命は組み立ての段階で、入力検証と出力エスケープは、値として渡せない場面を埋める役割になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="40" y="44" font-size="10" class="muted">攻撃が通る道</text>

        <rect x="40" y="58" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="290" y="58" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="540" y="58" width="180" height="62" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="130" y="84" font-size="11.5" text-anchor="middle">① 入力</text>
        <text x="380" y="84" font-size="11.5" text-anchor="middle">② 組み立て</text>
        <text x="630" y="84" font-size="11.5" text-anchor="middle">③ 出力</text>
        <text x="130" y="106" font-size="9" text-anchor="middle" class="muted">外から来た文字列を受け取る</text>
        <text x="380" y="106" font-size="9" text-anchor="middle" class="muted">値をつないで命令を作る</text>
        <text x="630" y="106" font-size="9" text-anchor="middle" class="muted">実行する・画面に出す</text>

        <line x1="224" y1="89" x2="286" y2="89" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="474" y1="89" x2="536" y2="89" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />

        <line x1="130" y1="122" x2="130" y2="158" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="380" y1="122" x2="380" y2="158" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <line x1="630" y1="122" x2="630" y2="158" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="40" y="162" width="180" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <rect x="290" y="162" width="180" height="58" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="540" y="162" width="180" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="130" y="186" font-size="11" text-anchor="middle">検証・正規化</text>
        <text x="380" y="186" font-size="11" text-anchor="middle" class="accent">パラメータ化</text>
        <text x="630" y="186" font-size="11" text-anchor="middle">エスケープ</text>
        <text x="130" y="206" font-size="9" text-anchor="middle" class="muted">想定外の形を弾く</text>
        <text x="380" y="206" font-size="9" text-anchor="middle" class="muted">値を命令から切り離す</text>
        <text x="630" y="206" font-size="9" text-anchor="middle" class="muted">出力先の記号を殺す</text>

        <text x="40" y="146" font-size="10" class="muted">それぞれに効く防御</text>

        <line x1="16" y1="240" x2="744" y2="240" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="262" font-size="10.5" class="muted">3つは互いの代わりにならない。入力検証をすり抜けた文字列でも、②で値として渡していれば命令にはならない。</text>
        <text x="16" y="284" font-size="10.5" class="accent">本命は②。①と③は、②が使えない場面 ― 列名や並び順、HTMLへの埋め込み ― を埋めるためにある。</text>
      </svg>
    </div>
  </body>
</html>
