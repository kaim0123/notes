<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="コンテナの隔離と制限を、namespacesとcgroupsの2つの役割に分けて示した図。上の2つのコンテナは、それぞれプロセス一覧・ネットワーク・ファイルシステムを自分専用のものとして見ており、これがnamespacesによる見える範囲の分離である。右側のCPUとメモリのゲージは、cgroupsが1つのコンテナに割り当てる使用量の上限で、片方が暴走してももう片方の取り分を奪えない。下段のカーネルは1つしかなく、両方のコンテナのシステムコールを同じカーネルが受けている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="24" font-size="12" class="accent">namespaces ― 見える範囲を分ける</text>
        <text x="680" y="24" font-size="12" text-anchor="end" class="accent">cgroups ― 使える量を区切る</text>

        <rect x="20" y="38" width="320" height="160" rx="8" fill="none" stroke="var(--border)" />
        <text x="36" y="60" font-size="12">コンテナA</text>
        <rect x="36" y="72" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="46" y="90" font-size="10.5" class="mono">PID 1 = 自分のプロセス</text>
        <rect x="36" y="104" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="46" y="122" font-size="10.5" class="mono">eth0 = 自分のIP</text>
        <rect x="36" y="136" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="46" y="154" font-size="10.5" class="mono">/ = 自分のファイル一覧</text>
        <text x="36" y="182" font-size="10" class="muted">隣のコンテナのプロセスは見えない</text>
        <rect x="232" y="72" width="92" height="18" rx="4" fill="none" stroke="var(--border)" />
        <rect x="232" y="72" width="28" height="18" rx="4" fill="var(--primary)" />
        <text x="232" y="106" font-size="10" class="muted">CPU 上限 30%</text>
        <rect x="232" y="122" width="92" height="18" rx="4" fill="none" stroke="var(--border)" />
        <rect x="232" y="122" width="46" height="18" rx="4" fill="var(--primary)" />
        <text x="232" y="156" font-size="10" class="muted">メモリ 上限 512MB</text>

        <rect x="360" y="38" width="320" height="160" rx="8" fill="none" stroke="var(--border)" />
        <text x="376" y="60" font-size="12">コンテナB</text>
        <rect x="376" y="72" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="386" y="90" font-size="10.5" class="mono">PID 1 = 自分のプロセス</text>
        <rect x="376" y="104" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="386" y="122" font-size="10.5" class="mono">eth0 = 自分のIP</text>
        <rect x="376" y="136" width="180" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="386" y="154" font-size="10.5" class="mono">/ = 自分のファイル一覧</text>
        <text x="376" y="182" font-size="10" class="muted">同じPID 1でも別のプロセス</text>
        <rect x="572" y="72" width="92" height="18" rx="4" fill="none" stroke="var(--border)" />
        <rect x="572" y="72" width="56" height="18" rx="4" fill="var(--primary)" />
        <text x="572" y="106" font-size="10" class="muted">CPU 上限 60%</text>
        <rect x="572" y="122" width="92" height="18" rx="4" fill="none" stroke="var(--border)" />
        <rect x="572" y="122" width="28" height="18" rx="4" fill="var(--primary)" />
        <text x="572" y="156" font-size="10" class="muted">メモリ 上限 256MB</text>

        <line x1="180" y1="198" x2="180" y2="232" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="198" x2="520" y2="232" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="196" y="220" font-size="10" class="muted">システムコール</text>
        <text x="536" y="220" font-size="10" class="muted">システムコール</text>

        <rect x="20" y="236" width="660" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="256" font-size="12" text-anchor="middle">ホストOSのカーネル ― 1つしかない</text>
        <text x="350" y="272" font-size="10" text-anchor="middle" class="muted">ここに穴があると、隔離を越えてホストまで届く</text>
      </svg>
    </div>
  </body>
</html>
