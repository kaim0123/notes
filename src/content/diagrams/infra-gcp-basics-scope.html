<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="リソースが属する範囲の広さを4段階で示した図。いちばん狭いのがゾーンで、仮想マシンや永続ディスクはここに属し、そのゾーンが落ちれば影響を受ける。次がリージョンで、複数のゾーンにまたがって動くものが属する。その上に2つのリージョンにまたがる範囲や、複数のリージョンにまたがる範囲があり、保存先の一部はここを選べる。いちばん広いのがどのリージョンにも属さない範囲で、権限の設定や名前解決の定義などが該当する。広いほど障害に強い一方で費用が増え、書き込みの反映も遅くなるため、必要な広さを選ぶ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="40" width="660" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="40" y="60" font-size="11">どこにも属さない ― 権限の設定、名前解決の定義</text>
        <text x="40" y="78" font-size="9" class="muted">1か所で決めれば全体に効く</text>

        <rect x="60" y="96" width="580" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="116" font-size="11">複数リージョンにまたがる ― 保存先の一部</text>
        <text x="80" y="134" font-size="9" class="muted">耐障害性は高いが、料金と反映の遅れが増える</text>

        <rect x="100" y="152" width="500" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="172" font-size="11">リージョン ― 複数ゾーンにまたがって動くもの</text>
        <text x="120" y="190" font-size="9" class="muted">ネットワークの区画、マネージドなデータベース</text>

        <rect x="140" y="208" width="420" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="160" y="228" font-size="11">ゾーン ― 仮想マシン、永続ディスク</text>
        <text x="160" y="246" font-size="9" class="muted">そのゾーンが落ちれば、単体では影響を受ける</text>

        <text x="20" y="284" font-size="10.5" class="muted">広いほど壊れにくく、狭いほど速くて安い ― 必要な広さだけを選ぶ。</text>
      </svg>
    </div>
  </body>
</html>
