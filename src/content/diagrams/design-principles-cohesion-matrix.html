<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 620 340" role="img" aria-label="凝集度と結合度で4つに分けた図。縦軸が凝集度の高低、横軸が結合度の低高。左上の高凝集・低結合が目指す形で、関係の深いものが集まり、モジュール間は細い線でつながる。右上の高凝集・高結合は、中身は整っているが依存が多すぎて一緒に変更が必要になる。左下の低凝集・低結合は、独立してはいるが1つの機能が複数モジュールに散らばる。右下の低凝集・高結合が最も悪く、どこを直すと何が壊れるか読めない。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="26" y="30" font-size="11" class="muted">凝集度 高</text>
        <text x="26" y="300" font-size="11" class="muted">凝集度 低</text>
        <text x="150" y="326" text-anchor="middle" font-size="11" class="muted">結合度 低</text>
        <text x="450" y="326" text-anchor="middle" font-size="11" class="muted">結合度 高</text>

        <rect x="30" y="44" width="270" height="120" rx="10" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="165" y="76" text-anchor="middle" font-size="12.5" font-weight="600">高凝集・低結合</text>
        <text x="165" y="102" text-anchor="middle" font-size="11">目指す形</text>
        <text x="165" y="126" text-anchor="middle" font-size="10.5" class="muted">関係の深いものが集まり、</text>
        <text x="165" y="144" text-anchor="middle" font-size="10.5" class="muted">モジュール間は細い線だけ</text>

        <rect x="316" y="44" width="270" height="120" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="451" y="76" text-anchor="middle" font-size="12.5" font-weight="600">高凝集・高結合</text>
        <text x="451" y="102" text-anchor="middle" font-size="11">中身は整っているが</text>
        <text x="451" y="126" text-anchor="middle" font-size="10.5" class="muted">依存が多く、常に一緒に</text>
        <text x="451" y="144" text-anchor="middle" font-size="10.5" class="muted">変更しないといけない</text>

        <rect x="30" y="176" width="270" height="120" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="165" y="208" text-anchor="middle" font-size="12.5" font-weight="600">低凝集・低結合</text>
        <text x="165" y="234" text-anchor="middle" font-size="11">独立してはいるが</text>
        <text x="165" y="258" text-anchor="middle" font-size="10.5" class="muted">1つの機能を直すのに</text>
        <text x="165" y="276" text-anchor="middle" font-size="10.5" class="muted">複数箇所を触ることになる</text>

        <rect x="316" y="176" width="270" height="120" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="451" y="208" text-anchor="middle" font-size="12.5" font-weight="600">低凝集・高結合</text>
        <text x="451" y="234" text-anchor="middle" font-size="11">最も避けたい形</text>
        <text x="451" y="258" text-anchor="middle" font-size="10.5" class="muted">どこを直すと何が壊れるか</text>
        <text x="451" y="276" text-anchor="middle" font-size="10.5" class="muted">読めない</text>
      </svg>
    </div>
  </body>
</html>
