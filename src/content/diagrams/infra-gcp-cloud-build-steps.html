<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="ビルドの手順が、コンテナを順に走らせる形で表されることを示した図。手順の各段はそれぞれ独立したコンテナとして実行され、指定したイメージの中でコマンドが動く。段と段の間では作業ディレクトリが共有されるため、前の段が作ったファイルを次の段が使える。この形の利点は、言語や道具ごとに必要な環境を段ごとに切り替えられることと、手元でも同じイメージを動かせば同じ結果が得られることにある。ビルド環境そのものが構成として書かれるため、暗黙の依存が入り込みにくい。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="70" width="150" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="95" y="94" font-size="10" text-anchor="middle">段 1</text>
        <text x="95" y="114" font-size="9" text-anchor="middle" class="muted">コンテナA の中で</text>
        <text x="95" y="130" font-size="9" text-anchor="middle" class="muted">依存を取得する</text>

        <line x1="176" y1="105" x2="206" y2="105" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="212" y="70" width="150" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="287" y="94" font-size="10" text-anchor="middle">段 2</text>
        <text x="287" y="114" font-size="9" text-anchor="middle" class="muted">コンテナB の中で</text>
        <text x="287" y="130" font-size="9" text-anchor="middle" class="muted">テストを走らせる</text>

        <line x1="368" y1="105" x2="398" y2="105" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="404" y="70" width="150" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="479" y="94" font-size="10" text-anchor="middle">段 3</text>
        <text x="479" y="114" font-size="9" text-anchor="middle" class="muted">コンテナC の中で</text>
        <text x="479" y="130" font-size="9" text-anchor="middle" class="muted">イメージを作る</text>

        <line x1="560" y1="105" x2="590" y2="105" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="596" y="80" width="84" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="638" y="110" font-size="10" text-anchor="middle">登録</text>

        <rect x="20" y="164" width="534" height="34" rx="6" fill="none" stroke="var(--primary)" stroke-dasharray="5 4" />
        <text x="287" y="186" font-size="10" text-anchor="middle" class="accent">作業ディレクトリは段をまたいで共有される ― 前の段の成果を次の段が使える</text>

        <text x="20" y="230" font-size="10.5" class="muted">段ごとに環境を切り替えられるので、言語や道具が混在する構成でも1本の手順で書ける。</text>
        <text x="20" y="252" font-size="10.5" class="muted">手元で同じイメージを動かせば同じ結果になる ― 暗黙の依存が入り込みにくい。</text>
      </svg>
    </div>
  </body>
</html>
