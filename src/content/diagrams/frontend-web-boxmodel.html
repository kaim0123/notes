<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="ボックスモデルの4層を入れ子の四角形で示した図。いちばん外側の破線の枠がmarginで外側の余白を表し、その内側の実線の枠がborderの枠線、さらに内側の破線の枠がpaddingの内側余白、中心の枠がcontentすなわち中身。右側には注記が2つあり、box-sizingがcontent-boxのときwidthはcontentだけの幅を指すため、paddingやborderを足すと見た目の幅が増えること、border-boxのときはborderまでを含んだ幅を指すため指定どおりの幅に収まることが示されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="24" width="360" height="252" rx="6" fill="none" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="34" y="44" font-size="11.5" class="muted">margin ― 外側の余白(隣との距離)</text>

        <rect x="52" y="60" width="296" height="184" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="66" y="80" font-size="11.5" class="lbl">border ― 枠線</text>

        <rect x="80" y="94" width="240" height="118" rx="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="94" y="114" font-size="11.5" class="muted">padding ― 内側の余白</text>

        <rect x="112" y="130" width="176" height="52" rx="4" fill="var(--card)" stroke="var(--fg)" stroke-width="1.3" />
        <text x="200" y="161" text-anchor="middle" font-size="12">content</text>

        <line x1="112" y1="266" x2="288" y2="266" stroke="var(--fg)" stroke-width="1.2" />
        <text x="200" y="290" text-anchor="middle" font-size="10.5" class="muted">content-box の width</text>

        <rect x="410" y="60" width="214" height="86" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="426" y="84" font-size="11.5">box-sizing: content-box</text>
        <text x="426" y="106" font-size="10.5" class="muted">width は content だけ。padding や</text>
        <text x="426" y="124" font-size="10.5" class="muted">border を足すと見た目の幅が増える</text>

        <rect x="410" y="162" width="214" height="86" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="426" y="186" font-size="11.5">box-sizing: border-box</text>
        <text x="426" y="208" font-size="10.5" class="muted">width は border まで含む。指定した</text>
        <text x="426" y="226" font-size="10.5" class="muted">幅どおりに収まる ― 現代の既定</text>
      </svg>
    </div>
  </body>
</html>
