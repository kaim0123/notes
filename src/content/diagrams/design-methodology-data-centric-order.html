<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 280" role="img" aria-label="データ中心設計とドメイン中心の設計手順を比べた図。左のデータ中心設計は、テーブル設計を最初に固め、その周りにCRUD処理を並べ、画面を最後に作る順序で進む。右のドメイン中心は、業務ルールを最初にモデル化し、次にそれを保存する方法を決め、テーブルは最後に決まる。前者はスキーマが唯一の情報源になるが業務ルールが各所に分散しやすく、後者は業務ルールが1箇所に集まる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">データ中心設計</text>

        <rect x="45" y="46" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="165" y="66" text-anchor="middle" font-size="11" font-weight="600">① テーブル設計</text>
        <text x="165" y="82" text-anchor="middle" font-size="9.5" class="muted">スキーマを最初に固定する</text>
        <line x1="165" y1="88" x2="165" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="45" y="108" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="128" text-anchor="middle" font-size="11">② CRUD処理</text>
        <text x="165" y="144" text-anchor="middle" font-size="9.5" class="muted">テーブルごとの読み書き</text>
        <line x1="165" y1="150" x2="165" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="45" y="170" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="196" text-anchor="middle" font-size="11">③ 画面</text>

        <text x="165" y="240" text-anchor="middle" font-size="11" class="muted">見通しは良いが、業務ルールが</text>
        <text x="165" y="258" text-anchor="middle" font-size="11" class="muted">各所のCRUDに薄く分散しやすい</text>

        <line x1="330" y1="30" x2="330" y2="250" stroke="var(--border)" stroke-width="1.2" />

        <text x="495" y="26" text-anchor="middle" font-size="12.5" font-weight="600">ドメイン中心</text>

        <rect x="375" y="46" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="495" y="66" text-anchor="middle" font-size="11" font-weight="600">① 業務ルールのモデル</text>
        <text x="495" y="82" text-anchor="middle" font-size="9.5" class="muted">何が正しい状態かを先に決める</text>
        <line x1="495" y1="88" x2="495" y2="104" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="375" y="108" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="495" y="128" text-anchor="middle" font-size="11">② 保存の仕方</text>
        <text x="495" y="144" text-anchor="middle" font-size="9.5" class="muted">リポジトリ越しに永続化する</text>
        <line x1="495" y1="150" x2="495" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="375" y="170" width="240" height="42" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="495" y="196" text-anchor="middle" font-size="11">③ テーブル</text>

        <text x="495" y="240" text-anchor="middle" font-size="11" class="muted">業務ルールが1箇所に集まるが、</text>
        <text x="495" y="258" text-anchor="middle" font-size="11" class="muted">単純なCRUDには重い</text>
      </svg>
    </div>
  </body>
</html>
