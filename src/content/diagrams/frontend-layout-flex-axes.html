<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 280" role="img" aria-label="Flexboxの2本の軸を示した図。左側はflex-directionがrowの場合で、点線のコンテナの中に3つの子要素が横に並び、横向きの矢印が主軸、縦向きの矢印が交差軸として示されている。主軸の詰め方はjustify-content、交差軸の揃え方はalign-itemsが決める。右側はflex-directionがcolumnの場合で、子要素は縦に並び、主軸が縦向き、交差軸が横向きに入れ替わっている。同じjustify-contentが、rowでは横の詰め方、columnでは縦の詰め方を意味するようになる。プロパティ名が上下左右ではなく軸で定義されているのはこのため。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="16" y="26" font-size="11.5">flex-direction: row</text>
        <rect x="46" y="44" width="252" height="96" rx="8" fill="none" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <rect x="64" y="62" width="60" height="60" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <rect x="142" y="62" width="60" height="60" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <rect x="220" y="62" width="60" height="60" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />

        <line x1="46" y1="166" x2="292" y2="166" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <text x="46" y="188" font-size="11" class="lbl">主軸 ― justify-content</text>
        <line x1="26" y1="44" x2="26" y2="134" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ar)" />
        <text x="16" y="212" font-size="11" class="muted">交差軸 ― align-items</text>

        <line x1="320" y1="20" x2="320" y2="260" stroke="var(--border)" stroke-width="1" />

        <text x="344" y="26" font-size="11.5">flex-direction: column</text>
        <rect x="374" y="44" width="130" height="170" rx="8" fill="none" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <rect x="392" y="58" width="94" height="42" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <rect x="392" y="110" width="94" height="42" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <rect x="392" y="162" width="94" height="42" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />

        <line x1="354" y1="44" x2="354" y2="208" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arp)" />
        <text x="520" y="112" font-size="11" class="lbl">主軸</text>
        <text x="520" y="132" font-size="11" class="lbl">justify-content</text>
        <line x1="374" y1="232" x2="500" y2="232" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ar)" />
        <text x="374" y="254" font-size="11" class="muted">交差軸 ― align-items</text>

        <text x="16" y="248" font-size="10.5" class="muted">軸で定義されているから、向きを変えても</text>
        <text x="16" y="266" font-size="10.5" class="muted">プロパティ名は変わらない</text>
      </svg>
    </div>
  </body>
</html>
