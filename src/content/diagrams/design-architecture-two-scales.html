<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 340"
        role="img"
        aria-label="アーキテクチャの2つの粒度を並べた図。左はシステムアーキテクチャで、注文・在庫・決済・通知の4つのサービスが線でつながれ、複数サービスをどう分割して連携させるかを表す。右はアプリケーションアーキテクチャで、左の注文サービス1つの中身を拡大したものとして、プレゼンテーション層・業務ロジック層・データアクセス層の3層が上から下への矢印で並ぶ。左右は破線で結ばれ、同じ「分けて疎に保つ」発想を粒度を変えて適用したものであることを示す。"
      >
        <defs>
          <marker
            id="arrowScales"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="165" y="24" text-anchor="middle" font-size="12.5" font-weight="600">システムアーキテクチャ</text>
        <text x="165" y="44" text-anchor="middle" font-size="11" class="muted">複数のサービス・プロセスをどう分けて繋ぐか</text>

        <line x1="155" y1="102" x2="175" y2="102" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="97" y1="124" x2="97" y2="150" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="232" y1="124" x2="232" y2="150" stroke="var(--muted)" stroke-width="1.3" />
        <line x1="155" y1="172" x2="175" y2="172" stroke="var(--muted)" stroke-width="1.3" />

        <rect x="40" y="80" width="115" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="97" y="107" text-anchor="middle" font-size="11.5" font-weight="600">注文サービス</text>
        <rect x="175" y="80" width="115" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="232" y="107" text-anchor="middle" font-size="11.5">在庫サービス</text>
        <rect x="40" y="150" width="115" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="97" y="177" text-anchor="middle" font-size="11.5">決済サービス</text>
        <rect x="175" y="150" width="115" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="232" y="177" text-anchor="middle" font-size="11.5">通知サービス</text>

        <text x="165" y="232" text-anchor="middle" font-size="11" class="muted">例: レイヤード / イベント駆動 /</text>
        <text x="165" y="250" text-anchor="middle" font-size="11" class="muted">マイクロサービス / モジュラーモノリス</text>

        <line x1="157" y1="84" x2="398" y2="66" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="4 4" />
        <line x1="157" y1="120" x2="398" y2="250" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="4 4" />
        <text x="290" y="150" text-anchor="middle" font-size="10.5" class="muted">1つの中身を拡大</text>

        <text x="540" y="24" text-anchor="middle" font-size="12.5" font-weight="600">アプリケーションアーキテクチャ</text>
        <text x="540" y="44" text-anchor="middle" font-size="11" class="muted">1つのアプリの内部をどう役割に分けるか</text>

        <rect x="410" y="66" width="260" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="540" y="93" text-anchor="middle" font-size="11.5">プレゼンテーション層(画面・API)</text>
        <line x1="540" y1="110" x2="540" y2="128" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowScales)" />
        <rect x="410" y="132" width="260" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="540" y="159" text-anchor="middle" font-size="11.5">業務ロジック層(ドメイン)</text>
        <line x1="540" y1="176" x2="540" y2="194" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrowScales)" />
        <rect x="410" y="198" width="260" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="540" y="225" text-anchor="middle" font-size="11.5">データアクセス層(永続化)</text>

        <text x="540" y="272" text-anchor="middle" font-size="11" class="muted">例: MVC / 3層 / Repository /</text>
        <text x="540" y="290" text-anchor="middle" font-size="11" class="muted">Clean Architecture / CQRS</text>

        <text x="350" y="328" text-anchor="middle" font-size="11" class="muted">
          「アーキテクチャ」という言葉は、この2つの粒度のどちらを指しているかで意味が変わる
        </text>
      </svg>
    </div>
  </body>
</html>
