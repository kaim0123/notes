<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 480"
        role="img"
        aria-label="STPのポート役割の図解。SW1がルートブリッジに選ばれ、両ポートとも指定ポート(DP)になる。SW2とSW3はそれぞれSW1へ直結するポートがルートポート(RP)になる。SW2とSW3を直結する冗長リンクでは、片方が指定ポート(DP)、もう片方がブロッキングポート(BLK)になりループを断ち切る。"
      >
        <rect x="270" y="30" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="700" style="fill: var(--primary)">SW1</text>
        <text x="320" y="68" text-anchor="middle" font-size="9.5" class="muted">ルートブリッジ</text>

        <rect x="60" y="280" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="310" text-anchor="middle" font-size="13" font-weight="600">SW2</text>

        <rect x="480" y="280" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="310" text-anchor="middle" font-size="13" font-weight="600">SW3</text>

        <line x1="295" y1="80" x2="135" y2="280" stroke="var(--fg)" stroke-width="1.6" />
        <rect x="270" y="90" width="34" height="20" rx="4" fill="var(--primary)" />
        <text x="287" y="104" text-anchor="middle" font-size="10" font-weight="700" style="fill: var(--primary-fg)">DP</text>
        <rect x="118" y="250" width="34" height="20" rx="4" fill="var(--primary)" />
        <text x="135" y="264" text-anchor="middle" font-size="10" font-weight="700" style="fill: var(--primary-fg)">RP</text>

        <line x1="345" y1="80" x2="505" y2="280" stroke="var(--fg)" stroke-width="1.6" />
        <rect x="336" y="90" width="34" height="20" rx="4" fill="var(--primary)" />
        <text x="353" y="104" text-anchor="middle" font-size="10" font-weight="700" style="fill: var(--primary-fg)">DP</text>
        <rect x="488" y="250" width="34" height="20" rx="4" fill="var(--primary)" />
        <text x="505" y="264" text-anchor="middle" font-size="10" font-weight="700" style="fill: var(--primary-fg)">RP</text>

        <line x1="160" y1="305" x2="480" y2="305" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" />
        <rect x="170" y="315" width="34" height="20" rx="4" fill="var(--primary)" />
        <text x="187" y="329" text-anchor="middle" font-size="10" font-weight="700" style="fill: var(--primary-fg)">DP</text>
        <rect x="436" y="315" width="42" height="20" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="3 2" />
        <text x="457" y="329" text-anchor="middle" font-size="9.5" class="muted">BLK</text>

        <text x="320" y="385" text-anchor="middle" font-size="11.5" class="muted">
          DP=指定ポート(転送する) / RP=ルートポート(ルートブリッジへの最短経路)
        </text>
        <text x="320" y="403" text-anchor="middle" font-size="11.5" class="muted">
          BLK=ブロッキングポート(データは転送しない。BPDUだけ受信してループを断ち切る)
        </text>
      </svg>
    </div>
  </body>
</html>
