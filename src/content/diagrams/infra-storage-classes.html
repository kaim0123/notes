<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="クラウドのオブジェクトストレージが持つ保存クラスの階層を示した図。上のクラスほど頻繁な読み出しを想定しており、保存料は高いが取り出しは速く追加料金も小さい。下に降りるほど保存料は安くなるが、取り出しに料金と時間がかかり、最低保存期間が設けられていて早く消すと違約金のような課金が生じる。したがって選ぶ基準は容量ではなく読み出しの頻度で、置きっぱなしの古いログや履歴は下のクラスへ自動で移す設定を入れておくと費用が下がる。逆に、実際にはよく読むデータを安いクラスに置くと、取り出し料金でかえって高くつく。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="60" y="40" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="80" y="60" font-size="11.5">標準(よく読む)</text>
        <text x="80" y="78" font-size="9.5" class="muted">保存料は高い / 取り出しは即時・追加料金はほぼ無い</text>
        <text x="620" y="70" font-size="10" text-anchor="middle" class="muted">公開中の画像</text>

        <rect x="60" y="98" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="118" font-size="11.5">低頻度アクセス</text>
        <text x="80" y="136" font-size="9.5" class="muted">保存料は安い / 読み出すたびに取り出し料金がかかる</text>
        <text x="620" y="128" font-size="10" text-anchor="middle" class="muted">月次のバックアップ</text>

        <rect x="60" y="156" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="176" font-size="11.5">アーカイブ</text>
        <text x="80" y="194" font-size="9.5" class="muted">保存料は最安 / 取り出しに時間がかかり、最低保存期間がある</text>
        <text x="620" y="186" font-size="10" text-anchor="middle" class="muted">法令上の保管義務</text>

        <line x1="36" y1="46" x2="36" y2="200" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="26" y="124" font-size="10" text-anchor="middle" class="accent" transform="rotate(-90 26 124)">保存料が下がる →</text>

        <text x="60" y="238" font-size="10.5" class="muted">選ぶ基準は容量ではなく<tspan class="accent">読み出しの頻度</tspan>。置きっぱなしの古いデータは自動で下へ移す設定を入れる。</text>
        <text x="60" y="260" font-size="10.5" class="muted">逆に、よく読むものを安いクラスに置くと、取り出し料金でかえって高くつく。</text>
      </svg>
    </div>
  </body>
</html>
