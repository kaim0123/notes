<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="悲観ロックと楽観ロックを時間軸で比べた図。上段の悲観ロックでは、Aが対象の行を掴んだ瞬間からBは待たされる。Aが作業を終えてロックを解放して初めてBが動き出すため、Bの完了はAの作業時間ぶん遅れる。待ちは発生するが、やり直しは起きない。下段の楽観ロックでは、AもBもロックを取らずに同時に進む。先に書き込んだAは成功し、あとから書き込もうとしたBは、読んだときからバージョンが変わっているため更新できた行数が0になって失敗する。Bは読み直してからやり直す。待ちは発生しないが、競合したぶんだけやり直しが発生する。競合がまれなら楽観ロック、頻繁で衝突コストが高いなら悲観ロックを選ぶ。"
      >
        <defs>
          <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="12" class="lbl">悲観ロック ― 先に鍵をかけ、他を待たせる</text>

        <text x="16" y="58" font-size="11" class="muted">A</text>
        <rect x="46" y="38" width="200" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="146" y="58" text-anchor="middle" font-size="11" >行を掴んで作業 → 解放</text>

        <text x="16" y="96" font-size="11" class="muted">B</text>
        <rect x="46" y="76" width="200" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="146" y="96" text-anchor="middle" font-size="11" class="muted">待たされている</text>
        <rect x="252" y="76" width="180" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="342" y="96" text-anchor="middle" font-size="11" class="muted">ここでやっと作業</text>

        <text x="450" y="72" font-size="11" class="muted">待ちは発生するが</text>
        <text x="450" y="90" font-size="11" class="muted">やり直しは起きない</text>

        <line x1="16" y1="128" x2="624" y2="128" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="156" font-size="12" class="lbl">楽観ロック ― ぶつからない前提で進み、ぶつかったらやり直す</text>

        <text x="16" y="190" font-size="11" class="muted">A</text>
        <rect x="46" y="170" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="121" y="190" text-anchor="middle" font-size="11">読む → 書く(成功)</text>

        <text x="16" y="228" font-size="11" class="muted">B</text>
        <rect x="46" y="208" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="121" y="228" text-anchor="middle" font-size="11" class="muted">読む → 書く</text>
        <rect x="202" y="208" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" stroke-dasharray="4 3" />
        <text x="277" y="228" text-anchor="middle" font-size="11" class="lbl">version 不一致で失敗</text>
        <line x1="352" y1="223" x2="368" y2="223" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arl)" />
        <rect x="374" y="208" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="449" y="228" text-anchor="middle" font-size="11" class="muted">読み直してやり直す</text>

        <text x="16" y="270" font-size="11" class="muted">競合がまれなら楽観ロック(待ちゼロ)、頻繁で衝突コストが高いなら悲観ロック(やり直しゼロ)</text>
        <text x="16" y="288" font-size="11" class="lbl">人間が数分かけて編集する画面では、行を掴み続けられないので楽観ロック一択</text>
      </svg>
    </div>
  </body>
</html>
