<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 264"
        role="img"
        aria-label="サイバーキルチェーンの7段階を左から右へ並べた図。偵察で公開情報を集め、武器化で仕掛けを作り、配送でメールやWebを使って送り込み、攻撃で脆弱性を突き、インストールで居座り、遠隔操作で外部から指示を受け、目的実行で情報を持ち出したり暗号化したりする。最初の3段階、偵察・武器化・配送までで断てれば侵入される前に終わる。4段階目の攻撃から先は、被害をどこで止めるかという話に変わる。攻撃は一発の出来事ではなく段取りで進むため、どの段でも断つ機会がある。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <rect x="16" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="122" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="228" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="334" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="440" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="546" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="652" y="60" width="92" height="54" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />

        <text x="62" y="84" font-size="10.5" text-anchor="middle">偵察</text>
        <text x="168" y="84" font-size="10.5" text-anchor="middle">武器化</text>
        <text x="274" y="84" font-size="10.5" text-anchor="middle">配送</text>
        <text x="380" y="84" font-size="10.5" text-anchor="middle">攻撃</text>
        <text x="486" y="84" font-size="10.5" text-anchor="middle">インストール</text>
        <text x="592" y="84" font-size="10.5" text-anchor="middle">遠隔操作</text>
        <text x="698" y="84" font-size="10.5" text-anchor="middle">目的実行</text>

        <text x="62" y="103" font-size="8.5" text-anchor="middle" class="muted">公開情報を集める</text>
        <text x="168" y="103" font-size="8.5" text-anchor="middle" class="muted">仕掛けを作る</text>
        <text x="274" y="103" font-size="8.5" text-anchor="middle" class="muted">メール・Web</text>
        <text x="380" y="103" font-size="8.5" text-anchor="middle" class="muted">脆弱性を突く</text>
        <text x="486" y="103" font-size="8.5" text-anchor="middle" class="muted">居座る</text>
        <text x="592" y="103" font-size="8.5" text-anchor="middle" class="muted">指示を受ける</text>
        <text x="698" y="103" font-size="8.5" text-anchor="middle" class="muted">持ち出す・暗号化</text>

        <line x1="110" y1="87" x2="120" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="216" y1="87" x2="226" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="322" y1="87" x2="332" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="428" y1="87" x2="438" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="534" y1="87" x2="544" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="640" y1="87" x2="650" y2="87" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <line x1="16" y1="134" x2="320" y2="134" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="16" y1="128" x2="16" y2="140" stroke="var(--primary)" stroke-width="1.3" />
        <line x1="320" y1="128" x2="320" y2="140" stroke="var(--primary)" stroke-width="1.3" />
        <text x="168" y="154" font-size="10" text-anchor="middle" class="accent">ここまでで断てば、侵入される前に終わる</text>

        <line x1="334" y1="134" x2="744" y2="134" stroke="var(--border)" stroke-width="1.3" />
        <line x1="334" y1="128" x2="334" y2="140" stroke="var(--border)" stroke-width="1.3" />
        <line x1="744" y1="128" x2="744" y2="140" stroke="var(--border)" stroke-width="1.3" />
        <text x="539" y="154" font-size="10" text-anchor="middle" class="muted">ここから先は、被害をどこで止めるかの話</text>

        <line x1="16" y1="180" x2="744" y2="180" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="202" font-size="10.5" class="muted">攻撃は一発の出来事ではなく段取りで進む。どの段でも断てるが、右へ行くほど「防ぐ」から「被害を小さくする」へ性質が変わる。</text>
        <text x="16" y="224" font-size="10.5" class="accent">だから、侵入されてからログを見に行くのではなく、居座りと外向きの通信を先に見張る。</text>
      </svg>
    </div>
  </body>
</html>
