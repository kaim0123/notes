<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="公開後の運営で考えることを12のジャンルに分け、どこが本体を持つかで振り分けた図。左側の7つ ― パフォーマンス、データ管理、分析と改善、コンテンツ管理、コスト管理、保守、法令とコンプライアンス ― はこの見出しの配下で扱う。右側の5つは本体が別のセクションにあり、どこで動かすかとどう届けるかはデプロイと公開、正常に動いているかは監視と障害対応、安全に運用するはセキュリティ、不具合を防ぐはテストが持つ。運営とは新しい分野ではなく、既に学んだ分野を公開後の視点で束ね直したものになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="36" width="400" height="264" rx="10" fill="none" stroke="var(--primary)" />
        <text x="32" y="60" font-size="12" class="accent">この見出しの配下で扱う</text>
        <rect x="32" y="74" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="92" font-size="10.5" text-anchor="middle">パフォーマンス</text>
        <text x="120" y="107" font-size="9" text-anchor="middle" class="muted">速く表示する</text>
        <rect x="224" y="74" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="312" y="92" font-size="10.5" text-anchor="middle">データ管理</text>
        <text x="312" y="107" font-size="9" text-anchor="middle" class="muted">保存とバックアップ</text>
        <rect x="32" y="122" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="140" font-size="10.5" text-anchor="middle">分析・改善</text>
        <text x="120" y="155" font-size="9" text-anchor="middle" class="muted">利用状況を知る</text>
        <rect x="224" y="122" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="312" y="140" font-size="10.5" text-anchor="middle">コンテンツ管理</text>
        <text x="312" y="155" font-size="9" text-anchor="middle" class="muted">更新を回す</text>
        <rect x="32" y="170" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="120" y="188" font-size="10.5" text-anchor="middle">コスト管理</text>
        <text x="120" y="203" font-size="9" text-anchor="middle" class="muted">払い続ける額を見る</text>
        <rect x="224" y="170" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="312" y="188" font-size="10.5" text-anchor="middle">保守</text>
        <text x="312" y="203" font-size="9" text-anchor="middle" class="muted">劣化を先回りする</text>
        <rect x="32" y="218" width="368" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="216" y="236" font-size="10.5" text-anchor="middle">法令・コンプライアンス</text>
        <text x="216" y="251" font-size="9" text-anchor="middle" class="muted">プライバシーポリシー・Cookie同意・アクセシビリティ</text>
        <text x="32" y="284" font-size="10" class="muted">どれも「作り終えた後」に発生し、続く限り無くならない仕事。</text>

        <rect x="432" y="36" width="312" height="264" rx="10" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="448" y="60" font-size="12" class="muted">本体は別のセクションにある</text>
        <rect x="448" y="74" width="280" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="588" y="92" font-size="10.5" text-anchor="middle">どこで動かす / どう届ける</text>
        <text x="588" y="107" font-size="9" text-anchor="middle" class="muted">→ デプロイと公開</text>
        <rect x="448" y="122" width="280" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="588" y="140" font-size="10.5" text-anchor="middle">正常に動いているか</text>
        <text x="588" y="155" font-size="9" text-anchor="middle" class="muted">→ 監視と障害対応</text>
        <rect x="448" y="170" width="280" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="588" y="188" font-size="10.5" text-anchor="middle">安全に運用する</text>
        <text x="588" y="203" font-size="9" text-anchor="middle" class="muted">→ セキュリティ</text>
        <rect x="448" y="218" width="280" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="588" y="236" font-size="10.5" text-anchor="middle">不具合を防ぐ</text>
        <text x="588" y="251" font-size="9" text-anchor="middle" class="muted">→ テスト</text>
        <text x="448" y="284" font-size="10" class="muted">既習の分野を、公開後の視点で束ね直したもの。</text>
      </svg>
    </div>
  </body>
</html>
