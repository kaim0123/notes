<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="目標値と、そこから許される失敗の量を示した図。まず利用者への約束として達成したい水準を決める。たとえば正常に応答した割合を一定以上に保つといった形である。すると、その期間に許される失敗の量が自動的に決まり、これが残りの余裕にあたる。余裕が十分にあるうちは新しい変更を積極的に出してよく、減ってきたら安定を優先して変更の速度を落とす。使い切ったら、機能追加を止めて信頼性の回復に充てる。この考え方の利点は、速く出すことと安定させることの綱引きを、感情ではなく残量で判断できるようにすることにある。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="44" width="720" height="52" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="40" y="66" font-size="11">目標 ― 利用者への約束として、どの水準を保つか</text>
        <text x="40" y="86" font-size="9.5" class="muted">例: 一定期間のうち、正常に応答した割合を保つ</text>

        <text x="20" y="126" font-size="11" class="muted">許される失敗の量(残りの余裕)</text>
        <rect x="20" y="136" width="720" height="34" rx="6" fill="none" stroke="var(--border)" />
        <rect x="20" y="136" width="480" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="260" y="158" font-size="10" text-anchor="middle">まだ余裕がある</text>
        <text x="620" y="158" font-size="10" text-anchor="middle" class="muted">使った分</text>

        <rect x="20" y="192" width="230" height="76" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="216" font-size="10.5" text-anchor="middle">余裕が十分</text>
        <text x="135" y="238" font-size="9.5" text-anchor="middle" class="muted">新しい変更を積極的に出す</text>
        <text x="135" y="256" font-size="9.5" text-anchor="middle" class="muted">実験もしてよい</text>

        <rect x="265" y="192" width="230" height="76" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="216" font-size="10.5" text-anchor="middle">減ってきた</text>
        <text x="380" y="238" font-size="9.5" text-anchor="middle" class="muted">変更の速度を落とす</text>
        <text x="380" y="256" font-size="9.5" text-anchor="middle" class="muted">確認を厚くする</text>

        <rect x="510" y="192" width="230" height="76" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="625" y="216" font-size="10.5" text-anchor="middle" class="accent">使い切った</text>
        <text x="625" y="238" font-size="9.5" text-anchor="middle" class="muted">機能追加を止める</text>
        <text x="625" y="256" font-size="9.5" text-anchor="middle" class="muted">信頼性の回復に充てる</text>

        <text x="20" y="292" font-size="10.5" class="muted">速く出すことと安定させることの綱引きを、感情ではなく残量で判断できるようにする仕組み。</text>
      </svg>
    </div>
  </body>
</html>
