<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 700 260" role="img" aria-label="パイプラインによる処理の流れの図。左の注文一覧から、キャンセルを除く(filter)、割引後の金額にする(map)、合計する(reduce)という3段の処理を順に通り、右の合計金額が出る。各段の下に、その時点でのデータの形(注文の配列、金額の配列、1つの数値)が添えられている。読む順と実行順が一致することを示す。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="350" y="26" text-anchor="middle" font-size="11.5" class="muted">小さな純粋関数をつなぎ、読む順と実行順を揃える</text>

        <rect x="20" y="70" width="110" height="50" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="75" y="100" text-anchor="middle" font-size="11.5">注文一覧</text>
        <line x1="134" y1="95" x2="156" y2="95" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />

        <rect x="160" y="70" width="140" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="230" y="92" text-anchor="middle" font-size="11.5">キャンセルを除く</text>
        <text x="230" y="110" text-anchor="middle" font-size="10" class="mono muted">filter</text>
        <line x1="304" y1="95" x2="326" y2="95" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />

        <rect x="330" y="70" width="140" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="400" y="92" text-anchor="middle" font-size="11.5">割引後の金額にする</text>
        <text x="400" y="110" text-anchor="middle" font-size="10" class="mono muted">map</text>
        <line x1="474" y1="95" x2="496" y2="95" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />

        <rect x="500" y="70" width="110" height="50" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="555" y="92" text-anchor="middle" font-size="11.5">合計する</text>
        <text x="555" y="110" text-anchor="middle" font-size="10" class="mono muted">reduce</text>
        <line x1="614" y1="95" x2="636" y2="95" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)" />

        <rect x="640" y="70" width="50" height="50" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="665" y="100" text-anchor="middle" font-size="11.5">合計</text>

        <text x="75" y="152" text-anchor="middle" font-size="10.5" class="muted">注文の配列</text>
        <text x="230" y="152" text-anchor="middle" font-size="10.5" class="muted">注文の配列(短い)</text>
        <text x="400" y="152" text-anchor="middle" font-size="10.5" class="muted">金額の配列</text>
        <text x="555" y="152" text-anchor="middle" font-size="10.5" class="muted">1つの数値</text>

        <text x="350" y="196" text-anchor="middle" font-size="11" class="muted">各段は前の段の出力だけを受け取る。途中で外の状態を見ないので、</text>
        <text x="350" y="214" text-anchor="middle" font-size="11" class="muted">段を入れ替えたり差し替えたりしても他の段は壊れない</text>
      </svg>
    </div>
  </body>
</html>
