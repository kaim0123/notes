<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 460"
        role="img"
        aria-label="DNS名前解決の図解。クライアントはDNSリゾルバに再帰的に問い合わせるだけで済み、リゾルバがルートサーバー、TLDサーバー、権威DNSサーバーへ順番に反復的に問い合わせて最終的なIPアドレスを見つけ、クライアントに返す。"
      >
        <defs>
          <marker
            id="arrowDns"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="20" y="190" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="80" y="220" text-anchor="middle" font-size="12.5">クライアント</text>

        <rect x="220" y="190" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="295" y="212" text-anchor="middle" font-size="12.5" font-weight="600" style="fill: var(--primary)">DNSリゾルバ</text>
        <text x="295" y="228" text-anchor="middle" font-size="10" class="muted">(再帰的に代行する)</text>

        <rect x="500" y="30" width="200" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="600" y="58" text-anchor="middle" font-size="12">ルートサーバー</text>

        <rect x="500" y="192" width="200" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="600" y="220" text-anchor="middle" font-size="12">.comのTLDサーバー</text>

        <rect x="500" y="354" width="200" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="600" y="382" text-anchor="middle" font-size="12">example.comの権威サーバー</text>

        <line x1="140" y1="208" x2="220" y2="208" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowDns)" />
        <text x="180" y="198" text-anchor="middle" font-size="9.5" style="fill: var(--primary)">①問合せ</text>
        <line x1="220" y1="228" x2="140" y2="228" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowDns)" />
        <text x="180" y="246" text-anchor="middle" font-size="9.5">⑤最終回答</text>

        <line x1="370" y1="200" x2="500" y2="65" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowDns)" />
        <text x="440" y="140" text-anchor="middle" font-size="9.5" class="muted">②反復問合せ</text>

        <line x1="370" y1="215" x2="500" y2="215" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowDns)" />
        <text x="435" y="205" text-anchor="middle" font-size="9.5" class="muted">③反復問合せ</text>

        <line x1="370" y1="230" x2="500" y2="365" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowDns)" />
        <text x="440" y="300" text-anchor="middle" font-size="9.5" class="muted">④反復問合せ</text>

        <text x="360" y="430" text-anchor="middle" font-size="11.5" class="muted">
          クライアントは1回尋ねるだけでよく、階層をたどる反復問い合わせはリゾルバが代行する
        </text>
      </svg>
    </div>
  </body>
</html>
