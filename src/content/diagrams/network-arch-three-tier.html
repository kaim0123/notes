<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 440"
        role="img"
        aria-label="3層LAN設計モデルの図解。最上位のコア層は2台の高速スイッチが冗長にバックボーンを構成し、中間のディストリビューション層は各コアスイッチへ二重に接続してポリシーを適用し、最下位のアクセス層は各スイッチが両方のディストリビューションスイッチへ二重に接続して端末を収容する。"
      >
        <text x="30" y="30" font-size="12" font-weight="700" style="fill: var(--primary)">コア層</text>
        <text x="100" y="30" font-size="10.5" class="muted">高速なバックボーン、冗長化を最優先</text>
        <rect x="215" y="40" width="130" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="280" y="70" text-anchor="middle" font-size="12.5" font-weight="600">コアSW-A</text>
        <rect x="415" y="40" width="130" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="480" y="70" text-anchor="middle" font-size="12.5" font-weight="600">コアSW-B</text>

        <line x1="280" y1="90" x2="280" y2="180" stroke="var(--fg)" stroke-width="1.3" />
        <line x1="280" y1="90" x2="480" y2="180" stroke="var(--fg)" stroke-width="1.3" />
        <line x1="480" y1="90" x2="280" y2="180" stroke="var(--fg)" stroke-width="1.3" />
        <line x1="480" y1="90" x2="480" y2="180" stroke="var(--fg)" stroke-width="1.3" />

        <text x="30" y="170" font-size="12" font-weight="700">ディストリビューション層</text>
        <text x="230" y="170" font-size="10.5" class="muted">集約・VLAN間ルーティング・ACL適用</text>
        <rect x="215" y="180" width="130" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="280" y="210" text-anchor="middle" font-size="12.5" font-weight="600">ディストA</text>
        <rect x="415" y="180" width="130" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="480" y="210" text-anchor="middle" font-size="12.5" font-weight="600">ディストB</text>

        <line x1="280" y1="230" x2="150" y2="320" stroke="var(--fg)" stroke-width="1.1" />
        <line x1="280" y1="230" x2="380" y2="320" stroke="var(--fg)" stroke-width="1.1" />
        <line x1="280" y1="230" x2="610" y2="320" stroke="var(--fg)" stroke-width="1.1" />
        <line x1="480" y1="230" x2="150" y2="320" stroke="var(--fg)" stroke-width="1.1" />
        <line x1="480" y1="230" x2="380" y2="320" stroke="var(--fg)" stroke-width="1.1" />
        <line x1="480" y1="230" x2="610" y2="320" stroke="var(--fg)" stroke-width="1.1" />

        <text x="30" y="310" font-size="12" font-weight="700">アクセス層</text>
        <text x="100" y="310" font-size="10.5" class="muted">末端の機器を収容する窓口</text>
        <rect x="95" y="320" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="150" y="345" text-anchor="middle" font-size="11.5">アクセスSW1</text>
        <rect x="325" y="320" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="345" text-anchor="middle" font-size="11.5">アクセスSW2</text>
        <rect x="555" y="320" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="610" y="345" text-anchor="middle" font-size="11.5">アクセスSW3</text>

        <text x="350" y="400" text-anchor="middle" font-size="11.5" class="muted">
          各層とも上位2台へ二重に接続することで、1台が故障しても迂回できる
        </text>
      </svg>
    </div>
  </body>
</html>
