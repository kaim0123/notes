<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 320"
        role="img"
        aria-label="同じGitへのpushから公開までを、PaaSに任せる場合と自分で部品を組む場合で並べた図。左のPaaSでは、ビルド・成果物の配置・CDN配信・証明書の発行までを事業者が一続きで代行するため、自分で決めるのはドメインの接続程度になる。右では、CIでビルドし、成果物をオブジェクトストレージやコンテナ基盤へ置き、その前にCDNを構え、DNSと証明書を用意する各段を自分で組む。工程の数は同じで、どこまでを自分の責任として持つかだけが違う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="190" y="24" font-size="12" text-anchor="middle" class="muted">PaaS(フルマネージド)</text>
        <text x="560" y="24" font-size="12" text-anchor="middle" class="muted">クラウドの部品を自分で組む</text>
        <line x1="380" y1="16" x2="380" y2="300" stroke="var(--border)" stroke-dasharray="4 3" />

        <rect x="70" y="44" width="240" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="190" y="66" font-size="11" text-anchor="middle">git push</text>
        <line x1="190" y1="80" x2="190" y2="100" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="40" y="104" width="300" height="140" rx="8" fill="none" stroke="var(--primary)" stroke-dasharray="5 4" />
        <text x="190" y="124" font-size="10.5" text-anchor="middle" class="accent">ここから先を事業者が代行する</text>
        <rect x="60" y="134" width="260" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="152" font-size="10.5" text-anchor="middle">ビルド</text>
        <rect x="60" y="166" width="260" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="184" font-size="10.5" text-anchor="middle">成果物の配置・CDN配信</text>
        <rect x="60" y="198" width="260" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="216" font-size="10.5" text-anchor="middle">TLS証明書の発行と更新</text>

        <line x1="190" y1="244" x2="190" y2="264" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="70" y="268" width="240" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="190" y="290" font-size="11" text-anchor="middle">公開(自分で決めるのはドメイン接続)</text>

        <rect x="440" y="44" width="240" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="560" y="66" font-size="11" text-anchor="middle">git push</text>
        <line x1="560" y1="80" x2="560" y2="100" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="440" y="104" width="240" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="560" y="122" font-size="10.5" text-anchor="middle">CIでビルド(自分で書く)</text>
        <line x1="560" y1="130" x2="560" y2="142" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="440" y="146" width="240" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="560" y="164" font-size="10.5" text-anchor="middle">成果物を置く(S3・コンテナ基盤)</text>
        <line x1="560" y1="172" x2="560" y2="184" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="440" y="188" width="240" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="560" y="206" font-size="10.5" text-anchor="middle">前段にCDNを構える</text>
        <line x1="560" y1="214" x2="560" y2="226" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="440" y="230" width="240" height="26" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="560" y="248" font-size="10.5" text-anchor="middle">DNSと証明書を用意する</text>
        <line x1="560" y1="256" x2="560" y2="264" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="440" y="268" width="240" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="560" y="290" font-size="11" text-anchor="middle">公開(各段が自分の責任)</text>
      </svg>
    </div>
  </body>
</html>
