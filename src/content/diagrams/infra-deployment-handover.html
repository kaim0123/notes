<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="システムを本番へ渡すときに、責任がどこで移るかを示した図。左側は開発側が責任を持つ区間で、作り、テストし、本番へ配置し、移行の準備をする。中央の受入れテストは発注側や利用部門が自らの視点で確認する工程で、要件どおりに使えるかを見る。ここを通過して検収に至ると、成果物の責任は運用側へ移る。右側は運用側の区間で、稼働の維持、問い合わせ対応、保守が続く。この境目を曖昧にしたまま稼働を始めると、不具合が出たときに誰が直すのかで揉めることになるため、何を満たせば受け取ったことになるかを事前に決めておく。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="250" height="90" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="145" y="86" font-size="11.5" text-anchor="middle">開発側が持つ区間</text>
        <text x="145" y="110" font-size="9.5" text-anchor="middle" class="muted">作る・テストする・本番へ配置する</text>
        <text x="145" y="128" font-size="9.5" text-anchor="middle" class="muted">データを移す・手順を用意する</text>

        <rect x="290" y="46" width="180" height="118" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="72" font-size="11.5" text-anchor="middle">受入れテスト</text>
        <text x="380" y="94" font-size="9.5" text-anchor="middle" class="muted">使う側の視点で確認する</text>
        <text x="380" y="112" font-size="9.5" text-anchor="middle" class="muted">要件どおりに業務が回るか</text>
        <text x="380" y="140" font-size="10.5" text-anchor="middle" class="accent">通れば検収</text>
        <text x="380" y="156" font-size="9.5" text-anchor="middle" class="muted">ここが責任の移り目</text>

        <rect x="490" y="60" width="250" height="90" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="615" y="86" font-size="11.5" text-anchor="middle">運用側が持つ区間</text>
        <text x="615" y="110" font-size="9.5" text-anchor="middle" class="muted">稼働を維持する・問い合わせに答える</text>
        <text x="615" y="128" font-size="9.5" text-anchor="middle" class="muted">保守を続ける</text>

        <line x1="274" y1="105" x2="286" y2="105" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="474" y1="105" x2="486" y2="105" stroke="var(--primary)" marker-end="url(#arp)" />

        <line x1="380" y1="168" x2="380" y2="196" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="380" y="216" font-size="10.5" text-anchor="middle" class="accent">この線をどこに引くかを、稼働前に文書で決めておく</text>
        <text x="380" y="240" font-size="10" text-anchor="middle" class="muted">曖昧なまま始めると、不具合が出たときに「誰が直すのか」で止まる</text>
        <text x="380" y="264" font-size="10" text-anchor="middle" class="muted">満たすべき条件を先に決めておけば、判定は事務作業で済む</text>
      </svg>
    </div>
  </body>
</html>
