<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 296"
        role="img"
        aria-label="ブルートフォース攻撃とリバースブルートフォース攻撃の違いを左右に並べた図。左は通常のブルートフォースや辞書攻撃で、user_aという1つのIDに向かって、123456・qwerty・p@ss1・adminといった複数のパスワードが次々に試される。同じIDに何度も失敗が記録されるため、アカウントロックが効く。右はリバースブルートフォースで、password123という1つのパスワードを、user_aからuser_eまで多数のIDに対して1回ずつ試す。IDごとの失敗は1回だけなので、失敗回数を数えるロックの条件には届かず、素通りしてしまう。ロックアウトはIDごとの失敗数を数える仕組みであり、攻撃者が軸を入れ替えるとその数え方は機能しなくなる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <line x1="320" y1="24" x2="320" y2="216" stroke="var(--border)" stroke-width="1" />

        <text x="164" y="36" font-size="11" text-anchor="middle" class="muted">ブルートフォース・辞書攻撃</text>
        <rect x="104" y="52" width="120" height="32" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="164" y="72" font-size="10" text-anchor="middle" class="mono">user_a</text>
        <line x1="52" y1="124" x2="150" y2="88" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="108" y1="124" x2="155" y2="88" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="164" y1="124" x2="164" y2="88" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="220" y1="124" x2="173" y2="88" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <line x1="276" y1="124" x2="178" y2="88" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#ar)" />
        <rect x="28" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="84" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="140" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="196" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="252" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="52" y="143" font-size="8.5" text-anchor="middle" class="mono muted">123456</text>
        <text x="108" y="143" font-size="8.5" text-anchor="middle" class="mono muted">qwerty</text>
        <text x="164" y="143" font-size="8.5" text-anchor="middle" class="mono muted">p@ss1</text>
        <text x="220" y="143" font-size="8.5" text-anchor="middle" class="mono muted">admin</text>
        <text x="276" y="143" font-size="8.5" text-anchor="middle" class="mono muted">letmein</text>
        <text x="164" y="180" font-size="10" text-anchor="middle" class="muted">同じIDに何度も失敗が積まれる</text>
        <text x="164" y="202" font-size="10.5" text-anchor="middle">アカウントロックが効く</text>

        <text x="476" y="36" font-size="11" text-anchor="middle" class="accent">リバースブルートフォース</text>
        <rect x="416" y="52" width="120" height="32" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="476" y="72" font-size="10" text-anchor="middle" class="mono">password123</text>
        <line x1="470" y1="88" x2="364" y2="122" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <line x1="473" y1="88" x2="420" y2="122" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <line x1="476" y1="88" x2="476" y2="122" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <line x1="479" y1="88" x2="532" y2="122" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <line x1="482" y1="88" x2="588" y2="122" stroke="var(--primary)" stroke-width="1.1" marker-end="url(#arp)" />
        <rect x="340" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="396" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="452" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="508" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <rect x="564" y="126" width="48" height="26" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="364" y="143" font-size="8.5" text-anchor="middle" class="mono muted">user_a</text>
        <text x="420" y="143" font-size="8.5" text-anchor="middle" class="mono muted">user_b</text>
        <text x="476" y="143" font-size="8.5" text-anchor="middle" class="mono muted">user_c</text>
        <text x="532" y="143" font-size="8.5" text-anchor="middle" class="mono muted">user_d</text>
        <text x="588" y="143" font-size="8.5" text-anchor="middle" class="mono muted">user_e</text>
        <text x="476" y="180" font-size="10" text-anchor="middle" class="muted">IDごとの失敗は1回だけ</text>
        <text x="476" y="202" font-size="10.5" text-anchor="middle" class="accent">ロックの条件に届かない</text>

        <line x1="16" y1="236" x2="624" y2="236" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="258" font-size="10.5" class="muted">アカウントロックは「1つのIDで何回失敗したか」を数える。攻撃者が軸を入れ替えれば、その条件に触れない。</text>
        <text x="16" y="280" font-size="10.5" class="accent">だから、IDごとの失敗回数だけでなく、送信元と単位時間あたりの失敗数も同時に数える。</text>
      </svg>
    </div>
  </body>
</html>
