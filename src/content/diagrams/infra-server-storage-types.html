<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="ブロック・ファイル・オブジェクトという3つのストレージの形を並べた比較図。左のブロックストレージはサーバー側がファイルシステムを持ち、ディスクのように直結して見える。中央のファイルストレージはNAS側がファイルシステムを持ち、NFSやSMBでファイル単位に読み書きする。右のオブジェクトストレージは階層を持たず、キーとメタデータでフラットに管理し、HTTPのAPIで丸ごと出し入れする。ファイルシステムがどちら側にあるかが、そのままアクセスの単位を決めている。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="40" width="232" height="196" rx="8" fill="none" stroke="var(--border)" />
        <text x="132" y="62" font-size="12" text-anchor="middle">ブロック(SAN・EBS)</text>
        <rect x="36" y="76" width="192" height="46" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="132" y="96" font-size="11" text-anchor="middle">サーバー</text>
        <text x="132" y="112" font-size="9.5" text-anchor="middle" class="accent">ファイルシステムはこちら</text>
        <line x1="132" y1="124" x2="132" y2="156" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="140" y="144" font-size="9.5" class="muted">iSCSI / 直結</text>
        <rect x="36" y="160" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="132" y="180" font-size="11" text-anchor="middle">生のブロックだけを渡す</text>
        <text x="132" y="196" font-size="9.5" text-anchor="middle" class="muted">固定サイズの区画</text>
        <text x="132" y="224" font-size="10" text-anchor="middle" class="muted">DBなど低遅延が要る用途</text>

        <rect x="264" y="40" width="232" height="196" rx="8" fill="none" stroke="var(--border)" />
        <text x="380" y="62" font-size="12" text-anchor="middle">ファイル(NAS)</text>
        <rect x="284" y="76" width="192" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="96" font-size="11" text-anchor="middle">クライアント</text>
        <text x="380" y="112" font-size="9.5" text-anchor="middle" class="muted">「ファイルを開く」で頼む</text>
        <line x1="380" y1="124" x2="380" y2="156" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="388" y="144" font-size="9.5" class="muted">NFS / SMB</text>
        <rect x="284" y="160" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="180" font-size="11" text-anchor="middle">NAS</text>
        <text x="380" y="196" font-size="9.5" text-anchor="middle" class="accent">ファイルシステムはこちら</text>
        <text x="380" y="224" font-size="10" text-anchor="middle" class="muted">複数人でのファイル共有</text>

        <rect x="512" y="40" width="232" height="196" rx="8" fill="none" stroke="var(--border)" />
        <text x="628" y="62" font-size="12" text-anchor="middle">オブジェクト(S3・R2)</text>
        <rect x="532" y="76" width="192" height="46" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="628" y="96" font-size="11" text-anchor="middle">アプリ</text>
        <text x="628" y="112" font-size="9.5" text-anchor="middle" class="muted">キーを指定して丸ごと出し入れ</text>
        <line x1="628" y1="124" x2="628" y2="156" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="636" y="144" font-size="9.5" class="muted">HTTP API</text>
        <rect x="532" y="160" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="628" y="180" font-size="11" text-anchor="middle">フラットな入れ物</text>
        <text x="628" y="196" font-size="9.5" text-anchor="middle" class="muted">階層は無い(キー+メタデータ)</text>
        <text x="628" y="224" font-size="10" text-anchor="middle" class="muted">大量データの保存・配信</text>

        <text x="16" y="266" font-size="11" class="muted">ファイルシステムをどちら側が持つかが、アクセスの単位(ブロック / ファイル / オブジェクト)を決める。</text>
        <text x="16" y="286" font-size="11" class="muted">一部だけの書き換えが得意なのは左、規模を伸ばしやすいのは右。</text>
      </svg>
    </div>
  </body>
</html>
