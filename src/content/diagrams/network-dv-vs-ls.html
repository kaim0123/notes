<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 420"
        role="img"
        aria-label="ディスタンスベクタ型とリンクステート型のルーティングプロトコルの違いの図解。ディスタンスベクタ型は隣のルーターとだけ距離の情報を交換し、伝言のように伝わる。リンクステート型は自分の接続情報を全ルーターにフラッディングし、全員が同じ全体地図を持って各自で最短経路を計算する。"
      >
        <defs>
          <marker
            id="arrowV"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ ディスタンスベクタ型 ============ -->
        <text x="360" y="20" text-anchor="middle" font-size="13" font-weight="700">
          ディスタンスベクタ型(例: RIP) ― 隣にだけ距離を伝える
        </text>

        <rect x="45" y="70" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="97" text-anchor="middle" font-size="12.5">A</text>
        <rect x="315" y="70" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="360" y="97" text-anchor="middle" font-size="12.5">B</text>
        <rect x="585" y="70" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="97" text-anchor="middle" font-size="12.5">C ― 宛先まで2ホップ</text>

        <line x1="135" y1="85" x2="315" y2="85" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowV)" marker-start="url(#arrowV)" />
        <line x1="405" y1="100" x2="585" y2="100" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowV)" marker-start="url(#arrowV)" />
        <text x="225" y="75" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">距離表を交換</text>
        <text x="495" y="120" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">距離表を交換</text>

        <text x="360" y="150" text-anchor="middle" font-size="11.5" class="muted">
          Aは自分でCの先を見ておらず、Bから聞いた「Bから2ホップ」を信じて+1し「3ホップ」として扱う
        </text>
        <text x="360" y="168" text-anchor="middle" font-size="11.5" class="muted">
          伝言ゲームのように、隣のルーターの言葉をそのまま信じて伝えていく
        </text>

        <line x1="0" y1="195" x2="720" y2="195" stroke="var(--border)" stroke-width="1" />

        <!-- ============ リンクステート型 ============ -->
        <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="700">
          リンクステート型(例: OSPF) ― 全員に接続情報を広める
        </text>

        <rect x="45" y="255" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="90" y="282" text-anchor="middle" font-size="12.5">A</text>
        <rect x="315" y="255" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="360" y="282" text-anchor="middle" font-size="12.5">B</text>
        <rect x="585" y="255" width="90" height="44" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="630" y="282" text-anchor="middle" font-size="12.5">C</text>

        <line x1="135" y1="270" x2="315" y2="270" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="405" y1="270" x2="585" y2="270" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="90" y1="299" x2="630" y2="299" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <text x="360" y="245" text-anchor="middle" font-size="10.5" class="muted">リンクステート情報を全員にフラッディング(隣だけでなく全体に届く)</text>

        <rect x="45" y="320" width="90" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="341" text-anchor="middle" font-size="9.5" class="muted">全体地図あり</text>
        <rect x="315" y="320" width="90" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="360" y="341" text-anchor="middle" font-size="9.5" class="muted">全体地図あり</text>
        <rect x="585" y="320" width="90" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="341" text-anchor="middle" font-size="9.5" class="muted">全体地図あり</text>

        <text x="360" y="385" text-anchor="middle" font-size="11.5" class="muted">
          全ルーターが同じ全体トポロジを把握し、各自で最短経路を計算する(SPF計算)
        </text>
      </svg>
    </div>
  </body>
</html>
