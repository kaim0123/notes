<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="サーバー証明書が発行され、自動で更新されるまでの流れを示した図。まず証明書の発行を申し込むと、そのドメインを本当に持っているかを確かめるための値が示される。その値をドメインの名前情報として登録すると、認証局側がそれを読み取って所有を確認し、証明書が発行される。この確認用の登録を残しておけば、期限が近づいたときに同じ手順が自動で繰り返され、人手を介さずに更新される。期限切れはサイト全体が見られなくなる重大な障害なので、更新を人の作業として残さないことが最大の対策になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="52" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="95" y="76" font-size="10.5" text-anchor="middle">発行を申し込む</text>
        <text x="95" y="94" font-size="9" text-anchor="middle" class="muted">ドメイン名を指定する</text>

        <line x1="176" y1="80" x2="216" y2="80" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="222" y="52" width="180" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="312" y="76" font-size="10.5" text-anchor="middle">確認用の値が示される</text>
        <text x="312" y="94" font-size="9" text-anchor="middle" class="muted">これを登録できる = 持ち主</text>

        <line x1="408" y1="80" x2="448" y2="80" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="454" y="52" width="180" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="544" y="76" font-size="10.5" text-anchor="middle">名前情報として登録</text>
        <text x="544" y="94" font-size="9" text-anchor="middle" class="muted">DNSにレコードを1つ足す</text>

        <path d="M544,114 L544,150 L95,150 L95,124" fill="none" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="320" y="144" font-size="9.5" text-anchor="middle" class="accent">読み取って所有を確認 → 証明書が発行される</text>

        <rect x="20" y="176" width="660" height="80" rx="8" fill="none" stroke="var(--primary)" stroke-dasharray="5 4" />
        <text x="40" y="200" font-size="10.5" class="accent">確認用の登録を残しておけば、期限が近づくと同じ手順が自動で繰り返される。</text>
        <text x="40" y="222" font-size="10.5" class="muted">つまり更新は「人の作業」から消える ― 消しておくことが、いちばん確実な対策。</text>
        <text x="40" y="244" font-size="10.5" class="muted">期限切れはサイト全体が見られなくなる障害で、しかも必ず起きると分かっている。</text>
      </svg>
    </div>
  </body>
</html>
