<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="1回のページ表示にかかる時間を段階に分け、サーバー側の監視で見えている範囲がどこまでかを示した図。サーバーが記録している応答時間は、リクエストを受け取ってから応答を返し終えるまでの区間にすぎない。その前後には、名前解決と接続、応答の転送、HTMLの解析、スクリプトの取得と実行、そして実際に内容が描かれるまでの時間が積み重なっている。同期的に読み込むスクリプトは解析を止めるため、そのぶん描画が後ろへずれる。利用者が体感する遅さの大半はサーバーの外側にあり、そこはブラウザ側で測らないと見えない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="24" y="70" width="90" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="69" y="86" font-size="9.5" text-anchor="middle" class="muted">名前解決</text>
        <text x="69" y="102" font-size="9.5" text-anchor="middle" class="muted">接続・TLS</text>

        <rect x="122" y="70" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="192" y="86" font-size="9.5" text-anchor="middle">サーバーの処理</text>
        <text x="192" y="102" font-size="9.5" text-anchor="middle" class="muted">ここだけが記録される</text>

        <rect x="270" y="70" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="310" y="94" font-size="9.5" text-anchor="middle" class="muted">転送</text>

        <rect x="358" y="70" width="110" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="413" y="94" font-size="9.5" text-anchor="middle" class="muted">HTMLの解析</text>

        <rect x="476" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="551" y="86" font-size="9.5" text-anchor="middle">スクリプトの取得と実行</text>
        <text x="551" y="102" font-size="9" text-anchor="middle" class="accent">解析が止まる</text>

        <rect x="634" y="70" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="684" y="94" font-size="9.5" text-anchor="middle" class="muted">描画</text>

        <line x1="122" y1="52" x2="262" y2="52" stroke="var(--primary)" />
        <line x1="122" y1="46" x2="122" y2="58" stroke="var(--primary)" />
        <line x1="262" y1="46" x2="262" y2="58" stroke="var(--primary)" />
        <text x="192" y="40" font-size="10" text-anchor="middle" class="accent">サーバー側の監視が見ている範囲</text>

        <line x1="24" y1="140" x2="734" y2="140" stroke="var(--muted)" />
        <line x1="24" y1="134" x2="24" y2="146" stroke="var(--muted)" />
        <line x1="734" y1="134" x2="734" y2="146" stroke="var(--muted)" />
        <text x="379" y="162" font-size="10.5" text-anchor="middle" class="muted">利用者が体感している時間 ― 中身が画面に出るまで</text>

        <rect x="24" y="188" width="710" height="86" rx="8" fill="none" stroke="var(--border)" />
        <text x="40" y="212" font-size="10.5" class="muted">サーバーの応答が数ミリ秒でも、画面に出るまで数秒かかることがある。差はすべて外側にある。</text>
        <text x="40" y="234" font-size="10.5" class="muted">同期的に読むスクリプトは解析を止めるので、後続の描画がまとめて後ろへずれる ― 遅さの典型的な原因。</text>
        <text x="40" y="258" font-size="10.5" class="accent">だから「速いか」はブラウザ側で測る。サーバーの数字は、その一部でしかない。</text>
      </svg>
    </div>
  </body>
</html>
