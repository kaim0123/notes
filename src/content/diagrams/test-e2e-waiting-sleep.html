<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 310"
        role="img"
        aria-label="固定時間のスリープと条件待ちを、速い環境と遅い環境の両方で比べた図。上段は3秒の固定スリープ。速い環境では0.4秒で処理が終わっているのに3秒まで待ち続け、2.6秒を無駄にする。遅い環境では処理が4.2秒かかるため、3秒でスリープが明けた時点ではまだ終わっておらず、テストは落ちる。つまり固定スリープは、速い環境では無駄に遅く、遅い環境では足りないという、どちらの意味でも正しくない。下段は条件待ちで、何が起きるまで待つかを条件として書く方式。速い環境では0.4秒で先へ進み、遅い環境では4.2秒まで待ってから進む。必要な分だけ待ち、環境の速さに左右されない。"
      >
        <text x="16" y="26" font-size="11" class="muted">同じテストを、速い環境と遅い環境で走らせたとき</text>

        <line x1="120" y1="42" x2="600" y2="42" stroke="var(--border)" stroke-width="1" />
        <text x="120" y="36" font-size="8.5" text-anchor="middle" class="muted">0s</text>
        <text x="216" y="36" font-size="8.5" text-anchor="middle" class="muted">1s</text>
        <text x="312" y="36" font-size="8.5" text-anchor="middle" class="muted">2s</text>
        <text x="408" y="36" font-size="8.5" text-anchor="middle" class="muted">3s</text>
        <text x="504" y="36" font-size="8.5" text-anchor="middle" class="muted">4s</text>
        <text x="600" y="36" font-size="8.5" text-anchor="middle" class="muted">5s</text>

        <text x="16" y="62" font-size="10.5" class="muted">固定スリープ ― 3秒待つ</text>

        <text x="16" y="84" font-size="9" class="muted">速い環境</text>
        <rect x="120" y="72" width="288" height="16" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <line x1="158" y1="68" x2="158" y2="92" stroke="var(--primary)" stroke-width="1.6" />
        <text x="124" y="104" font-size="9" class="muted">0.4秒で終わっているのに、3秒まで待つ ― 2.6秒の無駄</text>

        <text x="16" y="128" font-size="9" class="muted">遅い環境</text>
        <rect x="120" y="116" width="288" height="16" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <line x1="523" y1="112" x2="523" y2="136" stroke="var(--primary)" stroke-width="1.6" />
        <line x1="400" y1="116" x2="416" y2="132" stroke="var(--primary)" stroke-width="1.8" />
        <line x1="416" y1="116" x2="400" y2="132" stroke="var(--primary)" stroke-width="1.8" />
        <text x="124" y="148" font-size="9" class="muted">3秒で明けるが、終わるのは4.2秒 ― 待ち足りず落ちる</text>

        <text x="16" y="180" font-size="10.5" class="accent">条件待ち ―「何が起きるまで待つか」を書く</text>

        <text x="16" y="202" font-size="9" class="muted">速い環境</text>
        <rect x="120" y="190" width="38" height="16" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="166" y="203" font-size="9" class="muted">0.4秒で先へ進む</text>

        <text x="16" y="240" font-size="9" class="muted">遅い環境</text>
        <rect x="120" y="228" width="403" height="16" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="531" y="241" font-size="9" class="muted">4.2秒まで待つ</text>

        <line x1="16" y1="262" x2="624" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="282" font-size="10.5" class="muted">固定スリープは、速い環境では無駄に遅く、遅い環境では足りない ― どちらの意味でも正しくない。</text>
        <text x="16" y="304" font-size="10.5" class="accent">「とりあえず数秒待つ」としか言えないのは、完了条件の分析がまだ終わっていないサイン。</text>
      </svg>
    </div>
  </body>
</html>
