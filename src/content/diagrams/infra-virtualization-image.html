<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="コンテナイメージのレイヤー構造とCopy-on-Writeを示した図。左のイメージはベースOS・ランタイム・ライブラリ・アプリの4層を下から積み上げたもので、すべて読み取り専用である。右では同じイメージから2つのコンテナが起動しており、どちらも下の4層をそのまま共有し、自分の書き込み層だけを最上段に持つ。ファイルを書き換えるときは、その1つを書き込み層へコピーしてから変更するため、元のイメージは壊れず、同じイメージからいつでも同じ初期状態を作り直せる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="24" font-size="12" class="muted">コンテナイメージ(読み取り専用)</text>
        <rect x="20" y="230" width="220" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="252" font-size="11" text-anchor="middle">ベースOS(Ubuntu)</text>
        <rect x="20" y="190" width="220" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="212" font-size="11" text-anchor="middle">ランタイム(Node.js)</text>
        <rect x="20" y="150" width="220" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="172" font-size="11" text-anchor="middle">ライブラリ</text>
        <rect x="20" y="110" width="220" height="34" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="132" font-size="11" text-anchor="middle">アプリ本体</text>
        <text x="130" y="284" font-size="10" text-anchor="middle" class="muted">一度取得すれば何個のコンテナでも共有できる</text>

        <line x1="248" y1="170" x2="300" y2="170" stroke="var(--primary)" marker-end="url(#arp)" />
        <text x="274" y="160" font-size="10" text-anchor="middle" class="accent">起動</text>

        <text x="310" y="24" font-size="12" class="muted">同じイメージから起こした2つのコンテナ</text>
        <rect x="310" y="110" width="170" height="154" rx="8" fill="none" stroke="var(--border)" />
        <text x="395" y="102" font-size="11" text-anchor="middle">コンテナ1</text>
        <rect x="322" y="122" width="146" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="395" y="142" font-size="10.5" text-anchor="middle">書き込み層</text>
        <rect x="322" y="160" width="146" height="94" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="395" y="200" font-size="10" text-anchor="middle" class="muted">下の4層は</text>
        <text x="395" y="216" font-size="10" text-anchor="middle" class="muted">イメージを参照するだけ</text>

        <rect x="500" y="110" width="170" height="154" rx="8" fill="none" stroke="var(--border)" />
        <text x="585" y="102" font-size="11" text-anchor="middle">コンテナ2</text>
        <rect x="512" y="122" width="146" height="30" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="585" y="142" font-size="10.5" text-anchor="middle">書き込み層</text>
        <rect x="512" y="160" width="146" height="94" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="585" y="200" font-size="10" text-anchor="middle" class="muted">下の4層は</text>
        <text x="585" y="216" font-size="10" text-anchor="middle" class="muted">イメージを参照するだけ</text>

        <text x="310" y="284" font-size="10" class="accent">書き換えるファイルだけを書き込み層へコピーしてから変更する(Copy-on-Write)</text>
      </svg>
    </div>
  </body>
</html>
