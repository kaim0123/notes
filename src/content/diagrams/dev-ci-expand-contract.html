<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="データベースの列名を変更するときの3段階のリリースを示した図。1回のリリースで列名を変えてしまうと、切り替えの最中に旧版が存在しない列を参照して落ちる。そこで3つのリリースに分解する。第1段階の拡張では、新しい列を追加するだけで、既存の列はそのまま残す。この時点では旧版も新版も動く。第2段階の移行では、新旧の両方の列に書くコードを出し、既存データを新しい列へ埋める。この時点でも旧版と新版の両方が動く。第3段階の縮小では、旧版が完全に消えたことを確認してから、古い列を削除する。この時点では新版だけが動いている。各段階の間で旧版と新版が同時に動いても壊れないことが、切り替え方式が成立する前提になる。"
      >
        <defs>
          <marker id="arec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="muted">1回のリリースで列名を変えると、切り替え中に旧版が存在しない列を参照して落ちる</text>

        <rect x="16" y="40" width="180" height="88" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="106" y="64" text-anchor="middle" font-size="11.5" font-weight="600">① 拡張</text>
        <text x="106" y="86" text-anchor="middle" font-size="10.5" class="muted">新しい列を追加するだけ</text>
        <text x="106" y="102" text-anchor="middle" font-size="10.5" class="muted">既存の列はそのまま残す</text>
        <text x="106" y="120" text-anchor="middle" font-size="10" class="lbl">旧版も新版も動く</text>

        <line x1="196" y1="84" x2="222" y2="84" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arec)" />

        <rect x="228" y="40" width="184" height="88" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="64" text-anchor="middle" font-size="11.5" font-weight="600">② 移行</text>
        <text x="320" y="86" text-anchor="middle" font-size="10.5" class="muted">新旧の両方に書くコードを出す</text>
        <text x="320" y="102" text-anchor="middle" font-size="10.5" class="muted">既存データを新しい列へ埋める</text>
        <text x="320" y="120" text-anchor="middle" font-size="10" class="lbl">旧版も新版も動く</text>

        <line x1="412" y1="84" x2="438" y2="84" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arec)" />

        <rect x="444" y="40" width="180" height="88" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="534" y="64" text-anchor="middle" font-size="11.5" font-weight="600">③ 縮小</text>
        <text x="534" y="86" text-anchor="middle" font-size="10.5" class="muted">旧版が完全に消えた後で</text>
        <text x="534" y="102" text-anchor="middle" font-size="10.5" class="muted">古い列を削除する</text>
        <text x="534" y="120" text-anchor="middle" font-size="10" class="muted">新版のみ</text>

        <line x1="16" y1="152" x2="624" y2="152" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="178" font-size="12" class="lbl">切り替えの最中は、旧版と新版が同時に動いている</text>

        <rect x="16" y="190" width="288" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="160" y="212" text-anchor="middle" font-size="11" class="muted">旧版のインスタンス</text>
        <rect x="336" y="190" width="288" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="480" y="212" text-anchor="middle" font-size="11">新版のインスタンス</text>

        <rect x="176" y="238" width="288" height="34" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="260" text-anchor="middle" font-size="11">同じデータベース(1つしかない)</text>
        <line x1="160" y1="224" x2="230" y2="236" stroke="var(--muted)" stroke-width="1.2" />
        <line x1="480" y1="224" x2="410" y2="236" stroke="var(--muted)" stroke-width="1.2" />

        <text x="16" y="292" font-size="11" class="muted">両方から同時に読み書きされても壊れないこと ― これが切り替え方式が成立する前提</text>
      </svg>
    </div>
  </body>
</html>
