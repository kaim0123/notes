<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="同じ1つのリクエストを、メトリクス・ログ・トレースという3つの見方で切った図。メトリクスは時間ごとに集計された数値で、全体として異常かどうかを答える。ログは1件ごとの記録で、その1件で何が起きたかを答える。トレースはサービスをまたいだ処理の内訳で、どこで時間を使ったかを答える。3つは別々のデータではなく同じ出来事の別の断面であり、リクエストIDを共通で持たせておくと互いに行き来できる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="12" class="muted">同じ1リクエストを、3つの角度から見る</text>

        <rect x="16" y="40" width="232" height="180" rx="8" fill="none" stroke="var(--border)" />
        <text x="132" y="62" font-size="12" text-anchor="middle">メトリクス</text>
        <text x="132" y="80" font-size="10" text-anchor="middle" class="muted">全体として異常か</text>
        <line x1="44" y1="180" x2="228" y2="180" stroke="var(--border)" />
        <rect x="52" y="152" width="18" height="28" fill="var(--card)" stroke="var(--border)" />
        <rect x="78" y="144" width="18" height="36" fill="var(--card)" stroke="var(--border)" />
        <rect x="104" y="158" width="18" height="22" fill="var(--card)" stroke="var(--border)" />
        <rect x="130" y="138" width="18" height="42" fill="var(--card)" stroke="var(--border)" />
        <rect x="156" y="106" width="18" height="74" fill="var(--card)" stroke="var(--primary)" />
        <rect x="182" y="98" width="18" height="82" fill="var(--card)" stroke="var(--primary)" />
        <line x1="44" y1="124" x2="228" y2="124" stroke="var(--primary)" stroke-dasharray="4 3" />
        <text x="228" y="118" font-size="9.5" text-anchor="end" class="accent">しきい値</text>
        <text x="132" y="204" font-size="10" text-anchor="middle" class="muted">エラー率の推移</text>

        <rect x="264" y="40" width="232" height="180" rx="8" fill="none" stroke="var(--border)" />
        <text x="380" y="62" font-size="12" text-anchor="middle">ログ</text>
        <text x="380" y="80" font-size="10" text-anchor="middle" class="muted">その1件で何が起きたか</text>
        <rect x="280" y="94" width="200" height="26" rx="4" fill="var(--card)" stroke="var(--border)" />
        <text x="290" y="111" font-size="9" class="mono">req=a1f9 POST /orders 201</text>
        <rect x="280" y="126" width="200" height="26" rx="4" fill="var(--card)" stroke="var(--border)" />
        <text x="290" y="143" font-size="9" class="mono">req=b204 GET /items 200</text>
        <rect x="280" y="158" width="200" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" />
        <text x="290" y="175" font-size="9" class="mono accent">req=c77e POST /pay 500</text>
        <text x="380" y="204" font-size="10" text-anchor="middle" class="muted">1行 = 1つの出来事</text>

        <rect x="512" y="40" width="232" height="180" rx="8" fill="none" stroke="var(--border)" />
        <text x="628" y="62" font-size="12" text-anchor="middle">トレース</text>
        <text x="628" y="80" font-size="10" text-anchor="middle" class="muted">どこで時間を使ったか</text>
        <rect x="528" y="98" width="196" height="18" rx="4" fill="var(--card)" stroke="var(--border)" />
        <text x="534" y="111" font-size="9" class="mono">API 全体 820ms</text>
        <rect x="546" y="122" width="60" height="18" rx="4" fill="var(--card)" stroke="var(--border)" />
        <text x="552" y="135" font-size="9" class="mono">認可 40ms</text>
        <rect x="546" y="146" width="150" height="18" rx="4" fill="var(--card)" stroke="var(--primary)" />
        <text x="552" y="159" font-size="9" class="mono accent">DB 問い合わせ 690ms</text>
        <rect x="546" y="170" width="46" height="18" rx="4" fill="var(--card)" stroke="var(--border)" />
        <text x="552" y="183" font-size="9" class="mono">整形 60ms</text>
        <text x="628" y="204" font-size="10" text-anchor="middle" class="muted">サービスをまたいだ内訳</text>

        <text x="16" y="252" font-size="11" class="muted">3つは別々のデータではなく、同じ出来事の別の断面。共通のリクエストIDを持たせておくと、</text>
        <text x="16" y="272" font-size="11" class="muted">「エラー率が跳ねた」→「どのリクエストか」→「どの処理で詰まったか」と一続きで降りられる。</text>
      </svg>
    </div>
  </body>
</html>
