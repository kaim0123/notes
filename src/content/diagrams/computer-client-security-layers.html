<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="端末を中心にした多層防御。中央に従業員の端末があり、その周りに脅威と対策の組が4つ並ぶ。左上が紛失・盗難に対するBitLocker、左下が遠隔管理のMDM、右上がマルウェアに対するEPPとEDR、右下が持出し・持込みに対するUSB制御。" viewBox="0 0 620 170">
      <rect x="250" y="65" width="120" height="44" rx="8" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="310" y="90" fill="var(--fg)" font-size="12" text-anchor="middle">従業員の端末</text>
      <rect x="20" y="20" width="170" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" />
      <text x="105" y="38" fill="var(--muted)" font-size="11" text-anchor="middle">紛失・盗難</text>
      <text x="105" y="53" fill="var(--fg)" font-size="11" text-anchor="middle">→ BitLocker</text>
      <rect x="20" y="110" width="170" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" />
      <text x="105" y="128" fill="var(--muted)" font-size="11" text-anchor="middle">遠隔管理</text>
      <text x="105" y="143" fill="var(--fg)" font-size="11" text-anchor="middle">→ MDM</text>
      <rect x="430" y="20" width="170" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" />
      <text x="515" y="38" fill="var(--muted)" font-size="11" text-anchor="middle">マルウェア</text>
      <text x="515" y="53" fill="var(--fg)" font-size="11" text-anchor="middle">→ EPP / EDR</text>
      <rect x="430" y="110" width="170" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" />
      <text x="515" y="128" fill="var(--muted)" font-size="11" text-anchor="middle">持出し・持込み</text>
      <text x="515" y="143" fill="var(--fg)" font-size="11" text-anchor="middle">→ USB制御</text>
      </svg>
    </div>
  </body>
</html>
