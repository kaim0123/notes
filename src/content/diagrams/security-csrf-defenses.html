<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="CSRFの2つの防御が、それぞれどこで効くかを示した図。上の行は正規のフォームからの送信で、同一サイト起点なのでSameSite属性の条件を満たしてCookieが付き、ページに埋め込まれたCSRFトークンもサーバー側の値と一致するため、処理が実行される。下の行は攻撃者のサイトを起点とする送信で、まずブラウザの段階でSameSiteによりCookieが添付されず、仮に添付される設定であってもサーバーの段階でCSRFトークンの値を知り得ないため拒否される。SameSiteはブラウザ任せの防御、CSRFトークンはサーバーで確実に確かめる防御であり、段階が違うので重ねて使う。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="100" y="46" font-size="10" text-anchor="middle" class="muted">起点</text>
        <text x="320" y="46" font-size="10" text-anchor="middle" class="muted">ブラウザ: SameSite属性</text>
        <text x="530" y="46" font-size="10" text-anchor="middle" class="muted">サーバー: CSRFトークン</text>
        <text x="700" y="46" font-size="10" text-anchor="middle" class="muted">結果</text>

        <rect x="20" y="62" width="160" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="230" y="62" width="180" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="450" y="62" width="160" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="650" y="62" width="94" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="100" y="94" font-size="10" text-anchor="middle">正規のフォーム</text>
        <text x="320" y="88" font-size="9.5" text-anchor="middle" class="muted">同一サイト起点</text>
        <text x="320" y="104" font-size="9.5" text-anchor="middle">Cookieが付く</text>
        <text x="530" y="88" font-size="9.5" text-anchor="middle" class="muted">埋め込まれた値</text>
        <text x="530" y="104" font-size="9.5" text-anchor="middle">一致する</text>
        <text x="697" y="94" font-size="11" text-anchor="middle" class="accent">実行</text>

        <line x1="184" y1="88" x2="226" y2="88" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="414" y1="88" x2="446" y2="88" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="614" y1="88" x2="646" y2="88" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="20" y="146" width="160" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="230" y="146" width="180" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="450" y="146" width="160" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="650" y="146" width="94" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="100" y="178" font-size="10" text-anchor="middle" class="mono">evil.example</text>
        <text x="320" y="172" font-size="9.5" text-anchor="middle" class="muted">他サイト起点</text>
        <text x="320" y="188" font-size="9.5" text-anchor="middle" class="accent">Cookieを付けない</text>
        <text x="530" y="172" font-size="9.5" text-anchor="middle" class="muted">正規ページを読めない</text>
        <text x="530" y="188" font-size="9.5" text-anchor="middle" class="accent">値を知り得ない</text>
        <text x="697" y="178" font-size="11" text-anchor="middle">拒否</text>

        <line x1="184" y1="172" x2="226" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="414" y1="172" x2="446" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="614" y1="172" x2="646" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <text x="380" y="226" font-size="9.5" text-anchor="middle" class="muted">2つは止める段階が違う ― 片方はブラウザ、もう片方はサーバー</text>

        <line x1="16" y1="244" x2="744" y2="244" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="266" font-size="10.5" class="muted">SameSiteはブラウザの実装に委ねる防御。古い環境や例外的な遷移があるので、これ1本には寄せない。</text>
        <text x="16" y="288" font-size="10.5" class="accent">逆にトークンも、XSSでページ内の値を読まれれば無効になる。CSRF対策とXSS対策は互いを支えている。</text>
      </svg>
    </div>
  </body>
</html>
