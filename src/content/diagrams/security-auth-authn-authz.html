<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 330"
        role="img"
        aria-label="認証と認可の関係を、リクエストが通る順序として示した図。リクエストはまず認証、すなわちあなたは誰かという判定を通る。ここで名乗りが確かめられなければ、401を返して終わる。本人だと確かめられたら次に認可、すなわち何をしてよいかという判定に進む。権限が足りなければ403を返して終わる。両方を通ってはじめて処理が実行される。401は誰だか分からないという意味、403は誰かは分かっているがそれはできないという意味であり、この2つの応答の違いがそのまま認証と認可の違いにあたる。順序も固定されていて、誰か分からないうちは何をしてよいかも決められない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="16" y="112" width="90" height="50" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="61" y="142" font-size="10.5" text-anchor="middle">リクエスト</text>

        <rect x="146" y="104" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="206" y="132" font-size="13" text-anchor="middle">認証</text>
        <text x="206" y="154" font-size="9.5" text-anchor="middle" class="muted">あなたは誰か</text>

        <rect x="326" y="104" width="120" height="66" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="386" y="132" font-size="13" text-anchor="middle">認可</text>
        <text x="386" y="154" font-size="9.5" text-anchor="middle" class="muted">何をしてよいか</text>

        <rect x="506" y="104" width="118" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="565" y="142" font-size="13" text-anchor="middle" class="accent">処理する</text>

        <line x1="108" y1="137" x2="142" y2="137" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="268" y1="137" x2="322" y2="137" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="448" y1="137" x2="502" y2="137" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="295" y="128" font-size="9" text-anchor="middle" class="muted">本人だ</text>
        <text x="475" y="128" font-size="9" text-anchor="middle" class="muted">権限がある</text>

        <line x1="206" y1="172" x2="206" y2="204" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <line x1="386" y1="172" x2="386" y2="204" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="214" y="192" font-size="9" class="muted">違う</text>
        <text x="394" y="192" font-size="9" class="muted">足りない</text>

        <rect x="151" y="206" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="206" y="226" font-size="11" text-anchor="middle" class="mono">401</text>
        <text x="206" y="244" font-size="9" text-anchor="middle" class="muted">誰だか分からない</text>

        <rect x="331" y="206" width="110" height="46" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="386" y="226" font-size="11" text-anchor="middle" class="mono">403</text>
        <text x="386" y="244" font-size="9" text-anchor="middle" class="muted">誰かは分かっている</text>

        <line x1="16" y1="272" x2="624" y2="272" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="294" font-size="10.5" class="muted">401は「名乗り直してほしい」、403は「名乗りは受け取ったが、それはさせられない」。応答の違いがそのまま役割の違い。</text>
        <text x="16" y="316" font-size="10.5" class="accent">順序は入れ替えられない。誰か分からないうちは、何をしてよいかも決めようがない。</text>
      </svg>
    </div>
  </body>
</html>
