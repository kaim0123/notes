<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 820 300"
        role="img"
        aria-label="文字AとあがUnicodeのコードポイントU+0041・U+3042に対応づけられ、UTF-8によってそれぞれ1バイトの41、3バイトのE3 81 82というバイト列になる流れ"
      >
        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- 列見出し -->
        <text x="110" y="36" text-anchor="middle" font-size="13" class="muted">文字</text>
        <text x="390" y="36" text-anchor="middle" font-size="13" class="accent" font-weight="600">符号化文字集合(Unicode)</text>
        <text x="675" y="36" text-anchor="middle" font-size="13" class="accent" font-weight="600">符号化方式(UTF-8)</text>
        <text x="390" y="54" text-anchor="middle" font-size="11" class="muted">番号を割り当てる</text>
        <text x="675" y="54" text-anchor="middle" font-size="11" class="muted">番号をバイト列にする</text>

        <!-- 1行目: A -->
        <rect x="40" y="80" width="140" height="60" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="120" text-anchor="middle" font-size="28" font-weight="700">A</text>

        <line x1="180" y1="110" x2="278" y2="110" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <rect x="280" y="80" width="220" height="60" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="390" y="118" text-anchor="middle" font-size="22" class="mono">U+0041</text>

        <line x1="500" y1="110" x2="558" y2="110" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <rect x="560" y="80" width="230" height="60" rx="10" fill="var(--primary)" />
        <text x="675" y="112" text-anchor="middle" font-size="22" class="mono" style="fill: var(--primary-fg)">41</text>
        <text x="675" y="131" text-anchor="middle" font-size="11" style="fill: var(--primary-fg)">1バイト(ASCIIと同じ)</text>

        <!-- 2行目: あ -->
        <rect x="40" y="180" width="140" height="60" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="220" text-anchor="middle" font-size="28" font-weight="700">あ</text>

        <line x1="180" y1="210" x2="278" y2="210" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <rect x="280" y="180" width="220" height="60" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="390" y="218" text-anchor="middle" font-size="22" class="mono">U+3042</text>

        <line x1="500" y1="210" x2="558" y2="210" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrow)" />

        <rect x="560" y="180" width="230" height="60" rx="10" fill="var(--primary)" />
        <text x="675" y="212" text-anchor="middle" font-size="22" class="mono" style="fill: var(--primary-fg)">E3 81 82</text>
        <text x="675" y="231" text-anchor="middle" font-size="11" style="fill: var(--primary-fg)">3バイト</text>

        <text x="410" y="278" text-anchor="middle" font-size="12" class="muted">
          読む側が別の方式(Shift_JIS など)で解釈すると、同じバイト列が別の文字に化ける
        </text>
      </svg>
    </div>
  </body>
</html>
