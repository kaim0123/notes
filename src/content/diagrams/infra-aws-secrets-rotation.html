<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="保管した秘密の値を自動で入れ替える流れを示した図。まず新しい値を作り、次にそれを本来の相手、たとえばデータベース側にも設定する。続いて新しい値で実際に接続できるかを確かめ、確認できてから利用側が参照する印を新しい値へ切り替える。この順序であるため、確認が失敗した時点で切り替えは行われず、古い値のまま動き続ける。アプリは値そのものを持たず毎回取得する形にしておけば、入れ替えのたびに再配布や再起動をしなくて済む。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="60" width="150" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="95" y="86" font-size="10.5" text-anchor="middle">1. 新しい値を作る</text>
        <text x="95" y="108" font-size="9" text-anchor="middle" class="muted">古い値はまだ有効</text>

        <line x1="176" y1="93" x2="206" y2="93" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="212" y="60" width="150" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="287" y="86" font-size="10.5" text-anchor="middle">2. 相手にも設定する</text>
        <text x="287" y="108" font-size="9" text-anchor="middle" class="muted">DB側のパスワードを更新</text>

        <line x1="368" y1="93" x2="398" y2="93" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="404" y="60" width="150" height="66" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="479" y="86" font-size="10.5" text-anchor="middle">3. 実際に試す</text>
        <text x="479" y="108" font-size="9" text-anchor="middle" class="muted">新しい値で接続できるか</text>

        <line x1="560" y1="93" x2="590" y2="93" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="596" y="60" width="84" height="66" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="638" y="86" font-size="10" text-anchor="middle">4. 切替</text>
        <text x="638" y="106" font-size="9" text-anchor="middle" class="muted">印を移す</text>

        <text x="20" y="170" font-size="10.5" class="accent">試して確認できたときだけ切り替わる ― 失敗すれば古い値のまま動き続ける。</text>

        <rect x="20" y="188" width="660" height="72" rx="8" fill="none" stroke="var(--border)" />
        <text x="36" y="212" font-size="10.5" class="muted">アプリ側は値そのものを持たず、必要なときに取得する形にしておく。</text>
        <text x="36" y="234" font-size="10.5" class="muted">そうすれば入れ替えのたびに再配布も再起動も要らない ― これが自動化できる条件。</text>
        <text x="36" y="254" font-size="10" class="muted">ただし毎回問い合わせると呼び出し料が積み上がるので、短時間だけ手元に保持する。</text>
      </svg>
    </div>
  </body>
</html>
