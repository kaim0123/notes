<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 720 340"
        role="img"
        aria-label="フローティングスタティックルートの図解。通常時はAD(アドミニストレーティブディスタンス)が低いOSPFの経路が優先して使われ、AD200のスタティックルートは待機している。OSPFの経路がリンク障害で消えると、唯一残ったスタティックルートが有効になり通信を引き継ぐ。"
      >
        <defs>
          <marker
            id="arrowT"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ 通常時 ============ -->
        <text x="360" y="18" text-anchor="middle" font-size="13" font-weight="700">通常時 ― ADが低い経路(OSPF)を優先</text>

        <rect x="40" y="55" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="82" text-anchor="middle" font-size="12">R1</text>
        <rect x="580" y="55" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="82" text-anchor="middle" font-size="12">宛先</text>

        <line x1="140" y1="65" x2="580" y2="65" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowT)" />
        <text x="360" y="55" text-anchor="middle" font-size="11" style="fill: var(--primary)">OSPF学習ルート(AD=110) ― 使用中</text>

        <line x1="140" y1="95" x2="580" y2="95" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="360" y="112" text-anchor="middle" font-size="11" class="muted">フローティングスタティック(AD=200) ― 待機</text>

        <line x1="0" y1="150" x2="720" y2="150" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 障害時 ============ -->
        <text x="360" y="178" text-anchor="middle" font-size="13" font-weight="700">障害時 ― OSPFルートが消えるとスタティックが有効に</text>

        <rect x="40" y="215" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="242" text-anchor="middle" font-size="12">R1</text>
        <rect x="580" y="215" width="100" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="630" y="242" text-anchor="middle" font-size="12">宛先</text>

        <line x1="140" y1="225" x2="360" y2="225" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="378" y="230" font-size="14" style="fill: var(--muted)">×</text>
        <text x="360" y="212" text-anchor="middle" font-size="11" class="muted">OSPFルート消失(リンク障害)</text>

        <line x1="140" y1="255" x2="580" y2="255" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowT)" />
        <text x="360" y="272" text-anchor="middle" font-size="11" style="fill: var(--primary)">スタティックルート(AD=200)が有効化 ― 通信を引き継ぐ</text>

        <text x="360" y="315" text-anchor="middle" font-size="12" class="muted">
          「他に経路が無いときだけ使う」ADの高いスタティックルートが浮き輪(フロート)代わりになる
        </text>
      </svg>
    </div>
  </body>
</html>
