<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="権限が階層に沿って引き継がれる仕組みを示した図。組織の全体に与えた権限は、その下のすべてのフォルダとプロジェクト、さらにその中の資源にまで及ぶ。フォルダに与えた権限はその配下のプロジェクトへ、プロジェクトに与えた権限はその中の資源へ引き継がれる。したがって上位で与えた強い権限は下位で取り消せないため、広い範囲へ与える権限ほど慎重に選ぶ必要がある。実務では、原則として最も狭い範囲へ与え、上位に置くのは監査など本当に全体で必要なものだけに絞る。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="200" y="34" width="300" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="54" font-size="10.5" text-anchor="middle">組織 ― ここで与えると全部に効く</text>
        <text x="350" y="72" font-size="9" text-anchor="middle" class="accent">下位では取り消せない</text>

        <line x1="350" y1="84" x2="350" y2="104" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="200" y="108" width="300" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="128" font-size="10.5" text-anchor="middle">フォルダ ― 部門・環境の単位</text>
        <text x="350" y="146" font-size="9" text-anchor="middle" class="muted">配下のプロジェクトすべてに及ぶ</text>

        <line x1="350" y1="158" x2="350" y2="178" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="200" y="182" width="300" height="46" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="202" font-size="10.5" text-anchor="middle">プロジェクト ― 実務の単位</text>
        <text x="350" y="220" font-size="9" text-anchor="middle" class="muted">中の資源すべてに及ぶ</text>

        <line x1="350" y1="232" x2="350" y2="252" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="240" y="256" width="220" height="34" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="350" y="278" font-size="10" text-anchor="middle">個々の資源</text>

        <text x="20" y="120" font-size="10.5" class="muted">上で与えたものは</text>
        <text x="20" y="140" font-size="10.5" class="muted">下へ引き継がれる</text>
        <text x="20" y="176" font-size="10" class="accent">だから、広い範囲へ</text>
        <text x="20" y="194" font-size="10" class="accent">与えるほど慎重に</text>

        <text x="530" y="120" font-size="10.5" class="muted">原則は</text>
        <text x="530" y="140" font-size="10.5" class="muted">いちばん狭い範囲へ</text>
        <text x="530" y="176" font-size="10" class="muted">上位に置くのは</text>
        <text x="530" y="194" font-size="10" class="muted">監査など全体で要る</text>
        <text x="530" y="212" font-size="10" class="muted">ものだけ</text>
      </svg>
    </div>
  </body>
</html>
