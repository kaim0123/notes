<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="CDP/LLDPの図解。SW1とSW2が定期的に自分の機器情報を広告フレームとして送り合い、それぞれが相手の機種やポート番号を近隣情報テーブルとして記録する。これにより手動でケーブル図を作らなくても物理トポロジを把握できる。"
      >
        <defs>
          <marker
            id="arrowCdp"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="60" y="30" width="140" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="130" y="58" text-anchor="middle" font-size="13" font-weight="600">SW1(Gi0/1)</text>

        <rect x="440" y="30" width="140" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="510" y="58" text-anchor="middle" font-size="13" font-weight="600">SW2(Gi0/2)</text>

        <line x1="200" y1="45" x2="440" y2="45" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowCdp)" />
        <line x1="440" y1="62" x2="200" y2="62" stroke="var(--primary)" stroke-width="1.5" marker-end="url(#arrowCdp)" />
        <text x="320" y="35" text-anchor="middle" font-size="10.5" style="fill: var(--primary)">CDP(Cisco独自)/LLDP(標準)の広告を定期送信</text>

        <rect x="40" y="150" width="230" height="100" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="155" y="172" text-anchor="middle" font-size="10.5" class="muted">SW1の近隣情報テーブル</text>
        <text x="60" y="192" font-size="10.5" class="mono">隣接機器: SW2</text>
        <text x="60" y="210" font-size="10.5" class="mono">ローカルIF: Gi0/1</text>
        <text x="60" y="228" font-size="10.5" class="mono">リモートIF: Gi0/2</text>

        <rect x="370" y="150" width="230" height="100" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="485" y="172" text-anchor="middle" font-size="10.5" class="muted">SW2の近隣情報テーブル</text>
        <text x="390" y="192" font-size="10.5" class="mono">隣接機器: SW1</text>
        <text x="390" y="210" font-size="10.5" class="mono">ローカルIF: Gi0/2</text>
        <text x="390" y="228" font-size="10.5" class="mono">リモートIF: Gi0/1</text>

        <text x="320" y="285" text-anchor="middle" font-size="11.5" class="muted">
          手動でケーブル図を作らなくても、隣接機器の情報から物理トポロジを把握できる
        </text>
      </svg>
    </div>
  </body>
</html>
