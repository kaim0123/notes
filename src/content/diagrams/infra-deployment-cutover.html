<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="旧システムから新システムへ切り替える3つの方式を比べた図。一斉切替はある日を境に全員が新しいほうへ移る方式で、手順は単純で費用も低いが、問題が起きたときの影響が全体に及ぶ。並行稼働は一定期間だけ両方を動かして結果を突き合わせる方式で、確認は厚くできるが、二重に入力する手間と両系の運用費用がかかる。段階移行は拠点や機能を区切って順に移す方式で、影響を小さく保てる代わりに、移行期間中は新旧が混在してデータの整合をどう保つかという問題が生じる。どれを選ぶかは、止まったときの損害と、二重運用に払える手間の釣り合いで決まる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="28" font-size="12" class="muted">旧システムから新システムへ、どう移るか</text>

        <rect x="20" y="44" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="70" font-size="11.5" text-anchor="middle">一斉切替</text>
        <rect x="40" y="84" width="90" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="85" y="103" font-size="9.5" text-anchor="middle" class="muted">旧</text>
        <line x1="134" y1="98" x2="146" y2="98" stroke="var(--primary)" marker-end="url(#arp)" />
        <rect x="150" y="84" width="80" height="28" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="190" y="103" font-size="9.5" text-anchor="middle">新</text>
        <text x="135" y="136" font-size="9.5" text-anchor="middle" class="muted">ある日を境に全員が移る</text>
        <text x="135" y="166" font-size="10" text-anchor="middle">手順が単純・費用が低い</text>
        <text x="135" y="190" font-size="10" text-anchor="middle" class="accent">失敗の影響が全体に及ぶ</text>
        <text x="135" y="212" font-size="9" text-anchor="middle" class="muted">戻せる手順の用意が前提</text>

        <rect x="265" y="44" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="70" font-size="11.5" text-anchor="middle">並行稼働</text>
        <rect x="285" y="84" width="90" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="330" y="103" font-size="9.5" text-anchor="middle" class="muted">旧(動かし続ける)</text>
        <rect x="285" y="118" width="90" height="28" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="330" y="137" font-size="9.5" text-anchor="middle">新(同じ入力)</text>
        <text x="440" y="112" font-size="9.5" text-anchor="middle" class="muted">結果を</text>
        <text x="440" y="128" font-size="9.5" text-anchor="middle" class="muted">突き合わせる</text>
        <text x="380" y="166" font-size="10" text-anchor="middle">いちばん確認が厚い</text>
        <text x="380" y="190" font-size="10" text-anchor="middle" class="accent">二重入力の手間と費用</text>
        <text x="380" y="212" font-size="9" text-anchor="middle" class="muted">現場の負担が重く、長く続けられない</text>

        <rect x="510" y="44" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="625" y="70" font-size="11.5" text-anchor="middle">段階移行</text>
        <rect x="530" y="84" width="60" height="28" rx="6" fill="var(--card)" stroke="var(--primary)" />
        <text x="560" y="103" font-size="9" text-anchor="middle">A拠点</text>
        <rect x="596" y="84" width="60" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="626" y="103" font-size="9" text-anchor="middle" class="muted">B拠点</text>
        <rect x="662" y="84" width="60" height="28" rx="6" fill="none" stroke="var(--border)" />
        <text x="692" y="103" font-size="9" text-anchor="middle" class="muted">C拠点</text>
        <text x="625" y="136" font-size="9.5" text-anchor="middle" class="muted">区切って順に移す</text>
        <text x="625" y="166" font-size="10" text-anchor="middle">影響を小さく保てる</text>
        <text x="625" y="190" font-size="10" text-anchor="middle" class="accent">移行中は新旧が混在する</text>
        <text x="625" y="212" font-size="9" text-anchor="middle" class="muted">データの整合をどう保つかが課題</text>

        <text x="20" y="256" font-size="10.5" class="muted">選ぶ基準は「止まったときの損害」と「二重運用に払える手間」の釣り合い。</text>
        <text x="20" y="278" font-size="10.5" class="muted">どの方式でも、決めておくべきものは同じ ― 中止の判断基準と、戻すときの手順。</text>
      </svg>
    </div>
  </body>
</html>
