<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="コンテナを動かすときの2つの独立した選択を、縦横の軸として整理した図。横軸は束ねる仕組みで、事業者独自のオーケストレーターを使うか、標準規格であるKubernetesを使うかが分かれる。前者は覚えることが少なく周辺サービスとの接続も最初から整っている代わりに、他の事業者へ持ち出せない。後者は知識も定義もそのまま他所で使えるが、Kubernetes自体を学ぶ必要がある。縦軸は土台で、コンテナが載るサーバーを自分で並べて管理するか、その存在ごと事業者に任せるかが分かれる。この2つは独立しているため、4つの組み合わせから選ぶことになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="30" font-size="12" class="muted">2つの選択は独立している ― 束ねる仕組み と 土台</text>

        <text x="270" y="62" font-size="11" text-anchor="middle">事業者独自の仕組み</text>
        <text x="560" y="62" font-size="11" text-anchor="middle">Kubernetes(標準規格)</text>

        <text x="80" y="120" font-size="11" text-anchor="middle">土台も</text>
        <text x="80" y="138" font-size="11" text-anchor="middle">自分で持つ</text>
        <rect x="150" y="76" width="240" height="86" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="270" y="104" font-size="10.5" text-anchor="middle">サーバーを並べて管理する</text>
        <text x="270" y="126" font-size="9.5" text-anchor="middle" class="muted">台数・更新・空き容量まで自分の仕事</text>
        <text x="270" y="146" font-size="9.5" text-anchor="middle" class="muted">細かく詰めれば単価は下げられる</text>

        <rect x="410" y="76" width="240" height="86" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="104" font-size="10.5" text-anchor="middle">同じ土台をKubernetesで</text>
        <text x="530" y="126" font-size="9.5" text-anchor="middle" class="muted">クラスタの面倒も残る</text>
        <text x="530" y="146" font-size="9.5" text-anchor="middle" class="muted">いちばん自由で、いちばん重い</text>

        <text x="80" y="212" font-size="11" text-anchor="middle">土台は</text>
        <text x="80" y="230" font-size="11" text-anchor="middle">任せる</text>
        <rect x="150" y="176" width="240" height="86" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="270" y="204" font-size="10.5" text-anchor="middle">コンテナを置くだけ</text>
        <text x="270" y="226" font-size="9.5" text-anchor="middle" class="muted">サーバーの存在を意識しない</text>
        <text x="270" y="246" font-size="9.5" text-anchor="middle" class="accent">始めるのがいちばん速い</text>

        <rect x="410" y="176" width="240" height="86" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="204" font-size="10.5" text-anchor="middle">Kubernetes + 土台なし</text>
        <text x="530" y="226" font-size="9.5" text-anchor="middle" class="muted">定義は他所へ持ち出せる</text>
        <text x="530" y="246" font-size="9.5" text-anchor="middle" class="muted">クラスタ運用は軽くなる</text>

        <text x="20" y="288" font-size="10.5" class="muted">横の選択は「持ち出せるか」、縦の選択は「サーバーを見るか」― 混ぜずに1つずつ決める。</text>
      </svg>
    </div>
  </body>
</html>
