<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 400"
        role="img"
        aria-label="HSRPの図解。通常時はPCが仮想IP宛に送ったパケットを実際にはActiveのR1が転送し、StandbyのR2は待機している。R1が障害で止まると、R2が同じ仮想IP・仮想MACを引き継いでActiveに昇格し、PC側は設定を変えないまま通信を継続できる。"
      >
        <defs>
          <marker
            id="arrowHs"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <!-- ============ 通常時 ============ -->
        <text x="350" y="18" text-anchor="middle" font-size="13" font-weight="700">通常時 ― R1(Active)が実際に転送する</text>

        <rect x="270" y="30" width="160" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="50" text-anchor="middle" font-size="12">PC</text>
        <text x="350" y="66" text-anchor="middle" font-size="9.5" class="muted">GW: 192.168.1.1(仮想)</text>

        <rect x="80" y="120" width="160" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="160" y="142" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">R1(Active)</text>
        <text x="160" y="160" text-anchor="middle" font-size="9.5" class="muted">仮想IP/仮想MACを保持</text>

        <rect x="460" y="120" width="160" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="540" y="142" text-anchor="middle" font-size="13" font-weight="600">R2(Standby)</text>
        <text x="540" y="160" text-anchor="middle" font-size="9.5" class="muted">待機中</text>

        <line x1="300" y1="74" x2="180" y2="120" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowHs)" />
        <line x1="400" y1="74" x2="520" y2="120" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />

        <text x="350" y="200" text-anchor="middle" font-size="11.5" class="muted">
          PCは仮想IP宛に送るだけで、実際に転送しているのがR1かR2かを意識しない
        </text>

        <line x1="0" y1="220" x2="700" y2="220" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 障害時 ============ -->
        <text x="350" y="248" text-anchor="middle" font-size="13" font-weight="700">R1障害時 ― R2が仮想IP/仮想MACを引き継ぐ</text>

        <rect x="270" y="260" width="160" height="44" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="280" text-anchor="middle" font-size="12">PC</text>
        <text x="350" y="296" text-anchor="middle" font-size="9.5" class="muted">GW: 192.168.1.1(仮想・不変)</text>

        <rect x="80" y="350" width="160" height="50" rx="7" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4" />
        <text x="160" y="372" text-anchor="middle" font-size="12" class="muted">R1(停止)</text>
        <text x="205" y="358" font-size="13" style="fill: var(--muted)">×</text>

        <rect x="460" y="350" width="160" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="540" y="372" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">R2(Activeへ昇格)</text>
        <text x="540" y="390" text-anchor="middle" font-size="9.5" style="fill: var(--primary)">仮想IP/仮想MACを引き継ぐ</text>

        <line x1="300" y1="304" x2="180" y2="350" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" />
        <line x1="400" y1="304" x2="520" y2="350" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#arrowHs)" />
      </svg>
    </div>
  </body>
</html>
