<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 270" role="img" aria-label="人間中心設計の4つの活動を輪にした図。左上の利用状況の把握と理解から時計回りに、要求事項の明確化、設計による解決、評価へと進む。評価が要求を満たしていれば完了だが、満たしていなければ矢印が前の活動へ戻ってもう一周する。戻り先は評価で何が分かったかによって変わり、操作に迷うだけなら設計へ、要求の取り違えなら要求事項へ、そもそも利用者の状況を誤解していたなら把握と理解まで戻る。一度作って終わりにしないことが図の要点。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="40" y="40" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="140" y="66" text-anchor="middle" font-size="11.5">① 利用状況の把握・理解</text>
        <text x="140" y="86" text-anchor="middle" font-size="10" class="muted">誰が、どこで、何のために</text>

        <rect x="400" y="40" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="500" y="66" text-anchor="middle" font-size="11.5">② 要求事項の明確化</text>
        <text x="500" y="86" text-anchor="middle" font-size="10" class="muted">満たすべきことを言語化</text>

        <rect x="400" y="160" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="500" y="186" text-anchor="middle" font-size="11.5">③ 設計による解決</text>
        <text x="500" y="206" text-anchor="middle" font-size="10" class="muted">案を作り、形にする</text>

        <rect x="40" y="160" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="140" y="186" text-anchor="middle" font-size="11.5">④ 評価</text>
        <text x="140" y="206" text-anchor="middle" font-size="10" class="muted">要求を満たしたか確かめる</text>

        <line x1="240" y1="70" x2="396" y2="70" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <line x1="500" y1="100" x2="500" y2="156" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />
        <line x1="400" y1="190" x2="244" y2="190" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" />

        <path d="M140 160 L140 130 L500 130 L500 104" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arp)" />
        <text x="320" y="124" text-anchor="middle" font-size="10" class="lbl">要求の取り違え → ②へ</text>
        <path d="M110 160 L110 116 L70 116 L70 104" fill="none" stroke="var(--primary)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arp)" />
        <text x="30" y="130" font-size="10" class="lbl">状況の誤解 → ①へ</text>

        <text x="320" y="248" text-anchor="middle" font-size="10.5" class="muted">評価は終点ではなく折り返し ― 戻り先は「何が分かったか」で変わる</text>
      </svg>
    </div>
  </body>
</html>
