<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 260"
        role="img"
        aria-label="スタティックルートの設定例。行き止まりのスタブネットワーク側のR1は0.0.0.0/0のデフォルトルートだけでR2経由の全通信をまかない、集約する側のR2は192.168.1.0/24宛だけを明示的にR1経由と指定するスタティックルートを持つ。"
      >
        <defs>
          <marker
            id="arrowS"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="20" y="40" width="140" height="55" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="63" text-anchor="middle" font-size="12.5" font-weight="600">LAN A</text>
        <text x="90" y="80" text-anchor="middle" font-size="10.5" class="muted mono">192.168.1.0/24</text>

        <rect x="210" y="40" width="110" height="55" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="265" y="72" text-anchor="middle" font-size="13" font-weight="600">R1(スタブ側)</text>

        <rect x="420" y="40" width="110" height="55" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="475" y="72" text-anchor="middle" font-size="13" font-weight="600">R2</text>

        <rect x="610" y="40" width="140" height="55" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="680" y="63" text-anchor="middle" font-size="12" font-weight="600">その他の</text>
        <text x="680" y="80" text-anchor="middle" font-size="12" font-weight="600">ネットワーク(多数)</text>

        <line x1="160" y1="67" x2="210" y2="67" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowS)" />
        <line x1="320" y1="67" x2="420" y2="67" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowS)" />
        <line x1="530" y1="67" x2="610" y2="67" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowS)" />

        <line x1="265" y1="95" x2="265" y2="135" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" />
        <rect x="150" y="140" width="230" height="90" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="265" y="160" text-anchor="middle" font-size="10.5" class="muted">R1のルーティングテーブル</text>
        <text x="265" y="180" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">0.0.0.0/0 → R2経由</text>
        <text x="265" y="198" text-anchor="middle" font-size="10" class="muted">デフォルトルート1本で</text>
        <text x="265" y="213" text-anchor="middle" font-size="10" class="muted">その先の全宛先をカバー</text>

        <line x1="475" y1="95" x2="475" y2="135" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" />
        <rect x="360" y="140" width="230" height="90" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.3" />
        <text x="475" y="160" text-anchor="middle" font-size="10.5" class="muted">R2のルーティングテーブル</text>
        <text x="475" y="180" text-anchor="middle" font-size="12" class="mono" style="fill: var(--primary)">192.168.1.0/24 → R1経由</text>
        <text x="475" y="198" text-anchor="middle" font-size="10" class="muted">LAN A宛だけを名指しした</text>
        <text x="475" y="213" text-anchor="middle" font-size="10" class="muted">明示的なスタティックルート</text>
      </svg>
    </div>
  </body>
</html>
