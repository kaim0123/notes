<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 340"
        role="img"
        aria-label="RAID 0・1・5でデータが3台のディスクにどう置かれるかを並べた図。RAID 0はデータを分散して書くだけなので速いが冗長性が無く、1台失うと全体が読めなくなる。RAID 1は同じ内容を丸ごと複製するので1台失っても残りで読めるが、使える容量は半分になる。RAID 5はデータとパリティを分散して置き、どの1台が失われても残り2台から復元できるうえ、容量の目減りは1台分で済む。いずれも同時に消えたファイルは戻らないため、バックアップの代わりにはならない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11" class="muted">A・B・Cはデータの断片、Pはパリティ(復元用の計算値)</text>

        <text x="20" y="82" font-size="12">RAID 0</text>
        <text x="20" y="100" font-size="9.5" class="muted">ストライピング</text>
        <rect x="130" y="48" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="200" y="66" font-size="9.5" text-anchor="middle" class="muted">ディスク1</text>
        <rect x="142" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="168" y="92" font-size="11" text-anchor="middle">A1</text>
        <rect x="206" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="232" y="92" font-size="11" text-anchor="middle">B1</text>
        <rect x="290" y="48" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="360" y="66" font-size="9.5" text-anchor="middle" class="muted">ディスク2</text>
        <rect x="302" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="328" y="92" font-size="11" text-anchor="middle">A2</text>
        <rect x="366" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="392" y="92" font-size="11" text-anchor="middle">B2</text>
        <rect x="450" y="48" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="66" font-size="9.5" text-anchor="middle" class="muted">ディスク3</text>
        <rect x="462" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="488" y="92" font-size="11" text-anchor="middle">A3</text>
        <rect x="526" y="74" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="552" y="92" font-size="11" text-anchor="middle">B3</text>
        <text x="606" y="80" font-size="10" class="muted">容量100% / 速い</text>
        <text x="606" y="98" font-size="10" class="accent">1台失うと全滅</text>

        <text x="20" y="182" font-size="12">RAID 1</text>
        <text x="20" y="200" font-size="9.5" class="muted">ミラーリング</text>
        <rect x="130" y="148" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="200" y="166" font-size="9.5" text-anchor="middle" class="muted">ディスク1</text>
        <rect x="142" y="174" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="168" y="192" font-size="11" text-anchor="middle">A1</text>
        <rect x="206" y="174" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="232" y="192" font-size="11" text-anchor="middle">A2</text>
        <rect x="290" y="148" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="360" y="166" font-size="9.5" text-anchor="middle" class="muted">ディスク2(複製)</text>
        <rect x="302" y="174" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="328" y="192" font-size="11" text-anchor="middle">A1</text>
        <rect x="366" y="174" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="392" y="192" font-size="11" text-anchor="middle">A2</text>
        <rect x="450" y="148" width="140" height="64" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="520" y="186" font-size="10" text-anchor="middle" class="muted">2台あれば成立</text>
        <text x="606" y="180" font-size="10" class="muted">容量50%</text>
        <text x="606" y="198" font-size="10" class="accent">1台失っても読める</text>

        <text x="20" y="282" font-size="12">RAID 5</text>
        <text x="20" y="300" font-size="9.5" class="muted">パリティ分散</text>
        <rect x="130" y="248" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="200" y="266" font-size="9.5" text-anchor="middle" class="muted">ディスク1</text>
        <rect x="142" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="168" y="292" font-size="11" text-anchor="middle">A1</text>
        <rect x="206" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" /><text x="232" y="292" font-size="11" text-anchor="middle" class="accent">P(B)</text>
        <rect x="290" y="248" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="360" y="266" font-size="9.5" text-anchor="middle" class="muted">ディスク2</text>
        <rect x="302" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="328" y="292" font-size="11" text-anchor="middle">A2</text>
        <rect x="366" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="392" y="292" font-size="11" text-anchor="middle">B1</text>
        <rect x="450" y="248" width="140" height="64" rx="6" fill="none" stroke="var(--border)" />
        <text x="520" y="266" font-size="9.5" text-anchor="middle" class="muted">ディスク3</text>
        <rect x="462" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--primary)" /><text x="488" y="292" font-size="11" text-anchor="middle" class="accent">P(A)</text>
        <rect x="526" y="274" width="52" height="26" rx="4" fill="var(--card)" stroke="var(--border)" /><text x="552" y="292" font-size="11" text-anchor="middle">B2</text>
        <text x="606" y="280" font-size="10" class="muted">容量(N-1)台分</text>
        <text x="606" y="298" font-size="10" class="accent">1台失っても復元可</text>
      </svg>
    </div>
  </body>
</html>
