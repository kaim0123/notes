<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 200"
        role="img"
        aria-label="顧客・注文・注文明細・商品のER図。顧客と注文は1対多の関係で結ばれる。注文と商品は直接の多対多を表現できないため、主キーを「注文ID+商品ID」とし属性に「数量」を持つ中間エンティティ「注文明細」を挟んで、注文―注文明細が1対多、注文明細―商品が多対1になるよう分解して表現する。"
      >
        <!-- 顧客 -->
        <rect x="10" y="70" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="75" y="96" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">顧客</text>
        <text x="75" y="116" text-anchor="middle" font-size="10.5" class="muted">顧客ID(PK)</text>

        <!-- 注文 -->
        <rect x="210" y="70" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="275" y="96" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">注文</text>
        <text x="275" y="116" text-anchor="middle" font-size="10.5" class="muted">注文ID(PK)</text>

        <!-- 注文明細(中間エンティティ) -->
        <rect x="410" y="52" width="170" height="96" rx="8" fill="none" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="4 3" />
        <text x="495" y="76" text-anchor="middle" font-size="13" font-weight="700">注文明細</text>
        <text x="495" y="96" text-anchor="middle" font-size="10.5" class="muted">注文ID+商品ID(PK)</text>
        <text x="495" y="114" text-anchor="middle" font-size="10.5" class="muted">数量</text>
        <text x="495" y="134" text-anchor="middle" font-size="9.5" class="muted">(中間エンティティ)</text>

        <!-- 商品 -->
        <rect x="650" y="70" width="100" height="60" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="700" y="96" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">商品</text>
        <text x="700" y="116" text-anchor="middle" font-size="10.5" class="muted">商品ID(PK)</text>

        <!-- 顧客-注文 -->
        <line x1="140" y1="100" x2="208" y2="100" stroke="var(--muted)" stroke-width="1.4" />
        <text x="152" y="92" font-size="11" class="muted">1</text>
        <text x="192" y="92" font-size="11" class="muted">N</text>

        <!-- 注文-注文明細 -->
        <line x1="340" y1="100" x2="408" y2="100" stroke="var(--muted)" stroke-width="1.4" />
        <text x="350" y="92" font-size="11" class="muted">1</text>
        <text x="392" y="92" font-size="11" class="muted">N</text>

        <!-- 注文明細-商品 -->
        <line x1="580" y1="100" x2="648" y2="100" stroke="var(--muted)" stroke-width="1.4" />
        <text x="590" y="92" font-size="11" class="muted">N</text>
        <text x="632" y="92" font-size="11" class="muted">1</text>

        <text x="380" y="176" text-anchor="middle" font-size="11" class="muted">
          注文―商品の多対多を、注文明細を挟んだ2本の1対多に分解する
        </text>
      </svg>
    </div>
  </body>
</html>
