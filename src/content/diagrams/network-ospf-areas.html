<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="OSPFのエリア設計の図解。エリア1とエリア2は、それぞれABR(エリア境界ルーター)を経由してエリア0(バックボーンエリア)につながる。エリア同士が直接つながることはなく、必ずエリア0を経由する。経路情報はABRを通過する際に要約される。"
      >
        <defs>
          <marker
            id="arrowE2"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <rect x="20" y="105" width="140" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="145" text-anchor="middle" font-size="13" font-weight="600">エリア1</text>
        <text x="90" y="163" text-anchor="middle" font-size="10.5" class="muted">非バックボーン</text>

        <rect x="170" y="125" width="90" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="215" y="155" text-anchor="middle" font-size="12.5" font-weight="700" style="fill: var(--primary)">ABR</text>

        <rect x="280" y="110" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="380" y="145" text-anchor="middle" font-size="14" font-weight="700">エリア0</text>
        <text x="380" y="163" text-anchor="middle" font-size="10.5" class="muted">バックボーンエリア</text>

        <rect x="500" y="125" width="90" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="545" y="155" text-anchor="middle" font-size="12.5" font-weight="700" style="fill: var(--primary)">ABR</text>

        <rect x="600" y="105" width="140" height="90" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="670" y="145" text-anchor="middle" font-size="13" font-weight="600">エリア2</text>
        <text x="670" y="163" text-anchor="middle" font-size="10.5" class="muted">非バックボーン</text>

        <line x1="160" y1="150" x2="170" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowE2)" />
        <line x1="260" y1="150" x2="280" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowE2)" />
        <line x1="480" y1="150" x2="500" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowE2)" />
        <line x1="590" y1="150" x2="600" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowE2)" />

        <text x="380" y="235" text-anchor="middle" font-size="11.5" class="muted">
          非バックボーンエリアは必ずエリア0につながる ― エリア同士が直接つながることはない
        </text>
        <text x="380" y="255" text-anchor="middle" font-size="11.5" class="muted">
          経路情報はABRを通過するときに要約(集約)され、エリアをまたぐ情報量を抑える
        </text>
      </svg>
    </div>
  </body>
</html>
