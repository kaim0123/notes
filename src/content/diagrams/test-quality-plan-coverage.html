<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 340"
        role="img"
        aria-label="品質計画が並べる9つの観点を、3つのまとまりに分けて示した図。1つ目のまとまりはコードの正しさで、静的解析が型と構文を、ユニットテストがロジックを、E2Eテストが画面をまたぐ動線を担当する。2つ目のまとまりは体験の質で、アクセシビリティ検査が支援技術での操作を、ビジュアル回帰が見た目の崩れを、性能計測が表示速度を担当する。3つ目のまとまりは取り込んだものと配るもので、依存関係の脆弱性検査が使っているライブラリを、バンドルサイズ予算が配信するJavaScriptの量を、リンクとsitemapの検査が検索流入の経路を担当する。9つはすべて別の壊れ方に対応しており、1つの手法で全部をカバーすることはできない。下部には、これらをCIのパイプラインに載せて毎回自動で走らせて初めて計画として機能する、と記されている。"
      >
        <text x="16" y="28" font-size="11" class="muted">「壊れる」の中身は1種類ではない。壊れ方ごとに担当を割り当てる</text>

        <rect x="16" y="42" width="220" height="180" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="64" font-size="11">コードの正しさ</text>
        <rect x="30" y="76" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="42" y="93" font-size="10">静的解析</text>
        <text x="42" y="109" font-size="9" class="muted">型・構文・危険なパターン</text>
        <rect x="30" y="122" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="42" y="139" font-size="10">ユニットテスト</text>
        <text x="42" y="155" font-size="9" class="muted">ロジックの回帰</text>
        <rect x="30" y="168" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="42" y="185" font-size="10">E2Eテスト</text>
        <text x="42" y="201" font-size="9" class="muted">画面をまたぐ動線</text>

        <rect x="248" y="42" width="220" height="180" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="262" y="64" font-size="11">体験の質</text>
        <rect x="262" y="76" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="274" y="93" font-size="10">アクセシビリティ検査</text>
        <text x="274" y="109" font-size="9" class="muted">支援技術で操作できるか</text>
        <rect x="262" y="122" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="274" y="139" font-size="10">ビジュアル回帰</text>
        <text x="274" y="155" font-size="9" class="muted">意図しない見た目の変化</text>
        <rect x="262" y="168" width="192" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="274" y="185" font-size="10">性能計測</text>
        <text x="274" y="201" font-size="9" class="muted">表示速度・応答</text>

        <rect x="480" y="42" width="204" height="180" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="494" y="64" font-size="11">取り込んだもの・配るもの</text>
        <rect x="494" y="76" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="506" y="93" font-size="10">依存の脆弱性検査</text>
        <text x="506" y="109" font-size="9" class="muted">自分が書いていないコード</text>
        <rect x="494" y="122" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="506" y="139" font-size="10">バンドルサイズ予算</text>
        <text x="506" y="155" font-size="9" class="muted">配信するJSの量</text>
        <rect x="494" y="168" width="176" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="506" y="185" font-size="10">リンク・sitemap</text>
        <text x="506" y="201" font-size="9" class="muted">検索流入の経路</text>

        <rect x="16" y="240" width="668" height="40" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="350" y="265" font-size="11" text-anchor="middle" class="accent">CI/CDのパイプラインで束ねる ― 毎回、全部、自動で</text>

        <line x1="16" y1="300" x2="684" y2="300" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="320" font-size="10.5" class="muted">9つはすべて別の壊れ方に対応する。どれか1つで全部をカバーすることはできない。</text>
        <text x="16" y="336" font-size="10.5" class="accent">手で回せる数を超えているので、自動で走る状態にして初めて「計画」になる。</text>
      </svg>
    </div>
  </body>
</html>
