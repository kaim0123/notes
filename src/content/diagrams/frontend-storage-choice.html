<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 330" role="img" aria-label="保存先を決める判断の流れを上から下へ示した図。最初の問いはサーバーが知る必要があるか。はいならCookieで、認証に関わるものはHttpOnly属性を付けてJavaScriptから読めなくする。いいえなら次の問いは共有やリロードで復元したいか。はいならURLのクエリパラメータに置く。いいえなら次の問いはタブを閉じたら消えてほしいか。はいならsessionStorage。いいえなら最後の問いは5MBを超えるかバイナリか。はいならIndexedDB、いいえならlocalStorage。図の下に、いずれの場合も失われて困るデータはサーバーにも置くという前提が注記されている。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <rect x="20" y="20" width="248" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="45" font-size="11.5">サーバーが知る必要があるか?</text>
        <line x1="268" y1="40" x2="356" y2="40" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="312" y="32" text-anchor="middle" font-size="10" class="lbl">はい</text>
        <rect x="360" y="20" width="260" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="376" y="45" font-size="11.5">Cookie ― 認証系は HttpOnly</text>

        <line x1="144" y1="60" x2="144" y2="88" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="156" y="80" font-size="10" class="muted">いいえ</text>

        <rect x="20" y="92" width="248" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="117" font-size="11.5">共有・リロードで復元したいか?</text>
        <line x1="268" y1="112" x2="356" y2="112" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="312" y="104" text-anchor="middle" font-size="10" class="lbl">はい</text>
        <rect x="360" y="92" width="260" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="376" y="117" font-size="11.5">URL(クエリパラメータ)</text>

        <line x1="144" y1="132" x2="144" y2="160" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="156" y="152" font-size="10" class="muted">いいえ</text>

        <rect x="20" y="164" width="248" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="189" font-size="11.5">タブを閉じたら消したいか?</text>
        <line x1="268" y1="184" x2="356" y2="184" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="312" y="176" text-anchor="middle" font-size="10" class="lbl">はい</text>
        <rect x="360" y="164" width="260" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="376" y="189" font-size="11.5">sessionStorage</text>

        <line x1="144" y1="204" x2="144" y2="232" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="156" y="224" font-size="10" class="muted">いいえ</text>

        <rect x="20" y="236" width="248" height="40" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="36" y="261" font-size="11.5">5MB超 / バイナリ / 検索が要るか?</text>
        <line x1="268" y1="256" x2="356" y2="256" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="312" y="248" text-anchor="middle" font-size="10" class="lbl">はい</text>
        <rect x="360" y="236" width="260" height="40" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="376" y="261" font-size="11.5">IndexedDB</text>
        <line x1="268" y1="266" x2="356" y2="296" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#ar)" />
        <text x="300" y="292" font-size="10" class="muted">いいえ</text>
        <rect x="360" y="286" width="260" height="34" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="376" y="308" font-size="11.5">localStorage</text>

        <text x="20" y="308" font-size="10.5" class="lbl">どの枝でも、失われて困る</text>
        <text x="20" y="324" font-size="10.5" class="lbl">データはサーバーにも置く</text>
      </svg>
    </div>
  </body>
</html>
