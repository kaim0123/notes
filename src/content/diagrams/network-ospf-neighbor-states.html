<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 1010 320"
        role="img"
        aria-label="OSPFネイバーステートマシンの図解。Down、Init、2-Way、ExStart、Exchange、Loading、Fullの順に状態が進む。ExStartとExchangeの間でMTU不一致によりDBD交換に失敗して詰まることが多い。"
      >
        <defs>
          <marker
            id="arrowN"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <text x="505" y="20" text-anchor="middle" font-size="13" font-weight="700">OSPFネイバーステートマシン</text>

        <rect x="30" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="90" y="75" text-anchor="middle" font-size="12.5" font-weight="600">Down</text>
        <text x="90" y="112" text-anchor="middle" font-size="10" class="muted">まだ認識前</text>

        <rect x="170" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="230" y="75" text-anchor="middle" font-size="12.5" font-weight="600">Init</text>
        <text x="230" y="112" text-anchor="middle" font-size="10" class="muted">Helloを受信(片方向)</text>

        <rect x="310" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="370" y="75" text-anchor="middle" font-size="12.5" font-weight="600">2-Way</text>
        <text x="370" y="112" text-anchor="middle" font-size="10" class="muted">双方向でHello確認</text>
        <text x="370" y="127" text-anchor="middle" font-size="9" class="muted">(非DR/BDR同士は正常)</text>

        <rect x="450" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="510" y="75" text-anchor="middle" font-size="12.5" font-weight="600">ExStart</text>
        <text x="510" y="112" text-anchor="middle" font-size="10" class="muted">マスタ/スレーブ決定</text>

        <rect x="590" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="650" y="75" text-anchor="middle" font-size="12.5" font-weight="600">Exchange</text>
        <text x="650" y="112" text-anchor="middle" font-size="10" class="muted">DBD(要約)を交換</text>

        <rect x="730" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="790" y="75" text-anchor="middle" font-size="12.5" font-weight="600">Loading</text>
        <text x="790" y="112" text-anchor="middle" font-size="10" class="muted">LSAの詳細を取得</text>

        <rect x="870" y="45" width="120" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="930" y="75" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">Full</text>
        <text x="930" y="112" text-anchor="middle" font-size="10" class="muted">LSDB完全同期</text>

        <line x1="150" y1="70" x2="170" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />
        <line x1="290" y1="70" x2="310" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />
        <line x1="430" y1="70" x2="450" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />
        <line x1="570" y1="70" x2="590" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />
        <line x1="710" y1="70" x2="730" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />
        <line x1="850" y1="70" x2="870" y2="70" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowN)" />

        <line x1="510" y1="95" x2="510" y2="220" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <line x1="650" y1="95" x2="650" y2="220" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" />
        <rect x="440" y="225" width="280" height="60" rx="7" fill="var(--card)" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="580" y="248" text-anchor="middle" font-size="11.5" class="muted">詰まりやすい原因</text>
        <text x="580" y="266" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">MTU不一致 ― DBD交換に失敗する</text>

        <text x="505" y="310" text-anchor="middle" font-size="11.5" class="muted">
          どの状態で止まっているかを見れば、原因を絞り込める
        </text>
      </svg>
    </div>
  </body>
</html>
