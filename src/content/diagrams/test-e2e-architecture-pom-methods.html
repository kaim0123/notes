<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="Page Objectに作ってよいメソッドが3種類しかないことと、そこに収まらないものの行き先を示した図。上段に3つ並ぶ。1つ目は取得で、asyncを付けずLocatorをそのまま返すだけのもの。待機も操作もしない。2つ目は操作で、asyncを付け動詞で始まり、戻り値を持たず1手順だけを実行する。3つ目は問い合わせで、asyncを付け画面から読み取った値を返すが、判定そのものはしない。この3つはasyncの有無と戻り値の型だけで見分けられる。下段は、ダイアログの中身によって処理を分けるような分岐を含む手順で、これは3種類のどれにも当てはまらない。その行き先はPage Objectではなく、業務フローを置くComposableである。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="22" font-size="11" class="muted">asyncの有無と戻り値の型だけで、どの種類かが見分けられる</text>

        <rect x="16" y="34" width="196" height="132" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="56" font-size="10.5">1. 取得</text>
        <text x="30" y="78" font-size="8.5" class="mono muted">getRow(): Locator</text>
        <text x="30" y="102" font-size="9" class="muted">asyncを付けない</text>
        <text x="30" y="120" font-size="9" class="muted">Locatorを返すだけ</text>
        <text x="30" y="144" font-size="9" class="muted">待機も操作もしない</text>

        <rect x="222" y="34" width="196" height="132" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="236" y="56" font-size="10.5">2. 操作</text>
        <text x="236" y="78" font-size="8.5" class="mono muted">async clickSave()</text>
        <text x="236" y="102" font-size="9" class="muted">動詞で始める</text>
        <text x="236" y="120" font-size="9" class="muted">戻り値を持たない</text>
        <text x="236" y="144" font-size="9" class="muted">1手順だけを実行する</text>

        <rect x="428" y="34" width="196" height="132" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="442" y="56" font-size="10.5">3. 問い合わせ</text>
        <text x="442" y="78" font-size="8.5" class="mono muted">async getCount()</text>
        <text x="442" y="102" font-size="9" class="muted">画面から値を読む</text>
        <text x="442" y="120" font-size="9" class="muted">値を返して終わり</text>
        <text x="442" y="144" font-size="9" class="muted">判定はテスト本体の仕事</text>

        <rect x="16" y="186" width="356" height="54" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="4 3" />
        <text x="30" y="208" font-size="10">分岐や条件を含む手順</text>
        <text x="30" y="228" font-size="9" class="muted">「ダイアログの中身によって処理を変える」 ― 3種類のどれでもない</text>

        <line x1="378" y1="213" x2="424" y2="213" stroke="var(--primary)" stroke-width="1.3" marker-end="url(#arp)" />
        <text x="382" y="203" font-size="8.5" class="accent">出す</text>

        <rect x="432" y="186" width="192" height="54" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="528" y="209" font-size="10.5" text-anchor="middle" class="accent">Composable へ</text>
        <text x="528" y="229" font-size="9" text-anchor="middle" class="muted">業務フローの置き場所</text>

        <line x1="16" y1="262" x2="624" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="282" font-size="10.5" class="muted">3種類に収まらないメソッドが生えてきたら、それはPage Objectの仕事ではないという合図。</text>
      </svg>
    </div>
  </body>
</html>
