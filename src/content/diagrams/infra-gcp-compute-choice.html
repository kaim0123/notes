<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="処理を動かす場所を、何を単位に動かすかで3つに分けた図。1つ目は常に動かし続ける形で、仮想マシンを自分で用意し、止めない限り課金が続く。常駐する処理や特殊な環境が要るものに向く。2つ目はリクエストを受けたときだけ動かす形で、コンテナを置いておくと呼ばれた分だけ起動し、呼ばれない間はゼロまで縮む。3つ目は出来事が起きたときだけ動かす形で、関数を置いておくと保存先へのファイル追加や通知をきっかけに実行される。常駐が要るか、要求が来たときだけでよいか、出来事に反応するだけかで選ぶ。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="230" height="150" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="72" font-size="11.5" text-anchor="middle">常に動かす</text>
        <text x="135" y="96" font-size="9.5" text-anchor="middle" class="muted">仮想マシンを自分で用意する</text>
        <text x="135" y="122" font-size="9.5" text-anchor="middle" class="muted">止めない限り課金が続く</text>
        <text x="135" y="150" font-size="10" text-anchor="middle" class="accent">常駐する処理</text>
        <text x="135" y="172" font-size="9.5" text-anchor="middle" class="muted">特殊な環境・独自のミドルウェア</text>

        <rect x="265" y="46" width="230" height="150" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="380" y="72" font-size="11.5" text-anchor="middle">要求が来たら動かす</text>
        <text x="380" y="96" font-size="9.5" text-anchor="middle" class="muted">コンテナを置いておくだけ</text>
        <text x="380" y="122" font-size="9.5" text-anchor="middle" class="muted">呼ばれない間はゼロまで縮む</text>
        <text x="380" y="150" font-size="10" text-anchor="middle" class="accent">Webサービスの既定</text>
        <text x="380" y="172" font-size="9.5" text-anchor="middle" class="muted">イメージがあれば、そのまま載る</text>

        <rect x="510" y="46" width="230" height="150" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="625" y="72" font-size="11.5" text-anchor="middle">出来事に反応する</text>
        <text x="625" y="96" font-size="9.5" text-anchor="middle" class="muted">関数を置いておく</text>
        <text x="625" y="122" font-size="9.5" text-anchor="middle" class="muted">ファイル追加・通知が契機</text>
        <text x="625" y="150" font-size="10" text-anchor="middle" class="accent">つなぎの小さな処理</text>
        <text x="625" y="172" font-size="9.5" text-anchor="middle" class="muted">1つのことだけをする</text>

        <text x="20" y="236" font-size="10.5" class="muted">問い ― 常駐が要るか / 要求が来たときだけでよいか / 出来事に反応するだけか。</text>
        <text x="20" y="258" font-size="10.5" class="muted">右へ行くほど運用は軽く、左へ行くほど自由が利く。迷ったら中央から始める。</text>
      </svg>
    </div>
  </body>
</html>
