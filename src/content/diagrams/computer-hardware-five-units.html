<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 430"
        role="img"
        aria-label="五大装置の関係図。入力装置から記憶装置へデータが流れ込み、記憶装置と演算装置の間でデータと命令をやり取りしながら計算し、結果を記憶装置経由で出力装置へ送る。制御装置は入力・記憶・出力の各装置へ破線の制御信号を送って全体の動作タイミングを指揮する。演算装置と制御装置を合わせたものがCPU。"
      >
        <defs>
          <marker
            id="arrowA"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
          <marker
            id="arrowB"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="5.5"
            markerHeight="5.5"
            orient="auto-start-reverse"
          >
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <!-- 入力装置 -->
        <rect x="20" y="20" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="95" y="45" text-anchor="middle" font-size="14" font-weight="600">入力装置</text>
        <text x="95" y="65" text-anchor="middle" font-size="11" class="muted">キーボード・マウス</text>

        <!-- 出力装置 -->
        <rect x="590" y="20" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="665" y="45" text-anchor="middle" font-size="14" font-weight="600">出力装置</text>
        <text x="665" y="65" text-anchor="middle" font-size="11" class="muted">ディスプレイ</text>

        <!-- 記憶装置(主記憶) -->
        <rect x="290" y="150" width="180" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="380" y="180" text-anchor="middle" font-size="14" font-weight="600">記憶装置(主記憶)</text>
        <text x="380" y="200" text-anchor="middle" font-size="11" class="muted">プログラムとデータ</text>

        <!-- CPU グループ枠 -->
        <rect x="250" y="270" width="260" height="140" rx="10" fill="none" stroke="var(--border)" stroke-dasharray="5 4" />
        <text x="264" y="292" font-size="12" class="muted">CPU</text>

        <!-- 制御装置 -->
        <rect x="270" y="300" width="100" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="320" y="326" text-anchor="middle" font-size="13" font-weight="600">制御装置</text>
        <text x="320" y="344" text-anchor="middle" font-size="10.5" class="muted">タイミング指示</text>

        <!-- 演算装置(ALU) -->
        <rect x="390" y="300" width="100" height="60" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="440" y="326" text-anchor="middle" font-size="13" font-weight="600">演算装置</text>
        <text x="440" y="344" text-anchor="middle" font-size="10.5" class="muted">ALU・四則演算</text>

        <!-- データ経路(実線) -->
        <line x1="95" y1="80" x2="308" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowA)" />
        <text x="150" y="110" font-size="11.5" class="muted">データ</text>

        <line x1="452" y1="150" x2="665" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowA)" />
        <text x="560" y="110" font-size="11.5" class="muted">データ</text>

        <line x1="440" y1="300" x2="440" y2="220" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowA)" marker-start="url(#arrowA)" />
        <text x="450" y="262" font-size="11.5" class="muted">データ</text>

        <line x1="320" y1="300" x2="320" y2="220" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arrowA)" />
        <text x="230" y="262" font-size="11.5" class="muted">命令</text>

        <!-- 制御信号(破線) -->
        <path d="M270,305 C 180,270 120,160 95,85" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowB)" />
        <path d="M490,305 C 580,270 640,160 665,85" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowB)" />
        <text x="150" y="255" font-size="11" class="muted">制御信号</text>
        <text x="590" y="255" font-size="11" class="muted">制御信号</text>
      </svg>
    </div>
  </body>
</html>
