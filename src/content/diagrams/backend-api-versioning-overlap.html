<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; padding: 8px; }
      svg {
        width: 100%; height: auto; max-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .lbl { fill: var(--primary); }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 640 300" role="img" aria-label="新旧のクライアントが必ず共存することを示した時間軸の図。横軸が時間で、中央の縦の線がAPIをデプロイした瞬間を表す。その線の上に4種類のクライアントの寿命が帯として並ぶ。ローリングデプロイ中の旧サーバーはデプロイ直後の数分だけ残る。利用者が開いたままのタブは数時間残る。モバイルアプリは数週間から数年にわたって古い版が使われ続ける。外部の利用者にいたっては、いつ直してくれるか分からないため帯の右端が矢印で開いたままになっている。どの帯もデプロイの線をまたいでいることが要点で、切り替えの瞬間というものは存在せず、新旧が同時に動く期間が必ずあることを示している。">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="24" font-size="11.5" class="muted">「切り替えの瞬間」は存在しない</text>

        <line x1="230" y1="40" x2="230" y2="238" stroke="var(--primary)" stroke-width="1.8" />
        <text x="238" y="54" font-size="10.5" class="lbl">APIをデプロイした瞬間</text>

        <line x1="16" y1="252" x2="616" y2="252" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="590" y="272" font-size="10" class="muted">時間</text>

        <text x="16" y="82" font-size="10" class="muted">旧サーバー(デプロイ中)</text>
        <rect x="150" y="88" width="120" height="18" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="278" y="101" font-size="9.5" class="muted">数分</text>

        <text x="16" y="130" font-size="10" class="muted">開いたままのタブ</text>
        <rect x="120" y="136" width="220" height="18" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="348" y="149" font-size="9.5" class="muted">数時間</text>

        <text x="16" y="178" font-size="10" class="muted">モバイルアプリ</text>
        <rect x="60" y="184" width="430" height="18" rx="4" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />
        <text x="498" y="197" font-size="9.5" class="lbl">数週間〜数年</text>

        <text x="16" y="226" font-size="10" class="muted">外部の利用者</text>
        <rect x="60" y="232" width="500" height="18" rx="4" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-dasharray="5 4" />
        <line x1="560" y1="241" x2="600" y2="241" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#ar)" />
        <text x="404" y="245" font-size="9.5" class="lbl">いつ直るか分からない</text>

        <text x="16" y="288" font-size="10.5" class="muted">どの帯もデプロイの線をまたぐ ― 新旧が同時に動く期間は、必ずある。</text>
      </svg>
    </div>
  </body>
</html>
