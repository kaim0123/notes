<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 420"
        role="img"
        aria-label="EtherChannelの図解。束ねていない場合、STPは2本の物理リンクを別々のループとみなし片方をブロッキングにするため帯域を活かせない。EtherChannelで束ねると論理的には1本のリンクに見えるためSTPはループとみなさず、両方の物理リンクを同時に使って帯域を合算できる。"
      >
        <!-- ============ 束ねない場合 ============ -->
        <text x="320" y="20" text-anchor="middle" font-size="13" font-weight="700">
          束ねない場合 ― STPが2本を別々のリンクとみなす
        </text>

        <rect x="60" y="65" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="95" text-anchor="middle" font-size="12.5" font-weight="600">SW1</text>
        <rect x="480" y="65" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="95" text-anchor="middle" font-size="12.5" font-weight="600">SW2</text>

        <line x1="160" y1="80" x2="480" y2="80" stroke="var(--fg)" stroke-width="1.6" />
        <text x="320" y="72" text-anchor="middle" font-size="10" class="muted">Gi0/1(Forwarding)</text>

        <line x1="160" y1="105" x2="480" y2="105" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" />
        <text x="320" y="122" text-anchor="middle" font-size="10" class="muted">Gi0/2(STPがBLKにする)</text>

        <text x="320" y="160" text-anchor="middle" font-size="11.5" class="muted">
          物理的に2本あってもSTPからはループ状に見え、片方が塞がれて帯域を活かせない
        </text>

        <line x1="0" y1="190" x2="640" y2="190" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 束ねた場合 ============ -->
        <text x="320" y="216" text-anchor="middle" font-size="13" font-weight="700">
          EtherChannelで束ねた場合 ― 論理的には1本のリンク
        </text>

        <rect x="60" y="260" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="110" y="290" text-anchor="middle" font-size="12.5" font-weight="600">SW1</text>
        <rect x="480" y="260" width="100" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="530" y="290" text-anchor="middle" font-size="12.5" font-weight="600">SW2</text>

        <line x1="160" y1="278" x2="480" y2="278" stroke="var(--primary)" stroke-width="1.8" />
        <line x1="160" y1="292" x2="480" y2="292" stroke="var(--primary)" stroke-width="1.8" />

        <rect x="260" y="320" width="120" height="30" rx="15" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="320" y="340" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--primary)">Port-channel1</text>

        <text x="320" y="385" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">
          STPからはループに見えないため両方とも使え、帯域が合算される(この例なら2倍)
        </text>
      </svg>
    </div>
  </body>
</html>
