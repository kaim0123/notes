<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="APIを提供する側と利用する側の期待がずれる仕組みと、契約テストがそれをどこで捕まえるかを示した図。上段では、提供側が自分のテストで自分の実装を確かめ、利用側が模倣した応答を相手だと思い込んでテストしている。どちらのテストも緑になるが、両者が見ているものは一度も突き合わされていない。提供側が応答の項目名を変えても、利用側の模倣は古いままなので、双方緑のまま本番で壊れる。下段では、応答の形そのものを契約として1か所に置き、提供側は自分の実装がその契約を満たすかを、利用側は自分の模倣がその契約に沿っているかを、それぞれ同じ契約に対して検証する。契約が変わればどちらかのテストが落ちるため、本番より前にずれが表面化する。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11" class="muted">契約テストが無い場合 ― 双方が緑のまま、本番で壊れる</text>

        <rect x="16" y="40" width="270" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="60" font-size="10">提供側 ― 自分の実装をテスト</text>
        <text x="30" y="80" font-size="9" class="muted">応答の項目名を変えた。テストも直した。緑</text>

        <rect x="354" y="40" width="270" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="368" y="60" font-size="10">利用側 ― 模倣した応答でテスト</text>
        <text x="368" y="80" font-size="9" class="muted">模倣は古い項目名のまま。こちらも緑</text>

        <line x1="290" y1="66" x2="350" y2="66" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 4" />
        <text x="320" y="110" font-size="9.5" text-anchor="middle" class="muted">一度も突き合わされていない</text>

        <line x1="16" y1="128" x2="624" y2="128" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="152" font-size="11" class="accent">契約テストがある場合 ― 同じ契約に、両側から当てる</text>

        <rect x="16" y="168" width="230" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="188" font-size="10">提供側の実装</text>
        <text x="30" y="208" font-size="9" class="muted">契約を満たすかを検証</text>

        <rect x="394" y="168" width="230" height="52" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="408" y="188" font-size="10">利用側の模倣</text>
        <text x="408" y="208" font-size="9" class="muted">契約に沿っているかを検証</text>

        <rect x="262" y="160" width="116" height="68" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="320" y="186" font-size="10" text-anchor="middle" class="accent">契約</text>
        <text x="320" y="204" font-size="9" text-anchor="middle" class="muted">応答の形を</text>
        <text x="320" y="218" font-size="9" text-anchor="middle" class="muted">1か所に置く</text>

        <line x1="250" y1="194" x2="256" y2="194" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="390" y1="194" x2="384" y2="194" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <line x1="16" y1="252" x2="624" y2="252" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="272" font-size="10.5" class="muted">模倣は「自分が想定した相手」との会話を再現するだけ。相手が変わっても、それを教えてはくれない。</text>
        <text x="16" y="294" font-size="10.5" class="accent">契約が変われば、どちらかのテストが落ちる ― 本番より前に、ずれが表面化する。</text>
        <text x="16" y="314" font-size="9.5" class="muted">相手が外部サービスなら、契約の代わりにスキーマを定期的に取得して突き合わせる。</text>
      </svg>
    </div>
  </body>
</html>
