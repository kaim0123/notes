<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="ヘルスチェックが何を答えるかによって、結果の意味が変わることを示した図。左は自分のプロセスが生きているかだけを返す形で、データベースにつながらず何も処理できない状態でも正常と答えてしまう。右は依存しているデータベースや外部APIの状態まで確かめて返す形で、どこが不健全かを構造化して答えられるため、切り分けがエンドポイントを叩くだけで済む。ただし依存先まで見る形にすると、外部の一時的な不調で自分まで切り離されることがあるため、振り分けから外す判断に使うものと、再起動の判断に使うものは分けて設計する。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="175" y="26" font-size="11.5" text-anchor="middle" class="muted">自分だけを見る</text>
        <rect x="30" y="46" width="290" height="56" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="175" y="70" font-size="10.5" text-anchor="middle" class="mono">GET /health → 200 OK</text>
        <text x="175" y="90" font-size="9.5" text-anchor="middle" class="muted">プロセスが生きていれば200を返す</text>
        <rect x="30" y="118" width="290" height="70" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="175" y="142" font-size="10" text-anchor="middle" class="muted">DBに接続できず</text>
        <text x="175" y="160" font-size="10" text-anchor="middle" class="muted">1件も処理できない状態でも</text>
        <text x="175" y="178" font-size="10.5" text-anchor="middle" class="accent">「正常」と答えてしまう</text>

        <line x1="350" y1="20" x2="350" y2="240" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="525" y="26" font-size="11.5" text-anchor="middle" class="muted">依存先まで見る</text>
        <rect x="380" y="46" width="290" height="56" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="525" y="70" font-size="10.5" text-anchor="middle" class="mono">GET /health → 503</text>
        <text x="525" y="90" font-size="9.5" text-anchor="middle" class="muted">依存先の状態も確かめて返す</text>
        <rect x="380" y="118" width="290" height="70" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="396" y="140" font-size="9.5" class="mono muted">db: ng  ― 接続できない</text>
        <text x="396" y="160" font-size="9.5" class="mono muted">payment: ok</text>
        <text x="396" y="180" font-size="9.5" class="mono muted">queue: ok  ― 滞留なし</text>

        <text x="30" y="222" font-size="10.5" class="muted">依存先まで見る形は切り分けが速い一方、外部の一時的な不調で自分まで切り離されることがある。</text>
        <text x="30" y="242" font-size="10.5" class="muted">だから「振り分けから外す判断」と「再起動する判断」は、別のチェックとして分けて設計する。</text>
      </svg>
    </div>
  </body>
</html>
