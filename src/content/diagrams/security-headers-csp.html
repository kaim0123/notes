<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="Content-Security-Policyがどこで効くかを示した図。ページの中に、自分のサイトから読み込む正規のスクリプトと、XSSで注入された攻撃者のスクリプトが並んでいる。ブラウザは実行の直前に、ヘッダで宣言された許可リストと出所を突き合わせる。自サイトの出所は許可リストにあるので実行され、攻撃者のサーバーやインラインで書かれた出所は許可リストに無いので実行が拒否される。エスケープ漏れがあってもここで止まるという保険になる一方、許可リストに書き忘れた自分のスクリプトも同じように止まるため、緩めに入れて違反レポートを見ながら段階的に締めるのが現実的な進め方になる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="42" font-size="10" class="muted">ページの中にあるスクリプト</text>
        <rect x="20" y="56" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="120" y="72" font-size="9.5" text-anchor="middle">自サイトのスクリプト</text>
        <text x="120" y="88" font-size="8.5" text-anchor="middle" class="mono muted">/assets/app.js</text>
        <rect x="20" y="116" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="120" y="132" font-size="9.5" text-anchor="middle" class="accent">注入されたスクリプト</text>
        <text x="120" y="148" font-size="8.5" text-anchor="middle" class="mono muted">evil.example/x.js</text>
        <rect x="20" y="176" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="120" y="192" font-size="9.5" text-anchor="middle">書き忘れた自分のスクリプト</text>
        <text x="120" y="208" font-size="8.5" text-anchor="middle" class="mono muted">cdn.example/lib.js</text>

        <line x1="224" y1="76" x2="286" y2="118" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="224" y1="136" x2="286" y2="136" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="224" y1="196" x2="286" y2="154" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="290" y="96" width="180" height="80" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="380" y="120" font-size="10" text-anchor="middle" class="accent">ブラウザが実行の直前に</text>
        <text x="380" y="139" font-size="10" text-anchor="middle" class="accent">許可リストと突き合わせる</text>
        <text x="380" y="160" font-size="8.5" text-anchor="middle" class="mono muted">script-src 'self'</text>

        <line x1="474" y1="120" x2="536" y2="88" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="474" y1="136" x2="536" y2="146" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="474" y1="152" x2="536" y2="200" stroke="var(--border)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="540" y="66" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="640" y="91" font-size="10" text-anchor="middle">実行される</text>
        <rect x="540" y="126" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="640" y="151" font-size="10" text-anchor="middle" class="accent">実行が拒否される</text>
        <rect x="540" y="186" width="200" height="40" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="640" y="204" font-size="10" text-anchor="middle">同じように拒否される</text>
        <text x="640" y="220" font-size="8.5" text-anchor="middle" class="muted">= 自分のサイトが壊れる</text>

        <line x1="16" y1="248" x2="744" y2="248" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="270" font-size="10.5" class="muted">CSPは出所で判断する。だからエスケープ漏れがあっても、外部から読ませる形の攻撃はここで止まる。</text>
        <text x="16" y="292" font-size="10.5" class="accent">同じ理由で、書き忘れた自分のスクリプトも止まる ― まず報告だけの設定で慣らし、段階的に締める。</text>
      </svg>
    </div>
  </body>
</html>
