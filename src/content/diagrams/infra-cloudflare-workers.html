<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 280"
        role="img"
        aria-label="リージョンで動かす関数とエッジで動かす関数の距離の違いを示した図。上段では、東京の利用者からのリクエストが遠いリージョンのデータセンターまで往復するため、処理そのものが軽くても行き帰りの時間が加わる。下段では、リクエストが届いた最寄りの拠点でそのままコードが動くため、往復の距離がほとんど無い。ただしエッジで完結できるのは、認証の判定・リダイレクト・軽い加工のように、遠くのデータベースを見に行かなくて済む処理に限られる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <text x="20" y="26" font-size="11.5" class="muted">リージョンで動かす(Lambda・Cloud Functions)</text>
        <rect x="20" y="40" width="110" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="60" font-size="10.5" text-anchor="middle">利用者</text>
        <text x="75" y="76" font-size="9" text-anchor="middle" class="muted">東京</text>
        <rect x="530" y="40" width="150" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="605" y="60" font-size="10.5" text-anchor="middle">リージョン</text>
        <text x="605" y="76" font-size="9" text-anchor="middle" class="muted">関数はここでだけ動く</text>
        <line x1="134" y1="56" x2="524" y2="56" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="524" y1="72" x2="134" y2="72" stroke="var(--muted)" marker-end="url(#ar)" />
        <text x="330" y="104" font-size="10" text-anchor="middle" class="muted">処理が軽くても、往復の時間がそのまま乗る</text>

        <line x1="20" y1="126" x2="680" y2="126" stroke="var(--border)" stroke-dasharray="4 3" />

        <text x="20" y="152" font-size="11.5" class="muted">エッジで動かす(Cloudflare Workers)</text>
        <rect x="20" y="166" width="110" height="44" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="75" y="186" font-size="10.5" text-anchor="middle">利用者</text>
        <text x="75" y="202" font-size="9" text-anchor="middle" class="muted">東京</text>
        <rect x="160" y="166" width="150" height="44" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="235" y="186" font-size="10.5" text-anchor="middle">最寄りのエッジ</text>
        <text x="235" y="202" font-size="9" text-anchor="middle" class="accent">ここでコードが動く</text>
        <line x1="134" y1="180" x2="154" y2="180" stroke="var(--primary)" marker-end="url(#arp)" />
        <line x1="154" y1="196" x2="134" y2="196" stroke="var(--primary)" marker-end="url(#arp)" />

        <rect x="530" y="166" width="150" height="44" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 3" />
        <text x="605" y="186" font-size="10.5" text-anchor="middle" class="muted">オリジン</text>
        <text x="605" y="202" font-size="9" text-anchor="middle" class="muted">必要なときだけ</text>
        <line x1="314" y1="188" x2="524" y2="188" stroke="var(--border)" stroke-dasharray="4 3" marker-end="url(#ar)" />

        <text x="20" y="242" font-size="10.5" class="muted">エッジで完結できるのは、遠くのデータを見に行かずに済む処理 ― 認証の判定・リダイレクト・</text>
        <text x="20" y="262" font-size="10.5" class="muted">画像の加工・A/Bの振り分けなど。DBを引くなら結局オリジンまで行くことになる。</text>
      </svg>
    </div>
  </body>
</html>
