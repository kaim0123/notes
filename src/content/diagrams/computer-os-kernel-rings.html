<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        color: var(--fg);
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg role="img" aria-label="Intel CPUのリングレベル。同心円が4重になっており、中心のRing 0にカーネルが位置し、外側へRing 1・Ring 2と続き、最外周のRing 3で一般アプリが動作する。番号が小さい内側ほど特権が高い。" viewBox="0 0 360 300">
      <circle cx="180" cy="150" r="140" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <circle cx="180" cy="150" r="100" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <circle cx="180" cy="150" r="60" fill="none" stroke="var(--muted)" stroke-width="1.5" />
      <circle cx="180" cy="150" r="26" fill="none" stroke="var(--primary)" stroke-width="1.5" />
      <text x="180" y="154" fill="var(--fg)" font-size="12" text-anchor="middle">Ring 0</text>
      <text x="180" y="100" fill="var(--muted)" font-size="11" text-anchor="middle">Ring 1</text>
      <text x="180" y="60" fill="var(--muted)" font-size="11" text-anchor="middle">Ring 2</text>
      <text x="180" y="22" fill="var(--muted)" font-size="11" text-anchor="middle">Ring 3</text>
      <text x="180" y="175" fill="var(--primary)" font-size="10" text-anchor="middle">カーネル</text>
      <text x="180" y="285" fill="var(--muted)" font-size="11" text-anchor="middle">最外周のRing 3で一般アプリが動作する</text>
      </svg>
    </div>
  </body>
</html>
