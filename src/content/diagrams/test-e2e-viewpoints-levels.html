<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 320"
        role="img"
        aria-label="観点と項目の抽象度の違いを、上下3段で示した図。最上段は観点で、本人以外によるキャンセルを拒否できるかという問いが置かれている。これは何の種類の不具合を心配すべきかという切り口であって、このままでは実行できない。中段はその観点を実行できる形まで分解した項目で、他人の注文をキャンセルすると403になり一覧に反映されないこと、退会済みのユーザーが実行すると401になること、期限切れのトークンで実行すると401になり再ログインを促されること、の3つに分かれている。最下段はそれぞれがそのままテストの名前になったもの。1つの観点から複数の項目が生まれるのが普通で、観点は見出し、項目はその下に並ぶ本文にあたる。観点をいったん抽象度の高いまま書き出し、そのあとで項目に分解する、というこの2段階を分けないと、いきなり具体的な操作を思いついてしまい、抜け漏れの検証が働かない。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11" class="muted">この2つを混ぜると、いきなり具体策を思いついてしまい、抜け漏れの検証が働かない</text>

        <rect x="16" y="40" width="608" height="54" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="30" y="62" font-size="10.5" class="accent">観点 ―「本人以外によるキャンセルを拒否できるか」</text>
        <text x="30" y="82" font-size="9" class="muted">心配すべき不具合の種類を示す切り口。このままでは実行できない ― 見出しにあたる</text>

        <line x1="110" y1="94" x2="110" y2="118" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="320" y1="94" x2="320" y2="118" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="530" y1="94" x2="530" y2="118" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="16" y="122" width="188" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="30" y="143" font-size="9.5">他人の注文で実行</text>
        <text x="30" y="161" font-size="9" class="muted">403。一覧にも</text>
        <text x="30" y="175" font-size="9" class="muted">反映されない</text>

        <rect x="226" y="122" width="188" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="240" y="143" font-size="9.5">退会済みの利用者が実行</text>
        <text x="240" y="161" font-size="9" class="muted">401</text>

        <rect x="436" y="122" width="188" height="58" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="450" y="143" font-size="9.5">期限切れトークンで実行</text>
        <text x="450" y="161" font-size="9" class="muted">401。再ログインを</text>
        <text x="450" y="175" font-size="9" class="muted">促す表示になる</text>

        <text x="320" y="198" font-size="9.5" text-anchor="middle" class="muted">項目 ― 実行できる操作・入力・期待結果まで分解したもの(本文にあたる)</text>

        <line x1="110" y1="206" x2="110" y2="222" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="320" y1="206" x2="320" y2="222" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />
        <line x1="530" y1="206" x2="530" y2="222" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ar)" />

        <rect x="16" y="226" width="188" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="110" y="245" font-size="9" text-anchor="middle" class="muted">そのままテスト名になる</text>
        <rect x="226" y="226" width="188" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="320" y="245" font-size="9" text-anchor="middle" class="muted">そのままテスト名になる</text>
        <rect x="436" y="226" width="188" height="30" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.1" />
        <text x="530" y="245" font-size="9" text-anchor="middle" class="muted">そのままテスト名になる</text>

        <line x1="16" y1="276" x2="624" y2="276" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="296" font-size="10.5" class="muted">1つの観点から複数の項目が生まれるのが普通。観点の数と項目の数は一致しない。</text>
        <text x="16" y="316" font-size="10.5" class="accent">観点表・項目表・テスト名が同じ言葉で繋がっていれば、後から辿れる。</text>
      </svg>
    </div>
  </body>
</html>
