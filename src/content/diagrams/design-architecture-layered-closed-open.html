<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 300" role="img" aria-label="閉じたレイヤーと開いたレイヤーの違いを示した図。左の閉じたレイヤーでは、プレゼンテーション層・ビジネス層・永続化層・データベース層が縦に並び、矢印は必ず隣接する層の間だけを通る。右の開いたレイヤーでは、共通ロジックの層を飛び越えてビジネス層から永続化層へ直接向かう矢印があり、素通りを避けられる代わりに層をまたぐ依存が生まれる。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="600">閉じたレイヤー</text>
        <text x="165" y="46" text-anchor="middle" font-size="10.5" class="muted">隣接する層としか話さない</text>

        <rect x="45" y="60" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="84" text-anchor="middle" font-size="11">プレゼンテーション層</text>
        <line x1="165" y1="98" x2="165" y2="112" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="45" y="116" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="140" text-anchor="middle" font-size="11">ビジネス層</text>
        <line x1="165" y1="154" x2="165" y2="168" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="45" y="172" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="196" text-anchor="middle" font-size="11">永続化層</text>
        <line x1="165" y1="210" x2="165" y2="224" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="45" y="228" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="165" y="252" text-anchor="middle" font-size="11">データベース層</text>

        <line x1="345" y1="30" x2="345" y2="280" stroke="var(--border)" stroke-width="1.2" />

        <text x="510" y="26" text-anchor="middle" font-size="12.5" font-weight="600">開いたレイヤー</text>
        <text x="510" y="46" text-anchor="middle" font-size="10.5" class="muted">素通りする層は飛び越えを許す</text>

        <rect x="390" y="60" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="84" text-anchor="middle" font-size="11">プレゼンテーション層</text>
        <line x1="510" y1="98" x2="510" y2="112" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)" />
        <rect x="390" y="116" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="140" text-anchor="middle" font-size="11">ビジネス層</text>
        <rect x="390" y="172" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="510" y="196" text-anchor="middle" font-size="11" class="muted">共通ロジック層(素通り)</text>
        <rect x="390" y="228" width="240" height="38" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="510" y="252" text-anchor="middle" font-size="11">永続化層</text>

        <path d="M646,140 C672,140 672,240 646,247" fill="none" stroke="var(--primary)" stroke-width="1.4" marker-end="url(#arrowHi)" />
        <text x="596" y="222" font-size="10" class="hi">飛び越え</text>

        <text x="330" y="292" text-anchor="middle" font-size="11" class="muted">
          何往復もするだけの「素通りレイヤー」が増えると、分けた意味より冗長さが勝つ
        </text>
      </svg>
    </div>
  </body>
</html>
