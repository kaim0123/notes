<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 420"
        role="img"
        aria-label="無線LANアーキテクチャの図解。自律型APは各APが個別に設定を持ち、変更のたびに1台ずつ設定が必要になる。集中管理型ではWLC(コントローラ)がCAPWAPトンネルで各Lightweight APを一括管理し、設定はWLCで変更するだけで全APに自動配布される。"
      >
        <!-- ============ 自律型AP ============ -->
        <text x="350" y="18" text-anchor="middle" font-size="13" font-weight="700">
          自律型AP ― 各APが個別に設定を持つ
        </text>

        <rect x="60" y="60" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="82" text-anchor="middle" font-size="12" font-weight="600">AP1</text>
        <text x="135" y="98" text-anchor="middle" font-size="9.5" class="muted">個別設定</text>

        <rect x="275" y="60" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="82" text-anchor="middle" font-size="12" font-weight="600">AP2</text>
        <text x="350" y="98" text-anchor="middle" font-size="9.5" class="muted">個別設定</text>

        <rect x="490" y="60" width="150" height="50" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="565" y="82" text-anchor="middle" font-size="12" font-weight="600">AP3</text>
        <text x="565" y="98" text-anchor="middle" font-size="9.5" class="muted">個別設定</text>

        <text x="350" y="150" text-anchor="middle" font-size="11.5" class="muted">
          各APが独立して動作する ― 設定変更のたびに1台ずつログインして変更が必要
        </text>

        <line x1="0" y1="180" x2="700" y2="180" stroke="var(--border)" stroke-width="1" />

        <!-- ============ 集中管理型 ============ -->
        <text x="350" y="208" text-anchor="middle" font-size="13" font-weight="700">
          集中管理型(WLC) ― コントローラが一括管理
        </text>

        <rect x="280" y="245" width="140" height="50" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="350" y="275" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--primary)">WLC</text>

        <rect x="60" y="335" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="135" y="362" text-anchor="middle" font-size="11.5">Lightweight AP1</text>

        <rect x="275" y="335" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="362" text-anchor="middle" font-size="11.5">Lightweight AP2</text>

        <rect x="490" y="335" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" />
        <text x="565" y="362" text-anchor="middle" font-size="11.5">Lightweight AP3</text>

        <line x1="320" y1="295" x2="150" y2="335" stroke="var(--primary)" stroke-width="1.5" />
        <line x1="350" y1="295" x2="350" y2="335" stroke="var(--primary)" stroke-width="1.5" />
        <line x1="380" y1="295" x2="550" y2="335" stroke="var(--primary)" stroke-width="1.5" />
        <text x="350" y="320" text-anchor="middle" font-size="10" style="fill: var(--primary)">CAPWAPトンネル</text>

        <text x="350" y="405" text-anchor="middle" font-size="11.5" style="fill: var(--primary)">
          設定はWLCで一括変更 ― 全APへ自動的に配布される
        </text>
      </svg>
    </div>
  </body>
</html>
