<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="あいまいな要求を、テストで判定できる要件に変換する流れを示した図。左には関係者から出てくるあいまいな言葉が並ぶ。速いこと、落ちないこと、安全であること、使いやすいこと。これらはそのままでは合否を判定できない。中央の変換では、いつ・どの操作が・どれだけという3点を数値で埋める。右には変換後の要件が並ぶ。ピーク時に検索の応答が3秒以内であること、月間の停止時間が1時間以内であること、個人情報が保存時と通信時に暗号化されていること、主要な操作が3クリック以内で完了すること。変換後は、テストで合否を判定できる形になっている。数値が決まらない要件は、合意されていない要件と同じ。"
      >
        <defs>
          <marker id="arrq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11.5" class="muted">関係者から出てくる言葉</text>
        <text x="624" y="26" text-anchor="end" font-size="11.5" class="lbl">テストで判定できる要件</text>

        <rect x="16" y="38" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="58" text-anchor="middle" font-size="11.5" class="muted">速いこと</text>
        <rect x="16" y="78" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="98" text-anchor="middle" font-size="11.5" class="muted">落ちないこと</text>
        <rect x="16" y="118" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="138" text-anchor="middle" font-size="11.5" class="muted">安全であること</text>
        <rect x="16" y="158" width="150" height="30" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.3" />
        <text x="91" y="178" text-anchor="middle" font-size="11.5" class="muted">使いやすいこと</text>

        <line x1="166" y1="113" x2="204" y2="113" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrq)" />

        <rect x="210" y="60" width="130" height="106" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="275" y="84" text-anchor="middle" font-size="11.5" font-weight="600">数値で埋める</text>
        <text x="275" y="106" text-anchor="middle" font-size="10.5" class="muted">いつ(条件)</text>
        <text x="275" y="124" text-anchor="middle" font-size="10.5" class="muted">どの操作が</text>
        <text x="275" y="142" text-anchor="middle" font-size="10.5" class="muted">どれだけ(基準)</text>

        <line x1="340" y1="113" x2="378" y2="113" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrq)" />

        <rect x="384" y="38" width="240" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="504" y="58" text-anchor="middle" font-size="11">ピーク時、検索の応答が3秒以内</text>
        <rect x="384" y="78" width="240" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="504" y="98" text-anchor="middle" font-size="11">月間の停止時間が1時間以内</text>
        <rect x="384" y="118" width="240" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="504" y="138" text-anchor="middle" font-size="11">個人情報を保存時・通信時に暗号化</text>
        <rect x="384" y="158" width="240" height="30" rx="5" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="504" y="178" text-anchor="middle" font-size="11">主要な操作が3クリック以内で完了</text>

        <line x1="16" y1="212" x2="624" y2="212" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="236" font-size="11" class="muted">左のままでは、完成したかどうかを誰も判定できない ― 受け入れの場で必ずもめる</text>
        <text x="16" y="256" font-size="11" class="lbl">数値が決まらない要件は、合意されていない要件と同じ</text>
      </svg>
    </div>
  </body>
</html>
