<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .hi {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg viewBox="0 0 660 280" role="img" aria-label="ファイル名と主要exportの対応を示した図。左は対応が取れている例で、ContactForm.tsxを開くとContactFormが定義されており、名前で検索すればファイルにたどり着ける。右は崩れている例で、utils.tsxの中にContactFormとFaqAccordionとformatDateが同居しており、名前で検索してもファイル名からは中身が推測できない。1ファイル1主役という原則が、検索とジャンプでコードを追えるかどうかを決める。">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>
        <text x="330" y="26" text-anchor="middle" font-size="11.5" class="muted">ファイル名は、開く前に中身を推測する唯一の手がかり</text>

        <text x="165" y="58" text-anchor="middle" font-size="12" font-weight="600">対応が取れている</text>
        <rect x="30" y="72" width="270" height="120" rx="9" fill="var(--card)" stroke="var(--primary)" stroke-width="1.8" />
        <text x="52" y="98" font-size="10.5" class="mono hi">ContactForm.tsx</text>
        <line x1="52" y1="108" x2="278" y2="108" stroke="var(--border)" stroke-width="1.2" />
        <text x="52" y="130" font-size="10" class="mono">export function ContactForm</text>
        <text x="52" y="152" font-size="9.5" class="muted">(補助の型やヘルパーは同居してよい)</text>
        <text x="52" y="176" font-size="9.5" class="muted">主役として名前を挙げるものが1つ</text>

        <text x="165" y="222" text-anchor="middle" font-size="10.5" class="muted">名前で検索すれば、</text>
        <text x="165" y="240" text-anchor="middle" font-size="10.5" class="muted">ファイルにたどり着ける</text>

        <line x1="330" y1="46" x2="330" y2="260" stroke="var(--border)" stroke-width="1.2" />

        <text x="495" y="58" text-anchor="middle" font-size="12" font-weight="600">崩れている</text>
        <rect x="360" y="72" width="270" height="120" rx="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="382" y="98" font-size="10.5" class="mono muted">utils.tsx</text>
        <line x1="382" y1="108" x2="608" y2="108" stroke="var(--border)" stroke-width="1.2" />
        <text x="382" y="130" font-size="10" class="mono muted">export function ContactForm</text>
        <text x="382" y="150" font-size="10" class="mono muted">export function FaqAccordion</text>
        <text x="382" y="170" font-size="10" class="mono muted">export function formatDate</text>

        <text x="495" y="222" text-anchor="middle" font-size="10.5" class="muted">ファイル名から中身が推測できず、</text>
        <text x="495" y="240" text-anchor="middle" font-size="10.5" class="muted">置き場所の判断も毎回ぶれる</text>
      </svg>
    </div>
  </body>
</html>
