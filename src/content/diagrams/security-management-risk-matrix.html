<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 336"
        role="img"
        aria-label="リスク対応の4つの選択肢を、発生確率と影響度の2軸のマトリクスに配置した図。縦軸は発生確率、横軸は影響度。左上の、起こりやすいが影響が小さい区画はリスク低減で、対策を打って発生確率そのものを下げる。右上の、起こりやすく影響も大きい区画はリスク回避で、そもそもその機能やサービスを持たないという判断になる。左下の、めったに起きず影響も小さい区画はリスク保有で、許容範囲として受け入れる。右下の、めったに起きないが起きれば影響が大きい区画はリスク移転で、保険や外部委託によって影響を第三者へ移す。どの区画に置くかは費用対効果で決まる。"
      >
        <rect x="120" y="60" width="240" height="95" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="360" y="60" width="240" height="95" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <rect x="120" y="155" width="240" height="95" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <rect x="360" y="155" width="240" height="95" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />

        <text x="240" y="100" font-size="13" text-anchor="middle">リスク低減</text>
        <text x="240" y="122" font-size="9.5" text-anchor="middle" class="muted">起きる確率そのものを下げる</text>
        <text x="240" y="140" font-size="9.5" text-anchor="middle" class="muted">暗号化・多要素認証・教育</text>

        <text x="480" y="100" font-size="13" text-anchor="middle" class="accent">リスク回避</text>
        <text x="480" y="122" font-size="9.5" text-anchor="middle" class="muted">その機能を持たない</text>
        <text x="480" y="140" font-size="9.5" text-anchor="middle" class="muted">危ない預かり方をやめる</text>

        <text x="240" y="195" font-size="13" text-anchor="middle">リスク保有</text>
        <text x="240" y="217" font-size="9.5" text-anchor="middle" class="muted">許容範囲として受け入れる</text>
        <text x="240" y="235" font-size="9.5" text-anchor="middle" class="muted">対策コストが見合わない</text>

        <text x="480" y="195" font-size="13" text-anchor="middle">リスク移転</text>
        <text x="480" y="217" font-size="9.5" text-anchor="middle" class="muted">影響を第三者へ移す</text>
        <text x="480" y="235" font-size="9.5" text-anchor="middle" class="muted">サイバー保険・外部委託</text>

        <text x="112" y="104" font-size="10" text-anchor="end" class="muted">確率:高</text>
        <text x="112" y="199" font-size="10" text-anchor="end" class="muted">確率:低</text>
        <text x="240" y="270" font-size="10" text-anchor="middle" class="muted">影響度:小</text>
        <text x="480" y="270" font-size="10" text-anchor="middle" class="muted">影響度:大</text>

        <line x1="16" y1="288" x2="624" y2="288" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="310" font-size="10.5" class="muted">すべてを低減で片づけようとすると、対策のコストが守るものの価値を追い越す。だから4つに分ける。</text>
        <text x="16" y="330" font-size="10.5" class="accent">回避だけが「そもそもやらない」の側 ― 機能を落とす判断も、立派なリスク対応。</text>
      </svg>
    </div>
  </body>
</html>
