<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="リクエストが通る経路上に並ぶキャッシュを示した図。左のブラウザから右のデータベースへ向かって、段階ごとにキャッシュが並ぶ。1つ目はブラウザキャッシュで、これは利用者ごとの専用。2つ目はDNSの解決結果のキャッシュ。3つ目はCDNやプロキシで、ここから先は複数の利用者で共有される。4つ目はサーバー側のアプリケーションキャッシュで、これも共有。5つ目はデータベース内部のバッファプールで、これも共有。右へ行くほど、応答までの距離と時間が長くなる。したがって、できるだけ左で返せたほうが速い。一方で、右へ行くほど共有の度合いが上がるため、個人向けの応答を共有キャッシュに乗せると他人に配信される事故になる。専用と共有の境目がどこにあるかが、キャッシュ設計で最も重要な線になる。"
      >
        <defs>
          <marker id="arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="11.5" class="lbl">利用者ごとの専用</text>
        <text x="624" y="26" text-anchor="end" font-size="11.5" class="muted">複数の利用者で共有</text>
        <line x1="16" y1="34" x2="216" y2="34" stroke="var(--primary)" stroke-width="1.4" />
        <line x1="240" y1="34" x2="624" y2="34" stroke="var(--muted)" stroke-width="1.4" />

        <rect x="16" y="48" width="100" height="70" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="66" y="72" text-anchor="middle" font-size="11">ブラウザ</text>
        <text x="66" y="92" text-anchor="middle" font-size="10" class="muted">画像・CSS・JS</text>
        <text x="66" y="108" text-anchor="middle" font-size="10" class="muted">を保存</text>

        <rect x="128" y="48" width="88" height="70" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="172" y="72" text-anchor="middle" font-size="11">DNS</text>
        <text x="172" y="92" text-anchor="middle" font-size="10" class="muted">名前からIPへの</text>
        <text x="172" y="108" text-anchor="middle" font-size="10" class="muted">変換結果</text>

        <rect x="240" y="48" width="112" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="296" y="72" text-anchor="middle" font-size="11" class="muted">CDN・プロキシ</text>
        <text x="296" y="92" text-anchor="middle" font-size="10" class="muted">利用者の手前で</text>
        <text x="296" y="108" text-anchor="middle" font-size="10" class="muted">応答を返す</text>

        <rect x="376" y="48" width="112" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="432" y="72" text-anchor="middle" font-size="11" class="muted">アプリ</text>
        <text x="432" y="92" text-anchor="middle" font-size="10" class="muted">組み立てた結果を</text>
        <text x="432" y="108" text-anchor="middle" font-size="10" class="muted">次回に使い回す</text>

        <rect x="512" y="48" width="112" height="70" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="568" y="72" text-anchor="middle" font-size="11" class="muted">データベース</text>
        <text x="568" y="92" text-anchor="middle" font-size="10" class="muted">よく読む行を</text>
        <text x="568" y="108" text-anchor="middle" font-size="10" class="muted">メモリに置く</text>

        <line x1="116" y1="83" x2="126" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arch)" />
        <line x1="216" y1="83" x2="238" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arch)" />
        <line x1="352" y1="83" x2="374" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arch)" />
        <line x1="488" y1="83" x2="510" y2="83" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arch)" />

        <line x1="16" y1="146" x2="600" y2="146" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arch)" />
        <text x="624" y="150" text-anchor="end" font-size="10.5" class="muted">遠い・遅い</text>
        <text x="16" y="168" font-size="11" class="muted">左で返せるほど速い ― どこまで手前で止められるかが設計の勘所</text>

        <line x1="16" y1="192" x2="624" y2="192" stroke="var(--border)" stroke-width="1" />

        <rect x="16" y="206" width="288" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="160" y="228" text-anchor="middle" font-size="11.5">専用キャッシュ</text>
        <text x="160" y="250" text-anchor="middle" font-size="10.5" class="muted">個人向けの応答を置いてよい</text>

        <rect x="336" y="206" width="288" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="480" y="228" text-anchor="middle" font-size="11.5" class="muted">共有キャッシュ</text>
        <text x="480" y="250" text-anchor="middle" font-size="10.5" class="lbl">個人向けの応答を置くと他人に配信される</text>

        <text x="16" y="290" font-size="11" class="lbl">専用と共有の境目がどこにあるか ― これがキャッシュ設計で最も重要な線</text>
      </svg>
    </div>
  </body>
</html>
