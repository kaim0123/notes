<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 330"
        role="img"
        aria-label="テストダブルの5種類を、3つの性質で並べて比べた表形式の図。性質は、決まった値を返すか、呼ばれ方そのものを検証するか、実装として動くか、の3つ。ダミーはどれにも当てはまらず、引数を埋めるためだけに渡す。スタブは決まった値を返すだけで、この条件のときの分岐を試したいときに使う。スパイは呼ばれ方を記録し、本物を動かしたまま呼び出しの有無を後から確認したいときに使う。モックは値を返しつつ呼ばれ方も検証し、通知を1度だけ送るというように相互作用そのものが仕様のときに使う。フェイクは値を返し実装としても動く簡易版で、本物は重いが振る舞いが必要なときに使う。実務で最もよく使うのはスタブとフェイクであり、モックは強力だがどう呼ばれるかを固定するため実装の変更に弱くなる、と図の下部に記されている。"
      >
        <text x="16" y="26" font-size="11" class="muted">ひとくちに「モック」と呼ばれがちだが、目的で5つに分かれる</text>

        <text x="225" y="60" font-size="9" text-anchor="middle" class="muted">値を返す</text>
        <text x="335" y="60" font-size="9" text-anchor="middle" class="muted">呼ばれ方を見る</text>
        <text x="435" y="60" font-size="9" text-anchor="middle" class="muted">実装として動く</text>
        <text x="494" y="60" font-size="9" class="muted">使う場面</text>
        <line x1="16" y1="68" x2="684" y2="68" stroke="var(--border)" stroke-width="1" />

        <rect x="16" y="74" width="150" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="98" font-size="10" class="muted">ダミー</text>
        <text x="225" y="98" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="335" y="98" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="435" y="98" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="494" y="98" font-size="9" class="muted">引数を埋めるためだけに渡す</text>

        <rect x="16" y="118" width="150" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="30" y="142" font-size="10" class="accent">スタブ</text>
        <circle cx="225" cy="138" r="4.5" fill="var(--primary)" />
        <text x="335" y="142" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="435" y="142" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="494" y="142" font-size="9" class="muted">この条件のときの分岐を試す</text>

        <rect x="16" y="162" width="150" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="186" font-size="10" class="muted">スパイ</text>
        <text x="225" y="186" font-size="11" text-anchor="middle" class="muted">―</text>
        <circle cx="335" cy="182" r="4.5" fill="var(--muted)" />
        <circle cx="435" cy="182" r="4.5" fill="var(--muted)" />
        <text x="494" y="186" font-size="9" class="muted">本物を動かしたまま履歴を残す</text>

        <rect x="16" y="206" width="150" height="38" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="230" font-size="10" class="muted">モック</text>
        <circle cx="225" cy="226" r="4.5" fill="var(--muted)" />
        <circle cx="335" cy="226" r="4.5" fill="var(--muted)" />
        <text x="435" y="230" font-size="11" text-anchor="middle" class="muted">―</text>
        <text x="494" y="230" font-size="9" class="muted">相互作用そのものが仕様のとき</text>

        <rect x="16" y="250" width="150" height="38" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="30" y="274" font-size="10" class="accent">フェイク</text>
        <circle cx="225" cy="270" r="4.5" fill="var(--primary)" />
        <text x="335" y="274" font-size="11" text-anchor="middle" class="muted">―</text>
        <circle cx="435" cy="270" r="4.5" fill="var(--primary)" />
        <text x="494" y="274" font-size="9" class="muted">本物は重いが、振る舞いは要る</text>

        <line x1="16" y1="302" x2="684" y2="302" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="322" font-size="10.5" class="accent">実務で最もよく使うのはスタブとフェイク。モックは「どう呼ばれるか」を固定するため、実装の変更に弱い。</text>
      </svg>
    </div>
  </body>
</html>
