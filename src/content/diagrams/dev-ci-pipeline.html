<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .muted {
        fill: var(--muted);
      }
      .lbl {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 640 300"
        role="img"
        aria-label="CIパイプラインの段階と、成果物の昇格を示した図。上段は検査の並びで、左から順に整形とlintが数秒、型検査が十数秒、Unitテストが数十秒、結合テストが数分、ビルドが数分と、速くて安いものから遅くて高いものへ並ぶ。早い段階で落ちれば後続の時間を使わずに済むため、落ちる可能性が高いものほど前に置く。全体で10分以内に収めないと、結果が読まれなくなる。下段は成果物の扱いで、ビルドは1度だけ行い、できた同じ成果物に対して検証環境、本番環境とタグを付け替えて進めていく。環境ごとにビルドし直すと、検証したものと本番に出すものが別物になってしまう。環境ごとの違いはビルド時ではなく実行時の設定で吸収する。"
      >
        <defs>
          <marker id="arci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="26" font-size="12" class="lbl">検査は、速くて安いものを先に</text>

        <rect x="16" y="38" width="112" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="72" y="60" text-anchor="middle" font-size="11">整形 / lint</text>
        <text x="72" y="78" text-anchor="middle" font-size="10.5" class="muted">数秒</text>

        <rect x="140" y="38" width="112" height="52" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5" />
        <text x="196" y="60" text-anchor="middle" font-size="11">型検査</text>
        <text x="196" y="78" text-anchor="middle" font-size="10.5" class="muted">十数秒</text>

        <rect x="264" y="38" width="112" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="320" y="60" text-anchor="middle" font-size="11">Unitテスト</text>
        <text x="320" y="78" text-anchor="middle" font-size="10.5" class="muted">数十秒</text>

        <rect x="388" y="38" width="112" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="444" y="60" text-anchor="middle" font-size="11">結合テスト</text>
        <text x="444" y="78" text-anchor="middle" font-size="10.5" class="muted">数分</text>

        <rect x="512" y="38" width="112" height="52" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="568" y="60" text-anchor="middle" font-size="11">ビルド</text>
        <text x="568" y="78" text-anchor="middle" font-size="10.5" class="muted">数分</text>

        <line x1="128" y1="64" x2="136" y2="64" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arci)" />
        <line x1="252" y1="64" x2="260" y2="64" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arci)" />
        <line x1="376" y1="64" x2="384" y2="64" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arci)" />
        <line x1="500" y1="64" x2="508" y2="64" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arci)" />

        <text x="16" y="112" font-size="11" class="muted">早い段階で落ちれば後続の時間を使わずに済む ― 落ちる可能性が高いものほど前に置く</text>
        <text x="16" y="130" font-size="11" class="lbl">全体で10分以内に収めないと、結果が読まれなくなる</text>

        <line x1="16" y1="150" x2="624" y2="150" stroke="var(--border)" stroke-width="1" />

        <text x="16" y="176" font-size="12" class="lbl">ビルドは1度だけ ― 同じ成果物を昇格させる</text>

        <rect x="16" y="190" width="150" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="91" y="214" text-anchor="middle" font-size="11.5">成果物</text>
        <text x="91" y="234" text-anchor="middle" font-size="10.5" class="muted">1度だけビルド</text>

        <line x1="166" y1="220" x2="196" y2="220" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arci)" />
        <rect x="202" y="190" width="128" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="266" y="214" text-anchor="middle" font-size="11.5" class="muted">開発</text>
        <text x="266" y="234" text-anchor="middle" font-size="10.5" class="muted">同じ成果物</text>

        <line x1="330" y1="220" x2="360" y2="220" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arci)" />
        <rect x="366" y="190" width="128" height="60" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.4" />
        <text x="430" y="214" text-anchor="middle" font-size="11.5" class="muted">検証</text>
        <text x="430" y="234" text-anchor="middle" font-size="10.5" class="muted">同じ成果物</text>

        <line x1="494" y1="220" x2="524" y2="220" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arci)" />
        <rect x="530" y="190" width="94" height="60" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.6" />
        <text x="577" y="214" text-anchor="middle" font-size="11.5">本番</text>
        <text x="577" y="234" text-anchor="middle" font-size="10.5" class="muted">同じ成果物</text>

        <text x="16" y="276" font-size="11" class="muted">環境ごとにビルドし直すと、検証したものと本番に出すものが別物になる</text>
        <text x="16" y="292" font-size="11" class="lbl">環境ごとの違いは、ビルド時ではなく実行時の設定で吸収する</text>
      </svg>
    </div>
  </body>
</html>
