<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 300"
        role="img"
        aria-label="Google Cloudのリソース階層を示した図。最上位に会社のドメインに紐づくOrganizationがあり、その下に部門や環境で分けるFolderを任意の深さで置ける。実際のリソースが属するのはProjectで、請求先・IAMの権限・APIの有効化はすべてこのProject単位で決まる。VMやバケットといったリソースはProjectの中に作られ、別のProjectからは既定では見えない。AWSがアカウントとリージョンで区切るのに対し、Google Cloudでは請求と権限の入口がプロジェクトにある点が構造上の違いになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="250" y="30" width="200" height="42" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="350" y="48" font-size="11.5" text-anchor="middle">Organization</text>
        <text x="350" y="64" font-size="9.5" text-anchor="middle" class="muted">会社のドメインに紐づく最上位</text>

        <line x1="350" y1="72" x2="350" y2="88" stroke="var(--muted)" />
        <line x1="180" y1="88" x2="520" y2="88" stroke="var(--muted)" />
        <line x1="180" y1="88" x2="180" y2="104" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="88" x2="520" y2="104" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="100" y="108" width="160" height="38" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="180" y="126" font-size="11" text-anchor="middle">Folder(本番)</text>
        <text x="180" y="140" font-size="9" text-anchor="middle" class="muted">任意・省略できる</text>
        <rect x="440" y="108" width="160" height="38" rx="8" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="126" font-size="11" text-anchor="middle">Folder(開発)</text>
        <text x="520" y="140" font-size="9" text-anchor="middle" class="muted">部門・環境で分ける</text>

        <line x1="180" y1="146" x2="180" y2="168" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="146" x2="520" y2="168" stroke="var(--muted)" marker-end="url(#ar)" />

        <rect x="90" y="172" width="180" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="180" y="194" font-size="11.5" text-anchor="middle">Project</text>
        <text x="180" y="210" font-size="9.5" text-anchor="middle" class="accent">請求・IAM・APIの有効化</text>
        <text x="180" y="224" font-size="9.5" text-anchor="middle" class="muted">はすべてこの単位</text>

        <rect x="430" y="172" width="180" height="58" rx="8" fill="var(--card)" stroke="var(--primary)" />
        <text x="520" y="194" font-size="11.5" text-anchor="middle">Project</text>
        <text x="520" y="210" font-size="9.5" text-anchor="middle" class="accent">請求・IAM・APIの有効化</text>
        <text x="520" y="224" font-size="9.5" text-anchor="middle" class="muted">はすべてこの単位</text>

        <line x1="180" y1="230" x2="180" y2="248" stroke="var(--muted)" marker-end="url(#ar)" />
        <line x1="520" y1="230" x2="520" y2="248" stroke="var(--muted)" marker-end="url(#ar)" />
        <rect x="90" y="252" width="180" height="32" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="180" y="272" font-size="10" text-anchor="middle" class="muted">VM・バケット・DB</text>
        <rect x="430" y="252" width="180" height="32" rx="6" fill="var(--card)" stroke="var(--border)" />
        <text x="520" y="272" font-size="10" text-anchor="middle" class="muted">VM・バケット・DB</text>

        <text x="316" y="270" font-size="10" text-anchor="middle" class="muted">別プロジェクトの</text>
        <text x="316" y="284" font-size="10" text-anchor="middle" class="muted">リソースは既定で見えない</text>
      </svg>
    </div>
  </body>
</html>
