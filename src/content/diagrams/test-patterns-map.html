<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 700 340"
        role="img"
        aria-label="テストコードを書くときの定石が、テストのどの部分に効くのかを対応させた図。1つ目は入力データを用意する部分で、テストデータビルダーが必要な項目だけを上書きしながら段階的に組み立て、オブジェクトマザーがよく使う典型的なデータに名前を付けて再利用できるようにする。2つ目は前準備と後始末の部分で、フィクスチャが依存する既知の状態を用意し、ティアダウンが残骸を消す。3つ目は期待値を作る部分で、ゴールデンマスターすなわちスナップショットテストが最初の実行結果を正解として保存し、以降は差分だけを見る。4つ目は外部との境界で、契約テストが提供側と利用側の期待のずれを検出する。5つ目は件数と多様性を増やす部分で、パラメータ化テストが入力と期待値の組だけを差し替えて同じ検証を繰り返し、プロパティベーステストがどんな入力でも成り立つはずの性質を定義してランダムな入力で反証を試みる。定石を覚えること自体に価値はなく、テストのどこが苦しいかに応じて選べることに価値がある。"
      >
        <text x="16" y="26" font-size="11" class="muted">テストのどこが苦しいかに応じて、選ぶ</text>

        <rect x="16" y="40" width="180" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="70" font-size="10" class="muted">入力データを用意する</text>
        <rect x="206" y="40" width="478" height="48" rx="6" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="220" y="62" font-size="10" class="accent">Test Data Builder / Object Mother</text>
        <text x="220" y="80" font-size="9" class="muted">必要な項目だけ上書きする生成器 / 典型的なデータに名前を付けて再利用する</text>

        <rect x="16" y="94" width="180" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="124" font-size="10" class="muted">前準備と後始末</text>
        <rect x="206" y="94" width="478" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="220" y="116" font-size="10">Fixture / Teardown</text>
        <text x="220" y="134" font-size="9" class="muted">依存する既知の状態を用意し、終わったら残骸を消す</text>

        <rect x="16" y="148" width="180" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="178" font-size="10" class="muted">期待値を作る</text>
        <rect x="206" y="148" width="478" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="220" y="170" font-size="10">Golden Master(スナップショット)</text>
        <text x="220" y="188" font-size="9" class="muted">最初の結果を正解として保存し、以降は差分だけを見る</text>

        <rect x="16" y="202" width="180" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="232" font-size="10" class="muted">外部との境界</text>
        <rect x="206" y="202" width="478" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="220" y="224" font-size="10">Contract Testing</text>
        <text x="220" y="242" font-size="9" class="muted">提供側と利用側の期待のずれを、本番より前に検出する</text>

        <rect x="16" y="256" width="180" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="30" y="286" font-size="10" class="muted">件数と多様性を増やす</text>
        <rect x="206" y="256" width="478" height="48" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="220" y="278" font-size="10">Parameterized Test / Property-based Testing</text>
        <text x="220" y="296" font-size="9" class="muted">入力と期待値の組だけ差し替える / 成り立つはずの性質を定義し反証を試みる</text>

        <text x="16" y="330" font-size="10.5" class="muted">定石を覚えること自体に価値はない。苦しい箇所に名前が付いていると、対処を選べるようになる。</text>
      </svg>
    </div>
  </body>
</html>
