<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 280"
        role="img"
        aria-label="コンテンツを更新する体制を、誰が書くかで3つに分けた図。開発者だけが更新する場合は、コードと同じ流れに乗せてしまうのが最も単純で、レビューも履歴もそのまま使える。書く人が開発者以外にもいる場合は、管理画面から編集して公開できる仕組みが要るが、公開前に確認する場所と、誰が公開してよいかの区別を用意する必要がある。外部の書き手を含む場合は、下書きと公開の分離に加えて、権限を役割ごとに分ける仕組みが必須になる。体制が先で、道具は後 ― 誰が書くのかを決めないまま道具を選ぶと、使われないか、事故が起きるかのどちらかになる。"
      >
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
        </defs>

        <rect x="20" y="46" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--primary)" />
        <text x="135" y="72" font-size="11.5" text-anchor="middle">開発者だけが書く</text>
        <rect x="40" y="88" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="135" y="108" font-size="9.5" text-anchor="middle" class="muted">コードと同じ流れに乗せる</text>
        <rect x="40" y="124" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="135" y="144" font-size="9.5" text-anchor="middle" class="muted">レビューも履歴もそのまま使える</text>
        <text x="135" y="180" font-size="10" text-anchor="middle" class="accent">いちばん単純</text>
        <text x="135" y="204" font-size="9" text-anchor="middle" class="muted">書ける人が限られるのが弱点</text>

        <rect x="265" y="46" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="380" y="72" font-size="11.5" text-anchor="middle">社内の非開発者も書く</text>
        <rect x="285" y="88" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="380" y="108" font-size="9.5" text-anchor="middle" class="muted">管理画面から編集して公開</text>
        <rect x="285" y="124" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="380" y="144" font-size="9.5" text-anchor="middle" class="muted">公開前に確認する場所が要る</text>
        <text x="380" y="180" font-size="10" text-anchor="middle" class="accent">誰が公開してよいかを分ける</text>
        <text x="380" y="204" font-size="9" text-anchor="middle" class="muted">下書きと公開を分離する</text>

        <rect x="510" y="46" width="230" height="180" rx="10" fill="var(--card)" stroke="var(--border)" />
        <text x="625" y="72" font-size="11.5" text-anchor="middle">外部の書き手も含む</text>
        <rect x="530" y="88" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="625" y="108" font-size="9.5" text-anchor="middle" class="muted">役割ごとに権限を分ける</text>
        <rect x="530" y="124" width="190" height="30" rx="6" fill="none" stroke="var(--border)" />
        <text x="625" y="144" font-size="9.5" text-anchor="middle" class="muted">承認を経て公開する</text>
        <text x="625" y="180" font-size="10" text-anchor="middle" class="accent">権限の設計が必須になる</text>
        <text x="625" y="204" font-size="9" text-anchor="middle" class="muted">誤公開の影響も大きくなる</text>

        <text x="20" y="262" font-size="10.5" class="muted">体制が先、道具は後 ― 誰が書くのかを決めないまま選ぶと、使われないか事故が起きるかになる。</text>
      </svg>
    </div>
  </body>
</html>
