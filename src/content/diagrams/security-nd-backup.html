<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: oklch(0 0 0);
        --fg: oklch(1 0 0);
        --card: oklch(0.12 0 0);
        --muted: oklch(0.7 0 0);
        --border: oklch(1 0 0 / 14%);
        --primary: oklch(0.85 0.29 142);
        --primary-fg: oklch(0 0 0);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      svg text {
        fill: var(--fg);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .muted {
        fill: var(--muted);
      }
      .accent {
        fill: var(--primary);
      }
    </style>
  </head>
  <body>
    <div style="width: 100%">
      <svg
        viewBox="0 0 760 300"
        role="img"
        aria-label="ランサムウェアに対してバックアップが役に立つ場合と立たない場合を比べた図。上は、常時つながった共有フォルダやネットワークストレージにバックアップを置いている場合で、感染した端末から到達できるため、本番データと一緒にバックアップまで暗号化されてしまう。取ってはいたが戻せない、という状態になる。下は、書き換えのできない保管や、切り離された媒体に世代を分けて置いている場合で、感染した端末からは到達できないため、暗号化されずに残る。バックアップの価値は取っているかどうかではなく、感染した端末から手が届かないかどうかで決まる。"
      >
        <defs>
          <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)" />
          </marker>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
          </marker>
        </defs>

        <text x="16" y="40" font-size="10.5" class="muted">① 常時つながった保管先に置いている</text>

        <rect x="20" y="54" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="95" y="74" font-size="10" text-anchor="middle" class="accent">感染した端末</text>
        <text x="95" y="91" font-size="8.5" text-anchor="middle" class="muted">暗号化を始める</text>

        <rect x="250" y="54" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="325" y="80" font-size="10" text-anchor="middle" class="accent">本番データ</text>
        <rect x="480" y="54" width="200" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="580" y="74" font-size="10" text-anchor="middle" class="accent">共有フォルダのバックアップ</text>
        <text x="580" y="91" font-size="8.5" text-anchor="middle" class="muted">同じ資格情報で書き込める</text>

        <line x1="174" y1="77" x2="246" y2="77" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <line x1="404" y1="77" x2="476" y2="77" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />
        <text x="16" y="124" font-size="9.5" class="accent">端末から手が届く範囲は、まとめて暗号化される ― 取ってはいたが、戻せない。</text>

        <line x1="16" y1="144" x2="744" y2="144" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

        <text x="16" y="172" font-size="10.5" class="accent">② 手が届かない場所に、世代を分けて置いている</text>

        <rect x="20" y="186" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="95" y="206" font-size="10" text-anchor="middle">感染した端末</text>
        <text x="95" y="223" font-size="8.5" text-anchor="middle" class="muted">暗号化を始める</text>
        <rect x="250" y="186" width="150" height="46" rx="7" fill="var(--card)" stroke="var(--primary)" stroke-width="1.4" />
        <text x="325" y="212" font-size="10" text-anchor="middle" class="accent">本番データ</text>
        <line x1="174" y1="209" x2="246" y2="209" stroke="var(--primary)" stroke-width="1.2" marker-end="url(#arp)" />

        <line x1="430" y1="176" x2="430" y2="248" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
        <text x="430" y="170" font-size="9" text-anchor="middle" class="muted">届かない</text>
        <line x1="404" y1="209" x2="424" y2="209" stroke="var(--primary)" stroke-width="1.2" />
        <line x1="418" y1="202" x2="426" y2="216" stroke="var(--primary)" stroke-width="2" />
        <line x1="418" y1="216" x2="426" y2="202" stroke="var(--primary)" stroke-width="2" />

        <rect x="460" y="186" width="220" height="46" rx="7" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" />
        <text x="570" y="206" font-size="10" text-anchor="middle">書き換え不可・切り離した媒体</text>
        <text x="570" y="223" font-size="8.5" text-anchor="middle" class="muted">世代を分けて残す</text>

        <line x1="16" y1="262" x2="744" y2="262" stroke="var(--border)" stroke-width="1" />
        <text x="16" y="284" font-size="10.5" class="accent">バックアップの価値は「取ったか」ではなく「感染した端末から手が届かないか」で決まる。</text>
      </svg>
    </div>
  </body>
</html>
